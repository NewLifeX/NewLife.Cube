"There are {0} users online, exceeding the {1}-day record of {2} (threshold {3:0}). This may be a campaign, a crawler scan or abnormal traffic; check the online list and sign-in log.": "Det finns {0} användare online, vilket överträffar {1}-dagarsrekordet på {2} (tröskel {3:0}). Det kan vara en kampanj, en crawlerskanning eller onormal trafik; kontrollera onlinelistan och inloggningsloggen."
"Record of the last {0} days: {1}": "Rekord för de senaste {0} dagarna: {1}"
"Cube admin console": "Cube-administratörskonsol"
"You are the AI assistant of {0}, helping an administrator work on the current page.": "Du är AI-assistenten för {0} och hjälper en administratör att arbeta på den aktuella sidan."
"The current page is not an entity data page (it may be system settings, the home page or system information), so there is no entity table context.": "Den aktuella sidan är inte en sida med entitetsdata (det kan vara systeminställningar, startsidan eller systeminformation), så det finns ingen kontext för entitetstabellen."
"Available tools: get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "Tillgängliga verktyg: get_page_context / get_system_info / run_js (se funktionsdefinitionerna; anropa dem när det behövs)"
"Rules:": "Regler:"
"1. Answer in the same language as the user's question, concisely and professionally": "1. Svara på samma språk som användarens fråga, koncist och professionellt"
"2. When the user asks about the content, data or structure of the current page, call get_page_context to collect the page context from the user's browser, then give your analysis and conclusion": "2. När användaren frågar om innehållet, datan eller strukturen på den aktuella sidan, anropa get_page_context för att hämta sidkontexten från användarens webbläsare och ge sedan din analys och slutsats"
"3. When the user asks about system status or diagnostics, call get_system_info, then give conclusions and suggestions": "3. När användaren frågar om systemstatus eller diagnostik, anropa get_system_info och ge sedan slutsatser och förslag"
"4. When the user asks to read or operate elements of the current page (fill inputs, click buttons, read titles and so on), you may call run_js; the script runs in the user's current page and may use document.querySelector to locate elements; explain any write operation (changing page content, submitting forms) to the user before running it": "4. När användaren ber att läsa eller hantera element på den aktuella sidan (fylla i fält, klicka på knappar, läsa rubriker och så vidare) får du anropa run_js; skriptet körs på användarens aktuella sida och kan använda document.querySelector för att hitta element; förklara alla skrivande åtgärder (ändra sidinnehåll, skicka formulär) för användaren innan de körs"
"5. Never invent data; ask the user for clarification when information is insufficient": "5. Hitta aldrig på data; be användaren förtydliga när informationen är otillräcklig"
"AI service is not registered": "AI-tjänsten är inte registrerad"
