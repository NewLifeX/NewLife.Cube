"Data:": "Data:"
"You are a system operations expert. Based on the following runtime metrics, produce a health diagnosis report:\nCover bottlenecks, whether capacity should be expanded, and any risks worth attention.\nOutput the diagnosis report directly without extra explanation.": "Du är expert på systemdrift. Skapa en hälsodiagnosrapport utifrån följande körningsmått:\nTa upp flaskhalsar, om kapaciteten bör utökas och vilka risker som är värda uppmärksamhet.\nSkriv diagnosrapporten direkt utan extra förklaring."
