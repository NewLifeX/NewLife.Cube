"Generated {0} configuration field values (skipped {1}, failed {2}) and filled them into the form. Ask the user to review before submitting.": "{0} konfigurationsfältvärden genererades ({1} överhoppade, {2} misslyckade) och fylldes i formuläret. Be användaren granska innan formuläret skickas."
"The current page is a system configuration form (such as Cube settings); you can help review and fill in configuration items.": "Den aktuella sidan är ett formulär för systemkonfiguration (till exempel Cube-inställningar); du kan hjälpa till att granska och fylla i konfigurationsobjekt."
"Available tools: get_form_schema / fill_form / get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "Tillgängliga verktyg: get_form_schema / fill_form / get_page_context / get_system_info / run_js (se funktionsdefinitionerna; anropa dem när det behövs)"
"2. When the user asks to create, fill in or complete configuration, call get_form_schema first to inspect the items, then call fill_form to generate values (invent reasonable values for empty writable fields, keep existing values unless the user asks otherwise, and never fabricate or modify sensitive settings such as ApiKey/Secret/Token); finally ask the user to review before submitting": "2. När användaren ber att skapa, fylla i eller komplettera konfiguration, anropa först get_form_schema för att granska objekten och sedan fill_form för att generera värden (hitta på rimliga värden för tomma redigerbara fält, behåll befintliga värden om användaren inte begär annat och hitta aldrig på eller ändra känsliga inställningar som ApiKey/Secret/Token); be sedan användaren granska innan formuläret skickas"
"3. When the user asks about the content or current state of the page, call get_page_context, then give your analysis and conclusion": "3. När användaren frågar om sidans innehåll eller aktuella tillstånd, anropa get_page_context och ge sedan din analys och slutsats"
"4. When the user asks about system status or diagnostics, call get_system_info": "4. När användaren frågar om systemstatus eller diagnostik, anropa get_system_info"
"5. When the user asks to read or operate page elements, you may call run_js; explain any write operation (changing page content, submitting forms) to the user before running it": "5. När användaren ber att läsa eller hantera sidelement får du anropa run_js; förklara alla skrivande åtgärder (ändra sidinnehåll, skicka formulär) för användaren innan de körs"
"6. Never invent data; ask the user for clarification when information is insufficient": "6. Hitta aldrig på data; be användaren förtydliga när informationen är otillräcklig"
"The tenant identifier carried by user [{0}] is invalid or unavailable. Check the tenant settings and try again.": "Klientidentifieraren som användaren [{0}] medför är ogiltig eller inte tillgänglig. Kontrollera klientinställningarna och försök igen."
"User [{0}] did not carry a tenant identifier, so the tenant cannot be determined. Include the tenant information and try again.": "Användaren [{0}] medförde ingen klientidentifierare, så klienten kan inte fastställas. Ta med klientinformationen och försök igen."
"User [{0}] is not allowed to access the data of the current tenant. Switch tenant and try again.": "Användaren [{0}] får inte komma åt data för den aktuella klienten. Byt klient och försök igen."
