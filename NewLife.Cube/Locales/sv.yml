# 设置页字段、分类与导航（中文源文经英文规范键翻译）
"Auto (follow system)": "Automatisk (följ systemet)"
"Cancel": "Avbryt"
"Queries {0}, executes {1}, elapsed {2:n0} ms": "Frågor {0}, körningar {1}, förfluten tid {2:n0} ms"
"Show run time": "Visa körtid"
"Avatar directory. Downloads remote avatars locally; defaults to the Avatars subdirectory, or Avatars next to the web root. Empty disables downloading": "Avatarkatalog. Laddar ned fjärravatarbilder lokalt; standard är underkatalogen Avatars, eller Avatars bredvid webbroten. Tomt inaktiverar nedladdning"
"Text avatar characters. Generates an SVG text avatar when no image exists; 1 to 3 characters. Uses the first N Chinese characters to keep the surname, or the initials of English words. Default 2": "Tecken för textavatar. Skapar en SVG-textavatar när ingen bild finns; 1 till 3 tecken. Använder de första N kinesiska tecknen för att behålla efternamnet, eller initialerna i engelska ord. Standard 2"
"Upload directory. Defaults to Uploads": "Uppladdningskatalog. Standard är Uploads"
"Web root directory. Defaults to wwwroot": "Webbrotkatalog. Standard är wwwroot"
"Resource URL. CDN base such as https://sso.newlifex.com/content/; empty uses local resources": "Resurs-URL. CDN-bas som https://sso.newlifex.com/content/; tomt använder lokala resurser"
"CORS origins. Other origins allowed to access this site; * allows any origin": "CORS-ursprung. Andra ursprung som får komma åt den här webbplatsen; * tillåter alla ursprung"
"Iframe embedding. Empty allows the same domain only; SAMEORIGIN allows the same domain and port; ALLOWALL allows any domain": "Iframe-inbäddning. Tomt tillåter endast samma domän; SAMEORIGIN tillåter samma domän och port; ALLOWALL tillåter alla domäner"
"Share expiration. Lifetime of share tokens in seconds, default 7200": "Utgång för delning. Livslängd för delningstoken i sekunder, standard 7200"
"Bot error code. Returns this error for crawlers, such as 404/500; 0 disables blocking": "Felkod för botar. Returnerar det här felet för crawlers, till exempel 404/500; 0 inaktiverar blockering"
"Force redirect. Target scheme and host for GET requests; * is supported in the host. Commonly used to force HTTPS, such as https://*:8081": "Tvingad omdirigering. Målschema och värd för GET-begäranden; * stöds i värden. Används ofta för att tvinga HTTPS, till exempel https://*:8081"
"Security mode. 0: off; 1: observe and log only; 2: block; 3: automatic (default; observes, bans repeated attackers, and temporarily blocks broad attacks with automatic rollback)": "Säkerhetsläge. 0: av; 1: observera och logga endast; 2: blockera; 3: automatiskt (standard; observerar, spärrar återkommande angripare och blockerar breda attacker tillfälligt med automatisk återställning)"
"Auto-ban durations. Comma-separated seconds that increase with each trigger; empty uses 60,300,1800,7200,86400": "Spärrtider för automatisk spärr. Kommaseparerade sekunder som ökar vid varje utlösning; tomt använder 60,300,1800,7200,86400"
"Trusted proxies. Forwarded headers are only trusted from these comma-separated IPs or CIDR ranges; empty keeps the legacy behavior of trusting all forwarded headers": "Betrodda proxyservrar. Vidarebefordrade rubriker betros endast från dessa kommaseparerade IP-adresser eller CIDR-intervall; tomt behåller det gamla beteendet att lita på alla vidarebefordrade rubriker"
"Trusted proxy learning limit. When no trusted proxies are configured, private direct sources that send forwarded headers are learned up to this count; 0 disables learning (typically 2 for one data center, 4 for two)": "Inlärningsgräns för betrodda proxyservrar. När inga betrodda proxyservrar är konfigurerade lärs privata direkta källor som skickar vidarebefordrade rubriker in upp till detta antal; 0 inaktiverar inlärning (vanligtvis 2 för ett datacenter, 4 för två)"
"Learned proxies. Maintained automatically; clear it to reset the learned list": "Inlärda proxyservrar. Underhålls automatiskt; rensa för att återställa den inlärda listan"
"Default role. Defaults to the Normal User role": "Standardroll. Standard är rollen Normal användare"
"Allow password sign-in. Allows signing in with a username and password": "Tillåt inloggning med lösenord. Tillåter inloggning med användarnamn och lösenord"
"Allow plain-text passwords. Default true for legacy clients; false forces Challenge-Response encrypted passwords": "Tillåt klartextlösenord. Standard true för äldre klienter; false tvingar fram Challenge-Response-krypterade lösenord"
"Allow registration. Allows registering with a username and password": "Tillåt registrering. Tillåter registrering med användarnamn och lösenord"
"Auto registration. Default true; after SSO sign-in an unknown local user is registered automatically. Enabled when either the global or the OAuth app setting is on": "Automatisk registrering. Standard true; efter SSO-inloggning registreras en okänd lokal användare automatiskt. Aktiveras när antingen den globala inställningen eller OAuth-appens inställning är på"
"Password complexity check. When enabled the sign-in page validates password strength; when disabled it only requires a non-empty password. Default true": "Kontroll av lösenordskomplexitet. När den är aktiverad validerar inloggningssidan lösenordsstyrkan; när den är inaktiverad krävs bara ett icke-tomt lösenord. Standard true"
"Login failure limit. Bans sign-in after this many consecutive failures for the same user or IP, default 5": "Gräns för misslyckade inloggningar. Spärrar inloggning efter så här många misslyckanden i följd för samma användare eller IP, standard 5"
"Login ban duration. Seconds a risk-control ban lasts, default 300": "Spärrtid för inloggning. Antal sekunder en riskkontrollspärr varar, standard 300"
"Class C subnet ban threshold. Bans a /24 subnet such as 103.125.146.* after this many failures, default 10; 0 disables": "Tröskel för spärr av klass C-subnät. Spärrar ett /24-subnät som 103.125.146.* efter så här många misslyckanden, standard 10; 0 inaktiverar"
"Class B subnet ban threshold. Bans a /16 subnet such as 103.125.*.* after this many failures, default 20; 0 disables": "Tröskel för spärr av klass B-subnät. Spärrar ett /16-subnät som 103.125.*.* efter så här många misslyckanden, standard 20; 0 inaktiverar"
"Force bind by user name. Binds SSO users to local users with the same name without a provider prefix; intended for user centers": "Tvinga koppling via användarnamn. Kopplar SSO-användare till lokala användare med samma namn utan leverantörsprefix; avsett för användarcenter"
"Bind by user code. Binds SSO users to local users by user code": "Koppla via användarkod. Kopplar SSO-användare till lokala användare via användarkod"
"Bind by mobile. Binds SSO users to local users by mobile number": "Koppla via mobil. Kopplar SSO-användare till lokala användare via mobilnummer"
"Bind by email. Binds SSO users to local users by email": "Koppla via e-post. Kopplar SSO-användare till lokala användare via e-postadress"
"Bind by nickname. Binds SSO users to local users by nickname; suitable for internal SSO, not for social networks with many duplicate names": "Koppla via smeknamn. Kopplar SSO-användare till lokala användare via smeknamn; lämpligt för intern SSO, inte för sociala nätverk med många dubbletter av namn"
"Use SSO roles. Keeps SSO roles after sign-in, default true; otherwise DefaultRole is used": "Använd SSO-roller. Behåller SSO-roller efter inloggning, standard true; annars används DefaultRole"
"Use SSO departments. Keeps SSO departments after sign-in, default true": "Använd SSO-avdelningar. Behåller SSO-avdelningar efter inloggning, standard true"
"SSO role rules. Automatically upgrades the primary role after SSO sign-in; separate rules with commas. Format: source role+department wildcard=target role, for example Guest+Route*=Route Specialist": "SSO-rollregler. Uppgraderar automatiskt den primära rollen efter SSO-inloggning; separera regler med kommatecken. Format: källroll+avdelningsjokertecken=målroll, till exempel Guest+Route*=Route Specialist"
"Sign out everywhere. false signs out of this site only; true (default) also signs out of the SSO server": "Logga ut överallt. false loggar bara ut från den här webbplatsen; true (standard) loggar även ut från SSO-servern"
"Allow multi-device sign-in. false kicks old devices on a new sign-in and revokes all tokens on sign-out; true (default) revokes only the current session": "Tillåt inloggning på flera enheter. false kastar ut gamla enheter vid en ny inloggning och återkallar alla token vid utloggning; true (standard) återkallar endast den aktuella sessionen"
"Session timeout. Session lifetime after SSO sign-in during which the cookie can sign in again; default 0s": "Sessionens tidsgräns. Sessionens livslängd efter SSO-inloggning under vilken cookien kan logga in igen; standard 0s"
"Token sliding refresh threshold. Refreshes the JWT and rewrites the cookie when its remaining lifetime falls below this many seconds; 0 disables sliding expiration": "Tröskel för glidande tokenförnyelse. Förnyar JWT:n och skriver om cookien när dess återstående livslängd understiger så här många sekunder; 0 inaktiverar glidande utgång"
"User refresh period. Fetches user information once per period across SSO sign-ins, default 600 seconds": "Uppdateringsperiod för användare. Hämtar användarinformation en gång per period vid SSO-inloggningar, standard 600 sekunder"
"JWT secret. Algorithm and key used to sign JWTs, such as HS256:ABCD1234": "JWT-hemlighet. Algoritm och nyckel som används för att signera JWT:er, till exempel HS256:ABCD1234"
"Token lifetime. Lifetime of the access token in seconds, default 7200": "Tokenlivslängd. Åtkomsttokenens livslängd i sekunder, standard 7200"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default true": "Lagra token i cookie. Läser token från cookien när begärandehuvudet inte innehåller någon, standard true"
"Validate attachment access. Requires sign-in to access attachments, default true": "Validera åtkomst till bilagor. Kräver inloggning för att komma åt bilagor, standard true"
"Public attachment categories. Categories accessible without sign-in, comma-separated, such as markdown,avatar. Applies when ValidateAttachment is true": "Offentliga bilagekategorier. Kategorier som är åtkomliga utan inloggning, kommaseparerade, till exempel markdown,avatar. Gäller när ValidateAttachment är true"
"Private attachment categories. Categories only the uploader can access, comma-separated. Applies when ValidateAttachment is true": "Privata bilagekategorier. Kategorier som endast uppladdaren kan komma åt, kommaseparerade. Gäller när ValidateAttachment är true"
"SSO redirect allowlist. Domains allowed to receive the JWT after sign-in, comma-separated with wildcard prefixes such as *.company.com. Empty allows the same site only; other origins are rejected and sent back to the home page": "Tillåtelselista för SSO-omdirigering. Domäner som får ta emot JWT:n efter inloggning, kommaseparerade med jokerteckenprefix som *.company.com. Tomt tillåter endast samma webbplats; andra ursprung avvisas och skickas tillbaka till startsidan"
"External authentication URL. When local authentication fails, credentials are verified by this endpoint; on success the local user is created or updated and signed in": "URL för extern autentisering. När lokal autentisering misslyckas verifieras uppgifterna av denna slutpunkt; vid framgång skapas eller uppdateras den lokala användaren och loggas in"
"Start page. First content page opened after entering the admin console": "Startsida. Första innehållssidan som öppnas när du har gått in i administrationskonsolen"
"Theme. Content page theme, ACE/layui": "Tema. Tema för innehållssidan, ACE/layui"
"Skin. Outer frame layout, ACE/layui": "Utseende. Layout för den yttre ramen, ACE/layui"
"Login tip. Empty hides the tip on the sign-in page": "Inloggningstips. Tomt döljer tipset på inloggningssidan"
"Login logo. Empty uses the default logo": "Inloggningslogotyp. Tomt använder standardlogotypen"
"Login background. Image URL; empty uses the default background": "Inloggningsbakgrund. Bild-URL; tomt använder standardbakgrunden"
"Form group layout. 3/2/1 columns on large/medium/small screens, form-group col-xs-12 col-sm-6 col-lg-4": "Layout för formulärgrupper. 3/2/1 kolumner på stora/medelstora/små skärmar, form-group col-xs-12 col-sm-6 col-lg-4"
"Bootstrap select. Nicer drop-downs with a rendering cost": "Bootstrap-select. Snyggare listrutor till en kostnad i renderingstid"
"Maximum drop-down items. Maximum options in a related drop-down on forms, default 50; larger lists fall back to a text box": "Maximalt antal listruteobjekt. Maximalt antal alternativ i en relaterad listruta i formulär, standard 50; större listor faller tillbaka på en textruta"
"Copyright. Empty hides the copyright; variables now/runtime/framework are supported, and now accepts formats such as {now:yyyy}": "Upphovsrätt. Tomt döljer upphovsrättsraden; variablerna now/runtime/framework stöds, och now accepterar format som {now:yyyy}"
"Filing number. Empty hides the filing information": "Registreringsnummer. Tomt döljer registreringsuppgifterna"
"Enable new UI": "Aktivera nytt gränssnitt"
"ECharts theme. Chart theme": "ECharts-tema. Diagramtema"
"Title suffix. Appends the system name to page titles, default true": "Titelsuffix. Lägger till systemnamnet i sidtitlar, standard true"
"Table double-click. Enables row double-click on list pages, default true": "Dubbelklick i tabeller. Aktiverar dubbelklick på rader på listsidor, standard true"
"Table style. Light: minimal thin lines; Standard: clear row lines (default); Grid: full cell borders": "Tabellstil. Ljus: minimala tunna linjer; Standard: tydliga radlinjer (standard); Rutnät: fullständiga cellkanter"
"Table density. Compact: dense and information-rich (default); Normal: relaxed": "Tabelltäthet. Kompakt: tät och informationsrik (standard); Normal: luftig"
"Stardust web. Stardust console URL; supports direct links to /trace?id={traceId} or /graph?id={traceId}": "Stardust-webb. URL till Stardust-konsolen; stöder direktlänkar till /trace?id={traceId} eller /graph?id={traceId}"
"AI master switch. Enables AI features such as log analysis and notification polishing, default false": "Huvudbrytare för AI. Aktiverar AI-funktioner som logganalys och förfining av aviseringar, standard false"
"AI provider. Supports NewLife, Ollama, DeepSeek, DashScope, OpenAI and others; default NewLife": "AI-leverantör. Stöder NewLife, Ollama, DeepSeek, DashScope, OpenAI med flera; standard NewLife"
"AI endpoint. Defaults to https://ai.newlifex.com for NewLife": "AI-slutpunkt. Standard är https://ai.newlifex.com för NewLife"
"AI ApiKey. Defaults to sk-CubeAI2026 for NewLife": "AI ApiKey. Standard är sk-CubeAI2026 för NewLife"
"AI default model. Defaults to newlife-flash for NewLife": "Standardmodell för AI. Standard är newlife-flash för NewLife"
"AI default deep reasoning. Enables think mode for analysis and chat by default; false means fast responses": "Djupt resonemang som standard för AI. Aktiverar tankeläge för analys och chatt som standard; false innebär snabba svar"
"AI color scheme. Fills the primary and secondary colors from a preset": "Färgschema för AI. Fyller primär- och sekundärfärgen från en förinställning"
"AI primary color. Main color of the launcher, panel header and user bubbles; default NewLife green #2ecc71": "Primär AI-färg. Huvudfärg för startaren, panelhuvudet och användarbubblorna; standard NewLife-grön #2ecc71"
"AI secondary color. Gradient end color, default dark green #1e8e3e": "Sekundär AI-färg. Slutfärg för övertoningen, standard mörkgrön #1e8e3e"
"OAuth server. Enables the OAuth 2.0 server that provides SSO for other applications": "OAuth-server. Aktiverar OAuth 2.0-servern som tillhandahåller SSO för andra program"
"File manager. Enables backend file management (browse, upload, download, delete); this carries security risks": "Filhanterare. Aktiverar filhantering i backend (bläddra, ladda upp, ladda ned, ta bort); detta medför säkerhetsrisker"
"Multi-tenancy. Enables tenants; tenant mode cannot access system administration and platform mode cannot access tenant pages": "Flera klienter. Aktiverar klienter; klientläge kan inte komma åt systemadministration och plattformsläge kan inte komma åt klientsidor"
"Tenant query policy. DenyWithEmpty: return an empty set without tenant context; ThrowOnMissingTenant: throw an explicit error": "Frågeprincip för klienter. DenyWithEmpty: returnera en tom mängd utan klientkontext; ThrowOnMissingTenant: utlös ett explicit fel"
"User online. 0: do not record; 1: signed-in users only; 2: all visitors (default)": "Användare online. 0: registrera inte; 1: endast inloggade användare; 2: alla besökare (standard)"
"User statistics. Records user visits, default true": "Användarstatistik. Registrerar användarbesök, standard true"
"Enable SMS. SMS verification codes and system notifications, default false": "Aktivera SMS. SMS-verifieringskoder och systemaviseringar, standard false"
"Enable email. Email verification codes and system notifications, default false": "Aktivera e-post. E-postverifieringskoder och systemaviseringar, standard false"
"Require email verification. Users must activate their email before signing in and must provide one when registering, default false": "Kräv e-postverifiering. Användare måste aktivera sin e-post innan de loggar in och måste ange en vid registrering, standard false"
"Require mobile verification. Users must activate their mobile before signing in and must provide one when registering, default false": "Kräv mobilverifiering. Användare måste aktivera sin mobil innan de loggar in och måste ange en vid registrering, standard false"
"Captcha scenarios. Bit mask: 0: off; 1: sign-in; 2: registration; 4: verification code requests (anti-SMS-bombing); combine with 3 for sign-in and registration. Mandatory scenarios are never exempted, default 0": "Captcha-scenarier. Bitmask: 0: av; 1: inloggning; 2: registrering; 4: begäran om verifieringskod (anti-SMS-bombning); kombinera med 3 för inloggning och registrering. Obligatoriska scenarier undantas aldrig, standard 0"
"Risk-adaptive captcha. Disabled when CaptchaScene is 0; when enabled it detects unsafe environments and requires a captcha, default true": "Riskbaserad captcha. Inaktiverad när CaptchaScene är 0; när den är aktiverad identifierar den osäkra miljöer och kräver en captcha, standard true"
"Captcha risk threshold. Requires a captcha when the risk score reaches this value: 0: intranet; 1: internet; 2: internet with recent failures; 3: banned. Default 2": "Risktröskel för captcha. Kräver en captcha när riskpoängen når detta värde: 0: intranät; 1: internet; 2: internet med nyliga misslyckanden; 3: spärrad. Standard 2"
"Trusted device lifetime. Days during which previously successful devices skip adaptive captchas, default 30": "Livslängd för betrodda enheter. Antal dagar som tidigare lyckade enheter hoppar över adaptiva captchas, standard 30"
"Enable MFA. Allows users to enable TOTP multi-factor authentication; an enhanced feature, default false": "Aktivera MFA. Gör det möjligt för användare att aktivera TOTP-baserad multifaktorautentisering; en utökad funktion, standard false"
"File storage serving. Responds to file download requests from other nodes, default true": "Betjäning av fillagring. Svarar på nedladdningsbegäranden från andra noder, standard true"
"File storage fetch. Pulls new files published by other nodes, default true": "Hämtning från fillagring. Hämtar nya filer som andra noder publicerar, standard true"
"File fetch timeout. Maximum milliseconds to wait for other nodes when a file is missing locally, default 5000": "Tidsgräns för filhämtning. Maximalt antal millisekunder att vänta på andra noder när en fil saknas lokalt, standard 5000"
"Attachment storage. Local disk, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu or EasyIO; default Local": "Bilagelagring. Lokal disk, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu eller EasyIO; standard Local"
"Object storage server. S3-compatible endpoint for OSS/COS/Qiniu, such as oss-cn-beijing.aliyuncs.com": "Server för objektlagring. S3-kompatibel slutpunkt för OSS/COS/Qiniu, till exempel oss-cn-beijing.aliyuncs.com"
"Object storage bucket. Bucket name for OSS/COS/Qiniu": "Bucket för objektlagring. Bucketnamn för OSS/COS/Qiniu"
"Object storage region. S3 signing scope, such as cn-beijing / ap-beijing / cn-east-1": "Region för objektlagring. Omfattning för S3-signering, till exempel cn-beijing / ap-beijing / cn-east-1"
"Object storage app ID. AccessKeyId": "App-ID för objektlagring. AccessKeyId"
"Object storage app secret. AccessKeySecret": "App-hemlighet för objektlagring. AccessKeySecret"
"Data retention. Days to keep audit and OAuth logs, default 30": "Databevarande. Antal dagar som gransknings- och OAuth-loggar sparas, standard 30"
"File retention. Days to keep backup files, default 15": "Filbevarande. Antal dagar som säkerhetskopieringsfiler sparas, standard 15"
"Retention size floor. Files smaller than this (KB) are never deleted even after the retention period, default 1024K": "Minsta storlek för bevarande. Filer mindre än detta (KB) raderas aldrig ens efter bevarandeperioden, standard 1024K"
"Maximum export rows. Maximum rows a page may export, default 10_000_000": "Maximalt antal exportrader. Maximalt antal rader en sida får exportera, standard 10_000_000"
"Maximum backup rows. Maximum rows a page may back up, default 10_000_000": "Maximalt antal säkerhetskopieringsrader. Maximalt antal rader en sida får säkerhetskopiera, standard 10_000_000"
"API prefixes. Comma- or semicolon-separated prefixes such as /api,/api/v1; matching requests are forwarded to the real route without the prefix": "API-prefix. Komma- eller semikolonavgränsade prefix som /api,/api/v1; matchande begäranden vidarebefordras till den riktiga rutten utan prefixet"
"Password strength. * means unrestricted; by default at least 8 characters with digits, upper/lower case letters and symbols. Simple form: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$": "Lösenordsstyrka. * betyder obegränsat; som standard minst 8 tecken med siffror, versaler/gemener och symboler. Enkel form: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$"
"Cookie mode. Default SameSite mode for token cookies (-1 Unspecified, 0 None, 1 Lax, 2 Strict)": "Cookie-läge. Standard SameSite-läge för tokencookies (-1 Unspecified, 0 None, 1 Lax, 2 Strict)"
"Cookie domain. Writes cookies to a parent domain; empty uses the current domain. A top-level domain requires HTTPS and prevents plain HTTP from writing same-name keys on the local domain": "Cookie-domän. Skriver cookies till en överordnad domän; tomt använder den aktuella domänen. En toppdomän kräver HTTPS och hindrar vanlig HTTP från att skriva nycklar med samma namn på den lokala domänen"
"Activation URL. Front-end activation page URL used in email activation links, such as https://xxx/activate; empty builds /activate from the request host": "Aktiverings-URL. URL till front-endens aktiveringssida som används i aktiveringslänkar i e-post, till exempel https://xxx/activate; tomt bygger /activate från begärans värd"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default false": "Lagra token i cookie. Läser token från cookien när begärandehuvudet inte innehåller någon, standard false"
"Password strength. * means unrestricted; the simple form defaults to 5 to 32 characters of any type. The full form requires at least 8 characters with digits, upper/lower case letters and symbols: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$": "Lösenordsstyrka. * betyder obegränsat; den enkla formen tillåter som standard 5 till 32 tecken av valfri typ. Den fullständiga formen kräver minst 8 tecken med siffror, versaler/gemener och symboler: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$"
