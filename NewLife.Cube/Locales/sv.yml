"Browser channel is not ready (Writer not injected)": "Webbläsarkanalen är inte klar (Writer har inte injicerats)"
"Run page script": "Kör sidskript"
"Runs JavaScript in the current page and returns the result; can read or modify page elements, for example document.title or document.querySelector('input[name=Name]').value": "Kör JavaScript på den aktuella sidan och returnerar resultatet; kan läsa eller ändra sidelement, till exempel document.title eller document.querySelector('input[name=Name]').value"
"JavaScript code to run in the current page": "JavaScript-kod som ska köras på den aktuella sidan"
"Get page context": "Hämta sidkontext"
"Gets the main data and structure of the current page (title, tables, forms and so on). Uses the server-side context when the page provides one; otherwise collects the page content from the user's browser": "Hämtar huvuddata och struktur för den aktuella sidan (titel, tabeller, formulär och så vidare). Använder kontexten på serversidan när sidan tillhandahåller den; samlar annars in sidinnehållet från användarens webbläsare"
"Get form schema": "Hämta formulärschema"
