"Generated {0} configuration field values (skipped {1}, failed {2}) and filled them into the form. Ask the user to review before submitting.": "สร้างค่าฟิลด์การกำหนดค่า {0} รายการ (ข้าม {1} ล้มเหลว {2}) และกรอกลงในฟอร์มแล้ว ขอให้ผู้ใช้ตรวจสอบก่อนส่ง"
"The current page is a system configuration form (such as Cube settings); you can help review and fill in configuration items.": "หน้าปัจจุบันเป็นฟอร์มการกำหนดค่าระบบ (เช่น การตั้งค่า Cube) คุณสามารถช่วยตรวจสอบและกรอกรายการกำหนดค่าได้"
"Available tools: get_form_schema / fill_form / get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "เครื่องมือที่ใช้ได้: get_form_schema / fill_form / get_page_context / get_system_info / run_js (ดูคำนิยามฟังก์ชัน แล้วเรียกใช้เมื่อจำเป็น)"
"2. When the user asks to create, fill in or complete configuration, call get_form_schema first to inspect the items, then call fill_form to generate values (invent reasonable values for empty writable fields, keep existing values unless the user asks otherwise, and never fabricate or modify sensitive settings such as ApiKey/Secret/Token); finally ask the user to review before submitting": "2. เมื่อผู้ใช้ขอสร้าง กรอก หรือทำให้การกำหนดค่าสมบูรณ์ ให้เรียก get_form_schema ก่อนเพื่อตรวจดูรายการ แล้วเรียก fill_form เพื่อสร้างค่า (คิดค่าที่สมเหตุสมผลสำหรับช่องที่ว่างและเขียนได้ คงค่าเดิมไว้เว้นแต่ผู้ใช้จะสั่งเป็นอย่างอื่น และห้ามสร้างหรือแก้ไขการตั้งค่าที่ละเอียดอ่อน เช่น ApiKey/Secret/Token) สุดท้ายขอให้ผู้ใช้ตรวจสอบก่อนส่ง"
"3. When the user asks about the content or current state of the page, call get_page_context, then give your analysis and conclusion": "3. เมื่อผู้ใช้ถามเกี่ยวกับเนื้อหาหรือสถานะปัจจุบันของหน้า ให้เรียก get_page_context แล้วให้การวิเคราะห์และข้อสรุป"
"4. When the user asks about system status or diagnostics, call get_system_info": "4. เมื่อผู้ใช้ถามเกี่ยวกับสถานะระบบหรือการวินิจฉัย ให้เรียก get_system_info"
"5. When the user asks to read or operate page elements, you may call run_js; explain any write operation (changing page content, submitting forms) to the user before running it": "5. เมื่อผู้ใช้ขออ่านหรือกระทำกับองค์ประกอบของหน้า คุณสามารถเรียก run_js ได้ โปรดอธิบายการดำเนินการที่เขียนข้อมูล (การเปลี่ยนเนื้อหาหน้า การส่งฟอร์ม) ให้ผู้ใช้ทราบก่อนรัน"
"6. Never invent data; ask the user for clarification when information is insufficient": "6. ห้ามสร้างข้อมูลขึ้นเอง หากข้อมูลไม่เพียงพอให้ถามผู้ใช้เพื่อความชัดเจน"
"The tenant identifier carried by user [{0}] is invalid or unavailable. Check the tenant settings and try again.": "ตัวระบุผู้เช่าที่ผู้ใช้ [{0}] ส่งมาไม่ถูกต้องหรือใช้ไม่ได้ ตรวจสอบการตั้งค่าผู้เช่าแล้วลองอีกครั้ง"
"User [{0}] did not carry a tenant identifier, so the tenant cannot be determined. Include the tenant information and try again.": "ผู้ใช้ [{0}] ไม่ได้ส่งตัวระบุผู้เช่ามา จึงระบุผู้เช่าไม่ได้ โปรดระบุข้อมูลผู้เช่าแล้วลองอีกครั้ง"
"User [{0}] is not allowed to access the data of the current tenant. Switch tenant and try again.": "ผู้ใช้ [{0}] ไม่ได้รับอนุญาตให้เข้าถึงข้อมูลของผู้เช่าปัจจุบัน สลับผู้เช่าแล้วลองอีกครั้ง"
