"Iframe embedding. Empty allows the same domain only; SAMEORIGIN allows the same domain and port; ALLOWALL allows any domain": "การฝัง Iframe หากเว้นว่างจะอนุญาตเฉพาะโดเมนเดียวกัน SAMEORIGIN อนุญาตโดเมนและพอร์ตเดียวกัน ALLOWALL อนุญาตทุกโดเมน"
"Share expiration. Lifetime of share tokens in seconds, default 7200": "อายุการแชร์ อายุของโทเค็นแชร์เป็นวินาที ค่าเริ่มต้น 7200"
"Bot error code. Returns this error for crawlers, such as 404/500; 0 disables blocking": "รหัสข้อผิดพลาดสำหรับบอต ส่งคืนข้อผิดพลาดนี้ให้ครอว์เลอร์ เช่น 404/500 ค่า 0 ปิดการบล็อก"
"Force redirect. Target scheme and host for GET requests; * is supported in the host. Commonly used to force HTTPS, such as https://*:8081": "บังคับเปลี่ยนเส้นทาง สคีมาและโฮสต์เป้าหมายสำหรับคำขอ GET รองรับ * ในโฮสต์ มักใช้เพื่อบังคับใช้ HTTPS เช่น https://*:8081"
"Security mode. 0: off; 1: observe and log only; 2: block; 3: automatic (default; observes, bans repeated attackers, and temporarily blocks broad attacks with automatic rollback)": "โหมดความปลอดภัย 0: ปิด; 1: สังเกตและบันทึกล็อกเท่านั้น; 2: บล็อก; 3: อัตโนมัติ (ค่าเริ่มต้น; สังเกต แบนผู้โจมตีซ้ำ และบล็อกการโจมตีเป็นวงกว้างชั่วคราวพร้อมย้อนกลับอัตโนมัติ)"
"Auto-ban durations. Comma-separated seconds that increase with each trigger; empty uses 60,300,1800,7200,86400": "ระยะเวลาการแบนอัตโนมัติ จำนวนวินาทีคั่นด้วยจุลภาคที่เพิ่มขึ้นในแต่ละครั้งที่ทริกเกอร์ หากเว้นว่างจะใช้ 60,300,1800,7200,86400"
"Trusted proxies. Forwarded headers are only trusted from these comma-separated IPs or CIDR ranges; empty keeps the legacy behavior of trusting all forwarded headers": "พร็อกซีที่เชื่อถือได้ จะเชื่อถือเฮดเดอร์ที่ส่งต่อมาจาก IP หรือช่วง CIDR ที่คั่นด้วยจุลภาคเหล่านี้เท่านั้น หากเว้นว่างจะคงพฤติกรรมเดิมที่เชื่อถือเฮดเดอร์ที่ส่งต่อทั้งหมด"
"Trusted proxy learning limit. When no trusted proxies are configured, private direct sources that send forwarded headers are learned up to this count; 0 disables learning (typically 2 for one data center, 4 for two)": "ขีดจำกัดการเรียนรู้พร็อกซีที่เชื่อถือได้ เมื่อยังไม่ได้กำหนดค่าพร็อกซีที่เชื่อถือได้ ระบบจะเรียนรู้แหล่งที่มาโดยตรงแบบส่วนตัวที่ส่งเฮดเดอร์ต่อ จนถึงจำนวนนี้ ค่า 0 ปิดการเรียนรู้ (โดยทั่วไป 2 สำหรับหนึ่งศูนย์ข้อมูล และ 4 สำหรับสองศูนย์)"
"Learned proxies. Maintained automatically; clear it to reset the learned list": "พร็อกซีที่เรียนรู้แล้ว ระบบดูแลให้อัตโนมัติ ล้างค่าเพื่อรีเซ็ตรายการที่เรียนรู้"
"Default role. Defaults to the Normal User role": "บทบาทเริ่มต้น ค่าเริ่มต้นคือบทบาทผู้ใช้ทั่วไป"
"Allow password sign-in. Allows signing in with a username and password": "อนุญาตลงชื่อเข้าใช้ด้วยรหัสผ่าน อนุญาตให้ลงชื่อเข้าใช้ด้วยชื่อผู้ใช้และรหัสผ่าน"
"Allow plain-text passwords. Default true for legacy clients; false forces Challenge-Response encrypted passwords": "อนุญาตรหัสผ่านแบบข้อความธรรมดา ค่าเริ่มต้น true สำหรับไคลเอนต์รุ่นเก่า ค่า false จะบังคับใช้รหัสผ่านเข้ารหัสแบบ Challenge-Response"
"Allow registration. Allows registering with a username and password": "อนุญาตการลงทะเบียน อนุญาตให้ลงทะเบียนด้วยชื่อผู้ใช้และรหัสผ่าน"
"Auto registration. Default true; after SSO sign-in an unknown local user is registered automatically. Enabled when either the global or the OAuth app setting is on": "ลงทะเบียนอัตโนมัติ ค่าเริ่มต้น true หลังลงชื่อเข้าใช้ด้วย SSO ผู้ใช้ในเครื่องที่ไม่รู้จักจะถูกลงทะเบียนอัตโนมัติ เปิดใช้งานเมื่อการตั้งค่าส่วนกลางหรือการตั้งค่าแอป OAuth อย่างใดอย่างหนึ่งเปิดอยู่"
"Password complexity check. When enabled the sign-in page validates password strength; when disabled it only requires a non-empty password. Default true": "ตรวจสอบความซับซ้อนของรหัสผ่าน เมื่อเปิดใช้งาน หน้าลงชื่อเข้าใช้จะตรวจสอบความแข็งแรงของรหัสผ่าน เมื่อปิดใช้งานจะกำหนดเพียงรหัสผ่านที่ไม่ว่าง ค่าเริ่มต้น true"
"Login failure limit. Bans sign-in after this many consecutive failures for the same user or IP, default 5": "ขีดจำกัดการเข้าสู่ระบบล้มเหลว แบนการลงชื่อเข้าใช้หลังจากล้มเหลวติดต่อกันตามจำนวนนี้สำหรับผู้ใช้หรือ IP เดียวกัน ค่าเริ่มต้น 5"
"Login ban duration. Seconds a risk-control ban lasts, default 300": "ระยะเวลาการแบนการเข้าสู่ระบบ จำนวนวินาทีที่การแบนจากระบบควบคุมความเสี่ยงมีผล ค่าเริ่มต้น 300"
"Class C subnet ban threshold. Bans a /24 subnet such as 103.125.146.* after this many failures, default 10; 0 disables": "เกณฑ์แบนซับเน็ตคลาส C แบนซับเน็ต /24 เช่น 103.125.146.* หลังจากล้มเหลวตามจำนวนนี้ ค่าเริ่มต้น 10 ค่า 0 ปิดใช้งาน"
"Class B subnet ban threshold. Bans a /16 subnet such as 103.125.*.* after this many failures, default 20; 0 disables": "เกณฑ์แบนซับเน็ตคลาส B แบนซับเน็ต /16 เช่น 103.125.*.* หลังจากล้มเหลวตามจำนวนนี้ ค่าเริ่มต้น 20 ค่า 0 ปิดใช้งาน"
"Force bind by user name. Binds SSO users to local users with the same name without a provider prefix; intended for user centers": "บังคับผูกตามชื่อผู้ใช้ ผูกผู้ใช้ SSO กับผู้ใช้ในเครื่องที่ชื่อเดียวกันโดยไม่มีคำนำหน้าผู้ให้บริการ เหมาะสำหรับศูนย์ผู้ใช้"
"Bind by user code. Binds SSO users to local users by user code": "ผูกตามรหัสผู้ใช้ ผูกผู้ใช้ SSO กับผู้ใช้ในเครื่องด้วยรหัสผู้ใช้"
"Bind by mobile. Binds SSO users to local users by mobile number": "ผูกตามโทรศัพท์ ผูกผู้ใช้ SSO กับผู้ใช้ในเครื่องด้วยหมายเลขโทรศัพท์"
"Bind by email. Binds SSO users to local users by email": "ผูกตามอีเมล ผูกผู้ใช้ SSO กับผู้ใช้ในเครื่องด้วยอีเมล"
"Bind by nickname. Binds SSO users to local users by nickname; suitable for internal SSO, not for social networks with many duplicate names": "ผูกตามชื่อเล่น ผูกผู้ใช้ SSO กับผู้ใช้ในเครื่องด้วยชื่อเล่น เหมาะกับ SSO ภายใน ไม่เหมาะกับเครือข่ายสังคมที่มีชื่อซ้ำกันมาก"
"Use SSO roles. Keeps SSO roles after sign-in, default true; otherwise DefaultRole is used": "ใช้บทบาทจาก SSO เก็บบทบาทจาก SSO ไว้หลังลงชื่อเข้าใช้ ค่าเริ่มต้น true มิฉะนั้นจะใช้ DefaultRole"
"Use SSO departments. Keeps SSO departments after sign-in, default true": "ใช้แผนกจาก SSO เก็บแผนกจาก SSO ไว้หลังลงชื่อเข้าใช้ ค่าเริ่มต้น true"
"SSO role rules. Automatically upgrades the primary role after SSO sign-in; separate rules with commas. Format: source role+department wildcard=target role, for example Guest+Route*=Route Specialist": "กฎบทบาท SSO อัปเกรดบทบาทหลักโดยอัตโนมัติหลังลงชื่อเข้าใช้ด้วย SSO คั่นแต่ละกฎด้วยจุลภาค รูปแบบ: บทบาทต้นทาง+ไวลด์การ์ดแผนก=บทบาทปลายทาง เช่น Guest+Route*=Route Specialist"
"Sign out everywhere. false signs out of this site only; true (default) also signs out of the SSO server": "ลงชื่อออกทุกที่ false จะลงชื่อออกจากไซต์นี้เท่านั้น true (ค่าเริ่มต้น) จะลงชื่อออกจากเซิร์ฟเวอร์ SSO ด้วย"
"Allow multi-device sign-in. false kicks old devices on a new sign-in and revokes all tokens on sign-out; true (default) revokes only the current session": "อนุญาตลงชื่อเข้าใช้หลายอุปกรณ์ false จะไล่อุปกรณ์เก่าออกเมื่อลงชื่อเข้าใช้ใหม่ และเพิกถอนโทเค็นทั้งหมดเมื่อลงชื่อออก true (ค่าเริ่มต้น) จะเพิกถอนเฉพาะเซสชันปัจจุบัน"
"Session timeout. Session lifetime after SSO sign-in during which the cookie can sign in again; default 0s": "หมดเวลาเซสชัน อายุเซสชันหลังลงชื่อเข้าใช้ด้วย SSO ที่คุกกี้ยังใช้ลงชื่อเข้าใช้ซ้ำได้ ค่าเริ่มต้น 0s"
"Token sliding refresh threshold. Refreshes the JWT and rewrites the cookie when its remaining lifetime falls below this many seconds; 0 disables sliding expiration": "เกณฑ์รีเฟรชโทเค็นแบบเลื่อน รีเฟรช JWT และเขียนคุกกี้ใหม่เมื่ออายุคงเหลือต่ำกว่าจำนวนวินาทีนี้ ค่า 0 ปิดการหมดอายุแบบเลื่อน"
"User refresh period. Fetches user information once per period across SSO sign-ins, default 600 seconds": "รอบรีเฟรชผู้ใช้ ดึงข้อมูลผู้ใช้หนึ่งครั้งต่อรอบตลอดการลงชื่อเข้าใช้ด้วย SSO ค่าเริ่มต้น 600 วินาที"
"JWT secret. Algorithm and key used to sign JWTs, such as HS256:ABCD1234": "ความลับ JWT อัลกอริทึมและคีย์ที่ใช้ลงนาม JWT เช่น HS256:ABCD1234"
"Token lifetime. Lifetime of the access token in seconds, default 7200": "อายุโทเค็น อายุของโทเค็นการเข้าถึงเป็นวินาที ค่าเริ่มต้น 7200"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default true": "เก็บโทเค็นในคุกกี้ อ่านโทเค็นจากคุกกี้เมื่อเฮดเดอร์คำขอไม่ได้แนบมา ค่าเริ่มต้น true"
"Validate attachment access. Requires sign-in to access attachments, default true": "ตรวจสอบการเข้าถึงไฟล์แนบ ต้องลงชื่อเข้าใช้จึงจะเข้าถึงไฟล์แนบได้ ค่าเริ่มต้น true"
"Public attachment categories. Categories accessible without sign-in, comma-separated, such as markdown,avatar. Applies when ValidateAttachment is true": "หมวดหมู่ไฟล์แนบสาธารณะ หมวดหมู่ที่เข้าถึงได้โดยไม่ต้องลงชื่อเข้าใช้ คั่นด้วยจุลภาค เช่น markdown,avatar ใช้เมื่อ ValidateAttachment เป็น true"
"Private attachment categories. Categories only the uploader can access, comma-separated. Applies when ValidateAttachment is true": "หมวดหมู่ไฟล์แนบส่วนตัว หมวดหมู่ที่เฉพาะผู้อัปโหลดเข้าถึงได้ คั่นด้วยจุลภาค ใช้เมื่อ ValidateAttachment เป็น true"
"SSO redirect allowlist. Domains allowed to receive the JWT after sign-in, comma-separated with wildcard prefixes such as *.company.com. Empty allows the same site only; other origins are rejected and sent back to the home page": "รายการที่อนุญาตให้เปลี่ยนเส้นทาง SSO โดเมนที่ได้รับอนุญาตให้รับ JWT หลังลงชื่อเข้าใช้ คั่นด้วยจุลภาคพร้อมคำนำหน้าไวลด์การ์ด เช่น *.company.com หากเว้นว่างจะอนุญาตเฉพาะไซต์เดียวกัน แหล่งอื่นจะถูกปฏิเสธและส่งกลับหน้าหลัก"
"External authentication URL. When local authentication fails, credentials are verified by this endpoint; on success the local user is created or updated and signed in": "URL การพิสูจน์ตัวตนภายนอก เมื่อการพิสูจน์ตัวตนในเครื่องล้มเหลว ข้อมูลรับรองจะถูกตรวจสอบกับปลายทางนี้ เมื่อสำเร็จผู้ใช้ในเครื่องจะถูกสร้างหรืออัปเดตและลงชื่อเข้าใช้"
"Start page. First content page opened after entering the admin console": "หน้าเริ่มต้น หน้าเนื้อหาแรกที่เปิดหลังเข้าสู่คอนโซลผู้ดูแล"
"Theme. Content page theme, ACE/layui": "ธีม ธีมของหน้าเนื้อหา ACE/layui"
"Skin. Outer frame layout, ACE/layui": "สกิน เลย์เอาต์กรอบภายนอก ACE/layui"
"Login tip. Empty hides the tip on the sign-in page": "ข้อความแนะนำการเข้าสู่ระบบ หากเว้นว่างจะซ่อนข้อความแนะนำบนหน้าลงชื่อเข้าใช้"
"Login logo. Empty uses the default logo": "โลโก้การเข้าสู่ระบบ หากเว้นว่างจะใช้โลโก้เริ่มต้น"
"Login background. Image URL; empty uses the default background": "พื้นหลังการเข้าสู่ระบบ URL ของรูปภาพ หากเว้นว่างจะใช้พื้นหลังเริ่มต้น"
"Form group layout. 3/2/1 columns on large/medium/small screens, form-group col-xs-12 col-sm-6 col-lg-4": "เลย์เอาต์กลุ่มฟอร์ม 3/2/1 คอลัมน์บนหน้าจอขนาดใหญ่/กลาง/เล็ก form-group col-xs-12 col-sm-6 col-lg-4"
"Bootstrap select. Nicer drop-downs with a rendering cost": "Bootstrap select ดรอปดาวน์ที่สวยงามขึ้นโดยมีต้นทุนด้านการเรนเดอร์"
"Maximum drop-down items. Maximum options in a related drop-down on forms, default 50; larger lists fall back to a text box": "จำนวนรายการดรอปดาวน์สูงสุด จำนวนตัวเลือกสูงสุดในดรอปดาวน์ที่เชื่อมโยงบนฟอร์ม ค่าเริ่มต้น 50 รายการที่ใหญ่กว่าจะกลับไปใช้กล่องข้อความ"
"Copyright. Empty hides the copyright; variables now/runtime/framework are supported, and now accepts formats such as {now:yyyy}": "ลิขสิทธิ์ หากเว้นว่างจะซ่อนลิขสิทธิ์ รองรับตัวแปร now/runtime/framework และ now รับรูปแบบเช่น {now:yyyy}"
"Filing number. Empty hides the filing information": "หมายเลขจดทะเบียน หากเว้นว่างจะซ่อนข้อมูลการจดทะเบียน"
"Enable new UI": "เปิดใช้งาน UI ใหม่"
"ECharts theme. Chart theme": "ธีม ECharts ธีมของกราฟ"
"Title suffix. Appends the system name to page titles, default true": "ส่วนต่อท้ายชื่อเรื่อง เพิ่มชื่อระบบต่อท้ายชื่อเรื่องของหน้า ค่าเริ่มต้น true"
"Table double-click. Enables row double-click on list pages, default true": "ดับเบิลคลิกตาราง เปิดใช้งานการดับเบิลคลิกแถวบนหน้ารายการ ค่าเริ่มต้น true"
"Table style. Light: minimal thin lines; Standard: clear row lines (default); Grid: full cell borders": "สไตล์ตาราง Light: เส้นบางแบบมินิมอล; Standard: เส้นแถวชัดเจน (ค่าเริ่มต้น); Grid: เส้นขอบเซลล์เต็มรูปแบบ"
"Table density. Compact: dense and information-rich (default); Normal: relaxed": "ความหนาแน่นของตาราง Compact: หนาแน่นและให้ข้อมูลมาก (ค่าเริ่มต้น); Normal: โปร่งสบาย"
"Stardust web. Stardust console URL; supports direct links to /trace?id={traceId} or /graph?id={traceId}": "Stardust web URL คอนโซล Stardust รองรับลิงก์ตรงไปยัง /trace?id={traceId} หรือ /graph?id={traceId}"
"AI master switch. Enables AI features such as log analysis and notification polishing, default false": "สวิตช์หลักของ AI เปิดใช้งานฟีเจอร์ AI เช่น การวิเคราะห์ล็อกและการขัดเกลาการแจ้งเตือน ค่าเริ่มต้น false"
"AI provider. Supports NewLife, Ollama, DeepSeek, DashScope, OpenAI and others; default NewLife": "ผู้ให้บริการ AI รองรับ NewLife, Ollama, DeepSeek, DashScope, OpenAI และอื่น ๆ ค่าเริ่มต้น NewLife"
"AI endpoint. Defaults to https://ai.newlifex.com for NewLife": "ปลายทาง AI ค่าเริ่มต้นคือ https://ai.newlifex.com สำหรับ NewLife"
"AI ApiKey. Defaults to sk-CubeAI2026 for NewLife": "ApiKey ของ AI ค่าเริ่มต้นคือ sk-CubeAI2026 สำหรับ NewLife"
"AI default model. Defaults to newlife-flash for NewLife": "โมเดลเริ่มต้นของ AI ค่าเริ่มต้นคือ newlife-flash สำหรับ NewLife"
"AI default deep reasoning. Enables think mode for analysis and chat by default; false means fast responses": "การให้เหตุผลเชิงลึกเริ่มต้นของ AI เปิดโหมด think สำหรับการวิเคราะห์และแชทเป็นค่าเริ่มต้น false หมายถึงการตอบสนองที่รวดเร็ว"
"AI color scheme. Fills the primary and secondary colors from a preset": "ชุดสี AI เติมสีหลักและสีรองจากพรีเซ็ต"
"AI primary color. Main color of the launcher, panel header and user bubbles; default NewLife green #2ecc71": "สีหลักของ AI สีหลักของตัวเปิด พาดหัวแผง และบับเบิลผู้ใช้ ค่าเริ่มต้นคือสีเขียว NewLife #2ecc71"
"AI secondary color. Gradient end color, default dark green #1e8e3e": "สีรองของ AI สีปลายสุดของเกรเดียนต์ ค่าเริ่มต้นคือสีเขียวเข้ม #1e8e3e"
"OAuth server. Enables the OAuth 2.0 server that provides SSO for other applications": "เซิร์ฟเวอร์ OAuth เปิดใช้งานเซิร์ฟเวอร์ OAuth 2.0 ที่ให้บริการ SSO แก่แอปพลิเคชันอื่น"
"File manager. Enables backend file management (browse, upload, download, delete); this carries security risks": "ตัวจัดการไฟล์ เปิดใช้งานการจัดการไฟล์ฝั่งหลังบ้าน (เรียกดู อัปโหลด ดาวน์โหลด ลบ) ซึ่งมีความเสี่ยงด้านความปลอดภัย"
"Multi-tenancy. Enables tenants; tenant mode cannot access system administration and platform mode cannot access tenant pages": "หลายผู้เช่า เปิดใช้งานผู้เช่า โหมดผู้เช่าไม่สามารถเข้าถึงการจัดการระบบ และโหมดแพลตฟอร์มไม่สามารถเข้าถึงหน้าผู้เช่า"
"Tenant query policy. DenyWithEmpty: return an empty set without tenant context; ThrowOnMissingTenant: throw an explicit error": "นโยบายการค้นหาผู้เช่า DenyWithEmpty: ส่งคืนชุดว่างเมื่อไม่มีบริบทผู้เช่า; ThrowOnMissingTenant: ส่งข้อผิดพลาดอย่างชัดเจน"
"User online. 0: do not record; 1: signed-in users only; 2: all visitors (default)": "ผู้ใช้ออนไลน์ 0: ไม่บันทึก; 1: เฉพาะผู้ใช้ที่ลงชื่อเข้าใช้; 2: ผู้เยี่ยมชมทั้งหมด (ค่าเริ่มต้น)"
"User statistics. Records user visits, default true": "สถิติผู้ใช้ บันทึกการเข้าชมของผู้ใช้ ค่าเริ่มต้น true"
"Enable SMS. SMS verification codes and system notifications, default false": "เปิดใช้งาน SMS รหัสยืนยันทาง SMS และการแจ้งเตือนของระบบ ค่าเริ่มต้น false"
"Enable email. Email verification codes and system notifications, default false": "เปิดใช้งานอีเมล รหัสยืนยันทางอีเมลและการแจ้งเตือนของระบบ ค่าเริ่มต้น false"
"Require email verification. Users must activate their email before signing in and must provide one when registering, default false": "ต้องยืนยันอีเมล ผู้ใช้ต้องเปิดใช้งานอีเมลก่อนลงชื่อเข้าใช้ และต้องระบุอีเมลเมื่อลงทะเบียน ค่าเริ่มต้น false"
"Require mobile verification. Users must activate their mobile before signing in and must provide one when registering, default false": "ต้องยืนยันโทรศัพท์ ผู้ใช้ต้องเปิดใช้งานโทรศัพท์ก่อนลงชื่อเข้าใช้ และต้องระบุโทรศัพท์เมื่อลงทะเบียน ค่าเริ่มต้น false"
"Captcha scenarios. Bit mask: 0: off; 1: sign-in; 2: registration; 4: verification code requests (anti-SMS-bombing); combine with 3 for sign-in and registration. Mandatory scenarios are never exempted, default 0": "สถานการณ์แคปต์ชา บิตมาสก์: 0: ปิด; 1: ลงชื่อเข้าใช้; 2: ลงทะเบียน; 4: คำขอรหัสยืนยัน (ป้องกัน SMS บอมบ์) รวมกับ 3 สำหรับลงชื่อเข้าใช้และการลงทะเบียน สถานการณ์บังคับจะไม่ได้รับการยกเว้น ค่าเริ่มต้น 0"
"Risk-adaptive captcha. Disabled when CaptchaScene is 0; when enabled it detects unsafe environments and requires a captcha, default true": "แคปต์ชาตามความเสี่ยง ปิดใช้งานเมื่อ CaptchaScene เป็น 0 เมื่อเปิดใช้งานจะตรวจจับสภาพแวดล้อมที่ไม่ปลอดภัยและเรียกใช้แคปต์ชา ค่าเริ่มต้น true"
"Captcha risk threshold. Requires a captcha when the risk score reaches this value: 0: intranet; 1: internet; 2: internet with recent failures; 3: banned. Default 2": "เกณฑ์ความเสี่ยงแคปต์ชา เรียกใช้แคปต์ชาเมื่อคะแนนความเสี่ยงถึงค่านี้: 0: อินทราเน็ต; 1: อินเทอร์เน็ต; 2: อินเทอร์เน็ตที่มีความล้มเหลวล่าสุด; 3: ถูกแบน ค่าเริ่มต้น 2"
"Trusted device lifetime. Days during which previously successful devices skip adaptive captchas, default 30": "อายุอุปกรณ์ที่เชื่อถือได้ จำนวนวันที่อุปกรณ์ที่เคยสำเร็จจะข้ามแคปต์ชาแบบปรับตัว ค่าเริ่มต้น 30"
"Enable MFA. Allows users to enable TOTP multi-factor authentication; an enhanced feature, default false": "เปิดใช้งาน MFA อนุญาตให้ผู้ใช้เปิดใช้การพิสูจน์ตัวตนหลายปัจจัยแบบ TOTP ซึ่งเป็นฟีเจอร์เสริม ค่าเริ่มต้น false"
"File storage serving. Responds to file download requests from other nodes, default true": "การให้บริการที่เก็บไฟล์ ตอบสนองคำขอดาวน์โหลดไฟล์จากโหนดอื่น ค่าเริ่มต้น true"
"File storage fetch. Pulls new files published by other nodes, default true": "การดึงข้อมูลที่เก็บไฟล์ ดึงไฟล์ใหม่ที่โหนดอื่นเผยแพร่ ค่าเริ่มต้น true"
"File fetch timeout. Maximum milliseconds to wait for other nodes when a file is missing locally, default 5000": "หมดเวลาการดึงไฟล์ ระยะเวลาสูงสุดเป็นมิลลิวินาทีในการรอโหนดอื่นเมื่อไม่พบไฟล์ในเครื่อง ค่าเริ่มต้น 5000"
"Attachment storage. Local disk, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu or EasyIO; default Local": "ที่เก็บไฟล์แนบ ดิสก์ในเครื่อง, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu หรือ EasyIO ค่าเริ่มต้น Local"
"Object storage server. S3-compatible endpoint for OSS/COS/Qiniu, such as oss-cn-beijing.aliyuncs.com": "เซิร์ฟเวอร์ที่เก็บออบเจ็กต์ ปลายทางที่เข้ากันได้กับ S3 สำหรับ OSS/COS/Qiniu เช่น oss-cn-beijing.aliyuncs.com"
"Object storage bucket. Bucket name for OSS/COS/Qiniu": "บักเก็ตที่เก็บออบเจ็กต์ ชื่อบักเก็ตสำหรับ OSS/COS/Qiniu"
"Object storage region. S3 signing scope, such as cn-beijing / ap-beijing / cn-east-1": "ภูมิภาคที่เก็บออบเจ็กต์ ขอบเขตการลงนาม S3 เช่น cn-beijing / ap-beijing / cn-east-1"
"Object storage app ID. AccessKeyId": "รหัสแอปที่เก็บออบเจ็กต์ AccessKeyId"
"Object storage app secret. AccessKeySecret": "รหัสลับแอปที่เก็บออบเจ็กต์ AccessKeySecret"
"Data retention. Days to keep audit and OAuth logs, default 30": "การเก็บรักษาข้อมูล จำนวนวันที่เก็บล็อกตรวจสอบและล็อก OAuth ค่าเริ่มต้น 30"
"File retention. Days to keep backup files, default 15": "การเก็บรักษาไฟล์ จำนวนวันที่เก็บไฟล์สำรองข้อมูล ค่าเริ่มต้น 15"
"Retention size floor. Files smaller than this (KB) are never deleted even after the retention period, default 1024K": "ขนาดขั้นต่ำในการเก็บรักษา ไฟล์ที่เล็กกว่านี้ (KB) จะไม่ถูกลบแม้พ้นระยะเวลาการเก็บรักษา ค่าเริ่มต้น 1024K"
"Maximum export rows. Maximum rows a page may export, default 10_000_000": "จำนวนแถวส่งออกสูงสุด จำนวนแถวสูงสุดที่หน้าเว็บส่งออกได้ ค่าเริ่มต้น 10_000_000"
"Maximum backup rows. Maximum rows a page may back up, default 10_000_000": "จำนวนแถวสำรองข้อมูลสูงสุด จำนวนแถวสูงสุดที่หน้าเว็บสำรองข้อมูลได้ ค่าเริ่มต้น 10_000_000"
"API prefixes. Comma- or semicolon-separated prefixes such as /api,/api/v1; matching requests are forwarded to the real route without the prefix": "คำนำหน้า API คำนำหน้าที่คั่นด้วยจุลภาคหรืออัฒภาค เช่น /api,/api/v1 คำขอที่ตรงกันจะถูกส่งต่อไปยังเส้นทางจริงโดยไม่มีคำนำหน้า"
"Password strength. * means unrestricted; by default at least 8 characters with digits, upper/lower case letters and symbols. Simple form: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$": "ความแข็งแรงของรหัสผ่าน * หมายถึงไม่จำกัด ตามค่าเริ่มต้นต้องมีอย่างน้อย 8 อักขระประกอบด้วยตัวเลข ตัวพิมพ์ใหญ่/เล็ก และสัญลักษณ์ รูปแบบอย่างง่าย: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$"
"Cookie mode. Default SameSite mode for token cookies (-1 Unspecified, 0 None, 1 Lax, 2 Strict)": "โหมดคุกกี้ โหมด SameSite เริ่มต้นสำหรับคุกกี้โทเค็น (-1 Unspecified, 0 None, 1 Lax, 2 Strict)"
"Cookie domain. Writes cookies to a parent domain; empty uses the current domain. A top-level domain requires HTTPS and prevents plain HTTP from writing same-name keys on the local domain": "โดเมนคุกกี้ เขียนคุกกี้ไปยังโดเมนหลัก หากเว้นว่างจะใช้โดเมนปัจจุบัน โดเมนระดับบนสุดต้องใช้ HTTPS และป้องกันไม่ให้ HTTP ธรรมดาเขียนคีย์ชื่อเดียวกันบนโดเมนท้องถิ่น"
"Activation URL. Front-end activation page URL used in email activation links, such as https://xxx/activate; empty builds /activate from the request host": "URL การเปิดใช้งาน URL ของหน้าภาคหน้าสำหรับลิงก์เปิดใช้งานทางอีเมล เช่น https://xxx/activate หากเว้นว่างจะสร้าง /activate จากโฮสต์ของคำขอ"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default false": "เก็บโทเค็นในคุกกี้ อ่านโทเค็นจากคุกกี้เมื่อเฮดเดอร์คำขอไม่ได้แนบมา ค่าเริ่มต้น false"
"Password strength. * means unrestricted; the simple form defaults to 5 to 32 characters of any type. The full form requires at least 8 characters with digits, upper/lower case letters and symbols: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$": "ความแข็งแรงของรหัสผ่าน * หมายถึงไม่จำกัด รูปแบบอย่างง่ายมีค่าเริ่มต้น 5 ถึง 32 อักขระแบบใดก็ได้ รูปแบบเต็มต้องมีอย่างน้อย 8 อักขระประกอบด้วยตัวเลข ตัวพิมพ์ใหญ่/เล็ก และสัญลักษณ์: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$"
