"Force redirect. Target scheme and host for GET requests; * is supported in the host. Commonly used to force HTTPS, such as https://*:8081": "Zorunlu yönlendirme. GET istekleri için hedef şema ve ana makine; ana makinede * desteklenir. Genellikle HTTPS'e zorlamak için kullanılır, örneğin https://*:8081"
"Security mode. 0: off; 1: observe and log only; 2: block; 3: automatic (default; observes, bans repeated attackers, and temporarily blocks broad attacks with automatic rollback)": "Güvenlik modu. 0: kapalı; 1: yalnızca izle ve günlüğe kaydet; 2: engelle; 3: otomatik (varsayılan; izler, tekrarlayan saldırganları yasaklar ve geniş saldırıları otomatik geri alma ile geçici olarak engeller)"
"Auto-ban durations. Comma-separated seconds that increase with each trigger; empty uses 60,300,1800,7200,86400": "Otomatik yasak süreleri. Her tetiklemede artan, virgülle ayrılmış saniyeler; boş bırakılırsa 60,300,1800,7200,86400 kullanılır"
"Trusted proxies. Forwarded headers are only trusted from these comma-separated IPs or CIDR ranges; empty keeps the legacy behavior of trusting all forwarded headers": "Güvenilen proxy'ler. Yönlendirilen başlıklara yalnızca virgülle ayrılmış bu IP'lerden veya CIDR aralıklarından güvenilir; boş bırakılırsa tüm yönlendirilen başlıklara güvenme şeklindeki eski davranış korunur"
"Trusted proxy learning limit. When no trusted proxies are configured, private direct sources that send forwarded headers are learned up to this count; 0 disables learning (typically 2 for one data center, 4 for two)": "Güvenilen proxy öğrenme sınırı. Güvenilen proxy yapılandırılmadığında, yönlendirilen başlıklar gönderen özel doğrudan kaynaklar bu sayıya kadar öğrenilir; 0 öğrenmeyi devre dışı bırakır (genellikle bir veri merkezi için 2, iki veri merkezi için 4)"
"Learned proxies. Maintained automatically; clear it to reset the learned list": "Öğrenilen proxy'ler. Otomatik olarak korunur; öğrenilen listeyi sıfırlamak için temizleyin"
"Default role. Defaults to the Normal User role": "Varsayılan rol. Varsayılan olarak Normal Kullanıcı rolü kullanılır"
"Allow password sign-in. Allows signing in with a username and password": "Parolayla oturum açmaya izin ver. Kullanıcı adı ve parolayla oturum açmayı sağlar"
"Allow plain-text passwords. Default true for legacy clients; false forces Challenge-Response encrypted passwords": "Düz metin parolalara izin ver. Eski istemciler için varsayılan true; false, Challenge-Response ile şifrelenmiş parolaları zorunlu kılar"
"Allow registration. Allows registering with a username and password": "Kayda izin ver. Kullanıcı adı ve parolayla kayıt olmayı sağlar"
"Auto registration. Default true; after SSO sign-in an unknown local user is registered automatically. Enabled when either the global or the OAuth app setting is on": "Otomatik kayıt. Varsayılan true; SSO ile oturum açtıktan sonra bilinmeyen yerel kullanıcı otomatik olarak kaydedilir. Genel ayar veya OAuth uygulama ayarı açık olduğunda etkindir"
"Password complexity check. When enabled the sign-in page validates password strength; when disabled it only requires a non-empty password. Default true": "Parola karmaşıklığı denetimi. Etkinleştirildiğinde oturum açma sayfası parola gücünü doğrular; devre dışı bırakıldığında yalnızca parolanın boş olmaması gerekir. Varsayılan true"
"Login failure limit. Bans sign-in after this many consecutive failures for the same user or IP, default 5": "Oturum açma hatası sınırı. Aynı kullanıcı veya IP için bu sayıda art arda hatadan sonra oturum açmayı yasaklar, varsayılan 5"
"Login ban duration. Seconds a risk-control ban lasts, default 300": "Oturum açma yasağı süresi. Risk denetimi yasağının saniye cinsinden süresi, varsayılan 300"
"Class C subnet ban threshold. Bans a /24 subnet such as 103.125.146.* after this many failures, default 10; 0 disables": "C sınıfı alt ağ yasak eşiği. 103.125.146.* gibi bir /24 alt ağını bu sayıda hatadan sonra yasaklar, varsayılan 10; 0 devre dışı bırakır"
"Class B subnet ban threshold. Bans a /16 subnet such as 103.125.*.* after this many failures, default 20; 0 disables": "B sınıfı alt ağ yasak eşiği. 103.125.*.* gibi bir /16 alt ağını bu sayıda hatadan sonra yasaklar, varsayılan 20; 0 devre dışı bırakır"
"Force bind by user name. Binds SSO users to local users with the same name without a provider prefix; intended for user centers": "Kullanıcı adına göre bağlamayı zorunlu kıl. SSO kullanıcılarını, sağlayıcı öneki olmadan aynı ada sahip yerel kullanıcılara bağlar; kullanıcı merkezleri için tasarlanmıştır"
"Bind by user code. Binds SSO users to local users by user code": "Kullanıcı koduna göre bağla. SSO kullanıcılarını kullanıcı koduna göre yerel kullanıcılara bağlar"
"Bind by mobile. Binds SSO users to local users by mobile number": "Cep telefonuna göre bağla. SSO kullanıcılarını cep telefonu numarasına göre yerel kullanıcılara bağlar"
"Bind by email. Binds SSO users to local users by email": "E-postaya göre bağla. SSO kullanıcılarını e-posta adresine göre yerel kullanıcılara bağlar"
"Bind by nickname. Binds SSO users to local users by nickname; suitable for internal SSO, not for social networks with many duplicate names": "Takma ada göre bağla. SSO kullanıcılarını takma ada göre yerel kullanıcılara bağlar; kurum içi SSO için uygundur, çok sayıda yinelenen adın bulunduğu sosyal ağlar için uygun değildir"
"Use SSO roles. Keeps SSO roles after sign-in, default true; otherwise DefaultRole is used": "SSO rollerini kullan. Oturum açtıktan sonra SSO rollerini korur, varsayılan true; aksi durumda DefaultRole kullanılır"
"Use SSO departments. Keeps SSO departments after sign-in, default true": "SSO departmanlarını kullan. Oturum açtıktan sonra SSO departmanlarını korur, varsayılan true"
"SSO role rules. Automatically upgrades the primary role after SSO sign-in; separate rules with commas. Format: source role+department wildcard=target role, for example Guest+Route*=Route Specialist": "SSO rol kuralları. SSO ile oturum açtıktan sonra birincil rolü otomatik olarak yükseltir; kuralları virgülle ayırın. Biçim: kaynak rol+departman joker karakteri=hedef rol, örneğin Guest+Route*=Route Specialist"
"Sign out everywhere. false signs out of this site only; true (default) also signs out of the SSO server": "Her yerden oturumu kapat. false yalnızca bu siteden çıkış yapar; true (varsayılan) ayrıca SSO sunucusundan da çıkış yapar"
"Allow multi-device sign-in. false kicks old devices on a new sign-in and revokes all tokens on sign-out; true (default) revokes only the current session": "Birden çok cihazda oturum açmaya izin ver. false, yeni oturum açmada eski cihazları çıkarır ve oturum kapatıldığında tüm tokenleri iptal eder; true (varsayılan) yalnızca geçerli oturumu iptal eder"
"Session timeout. Session lifetime after SSO sign-in during which the cookie can sign in again; default 0s": "Oturum zaman aşımı. SSO ile oturum açtıktan sonra çerezin yeniden oturum açabileceği oturum ömrü; varsayılan 0 sn"
"Token sliding refresh threshold. Refreshes the JWT and rewrites the cookie when its remaining lifetime falls below this many seconds; 0 disables sliding expiration": "Token kayan yenileme eşiği. Kalan ömrü bu saniye sayısının altına düştüğünde JWT'yi yeniler ve çerezi yeniden yazar; 0 kayan süre sonunu devre dışı bırakır"
"User refresh period. Fetches user information once per period across SSO sign-ins, default 600 seconds": "Kullanıcı yenileme dönemi. SSO oturum açmaları arasında kullanıcı bilgilerini dönem başına bir kez getirir, varsayılan 600 saniye"
"JWT secret. Algorithm and key used to sign JWTs, such as HS256:ABCD1234": "JWT gizli anahtarı. JWT imzalamak için kullanılan algoritma ve anahtar, örneğin HS256:ABCD1234"
"Token lifetime. Lifetime of the access token in seconds, default 7200": "Token ömrü. Erişim tokeninin saniye cinsinden ömrü, varsayılan 7200"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default true": "Tokeni çerezde sakla. İstek başlığında token yoksa tokeni çerezden okur, varsayılan true"
"Validate attachment access. Requires sign-in to access attachments, default true": "Ek erişimini doğrula. Eklere erişmek için oturum açmayı zorunlu kılar, varsayılan true"
"Public attachment categories. Categories accessible without sign-in, comma-separated, such as markdown,avatar. Applies when ValidateAttachment is true": "Genel ek kategorileri. Oturum açmadan erişilebilen kategoriler, virgülle ayrılmış, örneğin markdown,avatar. ValidateAttachment true olduğunda geçerlidir"
"Private attachment categories. Categories only the uploader can access, comma-separated. Applies when ValidateAttachment is true": "Özel ek kategorileri. Yalnızca yükleyenin erişebildiği kategoriler, virgülle ayrılmış. ValidateAttachment true olduğunda geçerlidir"
"SSO redirect allowlist. Domains allowed to receive the JWT after sign-in, comma-separated with wildcard prefixes such as *.company.com. Empty allows the same site only; other origins are rejected and sent back to the home page": "SSO yönlendirme izin listesi. Oturum açtıktan sonra JWT almasına izin verilen etki alanları, *.company.com gibi joker öneklerle virgülle ayrılmış. Boş bırakılırsa yalnızca aynı siteye izin verilir; diğer kaynaklar reddedilir ve ana sayfaya geri gönderilir"
"External authentication URL. When local authentication fails, credentials are verified by this endpoint; on success the local user is created or updated and signed in": "Harici kimlik doğrulama URL'si. Yerel kimlik doğrulama başarısız olduğunda kimlik bilgileri bu uç nokta tarafından doğrulanır; başarılı olursa yerel kullanıcı oluşturulur veya güncellenir ve oturum açılır"
"Start page. First content page opened after entering the admin console": "Başlangıç sayfası. Yönetim konsoluna girdikten sonra açılan ilk içerik sayfası"
"Theme. Content page theme, ACE/layui": "Tema. İçerik sayfası teması, ACE/layui"
"Skin. Outer frame layout, ACE/layui": "Kaplama. Dış çerçeve düzeni, ACE/layui"
"Login tip. Empty hides the tip on the sign-in page": "Oturum açma ipucu. Boş bırakılırsa oturum açma sayfasındaki ipucu gizlenir"
"Login logo. Empty uses the default logo": "Oturum açma logosu. Boş bırakılırsa varsayılan logo kullanılır"
"Login background. Image URL; empty uses the default background": "Oturum açma arka planı. Görsel URL'si; boş bırakılırsa varsayılan arka plan kullanılır"
"Form group layout. 3/2/1 columns on large/medium/small screens, form-group col-xs-12 col-sm-6 col-lg-4": "Form grubu düzeni. Büyük/orta/küçük ekranlarda 3/2/1 sütun, form-group col-xs-12 col-sm-6 col-lg-4"
"Bootstrap select. Nicer drop-downs with a rendering cost": "Bootstrap select. İşleme maliyeti karşılığında daha güzel açılır listeler"
"Maximum drop-down items. Maximum options in a related drop-down on forms, default 50; larger lists fall back to a text box": "En fazla açılır liste öğesi. Formlardaki ilişkili açılır listede en fazla seçenek sayısı, varsayılan 50; daha büyük listeler metin kutusuna döner"
"Copyright. Empty hides the copyright; variables now/runtime/framework are supported, and now accepts formats such as {now:yyyy}": "Telif hakkı. Boş bırakılırsa telif hakkı bilgisi gizlenir; now/runtime/framework değişkenleri desteklenir ve now değişkeni {now:yyyy} gibi biçimleri kabul eder"
"Filing number. Empty hides the filing information": "Kayıt numarası. Boş bırakılırsa kayıt bilgisi gizlenir"
"Enable new UI": "Yeni arayüzü etkinleştir"
"ECharts theme. Chart theme": "ECharts teması. Grafik teması"
"Title suffix. Appends the system name to page titles, default true": "Başlık soneki. Sayfa başlıklarına sistem adını ekler, varsayılan true"
"Table double-click. Enables row double-click on list pages, default true": "Tablo çift tıklama. Liste sayfalarında satıra çift tıklamayı etkinleştirir, varsayılan true"
"Table style. Light: minimal thin lines; Standard: clear row lines (default); Grid: full cell borders": "Tablo stili. Açık: en az ince çizgi; Standart: belirgin satır çizgileri (varsayılan); Izgara: tam hücre kenarlıkları"
"Table density. Compact: dense and information-rich (default); Normal: relaxed": "Tablo yoğunluğu. Kompakt: sık ve bilgi yoğun (varsayılan); Normal: ferah"
"Stardust web. Stardust console URL; supports direct links to /trace?id={traceId} or /graph?id={traceId}": "Stardust web. Stardust konsolu URL'si; /trace?id={traceId} veya /graph?id={traceId} bağlantılarını doğrudan destekler"
"AI master switch. Enables AI features such as log analysis and notification polishing, default false": "AI ana anahtarı. Günlük analizi ve bildirim düzenleme gibi AI özelliklerini etkinleştirir, varsayılan false"
"AI provider. Supports NewLife, Ollama, DeepSeek, DashScope, OpenAI and others; default NewLife": "AI sağlayıcısı. NewLife, Ollama, DeepSeek, DashScope, OpenAI ve diğerlerini destekler; varsayılan NewLife"
"AI endpoint. Defaults to https://ai.newlifex.com for NewLife": "AI uç noktası. NewLife için varsayılan https://ai.newlifex.com"
"AI ApiKey. Defaults to sk-CubeAI2026 for NewLife": "AI ApiKey. NewLife için varsayılan sk-CubeAI2026"
"AI default model. Defaults to newlife-flash for NewLife": "AI varsayılan modeli. NewLife için varsayılan newlife-flash"
"AI default deep reasoning. Enables think mode for analysis and chat by default; false means fast responses": "AI varsayılan derin akıl yürütme. Analiz ve sohbet için varsayılan olarak düşünme modunu etkinleştirir; false hızlı yanıtlar anlamına gelir"
"AI color scheme. Fills the primary and secondary colors from a preset": "AI renk düzeni. Birincil ve ikincil renkleri bir ön ayardan doldurur"
"AI primary color. Main color of the launcher, panel header and user bubbles; default NewLife green #2ecc71": "AI birincil rengi. Başlatıcının, panel başlığının ve kullanıcı balonlarının ana rengi; varsayılan NewLife yeşili #2ecc71"
"AI secondary color. Gradient end color, default dark green #1e8e3e": "AI ikincil rengi. Degrade bitiş rengi, varsayılan koyu yeşil #1e8e3e"
"OAuth server. Enables the OAuth 2.0 server that provides SSO for other applications": "OAuth sunucusu. Diğer uygulamalara SSO sağlayan OAuth 2.0 sunucusunu etkinleştirir"
"File manager. Enables backend file management (browse, upload, download, delete); this carries security risks": "Dosya yöneticisi. Arka uçta dosya yönetimini (gözatma, yükleme, indirme, silme) etkinleştirir; bu güvenlik riskleri taşır"
"Multi-tenancy. Enables tenants; tenant mode cannot access system administration and platform mode cannot access tenant pages": "Çoklu kiracılık. Kiracıları etkinleştirir; kiracı modu sistem yönetimine erişemez, platform modu kiracı sayfalarına erişemez"
"Tenant query policy. DenyWithEmpty: return an empty set without tenant context; ThrowOnMissingTenant: throw an explicit error": "Kiracı sorgu ilkesi. DenyWithEmpty: kiracı bağlamı olmadan boş küme döndürür; ThrowOnMissingTenant: açık bir hata fırlatır"
"User online. 0: do not record; 1: signed-in users only; 2: all visitors (default)": "Çevrimiçi kullanıcılar. 0: kaydetme; 1: yalnızca oturum açmış kullanıcılar; 2: tüm ziyaretçiler (varsayılan)"
"User statistics. Records user visits, default true": "Kullanıcı istatistikleri. Kullanıcı ziyaretlerini kaydeder, varsayılan true"
"Enable SMS. SMS verification codes and system notifications, default false": "SMS'i etkinleştir. SMS doğrulama kodları ve sistem bildirimleri, varsayılan false"
"Enable email. Email verification codes and system notifications, default false": "E-postayı etkinleştir. E-posta doğrulama kodları ve sistem bildirimleri, varsayılan false"
"Require email verification. Users must activate their email before signing in and must provide one when registering, default false": "E-posta doğrulaması iste. Kullanıcılar oturum açmadan önce e-postalarını etkinleştirmeli ve kayıt sırasında e-posta sağlamalıdır, varsayılan false"
"Require mobile verification. Users must activate their mobile before signing in and must provide one when registering, default false": "Cep telefonu doğrulaması iste. Kullanıcılar oturum açmadan önce telefonlarını etkinleştirmeli ve kayıt sırasında telefon sağlamalıdır, varsayılan false"
"Captcha scenarios. Bit mask: 0: off; 1: sign-in; 2: registration; 4: verification code requests (anti-SMS-bombing); combine with 3 for sign-in and registration. Mandatory scenarios are never exempted, default 0": "Captcha senaryoları. Bit maskesi: 0: kapalı; 1: oturum açma; 2: kayıt; 4: doğrulama kodu istekleri (SMS bombalama koruması); oturum açma ve kayıt için 3 ile birleştirin. Zorunlu senaryolar hiçbir zaman muaf tutulmaz, varsayılan 0"
"Risk-adaptive captcha. Disabled when CaptchaScene is 0; when enabled it detects unsafe environments and requires a captcha, default true": "Riskeye uyarlanan captcha. CaptchaScene 0 olduğunda devre dışıdır; etkinleştirildiğinde güvenli olmayan ortamları algılar ve captcha ister, varsayılan true"
"Captcha risk threshold. Requires a captcha when the risk score reaches this value: 0: intranet; 1: internet; 2: internet with recent failures; 3: banned. Default 2": "Captcha risk eşiği. Risk puanı bu değere ulaştığında captcha ister: 0: iç ağ; 1: internet; 2: son zamanlarda hata olan internet; 3: yasaklı. Varsayılan 2"
"Trusted device lifetime. Days during which previously successful devices skip adaptive captchas, default 30": "Güvenilen cihaz ömrü. Daha önce başarılı olan cihazların uyarlanabilir captcha'yı atladığı gün sayısı, varsayılan 30"
"Enable MFA. Allows users to enable TOTP multi-factor authentication; an enhanced feature, default false": "MFA'yı etkinleştir. Kullanıcıların TOTP çok faktörlü kimlik doğrulamayı etkinleştirmesine izin verir; gelişmiş bir özellik, varsayılan false"
"File storage serving. Responds to file download requests from other nodes, default true": "Dosya depolama sunumu. Diğer düğümlerden gelen dosya indirme isteklerini yanıtlar, varsayılan true"
"File storage fetch. Pulls new files published by other nodes, default true": "Dosya depolama getirme. Diğer düğümlerin yayımladığı yeni dosyaları çeker, varsayılan true"
"File fetch timeout. Maximum milliseconds to wait for other nodes when a file is missing locally, default 5000": "Dosya getirme zaman aşımı. Dosya yerelde yokken diğer düğümler için beklenecek en fazla milisaniye, varsayılan 5000"
"Attachment storage. Local disk, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu or EasyIO; default Local": "Ek depolama. Yerel disk, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu veya EasyIO; varsayılan Local"
"Object storage server. S3-compatible endpoint for OSS/COS/Qiniu, such as oss-cn-beijing.aliyuncs.com": "Nesne depolama sunucusu. OSS/COS/Qiniu için S3 uyumlu uç nokta, örneğin oss-cn-beijing.aliyuncs.com"
"Object storage bucket. Bucket name for OSS/COS/Qiniu": "Nesne depolama bölmesi. OSS/COS/Qiniu için bölme adı"
"Object storage region. S3 signing scope, such as cn-beijing / ap-beijing / cn-east-1": "Nesne depolama bölgesi. S3 imzalama kapsamı, örneğin cn-beijing / ap-beijing / cn-east-1"
"Object storage app ID. AccessKeyId": "Nesne depolama uygulama kimliği. AccessKeyId"
"Object storage app secret. AccessKeySecret": "Nesne depolama uygulama gizli anahtarı. AccessKeySecret"
"Data retention. Days to keep audit and OAuth logs, default 30": "Veri saklama. Denetim ve OAuth günlüklerinin saklanacağı gün sayısı, varsayılan 30"
"File retention. Days to keep backup files, default 15": "Dosya saklama. Yedek dosyalarının saklanacağı gün sayısı, varsayılan 15"
"Retention size floor. Files smaller than this (KB) are never deleted even after the retention period, default 1024K": "Saklama boyutu alt sınırı. Bu değerden (KB) küçük dosyalar, saklama süresi dolsa bile hiçbir zaman silinmez, varsayılan 1024K"
"Maximum export rows. Maximum rows a page may export, default 10_000_000": "En fazla dışa aktarma satırı. Bir sayfanın dışa aktarabileceği en fazla satır sayısı, varsayılan 10_000_000"
"Maximum backup rows. Maximum rows a page may back up, default 10_000_000": "En fazla yedekleme satırı. Bir sayfanın yedekleyebileceği en fazla satır sayısı, varsayılan 10_000_000"
"API prefixes. Comma- or semicolon-separated prefixes such as /api,/api/v1; matching requests are forwarded to the real route without the prefix": "API önekleri. /api,/api/v1 gibi virgül veya noktalı virgülle ayrılmış önekler; eşleşen istekler önek olmadan gerçek rotaya iletilir"
"Password strength. * means unrestricted; by default at least 8 characters with digits, upper/lower case letters and symbols. Simple form: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$": "Parola gücü. * sınırsız anlamına gelir; varsayılan olarak en az 8 karakter olmalı ve rakam, büyük/küçük harf ile simge içermelidir. Basit biçim: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$"
"Cookie mode. Default SameSite mode for token cookies (-1 Unspecified, 0 None, 1 Lax, 2 Strict)": "Çerez modu. Token çerezleri için varsayılan SameSite modu (-1 Unspecified, 0 None, 1 Lax, 2 Strict)"
"Cookie domain. Writes cookies to a parent domain; empty uses the current domain. A top-level domain requires HTTPS and prevents plain HTTP from writing same-name keys on the local domain": "Çerez etki alanı. Çerezleri üst etki alanına yazar; boş bırakılırsa geçerli etki alanı kullanılır. Üst düzey bir etki alanı HTTPS gerektirir ve düz HTTP'nin yerel etki alanında aynı adlı anahtarları yazmasını engeller"
"Activation URL. Front-end activation page URL used in email activation links, such as https://xxx/activate; empty builds /activate from the request host": "Etkinleştirme URL'si. E-posta etkinleştirme bağlantılarında kullanılan ön uç etkinleştirme sayfası URL'si, örneğin https://xxx/activate; boş bırakılırsa istek ana makinesinden /activate oluşturulur"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default false": "Tokeni çerezde sakla. İstek başlığında token yoksa tokeni çerezden okur, varsayılan false"
"Password strength. * means unrestricted; the simple form defaults to 5 to 32 characters of any type. The full form requires at least 8 characters with digits, upper/lower case letters and symbols: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$": "Parola gücü. * sınırsız anlamına gelir; basit biçim varsayılan olarak her türden 5 ila 32 karakter kabul eder. Tam biçim en az 8 karakter olmasını ve rakam, büyük/küçük harf ile simge içermesini gerektirir: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$"
"General": "Genel"
