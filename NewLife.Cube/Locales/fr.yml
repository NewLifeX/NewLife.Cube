"Field values as a JSON string, keyed by field name": "Valeurs des champs sous forme de chaîne JSON, avec le nom du champ comme clé"
"No valid field value dictionary was received": "Aucun dictionnaire de valeurs de champs valide n'a été reçu"
"[fill_form invalid argument] No valid field value dictionary was received. Call get_form_schema first to get the field structure, then pass the values parameter as {\"field\":value}.": "[fill_form argument non valide] Aucun dictionnaire de valeurs de champs valide n'a été reçu. Appelez d'abord get_form_schema pour obtenir la structure des champs, puis passez le paramètre values sous la forme {\"champ\":valeur}."
"Generated {0} form field values (skipped {1}, failed {2}) and filled them into the form. Ask the user to review before submitting.": "Génération de {0} valeurs de champs (ignorées {1}, échouées {2}) et remplissage du formulaire effectués. Demandez à l'utilisateur de les vérifier avant l'envoi."
" descending": " décroissant"
