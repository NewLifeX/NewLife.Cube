# 设置页字段、分类与导航（中文源文经英文规范键翻译）
"Auto (follow system)": "Automatique (suivre le système)"
"Cancel": "Annuler"
"Queries {0}, executes {1}, elapsed {2:n0} ms": "Requêtes {0}, exécutions {1}, durée {2:n0} ms"
"Show run time": "Afficher le temps d'exécution"
"Avatar directory. Downloads remote avatars locally; defaults to the Avatars subdirectory, or Avatars next to the web root. Empty disables downloading": "Répertoire des avatars. Télécharge localement les avatars distants ; par défaut le sous-répertoire Avatars, ou Avatars à côté de la racine web. Vide désactive le téléchargement"
"Text avatar characters. Generates an SVG text avatar when no image exists; 1 to 3 characters. Uses the first N Chinese characters to keep the surname, or the initials of English words. Default 2": "Caractères de l'avatar textuel. Génère un avatar textuel SVG lorsqu'aucune image n'existe ; de 1 à 3 caractères. Utilise les N premiers caractères chinois pour conserver le nom de famille, ou les initiales des mots anglais. Par défaut 2"
"Upload directory. Defaults to Uploads": "Répertoire de téléversement. Par défaut : Uploads"
"Web root directory. Defaults to wwwroot": "Répertoire racine web. Par défaut : wwwroot"
"Resource URL. CDN base such as https://sso.newlifex.com/content/; empty uses local resources": "URL des ressources. Base CDN, par exemple https://sso.newlifex.com/content/ ; vide utilise les ressources locales"
"CORS origins. Other origins allowed to access this site; * allows any origin": "Origines CORS. Autres origines autorisées à accéder à ce site ; * autorise toutes les origines"
"Iframe embedding. Empty allows the same domain only; SAMEORIGIN allows the same domain and port; ALLOWALL allows any domain": "Intégration en iframe. Vide n'autorise que le même domaine ; SAMEORIGIN autorise le même domaine et le même port ; ALLOWALL autorise tous les domaines"
"Share expiration. Lifetime of share tokens in seconds, default 7200": "Expiration du partage. Durée de vie des jetons de partage en secondes, par défaut 7200"
"Bot error code. Returns this error for crawlers, such as 404/500; 0 disables blocking": "Code d'erreur pour les robots. Renvoie cette erreur aux robots d'exploration, par exemple 404/500 ; 0 désactive le blocage"
"Force redirect. Target scheme and host for GET requests; * is supported in the host. Commonly used to force HTTPS, such as https://*:8081": "Redirection forcée. Schéma et hôte de destination des requêtes GET ; * est pris en charge dans l'hôte. Sert couramment à forcer HTTPS, par exemple https://*:8081"
"Security mode. 0: off; 1: observe and log only; 2: block; 3: automatic (default; observes, bans repeated attackers, and temporarily blocks broad attacks with automatic rollback)": "Mode de sécurité. 0 : désactivé ; 1 : observation et journalisation uniquement ; 2 : blocage ; 3 : automatique (par défaut ; observe, bannit les attaquants récidivistes et bloque temporairement les attaques massives avec retour automatique)"
"Auto-ban durations. Comma-separated seconds that increase with each trigger; empty uses 60,300,1800,7200,86400": "Durées de bannissement automatique. Secondes séparées par des virgules qui augmentent à chaque déclenchement ; vide utilise 60,300,1800,7200,86400"
"Trusted proxies. Forwarded headers are only trusted from these comma-separated IPs or CIDR ranges; empty keeps the legacy behavior of trusting all forwarded headers": "Proxys de confiance. Seuls les en-têtes transférés de ces IP ou plages CIDR séparées par des virgules sont approuvés ; vide conserve l'ancien comportement consistant à approuver tous les en-têtes transférés"
"Trusted proxy learning limit. When no trusted proxies are configured, private direct sources that send forwarded headers are learned up to this count; 0 disables learning (typically 2 for one data center, 4 for two)": "Limite d'apprentissage des proxys de confiance. Lorsqu'aucun proxy de confiance n'est configuré, les sources privées directes envoyant des en-têtes transférés sont apprises jusqu'à ce nombre ; 0 désactive l'apprentissage (en général 2 pour un centre de données, 4 pour deux)"
"Learned proxies. Maintained automatically; clear it to reset the learned list": "Proxys appris. Maintenus automatiquement ; videz la liste pour la réinitialiser"
"Default role. Defaults to the Normal User role": "Rôle par défaut. Par défaut : le rôle Utilisateur normal"
"Allow password sign-in. Allows signing in with a username and password": "Autoriser la connexion par mot de passe. Autorise la connexion avec un nom d'utilisateur et un mot de passe"
"Allow plain-text passwords. Default true for legacy clients; false forces Challenge-Response encrypted passwords": "Autoriser les mots de passe en clair. Par défaut true pour les anciens clients ; false impose des mots de passe chiffrés par Challenge-Response"
"Allow registration. Allows registering with a username and password": "Autoriser l'inscription. Autorise l'inscription avec un nom d'utilisateur et un mot de passe"
"Auto registration. Default true; after SSO sign-in an unknown local user is registered automatically. Enabled when either the global or the OAuth app setting is on": "Inscription automatique. Par défaut true ; après une connexion SSO, un utilisateur local inconnu est inscrit automatiquement. Activé lorsque le paramètre global ou celui de l'application OAuth est activé"
"Password complexity check. When enabled the sign-in page validates password strength; when disabled it only requires a non-empty password. Default true": "Vérification de la complexité du mot de passe. Lorsqu'elle est activée, la page de connexion valide la robustesse du mot de passe ; lorsqu'elle est désactivée, elle exige seulement un mot de passe non vide. Par défaut true"
"Login failure limit. Bans sign-in after this many consecutive failures for the same user or IP, default 5": "Limite d'échecs de connexion. Bannit la connexion après ce nombre d'échecs consécutifs pour le même utilisateur ou la même IP, par défaut 5"
"Login ban duration. Seconds a risk-control ban lasts, default 300": "Durée du bannissement de connexion. Secondes pendant lesquelles dure un bannissement de contrôle des risques, par défaut 300"
"Class C subnet ban threshold. Bans a /24 subnet such as 103.125.146.* after this many failures, default 10; 0 disables": "Seuil de bannissement du sous-réseau de classe C. Bannit un sous-réseau /24 tel que 103.125.146.* après ce nombre d'échecs, par défaut 10 ; 0 le désactive"
"Class B subnet ban threshold. Bans a /16 subnet such as 103.125.*.* after this many failures, default 20; 0 disables": "Seuil de bannissement du sous-réseau de classe B. Bannit un sous-réseau /16 tel que 103.125.*.* après ce nombre d'échecs, par défaut 20 ; 0 le désactive"
"Force bind by user name. Binds SSO users to local users with the same name without a provider prefix; intended for user centers": "Forcer la liaison par nom d'utilisateur. Lie les utilisateurs SSO aux utilisateurs locaux portant le même nom sans préfixe de fournisseur ; destiné aux centres d'utilisateurs"
"Bind by user code. Binds SSO users to local users by user code": "Lier par code utilisateur. Lie les utilisateurs SSO aux utilisateurs locaux par code utilisateur"
"Bind by mobile. Binds SSO users to local users by mobile number": "Lier par mobile. Lie les utilisateurs SSO aux utilisateurs locaux par numéro de mobile"
"Bind by email. Binds SSO users to local users by email": "Lier par e-mail. Lie les utilisateurs SSO aux utilisateurs locaux par e-mail"
"Bind by nickname. Binds SSO users to local users by nickname; suitable for internal SSO, not for social networks with many duplicate names": "Lier par pseudonyme. Lie les utilisateurs SSO aux utilisateurs locaux par pseudonyme ; adapté au SSO interne, pas aux réseaux sociaux où les noms sont souvent dupliqués"
"Use SSO roles. Keeps SSO roles after sign-in, default true; otherwise DefaultRole is used": "Utiliser les rôles SSO. Conserve les rôles SSO après la connexion, par défaut true ; sinon DefaultRole est utilisé"
"Use SSO departments. Keeps SSO departments after sign-in, default true": "Utiliser les départements SSO. Conserve les départements SSO après la connexion, par défaut true"
"SSO role rules. Automatically upgrades the primary role after SSO sign-in; separate rules with commas. Format: source role+department wildcard=target role, for example Guest+Route*=Route Specialist": "Règles de rôles SSO. Met automatiquement à niveau le rôle principal après la connexion SSO ; séparez les règles par des virgules. Format : rôle source+caractère générique de département=rôle cible, par exemple Guest+Route*=Route Specialist"
"Sign out everywhere. false signs out of this site only; true (default) also signs out of the SSO server": "Déconnexion partout. false déconnecte uniquement de ce site ; true (par défaut) déconnecte aussi du serveur SSO"
"Allow multi-device sign-in. false kicks old devices on a new sign-in and revokes all tokens on sign-out; true (default) revokes only the current session": "Autoriser la connexion multi-appareils. false déconnecte les anciens appareils lors d'une nouvelle connexion et révoque tous les jetons à la déconnexion ; true (par défaut) ne révoque que la session en cours"
"Session timeout. Session lifetime after SSO sign-in during which the cookie can sign in again; default 0s": "Expiration de session. Durée de la session après une connexion SSO pendant laquelle le cookie peut reconnecter ; par défaut 0 s"
"Token sliding refresh threshold. Refreshes the JWT and rewrites the cookie when its remaining lifetime falls below this many seconds; 0 disables sliding expiration": "Seuil d'actualisation glissante du jeton. Actualise le JWT et réécrit le cookie lorsque sa durée de vie restante descend sous ce nombre de secondes ; 0 désactive l'expiration glissante"
"User refresh period. Fetches user information once per period across SSO sign-ins, default 600 seconds": "Période de rafraîchissement de l'utilisateur. Récupère les informations utilisateur une fois par période entre les connexions SSO, par défaut 600 secondes"
"JWT secret. Algorithm and key used to sign JWTs, such as HS256:ABCD1234": "Secret JWT. Algorithme et clé utilisés pour signer les JWT, par exemple HS256:ABCD1234"
"Token lifetime. Lifetime of the access token in seconds, default 7200": "Durée de vie du jeton. Durée de vie du jeton d'accès en secondes, par défaut 7200"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default true": "Stocker le jeton dans un cookie. Lit le jeton dans le cookie lorsque l'en-tête de la requête n'en contient pas, par défaut true"
"Validate attachment access. Requires sign-in to access attachments, default true": "Valider l'accès aux pièces jointes. Exige une connexion pour accéder aux pièces jointes, par défaut true"
"Public attachment categories. Categories accessible without sign-in, comma-separated, such as markdown,avatar. Applies when ValidateAttachment is true": "Catégories de pièces jointes publiques. Catégories accessibles sans connexion, séparées par des virgules, par exemple markdown,avatar. S'applique lorsque ValidateAttachment est true"
"Private attachment categories. Categories only the uploader can access, comma-separated. Applies when ValidateAttachment is true": "Catégories de pièces jointes privées. Catégories accessibles uniquement à l'auteur du téléversement, séparées par des virgules. S'applique lorsque ValidateAttachment est true"
"SSO redirect allowlist. Domains allowed to receive the JWT after sign-in, comma-separated with wildcard prefixes such as *.company.com. Empty allows the same site only; other origins are rejected and sent back to the home page": "Liste d'autorisation des redirections SSO. Domaines autorisés à recevoir le JWT après la connexion, séparés par des virgules avec des préfixes génériques tels que *.company.com. Vide n'autorise que le même site ; les autres origines sont rejetées et renvoyées vers la page d'accueil"
"External authentication URL. When local authentication fails, credentials are verified by this endpoint; on success the local user is created or updated and signed in": "URL d'authentification externe. En cas d'échec de l'authentification locale, les identifiants sont vérifiés par ce point de terminaison ; en cas de succès, l'utilisateur local est créé ou mis à jour puis connecté"
"Start page. First content page opened after entering the admin console": "Page de démarrage. Première page de contenu ouverte après l'entrée dans la console d'administration"
"Theme. Content page theme, ACE/layui": "Thème. Thème des pages de contenu, ACE/layui"
"Skin. Outer frame layout, ACE/layui": "Habillage. Disposition du cadre extérieur, ACE/layui"
"Login tip. Empty hides the tip on the sign-in page": "Message de connexion. Vide masque le message sur la page de connexion"
"Login logo. Empty uses the default logo": "Logo de connexion. Vide utilise le logo par défaut"
"Login background. Image URL; empty uses the default background": "Arrière-plan de connexion. URL de l'image ; vide utilise l'arrière-plan par défaut"
"Form group layout. 3/2/1 columns on large/medium/small screens, form-group col-xs-12 col-sm-6 col-lg-4": "Disposition des groupes de formulaire. 3/2/1 colonnes sur les écrans grands/moyens/petits, form-group col-xs-12 col-sm-6 col-lg-4"
"Bootstrap select. Nicer drop-downs with a rendering cost": "Select Bootstrap. Listes déroulantes plus esthétiques au prix d'un coût de rendu"
"Maximum drop-down items. Maximum options in a related drop-down on forms, default 50; larger lists fall back to a text box": "Nombre maximal d'éléments déroulants. Nombre maximal d'options dans une liste déroulante liée des formulaires, par défaut 50 ; les listes plus grandes basculent vers une zone de texte"
"Copyright. Empty hides the copyright; variables now/runtime/framework are supported, and now accepts formats such as {now:yyyy}": "Copyright. Vide masque le copyright ; les variables now/runtime/framework sont prises en charge, et now accepte des formats tels que {now:yyyy}"
"Filing number. Empty hides the filing information": "Numéro d'enregistrement. Vide masque les informations d'enregistrement"
"Enable new UI": "Activer la nouvelle interface"
"ECharts theme. Chart theme": "Thème ECharts. Thème des graphiques"
"Title suffix. Appends the system name to page titles, default true": "Suffixe de titre. Ajoute le nom du système aux titres des pages, par défaut true"
"Table double-click. Enables row double-click on list pages, default true": "Double-clic sur le tableau. Active le double-clic sur les lignes des pages de liste, par défaut true"
"Table style. Light: minimal thin lines; Standard: clear row lines (default); Grid: full cell borders": "Style de tableau. Léger : lignes fines minimalistes ; Standard : lignes de séparation nettes (par défaut) ; Grille : bordures de cellule complètes"
"Table density. Compact: dense and information-rich (default); Normal: relaxed": "Densité du tableau. Compact : dense et riche en informations (par défaut) ; Normal : aéré"
"Stardust web. Stardust console URL; supports direct links to /trace?id={traceId} or /graph?id={traceId}": "Web Stardust. URL de la console Stardust ; prend en charge les liens directs vers /trace?id={traceId} ou /graph?id={traceId}"
"AI master switch. Enables AI features such as log analysis and notification polishing, default false": "Interrupteur principal de l'IA. Active les fonctions d'IA telles que l'analyse des journaux et l'amélioration des notifications, par défaut false"
"AI provider. Supports NewLife, Ollama, DeepSeek, DashScope, OpenAI and others; default NewLife": "Fournisseur d'IA. Prend en charge NewLife, Ollama, DeepSeek, DashScope, OpenAI et d'autres ; par défaut NewLife"
"AI endpoint. Defaults to https://ai.newlifex.com for NewLife": "Point de terminaison d'IA. Par défaut https://ai.newlifex.com pour NewLife"
"AI ApiKey. Defaults to sk-CubeAI2026 for NewLife": "ApiKey d'IA. Par défaut sk-CubeAI2026 pour NewLife"
"AI default model. Defaults to newlife-flash for NewLife": "Modèle d'IA par défaut. Par défaut newlife-flash pour NewLife"
"AI default deep reasoning. Enables think mode for analysis and chat by default; false means fast responses": "Raisonnement approfondi d'IA par défaut. Active le mode think pour l'analyse et le chat par défaut ; false signifie des réponses rapides"
"AI color scheme. Fills the primary and secondary colors from a preset": "Jeu de couleurs de l'IA. Remplit les couleurs primaire et secondaire à partir d'un préréglage"
"AI primary color. Main color of the launcher, panel header and user bubbles; default NewLife green #2ecc71": "Couleur primaire de l'IA. Couleur principale du lanceur, de l'en-tête du panneau et des bulles utilisateur ; par défaut le vert NewLife #2ecc71"
"AI secondary color. Gradient end color, default dark green #1e8e3e": "Couleur secondaire de l'IA. Couleur de fin du dégradé, par défaut vert foncé #1e8e3e"
"OAuth server. Enables the OAuth 2.0 server that provides SSO for other applications": "Serveur OAuth. Active le serveur OAuth 2.0 qui fournit le SSO aux autres applications"
"File manager. Enables backend file management (browse, upload, download, delete); this carries security risks": "Gestionnaire de fichiers. Active la gestion des fichiers du back-office (parcourir, téléverser, télécharger, supprimer) ; cela présente des risques de sécurité"
"Multi-tenancy. Enables tenants; tenant mode cannot access system administration and platform mode cannot access tenant pages": "Multi-location. Active les locataires ; le mode locataire ne peut pas accéder à l'administration système et le mode plateforme ne peut pas accéder aux pages des locataires"
"Tenant query policy. DenyWithEmpty: return an empty set without tenant context; ThrowOnMissingTenant: throw an explicit error": "Stratégie de requête des locataires. DenyWithEmpty : renvoie un ensemble vide sans contexte de locataire ; ThrowOnMissingTenant : lève une erreur explicite"
"User online. 0: do not record; 1: signed-in users only; 2: all visitors (default)": "Utilisateurs en ligne. 0 : ne pas enregistrer ; 1 : utilisateurs connectés uniquement ; 2 : tous les visiteurs (par défaut)"
"User statistics. Records user visits, default true": "Statistiques des utilisateurs. Enregistre les visites des utilisateurs, par défaut true"
"Enable SMS. SMS verification codes and system notifications, default false": "Activer les SMS. Codes de vérification par SMS et notifications système, par défaut false"
"Enable email. Email verification codes and system notifications, default false": "Activer l'e-mail. Codes de vérification par e-mail et notifications système, par défaut false"
"Require email verification. Users must activate their email before signing in and must provide one when registering, default false": "Exiger la vérification de l'e-mail. Les utilisateurs doivent activer leur e-mail avant de se connecter et doivent en fournir un lors de l'inscription, par défaut false"
"Require mobile verification. Users must activate their mobile before signing in and must provide one when registering, default false": "Exiger la vérification du mobile. Les utilisateurs doivent activer leur mobile avant de se connecter et doivent en fournir un lors de l'inscription, par défaut false"
"Captcha scenarios. Bit mask: 0: off; 1: sign-in; 2: registration; 4: verification code requests (anti-SMS-bombing); combine with 3 for sign-in and registration. Mandatory scenarios are never exempted, default 0": "Scénarios de captcha. Masque de bits : 0 : désactivé ; 1 : connexion ; 2 : inscription ; 4 : demandes de code de vérification (anti-bombardement SMS) ; combinez avec 3 pour connexion et inscription. Les scénarios obligatoires ne sont jamais exemptés, par défaut 0"
"Risk-adaptive captcha. Disabled when CaptchaScene is 0; when enabled it detects unsafe environments and requires a captcha, default true": "Captcha adaptatif au risque. Désactivé lorsque CaptchaScene vaut 0 ; une fois activé, il détecte les environnements non sûrs et exige un captcha, par défaut true"
"Captcha risk threshold. Requires a captcha when the risk score reaches this value: 0: intranet; 1: internet; 2: internet with recent failures; 3: banned. Default 2": "Seuil de risque du captcha. Exige un captcha lorsque le score de risque atteint cette valeur : 0 : intranet ; 1 : internet ; 2 : internet avec échecs récents ; 3 : banni. Par défaut 2"
"Trusted device lifetime. Days during which previously successful devices skip adaptive captchas, default 30": "Durée de vie des appareils de confiance. Nombre de jours pendant lesquels les appareils déjà connectés avec succès évitent les captchas adaptatifs, par défaut 30"
"Enable MFA. Allows users to enable TOTP multi-factor authentication; an enhanced feature, default false": "Activer MFA. Permet aux utilisateurs d'activer l'authentification multifacteur TOTP ; fonction avancée, par défaut false"
"File storage serving. Responds to file download requests from other nodes, default true": "Service de stockage de fichiers. Répond aux demandes de téléchargement de fichiers des autres nœuds, par défaut true"
"File storage fetch. Pulls new files published by other nodes, default true": "Récupération du stockage de fichiers. Récupère les nouveaux fichiers publiés par les autres nœuds, par défaut true"
"File fetch timeout. Maximum milliseconds to wait for other nodes when a file is missing locally, default 5000": "Délai de récupération des fichiers. Nombre maximal de millisecondes d'attente des autres nœuds lorsqu'un fichier est absent localement, par défaut 5000"
"Attachment storage. Local disk, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu or EasyIO; default Local": "Stockage des pièces jointes. Disque local, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu ou EasyIO ; par défaut Local"
"Object storage server. S3-compatible endpoint for OSS/COS/Qiniu, such as oss-cn-beijing.aliyuncs.com": "Serveur de stockage d'objets. Point de terminaison compatible S3 pour OSS/COS/Qiniu, par exemple oss-cn-beijing.aliyuncs.com"
"Object storage bucket. Bucket name for OSS/COS/Qiniu": "Bucket de stockage d'objets. Nom du bucket pour OSS/COS/Qiniu"
"Object storage region. S3 signing scope, such as cn-beijing / ap-beijing / cn-east-1": "Région du stockage d'objets. Portée de signature S3, par exemple cn-beijing / ap-beijing / cn-east-1"
"Object storage app ID. AccessKeyId": "ID d'application du stockage d'objets. AccessKeyId"
"Object storage app secret. AccessKeySecret": "Secret d'application du stockage d'objets. AccessKeySecret"
"Data retention. Days to keep audit and OAuth logs, default 30": "Conservation des données. Jours de conservation des journaux d'audit et OAuth, par défaut 30"
"File retention. Days to keep backup files, default 15": "Conservation des fichiers. Jours de conservation des fichiers de sauvegarde, par défaut 15"
"Retention size floor. Files smaller than this (KB) are never deleted even after the retention period, default 1024K": "Taille minimale de conservation. Les fichiers plus petits que cette taille (Ko) ne sont jamais supprimés, même après la période de conservation, par défaut 1024K"
"Maximum export rows. Maximum rows a page may export, default 10_000_000": "Nombre maximal de lignes à exporter. Nombre maximal de lignes qu'une page peut exporter, par défaut 10_000_000"
"Maximum backup rows. Maximum rows a page may back up, default 10_000_000": "Nombre maximal de lignes à sauvegarder. Nombre maximal de lignes qu'une page peut sauvegarder, par défaut 10_000_000"
"API prefixes. Comma- or semicolon-separated prefixes such as /api,/api/v1; matching requests are forwarded to the real route without the prefix": "Préfixes d'API. Préfixes séparés par des virgules ou des points-virgules tels que /api,/api/v1 ; les requêtes correspondantes sont transmises à la route réelle sans le préfixe"
"Cookie mode. Default SameSite mode for token cookies (-1 Unspecified, 0 None, 1 Lax, 2 Strict)": "Mode de cookie. Mode SameSite par défaut des cookies de jeton (-1 Unspecified, 0 None, 1 Lax, 2 Strict)"
"Cookie domain. Writes cookies to a parent domain; empty uses the current domain. A top-level domain requires HTTPS and prevents plain HTTP from writing same-name keys on the local domain": "Domaine de cookie. Écrit les cookies sur un domaine parent ; vide utilise le domaine actuel. Un domaine de premier niveau exige HTTPS et empêche le HTTP simple d'écrire des clés de même nom sur le domaine local"
"Activation URL. Front-end activation page URL used in email activation links, such as https://xxx/activate; empty builds /activate from the request host": "URL d'activation. URL de la page d'activation front-end utilisée dans les liens d'activation par e-mail, par exemple https://xxx/activate ; vide construit /activate à partir de l'hôte de la requête"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default false": "Stocker le jeton dans un cookie. Lit le jeton dans le cookie lorsque l'en-tête de la requête n'en contient pas, par défaut false"
