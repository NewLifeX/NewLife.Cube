"Generated {0} configuration field values (skipped {1}, failed {2}) and filled them into the form. Ask the user to review before submitting.": "Génération de {0} valeurs de champs de configuration (ignorées {1}, échouées {2}) et remplissage du formulaire effectués. Demandez à l'utilisateur de les vérifier avant l'envoi."
"The current page is a system configuration form (such as Cube settings); you can help review and fill in configuration items.": "La page actuelle est un formulaire de configuration système (par exemple les paramètres de Cube) ; vous pouvez aider à vérifier et à renseigner les éléments de configuration."
"Available tools: get_form_schema / fill_form / get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "Outils disponibles : get_form_schema / fill_form / get_page_context / get_system_info / run_js (voir les définitions de fonctions ; appelez-les si nécessaire)"
"2. When the user asks to create, fill in or complete configuration, call get_form_schema first to inspect the items, then call fill_form to generate values (invent reasonable values for empty writable fields, keep existing values unless the user asks otherwise, and never fabricate or modify sensitive settings such as ApiKey/Secret/Token); finally ask the user to review before submitting": "2. Lorsque l'utilisateur demande de créer, de remplir ou de compléter la configuration, appelez d'abord get_form_schema pour inspecter les éléments, puis fill_form pour générer les valeurs (inventez des valeurs raisonnables pour les champs modifiables vides, conservez les valeurs existantes sauf demande contraire de l'utilisateur, et ne fabriquez ni ne modifiez jamais de réglages sensibles tels que ApiKey/Secret/Token) ; demandez enfin à l'utilisateur de vérifier avant l'envoi"
"3. When the user asks about the content or current state of the page, call get_page_context, then give your analysis and conclusion": "3. Lorsque l'utilisateur pose une question sur le contenu ou l'état actuel de la page, appelez get_page_context, puis donnez votre analyse et votre conclusion"
"4. When the user asks about system status or diagnostics, call get_system_info": "4. Lorsque l'utilisateur s'interroge sur l'état du système ou les diagnostics, appelez get_system_info"
"5. When the user asks to read or operate page elements, you may call run_js; explain any write operation (changing page content, submitting forms) to the user before running it": "5. Lorsque l'utilisateur demande à lire ou à manipuler des éléments de la page, vous pouvez appeler run_js ; expliquez à l'utilisateur toute opération d'écriture (modification du contenu de la page, envoi de formulaires) avant de l'exécuter"
"6. Never invent data; ask the user for clarification when information is insufficient": "6. N'inventez jamais de données ; demandez des précisions à l'utilisateur lorsque les informations sont insuffisantes"
"The tenant identifier carried by user [{0}] is invalid or unavailable. Check the tenant settings and try again.": "L'identifiant de locataire porté par l'utilisateur [{0}] est invalide ou indisponible. Vérifiez les paramètres du locataire et réessayez."
"User [{0}] did not carry a tenant identifier, so the tenant cannot be determined. Include the tenant information and try again.": "L'utilisateur [{0}] ne porte pas d'identifiant de locataire, le locataire ne peut donc pas être déterminé. Ajoutez les informations de locataire et réessayez."
"User [{0}] is not allowed to access the data of the current tenant. Switch tenant and try again.": "L'utilisateur [{0}] n'est pas autorisé à accéder aux données du locataire actuel. Changez de locataire et réessayez."
