"There are {0} users online, exceeding the {1}-day record of {2} (threshold {3:0}). This may be a campaign, a crawler scan or abnormal traffic; check the online list and sign-in log.": "Il y a {0} utilisateurs en ligne, ce qui dépasse le record de {1} jours de {2} (seuil {3:0}). Il peut s'agir d'une campagne, d'un scan de robots ou d'un trafic anormal ; consultez la liste des utilisateurs en ligne et le journal des connexions."
"Record of the last {0} days: {1}": "Record des {0} derniers jours : {1}"
"Cube admin console": "Console d'administration Cube"
"You are the AI assistant of {0}, helping an administrator work on the current page.": "Vous êtes l'assistant IA de {0} et vous aidez un administrateur à travailler sur la page actuelle."
"The current page is not an entity data page (it may be system settings, the home page or system information), so there is no entity table context.": "La page actuelle n'est pas une page de données d'entité (il peut s'agir des paramètres système, de la page d'accueil ou des informations système), il n'y a donc pas de contexte de table d'entité."
"Available tools: get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "Outils disponibles : get_page_context / get_system_info / run_js (voir les définitions de fonctions ; appelez-les si nécessaire)"
"Rules:": "Règles :"
"1. Answer in the same language as the user's question, concisely and professionally": "1. Répondez dans la même langue que la question de l'utilisateur, de manière concise et professionnelle"
"2. When the user asks about the content, data or structure of the current page, call get_page_context to collect the page context from the user's browser, then give your analysis and conclusion": "2. Lorsque l'utilisateur pose une question sur le contenu, les données ou la structure de la page actuelle, appelez get_page_context pour collecter le contexte de la page depuis le navigateur de l'utilisateur, puis donnez votre analyse et votre conclusion"
"3. When the user asks about system status or diagnostics, call get_system_info, then give conclusions and suggestions": "3. Lorsque l'utilisateur s'interroge sur l'état du système ou les diagnostics, appelez get_system_info, puis donnez des conclusions et des suggestions"
"4. When the user asks to read or operate elements of the current page (fill inputs, click buttons, read titles and so on), you may call run_js; the script runs in the user's current page and may use document.querySelector to locate elements; explain any write operation (changing page content, submitting forms) to the user before running it": "4. Lorsque l'utilisateur demande à lire ou à manipuler des éléments de la page actuelle (remplir des champs, cliquer sur des boutons, lire des titres, etc.), vous pouvez appeler run_js ; le script s'exécute dans la page actuelle de l'utilisateur et peut utiliser document.querySelector pour localiser des éléments ; expliquez à l'utilisateur toute opération d'écriture (modification du contenu de la page, envoi de formulaires) avant de l'exécuter"
"5. Never invent data; ask the user for clarification when information is insufficient": "5. N'inventez jamais de données ; demandez des précisions à l'utilisateur lorsque les informations sont insuffisantes"
"AI service is not registered": "Le service IA n'est pas enregistré"
"AI": "IA"
"AI chat": "Chat IA"
"Browser operation result callback": "Rappel du résultat de l'opération du navigateur"
"...[truncated]": "...[tronqué]"
"AI is not enabled. Turn on AISwitch in system settings.": "L'IA n'est pas activée. Activez AISwitch dans les paramètres système."
"AI call failed: {0}": "Échec de l'appel IA : {0}"
"Data:": "Données :"
"You are a system operations expert. Based on the following runtime metrics, produce a health diagnosis report:\nCover bottlenecks, whether capacity should be expanded, and any risks worth attention.\nOutput the diagnosis report directly without extra explanation.": "Vous êtes un expert en exploitation de systèmes. À partir des métriques d'exécution suivantes, produisez un rapport de diagnostic de santé :\nTraitez les goulets d'étranglement, l'opportunité d'étendre la capacité et les risques à surveiller.\nAffichez directement le rapport de diagnostic, sans explication supplémentaire."
"Script must not be empty": "Le script ne doit pas être vide"
"Browser channel is not ready (Writer not injected)": "Le canal du navigateur n'est pas prêt (Writer non injecté)"
"Run page script": "Exécuter le script de la page"
"Runs JavaScript in the current page and returns the result; can read or modify page elements, for example document.title or document.querySelector('input[name=Name]').value": "Exécute du JavaScript dans la page actuelle et renvoie le résultat ; peut lire ou modifier des éléments de la page, par exemple document.title ou document.querySelector('input[name=Name]').value"
"JavaScript code to run in the current page": "Code JavaScript à exécuter dans la page actuelle"
"Get page context": "Obtenir le contexte de la page"
"Gets the main data and structure of the current page (title, tables, forms and so on). Uses the server-side context when the page provides one; otherwise collects the page content from the user's browser": "Obtient les données et la structure principales de la page actuelle (titre, tableaux, formulaires, etc.). Utilise le contexte côté serveur lorsque la page en fournit un ; sinon, collecte le contenu de la page depuis le navigateur de l'utilisateur"
"Get form schema": "Obtenir le schéma du formulaire"
"Gets the schema of the current form, including field names, types, descriptions and current values, for generating form values": "Obtient le schéma du formulaire actuel, notamment les noms de champs, les types, les descriptions et les valeurs actuelles, afin de générer les valeurs du formulaire"
"Form mode: add or edit": "Mode du formulaire : ajout ou modification"
"Fill form": "Remplir le formulaire"
