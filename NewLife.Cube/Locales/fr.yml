"每天定时汇总过去 24 小时的系统日志，由 AI 生成摘要后通过通知系统推送给管理员": "Résume chaque jour les journaux système des dernières 24 heures et envoie le résumé généré par IA aux administrateurs"
"You are an information security expert. Based on the following security data, write a weekly security report covering:\n1. Overall security posture\n2. Risks that need attention\n3. Recommended security measures\n\nOutput the report directly without extra explanation.": "Vous êtes un expert en sécurité de l'information. À partir des données de sécurité suivantes, rédigez un rapport de sécurité hebdomadaire couvrant :\n1. La posture de sécurité globale\n2. Les risques nécessitant une attention particulière\n3. Les mesures de sécurité recommandées\n\nAffichez directement le rapport, sans explication supplémentaire."
