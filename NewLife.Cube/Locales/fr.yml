"Record does not exist": "L'enregistrement n'existe pas"
"Get data context": "Obtenir le contexte des données"
"Gets the data context of the current page: the current record with its field metadata, or a summary and sample of the current query result, for analysis": "Obtient le contexte des données de la page actuelle : l'enregistrement courant avec ses métadonnées de champs, ou un résumé et un échantillon du résultat de la requête actuelle, à des fins d'analyse"
"Gets the form schema of the current entity, including field names, types, enum values, required flags, descriptions and existing values (edit mode), for generating form values": "Obtient le schéma du formulaire de l'entité actuelle, notamment les noms de champs, les types, les valeurs d'énumération, les indicateurs d'obligation, les descriptions et les valeurs existantes (mode modification), afin de générer les valeurs du formulaire"
"Field values as a JSON string, keyed by field name, for example {\"Name\":\"John\",\"Status\":1}": "Valeurs des champs sous forme de chaîne JSON, avec le nom du champ comme clé, par exemple {\"Name\":\"John\",\"Status\":1}"
"Browser operation timed out; the front end returned no result": "L'opération du navigateur a expiré ; le front-end n'a renvoyé aucun résultat"
"Get system status": "Obtenir l'état du système"
"Gets current server metrics such as CPU usage, memory, process working set and system information, for health diagnostics": "Obtient les métriques actuelles du serveur, telles que l'utilisation du processeur, la mémoire, l'ensemble de travail du processus et les informations système, pour le diagnostic de santé"
"AI is not enabled; skipped": "L'IA n'est pas activée ; étape ignorée"
"No logs in the last 24 hours": "Aucun journal au cours des dernières 24 heures"
"You are a system operations expert. Analyze the following error logs and report:\n1. Error categories, ordered by frequency\n2. The most likely root cause\n3. Recommended troubleshooting steps\n\nOutput the analysis report directly without extra explanation.": "Vous êtes un expert en exploitation de systèmes. Analysez les journaux d'erreurs suivants et indiquez :\n1. Les catégories d'erreurs, classées par fréquence\n2. La cause racine la plus probable\n3. Les étapes de diagnostic recommandées\n\nAffichez directement le rapport d'analyse, sans explication supplémentaire."
