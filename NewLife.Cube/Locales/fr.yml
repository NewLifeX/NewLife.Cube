"Password strength. * means unrestricted; the simple form defaults to 5 to 32 characters of any type. The full form requires at least 8 characters with digits, upper/lower case letters and symbols: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$": "Robustesse du mot de passe. * signifie sans restriction ; la forme simple accepte par défaut de 5 à 32 caractères de tout type. La forme complète exige au moins 8 caractères avec des chiffres, des lettres majuscules/minuscules et des symboles : ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$"
