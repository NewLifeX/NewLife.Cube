"Generated {0} configuration field values (skipped {1}, failed {2}) and filled them into the form. Ask the user to review before submitting.": "구성 필드 값 {0}개를 생성하고(건너뜀 {1}, 실패 {2}) 폼에 채웠습니다. 제출 전에 사용자에게 검토를 요청하세요."
"The current page is a system configuration form (such as Cube settings); you can help review and fill in configuration items.": "현재 페이지는 시스템 구성 폼(예: Cube 설정)이므로 구성 항목 검토와 입력을 도울 수 있습니다."
"Available tools: get_form_schema / fill_form / get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "사용 가능한 도구: get_form_schema / fill_form / get_page_context / get_system_info / run_js (함수 정의를 참고하여 필요할 때 호출하세요)"
"2. When the user asks to create, fill in or complete configuration, call get_form_schema first to inspect the items, then call fill_form to generate values (invent reasonable values for empty writable fields, keep existing values unless the user asks otherwise, and never fabricate or modify sensitive settings such as ApiKey/Secret/Token); finally ask the user to review before submitting": "2. 사용자가 구성을 생성, 입력 또는 완성하도록 요청하면 먼저 get_form_schema를 호출해 항목을 확인한 후 fill_form을 호출해 값을 생성합니다(비어 있는 쓰기 가능 필드에는 합리적인 값을 만들어 넣고, 사용자가 달리 요청하지 않는 한 기존 값은 유지하며, ApiKey/Secret/Token 같은 민감한 설정은 절대 만들거나 수정하지 않습니다). 마지막으로 제출 전에 사용자에게 검토를 요청하세요"
"3. When the user asks about the content or current state of the page, call get_page_context, then give your analysis and conclusion": "3. 사용자가 페이지의 내용이나 현재 상태를 묻는 경우 get_page_context를 호출한 후 분석과 결론을 제시합니다"
"4. When the user asks about system status or diagnostics, call get_system_info": "4. 사용자가 시스템 상태나 진단을 묻는 경우 get_system_info를 호출합니다"
"5. When the user asks to read or operate page elements, you may call run_js; explain any write operation (changing page content, submitting forms) to the user before running it": "5. 사용자가 페이지 요소를 읽거나 조작하도록 요청하면 run_js를 호출할 수 있습니다. 쓰기 작업(페이지 내용 변경, 폼 제출)은 실행 전에 사용자에게 설명하세요"
"6. Never invent data; ask the user for clarification when information is insufficient": "6. 데이터를 임의로 만들지 말고, 정보가 부족하면 사용자에게 확인을 요청합니다"
"The tenant identifier carried by user [{0}] is invalid or unavailable. Check the tenant settings and try again.": "사용자 [{0}]이(가) 전달한 테넌트 식별자가 유효하지 않거나 사용할 수 없습니다. 테넌트 설정을 확인한 후 다시 시도하세요."
"User [{0}] did not carry a tenant identifier, so the tenant cannot be determined. Include the tenant information and try again.": "사용자 [{0}]이(가) 테넌트 식별자를 전달하지 않아 테넌트를 결정할 수 없습니다. 테넌트 정보를 포함해 다시 시도하세요."
"User [{0}] is not allowed to access the data of the current tenant. Switch tenant and try again.": "사용자 [{0}]은(는) 현재 테넌트의 데이터에 접근할 수 없습니다. 테넌트를 전환한 후 다시 시도하세요."
