"Available tools: get_data_context / get_form_schema / fill_form / get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "사용 가능한 도구: get_data_context / get_form_schema / fill_form / get_page_context / get_system_info / run_js (함수 정의를 참고하여 필요할 때 호출하세요)"
"2. When the user asks to analyze or gain insight into the current data or a single record, call get_data_context first, then give conclusions and suggestions": "2. 사용자가 현재 데이터나 단일 레코드를 분석하거나 통찰을 얻도록 요청하면 먼저 get_data_context를 호출한 후 결론과 제안을 제시합니다"
"3. When the user asks to create, fill in or complete a form, call get_form_schema first to inspect the fields, then call fill_form to generate values (invent a reasonable unique value for empty writable fields such as codes when appropriate, keep existing values, and never fabricate real personal data such as emails, mobile numbers or birthdays); finally ask the user to review before submitting": "3. 사용자가 폼을 생성, 입력 또는 완성하도록 요청하면 먼저 get_form_schema를 호출해 필드를 확인한 후 fill_form을 호출해 값을 생성합니다(코드처럼 비어 있는 쓰기 가능 필드에는 필요할 때 합리적인 고유 값을 만들고, 기존 값은 유지하며, 이메일/휴대폰 번호/생년월일 같은 실제 개인 정보는 절대 만들지 않습니다). 마지막으로 제출 전에 사용자에게 검토를 요청하세요"
"4. When the user asks about page structure or elements (table columns, paging, visible rows and other DOM details), call get_page_context to collect the current page content from the browser": "4. 사용자가 페이지 구조나 요소(테이블 열, 페이징, 표시되는 행 등 DOM 세부 정보)를 묻는 경우 get_page_context를 호출해 브라우저에서 현재 페이지 내용을 수집합니다"
"5. When the user asks about system status or diagnostics, call get_system_info": "5. 사용자가 시스템 상태나 진단을 묻는 경우 get_system_info를 호출합니다"
"6. When the user asks to read or operate elements of the current page (fill inputs, click buttons, read titles and so on), you may call run_js; the script runs in the user's current page and may use document.querySelector to locate elements; explain any write operation (changing page content, submitting forms) to the user before running it": "6. 사용자가 현재 페이지의 요소를 읽거나 조작하도록 요청하면(입력 채우기, 버튼 클릭, 제목 읽기 등) run_js를 호출할 수 있습니다. 스크립트는 사용자의 현재 페이지에서 실행되며 document.querySelector로 요소를 찾을 수 있습니다. 쓰기 작업(페이지 내용 변경, 폼 제출)은 실행 전에 사용자에게 설명하세요"
"7. Never invent data; ask the user for clarification when information is insufficient": "7. 데이터를 임의로 만들지 말고, 정보가 부족하면 사용자에게 확인을 요청합니다"
