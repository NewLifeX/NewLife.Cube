# 设置页字段、分类与导航（中文源文经英文规范键翻译）
"Auto (follow system)": "자동(시스템 설정 따름)"
"Cancel": "취소"
"Queries {0}, executes {1}, elapsed {2:n0} ms": "쿼리 {0}회, 실행 {1}회, 경과 {2:n0} ms"
"Show run time": "실행 시간 표시"
"Avatar directory. Downloads remote avatars locally; defaults to the Avatars subdirectory, or Avatars next to the web root. Empty disables downloading": "아바타 디렉터리. 원격 아바타를 로컬로 다운로드합니다. 기본값은 Avatars 하위 디렉터리 또는 웹 루트 옆의 Avatars입니다. 비워 두면 다운로드하지 않습니다"
"Text avatar characters. Generates an SVG text avatar when no image exists; 1 to 3 characters. Uses the first N Chinese characters to keep the surname, or the initials of English words. Default 2": "텍스트 아바타 글자 수. 이미지가 없을 때 SVG 텍스트 아바타를 생성합니다. 1~3자입니다. 중국어는 성을 유지하도록 앞의 N자를 사용하고, 영어는 단어의 이니셜을 사용합니다. 기본값 2"
"Upload directory. Defaults to Uploads": "업로드 디렉터리. 기본값은 Uploads입니다"
"Web root directory. Defaults to wwwroot": "웹 루트 디렉터리. 기본값은 wwwroot입니다"
"Resource URL. CDN base such as https://sso.newlifex.com/content/; empty uses local resources": "리소스 URL. https://sso.newlifex.com/content/ 같은 CDN 기본 주소이며, 비워 두면 로컬 리소스를 사용합니다"
"CORS origins. Other origins allowed to access this site; * allows any origin": "CORS 원본. 이 사이트에 접근할 수 있는 다른 원본이며, *는 모든 원본을 허용합니다"
"Iframe embedding. Empty allows the same domain only; SAMEORIGIN allows the same domain and port; ALLOWALL allows any domain": "iframe 삽입. 비워 두면 같은 도메인만 허용하고, SAMEORIGIN은 같은 도메인과 포트를 허용하며, ALLOWALL은 모든 도메인을 허용합니다"
"Share expiration. Lifetime of share tokens in seconds, default 7200": "공유 만료. 공유 토큰의 유효 시간(초)이며 기본값은 7200입니다"
"Bot error code. Returns this error for crawlers, such as 404/500; 0 disables blocking": "크롤러 오류 코드. 크롤러에 이 오류를 반환합니다(예: 404/500). 0이면 차단을 비활성화합니다"
"Force redirect. Target scheme and host for GET requests; * is supported in the host. Commonly used to force HTTPS, such as https://*:8081": "강제 리디렉션. GET 요청의 대상 스킴과 호스트이며 호스트에 *를 사용할 수 있습니다. 주로 HTTPS 강제에 사용합니다(예: https://*:8081)"
"Security mode. 0: off; 1: observe and log only; 2: block; 3: automatic (default; observes, bans repeated attackers, and temporarily blocks broad attacks with automatic rollback)": "보안 모드. 0: 끄기, 1: 관찰 및 기록만, 2: 차단, 3: 자동(기본값, 관찰 후 반복 공격자를 차단하고 대규모 공격은 자동 해제되는 임시 차단을 적용)"
"Auto-ban durations. Comma-separated seconds that increase with each trigger; empty uses 60,300,1800,7200,86400": "자동 차단 기간. 트리거될 때마다 늘어나는 초 단위 값(쉼표로 구분)이며, 비워 두면 60,300,1800,7200,86400을 사용합니다"
"Trusted proxies. Forwarded headers are only trusted from these comma-separated IPs or CIDR ranges; empty keeps the legacy behavior of trusting all forwarded headers": "신뢰할 수 있는 프록시. 이 쉼표로 구분된 IP 또는 CIDR 범위에서 오는 전달 헤더만 신뢰합니다. 비워 두면 모든 전달 헤더를 신뢰하는 이전 동작을 유지합니다"
"Trusted proxy learning limit. When no trusted proxies are configured, private direct sources that send forwarded headers are learned up to this count; 0 disables learning (typically 2 for one data center, 4 for two)": "신뢰 프록시 학습 한도. 신뢰할 수 있는 프록시가 구성되지 않은 경우 전달 헤더를 보내는 사설 직접 원본을 이 개수까지 학습합니다. 0이면 학습을 비활성화합니다(일반적으로 데이터 센터 하나당 2, 두 개면 4)"
"Learned proxies. Maintained automatically; clear it to reset the learned list": "학습된 프록시. 자동으로 유지되며, 비우면 학습 목록이 초기화됩니다"
"Default role. Defaults to the Normal User role": "기본 역할. 기본값은 일반 사용자 역할입니다"
"Allow password sign-in. Allows signing in with a username and password": "비밀번호 로그인 허용. 사용자 이름과 비밀번호로 로그인할 수 있습니다"
"Allow plain-text passwords. Default true for legacy clients; false forces Challenge-Response encrypted passwords": "평문 비밀번호 허용. 이전 클라이언트를 위해 기본값은 true이며, false이면 Challenge-Response 암호화 비밀번호를 강제합니다"
"Allow registration. Allows registering with a username and password": "회원 가입 허용. 사용자 이름과 비밀번호로 가입할 수 있습니다"
"Auto registration. Default true; after SSO sign-in an unknown local user is registered automatically. Enabled when either the global or the OAuth app setting is on": "자동 가입. 기본값은 true이며, SSO 로그인 후 알 수 없는 로컬 사용자를 자동으로 등록합니다. 전역 설정이나 OAuth 앱 설정 중 하나라도 켜져 있으면 활성화됩니다"
"Password complexity check. When enabled the sign-in page validates password strength; when disabled it only requires a non-empty password. Default true": "비밀번호 복잡도 검사. 활성화하면 로그인 페이지에서 비밀번호 강도를 검사하고, 비활성화하면 비어 있지 않은 비밀번호만 요구합니다. 기본값 true"
"Login failure limit. Bans sign-in after this many consecutive failures for the same user or IP, default 5": "로그인 실패 한도. 같은 사용자 또는 IP가 이 횟수만큼 연속 실패하면 로그인을 차단합니다. 기본값 5"
"Login ban duration. Seconds a risk-control ban lasts, default 300": "로그인 차단 기간. 리스크 제어 차단이 유지되는 시간(초)이며 기본값은 300입니다"
"Class C subnet ban threshold. Bans a /24 subnet such as 103.125.146.* after this many failures, default 10; 0 disables": "C 클래스 서브넷 차단 임계값. 103.125.146.* 같은 /24 서브넷을 이 실패 횟수 후 차단합니다. 기본값 10, 0이면 비활성화"
"Class B subnet ban threshold. Bans a /16 subnet such as 103.125.*.* after this many failures, default 20; 0 disables": "B 클래스 서브넷 차단 임계값. 103.125.*.* 같은 /16 서브넷을 이 실패 횟수 후 차단합니다. 기본값 20, 0이면 비활성화"
"Force bind by user name. Binds SSO users to local users with the same name without a provider prefix; intended for user centers": "사용자 이름으로 강제 연결. 공급자 접두사 없이 같은 이름의 로컬 사용자에 SSO 사용자를 연결합니다. 사용자 센터용입니다"
"Bind by user code. Binds SSO users to local users by user code": "사용자 코드로 연결. 사용자 코드로 SSO 사용자를 로컬 사용자에 연결합니다"
"Bind by mobile. Binds SSO users to local users by mobile number": "휴대폰으로 연결. 휴대폰 번호로 SSO 사용자를 로컬 사용자에 연결합니다"
"Bind by email. Binds SSO users to local users by email": "이메일로 연결. 이메일로 SSO 사용자를 로컬 사용자에 연결합니다"
"Bind by nickname. Binds SSO users to local users by nickname; suitable for internal SSO, not for social networks with many duplicate names": "닉네임으로 연결. 닉네임으로 SSO 사용자를 로컬 사용자에 연결합니다. 내부 SSO에 적합하며 중복 이름이 많은 소셜 네트워크에는 적합하지 않습니다"
"Use SSO roles. Keeps SSO roles after sign-in, default true; otherwise DefaultRole is used": "SSO 역할 사용. 로그인 후 SSO 역할을 유지합니다. 기본값 true이며, 그렇지 않으면 DefaultRole을 사용합니다"
"Use SSO departments. Keeps SSO departments after sign-in, default true": "SSO 부서 사용. 로그인 후 SSO 부서를 유지합니다. 기본값 true"
"SSO role rules. Automatically upgrades the primary role after SSO sign-in; separate rules with commas. Format: source role+department wildcard=target role, for example Guest+Route*=Route Specialist": "SSO 역할 규칙. SSO 로그인 후 주 역할을 자동으로 승격합니다. 규칙은 쉼표로 구분합니다. 형식: 원본 역할+부서 와일드카드=대상 역할, 예: Guest+Route*=Route Specialist"
"Sign out everywhere. false signs out of this site only; true (default) also signs out of the SSO server": "모든 곳에서 로그아웃. false이면 이 사이트만 로그아웃하고, true(기본값)이면 SSO 서버에서도 로그아웃합니다"
"Allow multi-device sign-in. false kicks old devices on a new sign-in and revokes all tokens on sign-out; true (default) revokes only the current session": "다중 장치 로그인 허용. false이면 새로 로그인할 때 이전 장치를 끊고 로그아웃 시 모든 토큰을 해지하며, true(기본값)이면 현재 세션만 해지합니다"
"Session timeout. Session lifetime after SSO sign-in during which the cookie can sign in again; default 0s": "세션 시간 제한. SSO 로그인 후 쿠키로 다시 로그인할 수 있는 세션 수명입니다. 기본값 0초"
"Token sliding refresh threshold. Refreshes the JWT and rewrites the cookie when its remaining lifetime falls below this many seconds; 0 disables sliding expiration": "토큰 슬라이딩 갱신 임계값. JWT의 남은 수명이 이 초 수 미만이면 JWT를 갱신하고 쿠키를 다시 씁니다. 0이면 슬라이딩 만료를 비활성화합니다"
"User refresh period. Fetches user information once per period across SSO sign-ins, default 600 seconds": "사용자 갱신 주기. SSO 로그인 간 사용자 정보를 주기마다 한 번 가져옵니다. 기본값 600초"
"JWT secret. Algorithm and key used to sign JWTs, such as HS256:ABCD1234": "JWT 비밀 키. JWT 서명에 사용하는 알고리즘과 키입니다(예: HS256:ABCD1234)"
"Token lifetime. Lifetime of the access token in seconds, default 7200": "토큰 수명. 액세스 토큰의 유효 시간(초)이며 기본값은 7200입니다"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default true": "토큰을 쿠키에 저장. 요청 헤더에 토큰이 없으면 쿠키에서 읽습니다. 기본값 true"
"Validate attachment access. Requires sign-in to access attachments, default true": "첨부 파일 접근 검증. 첨부 파일에 접근하려면 로그인이 필요합니다. 기본값 true"
"Public attachment categories. Categories accessible without sign-in, comma-separated, such as markdown,avatar. Applies when ValidateAttachment is true": "공개 첨부 파일 범주. 로그인 없이 접근할 수 있는 범주(쉼표로 구분, 예: markdown,avatar)입니다. ValidateAttachment가 true일 때 적용됩니다"
"Private attachment categories. Categories only the uploader can access, comma-separated. Applies when ValidateAttachment is true": "비공개 첨부 파일 범주. 업로더만 접근할 수 있는 범주(쉼표로 구분)입니다. ValidateAttachment가 true일 때 적용됩니다"
"SSO redirect allowlist. Domains allowed to receive the JWT after sign-in, comma-separated with wildcard prefixes such as *.company.com. Empty allows the same site only; other origins are rejected and sent back to the home page": "SSO 리디렉션 허용 목록. 로그인 후 JWT를 받을 수 있는 도메인(쉼표로 구분, *.company.com 같은 와일드카드 접두사 허용)입니다. 비워 두면 같은 사이트만 허용하며, 다른 원본은 거부되어 홈 페이지로 돌아갑니다"
"External authentication URL. When local authentication fails, credentials are verified by this endpoint; on success the local user is created or updated and signed in": "외부 인증 URL. 로컬 인증이 실패하면 이 엔드포인트로 자격 증명을 확인하고, 성공하면 로컬 사용자를 만들거나 갱신하여 로그인합니다"
"Start page. First content page opened after entering the admin console": "시작 페이지. 관리 콘솔에 들어온 후 처음 열리는 콘텐츠 페이지입니다"
"Theme. Content page theme, ACE/layui": "테마. 콘텐츠 페이지 테마이며 ACE/layui 중 선택합니다"
"Skin. Outer frame layout, ACE/layui": "스킨. 외부 프레임 레이아웃이며 ACE/layui 중 선택합니다"
"Login tip. Empty hides the tip on the sign-in page": "로그인 안내. 비워 두면 로그인 페이지의 안내를 숨깁니다"
"Login logo. Empty uses the default logo": "로그인 로고. 비워 두면 기본 로고를 사용합니다"
"Login background. Image URL; empty uses the default background": "로그인 배경. 이미지 URL이며, 비워 두면 기본 배경을 사용합니다"
"Form group layout. 3/2/1 columns on large/medium/small screens, form-group col-xs-12 col-sm-6 col-lg-4": "폼 그룹 레이아웃. 큰/중간/작은 화면에서 3/2/1열이며, form-group col-xs-12 col-sm-6 col-lg-4입니다"
"Bootstrap select. Nicer drop-downs with a rendering cost": "Bootstrap select. 드롭다운이 더 보기 좋지만 렌더링 비용이 있습니다"
"Maximum drop-down items. Maximum options in a related drop-down on forms, default 50; larger lists fall back to a text box": "드롭다운 최대 항목 수. 폼의 관련 드롭다운에서 선택할 수 있는 최대 옵션 수이며 기본값은 50입니다. 더 큰 목록은 텍스트 상자로 대체됩니다"
"Copyright. Empty hides the copyright; variables now/runtime/framework are supported, and now accepts formats such as {now:yyyy}": "저작권. 비워 두면 저작권 표시를 숨깁니다. now/runtime/framework 변수를 지원하며 now는 {now:yyyy} 같은 형식을 받습니다"
"Filing number. Empty hides the filing information": "등록 번호. 비워 두면 등록 정보를 숨깁니다"
"Enable new UI": "새 UI 활성화"
"ECharts theme. Chart theme": "ECharts 테마. 차트 테마입니다"
"Title suffix. Appends the system name to page titles, default true": "제목 접미사. 페이지 제목에 시스템 이름을 덧붙입니다. 기본값 true"
"Table double-click. Enables row double-click on list pages, default true": "테이블 더블클릭. 목록 페이지에서 행 더블클릭을 활성화합니다. 기본값 true"
"Table style. Light: minimal thin lines; Standard: clear row lines (default); Grid: full cell borders": "테이블 스타일. 라이트: 최소한의 얇은 선, 스탠더드: 또렷한 행 구분선(기본값), 그리드: 전체 셀 테두리"
"Table density. Compact: dense and information-rich (default); Normal: relaxed": "테이블 밀도. 컴팩트: 촘촘하고 정보가 많음(기본값), 노멀: 여유로움"
"Stardust web. Stardust console URL; supports direct links to /trace?id={traceId} or /graph?id={traceId}": "Stardust 웹. Stardust 콘솔 URL이며 /trace?id={traceId} 또는 /graph?id={traceId} 직접 링크를 지원합니다"
"AI master switch. Enables AI features such as log analysis and notification polishing, default false": "AI 마스터 스위치. 로그 분석, 알림 다듬기 같은 AI 기능을 활성화합니다. 기본값 false"
"AI provider. Supports NewLife, Ollama, DeepSeek, DashScope, OpenAI and others; default NewLife": "AI 공급자. NewLife, Ollama, DeepSeek, DashScope, OpenAI 등을 지원하며 기본값은 NewLife입니다"
"AI endpoint. Defaults to https://ai.newlifex.com for NewLife": "AI 엔드포인트. NewLife의 기본값은 https://ai.newlifex.com입니다"
"AI ApiKey. Defaults to sk-CubeAI2026 for NewLife": "AI ApiKey. NewLife의 기본값은 sk-CubeAI2026입니다"
"AI default model. Defaults to newlife-flash for NewLife": "AI 기본 모델. NewLife의 기본값은 newlife-flash입니다"
"AI default deep reasoning. Enables think mode for analysis and chat by default; false means fast responses": "AI 기본 심층 추론. 분석과 채팅에 기본으로 사고 모드를 활성화하며, false이면 빠르게 응답합니다"
"AI color scheme. Fills the primary and secondary colors from a preset": "AI 색상 구성. 미리 설정된 구성에서 기본 색상과 보조 색상을 채웁니다"
"AI primary color. Main color of the launcher, panel header and user bubbles; default NewLife green #2ecc71": "AI 기본 색상. 실행기, 패널 헤더, 사용자 말풍선의 주 색상이며 기본값은 NewLife 녹색 #2ecc71입니다"
"AI secondary color. Gradient end color, default dark green #1e8e3e": "AI 보조 색상. 그라데이션 끝 색상이며 기본값은 진한 녹색 #1e8e3e입니다"
"OAuth server. Enables the OAuth 2.0 server that provides SSO for other applications": "OAuth 서버. 다른 애플리케이션에 SSO를 제공하는 OAuth 2.0 서버를 활성화합니다"
"File manager. Enables backend file management (browse, upload, download, delete); this carries security risks": "파일 관리자. 백엔드 파일 관리(찾아보기, 업로드, 다운로드, 삭제)를 활성화합니다. 보안 위험이 따릅니다"
"Multi-tenancy. Enables tenants; tenant mode cannot access system administration and platform mode cannot access tenant pages": "다중 테넌트. 테넌트를 활성화합니다. 테넌트 모드에서는 시스템 관리를, 플랫폼 모드에서는 테넌트 페이지를 사용할 수 없습니다"
"Tenant query policy. DenyWithEmpty: return an empty set without tenant context; ThrowOnMissingTenant: throw an explicit error": "테넌트 쿼리 정책. DenyWithEmpty: 테넌트 컨텍스트가 없으면 빈 집합을 반환합니다. ThrowOnMissingTenant: 명시적 오류를 발생시킵니다"
"User online. 0: do not record; 1: signed-in users only; 2: all visitors (default)": "사용자 온라인. 0: 기록 안 함, 1: 로그인 사용자만, 2: 모든 방문자(기본값)"
"User statistics. Records user visits, default true": "사용자 통계. 사용자 방문을 기록합니다. 기본값 true"
"Enable SMS. SMS verification codes and system notifications, default false": "SMS 활성화. SMS 인증 코드와 시스템 알림을 사용합니다. 기본값 false"
"Enable email. Email verification codes and system notifications, default false": "이메일 활성화. 이메일 인증 코드와 시스템 알림을 사용합니다. 기본값 false"
"Require email verification. Users must activate their email before signing in and must provide one when registering, default false": "이메일 인증 필수. 사용자는 로그인 전에 이메일을 인증해야 하고 가입 시 이메일을 제공해야 합니다. 기본값 false"
"Require mobile verification. Users must activate their mobile before signing in and must provide one when registering, default false": "휴대폰 인증 필수. 사용자는 로그인 전에 휴대폰을 인증해야 하고 가입 시 휴대폰을 제공해야 합니다. 기본값 false"
"Captcha scenarios. Bit mask: 0: off; 1: sign-in; 2: registration; 4: verification code requests (anti-SMS-bombing); combine with 3 for sign-in and registration. Mandatory scenarios are never exempted, default 0": "캡차 시나리오. 비트 마스크: 0: 끄기, 1: 로그인, 2: 가입, 4: 인증 코드 요청(SMS 폭탄 방지). 로그인과 가입을 함께 쓰려면 3으로 지정합니다. 필수 시나리오는 예외가 없으며 기본값은 0입니다"
"Risk-adaptive captcha. Disabled when CaptchaScene is 0; when enabled it detects unsafe environments and requires a captcha, default true": "위험 적응형 캡차. CaptchaScene이 0이면 비활성화됩니다. 활성화하면 안전하지 않은 환경을 감지해 캡차를 요구합니다. 기본값 true"
"Captcha risk threshold. Requires a captcha when the risk score reaches this value: 0: intranet; 1: internet; 2: internet with recent failures; 3: banned. Default 2": "캡차 위험 임계값. 위험 점수가 이 값에 도달하면 캡차를 요구합니다. 0: 인트라넷, 1: 인터넷, 2: 최근 실패가 있는 인터넷, 3: 차단됨. 기본값 2"
"Trusted device lifetime. Days during which previously successful devices skip adaptive captchas, default 30": "신뢰 장치 수명. 이전에 성공한 장치가 적응형 캡차를 건너뛰는 일수입니다. 기본값 30"
"Enable MFA. Allows users to enable TOTP multi-factor authentication; an enhanced feature, default false": "MFA 활성화. 사용자가 TOTP 다중 인증을 활성화할 수 있습니다. 고급 기능이며 기본값 false"
"File storage serving. Responds to file download requests from other nodes, default true": "파일 저장소 제공. 다른 노드의 파일 다운로드 요청에 응답합니다. 기본값 true"
"File storage fetch. Pulls new files published by other nodes, default true": "파일 저장소 가져오기. 다른 노드가 게시한 새 파일을 가져옵니다. 기본값 true"
"File fetch timeout. Maximum milliseconds to wait for other nodes when a file is missing locally, default 5000": "파일 가져오기 시간 제한. 파일이 로컬에 없을 때 다른 노드를 기다리는 최대 밀리초입니다. 기본값 5000"
"Attachment storage. Local disk, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu or EasyIO; default Local": "첨부 파일 저장소. 로컬 디스크, Oss(알리바바 클라우드), Cos(텐센트 클라우드), Qiniu 또는 EasyIO이며 기본값은 Local입니다"
"Object storage server. S3-compatible endpoint for OSS/COS/Qiniu, such as oss-cn-beijing.aliyuncs.com": "객체 저장소 서버. OSS/COS/Qiniu용 S3 호환 엔드포인트입니다(예: oss-cn-beijing.aliyuncs.com)"
"Object storage bucket. Bucket name for OSS/COS/Qiniu": "객체 저장소 버킷. OSS/COS/Qiniu용 버킷 이름입니다"
"Object storage region. S3 signing scope, such as cn-beijing / ap-beijing / cn-east-1": "객체 저장소 리전. S3 서명 범위입니다(예: cn-beijing / ap-beijing / cn-east-1)"
"Object storage app ID. AccessKeyId": "객체 저장소 앱 ID. AccessKeyId"
"Object storage app secret. AccessKeySecret": "객체 저장소 앱 비밀 키. AccessKeySecret"
"Data retention. Days to keep audit and OAuth logs, default 30": "데이터 보존. 감사 및 OAuth 로그를 보관하는 일수입니다. 기본값 30"
"File retention. Days to keep backup files, default 15": "파일 보존. 백업 파일을 보관하는 일수입니다. 기본값 15"
"Retention size floor. Files smaller than this (KB) are never deleted even after the retention period, default 1024K": "보존 최소 크기. 이 크기(KB)보다 작은 파일은 보존 기간이 지나도 삭제하지 않습니다. 기본값 1024K"
"Maximum export rows. Maximum rows a page may export, default 10_000_000": "최대 내보내기 행 수. 한 페이지에서 내보낼 수 있는 최대 행 수이며 기본값은 10_000_000입니다"
"Maximum backup rows. Maximum rows a page may back up, default 10_000_000": "최대 백업 행 수. 한 페이지에서 백업할 수 있는 최대 행 수이며 기본값은 10_000_000입니다"
"API prefixes. Comma- or semicolon-separated prefixes such as /api,/api/v1; matching requests are forwarded to the real route without the prefix": "API 접두사. /api,/api/v1 같은 쉼표 또는 세미콜론 구분 접두사입니다. 일치하는 요청은 접두사를 제거하고 실제 경로로 전달됩니다"
"Password strength. * means unrestricted; by default at least 8 characters with digits, upper/lower case letters and symbols. Simple form: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$": "비밀번호 강도. *는 제한 없음을 뜻합니다. 기본적으로 숫자, 대소문자, 기호를 포함해 8자 이상입니다. 간단한 형식: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$"
"Cookie mode. Default SameSite mode for token cookies (-1 Unspecified, 0 None, 1 Lax, 2 Strict)": "쿠키 모드. 토큰 쿠키의 기본 SameSite 모드입니다(-1 Unspecified, 0 None, 1 Lax, 2 Strict)"
"Cookie domain. Writes cookies to a parent domain; empty uses the current domain. A top-level domain requires HTTPS and prevents plain HTTP from writing same-name keys on the local domain": "쿠키 도메인. 쿠키를 상위 도메인에 씁니다. 비워 두면 현재 도메인을 사용합니다. 최상위 도메인은 HTTPS가 필요하며, 일반 HTTP가 로컬 도메인에 같은 이름의 키를 쓰지 못하게 합니다"
"Activation URL. Front-end activation page URL used in email activation links, such as https://xxx/activate; empty builds /activate from the request host": "활성화 URL. 이메일 활성화 링크에 사용하는 프런트엔드 활성화 페이지 URL입니다(예: https://xxx/activate). 비워 두면 요청 호스트에서 /activate를 만듭니다"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default false": "토큰을 쿠키에 저장. 요청 헤더에 토큰이 없으면 쿠키에서 읽습니다. 기본값 false"
"Password strength. * means unrestricted; the simple form defaults to 5 to 32 characters of any type. The full form requires at least 8 characters with digits, upper/lower case letters and symbols: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$": "비밀번호 강도. *는 제한 없음을 뜻합니다. 간단한 형식은 모든 문자 유형으로 5~32자입니다. 전체 형식은 숫자, 대소문자, 기호를 포함해 8자 이상이어야 합니다: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$"
