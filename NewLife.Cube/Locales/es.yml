# 设置页字段、分类与导航（中文源文经英文规范键翻译）
"Auto (follow system)": "Automático (seguir el sistema)"
"Cancel": "Cancelar"
"Queries {0}, executes {1}, elapsed {2:n0} ms": "Consultas {0}, ejecuciones {1}, tiempo transcurrido {2:n0} ms"
"Show run time": "Mostrar tiempo de ejecución"
"Avatar directory. Downloads remote avatars locally; defaults to the Avatars subdirectory, or Avatars next to the web root. Empty disables downloading": "Directorio de avatares. Descarga localmente los avatares remotos; de forma predeterminada usa el subdirectorio Avatars, o Avatars junto a la raíz web. Vacío desactiva la descarga"
"Text avatar characters. Generates an SVG text avatar when no image exists; 1 to 3 characters. Uses the first N Chinese characters to keep the surname, or the initials of English words. Default 2": "Caracteres del avatar de texto. Genera un avatar de texto SVG cuando no existe una imagen; de 1 a 3 caracteres. Usa los primeros N caracteres chinos para conservar el apellido, o las iniciales de las palabras en inglés. Predeterminado 2"
"Upload directory. Defaults to Uploads": "Directorio de carga. Predeterminado: Uploads"
"Web root directory. Defaults to wwwroot": "Directorio raíz web. Predeterminado: wwwroot"
"Resource URL. CDN base such as https://sso.newlifex.com/content/; empty uses local resources": "URL de recursos. Base del CDN, por ejemplo https://sso.newlifex.com/content/; vacío usa recursos locales"
"CORS origins. Other origins allowed to access this site; * allows any origin": "Orígenes CORS. Otros orígenes a los que se permite acceder a este sitio; * permite cualquier origen"
"Iframe embedding. Empty allows the same domain only; SAMEORIGIN allows the same domain and port; ALLOWALL allows any domain": "Incrustación en iframe. Vacío permite solo el mismo dominio; SAMEORIGIN permite el mismo dominio y puerto; ALLOWALL permite cualquier dominio"
"Share expiration. Lifetime of share tokens in seconds, default 7200": "Caducidad de la compartición. Duración de los tokens de compartición en segundos, predeterminado 7200"
"Bot error code. Returns this error for crawlers, such as 404/500; 0 disables blocking": "Código de error para bots. Devuelve este error a los rastreadores, por ejemplo 404/500; 0 desactiva el bloqueo"
"Force redirect. Target scheme and host for GET requests; * is supported in the host. Commonly used to force HTTPS, such as https://*:8081": "Redirección forzada. Esquema y host de destino para las solicitudes GET; se admite * en el host. Se usa habitualmente para forzar HTTPS, por ejemplo https://*:8081"
"Security mode. 0: off; 1: observe and log only; 2: block; 3: automatic (default; observes, bans repeated attackers, and temporarily blocks broad attacks with automatic rollback)": "Modo de seguridad. 0: desactivado; 1: solo observar y registrar; 2: bloquear; 3: automático (predeterminado; observa, bloquea a los atacantes reincidentes y bloquea temporalmente los ataques masivos con reversión automática)"
"Auto-ban durations. Comma-separated seconds that increase with each trigger; empty uses 60,300,1800,7200,86400": "Duraciones de bloqueo automático. Segundos separados por comas que aumentan con cada activación; vacío usa 60,300,1800,7200,86400"
"Trusted proxies. Forwarded headers are only trusted from these comma-separated IPs or CIDR ranges; empty keeps the legacy behavior of trusting all forwarded headers": "Proxies de confianza. Solo se confían las cabeceras reenviadas de estas IP o rangos CIDR separados por comas; vacío mantiene el comportamiento heredado de confiar en todas las cabeceras reenviadas"
"Trusted proxy learning limit. When no trusted proxies are configured, private direct sources that send forwarded headers are learned up to this count; 0 disables learning (typically 2 for one data center, 4 for two)": "Límite de aprendizaje de proxies de confianza. Cuando no hay proxies de confianza configurados, se aprenden hasta este número de orígenes privados directos que envían cabeceras reenviadas; 0 desactiva el aprendizaje (normalmente 2 para un centro de datos y 4 para dos)"
"Learned proxies. Maintained automatically; clear it to reset the learned list": "Proxies aprendidos. Se mantienen automáticamente; bórrelos para restablecer la lista aprendida"
"Default role. Defaults to the Normal User role": "Rol predeterminado. Predeterminado: el rol de usuario normal"
"Allow password sign-in. Allows signing in with a username and password": "Permitir inicio de sesión con contraseña. Permite iniciar sesión con nombre de usuario y contraseña"
"Allow plain-text passwords. Default true for legacy clients; false forces Challenge-Response encrypted passwords": "Permitir contraseñas en texto sin formato. Predeterminado true para clientes heredados; false fuerza contraseñas cifradas con Challenge-Response"
"Allow registration. Allows registering with a username and password": "Permitir registro. Permite registrarse con nombre de usuario y contraseña"
"Auto registration. Default true; after SSO sign-in an unknown local user is registered automatically. Enabled when either the global or the OAuth app setting is on": "Registro automático. Predeterminado true; tras el inicio de sesión SSO, un usuario local desconocido se registra automáticamente. Se activa cuando está activada la configuración global o la de la aplicación OAuth"
"Password complexity check. When enabled the sign-in page validates password strength; when disabled it only requires a non-empty password. Default true": "Comprobación de complejidad de contraseña. Cuando está activada, la página de inicio de sesión valida la fortaleza de la contraseña; cuando está desactivada, solo exige que la contraseña no esté vacía. Predeterminado true"
"Login failure limit. Bans sign-in after this many consecutive failures for the same user or IP, default 5": "Límite de fallos de inicio de sesión. Bloquea el inicio de sesión tras este número de fallos consecutivos para el mismo usuario o IP, predeterminado 5"
"Login ban duration. Seconds a risk-control ban lasts, default 300": "Duración del bloqueo por inicio de sesión. Segundos que dura un bloqueo por control de riesgos, predeterminado 300"
"Class C subnet ban threshold. Bans a /24 subnet such as 103.125.146.* after this many failures, default 10; 0 disables": "Umbral de bloqueo de subred clase C. Bloquea una subred /24 como 103.125.146.* tras este número de fallos, predeterminado 10; 0 lo desactiva"
"Class B subnet ban threshold. Bans a /16 subnet such as 103.125.*.* after this many failures, default 20; 0 disables": "Umbral de bloqueo de subred clase B. Bloquea una subred /16 como 103.125.*.* tras este número de fallos, predeterminado 20; 0 lo desactiva"
"Force bind by user name. Binds SSO users to local users with the same name without a provider prefix; intended for user centers": "Forzar vinculación por nombre de usuario. Vincula los usuarios SSO a los usuarios locales con el mismo nombre sin prefijo de proveedor; pensado para centros de usuarios"
"Bind by user code. Binds SSO users to local users by user code": "Vincular por código de usuario. Vincula los usuarios SSO a los usuarios locales por código de usuario"
"Bind by mobile. Binds SSO users to local users by mobile number": "Vincular por móvil. Vincula los usuarios SSO a los usuarios locales por número de móvil"
"Bind by email. Binds SSO users to local users by email": "Vincular por correo. Vincula los usuarios SSO a los usuarios locales por correo electrónico"
"Bind by nickname. Binds SSO users to local users by nickname; suitable for internal SSO, not for social networks with many duplicate names": "Vincular por alias. Vincula los usuarios SSO a los usuarios locales por alias; adecuado para SSO interno, no para redes sociales con muchos nombres duplicados"
"Use SSO roles. Keeps SSO roles after sign-in, default true; otherwise DefaultRole is used": "Usar roles SSO. Conserva los roles SSO tras el inicio de sesión, predeterminado true; de lo contrario se usa DefaultRole"
"Use SSO departments. Keeps SSO departments after sign-in, default true": "Usar departamentos SSO. Conserva los departamentos SSO tras el inicio de sesión, predeterminado true"
"SSO role rules. Automatically upgrades the primary role after SSO sign-in; separate rules with commas. Format: source role+department wildcard=target role, for example Guest+Route*=Route Specialist": "Reglas de roles SSO. Actualiza automáticamente el rol principal tras el inicio de sesión SSO; separe las reglas con comas. Formato: rol de origen+comodín de departamento=rol de destino, por ejemplo Guest+Route*=Route Specialist"
"Sign out everywhere. false signs out of this site only; true (default) also signs out of the SSO server": "Cerrar sesión en todas partes. false cierra la sesión solo en este sitio; true (predeterminado) también la cierra en el servidor SSO"
"Allow multi-device sign-in. false kicks old devices on a new sign-in and revokes all tokens on sign-out; true (default) revokes only the current session": "Permitir inicio de sesión en varios dispositivos. false expulsa los dispositivos antiguos en un nuevo inicio de sesión y revoca todos los tokens al cerrar sesión; true (predeterminado) revoca solo la sesión actual"
"Session timeout. Session lifetime after SSO sign-in during which the cookie can sign in again; default 0s": "Tiempo de espera de la sesión. Duración de la sesión tras el inicio de sesión SSO durante la cual la cookie puede iniciar sesión de nuevo; predeterminado 0 s"
"Token sliding refresh threshold. Refreshes the JWT and rewrites the cookie when its remaining lifetime falls below this many seconds; 0 disables sliding expiration": "Umbral de renovación deslizante del token. Renueva el JWT y reescribe la cookie cuando su vida restante cae por debajo de este número de segundos; 0 desactiva la caducidad deslizante"
"User refresh period. Fetches user information once per period across SSO sign-ins, default 600 seconds": "Periodo de actualización del usuario. Obtiene la información del usuario una vez por periodo entre inicios de sesión SSO, predeterminado 600 segundos"
"JWT secret. Algorithm and key used to sign JWTs, such as HS256:ABCD1234": "Secreto JWT. Algoritmo y clave usados para firmar los JWT, por ejemplo HS256:ABCD1234"
"Token lifetime. Lifetime of the access token in seconds, default 7200": "Duración del token. Duración del token de acceso en segundos, predeterminado 7200"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default true": "Almacenar el token en una cookie. Lee el token de la cookie cuando la cabecera de la solicitud no lo incluye, predeterminado true"
"Validate attachment access. Requires sign-in to access attachments, default true": "Validar el acceso a los adjuntos. Exige iniciar sesión para acceder a los adjuntos, predeterminado true"
"Public attachment categories. Categories accessible without sign-in, comma-separated, such as markdown,avatar. Applies when ValidateAttachment is true": "Categorías de adjuntos públicas. Categorías accesibles sin iniciar sesión, separadas por comas, por ejemplo markdown,avatar. Se aplica cuando ValidateAttachment es true"
"Private attachment categories. Categories only the uploader can access, comma-separated. Applies when ValidateAttachment is true": "Categorías de adjuntos privadas. Categorías a las que solo puede acceder quien las carga, separadas por comas. Se aplica cuando ValidateAttachment es true"
"SSO redirect allowlist. Domains allowed to receive the JWT after sign-in, comma-separated with wildcard prefixes such as *.company.com. Empty allows the same site only; other origins are rejected and sent back to the home page": "Lista de permitidos para redirecciones SSO. Dominios a los que se permite recibir el JWT tras el inicio de sesión, separados por comas con prefijos comodín como *.company.com. Vacío permite solo el mismo sitio; los demás orígenes se rechazan y se devuelven a la página principal"
"External authentication URL. When local authentication fails, credentials are verified by this endpoint; on success the local user is created or updated and signed in": "URL de autenticación externa. Cuando falla la autenticación local, las credenciales se verifican con este extremo; si tienen éxito, se crea o actualiza el usuario local y se inicia sesión"
"Start page. First content page opened after entering the admin console": "Página de inicio. Primera página de contenido que se abre tras entrar en la consola de administración"
"Theme. Content page theme, ACE/layui": "Tema. Tema de las páginas de contenido, ACE/layui"
"Skin. Outer frame layout, ACE/layui": "Aspecto. Diseño del marco exterior, ACE/layui"
"Login tip. Empty hides the tip on the sign-in page": "Aviso de inicio de sesión. Vacío oculta el aviso de la página de inicio de sesión"
"Login logo. Empty uses the default logo": "Logotipo de inicio de sesión. Vacío usa el logotipo predeterminado"
"Login background. Image URL; empty uses the default background": "Fondo de inicio de sesión. URL de la imagen; vacío usa el fondo predeterminado"
"Form group layout. 3/2/1 columns on large/medium/small screens, form-group col-xs-12 col-sm-6 col-lg-4": "Diseño de grupos de formulario. 3/2/1 columnas en pantallas grandes/medianas/pequeñas, form-group col-xs-12 col-sm-6 col-lg-4"
"Bootstrap select. Nicer drop-downs with a rendering cost": "Select de Bootstrap. Desplegables más atractivos con un coste de representación"
"Maximum drop-down items. Maximum options in a related drop-down on forms, default 50; larger lists fall back to a text box": "Máximo de elementos desplegables. Número máximo de opciones en un desplegable relacionado de los formularios, predeterminado 50; las listas más grandes pasan a un cuadro de texto"
"Copyright. Empty hides the copyright; variables now/runtime/framework are supported, and now accepts formats such as {now:yyyy}": "Derechos de autor. Vacío oculta los derechos de autor; se admiten las variables now/runtime/framework, y now acepta formatos como {now:yyyy}"
"Filing number. Empty hides the filing information": "Número de registro. Vacío oculta la información de registro"
"Enable new UI": "Habilitar la nueva interfaz"
"ECharts theme. Chart theme": "Tema de ECharts. Tema de los gráficos"
"Title suffix. Appends the system name to page titles, default true": "Sufijo del título. Añade el nombre del sistema a los títulos de página, predeterminado true"
"Table double-click. Enables row double-click on list pages, default true": "Doble clic en la tabla. Habilita el doble clic en las filas de las páginas de lista, predeterminado true"
"Table style. Light: minimal thin lines; Standard: clear row lines (default); Grid: full cell borders": "Estilo de tabla. Ligero: líneas finas minimalistas; Estándar: líneas de separación nítidas (predeterminado); Cuadrícula: bordes de celda completos"
"Table density. Compact: dense and information-rich (default); Normal: relaxed": "Densidad de tabla. Compacto: denso y con mucha información (predeterminado); Normal: holgado"
"Stardust web. Stardust console URL; supports direct links to /trace?id={traceId} or /graph?id={traceId}": "Web de Stardust. URL de la consola de Stardust; admite enlaces directos a /trace?id={traceId} o /graph?id={traceId}"
"AI master switch. Enables AI features such as log analysis and notification polishing, default false": "Interruptor principal de IA. Habilita funciones de IA como el análisis de registros y el pulido de notificaciones, predeterminado false"
"AI provider. Supports NewLife, Ollama, DeepSeek, DashScope, OpenAI and others; default NewLife": "Proveedor de IA. Admite NewLife, Ollama, DeepSeek, DashScope, OpenAI y otros; predeterminado NewLife"
"AI endpoint. Defaults to https://ai.newlifex.com for NewLife": "Extremo de IA. Predeterminado https://ai.newlifex.com para NewLife"
"AI ApiKey. Defaults to sk-CubeAI2026 for NewLife": "ApiKey de IA. Predeterminado sk-CubeAI2026 para NewLife"
"AI default model. Defaults to newlife-flash for NewLife": "Modelo de IA predeterminado. Predeterminado newlife-flash para NewLife"
"AI default deep reasoning. Enables think mode for analysis and chat by default; false means fast responses": "Razonamiento profundo de IA predeterminado. Habilita el modo think para el análisis y el chat de forma predeterminada; false significa respuestas rápidas"
"AI color scheme. Fills the primary and secondary colors from a preset": "Esquema de color de IA. Rellena los colores primario y secundario desde un preajuste"
"AI primary color. Main color of the launcher, panel header and user bubbles; default NewLife green #2ecc71": "Color primario de IA. Color principal del lanzador, la cabecera del panel y las burbujas del usuario; predeterminado verde NewLife #2ecc71"
"AI secondary color. Gradient end color, default dark green #1e8e3e": "Color secundario de IA. Color final del degradado, predeterminado verde oscuro #1e8e3e"
"OAuth server. Enables the OAuth 2.0 server that provides SSO for other applications": "Servidor OAuth. Habilita el servidor OAuth 2.0 que proporciona SSO a otras aplicaciones"
"File manager. Enables backend file management (browse, upload, download, delete); this carries security risks": "Gestor de archivos. Habilita la gestión de archivos del backend (explorar, cargar, descargar, eliminar); esto conlleva riesgos de seguridad"
"Multi-tenancy. Enables tenants; tenant mode cannot access system administration and platform mode cannot access tenant pages": "Multiinquilino. Habilita los inquilinos; el modo inquilino no puede acceder a la administración del sistema y el modo plataforma no puede acceder a las páginas de inquilinos"
"Tenant query policy. DenyWithEmpty: return an empty set without tenant context; ThrowOnMissingTenant: throw an explicit error": "Directiva de consulta de inquilinos. DenyWithEmpty: devuelve un conjunto vacío sin contexto de inquilino; ThrowOnMissingTenant: lanza un error explícito"
"User online. 0: do not record; 1: signed-in users only; 2: all visitors (default)": "Usuarios en línea. 0: no registrar; 1: solo usuarios conectados; 2: todos los visitantes (predeterminado)"
"User statistics. Records user visits, default true": "Estadísticas de usuarios. Registra las visitas de los usuarios, predeterminado true"
"Enable SMS. SMS verification codes and system notifications, default false": "Habilitar SMS. Códigos de verificación por SMS y notificaciones del sistema, predeterminado false"
"Enable email. Email verification codes and system notifications, default false": "Habilitar correo. Códigos de verificación por correo y notificaciones del sistema, predeterminado false"
"Require email verification. Users must activate their email before signing in and must provide one when registering, default false": "Requerir verificación por correo. Los usuarios deben activar su correo antes de iniciar sesión y deben proporcionarlo al registrarse, predeterminado false"
"Require mobile verification. Users must activate their mobile before signing in and must provide one when registering, default false": "Requerir verificación por móvil. Los usuarios deben activar su móvil antes de iniciar sesión y deben proporcionarlo al registrarse, predeterminado false"
"Captcha scenarios. Bit mask: 0: off; 1: sign-in; 2: registration; 4: verification code requests (anti-SMS-bombing); combine with 3 for sign-in and registration. Mandatory scenarios are never exempted, default 0": "Escenarios de captcha. Máscara de bits: 0: desactivado; 1: inicio de sesión; 2: registro; 4: solicitudes de código de verificación (anti-bombardeo de SMS); combine con 3 para inicio de sesión y registro. Los escenarios obligatorios nunca se eximen, predeterminado 0"
"Risk-adaptive captcha. Disabled when CaptchaScene is 0; when enabled it detects unsafe environments and requires a captcha, default true": "Captcha adaptativo al riesgo. Se desactiva cuando CaptchaScene es 0; cuando está activado detecta entornos no seguros y exige un captcha, predeterminado true"
"Captcha risk threshold. Requires a captcha when the risk score reaches this value: 0: intranet; 1: internet; 2: internet with recent failures; 3: banned. Default 2": "Umbral de riesgo del captcha. Exige un captcha cuando la puntuación de riesgo alcanza este valor: 0: intranet; 1: internet; 2: internet con fallos recientes; 3: bloqueado. Predeterminado 2"
"Trusted device lifetime. Days during which previously successful devices skip adaptive captchas, default 30": "Duración de los dispositivos de confianza. Días durante los cuales los dispositivos que antes iniciaron sesión correctamente omiten los captchas adaptativos, predeterminado 30"
"Enable MFA. Allows users to enable TOTP multi-factor authentication; an enhanced feature, default false": "Habilitar MFA. Permite a los usuarios activar la autenticación multifactor TOTP; función mejorada, predeterminado false"
"File storage serving. Responds to file download requests from other nodes, default true": "Servicio de almacenamiento de archivos. Responde a las solicitudes de descarga de archivos de otros nodos, predeterminado true"
"File storage fetch. Pulls new files published by other nodes, default true": "Obtención del almacenamiento de archivos. Extrae los archivos nuevos publicados por otros nodos, predeterminado true"
"File fetch timeout. Maximum milliseconds to wait for other nodes when a file is missing locally, default 5000": "Tiempo de espera de obtención de archivos. Milisegundos máximos de espera a otros nodos cuando falta un archivo localmente, predeterminado 5000"
"Attachment storage. Local disk, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu or EasyIO; default Local": "Almacenamiento de adjuntos. Disco local, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu o EasyIO; predeterminado Local"
"Object storage server. S3-compatible endpoint for OSS/COS/Qiniu, such as oss-cn-beijing.aliyuncs.com": "Servidor de almacenamiento de objetos. Extremo compatible con S3 para OSS/COS/Qiniu, por ejemplo oss-cn-beijing.aliyuncs.com"
"Object storage bucket. Bucket name for OSS/COS/Qiniu": "Bucket de almacenamiento de objetos. Nombre del bucket para OSS/COS/Qiniu"
"Object storage region. S3 signing scope, such as cn-beijing / ap-beijing / cn-east-1": "Región del almacenamiento de objetos. Ámbito de firma S3, por ejemplo cn-beijing / ap-beijing / cn-east-1"
"Object storage app ID. AccessKeyId": "ID de aplicación del almacenamiento de objetos. AccessKeyId"
"Object storage app secret. AccessKeySecret": "Secreto de aplicación del almacenamiento de objetos. AccessKeySecret"
"Data retention. Days to keep audit and OAuth logs, default 30": "Retención de datos. Días que se conservan los registros de auditoría y OAuth, predeterminado 30"
"File retention. Days to keep backup files, default 15": "Retención de archivos. Días que se conservan los archivos de copia de seguridad, predeterminado 15"
"Retention size floor. Files smaller than this (KB) are never deleted even after the retention period, default 1024K": "Tamaño mínimo de retención. Los archivos más pequeños que este tamaño (KB) nunca se eliminan aunque superen el periodo de retención, predeterminado 1024K"
"Maximum export rows. Maximum rows a page may export, default 10_000_000": "Máximo de filas de exportación. Número máximo de filas que una página puede exportar, predeterminado 10_000_000"
"Maximum backup rows. Maximum rows a page may back up, default 10_000_000": "Máximo de filas de copia de seguridad. Número máximo de filas que una página puede respaldar, predeterminado 10_000_000"
"API prefixes. Comma- or semicolon-separated prefixes such as /api,/api/v1; matching requests are forwarded to the real route without the prefix": "Prefijos de API. Prefijos separados por comas o punto y coma como /api,/api/v1; las solicitudes coincidentes se reenvían a la ruta real sin el prefijo"
"Password strength. * means unrestricted; by default at least 8 characters with digits, upper/lower case letters and symbols. Simple form: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$": "Fortaleza de la contraseña. * significa sin restricciones; de forma predeterminada, al menos 8 caracteres con dígitos, letras mayúsculas/minúsculas y símbolos. Forma simple: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$"
"Cookie mode. Default SameSite mode for token cookies (-1 Unspecified, 0 None, 1 Lax, 2 Strict)": "Modo de cookie. Modo SameSite predeterminado para las cookies de token (-1 Unspecified, 0 None, 1 Lax, 2 Strict)"
"Cookie domain. Writes cookies to a parent domain; empty uses the current domain. A top-level domain requires HTTPS and prevents plain HTTP from writing same-name keys on the local domain": "Dominio de cookie. Escribe cookies en un dominio principal; vacío usa el dominio actual. Un dominio de nivel superior requiere HTTPS e impide que HTTP simple escriba claves con el mismo nombre en el dominio local"
"Activation URL. Front-end activation page URL used in email activation links, such as https://xxx/activate; empty builds /activate from the request host": "URL de activación. URL de la página de activación del front-end usada en los enlaces de activación por correo, por ejemplo https://xxx/activate; vacío genera /activate a partir del host de la solicitud"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default false": "Almacenar el token en una cookie. Lee el token de la cookie cuando la cabecera de la solicitud no lo incluye, predeterminado false"
"Password strength. * means unrestricted; the simple form defaults to 5 to 32 characters of any type. The full form requires at least 8 characters with digits, upper/lower case letters and symbols: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$": "Fortaleza de la contraseña. * significa sin restricciones; la forma simple admite de 5 a 32 caracteres de cualquier tipo. La forma completa exige al menos 8 caracteres con dígitos, letras mayúsculas/minúsculas y símbolos: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$"
