"You are a system operations expert. Based on the following runtime metrics, produce a health diagnosis report:\nCover bottlenecks, whether capacity should be expanded, and any risks worth attention.\nOutput the diagnosis report directly without extra explanation.": "Eres un experto en operaciones de sistemas. A partir de las siguientes métricas de tiempo de ejecución, genera un informe de diagnóstico de estado:\nAborda los cuellos de botella, si conviene ampliar la capacidad y los riesgos que merece la pena vigilar.\nMuestra el informe de diagnóstico directamente, sin explicaciones adicionales."
"Script must not be empty": "El script no puede estar vacío"
"Browser channel is not ready (Writer not injected)": "El canal del navegador no está listo (Writer no inyectado)"
"Run page script": "Ejecutar script de página"
"Runs JavaScript in the current page and returns the result; can read or modify page elements, for example document.title or document.querySelector('input[name=Name]').value": "Ejecuta JavaScript en la página actual y devuelve el resultado; puede leer o modificar elementos de la página, por ejemplo document.title o document.querySelector('input[name=Name]').value"
"JavaScript code to run in the current page": "Código JavaScript que se ejecutará en la página actual"
"Get page context": "Obtener el contexto de la página"
"Gets the main data and structure of the current page (title, tables, forms and so on). Uses the server-side context when the page provides one; otherwise collects the page content from the user's browser": "Obtiene los datos y la estructura principales de la página actual (título, tablas, formularios, etc.). Usa el contexto del servidor cuando la página lo proporciona; de lo contrario, recopila el contenido de la página desde el navegador del usuario"
"Get form schema": "Obtener el esquema del formulario"
"Gets the schema of the current form, including field names, types, descriptions and current values, for generating form values": "Obtiene el esquema del formulario actual, incluidos nombres de campo, tipos, descripciones y valores actuales, para generar valores del formulario"
"Form mode: add or edit": "Modo del formulario: agregar o editar"
"Fill form": "Rellenar formulario"
"Generates form field values and fills them into the front-end form. Nothing is written to the database until the user confirms": "Genera valores de los campos y los rellena en el formulario de la interfaz. No se escribe nada en la base de datos hasta que el usuario confirme"
"Field values as a JSON string, keyed by field name": "Valores de campo como cadena JSON, con el nombre del campo como clave"
"No valid field value dictionary was received": "No se recibió un diccionario de valores de campo válido"
"[fill_form invalid argument] No valid field value dictionary was received. Call get_form_schema first to get the field structure, then pass the values parameter as {\"field\":value}.": "[fill_form argumento no válido] No se recibió un diccionario de valores de campo válido. Llame primero a get_form_schema para obtener la estructura de los campos y luego pase el parámetro values como {\"campo\":valor}."
"Generated {0} form field values (skipped {1}, failed {2}) and filled them into the form. Ask the user to review before submitting.": "Se generaron {0} valores de campo (omitidos {1}, fallidos {2}) y se rellenaron en el formulario. Pida al usuario que los revise antes de enviar."
" descending": " descendente"
"No current record (add mode). Save first or switch to the detail/edit page.": "No hay registro actual (modo agregar). Guarde primero o cambie a la página de detalle o edición."
"Record does not exist": "El registro no existe"
"Get data context": "Obtener el contexto de datos"
"Gets the data context of the current page: the current record with its field metadata, or a summary and sample of the current query result, for analysis": "Obtiene el contexto de datos de la página actual: el registro actual con sus metadatos de campo, o un resumen y una muestra del resultado de la consulta actual, para su análisis"
"Gets the form schema of the current entity, including field names, types, enum values, required flags, descriptions and existing values (edit mode), for generating form values": "Obtiene el esquema del formulario de la entidad actual, incluidos nombres de campo, tipos, valores de enumeración, marcas de obligatoriedad, descripciones y valores existentes (modo edición), para generar valores del formulario"
"Field values as a JSON string, keyed by field name, for example {\"Name\":\"John\",\"Status\":1}": "Valores de campo como cadena JSON, con el nombre del campo como clave, por ejemplo {\"Name\":\"John\",\"Status\":1}"
"Browser operation timed out; the front end returned no result": "Se agotó el tiempo de espera de la operación del navegador; la interfaz no devolvió ningún resultado"
"Get system status": "Obtener el estado del sistema"
"Gets current server metrics such as CPU usage, memory, process working set and system information, for health diagnostics": "Obtiene las métricas actuales del servidor, como uso de CPU, memoria, conjunto de trabajo del proceso e información del sistema, para el diagnóstico de estado"
"AI is not enabled; skipped": "La IA no está habilitada; omitido"
"No logs in the last 24 hours": "No hay registros en las últimas 24 horas"
"You are a system operations expert. Analyze the following error logs and report:\n1. Error categories, ordered by frequency\n2. The most likely root cause\n3. Recommended troubleshooting steps\n\nOutput the analysis report directly without extra explanation.": "Eres un experto en operaciones de sistemas. Analiza los siguientes registros de errores e informa:\n1. Categorías de errores, ordenadas por frecuencia\n2. La causa raíz más probable\n3. Pasos de diagnóstico recomendados\n\nMuestra el informe de análisis directamente, sin explicaciones adicionales."
"Daily log report {0}": "Informe diario de registros {0}"
"Analyzed {0} log entries": "Se analizaron {0} entradas de registro"
"每天定时汇总过去 24 小时的系统日志，由 AI 生成摘要后通过通知系统推送给管理员": "Resume cada día los registros del sistema de las últimas 24 horas y envía el resumen generado por IA a los administradores"
"You are an information security expert. Based on the following security data, write a weekly security report covering:\n1. Overall security posture\n2. Risks that need attention\n3. Recommended security measures\n\nOutput the report directly without extra explanation.": "Eres un experto en seguridad de la información. A partir de los siguientes datos de seguridad, redacta un informe semanal de seguridad que cubra:\n1. Estado general de la seguridad\n2. Riesgos que requieren atención\n3. Medidas de seguridad recomendadas\n\nMuestra el informe directamente, sin explicaciones adicionales."
"Security weekly report {0} ~ {1}": "Informe semanal de seguridad {0} ~ {1}"
"Analyzed {0} OAuth log entries": "Se analizaron {0} entradas del registro OAuth"
"Security weekly report completed, OAuth {0}/{1}": "Informe semanal de seguridad completado, OAuth {0}/{1}"
"每周一分析 OAuth 登录记录，由 AI 生成安全态势报告并推送": "Analiza cada lunes los registros de inicio de sesión OAuth y envía un informe de seguridad generado por IA"
