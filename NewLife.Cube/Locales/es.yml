"系统操作菜单以及功能目录树。支持排序，不可见菜单仅用于功能权限限制。每个菜单的权限子项由系统自动生成，请不要人为修改": "Menús de operación y árbol de funciones. Admite ordenación; los menús ocultos solo restringen los permisos de las funciones. Los elementos de permiso de cada menú se generan automáticamente, no los modifique."
