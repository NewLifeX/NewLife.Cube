"Generated {0} configuration field values (skipped {1}, failed {2}) and filled them into the form. Ask the user to review before submitting.": "Se generaron {0} valores de campos de configuración (omitidos {1}, fallidos {2}) y se rellenaron en el formulario. Pida al usuario que los revise antes de enviar."
"The current page is a system configuration form (such as Cube settings); you can help review and fill in configuration items.": "La página actual es un formulario de configuración del sistema (por ejemplo, la configuración de Cube); puede ayudar a revisar y rellenar los elementos de configuración."
"Available tools: get_form_schema / fill_form / get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "Herramientas disponibles: get_form_schema / fill_form / get_page_context / get_system_info / run_js (consulte las definiciones de funciones; llámelas cuando sea necesario)"
"2. When the user asks to create, fill in or complete configuration, call get_form_schema first to inspect the items, then call fill_form to generate values (invent reasonable values for empty writable fields, keep existing values unless the user asks otherwise, and never fabricate or modify sensitive settings such as ApiKey/Secret/Token); finally ask the user to review before submitting": "2. Cuando el usuario pida crear, rellenar o completar la configuración, llame primero a get_form_schema para inspeccionar los elementos y luego a fill_form para generar los valores (invente valores razonables para los campos editables vacíos, conserve los valores existentes salvo que el usuario indique lo contrario y nunca fabrique ni modifique ajustes sensibles como ApiKey/Secret/Token); por último, pida al usuario que los revise antes de enviar"
"3. When the user asks about the content or current state of the page, call get_page_context, then give your analysis and conclusion": "3. Cuando el usuario pregunte por el contenido o el estado actual de la página, llame a get_page_context y, a continuación, proporcione su análisis y conclusión"
"4. When the user asks about system status or diagnostics, call get_system_info": "4. Cuando el usuario pregunte por el estado del sistema o los diagnósticos, llame a get_system_info"
"5. When the user asks to read or operate page elements, you may call run_js; explain any write operation (changing page content, submitting forms) to the user before running it": "5. Cuando el usuario pida leer u operar elementos de la página, puede llamar a run_js; explique al usuario cualquier operación de escritura (modificar el contenido de la página, enviar formularios) antes de ejecutarla"
"6. Never invent data; ask the user for clarification when information is insufficient": "6. No invente nunca datos; pida aclaraciones al usuario cuando la información sea insuficiente"
"The tenant identifier carried by user [{0}] is invalid or unavailable. Check the tenant settings and try again.": "El identificador de inquilino que lleva el usuario [{0}] no es válido o no está disponible. Revise la configuración del inquilino e inténtelo de nuevo."
"User [{0}] did not carry a tenant identifier, so the tenant cannot be determined. Include the tenant information and try again.": "El usuario [{0}] no lleva un identificador de inquilino, por lo que no se puede determinar el inquilino. Incluya la información del inquilino e inténtelo de nuevo."
"User [{0}] is not allowed to access the data of the current tenant. Switch tenant and try again.": "El usuario [{0}] no tiene permitido acceder a los datos del inquilino actual. Cambie de inquilino e inténtelo de nuevo."
"Not signed in or the session has expired!": "¡No ha iniciado sesión o la sesión ha caducado!"
