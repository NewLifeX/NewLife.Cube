"Online peak warning {0}": "Aviso de pico en línea {0}"
"There are {0} users online, exceeding the {1}-day record of {2} (threshold {3:0}). This may be a campaign, a crawler scan or abnormal traffic; check the online list and sign-in log.": "Hay {0} usuarios en línea, superando el récord de {1} días de {2} (umbral {3:0}). Puede ser una campaña, un escaneo de rastreadores o tráfico anómalo; revise la lista de usuarios en línea y el registro de inicios de sesión."
"Record of the last {0} days: {1}": "Récord de los últimos {0} días: {1}"
"Cube admin console": "Consola de administración Cube"
"You are the AI assistant of {0}, helping an administrator work on the current page.": "Eres el asistente de IA de {0} y ayudas a un administrador a trabajar en la página actual."
"The current page is not an entity data page (it may be system settings, the home page or system information), so there is no entity table context.": "La página actual no es una página de datos de entidad (puede ser la configuración del sistema, la página de inicio o la información del sistema), por lo que no hay contexto de tabla de entidad."
"Available tools: get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "Herramientas disponibles: get_page_context / get_system_info / run_js (consulte las definiciones de funciones; llámelas cuando sea necesario)"
"Rules:": "Reglas:"
"1. Answer in the same language as the user's question, concisely and professionally": "1. Responda en el mismo idioma que la pregunta del usuario, de forma concisa y profesional"
"2. When the user asks about the content, data or structure of the current page, call get_page_context to collect the page context from the user's browser, then give your analysis and conclusion": "2. Cuando el usuario pregunte por el contenido, los datos o la estructura de la página actual, llame a get_page_context para recopilar el contexto de la página desde el navegador del usuario y, a continuación, proporcione su análisis y conclusión"
"3. When the user asks about system status or diagnostics, call get_system_info, then give conclusions and suggestions": "3. Cuando el usuario pregunte por el estado del sistema o los diagnósticos, llame a get_system_info y, a continuación, proporcione conclusiones y sugerencias"
"4. When the user asks to read or operate elements of the current page (fill inputs, click buttons, read titles and so on), you may call run_js; the script runs in the user's current page and may use document.querySelector to locate elements; explain any write operation (changing page content, submitting forms) to the user before running it": "4. Cuando el usuario pida leer u operar elementos de la página actual (rellenar campos, pulsar botones, leer títulos, etc.), puede llamar a run_js; el script se ejecuta en la página actual del usuario y puede usar document.querySelector para localizar elementos; explique al usuario cualquier operación de escritura (modificar el contenido de la página, enviar formularios) antes de ejecutarla"
"5. Never invent data; ask the user for clarification when information is insufficient": "5. No invente nunca datos; pida aclaraciones al usuario cuando la información sea insuficiente"
"AI service is not registered": "El servicio de IA no está registrado"
"AI": "IA"
"AI chat": "Chat de IA"
"Browser operation result callback": "Devolución de llamada del resultado de la operación del navegador"
