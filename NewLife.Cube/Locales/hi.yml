"Available tools: get_form_schema / fill_form / get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "उपलब्ध टूल: get_form_schema / fill_form / get_page_context / get_system_info / run_js (फ़ंक्शन परिभाषाएँ देखें; ज़रूरत पड़ने पर इन्हें कॉल करें)"
"2. When the user asks to create, fill in or complete configuration, call get_form_schema first to inspect the items, then call fill_form to generate values (invent reasonable values for empty writable fields, keep existing values unless the user asks otherwise, and never fabricate or modify sensitive settings such as ApiKey/Secret/Token); finally ask the user to review before submitting": "2. जब उपयोगकर्ता कॉन्फ़िगरेशन बनाने, भरने या पूरा करने के लिए कहे, तो पहले आइटम देखने के लिए get_form_schema कॉल करें, फिर मान बनाने के लिए fill_form कॉल करें (खाली लिखने योग्य फ़ील्ड के लिए उचित मान सुझाएँ, जब तक उपयोगकर्ता अन्यथा न कहे मौजूदा मान रखें, और ApiKey/Secret/Token जैसी संवेदनशील सेटिंग्स कभी न गढ़ें न बदलें); अंत में सबमिट करने से पहले उपयोगकर्ता से समीक्षा करने को कहें"
"3. When the user asks about the content or current state of the page, call get_page_context, then give your analysis and conclusion": "3. जब उपयोगकर्ता पृष्ठ की सामग्री या वर्तमान स्थिति के बारे में पूछे, तो get_page_context कॉल करें, फिर अपना विश्लेषण और निष्कर्ष दें"
"4. When the user asks about system status or diagnostics, call get_system_info": "4. जब उपयोगकर्ता सिस्टम स्थिति या निदान के बारे में पूछे, तो get_system_info कॉल करें"
"5. When the user asks to read or operate page elements, you may call run_js; explain any write operation (changing page content, submitting forms) to the user before running it": "5. जब उपयोगकर्ता पृष्ठ तत्वों को पढ़ने या संचालित करने के लिए कहे, तो आप run_js कॉल कर सकते हैं; चलाने से पहले किसी भी लेखन क्रिया (पृष्ठ सामग्री बदलना, फ़ॉर्म सबमिट करना) को उपयोगकर्ता को समझाएँ"
"6. Never invent data; ask the user for clarification when information is insufficient": "6. कभी भी डेटा गढ़ें नहीं; जानकारी अपर्याप्त होने पर उपयोगकर्ता से स्पष्टीकरण माँगें"
"The tenant identifier carried by user [{0}] is invalid or unavailable. Check the tenant settings and try again.": "उपयोगकर्ता [{0}] द्वारा भेजा गया टेनेंट पहचानकर्ता अमान्य या अनुपलब्ध है। टेनेंट सेटिंग्स जाँचें और पुनः प्रयास करें।"
"User [{0}] did not carry a tenant identifier, so the tenant cannot be determined. Include the tenant information and try again.": "उपयोगकर्ता [{0}] ने टेनेंट पहचानकर्ता नहीं भेजा, इसलिए टेनेंट निर्धारित नहीं किया जा सकता। टेनेंट जानकारी शामिल करें और पुनः प्रयास करें।"
"User [{0}] is not allowed to access the data of the current tenant. Switch tenant and try again.": "उपयोगकर्ता [{0}] को वर्तमान टेनेंट का डेटा एक्सेस करने की अनुमति नहीं है। टेनेंट बदलें और पुनः प्रयास करें।"
