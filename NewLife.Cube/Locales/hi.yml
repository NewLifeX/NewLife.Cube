"CORS origins. Other origins allowed to access this site; * allows any origin": "CORS मूल। इस साइट तक पहुँचने की अनुमति वाले अन्य मूल; * किसी भी मूल की अनुमति देता है"
"Iframe embedding. Empty allows the same domain only; SAMEORIGIN allows the same domain and port; ALLOWALL allows any domain": "Iframe एम्बेडिंग। खाली रखने पर केवल समान डोमेन की अनुमति; SAMEORIGIN समान डोमेन और पोर्ट की अनुमति देता है; ALLOWALL किसी भी डोमेन की अनुमति देता है"
"Share expiration. Lifetime of share tokens in seconds, default 7200": "शेयर समाप्ति। शेयर टोकन का जीवनकाल सेकंड में, डिफ़ॉल्ट 7200"
"Bot error code. Returns this error for crawlers, such as 404/500; 0 disables blocking": "बॉट त्रुटि कोड। क्रॉलर के लिए यह त्रुटि लौटाता है, जैसे 404/500; 0 ब्लॉकिंग अक्षम करता है"
"Force redirect. Target scheme and host for GET requests; * is supported in the host. Commonly used to force HTTPS, such as https://*:8081": "जबरन रीडायरेक्ट। GET अनुरोधों के लिए लक्ष्य स्कीम और होस्ट; होस्ट में * समर्थित है। आमतौर पर HTTPS पर जबरन रीडायरेक्ट के लिए उपयोग होता है, जैसे https://*:8081"
"Security mode. 0: off; 1: observe and log only; 2: block; 3: automatic (default; observes, bans repeated attackers, and temporarily blocks broad attacks with automatic rollback)": "सुरक्षा मोड। 0: बंद; 1: केवल निरीक्षण और लॉग; 2: ब्लॉक; 3: स्वचालित (डिफ़ॉल्ट; निरीक्षण करता है, बार-बार हमला करने वालों को ब्लॉक करता है, और स्वचालित रोलबैक के साथ व्यापक हमलों को अस्थायी रूप से ब्लॉक करता है)"
"Auto-ban durations. Comma-separated seconds that increase with each trigger; empty uses 60,300,1800,7200,86400": "स्वतः-ब्लॉक अवधि। अल्पविराम से अलग सेकंड जो प्रत्येक ट्रिगर के साथ बढ़ते हैं; खाली रखने पर 60,300,1800,7200,86400"
"Trusted proxies. Forwarded headers are only trusted from these comma-separated IPs or CIDR ranges; empty keeps the legacy behavior of trusting all forwarded headers": "विश्वसनीय प्रॉक्सी। फ़ॉरवर्ड किए गए हेडर केवल इन अल्पविराम-पृथक IP या CIDR श्रेणियों से विश्वसनीय माने जाते हैं; खाली रखने पर सभी फ़ॉरवर्ड हेडर पर विश्वास करने का पुराना व्यवहार बना रहता है"
"Trusted proxy learning limit. When no trusted proxies are configured, private direct sources that send forwarded headers are learned up to this count; 0 disables learning (typically 2 for one data center, 4 for two)": "विश्वसनीय प्रॉक्सी सीखने की सीमा। जब कोई विश्वसनीय प्रॉक्सी कॉन्फ़िगर नहीं है, तो फ़ॉरवर्ड हेडर भेजने वाले निजी प्रत्यक्ष स्रोत इस संख्या तक सीखे जाते हैं; 0 सीखना अक्षम करता है (एक डेटा सेंटर के लिए सामान्यतः 2, दो के लिए 4)"
"Learned proxies. Maintained automatically; clear it to reset the learned list": "सीखी गई प्रॉक्सी। स्वचालित रूप से बनाए रखी जाती हैं; सीखी गई सूची रीसेट करने के लिए इसे साफ़ करें"
"Default role. Defaults to the Normal User role": "डिफ़ॉल्ट भूमिका। डिफ़ॉल्ट रूप से सामान्य उपयोगकर्ता भूमिका"
"Allow password sign-in. Allows signing in with a username and password": "पासवर्ड साइन-इन की अनुमति। उपयोगकर्ता नाम और पासवर्ड से साइन इन करने की अनुमति देता है"
"Allow plain-text passwords. Default true for legacy clients; false forces Challenge-Response encrypted passwords": "सादे पाठ पासवर्ड की अनुमति। पुराने क्लाइंट के लिए डिफ़ॉल्ट true; false Challenge-Response एन्क्रिप्टेड पासवर्ड अनिवार्य करता है"
"Allow registration. Allows registering with a username and password": "पंजीकरण की अनुमति। उपयोगकर्ता नाम और पासवर्ड से पंजीकरण करने की अनुमति देता है"
"Auto registration. Default true; after SSO sign-in an unknown local user is registered automatically. Enabled when either the global or the OAuth app setting is on": "स्वतः पंजीकरण। डिफ़ॉल्ट true; SSO साइन-इन के बाद अज्ञात स्थानीय उपयोगकर्ता स्वतः पंजीकृत हो जाता है। वैश्विक या OAuth ऐप सेटिंग में से कोई एक चालू होने पर सक्षम"
"Password complexity check. When enabled the sign-in page validates password strength; when disabled it only requires a non-empty password. Default true": "पासवर्ड जटिलता जाँच। सक्षम होने पर साइन-इन पृष्ठ पासवर्ड की मज़बूती जाँचता है; अक्षम होने पर केवल गैर-रिक्त पासवर्ड आवश्यक है। डिफ़ॉल्ट true"
"Login failure limit. Bans sign-in after this many consecutive failures for the same user or IP, default 5": "लॉगिन विफलता सीमा। समान उपयोगकर्ता या IP के लिए इतनी लगातार विफलताओं के बाद साइन-इन पर ब्लॉक लगाता है, डिफ़ॉल्ट 5"
"Login ban duration. Seconds a risk-control ban lasts, default 300": "लॉगिन ब्लॉक अवधि। जोखिम-नियंत्रण ब्लॉक कितने सेकंड चलता है, डिफ़ॉल्ट 300"
"Class C subnet ban threshold. Bans a /24 subnet such as 103.125.146.* after this many failures, default 10; 0 disables": "क्लास C सबनेट ब्लॉक सीमा। इतनी विफलताओं के बाद 103.125.146.* जैसे /24 सबनेट पर ब्लॉक लगाता है, डिफ़ॉल्ट 10; 0 अक्षम करता है"
"Class B subnet ban threshold. Bans a /16 subnet such as 103.125.*.* after this many failures, default 20; 0 disables": "क्लास B सबनेट ब्लॉक सीमा। इतनी विफलताओं के बाद 103.125.*.* जैसे /16 सबनेट पर ब्लॉक लगाता है, डिफ़ॉल्ट 20; 0 अक्षम करता है"
"Force bind by user name. Binds SSO users to local users with the same name without a provider prefix; intended for user centers": "उपयोगकर्ता नाम से जबरन बाइंड। SSO उपयोगकर्ताओं को प्रदाता उपसर्ग के बिना समान नाम वाले स्थानीय उपयोगकर्ताओं से बाँधता है; उपयोगकर्ता केंद्रों के लिए"
"Bind by user code. Binds SSO users to local users by user code": "उपयोगकर्ता कोड से बाइंड। SSO उपयोगकर्ताओं को उपयोगकर्ता कोड द्वारा स्थानीय उपयोगकर्ताओं से बाँधता है"
"Bind by mobile. Binds SSO users to local users by mobile number": "मोबाइल से बाइंड। SSO उपयोगकर्ताओं को मोबाइल नंबर द्वारा स्थानीय उपयोगकर्ताओं से बाँधता है"
"Bind by email. Binds SSO users to local users by email": "ईमेल से बाइंड। SSO उपयोगकर्ताओं को ईमेल द्वारा स्थानीय उपयोगकर्ताओं से बाँधता है"
"Bind by nickname. Binds SSO users to local users by nickname; suitable for internal SSO, not for social networks with many duplicate names": "उपनाम से बाइंड। SSO उपयोगकर्ताओं को उपनाम द्वारा स्थानीय उपयोगकर्ताओं से बाँधता है; आंतरिक SSO के लिए उपयुक्त, बहुत अधिक समान नामों वाले सोशल नेटवर्क के लिए नहीं"
"Use SSO roles. Keeps SSO roles after sign-in, default true; otherwise DefaultRole is used": "SSO भूमिकाओं का उपयोग। साइन-इन के बाद SSO भूमिकाएँ रखता है, डिफ़ॉल्ट true; अन्यथा DefaultRole उपयोग होता है"
"Use SSO departments. Keeps SSO departments after sign-in, default true": "SSO विभागों का उपयोग। साइन-इन के बाद SSO विभाग रखता है, डिफ़ॉल्ट true"
"SSO role rules. Automatically upgrades the primary role after SSO sign-in; separate rules with commas. Format: source role+department wildcard=target role, for example Guest+Route*=Route Specialist": "SSO भूमिका नियम। SSO साइन-इन के बाद प्राथमिक भूमिका को स्वतः अपग्रेड करता है; नियमों को अल्पविराम से अलग करें। प्रारूप: स्रोत भूमिका+विभाग वाइल्डकार्ड=लक्ष्य भूमिका, उदाहरण Guest+Route*=Route Specialist"
"Sign out everywhere. false signs out of this site only; true (default) also signs out of the SSO server": "सभी जगह साइन आउट। false केवल इस साइट से साइन आउट करता है; true (डिफ़ॉल्ट) SSO सर्वर से भी साइन आउट करता है"
"Allow multi-device sign-in. false kicks old devices on a new sign-in and revokes all tokens on sign-out; true (default) revokes only the current session": "बहु-डिवाइस साइन-इन की अनुमति। false नए साइन-इन पर पुराने डिवाइस हटा देता है और साइन आउट पर सभी टोकन रद्द करता है; true (डिफ़ॉल्ट) केवल वर्तमान सत्र रद्द करता है"
"Session timeout. Session lifetime after SSO sign-in during which the cookie can sign in again; default 0s": "सत्र समय-सीमा। SSO साइन-इन के बाद सत्र का जीवनकाल जिसके दौरान कुकी फिर से साइन इन कर सकती है; डिफ़ॉल्ट 0s"
"Token sliding refresh threshold. Refreshes the JWT and rewrites the cookie when its remaining lifetime falls below this many seconds; 0 disables sliding expiration": "टोकन स्लाइडिंग रीफ़्रेश सीमा। जब JWT का शेष जीवनकाल इतने सेकंड से कम हो जाता है तो JWT रीफ़्रेश करता है और कुकी फिर से लिखता है; 0 स्लाइडिंग समाप्ति अक्षम करता है"
"User refresh period. Fetches user information once per period across SSO sign-ins, default 600 seconds": "उपयोगकर्ता रीफ़्रेश अवधि। SSO साइन-इन में प्रति अवधि एक बार उपयोगकर्ता जानकारी प्राप्त करता है, डिफ़ॉल्ट 600 सेकंड"
"JWT secret. Algorithm and key used to sign JWTs, such as HS256:ABCD1234": "JWT गुप्त कुंजी। JWT पर हस्ताक्षर करने के लिए उपयोग किया जाने वाला एल्गोरिदम और कुंजी, जैसे HS256:ABCD1234"
"Token lifetime. Lifetime of the access token in seconds, default 7200": "टोकन जीवनकाल। एक्सेस टोकन का जीवनकाल सेकंड में, डिफ़ॉल्ट 7200"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default true": "टोकन कुकी में संग्रहीत करें। जब अनुरोध हेडर में टोकन नहीं होता, तब कुकी से टोकन पढ़ता है, डिफ़ॉल्ट true"
"Validate attachment access. Requires sign-in to access attachments, default true": "अनुलग्नक पहुँच सत्यापित करें। अनुलग्नक तक पहुँचने के लिए साइन इन आवश्यक, डिफ़ॉल्ट true"
"Public attachment categories. Categories accessible without sign-in, comma-separated, such as markdown,avatar. Applies when ValidateAttachment is true": "सार्वजनिक अनुलग्नक श्रेणियाँ। साइन इन के बिना पहुँचने योग्य श्रेणियाँ, अल्पविराम से अलग, जैसे markdown,avatar। ValidateAttachment true होने पर लागू"
"Private attachment categories. Categories only the uploader can access, comma-separated. Applies when ValidateAttachment is true": "निजी अनुलग्नक श्रेणियाँ। केवल अपलोडकर्ता ही पहुँच सकता है, अल्पविराम से अलग। ValidateAttachment true होने पर लागू"
"SSO redirect allowlist. Domains allowed to receive the JWT after sign-in, comma-separated with wildcard prefixes such as *.company.com. Empty allows the same site only; other origins are rejected and sent back to the home page": "SSO रीडायरेक्ट अनुमत सूची। साइन-इन के बाद JWT प्राप्त करने की अनुमति वाले डोमेन, अल्पविराम से अलग और *.company.com जैसे वाइल्डकार्ड उपसर्ग के साथ। खाली रखने पर केवल समान साइट की अनुमति; अन्य मूल अस्वीकृत और मुखपृष्ठ पर वापस भेजे जाते हैं"
"External authentication URL. When local authentication fails, credentials are verified by this endpoint; on success the local user is created or updated and signed in": "बाहरी प्रमाणीकरण URL। जब स्थानीय प्रमाणीकरण विफल होता है, तो क्रेडेंशियल इस एंडपॉइंट से सत्यापित किए जाते हैं; सफल होने पर स्थानीय उपयोगकर्ता बनाया या अद्यतन किया जाता है और साइन इन कराया जाता है"
"Start page. First content page opened after entering the admin console": "प्रारंभ पृष्ठ। प्रशासन कंसोल में प्रवेश करने के बाद खुलने वाला पहला सामग्री पृष्ठ"
"Theme. Content page theme, ACE/layui": "थीम। सामग्री पृष्ठ थीम, ACE/layui"
"Skin. Outer frame layout, ACE/layui": "स्किन। बाहरी फ़्रेम लेआउट, ACE/layui"
"Login tip. Empty hides the tip on the sign-in page": "लॉगिन संकेत। खाली रखने पर साइन-इन पृष्ठ पर संकेत छिप जाता है"
"Login logo. Empty uses the default logo": "लॉगिन लोगो। खाली रखने पर डिफ़ॉल्ट लोगो उपयोग होता है"
"Login background. Image URL; empty uses the default background": "लॉगिन पृष्ठभूमि। छवि URL; खाली रखने पर डिफ़ॉल्ट पृष्ठभूमि उपयोग होती है"
"Form group layout. 3/2/1 columns on large/medium/small screens, form-group col-xs-12 col-sm-6 col-lg-4": "फ़ॉर्म समूह लेआउट। बड़ी/मध्यम/छोटी स्क्रीन पर 3/2/1 कॉलम, form-group col-xs-12 col-sm-6 col-lg-4"
"Bootstrap select. Nicer drop-downs with a rendering cost": "Bootstrap select। अधिक सुंदर ड्रॉप-डाउन, पर रेंडरिंग लागत के साथ"
"Maximum drop-down items. Maximum options in a related drop-down on forms, default 50; larger lists fall back to a text box": "अधिकतम ड्रॉप-डाउन आइटम। फ़ॉर्म पर संबंधित ड्रॉप-डाउन में अधिकतम विकल्प, डिफ़ॉल्ट 50; बड़ी सूचियाँ टेक्स्ट बॉक्स पर वापस चली जाती हैं"
"Copyright. Empty hides the copyright; variables now/runtime/framework are supported, and now accepts formats such as {now:yyyy}": "कॉपीराइट। खाली रखने पर कॉपीराइट छिप जाता है; now/runtime/framework वेरिएबल समर्थित हैं, और now {now:yyyy} जैसे प्रारूप स्वीकार करता है"
"Filing number. Empty hides the filing information": "फ़ाइलिंग नंबर। खाली रखने पर फ़ाइलिंग जानकारी छिप जाती है"
"Enable new UI": "नया UI सक्षम करें"
"ECharts theme. Chart theme": "ECharts थीम। चार्ट थीम"
"Title suffix. Appends the system name to page titles, default true": "शीर्षक प्रत्यय। पृष्ठ शीर्षकों में सिस्टम नाम जोड़ता है, डिफ़ॉल्ट true"
"Table double-click. Enables row double-click on list pages, default true": "तालिका डबल-क्लिक। सूची पृष्ठों पर पंक्ति डबल-क्लिक सक्षम करता है, डिफ़ॉल्ट true"
"Table style. Light: minimal thin lines; Standard: clear row lines (default); Grid: full cell borders": "तालिका शैली। Light: न्यूनतम पतली रेखाएँ; Standard: स्पष्ट पंक्ति रेखाएँ (डिफ़ॉल्ट); Grid: पूर्ण सेल सीमाएँ"
"Table density. Compact: dense and information-rich (default); Normal: relaxed": "तालिका घनत्व। Compact: सघन और अधिक जानकारी (डिफ़ॉल्ट); Normal: खुला"
"Stardust web. Stardust console URL; supports direct links to /trace?id={traceId} or /graph?id={traceId}": "Stardust वेब। Stardust कंसोल URL; /trace?id={traceId} या /graph?id={traceId} पर सीधे लिंक समर्थित हैं"
"AI master switch. Enables AI features such as log analysis and notification polishing, default false": "AI मुख्य स्विच। लॉग विश्लेषण और सूचना परिष्करण जैसी AI सुविधाएँ सक्षम करता है, डिफ़ॉल्ट false"
"AI provider. Supports NewLife, Ollama, DeepSeek, DashScope, OpenAI and others; default NewLife": "AI प्रदाता। NewLife, Ollama, DeepSeek, DashScope, OpenAI और अन्य का समर्थन करता है; डिफ़ॉल्ट NewLife"
"AI endpoint. Defaults to https://ai.newlifex.com for NewLife": "AI एंडपॉइंट। NewLife के लिए डिफ़ॉल्ट https://ai.newlifex.com"
"AI ApiKey. Defaults to sk-CubeAI2026 for NewLife": "AI ApiKey। NewLife के लिए डिफ़ॉल्ट sk-CubeAI2026"
"AI default model. Defaults to newlife-flash for NewLife": "AI डिफ़ॉल्ट मॉडल। NewLife के लिए डिफ़ॉल्ट newlife-flash"
"AI default deep reasoning. Enables think mode for analysis and chat by default; false means fast responses": "AI डिफ़ॉल्ट गहन तर्क। विश्लेषण और चैट के लिए डिफ़ॉल्ट रूप से think मोड सक्षम करता है; false का अर्थ त्वरित प्रतिक्रियाएँ"
"AI color scheme. Fills the primary and secondary colors from a preset": "AI रंग योजना। प्रीसेट से प्राथमिक और द्वितीयक रंग भरता है"
"AI primary color. Main color of the launcher, panel header and user bubbles; default NewLife green #2ecc71": "AI प्राथमिक रंग। लॉन्चर, पैनल हेडर और उपयोगकर्ता बबल का मुख्य रंग; डिफ़ॉल्ट NewLife हरा #2ecc71"
"AI secondary color. Gradient end color, default dark green #1e8e3e": "AI द्वितीयक रंग। ग्रेडिएंट का अंतिम रंग, डिफ़ॉल्ट गहरा हरा #1e8e3e"
"OAuth server. Enables the OAuth 2.0 server that provides SSO for other applications": "OAuth सर्वर। अन्य एप्लिकेशन के लिए SSO प्रदान करने वाला OAuth 2.0 सर्वर सक्षम करता है"
"File manager. Enables backend file management (browse, upload, download, delete); this carries security risks": "फ़ाइल प्रबंधक। बैकएंड फ़ाइल प्रबंधन सक्षम करता है (ब्राउज़, अपलोड, डाउनलोड, हटाएँ); इसमें सुरक्षा जोखिम हैं"
"Multi-tenancy. Enables tenants; tenant mode cannot access system administration and platform mode cannot access tenant pages": "बहु-टेनेंसी। टेनेंट सक्षम करता है; टेनेंट मोड सिस्टम प्रशासन तक नहीं पहुँच सकता और प्लेटफ़ॉर्म मोड टेनेंट पृष्ठों तक नहीं पहुँच सकता"
"Tenant query policy. DenyWithEmpty: return an empty set without tenant context; ThrowOnMissingTenant: throw an explicit error": "टेनेंट क्वेरी नीति। DenyWithEmpty: टेनेंट संदर्भ के बिना रिक्त सेट लौटाएँ; ThrowOnMissingTenant: स्पष्ट त्रुटि उत्पन्न करें"
"User online. 0: do not record; 1: signed-in users only; 2: all visitors (default)": "ऑनलाइन उपयोगकर्ता। 0: रिकॉर्ड न करें; 1: केवल साइन-इन उपयोगकर्ता; 2: सभी आगंतुक (डिफ़ॉल्ट)"
"User statistics. Records user visits, default true": "उपयोगकर्ता आँकड़े। उपयोगकर्ता विज़िट रिकॉर्ड करता है, डिफ़ॉल्ट true"
"Enable SMS. SMS verification codes and system notifications, default false": "SMS सक्षम करें। SMS सत्यापन कोड और सिस्टम सूचनाएँ, डिफ़ॉल्ट false"
"Enable email. Email verification codes and system notifications, default false": "ईमेल सक्षम करें। ईमेल सत्यापन कोड और सिस्टम सूचनाएँ, डिफ़ॉल्ट false"
"Require email verification. Users must activate their email before signing in and must provide one when registering, default false": "ईमेल सत्यापन आवश्यक। उपयोगकर्ताओं को साइन इन करने से पहले अपना ईमेल सक्रिय करना होगा और पंजीकरण के समय ईमेल देना होगा, डिफ़ॉल्ट false"
"Require mobile verification. Users must activate their mobile before signing in and must provide one when registering, default false": "मोबाइल सत्यापन आवश्यक। उपयोगकर्ताओं को साइन इन करने से पहले अपना मोबाइल सक्रिय करना होगा और पंजीकरण के समय मोबाइल देना होगा, डिफ़ॉल्ट false"
"Captcha scenarios. Bit mask: 0: off; 1: sign-in; 2: registration; 4: verification code requests (anti-SMS-bombing); combine with 3 for sign-in and registration. Mandatory scenarios are never exempted, default 0": "कैप्चा परिदृश्य। बिट मास्क: 0: बंद; 1: साइन-इन; 2: पंजीकरण; 4: सत्यापन कोड अनुरोध (SMS-बमबारी रोकथाम); साइन-इन और पंजीकरण के लिए 3 के साथ संयोजित करें। अनिवार्य परिदृश्यों को कभी छूट नहीं, डिफ़ॉल्ट 0"
"Risk-adaptive captcha. Disabled when CaptchaScene is 0; when enabled it detects unsafe environments and requires a captcha, default true": "जोखिम-अनुकूल कैप्चा। CaptchaScene 0 होने पर अक्षम; सक्षम होने पर असुरक्षित वातावरण का पता लगाता है और कैप्चा आवश्यक करता है, डिफ़ॉल्ट true"
"Captcha risk threshold. Requires a captcha when the risk score reaches this value: 0: intranet; 1: internet; 2: internet with recent failures; 3: banned. Default 2": "कैप्चा जोखिम सीमा। जोखिम स्कोर इस मान तक पहुँचने पर कैप्चा आवश्यक: 0: इंट्रानेट; 1: इंटरनेट; 2: हाल की विफलताओं सहित इंटरनेट; 3: ब्लॉक किया गया। डिफ़ॉल्ट 2"
"Trusted device lifetime. Days during which previously successful devices skip adaptive captchas, default 30": "विश्वसनीय डिवाइस जीवनकाल। इतने दिनों तक पहले सफल रहे डिवाइस अनुकूली कैप्चा छोड़ सकते हैं, डिफ़ॉल्ट 30"
"Enable MFA. Allows users to enable TOTP multi-factor authentication; an enhanced feature, default false": "MFA सक्षम करें। उपयोगकर्ताओं को TOTP बहु-कारक प्रमाणीकरण सक्षम करने देता है; एक उन्नत सुविधा, डिफ़ॉल्ट false"
"File storage serving. Responds to file download requests from other nodes, default true": "फ़ाइल संग्रहण सर्विंग। अन्य नोड्स के फ़ाइल डाउनलोड अनुरोधों का उत्तर देता है, डिफ़ॉल्ट true"
"File storage fetch. Pulls new files published by other nodes, default true": "फ़ाइल संग्रहण फ़ेच। अन्य नोड्स द्वारा प्रकाशित नई फ़ाइलें खींचता है, डिफ़ॉल्ट true"
"File fetch timeout. Maximum milliseconds to wait for other nodes when a file is missing locally, default 5000": "फ़ाइल फ़ेच समय-सीमा। स्थानीय रूप से फ़ाइल न होने पर अन्य नोड्स की प्रतीक्षा के अधिकतम मिलीसेकंड, डिफ़ॉल्ट 5000"
"Attachment storage. Local disk, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu or EasyIO; default Local": "अनुलग्नक संग्रहण। स्थानीय डिस्क, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu या EasyIO; डिफ़ॉल्ट Local"
"Object storage server. S3-compatible endpoint for OSS/COS/Qiniu, such as oss-cn-beijing.aliyuncs.com": "ऑब्जेक्ट संग्रहण सर्वर। OSS/COS/Qiniu के लिए S3-संगत एंडपॉइंट, जैसे oss-cn-beijing.aliyuncs.com"
"Object storage bucket. Bucket name for OSS/COS/Qiniu": "ऑब्जेक्ट संग्रहण बकेट। OSS/COS/Qiniu के लिए बकेट नाम"
"Object storage region. S3 signing scope, such as cn-beijing / ap-beijing / cn-east-1": "ऑब्जेक्ट संग्रहण क्षेत्र। S3 हस्ताक्षर स्कोप, जैसे cn-beijing / ap-beijing / cn-east-1"
"Object storage app ID. AccessKeyId": "ऑब्जेक्ट संग्रहण ऐप आईडी। AccessKeyId"
"Object storage app secret. AccessKeySecret": "ऑब्जेक्ट संग्रहण ऐप गुप्त कुंजी। AccessKeySecret"
"Data retention. Days to keep audit and OAuth logs, default 30": "डेटा प्रतिधारण। ऑडिट और OAuth लॉग रखने के दिन, डिफ़ॉल्ट 30"
"File retention. Days to keep backup files, default 15": "फ़ाइल प्रतिधारण। बैकअप फ़ाइलें रखने के दिन, डिफ़ॉल्ट 15"
"Retention size floor. Files smaller than this (KB) are never deleted even after the retention period, default 1024K": "प्रतिधारण आकार न्यूनतम। इससे छोटी फ़ाइलें (KB) प्रतिधारण अवधि बीतने पर भी कभी नहीं हटाई जातीं, डिफ़ॉल्ट 1024K"
"Maximum export rows. Maximum rows a page may export, default 10_000_000": "अधिकतम निर्यात पंक्तियाँ। एक पृष्ठ अधिकतम इतनी पंक्तियाँ निर्यात कर सकता है, डिफ़ॉल्ट 10_000_000"
"Maximum backup rows. Maximum rows a page may back up, default 10_000_000": "अधिकतम बैकअप पंक्तियाँ। एक पृष्ठ अधिकतम इतनी पंक्तियों का बैकअप ले सकता है, डिफ़ॉल्ट 10_000_000"
"API prefixes. Comma- or semicolon-separated prefixes such as /api,/api/v1; matching requests are forwarded to the real route without the prefix": "API उपसर्ग। अल्पविराम या अर्धविराम से अलग उपसर्ग जैसे /api,/api/v1; मेल खाने वाले अनुरोध उपसर्ग के बिना वास्तविक मार्ग पर अग्रेषित किए जाते हैं"
"Password strength. * means unrestricted; by default at least 8 characters with digits, upper/lower case letters and symbols. Simple form: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$": "पासवर्ड मज़बूती। * का अर्थ अप्रतिबंधित; डिफ़ॉल्ट रूप से कम से कम 8 वर्ण जिनमें अंक, बड़े/छोटे अक्षर और प्रतीक हों। सरल रूप: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$"
"Cookie mode. Default SameSite mode for token cookies (-1 Unspecified, 0 None, 1 Lax, 2 Strict)": "कुकी मोड। टोकन कुकी के लिए डिफ़ॉल्ट SameSite मोड (-1 Unspecified, 0 None, 1 Lax, 2 Strict)"
"Cookie domain. Writes cookies to a parent domain; empty uses the current domain. A top-level domain requires HTTPS and prevents plain HTTP from writing same-name keys on the local domain": "कुकी डोमेन। कुकी को मूल डोमेन में लिखता है; खाली रखने पर वर्तमान डोमेन उपयोग होता है। शीर्ष-स्तरीय डोमेन के लिए HTTPS आवश्यक है और यह सादे HTTP को स्थानीय डोमेन पर समान नाम की कुंजियाँ लिखने से रोकता है"
"Activation URL. Front-end activation page URL used in email activation links, such as https://xxx/activate; empty builds /activate from the request host": "सक्रियण URL। ईमेल सक्रियण लिंक में उपयोग होने वाला फ़्रंट-एंड सक्रियण पृष्ठ URL, जैसे https://xxx/activate; खाली रखने पर अनुरोध होस्ट से /activate बनाया जाता है"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default false": "टोकन कुकी में संग्रहीत करें। जब अनुरोध हेडर में टोकन नहीं होता, तब कुकी से टोकन पढ़ता है, डिफ़ॉल्ट false"
"Password strength. * means unrestricted; the simple form defaults to 5 to 32 characters of any type. The full form requires at least 8 characters with digits, upper/lower case letters and symbols: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$": "पासवर्ड मज़बूती। * का अर्थ अप्रतिबंधित; सरल रूप में डिफ़ॉल्ट 5 से 32 वर्ण किसी भी प्रकार के होते हैं। पूर्ण रूप में अंकों, बड़े/छोटे अक्षरों और प्रतीकों सहित कम से कम 8 वर्ण आवश्यक हैं: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$"
