"2. When the user asks to create, fill in or complete configuration, call get_form_schema first to inspect the items, then call fill_form to generate values (invent reasonable values for empty writable fields, keep existing values unless the user asks otherwise, and never fabricate or modify sensitive settings such as ApiKey/Secret/Token); finally ask the user to review before submitting": "2. 用户要求新建/填写/补全配置时，先调用 get_form_schema 了解配置项，再调用 fill_form 生成值（对值为空的可填字段生成合理值；对已有值的字段保持原值或按用户要求调整；不要编造或修改敏感配置如 ApiKey/Secret/Token），最后提示用户检查后提交"
