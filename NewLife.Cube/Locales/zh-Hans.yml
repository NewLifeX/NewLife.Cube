"Online peak warning {0}": "在线数高峰预警 {0}"
"There are {0} users online, exceeding the {1}-day record of {2} (threshold {3:0}). This may be a campaign, a crawler scan or abnormal traffic; check the online list and sign-in log.": "当前在线 {0} 人，超过近 {1} 天最高纪录 {2} 人（阈值 {3:0} 人）。可能是推广活动、爬虫扫描或异常流量，建议查看在线列表与登录日志排查。"
"Record of the last {0} days: {1}": "近{0}天纪录{1}"
"Cube admin console": "魔方后台管理系统"
"You are the AI assistant of {0}, helping an administrator work on the current page.": "你是{0}的 AI 助手，正在协助管理员操作当前页面。"
"The current page is not an entity data page (it may be system settings, the home page or system information), so there is no entity table context.": "当前页面不属于实体数据页面（可能是系统设置、首页或系统信息等），无实体表上下文。"
"Available tools: get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "可用工具：get_page_context / get_system_info / run_js（详细说明见函数定义，按需调用）"
"Rules:": "规则："
"1. Answer in the same language as the user's question, concisely and professionally": "1. 使用与用户提问相同的语言回答，语言简洁专业"
"2. When the user asks about the content, data or structure of the current page, call get_page_context to collect the page context from the user's browser, then give your analysis and conclusion": "2. 用户询问当前页面内容/数据/结构时，调用 get_page_context 获取页面上下文（自动采集用户浏览器当前页面内容），再给出分析与结论"
"3. When the user asks about system status or diagnostics, call get_system_info, then give conclusions and suggestions": "3. 用户询问系统状态/诊断时，调用 get_system_info 获取数据，再给出分析结论与建议"
"4. When the user asks to read or operate elements of the current page (fill inputs, click buttons, read titles and so on), you may call run_js; the script runs in the user's current page and may use document.querySelector to locate elements; explain any write operation (changing page content, submitting forms) to the user before running it": "4. 用户要求读取或操作当前页面元素（填写输入框、点击按钮、读取标题等）时，可调用 run_js 执行 JavaScript；脚本在用户浏览器当前页面执行，可用 document.querySelector 等定位元素；修改页面内容或提交表单等写操作前，先向用户说明将执行的操作"
"5. Never invent data; ask the user for clarification when information is insufficient": "5. 不要编造数据；信息不足时主动询问用户澄清"
"AI service is not registered": "AI 服务未注册"
