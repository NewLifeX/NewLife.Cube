# 设置页字段、分类与导航（中文源文经英文规范键翻译）
"Auto (follow system)": "自动（跟随系统）"
"Cancel": "取消"
"Queries {0}, executes {1}, elapsed {2:n0} ms": "查询{0}次，执行{1}次，耗时{2:n0}毫秒"
"Show run time": "显示运行时间"
"Avatar directory. Downloads remote avatars locally; defaults to the Avatars subdirectory, or Avatars next to the web root. Empty disables downloading": "头像目录。设定后下载远程头像到本地，默认Avatars子目录，web上一级Avatars。清空表示不抓取"
"Text avatar characters. Generates an SVG text avatar when no image exists; 1 to 3 characters. Uses the first N Chinese characters to keep the surname, or the initials of English words. Default 2": "文字头像字符数。头像不存在时自动生成SVG文字头像，可选1~3个字符。中文取前N字以保留姓氏，英文取各单词首字母。默认2"
"Upload directory. Defaults to Uploads": "上传目录。默认Uploads"
"Web root directory. Defaults to wwwroot": "静态资源目录。默认wwwroot"
"Resource URL. CDN base such as https://sso.newlifex.com/content/; empty uses local resources": "资源地址。指向CDN，如 https://sso.newlifex.com/content/，留空表示使用本地"
"CORS origins. Other origins allowed to access this site; * allows any origin": "跨域来源。允许其它源访问当前域，指定其它源http地址，*表示任意域"
"Iframe embedding. Empty allows the same domain only; SAMEORIGIN allows the same domain and port; ALLOWALL allows any domain": "在iframe中展示。默认为空-只允许相同域名，SAMEORIGIN-允许相同域名和端口，ALLOWALL-允许任何域名"
"Share expiration. Lifetime of share tokens in seconds, default 7200": "分享有效期。分享令牌的有效期，默认7200秒"
"Bot error code. Returns this error for crawlers, such as 404/500; 0 disables blocking": "机器人错误码。设置后拦截各种爬虫并返回相应错误，如404/500，默认0不拦截"
"Force redirect. Target scheme and host for GET requests; * is supported in the host. Commonly used to force HTTPS, such as https://*:8081": "强制跳转。指定目标schema和host，在GET访问发现不一致时强制跳转，host支持*。常用于强制跳转https，如https://*:8081"
"Security mode. 0: off; 1: observe and log only; 2: block; 3: automatic (default; observes, bans repeated attackers, and temporarily blocks broad attacks with automatic rollback)": "安全防御模式。0=关闭，1=观察模式仅记录，2=拦截模式，3=自动模式（默认；观察为主，连续攻击自动封禁，大范围攻击临时拦截并自动回落）"
"Auto-ban durations. Comma-separated seconds that increase with each trigger; empty uses 60,300,1800,7200,86400": "自动封禁时长档位。逗号分隔秒数，按触发次数递增；空值使用默认档位 60,300,1800,7200,86400"
"Trusted proxies. Forwarded headers are only trusted from these comma-separated IPs or CIDR ranges; empty keeps the legacy behavior of trusting all forwarded headers": "可信代理。来自这些代理的转发头才被信任，逗号分隔IP或CIDR网段；空值兼容旧行为信任全部转发头"
"Trusted proxy learning limit. When no trusted proxies are configured, private direct sources that send forwarded headers are learned up to this count; 0 disables learning (typically 2 for one data center, 4 for two)": "可信代理自动学习数量。可信代理未配置时，自动学习携带转发头的内网直连来源，最多学习该数量，0=不学习（单机房主备一般2，双机房一般4）"
"Learned proxies. Maintained automatically; clear it to reset the learned list": "已学习代理。由系统自动维护，清空可重置学习结果"
"Default role. Defaults to the Normal User role": "默认角色。默认普通用户"
"Allow password sign-in. Allows signing in with a username and password": "允许密码登录。允许输入用户名密码进行登录"
"Allow plain-text passwords. Default true for legacy clients; false forces Challenge-Response encrypted passwords": "允许明文密码。默认true，兼容旧版客户端；设为false后强制要求前端通过 Challenge-Response 加密密码传输"
"Allow registration. Allows registering with a username and password": "允许注册。允许输入用户名密码进行注册"
"Auto registration. Default true; after SSO sign-in an unknown local user is registered automatically. Enabled when either the global or the OAuth app setting is on": "自动注册。默认true，SSO登录后，如果本地未登录，自动注册新用户。全局设置和OAuth应用设置只要有一个启用则表示使用"
"Password complexity check. When enabled the sign-in page validates password strength; when disabled it only requires a non-empty password. Default true": "复杂密码校验。启用后登录页校验密码复杂度（按密码强度），禁用后登录页仅要求密码非空，默认true"
"Login failure limit. Bans sign-in after this many consecutive failures for the same user or IP, default 5": "登录失败次数。短时间内，相同用户或IP地址连续登录错误次数达到该值后禁止登录，默认5"
"Login ban duration. Seconds a risk-control ban lasts, default 300": "登录封禁时间。触发风控禁止登录后的禁止时间，默认300秒"
"Class C subnet ban threshold. Bans a /24 subnet such as 103.125.146.* after this many failures, default 10; 0 disables": "三段IP封禁阈值。三段IP（如103.125.146.*）连续登录失败次数达到该值后封禁该IP段，默认10，0表示不启用"
"Class B subnet ban threshold. Bans a /16 subnet such as 103.125.*.* after this many failures, default 20; 0 disables": "两段IP封禁阈值。两段IP（如103.125.*.*）连续登录失败次数达到该值后封禁该IP段，默认20，0表示不启用"
"Force bind by user name. Binds SSO users to local users with the same name without a provider prefix; intended for user centers": "强行绑定用户名。根据SSO用户名强制绑定本地同名用户，而不需要增加提供者前缀，一般用于用户中心"
"Bind by user code. Binds SSO users to local users by user code": "绑定用户代码。根据SSO用户代码强制绑定本地用户"
"Bind by mobile. Binds SSO users to local users by mobile number": "绑定用户手机。根据SSO用户手机强制绑定本地用户"
"Bind by email. Binds SSO users to local users by email": "绑定用户邮箱。根据SSO用户邮箱强制绑定本地用户"
"Bind by nickname. Binds SSO users to local users by nickname; suitable for internal SSO, not for social networks with many duplicate names": "绑定用户昵称。根据SSO用户昵称强制绑定本地用户，内部SSO可用，不建议用于社交网络，重名太多"
"Use SSO roles. Keeps SSO roles after sign-in, default true; otherwise DefaultRole is used": "使用Sso角色。SSO登录后继续使用SSO角色，默认true；否则使用DefaultRole"
"Use SSO departments. Keeps SSO departments after sign-in, default true": "使用Sso部门。SSO登录后继续使用SSO部门，默认true"
"SSO role rules. Automatically upgrades the primary role after SSO sign-in; separate rules with commas. Format: source role+department wildcard=target role, for example Guest+Route*=Route Specialist": "SSO角色规则。SSO登录后按规则自动升级用户主角色，多条规则用逗号（半角或全角）分隔。格式：原角色+部门通配符=目标角色，例如：游客+路由*=路由专员,普通用户+*车队=调度员"
"Sign out everywhere. false signs out of this site only; true (default) also signs out of the SSO server": "注销所有系统。false仅注销本系统，默认true时注销SsoServer"
"Allow multi-device sign-in. false kicks old devices on a new sign-in and revokes all tokens on sign-out; true (default) revokes only the current session": "允许多设备登录。false时同一账号新登录会踢掉旧设备，注销时吊销该账号所有令牌；true时仅吊销当前会话令牌，默认true"
"Session timeout. Session lifetime after SSO sign-in during which the cookie can sign in again; default 0s": "会话超时。单点登录后会话超时时间，该时间内可借助Cookie登录，默认0s"
"Token sliding refresh threshold. Refreshes the JWT and rewrites the cookie when its remaining lifetime falls below this many seconds; 0 disables sliding expiration": "令牌滑动刷新阈值。JWT剩余有效期低于该秒数时在TryLogin中自动刷新令牌并写入Cookie，0表示禁用滑动过期"
"User refresh period. Fetches user information once per period across SSO sign-ins, default 600 seconds": "刷新用户周期。该周期内多次SSO登录只拉取一次用户信息，默认600秒"
"JWT secret. Algorithm and key used to sign JWTs, such as HS256:ABCD1234": "JWT密钥。用于生成JWT令牌的算法和密钥，如HS256:ABCD1234"
"Token lifetime. Lifetime of the access token in seconds, default 7200": "令牌有效期。访问令牌AccessToken的有效期，默认7200秒"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default true": "在Cookie中存储令牌。读取令牌时，如果请求头没有携带令牌，则从Cookie读取，默认true"
"Validate attachment access. Requires sign-in to access attachments, default true": "验证附件访问。访问附件时，是否验证登录状态，默认true"
"Public attachment categories. Categories accessible without sign-in, comma-separated, such as markdown,avatar. Applies when ValidateAttachment is true": "公开附件分类。无需登录即可访问的附件分类，多个用逗号分隔，如 markdown,avatar。ValidateAttachment=true时生效"
"Private attachment categories. Categories only the uploader can access, comma-separated. Applies when ValidateAttachment is true": "私有附件分类。仅上传人本人可访问的附件分类，多个用逗号分隔。ValidateAttachment=true时生效"
"SSO redirect allowlist. Domains allowed to receive the JWT after sign-in, comma-separated with wildcard prefixes such as *.company.com. Empty allows the same site only; other origins are rejected and sent back to the home page": "SSO跨域重定向白名单。登录后允许携带JWT Token重定向的目标域名，逗号分隔，支持通配符前缀*.company.com。留空=仅允许同站，跨域不在白名单则拒绝并跳回首页"
"External authentication URL. When local authentication fails, credentials are verified by this endpoint; on success the local user is created or updated and signed in": "外部验证地址。配置后，本地验证失败时调用外部接口验证用户名密码，成功则自动创建/更新本地用户并登录"
"Start page. First content page opened after entering the admin console": "工作台页面。进入后台的第一个内容页"
"Theme. Content page theme, ACE/layui": "主题样式。每一个内容页，ACE/layui"
"Skin. Outer frame layout, ACE/layui": "首页皮肤。最外层框架页，ACE/layui"
"Login tip. Empty hides the tip on the sign-in page": "登录提示。留空表示不显示登录提示信息"
"Login logo. Empty uses the default logo": "登录页Logo。留空时使用默认Logo"
"Login background. Image URL; empty uses the default background": "登录页背景图。留空时使用默认背景，可填写图片URL"
"Form group layout. 3/2/1 columns on large/medium/small screens, form-group col-xs-12 col-sm-6 col-lg-4": "表单组样式。大中小屏幕分别3/2/1列，form-group col-xs-12 col-sm-6 col-lg-4"
"Bootstrap select. Nicer drop-downs with a rendering cost": "下拉选择框。使用Bootstrap，美观，但有呈现方面的性能损耗"
"Maximum drop-down items. Maximum options in a related drop-down on forms, default 50; larger lists fall back to a text box": "最大下拉个数。表单页关联下拉列表最大允许个数，默认50，超过时显示文本数字框"
"Copyright. Empty hides the copyright; variables now/runtime/framework are supported, and now accepts formats such as {now:yyyy}": "版权。留空表示不显示版权信息，支持变量now/runtime/framework，其中now支持格式化字符串如{now:yyyy}"
"Filing number. Empty hides the filing information": "备案号。留空表示不显示备案信息"
"Enable new UI": "启用新UI"
"ECharts theme. Chart theme": "ECharts主题。图表样式主题"
"Title suffix. Appends the system name to page titles, default true": "标题后缀。在页面标题后面加上系统名称，默认true"
"Table double-click. Enables row double-click on list pages, default true": "表格双击事件。列表页表格行双击事件禁用，默认true(启用)"
"Table style. Light: minimal thin lines; Standard: clear row lines (default); Grid: full cell borders": "表格分隔样式。Light-轻量（极简浅线）、Standard-标准（清晰行线，默认）、Grid-网格（完整单元格边框）"
"Table density. Compact: dense and information-rich (default); Normal: relaxed": "表格行高密度。Compact-紧凑（默认，信息量大）、Normal-适中（呼吸感强）"
"Stardust web. Stardust console URL; supports direct links to /trace?id={traceId} or /graph?id={traceId}": "星尘Web。星尘控制台地址，支持直达调用链 /trace?id={traceId} 或 /graph?id={traceId}"
"AI master switch. Enables AI features such as log analysis and notification polishing, default false": "AI 总开关。启用后可使用日志分析、通知润色等 AI 辅助功能，默认false"
"AI provider. Supports NewLife, Ollama, DeepSeek, DashScope, OpenAI and others; default NewLife": "AI 服务商。支持 NewLife / Ollama / DeepSeek / DashScope / OpenAI 等，默认NewLife"
"AI endpoint. Defaults to https://ai.newlifex.com for NewLife": "AI 服务地址。NewLife 默认 https://ai.newlifex.com"
"AI ApiKey. Defaults to sk-CubeAI2026 for NewLife": "AI ApiKey。NewLife 默认 sk-CubeAI2026"
"AI default model. Defaults to newlife-flash for NewLife": "AI 默认模型。NewLife 默认 newlife-flash"
"AI default deep reasoning. Enables think mode for analysis and chat by default; false means fast responses": "AI 默认深度推理。AI 分析与对话默认是否启用深度推理（think），默认false即快速"
"AI color scheme. Fills the primary and secondary colors from a preset": "AI 助手主题色方案。预设方案联动填充主色/辅色，可再手动微调，默认新生命绿"
"AI primary color. Main color of the launcher, panel header and user bubbles; default NewLife green #2ecc71": "AI 助手主色。悬浮球、面板头、用户气泡等主色调，默认新生命绿#2ecc71"
"AI secondary color. Gradient end color, default dark green #1e8e3e": "AI 助手辅色。主色渐变终点色，默认深绿#1e8e3e"
"OAuth server. Enables the OAuth 2.0 server that provides SSO for other applications": "OAuth服务。是否启用OAuth2.0服务，为其它应用提供单点登录服务"
"File manager. Enables backend file management (browse, upload, download, delete); this carries security risks": "文件管理。是否启用后台文件管理，可浏览/上传/下载/删除站点内文件，存在安全风险"
"Multi-tenancy. Enables tenants; tenant mode cannot access system administration and platform mode cannot access tenant pages": "多租户。是否支持多租户，租户模式禁止访问系统管理，平台管理模式禁止访问租户页面"
"Tenant query policy. DenyWithEmpty: return an empty set without tenant context; ThrowOnMissingTenant: throw an explicit error": "多租户查询策略。DenyWithEmpty=无租户上下文返回空集，ThrowOnMissingTenant=显式抛错"
"User online. 0: do not record; 1: signed-in users only; 2: all visitors (default)": "用户在线。是否记录用户在线信息，0表示不记录，1表示仅记录已登录用户，2表示记录所有访客。默认2"
"User statistics. Records user visits, default true": "用户统计。是否统计用户访问，默认true"
"Enable SMS. SMS verification codes and system notifications, default false": "启用短信。包括短信验证码和系统通知，默认false"
"Enable email. Email verification codes and system notifications, default false": "启用邮件。包括邮件验证码和系统通知，默认false"
"Require email verification. Users must activate their email before signing in and must provide one when registering, default false": "需要邮箱验证。注册后必须激活邮箱才能登录，注册时必须提供邮箱，默认false"
"Require mobile verification. Users must activate their mobile before signing in and must provide one when registering, default false": "需要手机验证。注册后必须激活手机才能登录，注册时必须提供手机，默认false"
"Captcha scenarios. Bit mask: 0: off; 1: sign-in; 2: registration; 4: verification code requests (anti-SMS-bombing); combine with 3 for sign-in and registration. Mandatory scenarios are never exempted, default 0": "验证码场景。位掩码强制：0=不启用，1=登录，2=注册，4=发验证码（防短信轰炸），可组合，如3=登录+注册均需验证码。强制要求不受自适应豁免，默认0"
"Risk-adaptive captcha. Disabled when CaptchaScene is 0; when enabled it detects unsafe environments and requires a captcha, default true": "风险自适应验证码。验证码场景全关（CaptchaScene=0）时整体不启用；启用后自动感知当前机器是否安全，不安全环境要求图片验证码，默认true"
"Captcha risk threshold. Requires a captcha when the risk score reaches this value: 0: intranet; 1: internet; 2: internet with recent failures; 3: banned. Default 2": "验证码风险阈值。风险评分达到该值要求验证码：0=内网，1=公网，2=公网+近期登录失败，3=封禁中。默认2"
"Trusted device lifetime. Days during which previously successful devices skip adaptive captchas, default 30": "可信设备有效期。曾成功登录的设备在有效期内免自适应验证码（天），默认30"
"Enable MFA. Allows users to enable TOTP multi-factor authentication; an enhanced feature, default false": "启用MFA。是否允许用户开启多因素认证（TOTP），增强版功能，默认false"
"File storage serving. Responds to file download requests from other nodes, default true": "文件存储提供服务。是否响应其他节点的文件下载请求，默认true"
"File storage fetch. Pulls new files published by other nodes, default true": "文件存储拉取文件。是否主动拉取其他节点发布的新文件，默认true"
"File fetch timeout. Maximum milliseconds to wait for other nodes when a file is missing locally, default 5000": "文件存储拉取超时。下载本地缺失文件时等待其他节点同步的最大时间（毫秒），默认5000"
"Attachment storage. Local disk, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu or EasyIO; default Local": "附件存储类型。Local本地磁盘，Oss阿里云，Cos腾讯云，Qiniu七牛，EasyIO易对象，默认Local"
"Object storage server. S3-compatible endpoint for OSS/COS/Qiniu, such as oss-cn-beijing.aliyuncs.com": "对象存储服务器。OSS/COS/七牛S3兼容端点，如 oss-cn-beijing.aliyuncs.com"
"Object storage bucket. Bucket name for OSS/COS/Qiniu": "对象存储桶。OSS/COS/七牛存储桶名称"
"Object storage region. S3 signing scope, such as cn-beijing / ap-beijing / cn-east-1": "对象存储区域。用于S3签名作用域，如 cn-beijing / ap-beijing / cn-east-1"
"Object storage app ID. AccessKeyId": "对象存储应用标识。AccessKeyId"
"Object storage app secret. AccessKeySecret": "对象存储应用密钥。AccessKeySecret"
"Data retention. Days to keep audit and OAuth logs, default 30": "数据保留时间。审计日志与OAuth日志，默认30天"
"File retention. Days to keep backup files, default 15": "文件保留时间。备份文件保留时间，默认15天"
"Retention size floor. Files smaller than this (KB) are never deleted even after the retention period, default 1024K": "保留文件大小。小于该大小的文件将不会被删除，即使超过保留时间，单位K字节，默认1024K"
"Maximum export rows. Maximum rows a page may export, default 10_000_000": "最大导出行数。页面允许导出的最大行数，默认10_000_000"
"Maximum backup rows. Maximum rows a page may back up, default 10_000_000": "最大备份行数。页面允许备份的最大行数，默认10_000_000"
"API prefixes. Comma- or semicolon-separated prefixes such as /api,/api/v1; matching requests are forwarded to the real route without the prefix": "API前缀。多个前缀用逗号或分号分隔，如 /api,/api/v1。请求路径命中前缀时自动去掉前缀并转发到真实路由"
"Password strength. * means unrestricted; by default at least 8 characters with digits, upper/lower case letters and symbols. Simple form: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$": "密码强度。*表示无限制，默认8位起，数字大小写字母和符号。简易版^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$"
"Cookie mode. Default SameSite mode for token cookies (-1 Unspecified, 0 None, 1 Lax, 2 Strict)": "Cookie模式。token的cookies默认模式（ -1 Unspecified，0 None，1 Lax，2 Strict）"
"Cookie domain. Writes cookies to a parent domain; empty uses the current domain. A top-level domain requires HTTPS and prevents plain HTTP from writing same-name keys on the local domain": "Cookie域名。可用于把Cookie写到顶级域名，默认为空写当前域。写顶级域要求https，同时会导致普通http无法在本地域写同名键值"
"Activation URL. Front-end activation page URL used in email activation links, such as https://xxx/activate; empty builds /activate from the request host": "激活页地址。前端激活页URL，用于拼邮箱激活链接，如 https://xxx/activate；为空时按请求Host拼接/activate"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default false": "在Cookie中存储令牌。读取令牌时，如果请求头没有携带令牌，则从Cookie读取，默认false"
"Password strength. * means unrestricted; the simple form defaults to 5 to 32 characters of any type. The full form requires at least 8 characters with digits, upper/lower case letters and symbols: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$": "密码强度。*表示无限制，简易版默认5~32位，不限制字符类型。完整版默认8位起，数字大小写字母和符号。完整版^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$"
