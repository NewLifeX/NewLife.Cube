"Available tools: get_data_context / get_form_schema / fill_form / get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "Ferramentas disponíveis: get_data_context / get_form_schema / fill_form / get_page_context / get_system_info / run_js (consulte as definições das funções; chame-as quando necessário)"
"2. When the user asks to analyze or gain insight into the current data or a single record, call get_data_context first, then give conclusions and suggestions": "2. Quando o usuário pedir para analisar ou obter insights sobre os dados atuais ou um único registro, chame get_data_context primeiro e depois apresente conclusões e sugestões"
"3. When the user asks to create, fill in or complete a form, call get_form_schema first to inspect the fields, then call fill_form to generate values (invent a reasonable unique value for empty writable fields such as codes when appropriate, keep existing values, and never fabricate real personal data such as emails, mobile numbers or birthdays); finally ask the user to review before submitting": "3. Quando o usuário pedir para criar, preencher ou completar um formulário, chame get_form_schema primeiro para inspecionar os campos e depois chame fill_form para gerar valores (invente um valor exclusivo razoável para campos graváveis vazios, como códigos, quando apropriado, mantenha os valores existentes e nunca fabrique dados pessoais reais como e-mails, números de celular ou datas de nascimento); por fim, peça ao usuário para revisar antes de enviar"
"4. When the user asks about page structure or elements (table columns, paging, visible rows and other DOM details), call get_page_context to collect the current page content from the browser": "4. Quando o usuário perguntar sobre a estrutura ou os elementos da página (colunas da tabela, paginação, linhas visíveis e outros detalhes do DOM), chame get_page_context para coletar o conteúdo atual da página no navegador"
"5. When the user asks about system status or diagnostics, call get_system_info": "5. Quando o usuário perguntar sobre o status ou o diagnóstico do sistema, chame get_system_info"
"6. When the user asks to read or operate elements of the current page (fill inputs, click buttons, read titles and so on), you may call run_js; the script runs in the user's current page and may use document.querySelector to locate elements; explain any write operation (changing page content, submitting forms) to the user before running it": "6. Quando o usuário pedir para ler ou operar elementos da página atual (preencher campos, clicar em botões, ler títulos etc.), você pode chamar run_js; o script é executado na página atual do usuário e pode usar document.querySelector para localizar elementos; explique qualquer operação de escrita (alterar o conteúdo da página, enviar formulários) ao usuário antes de executá-la"
"7. Never invent data; ask the user for clarification when information is insufficient": "7. Nunca invente dados; peça esclarecimentos ao usuário quando as informações forem insuficientes"
