# 设置页字段、分类与导航（中文源文经英文规范键翻译）
"Auto (follow system)": "Automático (seguir o sistema)"
"Cancel": "Cancelar"
"Queries {0}, executes {1}, elapsed {2:n0} ms": "Consultas {0}, execuções {1}, tempo decorrido {2:n0} ms"
"Show run time": "Mostrar tempo de execução"
"Avatar directory. Downloads remote avatars locally; defaults to the Avatars subdirectory, or Avatars next to the web root. Empty disables downloading": "Diretório de avatares. Baixa avatares remotos localmente; o padrão é o subdiretório Avatars, ou Avatars ao lado da raiz da web. Vazio desativa o download"
"Text avatar characters. Generates an SVG text avatar when no image exists; 1 to 3 characters. Uses the first N Chinese characters to keep the surname, or the initials of English words. Default 2": "Caracteres do avatar de texto. Gera um avatar de texto SVG quando não existe imagem; de 1 a 3 caracteres. Usa os primeiros N caracteres chineses para preservar o sobrenome, ou as iniciais das palavras em inglês. Padrão 2"
"Upload directory. Defaults to Uploads": "Diretório de upload. O padrão é Uploads"
"Web root directory. Defaults to wwwroot": "Diretório raiz da web. O padrão é wwwroot"
"Resource URL. CDN base such as https://sso.newlifex.com/content/; empty uses local resources": "URL de recursos. Base da CDN, como https://sso.newlifex.com/content/; vazio usa os recursos locais"
"CORS origins. Other origins allowed to access this site; * allows any origin": "Origens CORS. Outras origens com permissão para acessar este site; * permite qualquer origem"
"Iframe embedding. Empty allows the same domain only; SAMEORIGIN allows the same domain and port; ALLOWALL allows any domain": "Inserção em iframe. Vazio permite apenas o mesmo domínio; SAMEORIGIN permite o mesmo domínio e porta; ALLOWALL permite qualquer domínio"
"Share expiration. Lifetime of share tokens in seconds, default 7200": "Expiração do compartilhamento. Tempo de vida dos tokens de compartilhamento em segundos, padrão 7200"
"Bot error code. Returns this error for crawlers, such as 404/500; 0 disables blocking": "Código de erro para bots. Retorna este erro para rastreadores, como 404/500; 0 desativa o bloqueio"
"Force redirect. Target scheme and host for GET requests; * is supported in the host. Commonly used to force HTTPS, such as https://*:8081": "Redirecionamento forçado. Esquema e host de destino para solicitações GET; * é suportado no host. Usado comumente para forçar HTTPS, como https://*:8081"
"Security mode. 0: off; 1: observe and log only; 2: block; 3: automatic (default; observes, bans repeated attackers, and temporarily blocks broad attacks with automatic rollback)": "Modo de segurança. 0: desligado; 1: apenas observar e registrar; 2: bloquear; 3: automático (padrão; observa, bane atacantes reincidentes e bloqueia temporariamente ataques amplos com reversão automática)"
"Auto-ban durations. Comma-separated seconds that increase with each trigger; empty uses 60,300,1800,7200,86400": "Durações de banimento automático. Segundos separados por vírgula que aumentam a cada acionamento; vazio usa 60,300,1800,7200,86400"
"Trusted proxies. Forwarded headers are only trusted from these comma-separated IPs or CIDR ranges; empty keeps the legacy behavior of trusting all forwarded headers": "Proxies confiáveis. Os cabeçalhos encaminhados só são confiáveis quando vêm destes IPs ou intervalos CIDR separados por vírgula; vazio mantém o comportamento legado de confiar em todos os cabeçalhos encaminhados"
"Trusted proxy learning limit. When no trusted proxies are configured, private direct sources that send forwarded headers are learned up to this count; 0 disables learning (typically 2 for one data center, 4 for two)": "Limite de aprendizado de proxies confiáveis. Quando nenhum proxy confiável está configurado, as origens privadas diretas que enviam cabeçalhos encaminhados são aprendidas até esta quantidade; 0 desativa o aprendizado (normalmente 2 para um data center, 4 para dois)"
"Learned proxies. Maintained automatically; clear it to reset the learned list": "Proxies aprendidos. Mantidos automaticamente; limpe para redefinir a lista aprendida"
"Default role. Defaults to the Normal User role": "Perfil padrão. O padrão é o perfil Usuário normal"
"Allow password sign-in. Allows signing in with a username and password": "Permitir login por senha. Permite entrar com nome de usuário e senha"
"Allow plain-text passwords. Default true for legacy clients; false forces Challenge-Response encrypted passwords": "Permitir senhas em texto simples. Padrão true para clientes legados; false força senhas criptografadas por Challenge-Response"
"Allow registration. Allows registering with a username and password": "Permitir registro. Permite registrar-se com nome de usuário e senha"
"Auto registration. Default true; after SSO sign-in an unknown local user is registered automatically. Enabled when either the global or the OAuth app setting is on": "Registro automático. Padrão true; após o login via SSO, um usuário local desconhecido é registrado automaticamente. Ativado quando a configuração global ou a do aplicativo OAuth estiver ligada"
"Password complexity check. When enabled the sign-in page validates password strength; when disabled it only requires a non-empty password. Default true": "Verificação de complexidade de senha. Quando ativada, a página de login valida a força da senha; quando desativada, exige apenas uma senha não vazia. Padrão true"
"Login failure limit. Bans sign-in after this many consecutive failures for the same user or IP, default 5": "Limite de falhas de login. Bane o login após este número de falhas consecutivas do mesmo usuário ou IP, padrão 5"
"Login ban duration. Seconds a risk-control ban lasts, default 300": "Duração do banimento de login. Segundos que um banimento de controle de risco dura, padrão 300"
"Class C subnet ban threshold. Bans a /24 subnet such as 103.125.146.* after this many failures, default 10; 0 disables": "Limite de banimento de sub-rede classe C. Bane uma sub-rede /24 como 103.125.146.* após este número de falhas, padrão 10; 0 desativa"
"Class B subnet ban threshold. Bans a /16 subnet such as 103.125.*.* after this many failures, default 20; 0 disables": "Limite de banimento de sub-rede classe B. Bane uma sub-rede /16 como 103.125.*.* após este número de falhas, padrão 20; 0 desativa"
"Force bind by user name. Binds SSO users to local users with the same name without a provider prefix; intended for user centers": "Forçar vinculação por nome de usuário. Vincula usuários SSO a usuários locais com o mesmo nome sem prefixo do provedor; destinado a centrais de usuários"
"Bind by user code. Binds SSO users to local users by user code": "Vinculação por código de usuário. Vincula usuários SSO a usuários locais pelo código do usuário"
"Bind by mobile. Binds SSO users to local users by mobile number": "Vinculação por celular. Vincula usuários SSO a usuários locais pelo número de celular"
"Bind by email. Binds SSO users to local users by email": "Vinculação por e-mail. Vincula usuários SSO a usuários locais pelo e-mail"
"Bind by nickname. Binds SSO users to local users by nickname; suitable for internal SSO, not for social networks with many duplicate names": "Vinculação por apelido. Vincula usuários SSO a usuários locais pelo apelido; adequado para SSO interno, não para redes sociais com muitos nomes duplicados"
"Use SSO roles. Keeps SSO roles after sign-in, default true; otherwise DefaultRole is used": "Usar perfis do SSO. Mantém os perfis do SSO após o login, padrão true; caso contrário, DefaultRole é usado"
"Use SSO departments. Keeps SSO departments after sign-in, default true": "Usar departamentos do SSO. Mantém os departamentos do SSO após o login, padrão true"
"SSO role rules. Automatically upgrades the primary role after SSO sign-in; separate rules with commas. Format: source role+department wildcard=target role, for example Guest+Route*=Route Specialist": "Regras de perfil do SSO. Atualiza automaticamente o perfil principal após o login via SSO; separe as regras por vírgulas. Formato: perfil de origem+curinga do departamento=perfil de destino, por exemplo Convidado+Route*=Especialista em rotas"
"Sign out everywhere. false signs out of this site only; true (default) also signs out of the SSO server": "Sair de todos os lugares. false encerra a sessão apenas neste site; true (padrão) também a encerra no servidor SSO"
"Allow multi-device sign-in. false kicks old devices on a new sign-in and revokes all tokens on sign-out; true (default) revokes only the current session": "Permitir login em vários dispositivos. false desconecta os dispositivos antigos em um novo login e revoga todos os tokens ao sair; true (padrão) revoga apenas a sessão atual"
"Session timeout. Session lifetime after SSO sign-in during which the cookie can sign in again; default 0s": "Tempo limite de sessão. Tempo de vida da sessão após o login via SSO durante o qual o cookie pode entrar novamente; padrão 0s"
"Token sliding refresh threshold. Refreshes the JWT and rewrites the cookie when its remaining lifetime falls below this many seconds; 0 disables sliding expiration": "Limite de renovação deslizante do token. Renova o JWT e regrava o cookie quando o tempo de vida restante fica abaixo deste número de segundos; 0 desativa a expiração deslizante"
"User refresh period. Fetches user information once per period across SSO sign-ins, default 600 seconds": "Período de atualização do usuário. Obtém as informações do usuário uma vez por período entre logins SSO, padrão 600 segundos"
"JWT secret. Algorithm and key used to sign JWTs, such as HS256:ABCD1234": "Segredo JWT. Algoritmo e chave usados para assinar JWTs, como HS256:ABCD1234"
"Token lifetime. Lifetime of the access token in seconds, default 7200": "Tempo de vida do token. Tempo de vida do token de acesso em segundos, padrão 7200"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default true": "Armazenar token no cookie. Lê o token do cookie quando o cabeçalho da solicitação não o contém, padrão true"
"Validate attachment access. Requires sign-in to access attachments, default true": "Validar acesso a anexos. Exige login para acessar os anexos, padrão true"
"Public attachment categories. Categories accessible without sign-in, comma-separated, such as markdown,avatar. Applies when ValidateAttachment is true": "Categorias de anexos públicos. Categorias acessíveis sem login, separadas por vírgulas, como markdown,avatar. Aplica-se quando ValidateAttachment é true"
"Private attachment categories. Categories only the uploader can access, comma-separated. Applies when ValidateAttachment is true": "Categorias de anexos privados. Categorias que só o remetente pode acessar, separadas por vírgulas. Aplica-se quando ValidateAttachment é true"
"SSO redirect allowlist. Domains allowed to receive the JWT after sign-in, comma-separated with wildcard prefixes such as *.company.com. Empty allows the same site only; other origins are rejected and sent back to the home page": "Lista de permissões de redirecionamento SSO. Domínios que podem receber o JWT após o login, separados por vírgulas e com prefixos curinga como *.company.com. Vazio permite apenas o mesmo site; outras origens são rejeitadas e enviadas de volta à página inicial"
"External authentication URL. When local authentication fails, credentials are verified by this endpoint; on success the local user is created or updated and signed in": "URL de autenticação externa. Quando a autenticação local falha, as credenciais são verificadas por este endpoint; em caso de sucesso, o usuário local é criado ou atualizado e conectado"
"Start page. First content page opened after entering the admin console": "Página inicial. Primeira página de conteúdo aberta após entrar no console de administração"
"Theme. Content page theme, ACE/layui": "Tema. Tema da página de conteúdo, ACE/layui"
"Skin. Outer frame layout, ACE/layui": "Pele. Layout do quadro externo, ACE/layui"
"Login tip. Empty hides the tip on the sign-in page": "Dica de login. Vazio oculta a dica na página de login"
"Login logo. Empty uses the default logo": "Logotipo do login. Vazio usa o logotipo padrão"
"Login background. Image URL; empty uses the default background": "Plano de fundo do login. URL da imagem; vazio usa o plano de fundo padrão"
"Form group layout. 3/2/1 columns on large/medium/small screens, form-group col-xs-12 col-sm-6 col-lg-4": "Layout do grupo de formulário. 3/2/1 colunas em telas grandes/médias/pequenas, form-group col-xs-12 col-sm-6 col-lg-4"
"Bootstrap select. Nicer drop-downs with a rendering cost": "Bootstrap select. Listas suspensas mais bonitas com custo de renderização"
"Maximum drop-down items. Maximum options in a related drop-down on forms, default 50; larger lists fall back to a text box": "Máximo de itens na lista suspensa. Número máximo de opções em uma lista suspensa relacionada nos formulários, padrão 50; listas maiores usam uma caixa de texto"
"Copyright. Empty hides the copyright; variables now/runtime/framework are supported, and now accepts formats such as {now:yyyy}": "Direitos autorais. Vazio oculta os direitos autorais; as variáveis now/runtime/framework são suportadas, e now aceita formatos como {now:yyyy}"
"Filing number. Empty hides the filing information": "Número de registro. Vazio oculta as informações de registro"
"Enable new UI": "Ativar a nova interface"
"ECharts theme. Chart theme": "Tema do ECharts. Tema dos gráficos"
"Title suffix. Appends the system name to page titles, default true": "Sufixo do título. Acrescenta o nome do sistema aos títulos das páginas, padrão true"
"Table double-click. Enables row double-click on list pages, default true": "Duplo clique na tabela. Ativa o duplo clique nas linhas das páginas de listagem, padrão true"
"Table style. Light: minimal thin lines; Standard: clear row lines (default); Grid: full cell borders": "Estilo da tabela. Leve: linhas finas e mínimas; Padrão: linhas de registro nítidas (padrão); Grade: bordas completas das células"
"Table density. Compact: dense and information-rich (default); Normal: relaxed": "Densidade da tabela. Compacta: densa e rica em informações (padrão); Normal: espaçada"
"Stardust web. Stardust console URL; supports direct links to /trace?id={traceId} or /graph?id={traceId}": "Stardust web. URL do console do Stardust; aceita links diretos para /trace?id={traceId} ou /graph?id={traceId}"
"AI master switch. Enables AI features such as log analysis and notification polishing, default false": "Interruptor geral da IA. Ativa recursos de IA, como análise de logs e refinamento de notificações, padrão false"
"AI provider. Supports NewLife, Ollama, DeepSeek, DashScope, OpenAI and others; default NewLife": "Provedor de IA. Suporta NewLife, Ollama, DeepSeek, DashScope, OpenAI e outros; padrão NewLife"
"AI endpoint. Defaults to https://ai.newlifex.com for NewLife": "Endpoint de IA. O padrão é https://ai.newlifex.com para o NewLife"
"AI ApiKey. Defaults to sk-CubeAI2026 for NewLife": "ApiKey de IA. O padrão é sk-CubeAI2026 para o NewLife"
"AI default model. Defaults to newlife-flash for NewLife": "Modelo padrão de IA. O padrão é newlife-flash para o NewLife"
"AI default deep reasoning. Enables think mode for analysis and chat by default; false means fast responses": "Raciocínio profundo padrão da IA. Ativa o modo de raciocínio para análise e chat por padrão; false significa respostas rápidas"
"AI color scheme. Fills the primary and secondary colors from a preset": "Esquema de cores da IA. Preenche as cores primária e secundária a partir de uma predefinição"
"AI primary color. Main color of the launcher, panel header and user bubbles; default NewLife green #2ecc71": "Cor primária da IA. Cor principal do iniciador, do cabeçalho do painel e das bolhas do usuário; padrão verde NewLife #2ecc71"
"AI secondary color. Gradient end color, default dark green #1e8e3e": "Cor secundária da IA. Cor final do gradiente, padrão verde-escuro #1e8e3e"
"OAuth server. Enables the OAuth 2.0 server that provides SSO for other applications": "Servidor OAuth. Ativa o servidor OAuth 2.0 que fornece SSO para outros aplicativos"
"File manager. Enables backend file management (browse, upload, download, delete); this carries security risks": "Gerenciador de arquivos. Ativa o gerenciamento de arquivos no back-end (navegar, enviar, baixar, excluir); isso traz riscos de segurança"
"Multi-tenancy. Enables tenants; tenant mode cannot access system administration and platform mode cannot access tenant pages": "Multilocação. Ativa os locatários; o modo locatário não pode acessar a administração do sistema e o modo plataforma não pode acessar as páginas de locatário"
"Tenant query policy. DenyWithEmpty: return an empty set without tenant context; ThrowOnMissingTenant: throw an explicit error": "Política de consulta de locatário. DenyWithEmpty: retorna um conjunto vazio sem contexto de locatário; ThrowOnMissingTenant: lança um erro explícito"
"User online. 0: do not record; 1: signed-in users only; 2: all visitors (default)": "Usuários online. 0: não registrar; 1: apenas usuários conectados; 2: todos os visitantes (padrão)"
"User statistics. Records user visits, default true": "Estatísticas de usuários. Registra as visitas dos usuários, padrão true"
"Enable SMS. SMS verification codes and system notifications, default false": "Ativar SMS. Códigos de verificação e notificações do sistema por SMS, padrão false"
"Enable email. Email verification codes and system notifications, default false": "Ativar e-mail. Códigos de verificação e notificações do sistema por e-mail, padrão false"
"Require email verification. Users must activate their email before signing in and must provide one when registering, default false": "Exigir verificação de e-mail. Os usuários devem ativar o e-mail antes de entrar e informá-lo no registro, padrão false"
"Require mobile verification. Users must activate their mobile before signing in and must provide one when registering, default false": "Exigir verificação de celular. Os usuários devem ativar o celular antes de entrar e informá-lo no registro, padrão false"
"Captcha scenarios. Bit mask: 0: off; 1: sign-in; 2: registration; 4: verification code requests (anti-SMS-bombing); combine with 3 for sign-in and registration. Mandatory scenarios are never exempted, default 0": "Cenários de captcha. Máscara de bits: 0: desligado; 1: login; 2: registro; 4: solicitações de código de verificação (anti-bombardeio de SMS); combine com 3 para login e registro. Cenários obrigatórios nunca são isentos, padrão 0"
"Risk-adaptive captcha. Disabled when CaptchaScene is 0; when enabled it detects unsafe environments and requires a captcha, default true": "Captcha adaptativo ao risco. Desativado quando CaptchaScene é 0; quando ativado, detecta ambientes inseguros e exige um captcha, padrão true"
"Captcha risk threshold. Requires a captcha when the risk score reaches this value: 0: intranet; 1: internet; 2: internet with recent failures; 3: banned. Default 2": "Limite de risco do captcha. Exige um captcha quando a pontuação de risco atinge este valor: 0: intranet; 1: internet; 2: internet com falhas recentes; 3: banido. Padrão 2"
"Trusted device lifetime. Days during which previously successful devices skip adaptive captchas, default 30": "Tempo de vida de dispositivos confiáveis. Dias durante os quais dispositivos que já tiveram sucesso dispensam o captcha adaptativo, padrão 30"
"Enable MFA. Allows users to enable TOTP multi-factor authentication; an enhanced feature, default false": "Ativar MFA. Permite que os usuários ativem a autenticação multifator TOTP; um recurso avançado, padrão false"
"File storage serving. Responds to file download requests from other nodes, default true": "Serviço de armazenamento de arquivos. Responde às solicitações de download de arquivos de outros nós, padrão true"
"File storage fetch. Pulls new files published by other nodes, default true": "Busca no armazenamento de arquivos. Obtém novos arquivos publicados por outros nós, padrão true"
"File fetch timeout. Maximum milliseconds to wait for other nodes when a file is missing locally, default 5000": "Tempo limite de busca de arquivos. Máximo de milissegundos para aguardar outros nós quando um arquivo está ausente localmente, padrão 5000"
"Attachment storage. Local disk, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu or EasyIO; default Local": "Armazenamento de anexos. Disco local, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu ou EasyIO; padrão Local"
"Object storage server. S3-compatible endpoint for OSS/COS/Qiniu, such as oss-cn-beijing.aliyuncs.com": "Servidor de armazenamento de objetos. Endpoint compatível com S3 para OSS/COS/Qiniu, como oss-cn-beijing.aliyuncs.com"
"Object storage bucket. Bucket name for OSS/COS/Qiniu": "Bucket do armazenamento de objetos. Nome do bucket para OSS/COS/Qiniu"
"Object storage region. S3 signing scope, such as cn-beijing / ap-beijing / cn-east-1": "Região do armazenamento de objetos. Escopo de assinatura S3, como cn-beijing / ap-beijing / cn-east-1"
"Object storage app ID. AccessKeyId": "ID do aplicativo de armazenamento de objetos. AccessKeyId"
"Object storage app secret. AccessKeySecret": "Segredo do aplicativo de armazenamento de objetos. AccessKeySecret"
"Data retention. Days to keep audit and OAuth logs, default 30": "Retenção de dados. Dias para manter os logs de auditoria e do OAuth, padrão 30"
"File retention. Days to keep backup files, default 15": "Retenção de arquivos. Dias para manter os arquivos de cópia de segurança, padrão 15"
"Retention size floor. Files smaller than this (KB) are never deleted even after the retention period, default 1024K": "Piso de tamanho para retenção. Arquivos menores que este valor (KB) nunca são excluídos, mesmo após o período de retenção, padrão 1024K"
"Maximum export rows. Maximum rows a page may export, default 10_000_000": "Máximo de linhas para exportação. Máximo de linhas que uma página pode exportar, padrão 10_000_000"
"Maximum backup rows. Maximum rows a page may back up, default 10_000_000": "Máximo de linhas para cópia de segurança. Máximo de linhas que uma página pode copiar, padrão 10_000_000"
"API prefixes. Comma- or semicolon-separated prefixes such as /api,/api/v1; matching requests are forwarded to the real route without the prefix": "Prefixos de API. Prefixos separados por vírgula ou ponto e vírgula, como /api,/api/v1; as solicitações correspondentes são encaminhadas para a rota real sem o prefixo"
"Password strength. * means unrestricted; by default at least 8 characters with digits, upper/lower case letters and symbols. Simple form: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$": "Força da senha. * significa sem restrições; por padrão, pelo menos 8 caracteres com dígitos, letras maiúsculas/minúsculas e símbolos. Forma simples: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$"
"Cookie mode. Default SameSite mode for token cookies (-1 Unspecified, 0 None, 1 Lax, 2 Strict)": "Modo de cookie. Modo SameSite padrão para cookies de token (-1 Unspecified, 0 None, 1 Lax, 2 Strict)"
"Cookie domain. Writes cookies to a parent domain; empty uses the current domain. A top-level domain requires HTTPS and prevents plain HTTP from writing same-name keys on the local domain": "Domínio do cookie. Grava cookies em um domínio pai; vazio usa o domínio atual. Um domínio de nível superior exige HTTPS e impede que HTTP simples grave chaves de mesmo nome no domínio local"
"Activation URL. Front-end activation page URL used in email activation links, such as https://xxx/activate; empty builds /activate from the request host": "URL de ativação. URL da página de ativação de front-end usada nos links de ativação por e-mail, como https://xxx/activate; vazio monta /activate a partir do host da solicitação"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default false": "Armazenar token no cookie. Lê o token do cookie quando o cabeçalho da solicitação não o contém, padrão false"
"Password strength. * means unrestricted; the simple form defaults to 5 to 32 characters of any type. The full form requires at least 8 characters with digits, upper/lower case letters and symbols: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$": "Força da senha. * significa sem restrições; a forma simples usa 5 a 32 caracteres de qualquer tipo por padrão. A forma completa exige pelo menos 8 caracteres com dígitos, letras maiúsculas/minúsculas e símbolos: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$"
