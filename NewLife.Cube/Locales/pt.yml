"Generated {0} configuration field values (skipped {1}, failed {2}) and filled them into the form. Ask the user to review before submitting.": "Gerados {0} valores de campos de configuração ({1} ignorados, {2} com falha) e preenchidos no formulário. Peça ao usuário para revisar antes de enviar."
"The current page is a system configuration form (such as Cube settings); you can help review and fill in configuration items.": "A página atual é um formulário de configuração do sistema (como as configurações do Cube); você pode ajudar a revisar e preencher os itens de configuração."
"Available tools: get_form_schema / fill_form / get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "Ferramentas disponíveis: get_form_schema / fill_form / get_page_context / get_system_info / run_js (consulte as definições das funções; chame-as quando necessário)"
"2. When the user asks to create, fill in or complete configuration, call get_form_schema first to inspect the items, then call fill_form to generate values (invent reasonable values for empty writable fields, keep existing values unless the user asks otherwise, and never fabricate or modify sensitive settings such as ApiKey/Secret/Token); finally ask the user to review before submitting": "2. Quando o usuário pedir para criar, preencher ou completar configurações, chame get_form_schema primeiro para inspecionar os itens e depois chame fill_form para gerar valores (invente valores razoáveis para campos graváveis vazios, mantenha os valores existentes, a menos que o usuário peça o contrário, e nunca fabrique ou modifique configurações sensíveis como ApiKey/Secret/Token); por fim, peça ao usuário para revisar antes de enviar"
"3. When the user asks about the content or current state of the page, call get_page_context, then give your analysis and conclusion": "3. Quando o usuário perguntar sobre o conteúdo ou o estado atual da página, chame get_page_context"
"4. When the user asks about system status or diagnostics, call get_system_info": "4. Quando o usuário perguntar sobre o status ou o diagnóstico do sistema, chame get_system_info"
"5. When the user asks to read or operate page elements, you may call run_js; explain any write operation (changing page content, submitting forms) to the user before running it": "5. Quando o usuário pedir para ler ou operar elementos da página, você pode chamar run_js; explique qualquer operação de escrita (alterar o conteúdo da página, enviar formulários) ao usuário antes de executá-la"
"6. Never invent data; ask the user for clarification when information is insufficient": "6. Nunca invente dados; peça esclarecimentos ao usuário quando as informações forem insuficientes"
"The tenant identifier carried by user [{0}] is invalid or unavailable. Check the tenant settings and try again.": "O identificador de locatário do usuário [{0}] é inválido ou indisponível. Verifique as configurações do locatário e tente novamente."
"User [{0}] did not carry a tenant identifier, so the tenant cannot be determined. Include the tenant information and try again.": "O usuário [{0}] não trouxe um identificador de locatário, portanto o locatário não pode ser determinado. Inclua as informações do locatário e tente novamente."
"User [{0}] is not allowed to access the data of the current tenant. Switch tenant and try again.": "O usuário [{0}] não tem permissão para acessar os dados do locatário atual. Troque de locatário e tente novamente."
