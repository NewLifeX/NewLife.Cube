"Online peak warning {0}": "Alerta de pico online {0}"
"There are {0} users online, exceeding the {1}-day record of {2} (threshold {3:0}). This may be a campaign, a crawler scan or abnormal traffic; check the online list and sign-in log.": "Há {0} usuários online, superando o recorde de {1} dias de {2} (limite {3:0}). Pode ser uma campanha, uma varredura de rastreador ou tráfego anormal; verifique a lista de online e o log de login."
"Record of the last {0} days: {1}": "Recorde dos últimos {0} dias: {1}"
"Cube admin console": "Console de administração do Cube"
"You are the AI assistant of {0}, helping an administrator work on the current page.": "Você é o assistente de IA do {0}, ajudando um administrador a trabalhar na página atual."
"The current page is not an entity data page (it may be system settings, the home page or system information), so there is no entity table context.": "A página atual não é uma página de dados de entidade (pode ser configurações do sistema, a página inicial ou informações do sistema), portanto não há contexto de tabela de entidade."
"Available tools: get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "Ferramentas disponíveis: get_page_context / get_system_info / run_js (consulte as definições das funções; chame-as quando necessário)"
"Rules:": "Regras:"
"1. Answer in the same language as the user's question, concisely and professionally": "1. Responda no mesmo idioma da pergunta do usuário, de forma concisa e profissional"
"2. When the user asks about the content, data or structure of the current page, call get_page_context to collect the page context from the user's browser, then give your analysis and conclusion": "2. Quando o usuário perguntar sobre o conteúdo, os dados ou a estrutura da página atual, chame get_page_context para coletar o contexto da página no navegador do usuário e depois apresente sua análise e conclusão"
"3. When the user asks about system status or diagnostics, call get_system_info, then give conclusions and suggestions": "3. Quando o usuário perguntar sobre o status ou o diagnóstico do sistema, chame get_system_info e depois apresente conclusões e sugestões"
"4. When the user asks to read or operate elements of the current page (fill inputs, click buttons, read titles and so on), you may call run_js; the script runs in the user's current page and may use document.querySelector to locate elements; explain any write operation (changing page content, submitting forms) to the user before running it": "4. Quando o usuário pedir para ler ou operar elementos da página atual (preencher campos, clicar em botões, ler títulos etc.), você pode chamar run_js; o script é executado na página atual do usuário e pode usar document.querySelector para localizar elementos; explique qualquer operação de escrita (alterar o conteúdo da página, enviar formulários) ao usuário antes de executá-la"
"5. Never invent data; ask the user for clarification when information is insufficient": "5. Nunca invente dados; peça esclarecimentos ao usuário quando as informações forem insuficientes"
"AI service is not registered": "O serviço de IA não está registrado"
"AI": "IA"
"AI chat": "Chat de IA"
"Browser operation result callback": "Retorno de chamada do resultado da operação no navegador"
"...[truncated]": "...[truncado]"
"AI is not enabled. Turn on AISwitch in system settings.": "A IA não está habilitada. Ative AISwitch nas configurações do sistema."
"AI call failed: {0}": "Falha na chamada de IA: {0}"
"Data:": "Dados:"
"You are a system operations expert. Based on the following runtime metrics, produce a health diagnosis report:\nCover bottlenecks, whether capacity should be expanded, and any risks worth attention.\nOutput the diagnosis report directly without extra explanation.": "Você é especialista em operações de sistemas. Com base nas métricas de tempo de execução a seguir, produza um relatório de diagnóstico de integridade:\nAborde os gargalos, se a capacidade deve ser expandida e quaisquer riscos que mereçam atenção.\nProduza o relatório de diagnóstico diretamente, sem explicações adicionais."
"Script must not be empty": "O script não pode ficar vazio"
"Browser channel is not ready (Writer not injected)": "O canal do navegador não está pronto (Writer não injetado)"
"Run page script": "Executar script da página"
"Runs JavaScript in the current page and returns the result; can read or modify page elements, for example document.title or document.querySelector('input[name=Name]').value": "Executa JavaScript na página atual e retorna o resultado; pode ler ou modificar elementos da página, por exemplo document.title ou document.querySelector('input[name=Name]').value"
"JavaScript code to run in the current page": "Código JavaScript a executar na página atual"
"Get page context": "Obter contexto da página"
"Gets the main data and structure of the current page (title, tables, forms and so on). Uses the server-side context when the page provides one; otherwise collects the page content from the user's browser": "Obtém os principais dados e a estrutura da página atual (título, tabelas, formulários etc.). Usa o contexto do lado do servidor quando a página o fornece; caso contrário, coleta o conteúdo da página no navegador do usuário"
"Get form schema": "Obter esquema do formulário"
"Gets the schema of the current form, including field names, types, descriptions and current values, for generating form values": "Obtém o esquema do formulário atual, incluindo nomes de campos, tipos, descrições e valores atuais, para gerar valores do formulário"
"Form mode: add or edit": "Modo do formulário: adicionar ou editar"
"Fill form": "Preencher formulário"
"Generates form field values and fills them into the front-end form. Nothing is written to the database until the user confirms": "Gera valores dos campos do formulário e os preenche no formulário do front-end. Nada é gravado no banco de dados até que o usuário confirme"
"Field values as a JSON string, keyed by field name": "Valores dos campos como uma cadeia JSON, com a chave sendo o nome do campo"
"No valid field value dictionary was received": "Nenhum dicionário de valores de campo válido foi recebido"
