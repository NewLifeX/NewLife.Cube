# 设置页字段、分类与导航（中文源文经英文规范键翻译）
"Auto (follow system)": "自動（跟隨系統）"
"Cancel": "取消"
"Queries {0}, executes {1}, elapsed {2:n0} ms": "查詢{0}次，執行{1}次，耗時{2:n0}毫秒"
"Show run time": "顯示執行時間"
"Avatar directory. Downloads remote avatars locally; defaults to the Avatars subdirectory, or Avatars next to the web root. Empty disables downloading": "頭像目錄。設定後下載遠端頭像到本機，預設 Avatars 子目錄，web 上一級 Avatars。清空表示不抓取"
"Text avatar characters. Generates an SVG text avatar when no image exists; 1 to 3 characters. Uses the first N Chinese characters to keep the surname, or the initials of English words. Default 2": "文字頭像字元數。頭像不存在時自動產生 SVG 文字頭像，可選 1~3 個字元。中文取前 N 字以保留姓氏，英文取各單詞首字母。預設 2"
"Upload directory. Defaults to Uploads": "上傳目錄。預設 Uploads"
"Web root directory. Defaults to wwwroot": "靜態資源目錄。預設 wwwroot"
"Resource URL. CDN base such as https://sso.newlifex.com/content/; empty uses local resources": "資源位址。指向 CDN，例如 https://sso.newlifex.com/content/，留空表示使用本機"
"CORS origins. Other origins allowed to access this site; * allows any origin": "跨域來源。允許其他來源存取目前網域，指定其他來源 http 位址，* 表示任意網域"
"Iframe embedding. Empty allows the same domain only; SAMEORIGIN allows the same domain and port; ALLOWALL allows any domain": "在 iframe 中顯示。預設為空-只允許相同網域，SAMEORIGIN-允許相同網域和連接埠，ALLOWALL-允許任何網域"
"Share expiration. Lifetime of share tokens in seconds, default 7200": "分享有效期。分享權杖的有效期，預設 7200 秒"
"Bot error code. Returns this error for crawlers, such as 404/500; 0 disables blocking": "機器人錯誤碼。設定後攔截各種爬蟲並傳回相應錯誤，例如 404/500，預設 0 不攔截"
"Force redirect. Target scheme and host for GET requests; * is supported in the host. Commonly used to force HTTPS, such as https://*:8081": "強制跳轉。指定目標 schema 和 host，在 GET 存取發現不一致時強制跳轉，host 支援 *。常用於強制跳轉 https，例如 https://*:8081"
"Security mode. 0: off; 1: observe and log only; 2: block; 3: automatic (default; observes, bans repeated attackers, and temporarily blocks broad attacks with automatic rollback)": "安全防禦模式。0=關閉，1=觀察模式僅記錄，2=攔截模式，3=自動模式（預設；觀察為主，連續攻擊自動封禁，大範圍攻擊暫時攔截並自動回落）"
"Auto-ban durations. Comma-separated seconds that increase with each trigger; empty uses 60,300,1800,7200,86400": "自動封禁時長級距。逗號分隔秒數，依觸發次數遞增；空值使用預設級距 60,300,1800,7200,86400"
"Trusted proxies. Forwarded headers are only trusted from these comma-separated IPs or CIDR ranges; empty keeps the legacy behavior of trusting all forwarded headers": "可信代理。來自這些代理的轉送標頭才被信任，逗號分隔 IP 或 CIDR 網段；空值相容舊行為信任全部轉送標頭"
"Trusted proxy learning limit. When no trusted proxies are configured, private direct sources that send forwarded headers are learned up to this count; 0 disables learning (typically 2 for one data center, 4 for two)": "可信代理自動學習數量。可信代理未設定時，自動學習攜帶轉送標頭的內網直連來源，最多學習該數量，0=不學習（單機房主備一般 2，雙機房一般 4）"
"Learned proxies. Maintained automatically; clear it to reset the learned list": "已學習代理。由系統自動維護，清空可重設學習結果"
"Default role. Defaults to the Normal User role": "預設角色。預設一般使用者"
"Allow password sign-in. Allows signing in with a username and password": "允許密碼登入。允許輸入使用者名稱密碼進行登入"
"Allow plain-text passwords. Default true for legacy clients; false forces Challenge-Response encrypted passwords": "允許明文密碼。預設 true，相容舊版用戶端；設為 false 後強制要求前端透過 Challenge-Response 加密密碼傳輸"
"Allow registration. Allows registering with a username and password": "允許註冊。允許輸入使用者名稱密碼進行註冊"
"Auto registration. Default true; after SSO sign-in an unknown local user is registered automatically. Enabled when either the global or the OAuth app setting is on": "自動註冊。預設 true，SSO 登入後，若本機未登入，自動註冊新使用者。全域設定和 OAuth 應用設定只要有一個啟用則表示使用"
"Password complexity check. When enabled the sign-in page validates password strength; when disabled it only requires a non-empty password. Default true": "複雜密碼驗證。啟用後登入頁驗證密碼複雜度（依密碼強度），停用後登入頁僅要求密碼非空，預設 true"
"Login failure limit. Bans sign-in after this many consecutive failures for the same user or IP, default 5": "登入失敗次數。短時間內，相同使用者或 IP 位址連續登入錯誤次數達到該值後禁止登入，預設 5"
"Login ban duration. Seconds a risk-control ban lasts, default 300": "登入封禁時間。觸發風控禁止登入後的禁止時間，預設 300 秒"
"Class C subnet ban threshold. Bans a /24 subnet such as 103.125.146.* after this many failures, default 10; 0 disables": "三段 IP 封禁閾值。三段 IP（例如 103.125.146.*）連續登入失敗次數達到該值後封禁該 IP 段，預設 10，0 表示不啟用"
"Class B subnet ban threshold. Bans a /16 subnet such as 103.125.*.* after this many failures, default 20; 0 disables": "兩段 IP 封禁閾值。兩段 IP（例如 103.125.*.*）連續登入失敗次數達到該值後封禁該 IP 段，預設 20，0 表示不啟用"
"Force bind by user name. Binds SSO users to local users with the same name without a provider prefix; intended for user centers": "強制綁定使用者名稱。依 SSO 使用者名稱強制綁定本機同名使用者，而不需要增加提供者前綴，一般用於使用者中心"
"Bind by user code. Binds SSO users to local users by user code": "綁定使用者代碼。依 SSO 使用者代碼強制綁定本機使用者"
"Bind by mobile. Binds SSO users to local users by mobile number": "綁定使用者手機。依 SSO 使用者手機強制綁定本機使用者"
"Bind by email. Binds SSO users to local users by email": "綁定使用者信箱。依 SSO 使用者信箱強制綁定本機使用者"
"Bind by nickname. Binds SSO users to local users by nickname; suitable for internal SSO, not for social networks with many duplicate names": "綁定使用者暱稱。依 SSO 使用者暱稱強制綁定本機使用者，內部 SSO 可用，不建議用於社交網路，重名太多"
"Use SSO roles. Keeps SSO roles after sign-in, default true; otherwise DefaultRole is used": "使用 Sso 角色。SSO 登入後繼續使用 SSO 角色，預設 true；否則使用 DefaultRole"
"Use SSO departments. Keeps SSO departments after sign-in, default true": "使用 Sso 部門。SSO 登入後繼續使用 SSO 部門，預設 true"
"SSO role rules. Automatically upgrades the primary role after SSO sign-in; separate rules with commas. Format: source role+department wildcard=target role, for example Guest+Route*=Route Specialist": "SSO 角色規則。SSO 登入後依規則自動升級使用者主角色，多條規則用逗號（半形或全形）分隔。格式：原角色+部門萬用字元=目標角色，例如：訪客+路由*=路由專員,一般使用者+*車隊=調度員"
"Sign out everywhere. false signs out of this site only; true (default) also signs out of the SSO server": "登出所有系統。false 僅登出本系統，預設 true 時登出 SsoServer"
"Allow multi-device sign-in. false kicks old devices on a new sign-in and revokes all tokens on sign-out; true (default) revokes only the current session": "允許多裝置登入。false 時同一帳號新登入會踢掉舊裝置，登出時撤銷該帳號所有權杖；true 時僅撤銷目前工作階段權杖，預設 true"
"Session timeout. Session lifetime after SSO sign-in during which the cookie can sign in again; default 0s": "工作階段逾時。單一登入後工作階段逾時時間，該時間內可藉由 Cookie 登入，預設 0s"
"Token sliding refresh threshold. Refreshes the JWT and rewrites the cookie when its remaining lifetime falls below this many seconds; 0 disables sliding expiration": "權杖滑動重新整理閾值。JWT 剩餘有效期低於該秒數時在 TryLogin 中自動重新整理權杖並寫入 Cookie，0 表示停用滑動過期"
"User refresh period. Fetches user information once per period across SSO sign-ins, default 600 seconds": "重新整理使用者週期。該週期內多次 SSO 登入只拉取一次使用者資訊，預設 600 秒"
"JWT secret. Algorithm and key used to sign JWTs, such as HS256:ABCD1234": "JWT 金鑰。用於產生 JWT 權杖的演算法和金鑰，例如 HS256:ABCD1234"
"Token lifetime. Lifetime of the access token in seconds, default 7200": "權杖有效期。存取權杖 AccessToken 的有效期，預設 7200 秒"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default true": "在 Cookie 中儲存權杖。讀取權杖時，若請求標頭沒有攜帶權杖，則從 Cookie 讀取，預設 true"
"Validate attachment access. Requires sign-in to access attachments, default true": "驗證附件存取。存取附件時，是否驗證登入狀態，預設 true"
"Public attachment categories. Categories accessible without sign-in, comma-separated, such as markdown,avatar. Applies when ValidateAttachment is true": "公開附件分類。無需登入即可存取的附件分類，多個用逗號分隔，例如 markdown,avatar。ValidateAttachment=true 時生效"
"Private attachment categories. Categories only the uploader can access, comma-separated. Applies when ValidateAttachment is true": "私有附件分類。僅上傳者本人可存取的附件分類，多個用逗號分隔。ValidateAttachment=true 時生效"
"SSO redirect allowlist. Domains allowed to receive the JWT after sign-in, comma-separated with wildcard prefixes such as *.company.com. Empty allows the same site only; other origins are rejected and sent back to the home page": "SSO 跨域重新導向白名單。登入後允許攜帶 JWT Token 重新導向的目標網域，逗號分隔，支援萬用字元前綴 *.company.com。留空=僅允許同站，跨域不在白名單則拒絕並跳回首頁"
"External authentication URL. When local authentication fails, credentials are verified by this endpoint; on success the local user is created or updated and signed in": "外部驗證位址。設定後，本機驗證失敗時呼叫外部介面驗證使用者名稱密碼，成功則自動建立/更新本機使用者並登入"
"Start page. First content page opened after entering the admin console": "工作台頁面。進入後台的第一個內容頁"
"Theme. Content page theme, ACE/layui": "主題樣式。每一個內容頁，ACE/layui"
"Skin. Outer frame layout, ACE/layui": "首頁面板。最外層框架頁，ACE/layui"
"Login tip. Empty hides the tip on the sign-in page": "登入提示。留空表示不顯示登入提示資訊"
"Login logo. Empty uses the default logo": "登入頁 Logo。留空時使用預設 Logo"
"Login background. Image URL; empty uses the default background": "登入頁背景圖。留空時使用預設背景，可填寫圖片 URL"
"Form group layout. 3/2/1 columns on large/medium/small screens, form-group col-xs-12 col-sm-6 col-lg-4": "表單群組樣式。大中小螢幕分別 3/2/1 欄，form-group col-xs-12 col-sm-6 col-lg-4"
"Bootstrap select. Nicer drop-downs with a rendering cost": "下拉選取框。使用 Bootstrap，美觀，但有呈現方面的效能損耗"
"Maximum drop-down items. Maximum options in a related drop-down on forms, default 50; larger lists fall back to a text box": "最大下拉個數。表單頁關聯下拉清單最大允許個數，預設 50，超過時顯示文字數字框"
"Copyright. Empty hides the copyright; variables now/runtime/framework are supported, and now accepts formats such as {now:yyyy}": "版權。留空表示不顯示版權資訊，支援變數 now/runtime/framework，其中 now 支援格式化字串如 {now:yyyy}"
"Filing number. Empty hides the filing information": "備案號。留空表示不顯示備案資訊"
"Enable new UI": "啟用新 UI"
"ECharts theme. Chart theme": "ECharts 主題。圖表樣式主題"
"Title suffix. Appends the system name to page titles, default true": "標題後綴。在頁面標題後面加上系統名稱，預設 true"
"Table double-click. Enables row double-click on list pages, default true": "表格雙擊事件。列表頁表格列雙擊事件停用，預設 true（啟用）"
"Table style. Light: minimal thin lines; Standard: clear row lines (default); Grid: full cell borders": "表格分隔樣式。Light-輕量（極簡淺線）、Standard-標準（清晰列線，預設）、Grid-網格（完整儲存格框線）"
"Table density. Compact: dense and information-rich (default); Normal: relaxed": "表格列高密度。Compact-緊湊（預設，資訊量大）、Normal-適中（呼吸感強）"
"Stardust web. Stardust console URL; supports direct links to /trace?id={traceId} or /graph?id={traceId}": "星塵 Web。星塵主控台位址，支援直達呼叫鏈 /trace?id={traceId} 或 /graph?id={traceId}"
"AI master switch. Enables AI features such as log analysis and notification polishing, default false": "AI 總開關。啟用後可使用記錄分析、通知潤飾等 AI 輔助功能，預設 false"
"AI provider. Supports NewLife, Ollama, DeepSeek, DashScope, OpenAI and others; default NewLife": "AI 服務商。支援 NewLife / Ollama / DeepSeek / DashScope / OpenAI 等，預設 NewLife"
"AI endpoint. Defaults to https://ai.newlifex.com for NewLife": "AI 服務位址。NewLife 預設 https://ai.newlifex.com"
"AI ApiKey. Defaults to sk-CubeAI2026 for NewLife": "AI ApiKey。NewLife 預設 sk-CubeAI2026"
"AI default model. Defaults to newlife-flash for NewLife": "AI 預設模型。NewLife 預設 newlife-flash"
"AI default deep reasoning. Enables think mode for analysis and chat by default; false means fast responses": "AI 預設深度推理。AI 分析與對話預設是否啟用深度推理（think），預設 false 即快速"
"AI color scheme. Fills the primary and secondary colors from a preset": "AI 助手主題色方案。預設方案聯動填滿主色/輔色"
"AI primary color. Main color of the launcher, panel header and user bubbles; default NewLife green #2ecc71": "AI 助手主色。懸浮球、面板標頭、使用者泡泡等主色調，預設新生命綠 #2ecc71"
"AI secondary color. Gradient end color, default dark green #1e8e3e": "AI 助手輔色。主色漸層終點色，預設深綠 #1e8e3e"
"OAuth server. Enables the OAuth 2.0 server that provides SSO for other applications": "OAuth 服務。是否啟用 OAuth2.0 服務，為其他應用提供單一登入服務"
"File manager. Enables backend file management (browse, upload, download, delete); this carries security risks": "檔案管理。是否啟用後台檔案管理，可瀏覽/上傳/下載/刪除站點內檔案，存在安全風險"
"Multi-tenancy. Enables tenants; tenant mode cannot access system administration and platform mode cannot access tenant pages": "多租戶。是否支援多租戶，租戶模式禁止存取系統管理，平台管理模式禁止存取租戶頁面"
"Tenant query policy. DenyWithEmpty: return an empty set without tenant context; ThrowOnMissingTenant: throw an explicit error": "多租戶查詢策略。DenyWithEmpty=無租戶內容傳回空集，ThrowOnMissingTenant=明確拋出錯誤"
"User online. 0: do not record; 1: signed-in users only; 2: all visitors (default)": "使用者線上。是否記錄使用者線上資訊，0 表示不記錄，1 表示僅記錄已登入使用者，2 表示記錄所有訪客。預設 2"
"User statistics. Records user visits, default true": "使用者統計。是否統計使用者存取，預設 true"
"Enable SMS. SMS verification codes and system notifications, default false": "啟用簡訊。包括簡訊驗證碼和系統通知，預設 false"
"Enable email. Email verification codes and system notifications, default false": "啟用郵件。包括郵件驗證碼和系統通知，預設 false"
"Require email verification. Users must activate their email before signing in and must provide one when registering, default false": "需要信箱驗證。註冊後必須啟用信箱才能登入，註冊時必須提供信箱，預設 false"
"Require mobile verification. Users must activate their mobile before signing in and must provide one when registering, default false": "需要手機驗證。註冊後必須啟用手機才能登入，註冊時必須提供手機，預設 false"
"Captcha scenarios. Bit mask: 0: off; 1: sign-in; 2: registration; 4: verification code requests (anti-SMS-bombing); combine with 3 for sign-in and registration. Mandatory scenarios are never exempted, default 0": "驗證碼場景。位元遮罩強制：0=不啟用，1=登入，2=註冊，4=發驗證碼（防簡訊轟炸），可組合，例如 3=登入+註冊均需驗證碼。強制要求不受自適應豁免，預設 0"
"Risk-adaptive captcha. Disabled when CaptchaScene is 0; when enabled it detects unsafe environments and requires a captcha, default true": "風險自適應驗證碼。驗證碼場景全關（CaptchaScene=0）時整體不啟用；啟用後自動感知目前機器是否安全，不安全環境要求圖片驗證碼，預設 true"
"Captcha risk threshold. Requires a captcha when the risk score reaches this value: 0: intranet; 1: internet; 2: internet with recent failures; 3: banned. Default 2": "驗證碼風險閾值。風險評分達到該值要求驗證碼：0=內網，1=公網，2=公網+近期登入失敗，3=封禁中。預設 2"
"Trusted device lifetime. Days during which previously successful devices skip adaptive captchas, default 30": "可信裝置有效期。曾成功登入的裝置在有效期內免自適應驗證碼（天），預設 30"
"Enable MFA. Allows users to enable TOTP multi-factor authentication; an enhanced feature, default false": "啟用 MFA。是否允許使用者開啟多因素驗證（TOTP），增強版功能，預設 false"
"File storage serving. Responds to file download requests from other nodes, default true": "檔案儲存提供服務。是否回應其他節點的檔案下載請求，預設 true"
"File storage fetch. Pulls new files published by other nodes, default true": "檔案儲存拉取檔案。是否主動拉取其他節點發佈的新檔案，預設 true"
"File fetch timeout. Maximum milliseconds to wait for other nodes when a file is missing locally, default 5000": "檔案儲存拉取逾時。下載本機缺少檔案時等待其他節點同步的最大時間（毫秒），預設 5000"
"Attachment storage. Local disk, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu or EasyIO; default Local": "附件儲存類型。Local 本機磁碟，Oss 阿里雲，Cos 騰訊雲，Qiniu 七牛，EasyIO 易物件，預設 Local"
"Object storage server. S3-compatible endpoint for OSS/COS/Qiniu, such as oss-cn-beijing.aliyuncs.com": "物件儲存伺服器。OSS/COS/七牛 S3 相容端點，例如 oss-cn-beijing.aliyuncs.com"
"Object storage bucket. Bucket name for OSS/COS/Qiniu": "物件儲存桶。OSS/COS/七牛儲存桶名稱"
"Object storage region. S3 signing scope, such as cn-beijing / ap-beijing / cn-east-1": "物件儲存區域。用於 S3 簽章作用域，例如 cn-beijing / ap-beijing / cn-east-1"
"Object storage app ID. AccessKeyId": "物件儲存應用識別。AccessKeyId"
"Object storage app secret. AccessKeySecret": "物件儲存應用金鑰。AccessKeySecret"
"Data retention. Days to keep audit and OAuth logs, default 30": "資料保留時間。稽核記錄與 OAuth 記錄，預設 30 天"
"File retention. Days to keep backup files, default 15": "檔案保留時間。備份檔案保留時間，預設 15 天"
"Retention size floor. Files smaller than this (KB) are never deleted even after the retention period, default 1024K": "保留檔案大小。小於該大小的檔案將不會被刪除，即使超過保留時間，單位 K 位元組，預設 1024K"
"Maximum export rows. Maximum rows a page may export, default 10_000_000": "最大匯出列數。頁面允許匯出的最大列數，預設 10_000_000"
"Maximum backup rows. Maximum rows a page may back up, default 10_000_000": "最大備份列數。頁面允許備份的最大列數，預設 10_000_000"
"API prefixes. Comma- or semicolon-separated prefixes such as /api,/api/v1; matching requests are forwarded to the real route without the prefix": "API 前綴。多個前綴用逗號或分號分隔，例如 /api,/api/v1。請求路徑命中前綴時自動去掉前綴並轉送到真實路由"
"Cookie mode. Default SameSite mode for token cookies (-1 Unspecified, 0 None, 1 Lax, 2 Strict)": "Cookie模式。token的cookies默認模式（ -1 Unspecified，0 None，1 Lax，2 Strict）"
"Cookie domain. Writes cookies to a parent domain; empty uses the current domain. A top-level domain requires HTTPS and prevents plain HTTP from writing same-name keys on the local domain": "Cookie域名。可用於把Cookie寫到頂級域名，默認為空寫當前域。寫頂級域要求https，同時會導致普通http無法在本地域寫同名鍵值"
"Activation URL. Front-end activation page URL used in email activation links, such as https://xxx/activate; empty builds /activate from the request host": "啟用頁位址。前端啟用頁URL，用於拼接郵件啟用連結，如 https://xxx/activate；為空時按請求Host拼接/activate"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default false": "在Cookie中儲存令牌。讀取令牌時，如果請求頭沒有攜帶令牌，則從Cookie讀取，預設false"
