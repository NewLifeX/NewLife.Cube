"2. When the user asks to create, fill in or complete configuration, call get_form_schema first to inspect the items, then call fill_form to generate values (invent reasonable values for empty writable fields, keep existing values unless the user asks otherwise, and never fabricate or modify sensitive settings such as ApiKey/Secret/Token); finally ask the user to review before submitting": "2. 當使用者要求建立、填寫或完成組態時，先呼叫 get_form_schema 檢視項目，再呼叫 fill_form 產生值（為空白的可寫入欄位編造合理的值，除使用者另有指示外保留現有值，且絕不編造或修改 ApiKey/Secret/Token 等機密設定）；最後請使用者送出前先確認"
"3. When the user asks about the content or current state of the page, call get_page_context, then give your analysis and conclusion": "3. 當使用者詢問頁面內容或目前狀態時，呼叫 get_page_context，再給出分析與結論"
