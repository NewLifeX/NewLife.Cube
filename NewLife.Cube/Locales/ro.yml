# 设置页字段、分类与导航（中文源文经英文规范键翻译）
"Auto (follow system)": "Automat (urmează sistemul)"
"Cancel": "Anulează"
"Queries {0}, executes {1}, elapsed {2:n0} ms": "Interogări {0}, execuții {1}, durata {2:n0} ms"
"Show run time": "Afișează timpul de execuție"
"Avatar directory. Downloads remote avatars locally; defaults to the Avatars subdirectory, or Avatars next to the web root. Empty disables downloading": "Directorul avatarelor. Descarcă avatarele la distanță local; implicit subdirectorul Avatars sau Avatars lângă rădăcina web. Gol dezactivează descărcarea"
"Text avatar characters. Generates an SVG text avatar when no image exists; 1 to 3 characters. Uses the first N Chinese characters to keep the surname, or the initials of English words. Default 2": "Caractere pentru avatarul text. Generează un avatar text SVG când nu există imagine; de la 1 la 3 caractere. Folosește primele N caractere chinezești pentru a păstra numele de familie sau inițialele cuvintelor englezești. Implicit 2"
"Upload directory. Defaults to Uploads": "Directorul de încărcare. Implicit Uploads"
"Web root directory. Defaults to wwwroot": "Directorul rădăcină web. Implicit wwwroot"
"Resource URL. CDN base such as https://sso.newlifex.com/content/; empty uses local resources": "URL resurse. Bază CDN, cum ar fi https://sso.newlifex.com/content/; gol folosește resursele locale"
"CORS origins. Other origins allowed to access this site; * allows any origin": "Origini CORS. Alte origini permise să acceseze acest site; * permite orice origine"
"Iframe embedding. Empty allows the same domain only; SAMEORIGIN allows the same domain and port; ALLOWALL allows any domain": "Încorporare iframe. Gol permite doar același domeniu; SAMEORIGIN permite același domeniu și port; ALLOWALL permite orice domeniu"
"Share expiration. Lifetime of share tokens in seconds, default 7200": "Expirarea partajării. Durata de viață a tokenurilor de partajare în secunde, implicit 7200"
"Bot error code. Returns this error for crawlers, such as 404/500; 0 disables blocking": "Cod de eroare pentru boți. Returnează această eroare crawlerelor, cum ar fi 404/500; 0 dezactivează blocarea"
"Force redirect. Target scheme and host for GET requests; * is supported in the host. Commonly used to force HTTPS, such as https://*:8081": "Redirecționare forțată. Schema și hostul țintă pentru cererile GET; * este acceptat în host. Folosit frecvent pentru a forța HTTPS, cum ar fi https://*:8081"
"Security mode. 0: off; 1: observe and log only; 2: block; 3: automatic (default; observes, bans repeated attackers, and temporarily blocks broad attacks with automatic rollback)": "Mod de securitate. 0: oprit; 1: doar observare și jurnalizare; 2: blocare; 3: automat (implicit; observă, blochează atacatorii repetitivi și blochează temporar atacurile ample cu revenire automată)"
"Auto-ban durations. Comma-separated seconds that increase with each trigger; empty uses 60,300,1800,7200,86400": "Durate de blocare automată. Secunde separate prin virgule care cresc la fiecare declanșare; gol folosește 60,300,1800,7200,86400"
"Trusted proxies. Forwarded headers are only trusted from these comma-separated IPs or CIDR ranges; empty keeps the legacy behavior of trusting all forwarded headers": "Proxy-uri de încredere. Antetele redirecționate sunt acceptate doar de la aceste IP-uri sau intervale CIDR separate prin virgule; gol păstrează comportamentul vechi de a accepta toate antetele redirecționate"
"Trusted proxy learning limit. When no trusted proxies are configured, private direct sources that send forwarded headers are learned up to this count; 0 disables learning (typically 2 for one data center, 4 for two)": "Limita de învățare a proxy-urilor de încredere. Când nu sunt configurate proxy-uri de încredere, sursele private directe care trimit antete redirecționate sunt învățate până la acest număr; 0 dezactivează învățarea (de obicei 2 pentru un centru de date, 4 pentru două)"
"Learned proxies. Maintained automatically; clear it to reset the learned list": "Proxy-uri învățate. Întreținute automat; goliți-le pentru a reseta lista învățată"
"Default role. Defaults to the Normal User role": "Rol implicit. Implicit rolul Utilizator normal"
"Allow password sign-in. Allows signing in with a username and password": "Permite autentificarea cu parolă. Permite autentificarea cu nume de utilizator și parolă"
"Allow plain-text passwords. Default true for legacy clients; false forces Challenge-Response encrypted passwords": "Permite parole în text simplu. Implicit true pentru clienții vechi; false forțează parole criptate Challenge-Response"
"Allow registration. Allows registering with a username and password": "Permite înregistrarea. Permite înregistrarea cu nume de utilizator și parolă"
"Auto registration. Default true; after SSO sign-in an unknown local user is registered automatically. Enabled when either the global or the OAuth app setting is on": "Înregistrare automată. Implicit true; după autentificarea SSO, un utilizator local necunoscut este înregistrat automat. Activat când setarea globală sau cea a aplicației OAuth este pornită"
"Password complexity check. When enabled the sign-in page validates password strength; when disabled it only requires a non-empty password. Default true": "Verificarea complexității parolei. Când este activată, pagina de autentificare validează puterea parolei; când este dezactivată, cere doar o parolă nevidă. Implicit true"
"Login failure limit. Bans sign-in after this many consecutive failures for the same user or IP, default 5": "Limita de eșecuri de autentificare. Blochează autentificarea după acest număr de eșecuri consecutive pentru același utilizator sau IP, implicit 5"
"Login ban duration. Seconds a risk-control ban lasts, default 300": "Durata blocării autentificării. Secunde cât durează o blocare de control al riscului, implicit 300"
"Class C subnet ban threshold. Bans a /24 subnet such as 103.125.146.* after this many failures, default 10; 0 disables": "Pragul de blocare a subrețelei clasa C. Blochează o subrețea /24 precum 103.125.146.* după acest număr de eșecuri, implicit 10; 0 dezactivează"
"Class B subnet ban threshold. Bans a /16 subnet such as 103.125.*.* after this many failures, default 20; 0 disables": "Pragul de blocare a subrețelei clasa B. Blochează o subrețea /16 precum 103.125.*.* după acest număr de eșecuri, implicit 20; 0 dezactivează"
"Force bind by user name. Binds SSO users to local users with the same name without a provider prefix; intended for user centers": "Asociere forțată după numele de utilizator. Asociază utilizatorii SSO la utilizatorii locali cu același nume, fără prefixul furnizorului; destinat centrelor de utilizatori"
"Bind by user code. Binds SSO users to local users by user code": "Asociere după codul de utilizator. Asociază utilizatorii SSO la utilizatorii locali după codul de utilizator"
"Bind by mobile. Binds SSO users to local users by mobile number": "Asociere după telefonul mobil. Asociază utilizatorii SSO la utilizatorii locali după numărul de mobil"
"Bind by email. Binds SSO users to local users by email": "Asociere după e-mail. Asociază utilizatorii SSO la utilizatorii locali după e-mail"
"Bind by nickname. Binds SSO users to local users by nickname; suitable for internal SSO, not for social networks with many duplicate names": "Asociere după poreclă. Asociază utilizatorii SSO la utilizatorii locali după poreclă; potrivit pentru SSO intern, nu pentru rețele sociale cu multe nume duplicate"
"Use SSO roles. Keeps SSO roles after sign-in, default true; otherwise DefaultRole is used": "Folosește rolurile SSO. Păstrează rolurile SSO după autentificare, implicit true; altfel se folosește DefaultRole"
"Use SSO departments. Keeps SSO departments after sign-in, default true": "Folosește departamentele SSO. Păstrează departamentele SSO după autentificare, implicit true"
"SSO role rules. Automatically upgrades the primary role after SSO sign-in; separate rules with commas. Format: source role+department wildcard=target role, for example Guest+Route*=Route Specialist": "Reguli de rol SSO. Actualizează automat rolul principal după autentificarea SSO; separați regulile prin virgule. Format: rol sursă+wildcard departament=rol țintă, de exemplu Guest+Route*=Specialist trasee"
"Sign out everywhere. false signs out of this site only; true (default) also signs out of the SSO server": "Deconectare de peste tot. false deconectează doar de pe acest site; true (implicit) deconectează și de pe serverul SSO"
"Allow multi-device sign-in. false kicks old devices on a new sign-in and revokes all tokens on sign-out; true (default) revokes only the current session": "Permite autentificarea pe mai multe dispozitive. false deconectează dispozitivele vechi la o autentificare nouă și revocă toate tokenurile la deconectare; true (implicit) revocă doar sesiunea curentă"
"Session timeout. Session lifetime after SSO sign-in during which the cookie can sign in again; default 0s": "Expirarea sesiunii. Durata de viață a sesiunii după autentificarea SSO în care cookie-ul se poate autentifica din nou; implicit 0s"
"Token sliding refresh threshold. Refreshes the JWT and rewrites the cookie when its remaining lifetime falls below this many seconds; 0 disables sliding expiration": "Pragul de reîmprospătare glisantă a tokenului. Reîmprospătează JWT-ul și rescrie cookie-ul când durata de viață rămasă scade sub acest număr de secunde; 0 dezactivează expirarea glisantă"
"User refresh period. Fetches user information once per period across SSO sign-ins, default 600 seconds": "Perioada de reîmprospătare a utilizatorului. Preia informațiile utilizatorului o dată pe perioadă între autentificările SSO, implicit 600 secunde"
"JWT secret. Algorithm and key used to sign JWTs, such as HS256:ABCD1234": "Secretul JWT. Algoritmul și cheia folosite pentru semnarea JWT-urilor, cum ar fi HS256:ABCD1234"
"Token lifetime. Lifetime of the access token in seconds, default 7200": "Durata de viață a tokenului. Durata de viață a tokenului de acces în secunde, implicit 7200"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default true": "Stochează tokenul în cookie. Citește tokenul din cookie când antetul cererii nu conține unul, implicit true"
"Validate attachment access. Requires sign-in to access attachments, default true": "Validează accesul la atașamente. Cere autentificare pentru a accesa atașamentele, implicit true"
"Public attachment categories. Categories accessible without sign-in, comma-separated, such as markdown,avatar. Applies when ValidateAttachment is true": "Categorii publice de atașamente. Categorii accesibile fără autentificare, separate prin virgule, cum ar fi markdown,avatar. Se aplică atunci când ValidateAttachment este true"
"Private attachment categories. Categories only the uploader can access, comma-separated. Applies when ValidateAttachment is true": "Categorii private de atașamente. Categorii accesibile doar celui care încarcă, separate prin virgule. Se aplică atunci când ValidateAttachment este true"
"SSO redirect allowlist. Domains allowed to receive the JWT after sign-in, comma-separated with wildcard prefixes such as *.company.com. Empty allows the same site only; other origins are rejected and sent back to the home page": "Lista de permisiuni pentru redirecționarea SSO. Domenii permise să primească JWT-ul după autentificare, separate prin virgule, cu prefixe wildcard precum *.company.com. Gol permite doar același site; alte origini sunt respinse și trimise înapoi la pagina principală"
"External authentication URL. When local authentication fails, credentials are verified by this endpoint; on success the local user is created or updated and signed in": "URL de autentificare externă. Când autentificarea locală eșuează, credențialele sunt verificate de acest endpoint; în caz de succes, utilizatorul local este creat sau actualizat și autentificat"
"Start page. First content page opened after entering the admin console": "Pagina de start. Prima pagină de conținut deschisă după intrarea în consola de administrare"
"Theme. Content page theme, ACE/layui": "Temă. Tema paginii de conținut, ACE/layui"
"Skin. Outer frame layout, ACE/layui": "Aspect. Aspectul cadrului exterior, ACE/layui"
"Login tip. Empty hides the tip on the sign-in page": "Sfat de autentificare. Gol ascunde sfatul de pe pagina de autentificare"
"Login logo. Empty uses the default logo": "Sigla de autentificare. Gol folosește sigla implicită"
"Login background. Image URL; empty uses the default background": "Fundalul autentificării. URL-ul imaginii; gol folosește fundalul implicit"
"Form group layout. 3/2/1 columns on large/medium/small screens, form-group col-xs-12 col-sm-6 col-lg-4": "Aspectul grupului de formular. 3/2/1 coloane pe ecrane mari/medii/mici, form-group col-xs-12 col-sm-6 col-lg-4"
"Bootstrap select. Nicer drop-downs with a rendering cost": "Bootstrap select. Liste derulante mai frumoase, cu un cost de randare"
"Maximum drop-down items. Maximum options in a related drop-down on forms, default 50; larger lists fall back to a text box": "Numărul maxim de elemente din listă. Numărul maxim de opțiuni într-o listă derulantă asociată în formulare, implicit 50; listele mai mari folosesc o casetă de text"
"Copyright. Empty hides the copyright; variables now/runtime/framework are supported, and now accepts formats such as {now:yyyy}": "Drepturi de autor. Gol ascunde drepturile de autor; variabilele now/runtime/framework sunt acceptate, iar now acceptă formate precum {now:yyyy}"
"Filing number. Empty hides the filing information": "Număr de înregistrare. Gol ascunde informațiile de înregistrare"
"Enable new UI": "Activează interfața nouă"
"ECharts theme. Chart theme": "Tema ECharts. Tema graficelor"
"Title suffix. Appends the system name to page titles, default true": "Sufixul titlului. Adaugă numele sistemului la titlurile paginilor, implicit true"
"Table double-click. Enables row double-click on list pages, default true": "Dublu clic pe tabel. Activează dublu clic pe rândurile din paginile de listă, implicit true"
"Table style. Light: minimal thin lines; Standard: clear row lines (default); Grid: full cell borders": "Stilul tabelului. Ușor: linii subțiri minimale; Standard: linii clare de rând (implicit); Grilă: borduri complete ale celulelor"
"Table density. Compact: dense and information-rich (default); Normal: relaxed": "Densitatea tabelului. Compact: dens și bogat în informații (implicit); Normal: aerisit"
"Stardust web. Stardust console URL; supports direct links to /trace?id={traceId} or /graph?id={traceId}": "Stardust web. URL-ul consolei Stardust; acceptă linkuri directe către /trace?id={traceId} sau /graph?id={traceId}"
"AI master switch. Enables AI features such as log analysis and notification polishing, default false": "Comutatorul principal AI. Activează funcții AI precum analiza jurnalelor și rafinarea notificărilor, implicit false"
"AI provider. Supports NewLife, Ollama, DeepSeek, DashScope, OpenAI and others; default NewLife": "Furnizorul AI. Acceptă NewLife, Ollama, DeepSeek, DashScope, OpenAI și altele; implicit NewLife"
"AI endpoint. Defaults to https://ai.newlifex.com for NewLife": "Endpointul AI. Implicit https://ai.newlifex.com pentru NewLife"
"AI ApiKey. Defaults to sk-CubeAI2026 for NewLife": "ApiKey AI. Implicit sk-CubeAI2026 pentru NewLife"
"AI default model. Defaults to newlife-flash for NewLife": "Modelul AI implicit. Implicit newlife-flash pentru NewLife"
"AI default deep reasoning. Enables think mode for analysis and chat by default; false means fast responses": "Raționament profund AI implicit. Activează implicit modul think pentru analiză și chat; false înseamnă răspunsuri rapide"
"AI color scheme. Fills the primary and secondary colors from a preset": "Schema de culori AI. Completează culorile primară și secundară dintr-o presetare"
"AI primary color. Main color of the launcher, panel header and user bubbles; default NewLife green #2ecc71": "Culoarea primară AI. Culoarea principală a lansatorului, a antetului panoului și a bulelor utilizatorului; implicit verde NewLife #2ecc71"
"AI secondary color. Gradient end color, default dark green #1e8e3e": "Culoarea secundară AI. Culoarea de sfârșit a gradientului, implicit verde închis #1e8e3e"
"OAuth server. Enables the OAuth 2.0 server that provides SSO for other applications": "Server OAuth. Activează serverul OAuth 2.0 care oferă SSO pentru alte aplicații"
"File manager. Enables backend file management (browse, upload, download, delete); this carries security risks": "Manager de fișiere. Activează gestionarea fișierelor în back-end (răsfoire, încărcare, descărcare, ștergere); aceasta implică riscuri de securitate"
"Multi-tenancy. Enables tenants; tenant mode cannot access system administration and platform mode cannot access tenant pages": "Multi-chiriaș. Activează chiriașii; modul chiriaș nu poate accesa administrarea sistemului, iar modul platformă nu poate accesa paginile chiriașului"
"Tenant query policy. DenyWithEmpty: return an empty set without tenant context; ThrowOnMissingTenant: throw an explicit error": "Politica de interogare a chiriașilor. DenyWithEmpty: returnează un set gol fără context de chiriaș; ThrowOnMissingTenant: aruncă o eroare explicită"
"User online. 0: do not record; 1: signed-in users only; 2: all visitors (default)": "Utilizatori online. 0: nu înregistra; 1: doar utilizatorii autentificați; 2: toți vizitatorii (implicit)"
"User statistics. Records user visits, default true": "Statistici utilizatori. Înregistrează vizitele utilizatorilor, implicit true"
"Enable SMS. SMS verification codes and system notifications, default false": "Activează SMS. Coduri de verificare și notificări de sistem prin SMS, implicit false"
"Enable email. Email verification codes and system notifications, default false": "Activează e-mailul. Coduri de verificare și notificări de sistem prin e-mail, implicit false"
"Require email verification. Users must activate their email before signing in and must provide one when registering, default false": "Cere verificarea e-mailului. Utilizatorii trebuie să-și activeze e-mailul înainte de autentificare și să furnizeze unul la înregistrare, implicit false"
"Require mobile verification. Users must activate their mobile before signing in and must provide one when registering, default false": "Cere verificarea telefonului mobil. Utilizatorii trebuie să-și activeze mobilul înainte de autentificare și să furnizeze unul la înregistrare, implicit false"
"Captcha scenarios. Bit mask: 0: off; 1: sign-in; 2: registration; 4: verification code requests (anti-SMS-bombing); combine with 3 for sign-in and registration. Mandatory scenarios are never exempted, default 0": "Scenarii captcha. Mască de biți: 0: oprit; 1: autentificare; 2: înregistrare; 4: cereri de cod de verificare (anti-bombardare SMS); combinați cu 3 pentru autentificare și înregistrare. Scenariile obligatorii nu sunt niciodată exceptate, implicit 0"
"Risk-adaptive captcha. Disabled when CaptchaScene is 0; when enabled it detects unsafe environments and requires a captcha, default true": "Captcha adaptiv la risc. Dezactivat când CaptchaScene este 0; când este activat, detectează medii nesigure și cere un captcha, implicit true"
"Captcha risk threshold. Requires a captcha when the risk score reaches this value: 0: intranet; 1: internet; 2: internet with recent failures; 3: banned. Default 2": "Pragul de risc al captcha. Cere un captcha când scorul de risc atinge această valoare: 0: intranet; 1: internet; 2: internet cu eșecuri recente; 3: blocat. Implicit 2"
"Trusted device lifetime. Days during which previously successful devices skip adaptive captchas, default 30": "Durata de viață a dispozitivelor de încredere. Zile în care dispozitivele cu autentificări reușite anterior evită captcha adaptiv, implicit 30"
"Enable MFA. Allows users to enable TOTP multi-factor authentication; an enhanced feature, default false": "Activează MFA. Permite utilizatorilor să activeze autentificarea multifactor TOTP; o funcție avansată, implicit false"
"File storage serving. Responds to file download requests from other nodes, default true": "Servirea stocării fișierelor. Răspunde la cererile de descărcare a fișierelor de la alte noduri, implicit true"
"File storage fetch. Pulls new files published by other nodes, default true": "Preluarea din stocarea fișierelor. Preia fișierele noi publicate de alte noduri, implicit true"
"File fetch timeout. Maximum milliseconds to wait for other nodes when a file is missing locally, default 5000": "Expirarea preluării fișierelor. Numărul maxim de milisecunde de așteptare pentru alte noduri când un fișier lipsește local, implicit 5000"
"Attachment storage. Local disk, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu or EasyIO; default Local": "Stocarea atașamentelor. Disc local, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu sau EasyIO; implicit Local"
"Object storage server. S3-compatible endpoint for OSS/COS/Qiniu, such as oss-cn-beijing.aliyuncs.com": "Serverul de stocare a obiectelor. Endpoint compatibil S3 pentru OSS/COS/Qiniu, cum ar fi oss-cn-beijing.aliyuncs.com"
"Object storage bucket. Bucket name for OSS/COS/Qiniu": "Bucketul de stocare a obiectelor. Numele bucketului pentru OSS/COS/Qiniu"
"Object storage region. S3 signing scope, such as cn-beijing / ap-beijing / cn-east-1": "Regiunea de stocare a obiectelor. Domeniul de semnare S3, cum ar fi cn-beijing / ap-beijing / cn-east-1"
"Object storage app ID. AccessKeyId": "ID-ul aplicației de stocare a obiectelor. AccessKeyId"
"Object storage app secret. AccessKeySecret": "Secretul aplicației de stocare a obiectelor. AccessKeySecret"
"Data retention. Days to keep audit and OAuth logs, default 30": "Retenția datelor. Zile de păstrare a jurnalelor de audit și OAuth, implicit 30"
"File retention. Days to keep backup files, default 15": "Retenția fișierelor. Zile de păstrare a fișierelor de copie de rezervă, implicit 15"
"Retention size floor. Files smaller than this (KB) are never deleted even after the retention period, default 1024K": "Pragul minim de dimensiune pentru retenție. Fișierele mai mici decât această valoare (KB) nu sunt niciodată șterse, chiar și după perioada de retenție, implicit 1024K"
"Maximum export rows. Maximum rows a page may export, default 10_000_000": "Numărul maxim de rânduri exportate. Numărul maxim de rânduri pe care o pagină le poate exporta, implicit 10_000_000"
"Maximum backup rows. Maximum rows a page may back up, default 10_000_000": "Numărul maxim de rânduri pentru copia de rezervă. Numărul maxim de rânduri pe care o pagină le poate salva, implicit 10_000_000"
"API prefixes. Comma- or semicolon-separated prefixes such as /api,/api/v1; matching requests are forwarded to the real route without the prefix": "Prefixe API. Prefixe separate prin virgule sau punct și virgulă, cum ar fi /api,/api/v1; cererile corespunzătoare sunt redirecționate către ruta reală fără prefix"
"Password strength. * means unrestricted; by default at least 8 characters with digits, upper/lower case letters and symbols. Simple form: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$": "Puterea parolei. * înseamnă fără restricții; implicit cel puțin 8 caractere cu cifre, litere mari/mici și simboluri. Forma simplă: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$"
"Cookie mode. Default SameSite mode for token cookies (-1 Unspecified, 0 None, 1 Lax, 2 Strict)": "Modul cookie. Modul SameSite implicit pentru cookie-urile de token (-1 Unspecified, 0 None, 1 Lax, 2 Strict)"
"Cookie domain. Writes cookies to a parent domain; empty uses the current domain. A top-level domain requires HTTPS and prevents plain HTTP from writing same-name keys on the local domain": "Domeniul cookie. Scrie cookie-uri într-un domeniu părinte; gol folosește domeniul curent. Un domeniu de nivel superior necesită HTTPS și împiedică HTTP simplu să scrie chei cu același nume pe domeniul local"
"Activation URL. Front-end activation page URL used in email activation links, such as https://xxx/activate; empty builds /activate from the request host": "URL de activare. URL-ul paginii de activare din front-end folosit în linkurile de activare prin e-mail, cum ar fi https://xxx/activate; gol construiește /activate din hostul cererii"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default false": "Stochează tokenul în cookie. Citește tokenul din cookie când antetul cererii nu conține unul, implicit false"
"Password strength. * means unrestricted; the simple form defaults to 5 to 32 characters of any type. The full form requires at least 8 characters with digits, upper/lower case letters and symbols: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$": "Puterea parolei. * înseamnă fără restricții; forma simplă folosește implicit 5 până la 32 de caractere de orice tip. Forma completă cere cel puțin 8 caractere cu cifre, litere mari/mici și simboluri: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$"
