"Online peak warning {0}": "Avertisment privind vârful de conectări {0}"
"There are {0} users online, exceeding the {1}-day record of {2} (threshold {3:0}). This may be a campaign, a crawler scan or abnormal traffic; check the online list and sign-in log.": "Sunt {0} utilizatori online, depășind recordul de {1} zile de {2} (prag {3:0}). Poate fi o campanie, o scanare a crawlerelor sau trafic anormal; verificați lista online și jurnalul de autentificare."
"Record of the last {0} days: {1}": "Recordul ultimelor {0} zile: {1}"
"Cube admin console": "Consola de administrare Cube"
"You are the AI assistant of {0}, helping an administrator work on the current page.": "Sunteți asistentul AI al {0} și ajutați un administrator să lucreze pe pagina curentă."
"The current page is not an entity data page (it may be system settings, the home page or system information), so there is no entity table context.": "Pagina curentă nu este o pagină de date de entitate (poate fi setări de sistem, pagina principală sau informații de sistem), deci nu există context de tabel de entitate."
"Available tools: get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "Instrumente disponibile: get_page_context / get_system_info / run_js (consultați definițiile funcțiilor; apelați-le când este necesar)"
"Rules:": "Reguli:"
"1. Answer in the same language as the user's question, concisely and professionally": "1. Răspundeți în aceeași limbă ca întrebarea utilizatorului, concis și profesional"
"2. When the user asks about the content, data or structure of the current page, call get_page_context to collect the page context from the user's browser, then give your analysis and conclusion": "2. Când utilizatorul întreabă despre conținutul, datele sau structura paginii curente, apelați get_page_context pentru a colecta contextul paginii din browserul utilizatorului, apoi prezentați analiza și concluzia"
"3. When the user asks about system status or diagnostics, call get_system_info, then give conclusions and suggestions": "3. Când utilizatorul întreabă despre starea sau diagnosticarea sistemului, apelați get_system_info, apoi prezentați concluzii și recomandări"
"4. When the user asks to read or operate elements of the current page (fill inputs, click buttons, read titles and so on), you may call run_js; the script runs in the user's current page and may use document.querySelector to locate elements; explain any write operation (changing page content, submitting forms) to the user before running it": "4. Când utilizatorul cere să citiți sau să operați elemente ale paginii curente (completarea câmpurilor, clic pe butoane, citirea titlurilor etc.), puteți apela run_js; scriptul rulează în pagina curentă a utilizatorului și poate folosi document.querySelector pentru a localiza elemente; explicați utilizatorului orice operație de scriere (modificarea conținutului paginii, trimiterea formularelor) înainte de a o executa"
