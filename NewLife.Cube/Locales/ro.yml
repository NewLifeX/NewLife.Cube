"5. When the user asks to read or operate page elements, you may call run_js; explain any write operation (changing page content, submitting forms) to the user before running it": "5. Când utilizatorul cere să citiți sau să operați elemente ale paginii, puteți apela run_js; explicați utilizatorului orice operație de scriere (modificarea conținutului paginii, trimiterea formularelor) înainte de a o executa"
"6. Never invent data; ask the user for clarification when information is insufficient": "6. Nu inventați niciodată date; cereți clarificări utilizatorului când informațiile sunt insuficiente"
