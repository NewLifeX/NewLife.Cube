"Auto-ban durations. Comma-separated seconds that increase with each trigger; empty uses 60,300,1800,7200,86400": "Automaattisen eston kestot. Pilkuin erotetut sekunnit, jotka kasvavat jokaisella laukaisulla; tyhjä käyttää 60,300,1800,7200,86400"
"Trusted proxies. Forwarded headers are only trusted from these comma-separated IPs or CIDR ranges; empty keeps the legacy behavior of trusting all forwarded headers": "Luotetut välityspalvelimet. Välitetyt otsikot hyväksytään vain näistä pilkuin erotetuista IP-osoitteista tai CIDR-alueista; tyhjä säilyttää vanhan toiminnan, jossa kaikki välitetyt otsikot hyväksytään"
"Trusted proxy learning limit. When no trusted proxies are configured, private direct sources that send forwarded headers are learned up to this count; 0 disables learning (typically 2 for one data center, 4 for two)": "Luotettujen välityspalvelimien oppimisraja. Kun luotettuja välityspalvelimia ei ole määritetty, yksityiset suorat lähteet, jotka lähettävät välitettyjä otsikoita, opitaan tähän määrään asti; 0 poistaa oppimisen käytöstä (tyypillisesti 2 yhdelle datakeskukselle, 4 kahdelle)"
"Learned proxies. Maintained automatically; clear it to reset the learned list": "Opitut välityspalvelimet. Ylläpidetään automaattisesti; tyhjennä se nollataksesi opitun luettelon"
"Default role. Defaults to the Normal User role": "Oletusrooli. Oletuksena Normaali käyttäjä -rooli"
"Allow password sign-in. Allows signing in with a username and password": "Salli salasanakirjautuminen. Sallii kirjautumisen käyttäjänimellä ja salasanalla"
"Allow plain-text passwords. Default true for legacy clients; false forces Challenge-Response encrypted passwords": "Salli selkokieliset salasanat. Oletus true vanhoille asiakkaille; false pakottaa Challenge-Response-salatut salasanat"
"Allow registration. Allows registering with a username and password": "Salli rekisteröityminen. Sallii rekisteröitymisen käyttäjänimellä ja salasanalla"
"Auto registration. Default true; after SSO sign-in an unknown local user is registered automatically. Enabled when either the global or the OAuth app setting is on": "Automaattinen rekisteröinti. Oletus true; SSO-kirjautumisen jälkeen tuntematon paikallinen käyttäjä rekisteröidään automaattisesti. Käytössä, kun joko yleinen asetus tai OAuth-sovelluksen asetus on päällä"
"Password complexity check. When enabled the sign-in page validates password strength; when disabled it only requires a non-empty password. Default true": "Salasanan monimutkaisuustarkistus. Kun käytössä, kirjautumissivu validoi salasanan vahvuuden; kun poissa käytöstä, vaaditaan vain ei-tyhjä salasana. Oletus true"
"Login failure limit. Bans sign-in after this many consecutive failures for the same user or IP, default 5": "Kirjautumisvirheiden raja. Estää kirjautumisen tämän monen peräkkäisen virheen jälkeen samalta käyttäjältä tai IP-osoitteelta, oletus 5"
"Login ban duration. Seconds a risk-control ban lasts, default 300": "Kirjautumiseston kesto. Sekunnit, joiden ajan riskienhallinnan esto kestää, oletus 300"
"Class C subnet ban threshold. Bans a /24 subnet such as 103.125.146.* after this many failures, default 10; 0 disables": "C-luokan aliverkon estokynnys. Estää /24-aliverkon, kuten 103.125.146.*, tämän monen virheen jälkeen, oletus 10; 0 poistaa käytöstä"
"Class B subnet ban threshold. Bans a /16 subnet such as 103.125.*.* after this many failures, default 20; 0 disables": "B-luokan aliverkon estokynnys. Estää /16-aliverkon, kuten 103.125.*.*, tämän monen virheen jälkeen, oletus 20; 0 poistaa käytöstä"
"Force bind by user name. Binds SSO users to local users with the same name without a provider prefix; intended for user centers": "Pakota liittäminen käyttäjänimen mukaan. Liittää SSO-käyttäjät paikallisiin käyttäjiin, joilla on sama nimi ilman tarjoajan etuliitettä; tarkoitettu käyttäjäkeskuksille"
"Bind by user code. Binds SSO users to local users by user code": "Liitä käyttäjäkoodin mukaan. Liittää SSO-käyttäjät paikallisiin käyttäjiin käyttäjäkoodin perusteella"
"Bind by mobile. Binds SSO users to local users by mobile number": "Liitä matkapuhelimen mukaan. Liittää SSO-käyttäjät paikallisiin käyttäjiin matkapuhelinnumeron perusteella"
"Bind by email. Binds SSO users to local users by email": "Liitä sähköpostin mukaan. Liittää SSO-käyttäjät paikallisiin käyttäjiin sähköpostin perusteella"
"Bind by nickname. Binds SSO users to local users by nickname; suitable for internal SSO, not for social networks with many duplicate names": "Liitä lempinimen mukaan. Liittää SSO-käyttäjät paikallisiin käyttäjiin lempinimen perusteella; sopii sisäiseen SSO:hon, ei sosiaalisiin verkostoihin, joissa on paljon samannimisiä"
"Use SSO roles. Keeps SSO roles after sign-in, default true; otherwise DefaultRole is used": "Käytä SSO-rooleja. Säilyttää SSO-roolit kirjautumisen jälkeen, oletus true; muuten käytetään DefaultRole-asetusta"
"Use SSO departments. Keeps SSO departments after sign-in, default true": "Käytä SSO-osastoja. Säilyttää SSO-osastot kirjautumisen jälkeen, oletus true"
"SSO role rules. Automatically upgrades the primary role after SSO sign-in; separate rules with commas. Format: source role+department wildcard=target role, for example Guest+Route*=Route Specialist": "SSO-roolisäännöt. Päivittää ensisijaisen roolin automaattisesti SSO-kirjautumisen jälkeen; erota säännöt pilkuilla. Muoto: lähderooli+osastojokerimerkki=kohderooli, esimerkiksi Guest+Route*=Route Specialist"
"Sign out everywhere. false signs out of this site only; true (default) also signs out of the SSO server": "Kirjaudu ulos kaikkialta. false kirjaa ulos vain tältä sivustolta; true (oletus) kirjaa ulos myös SSO-palvelimelta"
"Allow multi-device sign-in. false kicks old devices on a new sign-in and revokes all tokens on sign-out; true (default) revokes only the current session": "Salli kirjautuminen usealta laitteelta. false potkaisee vanhat laitteet uuden kirjautumisen yhteydessä ja peruuttaa kaikki tokenit uloskirjautumisessa; true (oletus) peruuttaa vain nykyisen istunnon"
"Session timeout. Session lifetime after SSO sign-in during which the cookie can sign in again; default 0s": "Istunnon aikakatkaisu. Istunnon elinikä SSO-kirjautumisen jälkeen, jonka ajan eväste voi kirjautua uudelleen; oletus 0 s"
"Token sliding refresh threshold. Refreshes the JWT and rewrites the cookie when its remaining lifetime falls below this many seconds; 0 disables sliding expiration": "Tokenin liukuvan päivityksen kynnys. Päivittää JWT:n ja kirjoittaa evästeen uudelleen, kun jäljellä oleva elinikä laskee tämän monen sekunnin alle; 0 poistaa liukuvan vanhenemisen käytöstä"
"User refresh period. Fetches user information once per period across SSO sign-ins, default 600 seconds": "Käyttäjän päivitysväli. Hakee käyttäjätiedot kerran jaksoa kohden SSO-kirjautumisten välillä, oletus 600 sekuntia"
"JWT secret. Algorithm and key used to sign JWTs, such as HS256:ABCD1234": "JWT-salaisuus. Algoritmi ja avain JWT:iden allekirjoittamiseen, esimerkiksi HS256:ABCD1234"
"Token lifetime. Lifetime of the access token in seconds, default 7200": "Tokenin elinikä. Käyttöoikeustokenin elinikä sekunteina, oletus 7200"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default true": "Tallenna token evästeeseen. Lukee tokenin evästeestä, kun pyyntöotsikko ei sisällä sitä, oletus true"
"Validate attachment access. Requires sign-in to access attachments, default true": "Vahvista liitteiden käyttöoikeus. Vaaditaan kirjautuminen liitteiden käyttämiseen, oletus true"
"Public attachment categories. Categories accessible without sign-in, comma-separated, such as markdown,avatar. Applies when ValidateAttachment is true": "Julkiset liiteluokat. Luokat, joihin pääsee ilman kirjautumista, pilkuin erotetut, kuten markdown,avatar. Koskee, kun ValidateAttachment on true"
"Private attachment categories. Categories only the uploader can access, comma-separated. Applies when ValidateAttachment is true": "Yksityiset liiteluokat. Luokat, joihin vain lataaja pääsee, pilkuin erotetut. Koskee, kun ValidateAttachment on true"
"SSO redirect allowlist. Domains allowed to receive the JWT after sign-in, comma-separated with wildcard prefixes such as *.company.com. Empty allows the same site only; other origins are rejected and sent back to the home page": "SSO-uudelleenohjauksen sallittu lista. Verkkotunnukset, joille JWT saa välittyä kirjautumisen jälkeen, pilkuin erotetut jokerimerkkietuliitteineen, kuten *.company.com. Tyhjä sallii vain saman sivuston; muut alkuperät hylätään ja ohjataan takaisin etusivulle"
"External authentication URL. When local authentication fails, credentials are verified by this endpoint; on success the local user is created or updated and signed in": "Ulkoisen todennuksen URL. Kun paikallinen todennus epäonnistuu, tunnistetiedot vahvistetaan tästä päätepisteestä; onnistuessa paikallinen käyttäjä luodaan tai päivitetään ja kirjataan sisään"
"Start page. First content page opened after entering the admin console": "Aloitussivu. Ensimmäinen sisältösivu, joka avataan hallintakonsoliin siirtymisen jälkeen"
"Theme. Content page theme, ACE/layui": "Teema. Sisältösivun teema, ACE/layui"
"Skin. Outer frame layout, ACE/layui": "Ulkoasu. Ulkokehyksen asettelu, ACE/layui"
"Login tip. Empty hides the tip on the sign-in page": "Kirjautumisvihje. Tyhjä piilottaa vihjeen kirjautumissivulta"
"Login logo. Empty uses the default logo": "Kirjautumislogo. Tyhjä käyttää oletuslogoa"
"Login background. Image URL; empty uses the default background": "Kirjautumistausta. Kuvan URL; tyhjä käyttää oletustaustaa"
"Form group layout. 3/2/1 columns on large/medium/small screens, form-group col-xs-12 col-sm-6 col-lg-4": "Lomakeryhmän asettelu. 3/2/1 saraketta suurilla/keskikokoisilla/pienillä näytöillä, form-group col-xs-12 col-sm-6 col-lg-4"
"Bootstrap select. Nicer drop-downs with a rendering cost": "Bootstrap select. Hienommat pudotusvalikot, mutta suuremmalla renderöintikustannuksella"
"Maximum drop-down items. Maximum options in a related drop-down on forms, default 50; larger lists fall back to a text box": "Pudotusvalikon enimmäismäärä. Lomakkeen liittyvän pudotusvalikon vaihtoehtojen enimmäismäärä, oletus 50; suuremmat luettelot korvataan tekstikentällä"
"Copyright. Empty hides the copyright; variables now/runtime/framework are supported, and now accepts formats such as {now:yyyy}": "Tekijänoikeus. Tyhjä piilottaa tekijänoikeuden; muuttujat now/runtime/framework ovat tuettuja, ja now hyväksyy muotoja kuten {now:yyyy}"
"Filing number. Empty hides the filing information": "Rekisteröintinumero. Tyhjä piilottaa rekisteröintitiedot"
"Enable new UI": "Ota uusi käyttöliittymä käyttöön"
"ECharts theme. Chart theme": "ECharts-teema. Kaavion teema"
"Title suffix. Appends the system name to page titles, default true": "Otsikon jälkiliite. Lisää järjestelmän nimen sivujen otsikoihin, oletus true"
"Table double-click. Enables row double-click on list pages, default true": "Taulukon kaksoisnapsautus. Ottaa rivien kaksoisnapsautuksen käyttöön luettelosivuilla, oletus true"
"Table style. Light: minimal thin lines; Standard: clear row lines (default); Grid: full cell borders": "Taulukon tyyli. Vaalea: ohuet viivat; Vakio: selkeät riviviivat (oletus); Ruudukko: täydet solukehykset"
"Table density. Compact: dense and information-rich (default); Normal: relaxed": "Taulukon tiheys. Tiivis: tiheä ja tietorikas (oletus); Normaali: väljä"
"Stardust web. Stardust console URL; supports direct links to /trace?id={traceId} or /graph?id={traceId}": "Stardust-web. Stardust-konsolin URL; tukee suoria linkkejä osoitteisiin /trace?id={traceId} tai /graph?id={traceId}"
"AI master switch. Enables AI features such as log analysis and notification polishing, default false": "AI-pääkytkin. Ottaa käyttöön AI-toiminnot, kuten lokianalyysin ja ilmoitusten viimeistelyn, oletus false"
"AI provider. Supports NewLife, Ollama, DeepSeek, DashScope, OpenAI and others; default NewLife": "AI-tarjoaja. Tukee NewLife-, Ollama-, DeepSeek-, DashScope-, OpenAI- ja muita tarjoajia; oletus NewLife"
"AI endpoint. Defaults to https://ai.newlifex.com for NewLife": "AI-päätepiste. Oletuksena https://ai.newlifex.com NewLifelle"
"AI ApiKey. Defaults to sk-CubeAI2026 for NewLife": "AI ApiKey. Oletuksena sk-CubeAI2026 NewLifelle"
"AI default model. Defaults to newlife-flash for NewLife": "AI-oletusmalli. Oletuksena newlife-flash NewLifelle"
"AI default deep reasoning. Enables think mode for analysis and chat by default; false means fast responses": "AI:n oletussyväpäättely. Ottaa ajattelutilan käyttöön analyysissa ja chatissa oletuksena; false tarkoittaa nopeita vastauksia"
"AI color scheme. Fills the primary and secondary colors from a preset": "AI-värimaailma. Täyttää ensisijaisen ja toissijaisen värin esiasetuksesta"
"AI primary color. Main color of the launcher, panel header and user bubbles; default NewLife green #2ecc71": "AI-ensisijainen väri. Käynnistimen, paneelin otsikon ja käyttäjäkuplien pääväri; oletus NewLife-vihreä #2ecc71"
"AI secondary color. Gradient end color, default dark green #1e8e3e": "AI-toissijainen väri. Gradientin loppuväri, oletus tummanvihreä #1e8e3e"
"OAuth server. Enables the OAuth 2.0 server that provides SSO for other applications": "OAuth-palvelin. Ottaa käyttöön OAuth 2.0 -palvelimen, joka tarjoaa SSO:n muille sovelluksille"
"File manager. Enables backend file management (browse, upload, download, delete); this carries security risks": "Tiedostohallinta. Ottaa käyttöön taustan tiedostohallinnan (selaa, lataa palvelimelle, lataa, poista); tämä sisältää turvallisuusriskejä"
"Multi-tenancy. Enables tenants; tenant mode cannot access system administration and platform mode cannot access tenant pages": "Monivuokraus. Ottaa vuokralaiset käyttöön; vuokralaistilassa ei pääse järjestelmänhallintaan, eikä alustatilassa pääse vuokralaissivuille"
"Tenant query policy. DenyWithEmpty: return an empty set without tenant context; ThrowOnMissingTenant: throw an explicit error": "Vuokralaiskyselyn käytäntö. DenyWithEmpty: palauta tyhjä joukko ilman vuokralaiskontekstia; ThrowOnMissingTenant: heitä eksplisiittinen virhe"
"User online. 0: do not record; 1: signed-in users only; 2: all visitors (default)": "Käyttäjät verkossa. 0: älä tallenna; 1: vain kirjautuneet käyttäjät; 2: kaikki vierailijat (oletus)"
"User statistics. Records user visits, default true": "Käyttäjätilastot. Tallentaa käyttäjien vierailut, oletus true"
"Enable SMS. SMS verification codes and system notifications, default false": "Ota SMS käyttöön. SMS-vahvistus"
"Enable email. Email verification codes and system notifications, default false": "Ota sähköposti käyttöön. Sähköpostivahvistuskoodit ja järjestelmäilmoitukset, oletus false"
"Require email verification. Users must activate their email before signing in and must provide one when registering, default false": "Vaadi sähköpostivahvistus. Käyttäjien on aktivoitava sähköpostinsa ennen kirjautumista ja annettava se rekisteröityessä, oletus false"
"Require mobile verification. Users must activate their mobile before signing in and must provide one when registering, default false": "Vaadi matkapuhelinvahvistus. Käyttäjien on aktivoitava matkapuhelimensa ennen kirjautumista ja annettava se rekisteröityessä, oletus false"
"Captcha scenarios. Bit mask: 0: off; 1: sign-in; 2: registration; 4: verification code requests (anti-SMS-bombing); combine with 3 for sign-in and registration. Mandatory scenarios are never exempted, default 0": "Captcha-tilanteet. Bittimaski: 0: pois; 1: kirjautuminen; 2: rekisteröityminen; 4: vahvistuskoodipyynnöt (anti-SMS-pommitus); yhdistä 3:lla kirjautuminen ja rekisteröityminen. Pakollisia tilanteita ei koskaan vapauteta, oletus 0"
"Risk-adaptive captcha. Disabled when CaptchaScene is 0; when enabled it detects unsafe environments and requires a captcha, default true": "Riskiin mukautuva captcha. Poissa käytöstä, kun CaptchaScene on 0; käytössä ollessaan se tunnistaa turvattomat ympäristöt ja vaatii captchan, oletus true"
"Captcha risk threshold. Requires a captcha when the risk score reaches this value: 0: intranet; 1: internet; 2: internet with recent failures; 3: banned. Default 2": "Captchan riskikynnys. Vaatii captchan, kun riskipisteet saavuttavat tämän arvon: 0: sisäverkko; 1: internet; 2: internet ja äskettäisiä virheitä; 3: estetty. Oletus 2"
"Trusted device lifetime. Days during which previously successful devices skip adaptive captchas, default 30": "Luotetun laitteen elinikä. Päivät, joiden ajan aiemmin onnistuneet laitteet ohittavat mukautuvat captchat, oletus 30"
"Enable MFA. Allows users to enable TOTP multi-factor authentication; an enhanced feature, default false": "Ota MFA käyttöön. Sallii käyttäjien ottaa TOTP-monivaihetodennuksen käyttöön; laajennettu ominaisuus, oletus false"
"File storage serving. Responds to file download requests from other nodes, default true": "Tiedostojen tallennuspalvelu. Vastaa muiden solmujen tiedostolatauspyyntöihin, oletus true"
"File storage fetch. Pulls new files published by other nodes, default true": "Tiedostojen nouto tallennuksesta. Hakee muiden solmujen julkaisemat uudet tiedostot, oletus true"
"File fetch timeout. Maximum milliseconds to wait for other nodes when a file is missing locally, default 5000": "Tiedoston noudon aikakatkaisu. Enimmäismillisekunnit muiden solmujen odottamiseen, kun tiedosto puuttuu paikallisesti, oletus 5000"
"Attachment storage. Local disk, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu or EasyIO; default Local": "Liitteiden tallennus. Paikallinen levy, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu tai EasyIO; oletus Local"
"Object storage server. S3-compatible endpoint for OSS/COS/Qiniu, such as oss-cn-beijing.aliyuncs.com": "Objektitallennuksen palvelin. S3-yhteensopiva päätepiste OSS/COS/Qiniulle, kuten oss-cn-beijing.aliyuncs.com"
"Object storage bucket. Bucket name for OSS/COS/Qiniu": "Objektitallennuksen ämpäri. Ämpärin nimi OSS/COS/Qiniulle"
"Object storage region. S3 signing scope, such as cn-beijing / ap-beijing / cn-east-1": "Objektitallennuksen alue. S3-allekirjoituksen laajuus, kuten cn-beijing / ap-beijing / cn-east-1"
"Object storage app ID. AccessKeyId": "Objektitallennuksen sovellustunnus. AccessKeyId"
"Object storage app secret. AccessKeySecret": "Objektitallennuksen sovellusavain. AccessKeySecret"
"Data retention. Days to keep audit and OAuth logs, default 30": "Tietojen säilytys. Päivät, joiden ajan valvonta- ja OAuth-lokit säilytetään, oletus 30"
"File retention. Days to keep backup files, default 15": "Tiedostojen säilytys. Päivät, joiden ajan varmuuskopiotiedostot säilytetään, oletus 15"
"Retention size floor. Files smaller than this (KB) are never deleted even after the retention period, default 1024K": "Säilytyksen kokoraja. Tätä pienempiä tiedostoja (KB) ei koskaan poisteta, vaikka säilytysaika olisi kulunut, oletus 1024K"
"Maximum export rows. Maximum rows a page may export, default 10_000_000": "Viennin enimmäisrivimäärä. Enimmäismäärä rivejä, joita sivu voi viedä, oletus 10_000_000"
"Maximum backup rows. Maximum rows a page may back up, default 10_000_000": "Varmuuskopioinnin enimmäisrivimäärä. Enimmäismäärä rivejä, joita sivu voi varmuuskopioida, oletus 10_000_000"
"API prefixes. Comma- or semicolon-separated prefixes such as /api,/api/v1; matching requests are forwarded to the real route without the prefix": "API-etuliitteet. Pilkuin tai puolipistein erotetut etuliitteet, kuten /api,/api/v1; vastaavat pyynnöt välitetään todelliseen reittiin ilman etuliitettä"
"Password strength. * means unrestricted; by default at least 8 characters with digits, upper/lower case letters and symbols. Simple form: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$": "Salasanan vahvuus. * tarkoittaa rajoittamatonta; oletuksena vähintään 8 merkkiä, joissa on numeroita, isoja ja pieniä kirjaimia sekä symboleja. Yksinkertainen muoto: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$"
"Cookie mode. Default SameSite mode for token cookies (-1 Unspecified, 0 None, 1 Lax, 2 Strict)": "Evästetila. Tokenievästeiden oletus-SameSite-tila (-1 Unspecified, 0 None, 1 Lax, 2 Strict)"
"Cookie domain. Writes cookies to a parent domain; empty uses the current domain. A top-level domain requires HTTPS and prevents plain HTTP from writing same-name keys on the local domain": "Evästeverkkotunnus. Kirjoittaa evästeet yläverkkotunnukseen; tyhjä käyttää nykyistä verkkotunnusta. Ylätason verkkotunnus vaatii HTTPS:n ja estää pelkkää HTTP:tä kirjoittamasta samannimisiä avaimia paikalliseen verkkotunnukseen"
"Activation URL. Front-end activation page URL used in email activation links, such as https://xxx/activate; empty builds /activate from the request host": "Aktivointi-URL. Sähköpostin aktivointilinkeissä käytettävä frontend-aktivointisivun URL, kuten https://xxx/activate; tyhjä muodostaa /activate-pyyntöisännästä"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default false": "Tallenna token evästeeseen. Lukee tokenin evästeestä, kun pyyntöotsikko ei sisällä sitä, oletus false"
"Password strength. * means unrestricted; the simple form defaults to 5 to 32 characters of any type. The full form requires at least 8 characters with digits, upper/lower case letters and symbols: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$": "Salasanan vahvuus. * tarkoittaa rajoittamatonta; yksinkertaisen muodon oletus on 5–32 merkkiä mitä tahansa tyyppiä. Täysi muoto vaatii vähintään 8 merkkiä, joissa on numeroita, isoja ja pieniä kirjaimia sekä symboleja: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$"
