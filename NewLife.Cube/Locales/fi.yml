"View resolution diagnostics": "Näytä näkymien ratkaisudiagnostiikka"
"Export to Csv with Chinese headers and extended fields, for viewing in Excel": "Vie Csv-tiedostoon kiinalaisilla otsikoilla ja laajennetuilla kentillä Excelissä katselua varten"
"Export to Csv with English headers, for data transfer": "Vie Csv-tiedostoon englanninkielisillä otsikoilla tietojen siirtoa varten"
"Import data from an Excel/Csv/Json/Zip file": "Tuo tiedot Excel/Csv/Json/Zip-tiedostosta"
"Share the current page data with others": "Jaa nykyisen sivun tiedot muiden kanssa"
"Clear data and sync from the primary server": "Tyhjennä tiedot ja synkronoi ensisijaiselta palvelimelta"
