"5. When the user asks to read or operate page elements, you may call run_js; explain any write operation (changing page content, submitting forms) to the user before running it": "5. Kun käyttäjä pyytää lukemaan tai käyttämään sivun elementtejä, voit kutsua run_js; selitä käyttäjälle kaikki kirjoitustoiminnot (sivun sisällön muuttaminen, lomakkeiden lähettäminen) ennen suorittamista"
"6. Never invent data; ask the user for clarification when information is insufficient": "6. Älä koskaan keksi tietoja; kysy käyttäjältä tarkennusta, kun tiedot ovat puutteellisia"
