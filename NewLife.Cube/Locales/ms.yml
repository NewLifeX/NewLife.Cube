# 设置页字段、分类与导航（中文源文经英文规范键翻译）
"Auto (follow system)": "Auto (ikut sistem)"
"Cancel": "Batal"
"Queries {0}, executes {1}, elapsed {2:n0} ms": "Pertanyaan {0}, pelaksanaan {1}, masa {2:n0} ms"
"Show run time": "Tunjukkan masa larian"
"Avatar directory. Downloads remote avatars locally; defaults to the Avatars subdirectory, or Avatars next to the web root. Empty disables downloading": "Direktori avatar. Memuat turun avatar jauh ke setempat; lalai kepada subdirektori Avatars, atau Avatars di sebelah akar web. Kosong melumpuhkan muat turun"
"Text avatar characters. Generates an SVG text avatar when no image exists; 1 to 3 characters. Uses the first N Chinese characters to keep the surname, or the initials of English words. Default 2": "Bilangan aksara avatar teks. Menjana avatar teks SVG apabila tiada imej; 1 hingga 3 aksara. Menggunakan N aksara Cina pertama untuk mengekalkan nama keluarga, atau huruf awal perkataan Inggeris. Lalai 2"
"Upload directory. Defaults to Uploads": "Direktori muat naik. Lalai Uploads"
"Web root directory. Defaults to wwwroot": "Direktori akar web. Lalai wwwroot"
"Resource URL. CDN base such as https://sso.newlifex.com/content/; empty uses local resources": "URL sumber. Asas CDN seperti https://sso.newlifex.com/content/; kosong menggunakan sumber setempat"
"CORS origins. Other origins allowed to access this site; * allows any origin": "Asalan CORS. Asalan lain yang dibenarkan mengakses tapak ini; * membenarkan semua asalan"
"Iframe embedding. Empty allows the same domain only; SAMEORIGIN allows the same domain and port; ALLOWALL allows any domain": "Pembenaman iframe. Kosong hanya membenarkan domain yang sama; SAMEORIGIN membenarkan domain dan port yang sama; ALLOWALL membenarkan semua domain"
"Share expiration. Lifetime of share tokens in seconds, default 7200": "Tamat tempoh perkongsian. Jangka hayat token perkongsian dalam saat, lalai 7200"
"Bot error code. Returns this error for crawlers, such as 404/500; 0 disables blocking": "Kod ralat bot. Mengembalikan ralat ini kepada perangkak, seperti 404/500; 0 melumpuhkan penyekatan"
"Force redirect. Target scheme and host for GET requests; * is supported in the host. Commonly used to force HTTPS, such as https://*:8081": "Ubah hala paksa. Skema dan hos sasaran untuk permintaan GET; * disokong dalam hos. Biasanya digunakan untuk memaksa HTTPS, seperti https://*:8081"
"Security mode. 0: off; 1: observe and log only; 2: block; 3: automatic (default; observes, bans repeated attackers, and temporarily blocks broad attacks with automatic rollback)": "Mod keselamatan. 0: mati; 1: perhati dan catat sahaja; 2: sekat; 3: automatik (lalai; memerhati, melarang penyerang berulang, dan menyekat sementara serangan meluas dengan pembatalan automatik)"
"Auto-ban durations. Comma-separated seconds that increase with each trigger; empty uses 60,300,1800,7200,86400": "Tempoh larangan automatik. Nilai saat dipisahkan koma yang meningkat setiap pencetus; kosong menggunakan 60,300,1800,7200,86400"
"Trusted proxies. Forwarded headers are only trusted from these comma-separated IPs or CIDR ranges; empty keeps the legacy behavior of trusting all forwarded headers": "Proksi dipercayai. Pengepala yang diteruskan hanya dipercayai daripada IP atau julat CIDR yang dipisahkan koma ini; kosong mengekalkan tingkah laku lama yang mempercayai semua pengepala yang diteruskan"
"Trusted proxy learning limit. When no trusted proxies are configured, private direct sources that send forwarded headers are learned up to this count; 0 disables learning (typically 2 for one data center, 4 for two)": "Had pembelajaran proksi dipercayai. Apabila tiada proksi dipercayai dikonfigurasikan, sumber langsung peribadi yang menghantar pengepala diteruskan dipelajari sehingga bilangan ini; 0 melumpuhkan pembelajaran (biasanya 2 untuk satu pusat data, 4 untuk dua)"
"Learned proxies. Maintained automatically; clear it to reset the learned list": "Proksi yang dipelajari. Diselenggara secara automatik; kosongkannya untuk menetapkan semula senarai yang dipelajari"
"Default role. Defaults to the Normal User role": "Peranan lalai. Lalai kepada peranan Pengguna Biasa"
"Allow password sign-in. Allows signing in with a username and password": "Benarkan log masuk kata laluan. Membenarkan log masuk dengan nama pengguna dan kata laluan"
"Allow plain-text passwords. Default true for legacy clients; false forces Challenge-Response encrypted passwords": "Benarkan kata laluan teks biasa. Lalai true untuk klien lama; false memaksa kata laluan disulitkan Challenge-Response"
"Allow registration. Allows registering with a username and password": "Benarkan pendaftaran. Membenarkan pendaftaran dengan nama pengguna dan kata laluan"
"Auto registration. Default true; after SSO sign-in an unknown local user is registered automatically. Enabled when either the global or the OAuth app setting is on": "Pendaftaran automatik. Lalai true; selepas log masuk SSO, pengguna setempat yang tidak dikenali didaftarkan secara automatik. Didayakan apabila tetapan global atau tetapan aplikasi OAuth dihidupkan"
"Password complexity check. When enabled the sign-in page validates password strength; when disabled it only requires a non-empty password. Default true": "Semakan kerumitan kata laluan. Apabila didayakan, halaman log masuk mengesahkan kekuatan kata laluan; apabila dinyahdayakan, hanya memerlukan kata laluan tidak kosong. Lalai true"
"Login failure limit. Bans sign-in after this many consecutive failures for the same user or IP, default 5": "Had kegagalan log masuk. Melarang log masuk selepas sekian kegagalan berturut-turut untuk pengguna atau IP yang sama, lalai 5"
"Login ban duration. Seconds a risk-control ban lasts, default 300": "Tempoh larangan log masuk. Berapa saat larangan kawalan risiko berlangsung, lalai 300"
"Class C subnet ban threshold. Bans a /24 subnet such as 103.125.146.* after this many failures, default 10; 0 disables": "Ambang larangan subrangkaian kelas C. Melarang subrangkaian /24 seperti 103.125.146.* selepas sekian kegagalan, lalai 10; 0 melumpuhkan"
"Class B subnet ban threshold. Bans a /16 subnet such as 103.125.*.* after this many failures, default 20; 0 disables": "Ambang larangan subrangkaian kelas B. Melarang subrangkaian /16 seperti 103.125.*.* selepas sekian kegagalan, lalai 20; 0 melumpuhkan"
"Force bind by user name. Binds SSO users to local users with the same name without a provider prefix; intended for user centers": "Paksa ikat mengikut nama pengguna. Mengikat pengguna SSO kepada pengguna setempat dengan nama yang sama tanpa awalan penyedia; untuk pusat pengguna"
"Bind by user code. Binds SSO users to local users by user code": "Ikat mengikut kod pengguna. Mengikat pengguna SSO kepada pengguna setempat mengikut kod pengguna"
"Bind by mobile. Binds SSO users to local users by mobile number": "Ikat mengikut telefon. Mengikat pengguna SSO kepada pengguna setempat mengikut nombor telefon"
"Bind by email. Binds SSO users to local users by email": "Ikat mengikut e-mel. Mengikat pengguna SSO kepada pengguna setempat mengikut e-mel"
"Bind by nickname. Binds SSO users to local users by nickname; suitable for internal SSO, not for social networks with many duplicate names": "Ikat mengikut nama panggilan. Mengikat pengguna SSO kepada pengguna setempat mengikut nama panggilan; sesuai untuk SSO dalaman, bukan untuk rangkaian sosial yang banyak nama bertindih"
"Use SSO roles. Keeps SSO roles after sign-in, default true; otherwise DefaultRole is used": "Guna peranan SSO. Mengekalkan peranan SSO selepas log masuk, lalai true; jika tidak, DefaultRole digunakan"
"Use SSO departments. Keeps SSO departments after sign-in, default true": "Guna jabatan SSO. Mengekalkan jabatan SSO selepas log masuk, lalai true"
"SSO role rules. Automatically upgrades the primary role after SSO sign-in; separate rules with commas. Format: source role+department wildcard=target role, for example Guest+Route*=Route Specialist": "Peraturan peranan SSO. Menaik taraf peranan utama secara automatik selepas log masuk SSO; pisahkan peraturan dengan koma. Format: peranan sumber+wildcard jabatan=peranan sasaran, contohnya Guest+Route*=Route Specialist"
"Sign out everywhere. false signs out of this site only; true (default) also signs out of the SSO server": "Log keluar di semua tempat. false hanya log keluar daripada tapak ini; true (lalai) juga log keluar daripada pelayan SSO"
"Allow multi-device sign-in. false kicks old devices on a new sign-in and revokes all tokens on sign-out; true (default) revokes only the current session": "Benarkan log masuk berbilang peranti. false mengeluarkan peranti lama semasa log masuk baharu dan membatalkan semua token semasa log keluar; true (lalai) hanya membatalkan sesi semasa"
"Session timeout. Session lifetime after SSO sign-in during which the cookie can sign in again; default 0s": "Tamat masa sesi. Jangka hayat sesi selepas log masuk SSO yang membolehkan cookie log masuk semula; lalai 0 saat"
"Token sliding refresh threshold. Refreshes the JWT and rewrites the cookie when its remaining lifetime falls below this many seconds; 0 disables sliding expiration": "Ambang muat semula gelangsar token. Memuat semula JWT dan menulis semula cookie apabila baki jangka hayat di bawah sekian saat; 0 melumpuhkan tamat tempoh gelangsar"
"User refresh period. Fetches user information once per period across SSO sign-ins, default 600 seconds": "Tempoh muat semula pengguna. Mengambil maklumat pengguna sekali setiap tempoh merentas log masuk SSO, lalai 600 saat"
"JWT secret. Algorithm and key used to sign JWTs, such as HS256:ABCD1234": "Rahsia JWT. Algoritma dan kunci yang digunakan untuk menandatangani JWT, seperti HS256:ABCD1234"
"Token lifetime. Lifetime of the access token in seconds, default 7200": "Jangka hayat token. Jangka hayat token akses dalam saat, lalai 7200"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default true": "Simpan token dalam cookie. Membaca token daripada cookie apabila pengepala permintaan tidak membawanya, lalai true"
"Validate attachment access. Requires sign-in to access attachments, default true": "Sahkan akses lampiran. Memerlukan log masuk untuk mengakses lampiran, lalai true"
"Public attachment categories. Categories accessible without sign-in, comma-separated, such as markdown,avatar. Applies when ValidateAttachment is true": "Kategori lampiran awam. Kategori yang boleh diakses tanpa log masuk, dipisahkan koma, seperti markdown,avatar. Terpakai apabila ValidateAttachment bernilai true"
"Private attachment categories. Categories only the uploader can access, comma-separated. Applies when ValidateAttachment is true": "Kategori lampiran peribadi. Kategori yang hanya boleh diakses oleh pemuat naik, dipisahkan koma. Terpakai apabila ValidateAttachment bernilai true"
"SSO redirect allowlist. Domains allowed to receive the JWT after sign-in, comma-separated with wildcard prefixes such as *.company.com. Empty allows the same site only; other origins are rejected and sent back to the home page": "Senarai benaran ubah hala SSO. Domain yang dibenarkan menerima JWT selepas log masuk, dipisahkan koma dengan awalan wildcard seperti *.company.com. Kosong hanya membenarkan tapak yang sama; asalan lain ditolak dan dihantar kembali ke halaman utama"
"External authentication URL. When local authentication fails, credentials are verified by this endpoint; on success the local user is created or updated and signed in": "URL pengesahan luaran. Apabila pengesahan setempat gagal, kelayakan disahkan oleh titik akhir ini; jika berjaya, pengguna setempat dicipta atau dikemas kini lalu log masuk"
"Start page. First content page opened after entering the admin console": "Halaman mula. Halaman kandungan pertama yang dibuka selepas memasuki konsol pentadbir"
"Theme. Content page theme, ACE/layui": "Tema. Tema halaman kandungan, ACE/layui"
"Skin. Outer frame layout, ACE/layui": "Kulit. Susun atur bingkai luar, ACE/layui"
"Login tip. Empty hides the tip on the sign-in page": "Petua log masuk. Kosong menyembunyikan petua pada halaman log masuk"
"Login logo. Empty uses the default logo": "Logo log masuk. Kosong menggunakan logo lalai"
"Login background. Image URL; empty uses the default background": "Latar belakang log masuk. URL imej; kosong menggunakan latar belakang lalai"
"Form group layout. 3/2/1 columns on large/medium/small screens, form-group col-xs-12 col-sm-6 col-lg-4": "Susun atur kumpulan borang. 3/2/1 lajur pada skrin besar/sederhana/kecil, form-group col-xs-12 col-sm-6 col-lg-4"
"Bootstrap select. Nicer drop-downs with a rendering cost": "Bootstrap select. Menu lungsur lebih menarik tetapi ada kos pemaparan"
"Maximum drop-down items. Maximum options in a related drop-down on forms, default 50; larger lists fall back to a text box": "Item menu lungsur maksimum. Pilihan maksimum dalam menu lungsur berkaitan pada borang, lalai 50; senarai lebih besar bertukar kepada kotak teks"
"Copyright. Empty hides the copyright; variables now/runtime/framework are supported, and now accepts formats such as {now:yyyy}": "Hak cipta. Kosong menyembunyikan hak cipta; pemboleh ubah now/runtime/framework disokong, dan now menerima format seperti {now:yyyy}"
"Filing number. Empty hides the filing information": "Nombor pendaftaran. Kosong menyembunyikan maklumat pendaftaran"
"Enable new UI": "Dayakan UI baharu"
"ECharts theme. Chart theme": "Tema ECharts. Tema carta"
"Title suffix. Appends the system name to page titles, default true": "Akhiran tajuk. Menambahkan nama sistem pada tajuk halaman, lalai true"
"Table double-click. Enables row double-click on list pages, default true": "Klik dua kali jadual. Mendayakan klik dua kali baris pada halaman senarai, lalai true"
"Table style. Light: minimal thin lines; Standard: clear row lines (default); Grid: full cell borders": "Gaya jadual. Ringan: garisan nipis minimum; Standard: garisan baris yang jelas (lalai); Grid: sempadan sel penuh"
"Table density. Compact: dense and information-rich (default); Normal: relaxed": "Ketumpatan jadual. Padat: rapat dan kaya maklumat (lalai); Normal: longgar"
"Stardust web. Stardust console URL; supports direct links to /trace?id={traceId} or /graph?id={traceId}": "Web Stardust. URL konsol Stardust; menyokong pautan terus ke /trace?id={traceId} atau /graph?id={traceId}"
"AI master switch. Enables AI features such as log analysis and notification polishing, default false": "Suis induk AI. Mendayakan ciri AI seperti analisis log dan penghalusan pemberitahuan, lalai false"
"AI provider. Supports NewLife, Ollama, DeepSeek, DashScope, OpenAI and others; default NewLife": "Penyedia AI. Menyokong NewLife, Ollama, DeepSeek, DashScope, OpenAI dan lain-lain; lalai NewLife"
"AI endpoint. Defaults to https://ai.newlifex.com for NewLife": "Titik akhir AI. Lalai https://ai.newlifex.com untuk NewLife"
"AI ApiKey. Defaults to sk-CubeAI2026 for NewLife": "ApiKey AI. Lalai sk-CubeAI2026 untuk NewLife"
"AI default model. Defaults to newlife-flash for NewLife": "Model lalai AI. Lalai newlife-flash untuk NewLife"
"AI default deep reasoning. Enables think mode for analysis and chat by default; false means fast responses": "Penaakulan mendalam lalai AI. Mendayakan mod berfikir untuk analisis dan perbualan secara lalai; false bermaksud respons pantas"
"AI color scheme. Fills the primary and secondary colors from a preset": "Skema warna AI. Mengisi warna primer dan sekunder daripada pratetap"
"AI primary color. Main color of the launcher, panel header and user bubbles; default NewLife green #2ecc71": "Warna primer AI. Warna utama pelancar, pengepala panel dan gelembung pengguna; lalai hijau NewLife #2ecc71"
"AI secondary color. Gradient end color, default dark green #1e8e3e": "Warna sekunder AI. Warna hujung gradien, lalai hijau gelap #1e8e3e"
"OAuth server. Enables the OAuth 2.0 server that provides SSO for other applications": "Pelayan OAuth. Mendayakan pelayan OAuth 2.0 yang menyediakan SSO untuk aplikasi lain"
"File manager. Enables backend file management (browse, upload, download, delete); this carries security risks": "Pengurus fail. Mendayakan pengurusan fail back end (lalu, muat naik, muat turun, padam); ini membawa risiko keselamatan"
"Multi-tenancy. Enables tenants; tenant mode cannot access system administration and platform mode cannot access tenant pages": "Berbilang penyewa. Mendayakan penyewa; mod penyewa tidak boleh mengakses pentadbiran sistem dan mod platform tidak boleh mengakses halaman penyewa"
"Tenant query policy. DenyWithEmpty: return an empty set without tenant context; ThrowOnMissingTenant: throw an explicit error": "Dasar pertanyaan penyewa. DenyWithEmpty: mengembalikan set kosong tanpa konteks penyewa; ThrowOnMissingTenant: melontar ralat eksplisit"
"User online. 0: do not record; 1: signed-in users only; 2: all visitors (default)": "Pengguna dalam talian. 0: jangan rekod; 1: pengguna log masuk sahaja; 2: semua pelawat (lalai)"
"User statistics. Records user visits, default true": "Statistik pengguna. Merekod lawatan pengguna, lalai true"
"Enable SMS. SMS verification codes and system notifications, default false": "Dayakan SMS. Kod pengesahan SMS dan pemberitahuan sistem, lalai false"
"Enable email. Email verification codes and system notifications, default false": "Dayakan e-mel. Kod pengesahan e-mel dan pemberitahuan sistem, lalai false"
"Require email verification. Users must activate their email before signing in and must provide one when registering, default false": "Wajib pengesahan e-mel. Pengguna mesti mengaktifkan e-mel sebelum log masuk dan mesti memberikannya semasa mendaftar, lalai false"
"Require mobile verification. Users must activate their mobile before signing in and must provide one when registering, default false": "Wajib pengesahan telefon. Pengguna mesti mengaktifkan telefon sebelum log masuk dan mesti memberikannya semasa mendaftar, lalai false"
"Captcha scenarios. Bit mask: 0: off; 1: sign-in; 2: registration; 4: verification code requests (anti-SMS-bombing); combine with 3 for sign-in and registration. Mandatory scenarios are never exempted, default 0": "Senario captcha. Bit mask: 0: mati; 1: log masuk; 2: pendaftaran; 4: permintaan kod pengesahan (anti-SMS-bombing); gabungkan dengan 3 untuk log masuk dan pendaftaran. Senario wajib tidak pernah dikecualikan, lalai 0"
"Risk-adaptive captcha. Disabled when CaptchaScene is 0; when enabled it detects unsafe environments and requires a captcha, default true": "Captcha adaptif risiko. Dilumpuhkan apabila CaptchaScene bernilai 0; apabila didayakan, mengesan persekitaran tidak selamat dan mewajibkan captcha, lalai true"
"Captcha risk threshold. Requires a captcha when the risk score reaches this value: 0: intranet; 1: internet; 2: internet with recent failures; 3: banned. Default 2": "Ambang risiko captcha. Mewajibkan captcha apabila skor risiko mencapai nilai ini: 0: intranet; 1: internet; 2: internet dengan kegagalan terkini; 3: dilarang. Lalai 2"
"Trusted device lifetime. Days during which previously successful devices skip adaptive captchas, default 30": "Jangka hayat peranti dipercayai. Hari peranti yang pernah berjaya melangkau captcha adaptif, lalai 30"
"Enable MFA. Allows users to enable TOTP multi-factor authentication; an enhanced feature, default false": "Dayakan MFA. Membenarkan pengguna mendayakan pengesahan berbilang faktor TOTP; ciri lanjutan, lalai false"
"File storage serving. Responds to file download requests from other nodes, default true": "Penyajian storan fail. Menjawab permintaan muat turun fail daripada nod lain, lalai true"
"File storage fetch. Pulls new files published by other nodes, default true": "Pengambilan storan fail. Menarik fail baharu yang diterbitkan nod lain, lalai true"
"File fetch timeout. Maximum milliseconds to wait for other nodes when a file is missing locally, default 5000": "Tamat masa pengambilan fail. Milisaat maksimum menunggu nod lain apabila fail tiada secara setempat, lalai 5000"
"Attachment storage. Local disk, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu or EasyIO; default Local": "Storan lampiran. Cakera setempat, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu atau EasyIO; lalai Local"
"Object storage server. S3-compatible endpoint for OSS/COS/Qiniu, such as oss-cn-beijing.aliyuncs.com": "Pelayan storan objek. Titik akhir serasi S3 untuk OSS/COS/Qiniu, seperti oss-cn-beijing.aliyuncs.com"
"Object storage bucket. Bucket name for OSS/COS/Qiniu": "Baldi storan objek. Nama baldi untuk OSS/COS/Qiniu"
"Object storage region. S3 signing scope, such as cn-beijing / ap-beijing / cn-east-1": "Rantau storan objek. Skop tandatangan S3, seperti cn-beijing / ap-beijing / cn-east-1"
"Object storage app ID. AccessKeyId": "ID aplikasi storan objek. AccessKeyId"
"Object storage app secret. AccessKeySecret": "Rahsia aplikasi storan objek. AccessKeySecret"
"Data retention. Days to keep audit and OAuth logs, default 30": "Pengekalan data. Hari untuk menyimpan log audit dan OAuth, lalai 30"
"File retention. Days to keep backup files, default 15": "Pengekalan fail. Hari untuk menyimpan fail sandaran, lalai 15"
"Retention size floor. Files smaller than this (KB) are never deleted even after the retention period, default 1024K": "Had bawah saiz pengekalan. Fail yang lebih kecil daripada ini (KB) tidak pernah dipadam walaupun selepas tempoh pengekalan, lalai 1024K"
"Maximum export rows. Maximum rows a page may export, default 10_000_000": "Baris eksport maksimum. Baris maksimum yang boleh dieksport oleh satu halaman, lalai 10_000_000"
"Maximum backup rows. Maximum rows a page may back up, default 10_000_000": "Baris sandaran maksimum. Baris maksimum yang boleh disandarkan oleh satu halaman, lalai 10_000_000"
"API prefixes. Comma- or semicolon-separated prefixes such as /api,/api/v1; matching requests are forwarded to the real route without the prefix": "Awalan API. Awalan dipisahkan koma atau titik bertindih seperti /api,/api/v1; permintaan yang sepadan diteruskan ke laluan sebenar tanpa awalan"
"Password strength. * means unrestricted; by default at least 8 characters with digits, upper/lower case letters and symbols. Simple form: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$": "Kekuatan kata laluan. * bermaksud tanpa had; secara lalai sekurang-kurangnya 8 aksara dengan digit, huruf besar/kecil dan simbol. Bentuk ringkas: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$"
"Cookie mode. Default SameSite mode for token cookies (-1 Unspecified, 0 None, 1 Lax, 2 Strict)": "Mod cookie. Mod SameSite lalai untuk cookie token (-1 Unspecified, 0 None, 1 Lax, 2 Strict)"
"Cookie domain. Writes cookies to a parent domain; empty uses the current domain. A top-level domain requires HTTPS and prevents plain HTTP from writing same-name keys on the local domain": "Domain cookie. Menulis cookie ke domain induk; kosong menggunakan domain semasa. Domain peringkat atas memerlukan HTTPS dan menghalang HTTP biasa daripada menulis kunci bernama sama pada domain setempat"
"Activation URL. Front-end activation page URL used in email activation links, such as https://xxx/activate; empty builds /activate from the request host": "URL pengaktifan. URL halaman pengaktifan bahagian hadapan yang digunakan dalam pautan pengaktifan e-mel, seperti https://xxx/activate; kosong membina /activate daripada hos permintaan"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default false": "Simpan token dalam cookie. Membaca token daripada cookie apabila pengepala permintaan tidak membawanya, lalai false"
"Password strength. * means unrestricted; the simple form defaults to 5 to 32 characters of any type. The full form requires at least 8 characters with digits, upper/lower case letters and symbols: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$": "Kekuatan kata laluan. * bermaksud tanpa had; bentuk ringkas lalai 5 hingga 32 aksara apa-apa jenis. Bentuk penuh memerlukan sekurang-kurangnya 8 aksara dengan digit, huruf besar/kecil dan simbol: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$"
