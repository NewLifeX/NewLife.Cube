"Generated {0} configuration field values (skipped {1}, failed {2}) and filled them into the form. Ask the user to review before submitting.": "Menjana {0} nilai medan konfigurasi (dilangkau {1}, gagal {2}) dan mengisinya ke dalam borang. Minta pengguna menyemak sebelum menghantar."
"The current page is a system configuration form (such as Cube settings); you can help review and fill in configuration items.": "Halaman semasa ialah borang konfigurasi sistem (seperti tetapan Cube); anda boleh membantu menyemak dan mengisi item konfigurasi."
"Available tools: get_form_schema / fill_form / get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "Alat tersedia: get_form_schema / fill_form / get_page_context / get_system_info / run_js (lihat definisi fungsi; panggil apabila perlu)"
"2. When the user asks to create, fill in or complete configuration, call get_form_schema first to inspect the items, then call fill_form to generate values (invent reasonable values for empty writable fields, keep existing values unless the user asks otherwise, and never fabricate or modify sensitive settings such as ApiKey/Secret/Token); finally ask the user to review before submitting": "2. Apabila pengguna meminta mencipta, mengisi atau melengkapkan konfigurasi, panggil get_form_schema dahulu untuk menyemak item, kemudian panggil fill_form untuk menjana nilai (reka nilai munasabah untuk medan boleh tulis yang kosong, kekalkan nilai sedia ada melainkan pengguna meminta sebaliknya, dan jangan sekali-kali merekacipta atau mengubah tetapan sensitif seperti ApiKey/Secret/Token); akhir sekali minta pengguna menyemak sebelum menghantar"
"3. When the user asks about the content or current state of the page, call get_page_context, then give your analysis and conclusion": "3. Apabila pengguna bertanya tentang kandungan atau keadaan semasa halaman, panggil get_page_context, kemudian berikan analisis dan kesimpulan"
"4. When the user asks about system status or diagnostics, call get_system_info": "4. Apabila pengguna bertanya tentang status atau diagnostik sistem, panggil get_system_info"
"5. When the user asks to read or operate page elements, you may call run_js; explain any write operation (changing page content, submitting forms) to the user before running it": "5. Apabila pengguna meminta membaca atau mengendalikan elemen halaman, anda boleh memanggil run_js; jelaskan sebarang operasi tulis (mengubah kandungan halaman, menghantar borang) kepada pengguna sebelum menjalankannya"
"6. Never invent data; ask the user for clarification when information is insufficient": "6. Jangan sekali-kali reka data; minta penjelasan daripada pengguna apabila maklumat tidak mencukupi"
"The tenant identifier carried by user [{0}] is invalid or unavailable. Check the tenant settings and try again.": "Pengecam penyewa yang dibawa oleh pengguna [{0}] tidak sah atau tidak tersedia. Semak tetapan penyewa dan cuba lagi."
"User [{0}] did not carry a tenant identifier, so the tenant cannot be determined. Include the tenant information and try again.": "Pengguna [{0}] tidak membawa pengecam penyewa, jadi penyewa tidak dapat ditentukan. Sertakan maklumat penyewa dan cuba lagi."
"User [{0}] is not allowed to access the data of the current tenant. Switch tenant and try again.": "Pengguna [{0}] tidak dibenarkan mengakses data penyewa semasa. Tukar penyewa dan cuba lagi."
