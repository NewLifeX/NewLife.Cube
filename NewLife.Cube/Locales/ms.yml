"There are {0} users online, exceeding the {1}-day record of {2} (threshold {3:0}). This may be a campaign, a crawler scan or abnormal traffic; check the online list and sign-in log.": "Terdapat {0} pengguna dalam talian, melebihi rekod {1} hari sebanyak {2} (ambang {3:0}). Ini mungkin kempen, imbasan perangkak atau trafik tidak normal; semak senarai dalam talian dan log masuk."
