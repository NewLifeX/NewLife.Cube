"Generated {0} form field values (skipped {1}, failed {2}) and filled them into the form. Ask the user to review before submitting.": "Menjana {0} nilai medan borang (dilangkau {1}, gagal {2}) dan mengisinya ke dalam borang. Minta pengguna menyemak sebelum menghantar."
