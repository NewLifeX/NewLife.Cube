"Generated {0} configuration field values (skipped {1}, failed {2}) and filled them into the form. Ask the user to review before submitting.": "Menghasilkan {0} nilai bidang konfigurasi (dilewati {1}, gagal {2}) dan mengisinya ke formulir. Minta pengguna meninjau sebelum mengirim."
"The current page is a system configuration form (such as Cube settings); you can help review and fill in configuration items.": "Halaman saat ini adalah formulir konfigurasi sistem (seperti pengaturan Cube); Anda dapat membantu meninjau dan mengisi item konfigurasi."
"Available tools: get_form_schema / fill_form / get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "Alat yang tersedia: get_form_schema / fill_form / get_page_context / get_system_info / run_js (lihat definisi fungsi; panggil saat diperlukan)"
"2. When the user asks to create, fill in or complete configuration, call get_form_schema first to inspect the items, then call fill_form to generate values (invent reasonable values for empty writable fields, keep existing values unless the user asks otherwise, and never fabricate or modify sensitive settings such as ApiKey/Secret/Token); finally ask the user to review before submitting": "2. Saat pengguna meminta membuat, mengisi, atau melengkapi konfigurasi, panggil get_form_schema terlebih dahulu untuk memeriksa item, lalu panggil fill_form untuk menghasilkan nilai (buat nilai wajar untuk bidang kosong yang dapat ditulis, pertahankan nilai yang ada kecuali pengguna meminta sebaliknya, dan jangan pernah mengarang atau mengubah pengaturan sensitif seperti ApiKey/Secret/Token); terakhir minta pengguna meninjau sebelum mengirim"
"3. When the user asks about the content or current state of the page, call get_page_context, then give your analysis and conclusion": "3. Saat pengguna menanyakan konten atau keadaan halaman saat ini, panggil get_page_context, lalu berikan analisis dan kesimpulan"
"4. When the user asks about system status or diagnostics, call get_system_info": "4. Saat pengguna menanyakan status atau diagnostik sistem, panggil get_system_info"
"5. When the user asks to read or operate page elements, you may call run_js; explain any write operation (changing page content, submitting forms) to the user before running it": "5. Saat pengguna meminta membaca atau mengoperasikan elemen halaman, Anda dapat memanggil run_js; jelaskan setiap operasi tulis (mengubah konten halaman, mengirim formulir) kepada pengguna sebelum menjalankannya"
"6. Never invent data; ask the user for clarification when information is insufficient": "6. Jangan pernah mengarang data; minta klarifikasi kepada pengguna bila informasi kurang"
"The tenant identifier carried by user [{0}] is invalid or unavailable. Check the tenant settings and try again.": "Pengenal penyewa yang dibawa pengguna [{0}] tidak valid atau tidak tersedia. Periksa pengaturan penyewa dan coba lagi."
"User [{0}] did not carry a tenant identifier, so the tenant cannot be determined. Include the tenant information and try again.": "Pengguna [{0}] tidak membawa pengenal penyewa, sehingga penyewa tidak dapat ditentukan. Sertakan informasi penyewa dan coba lagi."
"User [{0}] is not allowed to access the data of the current tenant. Switch tenant and try again.": "Pengguna [{0}] tidak diizinkan mengakses data penyewa saat ini. Ganti penyewa dan coba lagi."
