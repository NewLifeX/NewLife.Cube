"Generated {0} form field values (skipped {1}, failed {2}) and filled them into the form. Ask the user to review before submitting.": "Menghasilkan {0} nilai bidang formulir (dilewati {1}, gagal {2}) dan mengisinya ke formulir. Minta pengguna meninjau sebelum mengirim."
