"Data:": "Data:"
"You are a system operations expert. Based on the following runtime metrics, produce a health diagnosis report:\nCover bottlenecks, whether capacity should be expanded, and any risks worth attention.\nOutput the diagnosis report directly without extra explanation.": "Anda adalah ahli operasi sistem. Berdasarkan metrik runtime berikut, buat laporan diagnosis kesehatan:\nCakup hambatan, apakah kapasitas perlu diperluas, dan risiko yang perlu diperhatikan.\nKeluarkan laporan diagnosis secara langsung tanpa penjelasan tambahan."
"Script must not be empty": "Skrip tidak boleh kosong"
"Browser channel is not ready (Writer not injected)": "Kanal peramban belum siap (Writer belum disuntikkan)"
"Run page script": "Jalankan skrip halaman"
"Runs JavaScript in the current page and returns the result; can read or modify page elements, for example document.title or document.querySelector('input[name=Name]').value": "Menjalankan JavaScript di halaman saat ini dan mengembalikan hasilnya; dapat membaca atau mengubah elemen halaman, misalnya document.title atau document.querySelector('input[name=Name]').value"
"JavaScript code to run in the current page": "Kode JavaScript untuk dijalankan di halaman saat ini"
"Get page context": "Dapatkan konteks halaman"
"Gets the main data and structure of the current page (title, tables, forms and so on). Uses the server-side context when the page provides one; otherwise collects the page content from the user's browser": "Mendapatkan data dan struktur utama halaman saat ini (judul, tabel, formulir, dan sebagainya). Menggunakan konteks sisi server bila halaman menyediakannya; jika tidak, mengumpulkan konten halaman dari peramban pengguna"
"Get form schema": "Dapatkan skema formulir"
"Gets the schema of the current form, including field names, types, descriptions and current values, for generating form values": "Mendapatkan skema formulir saat ini, termasuk nama bidang, tipe, deskripsi, dan nilai saat ini, untuk menghasilkan nilai formulir"
