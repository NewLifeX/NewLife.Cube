"There are {0} users online, exceeding the {1}-day record of {2} (threshold {3:0}). This may be a campaign, a crawler scan or abnormal traffic; check the online list and sign-in log.": "Ada {0} pengguna online, melebihi rekor {1} hari sebesar {2} (ambang {3:0}). Ini bisa berupa kampanye, pemindaian perayap, atau lalu lintas tidak normal; periksa daftar online dan log masuk."
"Record of the last {0} days: {1}": "Rekor {0} hari terakhir: {1}"
"Cube admin console": "Konsol admin Cube"
"You are the AI assistant of {0}, helping an administrator work on the current page.": "Anda adalah asisten AI {0}, membantu administrator bekerja pada halaman saat ini."
"The current page is not an entity data page (it may be system settings, the home page or system information), so there is no entity table context.": "Halaman saat ini bukan halaman data entitas (mungkin pengaturan sistem, beranda, atau informasi sistem), sehingga tidak ada konteks tabel entitas."
"Available tools: get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "Alat yang tersedia: get_page_context / get_system_info / run_js (lihat definisi fungsi; panggil saat diperlukan)"
"Rules:": "Aturan:"
"1. Answer in the same language as the user's question, concisely and professionally": "1. Jawab dalam bahasa yang sama dengan pertanyaan pengguna, ringkas dan profesional"
"2. When the user asks about the content, data or structure of the current page, call get_page_context to collect the page context from the user's browser, then give your analysis and conclusion": "2. Saat pengguna menanyakan konten, data, atau struktur halaman saat ini, panggil get_page_context untuk mengumpulkan konteks halaman dari peramban pengguna, lalu berikan analisis dan kesimpulan"
"3. When the user asks about system status or diagnostics, call get_system_info, then give conclusions and suggestions": "3. Saat pengguna menanyakan status atau diagnostik sistem, panggil get_system_info, lalu berikan kesimpulan dan saran"
"4. When the user asks to read or operate elements of the current page (fill inputs, click buttons, read titles and so on), you may call run_js; the script runs in the user's current page and may use document.querySelector to locate elements; explain any write operation (changing page content, submitting forms) to the user before running it": "4. Saat pengguna meminta membaca atau mengoperasikan elemen halaman saat ini (mengisi input, mengeklik tombol, membaca judul, dan sebagainya), Anda dapat memanggil run_js; skrip berjalan di halaman pengguna saat ini dan dapat menggunakan document.querySelector untuk menemukan elemen; jelaskan setiap operasi tulis (mengubah konten halaman, mengirim formulir) kepada pengguna sebelum menjalankannya"
"5. Never invent data; ask the user for clarification when information is insufficient": "5. Jangan pernah mengarang data; minta klarifikasi kepada pengguna bila informasi kurang"
"AI service is not registered": "Layanan AI belum terdaftar"
