# 设置页字段、分类与导航（中文源文经英文规范键翻译）
"Auto (follow system)": "Otomatis (ikuti sistem)"
"Cancel": "Batal"
"Queries {0}, executes {1}, elapsed {2:n0} ms": "Kueri {0}, eksekusi {1}, waktu {2:n0} ms"
"Show run time": "Tampilkan waktu eksekusi"
"Avatar directory. Downloads remote avatars locally; defaults to the Avatars subdirectory, or Avatars next to the web root. Empty disables downloading": "Direktori avatar. Mengunduh avatar jarak jauh ke penyimpanan lokal; default ke subdirektori Avatars, atau Avatars di samping akar web. Kosong menonaktifkan pengunduhan"
"Text avatar characters. Generates an SVG text avatar when no image exists; 1 to 3 characters. Uses the first N Chinese characters to keep the surname, or the initials of English words. Default 2": "Jumlah karakter avatar teks. Membuat avatar teks SVG saat tidak ada gambar; 1 sampai 3 karakter. Menggunakan N karakter Tionghoa pertama agar marga tetap utuh, atau inisial kata bahasa Inggris. Default 2"
"Upload directory. Defaults to Uploads": "Direktori unggahan. Default Uploads"
"Web root directory. Defaults to wwwroot": "Direktori akar web. Default wwwroot"
"Resource URL. CDN base such as https://sso.newlifex.com/content/; empty uses local resources": "URL sumber daya. Basis CDN seperti https://sso.newlifex.com/content/; kosong menggunakan sumber daya lokal"
"CORS origins. Other origins allowed to access this site; * allows any origin": "Origin CORS. Origin lain yang diizinkan mengakses situs ini; * mengizinkan semua origin"
"Iframe embedding. Empty allows the same domain only; SAMEORIGIN allows the same domain and port; ALLOWALL allows any domain": "Penyematan iframe. Kosong hanya mengizinkan domain yang sama; SAMEORIGIN mengizinkan domain dan port yang sama; ALLOWALL mengizinkan semua domain"
"Share expiration. Lifetime of share tokens in seconds, default 7200": "Kedaluwarsa berbagi. Masa berlaku token berbagi dalam detik, default 7200"
"Bot error code. Returns this error for crawlers, such as 404/500; 0 disables blocking": "Kode kesalahan bot. Mengembalikan kesalahan ini untuk perayap, misalnya 404/500; 0 menonaktifkan pemblokiran"
"Force redirect. Target scheme and host for GET requests; * is supported in the host. Commonly used to force HTTPS, such as https://*:8081": "Pengalihan paksa. Skema dan host tujuan untuk permintaan GET; * didukung pada host. Umumnya digunakan untuk memaksa HTTPS, misalnya https://*:8081"
"Security mode. 0: off; 1: observe and log only; 2: block; 3: automatic (default; observes, bans repeated attackers, and temporarily blocks broad attacks with automatic rollback)": "Mode keamanan. 0: mati; 1: hanya amati dan catat; 2: blokir; 3: otomatis (default; mengamati, melarang penyerang berulang, dan memblokir sementara serangan luas dengan pembatalan otomatis)"
"Auto-ban durations. Comma-separated seconds that increase with each trigger; empty uses 60,300,1800,7200,86400": "Durasi larangan otomatis. Nilai detik dipisahkan koma yang bertambah setiap pemicu; kosong menggunakan 60,300,1800,7200,86400"
"Trusted proxies. Forwarded headers are only trusted from these comma-separated IPs or CIDR ranges; empty keeps the legacy behavior of trusting all forwarded headers": "Proksi tepercaya. Header yang diteruskan hanya dipercaya dari IP atau rentang CIDR yang dipisahkan koma ini; kosong mempertahankan perilaku lama yang mempercayai semua header yang diteruskan"
"Trusted proxy learning limit. When no trusted proxies are configured, private direct sources that send forwarded headers are learned up to this count; 0 disables learning (typically 2 for one data center, 4 for two)": "Batas pembelajaran proksi tepercaya. Bila tidak ada proksi tepercaya yang dikonfigurasi, sumber langsung privat yang mengirim header yang diteruskan dipelajari hingga jumlah ini; 0 menonaktifkan pembelajaran (biasanya 2 untuk satu pusat data, 4 untuk dua)"
"Learned proxies. Maintained automatically; clear it to reset the learned list": "Proksi yang dipelajari. Dikelola otomatis; kosongkan untuk mengatur ulang daftar yang dipelajari"
"Default role. Defaults to the Normal User role": "Peran default. Bawaannya peran Pengguna Normal"
"Allow password sign-in. Allows signing in with a username and password": "Izinkan login kata sandi. Mengizinkan masuk dengan nama pengguna dan kata sandi"
"Allow plain-text passwords. Default true for legacy clients; false forces Challenge-Response encrypted passwords": "Izinkan kata sandi teks biasa. Default true untuk klien lama; false memaksa kata sandi terenkripsi Challenge-Response"
"Allow registration. Allows registering with a username and password": "Izinkan pendaftaran. Mengizinkan pendaftaran dengan nama pengguna dan kata sandi"
"Auto registration. Default true; after SSO sign-in an unknown local user is registered automatically. Enabled when either the global or the OAuth app setting is on": "Pendaftaran otomatis. Default true; setelah login SSO, pengguna lokal yang tidak dikenal didaftarkan otomatis. Aktif bila salah satu dari pengaturan global atau aplikasi OAuth menyala"
"Password complexity check. When enabled the sign-in page validates password strength; when disabled it only requires a non-empty password. Default true": "Pemeriksaan kompleksitas kata sandi. Bila aktif, halaman masuk memvalidasi kekuatan kata sandi; bila nonaktif, hanya mensyaratkan kata sandi tidak kosong. Default true"
"Login failure limit. Bans sign-in after this many consecutive failures for the same user or IP, default 5": "Batas kegagalan login. Melarang masuk setelah sekian kegagalan berturut-turut untuk pengguna atau IP yang sama, default 5"
"Login ban duration. Seconds a risk-control ban lasts, default 300": "Durasi larangan login. Detik berlangsungnya larangan kontrol risiko, default 300"
"Class C subnet ban threshold. Bans a /24 subnet such as 103.125.146.* after this many failures, default 10; 0 disables": "Ambang larangan subnet kelas C. Melarang subnet /24 seperti 103.125.146.* setelah sekian kegagalan, default 10; 0 menonaktifkan"
"Class B subnet ban threshold. Bans a /16 subnet such as 103.125.*.* after this many failures, default 20; 0 disables": "Ambang larangan subnet kelas B. Melarang subnet /16 seperti 103.125.*.* setelah sekian kegagalan, default 20; 0 menonaktifkan"
"Force bind by user name. Binds SSO users to local users with the same name without a provider prefix; intended for user centers": "Paksa ikat berdasarkan nama pengguna. Mengikat pengguna SSO ke pengguna lokal dengan nama yang sama tanpa prefiks penyedia; untuk pusat pengguna"
"Bind by user code. Binds SSO users to local users by user code": "Ikat berdasarkan kode pengguna. Mengikat pengguna SSO ke pengguna lokal berdasarkan kode pengguna"
"Bind by mobile. Binds SSO users to local users by mobile number": "Ikat berdasarkan ponsel. Mengikat pengguna SSO ke pengguna lokal berdasarkan nomor ponsel"
"Bind by email. Binds SSO users to local users by email": "Ikat berdasarkan email. Mengikat pengguna SSO ke pengguna lokal berdasarkan email"
"Bind by nickname. Binds SSO users to local users by nickname; suitable for internal SSO, not for social networks with many duplicate names": "Ikat berdasarkan nama panggilan. Mengikat pengguna SSO ke pengguna lokal berdasarkan nama panggilan; cocok untuk SSO internal, bukan untuk jejaring sosial dengan banyak nama duplikat"
"Use SSO roles. Keeps SSO roles after sign-in, default true; otherwise DefaultRole is used": "Gunakan peran SSO. Mempertahankan peran SSO setelah masuk, default true; jika tidak, DefaultRole digunakan"
"Use SSO departments. Keeps SSO departments after sign-in, default true": "Gunakan departemen SSO. Mempertahankan departemen SSO setelah masuk, default true"
"SSO role rules. Automatically upgrades the primary role after SSO sign-in; separate rules with commas. Format: source role+department wildcard=target role, for example Guest+Route*=Route Specialist": "Aturan peran SSO. Menaikkan peran utama secara otomatis setelah login SSO; pisahkan aturan dengan koma. Format: peran sumber+wildcard departemen=peran tujuan, misalnya Guest+Route*=Route Specialist"
"Sign out everywhere. false signs out of this site only; true (default) also signs out of the SSO server": "Keluar dari semua tempat. false hanya keluar dari situs ini; true (default) juga keluar dari server SSO"
"Allow multi-device sign-in. false kicks old devices on a new sign-in and revokes all tokens on sign-out; true (default) revokes only the current session": "Izinkan login multiperangkat. false mengeluarkan perangkat lama saat login baru dan mencabut semua token saat keluar; true (default) hanya mencabut sesi saat ini"
"Session timeout. Session lifetime after SSO sign-in during which the cookie can sign in again; default 0s": "Batas waktu sesi. Masa berlaku sesi setelah login SSO selama cookie dapat masuk kembali; default 0 detik"
"Token sliding refresh threshold. Refreshes the JWT and rewrites the cookie when its remaining lifetime falls below this many seconds; 0 disables sliding expiration": "Ambang penyegaran geser token. Menyegarkan JWT dan menulis ulang cookie saat masa berlaku tersisa di bawah sekian detik; 0 menonaktifkan kedaluwarsa geser"
"User refresh period. Fetches user information once per period across SSO sign-ins, default 600 seconds": "Periode penyegaran pengguna. Mengambil informasi pengguna sekali per periode di antara login SSO, default 600 detik"
"JWT secret. Algorithm and key used to sign JWTs, such as HS256:ABCD1234": "Rahasia JWT. Algoritme dan kunci yang digunakan untuk menandatangani JWT, misalnya HS256:ABCD1234"
"Token lifetime. Lifetime of the access token in seconds, default 7200": "Masa berlaku token. Masa berlaku token akses dalam detik, default 7200"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default true": "Simpan token di cookie. Membaca token dari cookie saat header permintaan tidak membawanya, default true"
"Validate attachment access. Requires sign-in to access attachments, default true": "Validasi akses lampiran. Memerlukan login untuk mengakses lampiran, default true"
"Public attachment categories. Categories accessible without sign-in, comma-separated, such as markdown,avatar. Applies when ValidateAttachment is true": "Kategori lampiran publik. Kategori yang dapat diakses tanpa login, dipisahkan koma, misalnya markdown,avatar. Berlaku bila ValidateAttachment bernilai true"
"Private attachment categories. Categories only the uploader can access, comma-separated. Applies when ValidateAttachment is true": "Kategori lampiran privat. Kategori yang hanya dapat diakses pengunggah, dipisahkan koma. Berlaku bila ValidateAttachment bernilai true"
"SSO redirect allowlist. Domains allowed to receive the JWT after sign-in, comma-separated with wildcard prefixes such as *.company.com. Empty allows the same site only; other origins are rejected and sent back to the home page": "Daftar izin pengalihan SSO. Domain yang diizinkan menerima JWT setelah masuk, dipisahkan koma dengan prefiks wildcard seperti *.company.com. Kosong hanya mengizinkan situs yang sama; origin lain ditolak dan dikembalikan ke halaman beranda"
"External authentication URL. When local authentication fails, credentials are verified by this endpoint; on success the local user is created or updated and signed in": "URL autentikasi eksternal. Saat autentikasi lokal gagal, kredensial diverifikasi oleh endpoint ini; bila berhasil, pengguna lokal dibuat atau diperbarui lalu masuk"
"Start page. First content page opened after entering the admin console": "Halaman awal. Halaman konten pertama yang dibuka setelah masuk konsol admin"
"Theme. Content page theme, ACE/layui": "Tema. Tema halaman konten, ACE/layui"
"Skin. Outer frame layout, ACE/layui": "Kulit. Tata letak bingkai luar, ACE/layui"
"Login tip. Empty hides the tip on the sign-in page": "Petunjuk login. Kosong menyembunyikan petunjuk di halaman masuk"
"Login logo. Empty uses the default logo": "Logo login. Kosong menggunakan logo default"
"Login background. Image URL; empty uses the default background": "Latar belakang login. URL gambar; kosong menggunakan latar belakang default"
"Form group layout. 3/2/1 columns on large/medium/small screens, form-group col-xs-12 col-sm-6 col-lg-4": "Tata letak grup formulir. 3/2/1 kolom pada layar besar/sedang/kecil, form-group col-xs-12 col-sm-6 col-lg-4"
"Bootstrap select. Nicer drop-downs with a rendering cost": "Bootstrap select. Drop-down lebih menarik dengan biaya rendering"
"Maximum drop-down items. Maximum options in a related drop-down on forms, default 50; larger lists fall back to a text box": "Item drop-down maksimum. Opsi maksimum dalam drop-down terkait pada formulir, default 50; daftar yang lebih besar dialihkan ke kotak teks"
"Copyright. Empty hides the copyright; variables now/runtime/framework are supported, and now accepts formats such as {now:yyyy}": "Hak cipta. Kosong menyembunyikan hak cipta; variabel now/runtime/framework didukung, dan now menerima format seperti {now:yyyy}"
"Filing number. Empty hides the filing information": "Nomor pendaftaran. Kosong menyembunyikan informasi pendaftaran"
"Enable new UI": "Aktifkan UI baru"
"ECharts theme. Chart theme": "Tema ECharts. Tema bagan"
"Title suffix. Appends the system name to page titles, default true": "Akhiran judul. Menambahkan nama sistem ke judul halaman, default true"
"Table double-click. Enables row double-click on list pages, default true": "Klik ganda tabel. Mengaktifkan klik ganda baris pada halaman daftar, default true"
"Table style. Light: minimal thin lines; Standard: clear row lines (default); Grid: full cell borders": "Gaya tabel. Ringan: garis tipis minimal; Standar: garis baris yang jelas (default); Kisi: batas sel penuh"
"Table density. Compact: dense and information-rich (default); Normal: relaxed": "Kepadatan tabel. Ringkas: padat dan kaya informasi (default); Normal: longgar"
"Stardust web. Stardust console URL; supports direct links to /trace?id={traceId} or /graph?id={traceId}": "Web Stardust. URL konsol Stardust; mendukung tautan langsung ke /trace?id={traceId} atau /graph?id={traceId}"
"AI master switch. Enables AI features such as log analysis and notification polishing, default false": "Sakelar utama AI. Mengaktifkan fitur AI seperti analisis log dan penyempurnaan notifikasi, default false"
"AI provider. Supports NewLife, Ollama, DeepSeek, DashScope, OpenAI and others; default NewLife": "Penyedia AI. Mendukung NewLife, Ollama, DeepSeek, DashScope, OpenAI, dan lainnya; default NewLife"
"AI endpoint. Defaults to https://ai.newlifex.com for NewLife": "Endpoint AI. Default https://ai.newlifex.com untuk NewLife"
"AI ApiKey. Defaults to sk-CubeAI2026 for NewLife": "ApiKey AI. Default sk-CubeAI2026 untuk NewLife"
"AI default model. Defaults to newlife-flash for NewLife": "Model default AI. Default newlife-flash untuk NewLife"
"AI default deep reasoning. Enables think mode for analysis and chat by default; false means fast responses": "Penalaran mendalam default AI. Mengaktifkan mode berpikir untuk analisis dan obrolan secara default; false berarti respons cepat"
"AI color scheme. Fills the primary and secondary colors from a preset": "Skema warna AI. Mengisi warna primer dan sekunder dari preset"
"AI primary color. Main color of the launcher, panel header and user bubbles; default NewLife green #2ecc71": "Warna primer AI. Warna utama peluncur, header panel, dan gelembung pengguna; default hijau NewLife #2ecc71"
"AI secondary color. Gradient end color, default dark green #1e8e3e": "Warna sekunder AI. Warna akhir gradien, default hijau tua #1e8e3e"
"OAuth server. Enables the OAuth 2.0 server that provides SSO for other applications": "Server OAuth. Mengaktifkan server OAuth 2.0 yang menyediakan SSO untuk aplikasi lain"
"File manager. Enables backend file management (browse, upload, download, delete); this carries security risks": "Manajer berkas. Mengaktifkan pengelolaan berkas backend (jelajah, unggah, unduh, hapus); ini membawa risiko keamanan"
"Multi-tenancy. Enables tenants; tenant mode cannot access system administration and platform mode cannot access tenant pages": "Multi-penyewa. Mengaktifkan penyewa; mode penyewa tidak dapat mengakses administrasi sistem dan mode platform tidak dapat mengakses halaman penyewa"
"Tenant query policy. DenyWithEmpty: return an empty set without tenant context; ThrowOnMissingTenant: throw an explicit error": "Kebijakan kueri penyewa. DenyWithEmpty: mengembalikan kumpulan kosong tanpa konteks penyewa; ThrowOnMissingTenant: melempar kesalahan eksplisit"
"User online. 0: do not record; 1: signed-in users only; 2: all visitors (default)": "Pengguna online. 0: jangan catat; 1: hanya pengguna yang masuk; 2: semua pengunjung (default)"
"User statistics. Records user visits, default true": "Statistik pengguna. Mencatat kunjungan pengguna, default true"
"Enable SMS. SMS verification codes and system notifications, default false": "Aktifkan SMS. Kode verifikasi SMS dan notifikasi sistem, default false"
"Enable email. Email verification codes and system notifications, default false": "Aktifkan email. Kode verifikasi email dan notifikasi sistem, default false"
"Require email verification. Users must activate their email before signing in and must provide one when registering, default false": "Wajib verifikasi email. Pengguna harus mengaktifkan email sebelum masuk dan wajib memberikannya saat mendaftar, default false"
"Require mobile verification. Users must activate their mobile before signing in and must provide one when registering, default false": "Wajib verifikasi ponsel. Pengguna harus mengaktifkan ponsel sebelum masuk dan wajib memberikannya saat mendaftar, default false"
"Captcha scenarios. Bit mask: 0: off; 1: sign-in; 2: registration; 4: verification code requests (anti-SMS-bombing); combine with 3 for sign-in and registration. Mandatory scenarios are never exempted, default 0": "Skenario captcha. Bit mask: 0: mati; 1: masuk; 2: pendaftaran; 4: permintaan kode verifikasi (anti-SMS-bombing); gabungkan dengan 3 untuk masuk dan pendaftaran. Skenario wajib tidak pernah dikecualikan, default 0"
"Risk-adaptive captcha. Disabled when CaptchaScene is 0; when enabled it detects unsafe environments and requires a captcha, default true": "Captcha adaptif risiko. Dinonaktifkan bila CaptchaScene bernilai 0; bila aktif, mendeteksi lingkungan tidak aman dan mewajibkan captcha, default true"
"Captcha risk threshold. Requires a captcha when the risk score reaches this value: 0: intranet; 1: internet; 2: internet with recent failures; 3: banned. Default 2": "Ambang risiko captcha. Mewajibkan captcha saat skor risiko mencapai nilai ini: 0: intranet; 1: internet; 2: internet dengan kegagalan terbaru; 3: dilarang. Default 2"
"Trusted device lifetime. Days during which previously successful devices skip adaptive captchas, default 30": "Masa berlaku perangkat tepercaya. Hari di mana perangkat yang pernah berhasil melewati captcha adaptif, default 30"
"Enable MFA. Allows users to enable TOTP multi-factor authentication; an enhanced feature, default false": "Aktifkan MFA. Mengizinkan pengguna mengaktifkan autentikasi multifaktor TOTP; fitur lanjutan, default false"
"File storage serving. Responds to file download requests from other nodes, default true": "Penyajian penyimpanan berkas. Menanggapi permintaan unduhan berkas dari node lain, default true"
"File storage fetch. Pulls new files published by other nodes, default true": "Pengambilan penyimpanan berkas. Menarik berkas baru yang diterbitkan node lain, default true"
"File fetch timeout. Maximum milliseconds to wait for other nodes when a file is missing locally, default 5000": "Batas waktu pengambilan berkas. Milidetik maksimum menunggu node lain saat berkas tidak ada secara lokal, default 5000"
"Attachment storage. Local disk, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu or EasyIO; default Local": "Penyimpanan lampiran. Disk lokal, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu, atau EasyIO; default Local"
"Object storage server. S3-compatible endpoint for OSS/COS/Qiniu, such as oss-cn-beijing.aliyuncs.com": "Server penyimpanan objek. Endpoint kompatibel S3 untuk OSS/COS/Qiniu, misalnya oss-cn-beijing.aliyuncs.com"
"Object storage bucket. Bucket name for OSS/COS/Qiniu": "Bucket penyimpanan objek. Nama bucket untuk OSS/COS/Qiniu"
"Object storage region. S3 signing scope, such as cn-beijing / ap-beijing / cn-east-1": "Region penyimpanan objek. Cakupan penandatanganan S3, misalnya cn-beijing / ap-beijing / cn-east-1"
"Object storage app ID. AccessKeyId": "ID aplikasi penyimpanan objek. AccessKeyId"
"Object storage app secret. AccessKeySecret": "Rahasia aplikasi penyimpanan objek. AccessKeySecret"
"Data retention. Days to keep audit and OAuth logs, default 30": "Retensi data. Hari penyimpanan log audit dan OAuth, default 30"
"File retention. Days to keep backup files, default 15": "Retensi berkas. Hari penyimpanan berkas pencadangan, default 15"
"Retention size floor. Files smaller than this (KB) are never deleted even after the retention period, default 1024K": "Batas bawah ukuran retensi. Berkas yang lebih kecil dari ini (KB) tidak pernah dihapus bahkan setelah masa retensi, default 1024K"
"Maximum export rows. Maximum rows a page may export, default 10_000_000": "Baris ekspor maksimum. Baris maksimum yang dapat diekspor satu halaman, default 10_000_000"
"Maximum backup rows. Maximum rows a page may back up, default 10_000_000": "Baris pencadangan maksimum. Baris maksimum yang dapat dicadangkan satu halaman, default 10_000_000"
"API prefixes. Comma- or semicolon-separated prefixes such as /api,/api/v1; matching requests are forwarded to the real route without the prefix": "Prefiks API. Prefiks yang dipisahkan koma atau titik koma seperti /api,/api/v1; permintaan yang cocok diteruskan ke rute sebenarnya tanpa prefiks"
"Password strength. * means unrestricted; by default at least 8 characters with digits, upper/lower case letters and symbols. Simple form: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$": "Kekuatan kata sandi. * berarti tanpa batasan; secara default minimal 8 karakter dengan angka, huruf besar/kecil, dan simbol. Bentuk sederhana: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$"
"Cookie mode. Default SameSite mode for token cookies (-1 Unspecified, 0 None, 1 Lax, 2 Strict)": "Mode cookie. Mode SameSite default untuk cookie token (-1 Unspecified, 0 None, 1 Lax, 2 Strict)"
"Cookie domain. Writes cookies to a parent domain; empty uses the current domain. A top-level domain requires HTTPS and prevents plain HTTP from writing same-name keys on the local domain": "Domain cookie. Menulis cookie ke domain induk; kosong menggunakan domain saat ini. Domain tingkat atas memerlukan HTTPS dan mencegah HTTP biasa menulis kunci bernama sama pada domain lokal"
"Activation URL. Front-end activation page URL used in email activation links, such as https://xxx/activate; empty builds /activate from the request host": "URL aktivasi. URL halaman aktivasi frontend yang digunakan dalam tautan aktivasi email, misalnya https://xxx/activate; kosong membangun /activate dari host permintaan"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default false": "Simpan token di cookie. Membaca token dari cookie saat header permintaan tidak membawanya, default false"
"Password strength. * means unrestricted; the simple form defaults to 5 to 32 characters of any type. The full form requires at least 8 characters with digits, upper/lower case letters and symbols: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$": "Kekuatan kata sandi. * berarti tanpa batasan; bentuk sederhana default 5 sampai 32 karakter jenis apa pun. Bentuk lengkap memerlukan minimal 8 karakter dengan angka, huruf besar/kecil, dan simbol: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$"
