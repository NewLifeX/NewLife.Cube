"There are {0} users online, exceeding the {1}-day record of {2} (threshold {3:0}). This may be a campaign, a crawler scan or abnormal traffic; check the online list and sign-in log.": "Υπάρχουν {0} συνδεδεμένοι χρήστες, ξεπερνώντας το ρεκόρ {1} ημερών του {2} (όριο {3:0}). Μπορεί να είναι καμπάνια, σάρωση από crawler ή μη φυσιολογική κίνηση· ελέγξτε τη λίστα συνδεδεμένων και το αρχείο καταγραφής συνδέσεων."
"Record of the last {0} days: {1}": "Ρεκόρ των τελευταίων {0} ημερών: {1}"
"Cube admin console": "Κονσόλα διαχείρισης Cube"
"You are the AI assistant of {0}, helping an administrator work on the current page.": "Είστε ο βοηθός ΤΝ του {0} και βοηθάτε έναν διαχειριστή να εργαστεί στην τρέχουσα σελίδα."
"The current page is not an entity data page (it may be system settings, the home page or system information), so there is no entity table context.": "Η τρέχουσα σελίδα δεν είναι σελίδα δεδομένων οντότητας (μπορεί να είναι ρυθμίσεις συστήματος, η αρχική σελίδα ή πληροφορίες συστήματος), επομένως δεν υπάρχει περιβάλλον πίνακα οντότητας."
"Available tools: get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "Διαθέσιμα εργαλεία: get_page_context / get_system_info / run_js (δείτε τους ορισμούς των συναρτήσεων· καλέστε τα όταν χρειάζεται)"
"Rules:": "Κανόνες:"
"1. Answer in the same language as the user's question, concisely and professionally": "1. Απαντήστε στην ίδια γλώσσα με την ερώτηση του χρήστη, με συντομία και επαγγελματισμό"
"2. When the user asks about the content, data or structure of the current page, call get_page_context to collect the page context from the user's browser, then give your analysis and conclusion": "2. Όταν ο χρήστης ρωτά για το περιεχόμενο, τα δεδομένα ή τη δομή της τρέχουσας σελίδας, καλέστε το get_page_context για να συλλέξετε το περιβάλλον της σελίδας από το πρόγραμμα περιήγησης του χρήστη και στη συνέχεια παρουσιάστε την ανάλυση και το συμπέρασμά σας"
"3. When the user asks about system status or diagnostics, call get_system_info, then give conclusions and suggestions": "3. Όταν ο χρήστης ρωτά για την κατάσταση ή τη διάγνωση του συστήματος, καλέστε το get_system_info και στη συνέχεια παρουσιάστε συμπεράσματα και προτάσεις"
"4. When the user asks to read or operate elements of the current page (fill inputs, click buttons, read titles and so on), you may call run_js; the script runs in the user's current page and may use document.querySelector to locate elements; explain any write operation (changing page content, submitting forms) to the user before running it": "4. Όταν ο χρήστης ζητά να διαβάσετε ή να χειριστείτε στοιχεία της τρέχουσας σελίδας (συμπλήρωση πεδίων, κλικ σε κουμπιά, ανάγνωση τίτλων κ.λπ.), μπορείτε να καλέσετε το run_js· το σενάριο εκτελείται στην τρέχουσα σελίδα του χρήστη και μπορεί να χρησιμοποιήσει το document.querySelector για τον εντοπισμό στοιχείων· εξηγήστε στον χρήστη οποιαδήποτε λειτουργία εγγραφής (αλλαγή περιεχομένου σελίδας, υποβολή φορμών) πριν την εκτελέσετε"
"5. Never invent data; ask the user for clarification when information is insufficient": "5. Μην επινοείτε ποτέ δεδομένα· ζητήστε διευκρινίσεις από τον χρήστη όταν οι πληροφορίες είναι ελλιπείς"
"AI service is not registered": "Η υπηρεσία ΤΝ δεν έχει καταχωριστεί"
"AI": "ΤΝ"
"AI chat": "Συνομιλία ΤΝ"
"Browser operation result callback": "Επιστροφή κλήσης αποτελέσματος λειτουργίας προγράμματος περιήγησης"
"...[truncated]": "...[περικομμένο]"
"AI is not enabled. Turn on AISwitch in system settings.": "Η ΤΝ δεν είναι ενεργοποιημένη. Ενεργοποιήστε το AISwitch στις ρυθμίσεις συστήματος."
"AI call failed: {0}": "Η κλήση ΤΝ απέτυχε: {0}"
"Data:": "Δεδομένα:"
"You are a system operations expert. Based on the following runtime metrics, produce a health diagnosis report:\nCover bottlenecks, whether capacity should be expanded, and any risks worth attention.\nOutput the diagnosis report directly without extra explanation.": "Είστε ειδικός στις λειτουργίες συστημάτων. Με βάση τις ακόλουθες μετρήσεις εκτέλεσης, συντάξτε αναφορά διάγνωσης υγείας:\nΚαλύψτε τα σημεία συμφόρησης, αν πρέπει να επεκταθεί η χωρητικότητα και τυχόν κινδύνους που αξίζει να προσέξετε.\nΠαραγάγετε απευθείας την αναφορά διάγνωσης χωρίς πρόσθετες εξηγήσεις."
"Script must not be empty": "Το σενάριο δεν μπορεί να είναι κενό"
"Browser channel is not ready (Writer not injected)": "Το κανάλι του προγράμματος περιήγησης δεν είναι έτοιμο (το Writer δεν έχει εισαχθεί)"
"Run page script": "Εκτέλεση σεναρίου σελίδας"
"Runs JavaScript in the current page and returns the result; can read or modify page elements, for example document.title or document.querySelector('input[name=Name]').value": "Εκτελεί JavaScript στην τρέχουσα σελίδα και επιστρέφει το αποτέλεσμα· μπορεί να διαβάσει ή να τροποποιήσει στοιχεία της σελίδας, για παράδειγμα document.title ή document.querySelector('input[name=Name]').value"
"JavaScript code to run in the current page": "Κώδικας JavaScript προς εκτέλεση στην τρέχουσα σελίδα"
"Get page context": "Λήψη περιβάλλοντος σελίδας"
"Gets the main data and structure of the current page (title, tables, forms and so on). Uses the server-side context when the page provides one; otherwise collects the page content from the user's browser": "Λαμβάνει τα κύρια δεδομένα και τη δομή της τρέχουσας σελίδας (τίτλο, πίνακες, φόρμες κ.λπ.). Χρησιμοποιεί το περιβάλλον από την πλευρά του διακομιστή όταν η σελίδα το παρέχει· διαφορετικά συλλέγει το περιεχόμενο της σελίδας από το πρόγραμμα περιήγησης του χρήστη"
"Get form schema": "Λήψη σχήματος φόρμας"
"Gets the schema of the current form, including field names, types, descriptions and current values, for generating form values": "Λαμβάνει το σχήμα της τρέχουσας φόρμας, συμπεριλαμβανομένων ονομάτων πεδίων, τύπων, περιγραφών και τρεχουσών τιμών, για τη δημιουργία τιμών φόρμας"
"Form mode: add or edit": "Λειτουργία φόρμας: προσθήκη ή επεξεργασία"
"Fill form": "Συμπλήρωση φόρμας"
"Generates form field values and fills them into the front-end form. Nothing is written to the database until the user confirms": "Δημιουργεί τιμές πεδίων φόρμας και τις συμπληρώνει στη φόρμα του front-end. Τίποτα δεν εγγράφεται στη βάση δεδομένων μέχρι να επιβεβαιώσει ο χρήστης"
"Field values as a JSON string, keyed by field name": "Οι τιμές των πεδίων ως συμβολοσειρά JSON, με κλειδί το όνομα του πεδίου"
"No valid field value dictionary was received": "Δεν ελήφθη έγκυρο λεξικό τιμών πεδίων"
"[fill_form invalid argument] No valid field value dictionary was received. Call get_form_schema first to get the field structure, then pass the values parameter as {\"field\":value}.": "[fill_form μη έγκυρο όρισμα] Δεν ελήφθη έγκυρο λεξικό τιμών πεδίων. Καλέστε πρώτα το get_form_schema για να λάβετε τη δομή των πεδίων και στη συνέχεια περάστε την παράμετρο values ως {\"field\":value}."
"Generated {0} form field values (skipped {1}, failed {2}) and filled them into the form. Ask the user to review before submitting.": "Δημιουργήθηκαν {0} τιμές πεδίων φόρμας ({1} παραλείφθηκαν, {2} απέτυχαν) και συμπληρώθηκαν στη φόρμα. Ζητήστε από τον χρήστη να τις ελέγξει πριν την υποβολή."
" descending": " φθίνουσα"
"No current record (add mode). Save first or switch to the detail/edit page.": "Δεν υπάρχει τρέχουσα εγγραφή (λειτουργία προσθήκης). Αποθηκεύστε πρώτα ή μεταβείτε στη σελίδα λεπτομερειών/επεξεργασίας."
"Record does not exist": "Η εγγραφή δεν υπάρχει"
"Get data context": "Λήψη περιβάλλοντος δεδομένων"
"Gets the data context of the current page: the current record with its field metadata, or a summary and sample of the current query result, for analysis": "Λαμβάνει το περιβάλλον δεδομένων της τρέχουσας σελίδας: την τρέχουσα εγγραφή με τα μεταδεδομένα των πεδίων της ή μια σύνοψη και δείγμα του τρέχοντος αποτελέσματος ερωτήματος, για ανάλυση"
"Gets the form schema of the current entity, including field names, types, enum values, required flags, descriptions and existing values (edit mode), for generating form values": "Λαμβάνει το σχήμα φόρμας της τρέχουσας οντότητας, συμπεριλαμβανομένων ονομάτων πεδίων, τύπων, τιμών απαρίθμησης, σημαιών υποχρεωτικότητας, περιγραφών και υπαρχουσών τιμών (λειτουργία επεξεργασίας), για τη δημιουργία τιμών φόρμας"
"Field values as a JSON string, keyed by field name, for example {\"Name\":\"John\",\"Status\":1}": "Οι τιμές των πεδίων ως συμβολοσειρά JSON, με κλειδί το όνομα του πεδίου, για παράδειγμα {\"Name\":\"John\",\"Status\":1}"
"Browser operation timed out; the front end returned no result": "Το χρονικό όριο της λειτουργίας του προγράμματος περιήγησης εξαντλήθηκε· το front-end δεν επέστρεψε αποτέλεσμα"
"Get system status": "Λήψη κατάστασης συστήματος"
"Gets current server metrics such as CPU usage, memory, process working set and system information, for health diagnostics": "Λαμβάνει τρέχουσες μετρήσεις του διακομιστή, όπως χρήση CPU, μνήμη, σύνολο εργασίας διεργασίας και πληροφορίες συστήματος, για διάγνωση υγείας"
