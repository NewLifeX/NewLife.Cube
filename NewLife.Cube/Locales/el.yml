"Value set code prefix does not match the type: LovCode starts with '{0}' but Type is '{1}', which must start with '{2}.'": "Το πρόθεμα του κωδικού συνόλου τιμών δεν ταιριάζει με τον τύπο: Το LovCode ξεκινά με '{0}' αλλά το Type είναι '{1}', το οποίο πρέπει να ξεκινά με '{2}.'."
"Invalid boolean value in request [{0}]={1}": "Μη έγκυρη λογική τιμή στο αίτημα [{0}]={1}."
"Role [{0}] does not exist.": "Ο ρόλος [{0}] δεν υπάρχει."
"The user page is read-only for non-system roles; edit your profile in the user center.": "Η σελίδα χρήστη είναι μόνο για ανάγνωση για μη συστημικούς ρόλους· επεξεργαστείτε το προφίλ σας στο κέντρο χρήστη."
"The user page is read-only for non-system roles; bulk import is not allowed.": "Η σελίδα χρήστη είναι μόνο για ανάγνωση για μη συστημικούς ρόλους· η μαζική εισαγωγή δεν επιτρέπεται."
"You cannot modify another user's profile.": "Δεν μπορείτε να τροποποιήσετε το προφίλ άλλου χρήστη."
"The username cannot be changed.": "Το όνομα χρήστη δεν μπορεί να αλλάξει."
"The role cannot be changed.": "Ο ρόλος δεν μπορεί να αλλάξει."
"The disabled state cannot be changed.": "Η κατάσταση απενεργοποίησης δεν μπορεί να αλλάξει."
"The application [{0}] is not configured.": "Η εφαρμογή [{0}] δεν έχει ρυθμιστεί."
"In multi-tenant mode, registration must include X-App-Id or X-Tenant.": "Σε λειτουργία πολλών μισθωτών, η εγγραφή πρέπει να περιλαμβάνει X-App-Id ή X-Tenant."
"The prefix [{0}_] is not allowed.": "Το πρόθεμα [{0}_] δεν επιτρέπεται."
"User [{0}] already exists.": "Ο χρήστης [{0}] υπάρχει ήδη."
"Email [{0}] already exists.": "Το email [{0}] υπάρχει ήδη."
"Clearing the password requires administrator privileges.": "Η εκκαθάριση του κωδικού πρόσβασης απαιτεί δικαιώματα διαχειριστή."
"Revoking tokens requires administrator privileges.": "Η ανάκληση token απαιτεί δικαιώματα διαχειριστή."
"Revoked {0} tokens of user [{1}].": "Ανακλήθηκαν {0} token του χρήστη [{1}]."
"Revoked {0} tokens.": "Ανακλήθηκαν {0} token."
"Adding or modifying records is not allowed.": "Η προσθήκη ή τροποποίηση εγγραφών δεν επιτρέπεται."
"The online record does not exist.": "Η διαδικτυακή εγγραφή δεν υπάρχει."
"User [{0}] was forced offline and {1} tokens were revoked.": "Ο χρήστης [{0}] αποσυνδέθηκε βίαια και ανακλήθηκαν {1} token."
"Forced offline; revoked {0} tokens.": "Αναγκαστική αποσύνδεση· ανακλήθηκαν {0} token."
"Invalid cron expression.": "Μη έγκυρη έκφραση cron."
"Execution scheduled.": "Η εκτέλεση προγραμματίστηκε."
