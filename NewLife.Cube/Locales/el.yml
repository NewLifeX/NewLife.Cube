"Tenant check failed, access denied: user [{0}] has no valid tenant": "Ο έλεγχος ενοικιαστή απέτυχε, η πρόσβαση απορρίφθηκε: ο χρήστης [{0}] δεν έχει έγκυρο ενοικιαστή"
