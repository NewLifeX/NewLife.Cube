"菜单": "Μενού"
"系统操作菜单以及功能目录树。支持排序，不可见菜单仅用于功能权限限制。每个菜单的权限子项由系统自动生成，请不要人为修改": "Μενού λειτουργιών και το δέντρο λειτουργιών. Υποστηρίζει ταξινόμηση· τα κρυφά μενού περιορίζουν μόνο τα δικαιώματα λειτουργιών. Τα στοιχεία δικαιωμάτων κάθε μενού δημιουργούνται αυτόματα· μην τα τροποποιείτε."
