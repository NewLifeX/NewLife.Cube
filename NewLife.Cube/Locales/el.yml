"Generated {0} configuration field values (skipped {1}, failed {2}) and filled them into the form. Ask the user to review before submitting.": "Δημιουργήθηκαν {0} τιμές πεδίων ρυθμίσεων ({1} παραλείφθηκαν, {2} απέτυχαν) και συμπληρώθηκαν στη φόρμα. Ζητήστε από τον χρήστη να τις ελέγξει πριν την υποβολή."
"The current page is a system configuration form (such as Cube settings); you can help review and fill in configuration items.": "Η τρέχουσα σελίδα είναι φόρμα ρυθμίσεων συστήματος (όπως οι ρυθμίσεις Cube)· μπορείτε να βοηθήσετε στον έλεγχο και στη συμπλήρωση στοιχείων ρυθμίσεων."
"Available tools: get_form_schema / fill_form / get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "Διαθέσιμα εργαλεία: get_form_schema / fill_form / get_page_context / get_system_info / run_js (δείτε τους ορισμούς των συναρτήσεων· καλέστε τα όταν χρειάζεται)"
"2. When the user asks to create, fill in or complete configuration, call get_form_schema first to inspect the items, then call fill_form to generate values (invent reasonable values for empty writable fields, keep existing values unless the user asks otherwise, and never fabricate or modify sensitive settings such as ApiKey/Secret/Token); finally ask the user to review before submitting": "2. Όταν ο χρήστης ζητά να δημιουργήσει, να συμπληρώσει ή να ολοκληρώσει ρυθμίσεις, καλέστε πρώτα το get_form_schema για να επιθεωρήσετε τα στοιχεία και στη συνέχεια καλέστε το fill_form για να δημιουργήσετε τιμές (επινοήστε λογικές τιμές για κενά πεδία που δέχονται εγγραφή, διατηρήστε τις υπάρχουσες τιμές εκτός αν ο χρήστης ζητήσει διαφορετικά και μην κατασκευάζετε ποτέ ούτε να τροποποιείτε ευαίσθητες ρυθμίσεις όπως ApiKey/Secret/Token)· στο τέλος ζητήστε από τον χρήστη να ελέγξει πριν την υποβολή"
"3. When the user asks about the content or current state of the page, call get_page_context, then give your analysis and conclusion": "3. Όταν ο χρήστης ρωτά για το περιεχόμενο ή την τρέχουσα κατάσταση της σελίδας, καλέστε το get_page_context"
"4. When the user asks about system status or diagnostics, call get_system_info": "4. Όταν ο χρήστης ρωτά για την κατάσταση ή τη διάγνωση του συστήματος, καλέστε το get_system_info"
"5. When the user asks to read or operate page elements, you may call run_js; explain any write operation (changing page content, submitting forms) to the user before running it": "5. Όταν ο χρήστης ζητά να διαβάσετε ή να χειριστείτε στοιχεία της σελίδας, μπορείτε να καλέσετε το run_js· εξηγήστε στον χρήστη οποιαδήποτε λειτουργία εγγραφής (αλλαγή περιεχομένου σελίδας, υποβολή φορμών) πριν την εκτελέσετε"
"6. Never invent data; ask the user for clarification when information is insufficient": "6. Μην επινοείτε ποτέ δεδομένα· ζητήστε διευκρινίσεις από τον χρήστη όταν οι πληροφορίες είναι ελλιπείς"
"The tenant identifier carried by user [{0}] is invalid or unavailable. Check the tenant settings and try again.": "Το αναγνωριστικό μισθωτή που φέρει ο χρήστης [{0}] δεν είναι έγκυρο ή δεν είναι διαθέσιμο. Ελέγξτε τις ρυθμίσεις μισθωτή και δοκιμάστε ξανά."
"User [{0}] did not carry a tenant identifier, so the tenant cannot be determined. Include the tenant information and try again.": "Ο χρήστης [{0}] δεν έφερε αναγνωριστικό μισθωτή, επομένως ο μισθωτής δεν μπορεί να προσδιοριστεί. Συμπεριλάβετε τις πληροφορίες μισθωτή και δοκιμάστε ξανά."
"User [{0}] is not allowed to access the data of the current tenant. Switch tenant and try again.": "Ο χρήστης [{0}] δεν επιτρέπεται να έχει πρόσβαση στα δεδομένα του τρέχοντος μισθωτή. Αλλάξτε μισθωτή και δοκιμάστε ξανά."
