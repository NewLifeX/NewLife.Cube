"You are a system operations expert. Analyze the following error logs and report:\n1. Error categories, ordered by frequency\n2. The most likely root cause\n3. Recommended troubleshooting steps\n\nOutput the analysis report directly without extra explanation.": "Είστε ειδικός στις λειτουργίες συστημάτων. Αναλύστε τις ακόλουθες καταγραφές σφαλμάτων και αναφέρετε:\n1. Κατηγορίες σφαλμάτων, ταξινομημένες κατά συχνότητα\n2. Την πιθανότερη βασική αιτία\n3. Προτεινόμενα βήματα αντιμετώπισης\n\nΠαραγάγετε απευθείας την αναφορά ανάλυσης χωρίς πρόσθετες εξηγήσεις."
"Daily log report {0}": "Ημερήσια αναφορά καταγραφών {0}"
"Analyzed {0} log entries": "Αναλύθηκαν {0} καταχωρίσεις καταγραφής"
"每天定时汇总过去 24 小时的系统日志，由 AI 生成摘要后通过通知系统推送给管理员": "Συνοψίζει καθημερινά τις καταγραφές συστήματος των τελευταίων 24 ωρών και στέλνει τη σύνοψη που δημιουργεί η ΤΝ στους διαχειριστές"
"You are an information security expert. Based on the following security data, write a weekly security report covering:\n1. Overall security posture\n2. Risks that need attention\n3. Recommended security measures\n\nOutput the report directly without extra explanation.": "Είστε ειδικός στην ασφάλεια πληροφοριών. Με βάση τα ακόλουθα δεδομένα ασφαλείας, γράψτε μια εβδομαδιαία αναφορά ασφαλείας που να καλύπτει:\n1. Συνολική στάση ασφαλείας\n2. Κινδύνους που χρειάζονται προσοχή\n3. Προτεινόμενα μέτρα ασφαλείας\n\nΠαραγάγετε απευθείας την αναφορά χωρίς πρόσθετες εξηγήσεις."
"Security weekly report {0} ~ {1}": "Εβδομαδιαία αναφορά ασφαλείας {0} ~ {1}"
