# 设置页字段、分类与导航（中文源文经英文规范键翻译）
"Auto (follow system)": "Αυτόματο (ακολουθεί το σύστημα)"
"Cancel": "Άκυρο"
"Queries {0}, executes {1}, elapsed {2:n0} ms": "Ερωτήματα {0}, εκτελέσεις {1}, χρόνος {2:n0} ms"
"Show run time": "Εμφάνιση χρόνου εκτέλεσης"
"Avatar directory. Downloads remote avatars locally; defaults to the Avatars subdirectory, or Avatars next to the web root. Empty disables downloading": "Κατάλογος avatar. Λαμβάνει τα απομακρυσμένα avatar τοπικά· προεπιλογή ο υποκατάλογος Avatars ή Avatars δίπλα στη ρίζα web. Κενό απενεργοποιεί τη λήψη"
"Text avatar characters. Generates an SVG text avatar when no image exists; 1 to 3 characters. Uses the first N Chinese characters to keep the surname, or the initials of English words. Default 2": "Χαρακτήρες avatar κειμένου. Δημιουργεί avatar κειμένου SVG όταν δεν υπάρχει εικόνα· 1 έως 3 χαρακτήρες. Χρησιμοποιεί τους πρώτους N κινεζικούς χαρακτήρες για να διατηρήσει το επώνυμο ή τα αρχικά των αγγλικών λέξεων. Προεπιλογή 2"
"Upload directory. Defaults to Uploads": "Κατάλογος μεταφόρτωσης. Προεπιλογή Uploads"
"Web root directory. Defaults to wwwroot": "Κατάλογος ρίζας web. Προεπιλογή wwwroot"
"Resource URL. CDN base such as https://sso.newlifex.com/content/; empty uses local resources": "URL πόρων. Βάση CDN, όπως https://sso.newlifex.com/content/· κενό χρησιμοποιεί τοπικούς πόρους"
"CORS origins. Other origins allowed to access this site; * allows any origin": "Προελεύσεις CORS. Άλλες προελεύσεις που επιτρέπεται να προσπελάσουν αυτόν τον ιστότοπο· το * επιτρέπει οποιαδήποτε προέλευση"
"Iframe embedding. Empty allows the same domain only; SAMEORIGIN allows the same domain and port; ALLOWALL allows any domain": "Ενσωμάτωση iframe. Κενό επιτρέπει μόνο τον ίδιο τομέα· το SAMEORIGIN επιτρέπει τον ίδιο τομέα και θύρα· το ALLOWALL επιτρέπει οποιονδήποτε τομέα"
"Share expiration. Lifetime of share tokens in seconds, default 7200": "Λήξη κοινής χρήσης. Διάρκεια ζωής των διακριτικών κοινής χρήσης σε δευτερόλεπτα, προεπιλογή 7200"
"Bot error code. Returns this error for crawlers, such as 404/500; 0 disables blocking": "Κωδικός σφάλματος bot. Επιστρέφει αυτό το σφάλμα σε ανιχνευτές, όπως 404/500· το 0 απενεργοποιεί τον αποκλεισμό"
"Force redirect. Target scheme and host for GET requests; * is supported in the host. Commonly used to force HTTPS, such as https://*:8081": "Αναγκαστική ανακατεύθυνση. Σχήμα και host προορισμού για αιτήματα GET· το * υποστηρίζεται στον host. Χρησιμοποιείται συνήθως για επιβολή HTTPS, όπως https://*:8081"
"Security mode. 0: off; 1: observe and log only; 2: block; 3: automatic (default; observes, bans repeated attackers, and temporarily blocks broad attacks with automatic rollback)": "Λειτουργία ασφαλείας. 0: ανενεργή· 1: μόνο παρατήρηση και καταγραφή· 2: αποκλεισμός· 3: αυτόματη (προεπιλογή· παρατηρεί, αποκλείει επαναλαμβανόμενους επιτιθέμενους και μπλοκάρει προσωρινά ευρείες επιθέσεις με αυτόματη επαναφορά)"
"Auto-ban durations. Comma-separated seconds that increase with each trigger; empty uses 60,300,1800,7200,86400": "Διάρκειες αυτόματου αποκλεισμού. Δευτερόλεπτα χωρισμένα με κόμμα που αυξάνονται σε κάθε ενεργοποίηση· κενό χρησιμοποιεί 60,300,1800,7200,86400"
"Trusted proxies. Forwarded headers are only trusted from these comma-separated IPs or CIDR ranges; empty keeps the legacy behavior of trusting all forwarded headers": "Έμπιστοι διαμεσολαβητές. Οι προωθημένες κεφαλίδες γίνονται δεκτές μόνο από αυτές τις διευθύνσεις IP ή περιοχές CIDR χωρισμένες με κόμμα· κενό διατηρεί την παλιά συμπεριφορά εμπιστοσύνης σε όλες τις προωθημένες κεφαλίδες"
"Trusted proxy learning limit. When no trusted proxies are configured, private direct sources that send forwarded headers are learned up to this count; 0 disables learning (typically 2 for one data center, 4 for two)": "Όριο εκμάθησης έμπιστων διαμεσολαβητών. Όταν δεν έχουν ρυθμιστεί έμπιστοι διαμεσολαβητές, οι ιδιωτικές άμεσες προελεύσεις που στέλνουν προωθημένες κεφαλίδες μαθαίνονται έως αυτόν τον αριθμό· το 0 απενεργοποιεί την εκμάθηση (συνήθως 2 για ένα κέντρο δεδομένων, 4 για δύο)"
"Learned proxies. Maintained automatically; clear it to reset the learned list": "Διαμεσολαβητές που έχουν μαθευτεί. Συντηρούνται αυτόματα· καθαρίστε το για επαναφορά της λίστας"
"Default role. Defaults to the Normal User role": "Προεπιλεγμένος ρόλος. Προεπιλογή ο ρόλος Κανονικός χρήστης"
"Allow password sign-in. Allows signing in with a username and password": "Να επιτρέπεται σύνδεση με κωδικό πρόσβασης. Επιτρέπει τη σύνδεση με όνομα χρήστη και κωδικό πρόσβασης"
"Allow plain-text passwords. Default true for legacy clients; false forces Challenge-Response encrypted passwords": "Να επιτρέπονται κωδικοί πρόσβασης σε απλό κείμενο. Προεπιλογή true για παλιούς πελάτες· το false επιβάλλει κρυπτογραφημένους κωδικούς Challenge-Response"
"Allow registration. Allows registering with a username and password": "Να επιτρέπεται εγγραφή. Επιτρέπει την εγγραφή με όνομα χρήστη και κωδικό πρόσβασης"
"Auto registration. Default true; after SSO sign-in an unknown local user is registered automatically. Enabled when either the global or the OAuth app setting is on": "Αυτόματη εγγραφή. Προεπιλογή true· μετά τη σύνδεση μέσω SSO ένας άγνωστος τοπικός χρήστης καταχωρίζεται αυτόματα. Ενεργό όταν η καθολική ρύθμιση ή η ρύθμιση της εφαρμογής OAuth είναι ενεργοποιημένη"
"Password complexity check. When enabled the sign-in page validates password strength; when disabled it only requires a non-empty password. Default true": "Έλεγχος πολυπλοκότητας κωδικού πρόσβασης. Όταν είναι ενεργός, η σελίδα σύνδεσης επικυρώνει την ισχύ του κωδικού· όταν είναι ανενεργός, απαιτεί μόνο μη κενό κωδικό. Προεπιλογή true"
"Login failure limit. Bans sign-in after this many consecutive failures for the same user or IP, default 5": "Όριο αποτυχιών σύνδεσης. Αποκλείει τη σύνδεση μετά από αυτόν τον αριθμό διαδοχικών αποτυχιών για τον ίδιο χρήστη ή IP, προεπιλογή 5"
"Login ban duration. Seconds a risk-control ban lasts, default 300": "Διάρκεια αποκλεισμού σύνδεσης. Δευτερόλεπτα διάρκειας αποκλεισμού ελέγχου κινδύνου, προεπιλογή 300"
"Class C subnet ban threshold. Bans a /24 subnet such as 103.125.146.* after this many failures, default 10; 0 disables": "Όριο αποκλεισμού υποδικτύου κατηγορίας C. Αποκλείει ένα υποδίκτυο /24 όπως 103.125.146.* μετά από αυτόν τον αριθμό αποτυχιών, προεπιλογή 10· το 0 το απενεργοποιεί"
"Class B subnet ban threshold. Bans a /16 subnet such as 103.125.*.* after this many failures, default 20; 0 disables": "Όριο αποκλεισμού υποδικτύου κατηγορίας B. Αποκλείει ένα υποδίκτυο /16 όπως 103.125.*.* μετά από αυτόν τον αριθμό αποτυχιών, προεπιλογή 20· το 0 το απενεργοποιεί"
"Force bind by user name. Binds SSO users to local users with the same name without a provider prefix; intended for user centers": "Αναγκαστική σύνδεση με όνομα χρήστη. Συνδέει χρήστες SSO με τοπικούς χρήστες με το ίδιο όνομα χωρίς πρόθεμα παρόχου· προορίζεται για κέντρα χρηστών"
"Bind by user code. Binds SSO users to local users by user code": "Σύνδεση με κωδικό χρήστη. Συνδέει χρήστες SSO με τοπικούς χρήστες με κωδικό χρήστη"
"Bind by mobile. Binds SSO users to local users by mobile number": "Σύνδεση με κινητό. Συνδέει χρήστες SSO με τοπικούς χρήστες με αριθμό κινητού"
"Bind by email. Binds SSO users to local users by email": "Σύνδεση με email. Συνδέει χρήστες SSO με τοπικούς χρήστες με email"
"Bind by nickname. Binds SSO users to local users by nickname; suitable for internal SSO, not for social networks with many duplicate names": "Σύνδεση με ψευδώνυμο. Συνδέει χρήστες SSO με τοπικούς χρήστες με ψευδώνυμο· κατάλληλο για εσωτερικό SSO, όχι για κοινωνικά δίκτυα με πολλά διπλά ονόματα"
"Use SSO roles. Keeps SSO roles after sign-in, default true; otherwise DefaultRole is used": "Χρήση ρόλων SSO. Διατηρεί τους ρόλους SSO μετά τη σύνδεση, προεπιλογή true· διαφορετικά χρησιμοποιείται το DefaultRole"
"Use SSO departments. Keeps SSO departments after sign-in, default true": "Χρήση τμημάτων SSO. Διατηρεί τα τμήματα SSO μετά τη σύνδεση, προεπιλογή true"
"SSO role rules. Automatically upgrades the primary role after SSO sign-in; separate rules with commas. Format: source role+department wildcard=target role, for example Guest+Route*=Route Specialist": "Κανόνες ρόλων SSO. Αναβαθμίζει αυτόματα τον κύριο ρόλο μετά τη σύνδεση μέσω SSO· διαχωρίστε τους κανόνες με κόμματα. Μορφή: ρόλος πηγής+wildcard τμήματος=ρόλος προορισμού, για παράδειγμα Guest+Route*=Ειδικός διαδρομών"
"Sign out everywhere. false signs out of this site only; true (default) also signs out of the SSO server": "Αποσύνδεση από παντού. Το false αποσυνδέει μόνο από αυτόν τον ιστότοπο· το true (προεπιλογή) αποσυνδέει και από τον διακομιστή SSO"
"Allow multi-device sign-in. false kicks old devices on a new sign-in and revokes all tokens on sign-out; true (default) revokes only the current session": "Να επιτρέπεται σύνδεση από πολλές συσκευές. Το false αποσυνδέει τις παλιές συσκευές σε νέα σύνδεση και ανακαλεί όλα τα διακριτικά κατά την αποσύνδεση· το true (προεπιλογή) ανακαλεί μόνο την τρέχουσα συνεδρία"
"Session timeout. Session lifetime after SSO sign-in during which the cookie can sign in again; default 0s": "Λήξη συνεδρίας. Διάρκεια ζωής της συνεδρίας μετά τη σύνδεση μέσω SSO κατά την οποία το cookie μπορεί να συνδεθεί ξανά· προεπιλογή 0s"
"Token sliding refresh threshold. Refreshes the JWT and rewrites the cookie when its remaining lifetime falls below this many seconds; 0 disables sliding expiration": "Όριο ολισθαίνουσας ανανέωσης διακριτικού. Ανανεώνει το JWT και ξαναγράφει το cookie όταν ο υπολειπόμενος χρόνος ζωής πέσει κάτω από αυτά τα δευτερόλεπτα· το 0 απενεργοποιεί την ολισθαίνουσα λήξη"
"User refresh period. Fetches user information once per period across SSO sign-ins, default 600 seconds": "Περίοδος ανανέωσης χρήστη. Λαμβάνει τις πληροφορίες χρήστη μία φορά ανά περίοδο μεταξύ συνδέσεων SSO, προεπιλογή 600 δευτερόλεπτα"
"JWT secret. Algorithm and key used to sign JWTs, such as HS256:ABCD1234": "Μυστικό JWT. Αλγόριθμος και κλειδί για την υπογραφή των JWT, όπως HS256:ABCD1234"
"Token lifetime. Lifetime of the access token in seconds, default 7200": "Διάρκεια ζωής διακριτικού. Διάρκεια ζωής του διακριτικού πρόσβασης σε δευτερόλεπτα, προεπιλογή 7200"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default true": "Αποθήκευση διακριτικού σε cookie. Διαβάζει το διακριτικό από το cookie όταν η κεφαλίδα αιτήματος δεν το φέρει, προεπιλογή true"
"Validate attachment access. Requires sign-in to access attachments, default true": "Επικύρωση πρόσβασης σε συνημμένα. Απαιτεί σύνδεση για πρόσβαση στα συνημμένα, προεπιλογή true"
"Public attachment categories. Categories accessible without sign-in, comma-separated, such as markdown,avatar. Applies when ValidateAttachment is true": "Δημόσιες κατηγορίες συνημμένων. Κατηγορίες προσβάσιμες χωρίς σύνδεση, χωρισμένες με κόμμα, όπως markdown,avatar. Ισχύει όταν το ValidateAttachment είναι true"
"Private attachment categories. Categories only the uploader can access, comma-separated. Applies when ValidateAttachment is true": "Ιδιωτικές κατηγορίες συνημμένων. Κατηγορίες στις οποίες έχει πρόσβαση μόνο ο χρήστης που ανέβασε, χωρισμένες με κόμμα. Ισχύει όταν το ValidateAttachment είναι true"
"SSO redirect allowlist. Domains allowed to receive the JWT after sign-in, comma-separated with wildcard prefixes such as *.company.com. Empty allows the same site only; other origins are rejected and sent back to the home page": "Λίστα επιτρεπόμενων ανακατευθύνσεων SSO. Τομείς που επιτρέπεται να λάβουν το JWT μετά τη σύνδεση, χωρισμένοι με κόμμα με προθέματα wildcard όπως *.company.com. Κενό επιτρέπει μόνο τον ίδιο ιστότοπο· άλλες προελεύσεις απορρίπτονται και επιστρέφουν στην αρχική σελίδα"
"External authentication URL. When local authentication fails, credentials are verified by this endpoint; on success the local user is created or updated and signed in": "URL εξωτερικής επαυθεντικοποίησης. Όταν η τοπική επαυθεντικοποίηση αποτυγχάνει, τα διαπιστευτήρια επαληθεύονται από αυτό το endpoint· σε περίπτωση επιτυχίας ο τοπικός χρήστης δημιουργείται ή ενημερώνεται και συνδέεται"
"Start page. First content page opened after entering the admin console": "Αρχική σελίδα. Η πρώτη σελίδα περιεχομένου που ανοίγει μετά την είσοδο στην κονσόλα διαχείρισης"
"Theme. Content page theme, ACE/layui": "Θέμα. Θέμα σελίδας περιεχομένου, ACE/layui"
"Skin. Outer frame layout, ACE/layui": "Εμφάνιση. Διάταξη εξωτερικού πλαισίου, ACE/layui"
"Login tip. Empty hides the tip on the sign-in page": "Συμβουλή σύνδεσης. Κενό κρύβει τη συμβουλή στη σελίδα σύνδεσης"
"Login logo. Empty uses the default logo": "Λογότυπο σύνδεσης. Κενό χρησιμοποιεί το προεπιλεγμένο λογότυπο"
"Login background. Image URL; empty uses the default background": "Φόντο σύνδεσης. URL εικόνας· κενό χρησιμοποιεί το προεπιλεγμένο φόντο"
"Form group layout. 3/2/1 columns on large/medium/small screens, form-group col-xs-12 col-sm-6 col-lg-4": "Διάταξη ομάδας φόρμας. 3/2/1 στήλες σε μεγάλες/μεσαίες/μικρές οθόνες, form-group col-xs-12 col-sm-6 col-lg-4"
"Bootstrap select. Nicer drop-downs with a rendering cost": "Bootstrap select. Πιο όμορφα αναπτυσσόμενα μενού με κόστος απόδοσης"
"Maximum drop-down items. Maximum options in a related drop-down on forms, default 50; larger lists fall back to a text box": "Μέγιστα στοιχεία αναπτυσσόμενου μενού. Μέγιστες επιλογές σε σχετικό αναπτυσσόμενο μενού στις φόρμες, προεπιλογή 50· οι μεγαλύτερες λίστες εμφανίζονται σε πλαίσιο κειμένου"
"Copyright. Empty hides the copyright; variables now/runtime/framework are supported, and now accepts formats such as {now:yyyy}": "Πνευματικά δικαιώματα. Κενό κρύβει τα πνευματικά δικαιώματα· υποστηρίζονται οι μεταβλητές now/runtime/framework και το now δέχεται μορφές όπως {now:yyyy}"
"Filing number. Empty hides the filing information": "Αριθμός καταχώρισης. Κενό κρύβει τις πληροφορίες καταχώρισης"
"Enable new UI": "Ενεργοποίηση νέας διεπαφής"
"ECharts theme. Chart theme": "Θέμα ECharts. Θέμα γραφημάτων"
"Title suffix. Appends the system name to page titles, default true": "Επίθημα τίτλου. Προσθέτει το όνομα του συστήματος στους τίτλους σελίδων, προεπιλογή true"
"Table double-click. Enables row double-click on list pages, default true": "Διπλό κλικ πίνακα. Ενεργοποιεί το διπλό κλικ στις γραμμές των σελίδων λίστας, προεπιλογή true"
"Table style. Light: minimal thin lines; Standard: clear row lines (default); Grid: full cell borders": "Στυλ πίνακα. Ελαφρύ: ελάχιστες λεπτές γραμμές· Τυπικό: καθαρές γραμμές σειρών (προεπιλογή)· Πλέγμα: πλήρη περιγράμματα κελιών"
"Table density. Compact: dense and information-rich (default); Normal: relaxed": "Πυκνότητα πίνακα. Συμπαγής: πυκνή και πλούσια σε πληροφορίες (προεπιλογή)· Κανονική: άνετη"
"Stardust web. Stardust console URL; supports direct links to /trace?id={traceId} or /graph?id={traceId}": "Stardust web. URL της κονσόλας Stardust· υποστηρίζει απευθείας συνδέσμους προς /trace?id={traceId} ή /graph?id={traceId}"
"AI master switch. Enables AI features such as log analysis and notification polishing, default false": "Γενικός διακόπτης AI. Ενεργοποιεί λειτουργίες AI όπως ανάλυση αρχείων καταγραφής και βελτίωση ειδοποιήσεων, προεπιλογή false"
"AI provider. Supports NewLife, Ollama, DeepSeek, DashScope, OpenAI and others; default NewLife": "Πάροχος AI. Υποστηρίζει NewLife, Ollama, DeepSeek, DashScope, OpenAI και άλλους· προεπιλογή NewLife"
"AI endpoint. Defaults to https://ai.newlifex.com for NewLife": "Endpoint AI. Προεπιλογή https://ai.newlifex.com για το NewLife"
"AI ApiKey. Defaults to sk-CubeAI2026 for NewLife": "ApiKey AI. Προεπιλογή sk-CubeAI2026 για το NewLife"
"AI default model. Defaults to newlife-flash for NewLife": "Προεπιλεγμένο μοντέλο AI. Προεπιλογή newlife-flash για το NewLife"
"AI default deep reasoning. Enables think mode for analysis and chat by default; false means fast responses": "Προεπιλεγμένη βαθιά συλλογιστική AI. Ενεργοποιεί εξ ορισμού τη λειτουργία σκέψης για ανάλυση και συνομιλία· το false σημαίνει γρήγορες απαντήσεις"
"AI color scheme. Fills the primary and secondary colors from a preset": "Σχήμα χρωμάτων AI. Συμπληρώνει τα κύρια και δευτερεύοντα χρώματα από μια προεπιλογή"
"AI primary color. Main color of the launcher, panel header and user bubbles; default NewLife green #2ecc71": "Κύριο χρώμα AI. Κύριο χρώμα του εκκινητή, της κεφαλίδας του πίνακα και των φυσαλίδων χρήστη· προεπιλογή πράσινο NewLife #2ecc71"
"AI secondary color. Gradient end color, default dark green #1e8e3e": "Δευτερεύον χρώμα AI. Χρώμα τέλους διαβάθμισης, προεπιλογή σκούρο πράσινο #1e8e3e"
"OAuth server. Enables the OAuth 2.0 server that provides SSO for other applications": "Διακομιστής OAuth. Ενεργοποιεί τον διακομιστή OAuth 2.0 που παρέχει SSO σε άλλες εφαρμογές"
"File manager. Enables backend file management (browse, upload, download, delete); this carries security risks": "Διαχειριστής αρχείων. Ενεργοποιεί τη διαχείριση αρχείων στο back-end (περιήγηση, μεταφόρτωση, λήψη, διαγραφή)· αυτό συνεπάγεται κινδύνους ασφαλείας"
"Multi-tenancy. Enables tenants; tenant mode cannot access system administration and platform mode cannot access tenant pages": "Πολλαπλοί ενοικιαστές. Ενεργοποιεί τους ενοικιαστές· η λειτουργία ενοικιαστή δεν έχει πρόσβαση στη διαχείριση συστήματος και η λειτουργία πλατφόρμας δεν έχει πρόσβαση στις σελίδες ενοικιαστή"
"Tenant query policy. DenyWithEmpty: return an empty set without tenant context; ThrowOnMissingTenant: throw an explicit error": "Πολιτική ερωτημάτων ενοικιαστή. DenyWithEmpty: επιστρέφει κενό σύνολο χωρίς περιβάλλον ενοικιαστή· ThrowOnMissingTenant: πετά ρητό σφάλμα"
"User online. 0: do not record; 1: signed-in users only; 2: all visitors (default)": "Χρήστες σε σύνδεση. 0: χωρίς καταγραφή· 1: μόνο συνδεδεμένοι χρήστες· 2: όλοι οι επισκέπτες (προεπιλογή)"
"User statistics. Records user visits, default true": "Στατιστικά χρηστών. Καταγράφει τις επισκέψεις χρηστών, προεπιλογή true"
"Enable SMS. SMS verification codes and system notifications, default false": "Ενεργοποίηση SMS. Κωδικοί επαλήθευσης και ειδοποιήσεις συστήματος μέσω SMS, προεπιλογή false"
"Enable email. Email verification codes and system notifications, default false": "Ενεργοποίηση email. Κωδικοί επαλήθευσης και ειδοποιήσεις συστήματος μέσω email, προεπιλογή false"
"Require email verification. Users must activate their email before signing in and must provide one when registering, default false": "Απαίτηση επαλήθευσης email. Οι χρήστες πρέπει να ενεργοποιήσουν το email πριν από τη σύνδεση και να δηλώσουν ένα κατά την εγγραφή, προεπιλογή false"
"Require mobile verification. Users must activate their mobile before signing in and must provide one when registering, default false": "Απαίτηση επαλήθευσης κινητού. Οι χρήστες πρέπει να ενεργοποιήσουν το κινητό πριν από τη σύνδεση και να δηλώσουν ένα κατά την εγγραφή, προεπιλογή false"
"Captcha scenarios. Bit mask: 0: off; 1: sign-in; 2: registration; 4: verification code requests (anti-SMS-bombing); combine with 3 for sign-in and registration. Mandatory scenarios are never exempted, default 0": "Σενάρια captcha. Μάσκα bit: 0: ανενεργό· 1: σύνδεση· 2: εγγραφή· 4: αιτήματα κωδικού επαλήθευσης (anti-SMS-bombing)· συνδυάστε με 3 για σύνδεση και εγγραφή. Τα υποχρεωτικά σενάρια δεν εξαιρούνται ποτέ, προεπιλογή 0"
"Risk-adaptive captcha. Disabled when CaptchaScene is 0; when enabled it detects unsafe environments and requires a captcha, default true": "Προσαρμοζόμενο στον κίνδυνο captcha. Ανενεργό όταν το CaptchaScene είναι 0· όταν είναι ενεργό, ανιχνεύει μη ασφαλή περιβάλλοντα και απαιτεί captcha, προεπιλογή true"
"Captcha risk threshold. Requires a captcha when the risk score reaches this value: 0: intranet; 1: internet; 2: internet with recent failures; 3: banned. Default 2": "Όριο κινδύνου captcha. Απαιτεί captcha όταν η βαθμολογία κινδύνου φτάσει αυτή την τιμή: 0: intranet· 1: internet· 2: internet με πρόσφατες αποτυχίες· 3: αποκλεισμένος. Προεπιλογή 2"
"Trusted device lifetime. Days during which previously successful devices skip adaptive captchas, default 30": "Διάρκεια ζωής έμπιστων συσκευών. Ημέρες κατά τις οποίες συσκευές με προηγούμενη επιτυχή σύνδεση παρακάμπτουν το προσαρμοζόμενο captcha, προεπιλογή 30"
"Enable MFA. Allows users to enable TOTP multi-factor authentication; an enhanced feature, default false": "Ενεργοποίηση MFA. Επιτρέπει στους χρήστες να ενεργοποιήσουν τον πολυπαραγοντικό έλεγχο ταυτότητας TOTP· μια προηγμένη λειτουργία, προεπιλογή false"
"File storage serving. Responds to file download requests from other nodes, default true": "Εξυπηρέτηση αποθήκευσης αρχείων. Απαντά σε αιτήματα λήψης αρχείων από άλλους κόμβους, προεπιλογή true"
"File storage fetch. Pulls new files published by other nodes, default true": "Ανάκτηση από την αποθήκευση αρχείων. Αντλεί νέα αρχεία που δημοσιεύουν άλλοι κόμβοι, προεπιλογή true"
"File fetch timeout. Maximum milliseconds to wait for other nodes when a file is missing locally, default 5000": "Λήξη ανάκτησης αρχείων. Μέγιστα χιλιοστά του δευτερολέπτου αναμονής για άλλους κόμβους όταν ένα αρχείο λείπει τοπικά, προεπιλογή 5000"
"Attachment storage. Local disk, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu or EasyIO; default Local": "Αποθήκευση συνημμένων. Τοπικός δίσκος, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu ή EasyIO· προεπιλογή Local"
"Object storage server. S3-compatible endpoint for OSS/COS/Qiniu, such as oss-cn-beijing.aliyuncs.com": "Διακομιστής αποθήκευσης αντικειμένων. Endpoint συμβατό με S3 για OSS/COS/Qiniu, όπως oss-cn-beijing.aliyuncs.com"
"Object storage bucket. Bucket name for OSS/COS/Qiniu": "Κάδος αποθήκευσης αντικειμένων. Όνομα κάδου για OSS/COS/Qiniu"
"Object storage region. S3 signing scope, such as cn-beijing / ap-beijing / cn-east-1": "Περιοχή αποθήκευσης αντικειμένων. Πεδίο υπογραφής S3, όπως cn-beijing / ap-beijing / cn-east-1"
"Object storage app ID. AccessKeyId": "ID εφαρμογής αποθήκευσης αντικειμένων. AccessKeyId"
"Object storage app secret. AccessKeySecret": "Μυστικό εφαρμογής αποθήκευσης αντικειμένων. AccessKeySecret"
"Data retention. Days to keep audit and OAuth logs, default 30": "Διατήρηση δεδομένων. Ημέρες διατήρησης αρχείων καταγραφής ελέγχου και OAuth, προεπιλογή 30"
"File retention. Days to keep backup files, default 15": "Διατήρηση αρχείων. Ημέρες διατήρησης αρχείων αντιγράφων ασφαλείας, προεπιλογή 15"
"Retention size floor. Files smaller than this (KB) are never deleted even after the retention period, default 1024K": "Κατώτατο όριο μεγέθους διατήρησης. Τα αρχεία μικρότερα από αυτή την τιμή (KB) δεν διαγράφονται ποτέ, ακόμη και μετά την περίοδο διατήρησης, προεπιλογή 1024K"
"Maximum export rows. Maximum rows a page may export, default 10_000_000": "Μέγιστες γραμμές εξαγωγής. Μέγιστες γραμμές που μπορεί να εξαγάγει μια σελίδα, προεπιλογή 10_000_000"
"Maximum backup rows. Maximum rows a page may back up, default 10_000_000": "Μέγιστες γραμμές αντιγράφου ασφαλείας. Μέγιστες γραμμές που μπορεί να αντιγράψει μια σελίδα, προεπιλογή 10_000_000"
"API prefixes. Comma- or semicolon-separated prefixes such as /api,/api/v1; matching requests are forwarded to the real route without the prefix": "Προθέματα API. Προθέματα χωρισμένα με κόμμα ή ερωτηματικό, όπως /api,/api/v1· τα αντίστοιχα αιτήματα προωθούνται στην πραγματική διαδρομή χωρίς το πρόθεμα"
"Password strength. * means unrestricted; by default at least 8 characters with digits, upper/lower case letters and symbols. Simple form: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$": "Ισχύς κωδικού πρόσβασης. Το * σημαίνει χωρίς περιορισμούς· εξ ορισμού τουλάχιστον 8 χαρακτήρες με ψηφία, πεζά/κεφαλαία γράμματα και σύμβολα. Απλή μορφή: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$"
"Cookie mode. Default SameSite mode for token cookies (-1 Unspecified, 0 None, 1 Lax, 2 Strict)": "Λειτουργία cookie. Προεπιλεγμένη λειτουργία SameSite για cookie διακριτικών (-1 Unspecified, 0 None, 1 Lax, 2 Strict)"
"Cookie domain. Writes cookies to a parent domain; empty uses the current domain. A top-level domain requires HTTPS and prevents plain HTTP from writing same-name keys on the local domain": "Τομέας cookie. Γράφει cookie σε γονικό τομέα· κενό χρησιμοποιεί τον τρέχοντα τομέα. Ο τομέας ανώτατου επιπέδου απαιτεί HTTPS και εμποδίζει το απλό HTTP να γράψει κλειδιά με το ίδιο όνομα στον τοπικό τομέα"
"Activation URL. Front-end activation page URL used in email activation links, such as https://xxx/activate; empty builds /activate from the request host": "URL ενεργοποίησης. URL της σελίδας ενεργοποίησης στο front-end που χρησιμοποιείται στους συνδέσμους ενεργοποίησης email, όπως https://xxx/activate· κενό δημιουργεί το /activate από τον host του αιτήματος"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default false": "Αποθήκευση διακριτικού σε cookie. Διαβάζει το διακριτικό από το cookie όταν η κεφαλίδα αιτήματος δεν το φέρει, προεπιλογή false"
"Password strength. * means unrestricted; the simple form defaults to 5 to 32 characters of any type. The full form requires at least 8 characters with digits, upper/lower case letters and symbols: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$": "Ισχύς κωδικού πρόσβασης. Το * σημαίνει χωρίς περιορισμούς· η απλή μορφή χρησιμοποιεί εξ ορισμού 5 έως 32 χαρακτήρες οποιουδήποτε τύπου. Η πλήρης μορφή απαιτεί τουλάχιστον 8 χαρακτήρες με ψηφία, πεζά/κεφαλαία γράμματα και σύμβολα: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$"
