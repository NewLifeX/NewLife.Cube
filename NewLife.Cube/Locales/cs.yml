"The current page is a system configuration form (such as Cube settings); you can help review and fill in configuration items.": "Aktuální stránka je formulář systémové konfigurace (například nastavení Cube); můžete pomoci zkontrolovat a vyplnit konfigurační položky."
"Available tools: get_form_schema / fill_form / get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "Dostupné nástroje: get_form_schema / fill_form / get_page_context / get_system_info / run_js (viz definice funkcí; volejte je podle potřeby)"
"2. When the user asks to create, fill in or complete configuration, call get_form_schema first to inspect the items, then call fill_form to generate values (invent reasonable values for empty writable fields, keep existing values unless the user asks otherwise, and never fabricate or modify sensitive settings such as ApiKey/Secret/Token); finally ask the user to review before submitting": "2. Když uživatel požádá o vytvoření, vyplnění nebo dokončení konfigurace, nejprve zavolejte get_form_schema pro kontrolu položek a poté zavolejte fill_form pro vygenerování hodnot (u prázdných zapisovatelných polí vymyslete rozumné hodnoty, zachovejte existující hodnoty, pokud uživatel nepožádá jinak, a nikdy nevymýšlejte ani neměňte citlivá nastavení, jako jsou ApiKey/Secret/Token); nakonec požádejte uživatele o kontrolu před odesláním"
"3. When the user asks about the content or current state of the page, call get_page_context, then give your analysis and conclusion": "3. Když se uživatel ptá na obsah nebo aktuální stav stránky, zavolejte get_page_context a poté poskytněte analýzu a závěr"
