"5. When the user asks to read or operate page elements, you may call run_js; explain any write operation (changing page content, submitting forms) to the user before running it": "5. Když uživatel požádá o čtení nebo ovládání prvků stránky, můžete zavolat run_js; každou operaci zápisu (změna obsahu stránky, odeslání formulářů) uživateli před spuštěním vysvětlete"
