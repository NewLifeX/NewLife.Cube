"Avatar directory. Downloads remote avatars locally; defaults to the Avatars subdirectory, or Avatars next to the web root. Empty disables downloading": "Adresář avatarů. Stahuje vzdálené avatary lokálně; výchozí je podadresář Avatars nebo Avatars vedle webového kořene. Prázdná hodnota stahování zakáže"
"Text avatar characters. Generates an SVG text avatar when no image exists; 1 to 3 characters. Uses the first N Chinese characters to keep the surname, or the initials of English words. Default 2": "Znaky textového avatara. Vytvoří textový avatar SVG, pokud obrázek neexistuje; 1 až 3 znaky. Používá prvních N čínských znaků pro zachování příjmení nebo iniciály anglických slov. Výchozí 2"
"Upload directory. Defaults to Uploads": "Adresář pro nahrávání. Výchozí Uploads"
"Web root directory. Defaults to wwwroot": "Adresář webového kořene. Výchozí wwwroot"
"Resource URL. CDN base such as https://sso.newlifex.com/content/; empty uses local resources": "URL zdrojů. Základ CDN, například https://sso.newlifex.com/content/; prázdná hodnota používá místní zdroje"
"CORS origins. Other origins allowed to access this site; * allows any origin": "Původy CORS. Další původy s povoleným přístupem k tomuto webu; * povoluje všechny původy"
"Iframe embedding. Empty allows the same domain only; SAMEORIGIN allows the same domain and port; ALLOWALL allows any domain": "Vkládání do iframe. Prázdná hodnota povoluje pouze stejnou doménu; SAMEORIGIN povoluje stejnou doménu a port; ALLOWALL povoluje všechny domény"
"Share expiration. Lifetime of share tokens in seconds, default 7200": "Vypršení sdílení. Životnost tokenů sdílení v sekundách, výchozí 7200"
"Bot error code. Returns this error for crawlers, such as 404/500; 0 disables blocking": "Kód chyby pro roboty. Vrací tuto chybu pro crawlery, například 404/500; 0 blokování vypne"
"Force redirect. Target scheme and host for GET requests; * is supported in the host. Commonly used to force HTTPS, such as https://*:8081": "Vynucené přesměrování. Cílové schéma a hostitel pro požadavky GET; * je podporováno v hostiteli. Běžně se používá k vynucení HTTPS, například https://*:8081"
"Security mode. 0: off; 1: observe and log only; 2: block; 3: automatic (default; observes, bans repeated attackers, and temporarily blocks broad attacks with automatic rollback)": "Bezpečnostní režim. 0: vypnuto; 1: pouze sledovat a zapisovat; 2: blokovat; 3: automatický (výchozí; sleduje, blokuje opakované útočníky a dočasně blokuje rozsáhlé útoky s automatickým vrácením)"
"Auto-ban durations. Comma-separated seconds that increase with each trigger; empty uses 60,300,1800,7200,86400": "Doby automatického blokování. Sekundy oddělené čárkou, které se při každém spuštění zvyšují; prázdná hodnota používá 60,300,1800,7200,86400"
"Trusted proxies. Forwarded headers are only trusted from these comma-separated IPs or CIDR ranges; empty keeps the legacy behavior of trusting all forwarded headers": "Důvěryhodné proxy. Předávané hlavičky jsou přijímány pouze z těchto IP adres nebo rozsahů CIDR oddělených čárkou; prázdná hodnota zachovává původní chování, kdy se přijímají všechny předávané hlavičky"
"Trusted proxy learning limit. When no trusted proxies are configured, private direct sources that send forwarded headers are learned up to this count; 0 disables learning (typically 2 for one data center, 4 for two)": "Limit učení důvěryhodných proxy. Pokud nejsou nakonfigurovány žádné důvěryhodné proxy, učí se soukromé přímé zdroje, které odesílají předávané hlavičky, až do tohoto počtu; 0 učení vypne (obvykle 2 pro jedno datové centrum, 4 pro dvě)"
"Learned proxies. Maintained automatically; clear it to reset the learned list": "Naučené proxy. Udržují se automaticky; vymažte je pro resetování naučeného seznamu"
"Default role. Defaults to the Normal User role": "Výchozí role. Výchozí je role Běžný uživatel"
"Allow password sign-in. Allows signing in with a username and password": "Povolit přihlášení heslem. Povoluje přihlášení uživatelským jménem a heslem"
"Allow plain-text passwords. Default true for legacy clients; false forces Challenge-Response encrypted passwords": "Povolit hesla v čitelném textu. Výchozí true pro starší klienty; false vynucuje hesla šifrovaná pomocí Challenge-Response"
"Allow registration. Allows registering with a username and password": "Povolit registraci. Povoluje registraci uživatelským jménem a heslem"
"Auto registration. Default true; after SSO sign-in an unknown local user is registered automatically. Enabled when either the global or the OAuth app setting is on": "Automatická registrace. Výchozí true; po přihlášení SSO se neznámý místní uživatel zaregistruje automaticky. Zapnuto, pokud je zapnuto globální nastavení nebo nastavení aplikace OAuth"
"Password complexity check. When enabled the sign-in page validates password strength; when disabled it only requires a non-empty password. Default true": "Kontrola složitosti hesla. Je-li zapnuta, přihlašovací stránka ověřuje sílu hesla; je-li vypnuta, vyžaduje pouze neprázdné heslo. Výchozí true"
"Login failure limit. Bans sign-in after this many consecutive failures for the same user or IP, default 5": "Limit neúspěšných přihlášení. Po tomto počtu po sobě jdoucích selhání stejného uživatele nebo IP se přihlášení zablokuje, výchozí 5"
"Login ban duration. Seconds a risk-control ban lasts, default 300": "Doba blokace přihlášení. Počet sekund, po které trvá blokace rizikové kontroly, výchozí 300"
"Class C subnet ban threshold. Bans a /24 subnet such as 103.125.146.* after this many failures, default 10; 0 disables": "Práh blokace podsítě třídy C. Po tomto počtu selhání zablokuje podsíť /24, například 103.125.146.*, výchozí 10; 0 vypne"
"Class B subnet ban threshold. Bans a /16 subnet such as 103.125.*.* after this many failures, default 20; 0 disables": "Práh blokace podsítě třídy B. Po tomto počtu selhání zablokuje podsíť /16, například 103.125.*.*, výchozí 20; 0 vypne"
"Force bind by user name. Binds SSO users to local users with the same name without a provider prefix; intended for user centers": "Vynutit propojení podle uživatelského jména. Propojuje uživatele SSO s místními uživateli stejného jména bez předpony poskytovatele; určeno pro uživatelská centra"
"Bind by user code. Binds SSO users to local users by user code": "Propojení podle kódu uživatele. Propojuje uživatele SSO s místními uživateli podle kódu uživatele"
"Bind by mobile. Binds SSO users to local users by mobile number": "Propojení podle mobilu. Propojuje uživatele SSO s místními uživateli podle mobilního čísla"
"Bind by email. Binds SSO users to local users by email": "Propojení podle e-mailu. Propojuje uživatele SSO s místními uživateli podle e-mailu"
"Bind by nickname. Binds SSO users to local users by nickname; suitable for internal SSO, not for social networks with many duplicate names": "Propojení podle přezdívky. Propojuje uživatele SSO s místními uživateli podle přezdívky; vhodné pro interní SSO, nikoli pro sociální sítě s mnoha stejnými jmény"
"Use SSO roles. Keeps SSO roles after sign-in, default true; otherwise DefaultRole is used": "Používat role SSO. Po přihlášení zachová role SSO, výchozí true; jinak se použije DefaultRole"
"Use SSO departments. Keeps SSO departments after sign-in, default true": "Používat oddělení SSO. Po přihlášení zachová oddělení SSO, výchozí true"
"SSO role rules. Automatically upgrades the primary role after SSO sign-in; separate rules with commas. Format: source role+department wildcard=target role, for example Guest+Route*=Route Specialist": "Pravidla rolí SSO. Po přihlášení SSO automaticky povýší primární roli; pravidla oddělte čárkami. Formát: zdrojová role+zástupný znak oddělení=cílová role, například Guest+Route*=Route Specialist"
"Sign out everywhere. false signs out of this site only; true (default) also signs out of the SSO server": "Odhlásit všude. false odhlásí pouze z tohoto webu; true (výchozí) odhlásí také ze serveru SSO"
"Allow multi-device sign-in. false kicks old devices on a new sign-in and revokes all tokens on sign-out; true (default) revokes only the current session": "Povolit přihlášení z více zařízení. false při novém přihlášení odpojí stará zařízení a při odhlášení odvolá všechny tokeny; true (výchozí) odvolá pouze aktuální relaci"
"Session timeout. Session lifetime after SSO sign-in during which the cookie can sign in again; default 0s": "Časový limit relace. Životnost relace po přihlášení SSO, během níž se cookie může znovu přihlásit; výchozí 0 s"
"Token sliding refresh threshold. Refreshes the JWT and rewrites the cookie when its remaining lifetime falls below this many seconds; 0 disables sliding expiration": "Práh posuvného obnovení tokenu. Obnoví JWT a přepíše cookie, když zbývající životnost klesne pod tento počet sekund; 0 posuvné vypršení vypne"
"User refresh period. Fetches user information once per period across SSO sign-ins, default 600 seconds": "Interval obnovy uživatele. Načítá informace o uživateli jednou za období napříč přihlášeními SSO, výchozí 600 sekund"
"JWT secret. Algorithm and key used to sign JWTs, such as HS256:ABCD1234": "Tajný klíč JWT. Algoritmus a klíč pro podepisování JWT, například HS256:ABCD1234"
"Token lifetime. Lifetime of the access token in seconds, default 7200": "Životnost tokenu. Životnost přístupového tokenu v sekundách, výchozí 7200"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default true": "Ukládat token do cookie. Přečte token z cookie, pokud jej hlavička požadavku neobsahuje, výchozí true"
"Validate attachment access. Requires sign-in to access attachments, default true": "Ověřovat přístup k přílohám. Pro přístup k přílohám vyžaduje přihlášení, výchozí true"
"Public attachment categories. Categories accessible without sign-in, comma-separated, such as markdown,avatar. Applies when ValidateAttachment is true": "Veřejné kategorie příloh. Kategorie dostupné bez přihlášení, oddělené čárkou, například markdown,avatar. Platí, když je ValidateAttachment true"
"Private attachment categories. Categories only the uploader can access, comma-separated. Applies when ValidateAttachment is true": "Soukromé kategorie příloh. Kategorie, ke kterým má přístup pouze nahrávající, oddělené čárkou. Platí, když je ValidateAttachment true"
"SSO redirect allowlist. Domains allowed to receive the JWT after sign-in, comma-separated with wildcard prefixes such as *.company.com. Empty allows the same site only; other origins are rejected and sent back to the home page": "Seznam povolených přesměrování SSO. Domény, které mohou po přihlášení obdržet JWT, oddělené čárkou s předponami zástupných znaků, například *.company.com. Prázdná hodnota povoluje pouze stejný web; ostatní původy jsou odmítnuty a vráceny na domovskou stránku"
"External authentication URL. When local authentication fails, credentials are verified by this endpoint; on success the local user is created or updated and signed in": "URL externího ověřování. Pokud místní ověření selže, přihlašovací údaje se ověří na tomto koncovém bodu; při úspěchu se místní uživatel vytvoří nebo aktualizuje a přihlásí"
"Start page. First content page opened after entering the admin console": "Úvodní stránka. První stránka s obsahem otevřená po vstupu do konzoly správy"
"Theme. Content page theme, ACE/layui": "Motiv. Motiv stránky s obsahem, ACE/layui"
"Skin. Outer frame layout, ACE/layui": "Vzhled. Rozvržení vnějšího rámce, ACE/layui"
"Login tip. Empty hides the tip on the sign-in page": "Nápověda k přihlášení. Prázdná hodnota skryje nápovědu na přihlašovací stránce"
"Login logo. Empty uses the default logo": "Logo přihlášení. Prázdná hodnota použije výchozí logo"
"Login background. Image URL; empty uses the default background": "Pozadí přihlášení. URL obrázku; prázdná hodnota použije výchozí pozadí"
"Form group layout. 3/2/1 columns on large/medium/small screens, form-group col-xs-12 col-sm-6 col-lg-4": "Rozvržení skupiny formuláře. 3/2/1 sloupců na velkých/středních/malých obrazovkách, form-group col-xs-12 col-sm-6 col-lg-4"
"Bootstrap select. Nicer drop-downs with a rendering cost": "Bootstrap select. Hezčí rozevírací seznamy za cenu výkonu při vykreslování"
"Maximum drop-down items. Maximum options in a related drop-down on forms, default 50; larger lists fall back to a text box": "Maximální počet položek rozevíracího seznamu. Maximální počet možností v souvisejícím rozevíracím seznamu formuláře, výchozí 50; větší seznamy se zobrazí jako textové pole"
"Copyright. Empty hides the copyright; variables now/runtime/framework are supported, and now accepts formats such as {now:yyyy}": "Copyright. Prázdná hodnota skryje copyright; proměnné now/runtime/framework jsou podporovány a now přijímá formáty jako {now:yyyy}"
"Filing number. Empty hides the filing information": "Registrační číslo. Prázdná hodnota skryje informace o registraci"
"Enable new UI": "Povolit nové uživatelské rozhraní"
"ECharts theme. Chart theme": "Motiv ECharts. Motiv grafu"
"Title suffix. Appends the system name to page titles, default true": "Přípona titulku. Připojí název systému k titulkům stránek, výchozí true"
"Table double-click. Enables row double-click on list pages, default true": "Dvojklik v tabulce. Povolí dvojklik na řádcích na stránkách seznamu, výchozí true"
"Table style. Light: minimal thin lines; Standard: clear row lines (default); Grid: full cell borders": "Styl tabulky. Světlý: minimální tenké linky; Standardní: zřetelné linky řádků (výchozí); Mřížka: plné ohraničení buněk"
"Table density. Compact: dense and information-rich (default); Normal: relaxed": "Hustota tabulky. Kompaktní: husté a informačně bohaté (výchozí); Normální: volné"
"Stardust web. Stardust console URL; supports direct links to /trace?id={traceId} or /graph?id={traceId}": "Web Stardust. URL konzoly Stardust; podporuje přímé odkazy na /trace?id={traceId} nebo /graph?id={traceId}"
"AI master switch. Enables AI features such as log analysis and notification polishing, default false": "Hlavní přepínač AI. Povoluje funkce AI, jako je analýza protokolů a vylepšování oznámení, výchozí false"
"AI provider. Supports NewLife, Ollama, DeepSeek, DashScope, OpenAI and others; default NewLife": "Poskytovatel AI. Podporuje NewLife, Ollama, DeepSeek, DashScope, OpenAI a další; výchozí NewLife"
"AI endpoint. Defaults to https://ai.newlifex.com for NewLife": "Koncový bod AI. Výchozí je https://ai.newlifex.com pro NewLife"
"AI ApiKey. Defaults to sk-CubeAI2026 for NewLife": "ApiKey AI. Výchozí je sk-CubeAI2026 pro NewLife"
"AI default model. Defaults to newlife-flash for NewLife": "Výchozí model AI. Výchozí je newlife-flash pro NewLife"
"AI default deep reasoning. Enables think mode for analysis and chat by default; false means fast responses": "Výchozí hluboké uvažování AI. Povolí režim přemýšlení pro analýzu a chat ve výchozím nastavení; false znamená rychlé odpovědi"
"AI color scheme. Fills the primary and secondary colors from a preset": "Barevné schéma AI. Vyplní primární a sekundární barvu z předvolby"
"AI primary color. Main color of the launcher, panel header and user bubbles; default NewLife green #2ecc71": "Primární barva AI. Hlavní barva spouštěče, záhlaví panelu a bublin uživatele; výchozí zelená NewLife #2ecc71"
"AI secondary color. Gradient end color, default dark green #1e8e3e": "Sekundární barva AI. Koncová barva přechodu, výchozí tmavě zelená #1e8e3e"
"OAuth server. Enables the OAuth 2.0 server that provides SSO for other applications": "Server OAuth. Povolí server OAuth 2.0, který poskytuje SSO pro další aplikace"
"File manager. Enables backend file management (browse, upload, download, delete); this carries security risks": "Správce souborů. Povolí správu souborů v back-endu (procházení, nahrávání, stahování, mazání); přináší bezpečnostní rizika"
"Multi-tenancy. Enables tenants; tenant mode cannot access system administration and platform mode cannot access tenant pages": "Více tenantů. Povolí tenanty; režim tenanta nemá přístup ke správě systému a režim platformy nemá přístup ke stránkám tenanta"
"Tenant query policy. DenyWithEmpty: return an empty set without tenant context; ThrowOnMissingTenant: throw an explicit error": "Zásada dotazů tenanta. DenyWithEmpty: vrátí prázdnou množinu bez kontextu tenanta; ThrowOnMissingTenant: vyhodí explicitní chybu"
"User online. 0: do not record; 1: signed-in users only; 2: all visitors (default)": "Uživatelé online. 0: nezaznamenávat; 1: pouze přihlášení uživatelé; 2: všichni návštěvníci (výchozí)"
"User statistics. Records user visits, default true": "Statistiky uživatelů. Zaznamenává návštěvy uživatelů, výchozí true"
"Enable SMS. SMS verification codes and system notifications, default false": "Povolit SMS. Ověřování pomocí SMS"
"Enable email. Email verification codes and system notifications, default false": "Povolit e-mail. Ověřovací kódy e-mailem a systémová oznámení, výchozí false"
"Require email verification. Users must activate their email before signing in and must provide one when registering, default false": "Vyžadovat ověření e-mailu. Uživatelé musí před přihlášením aktivovat svůj e-mail a při registraci jej musí uvést, výchozí false"
"Require mobile verification. Users must activate their mobile before signing in and must provide one when registering, default false": "Vyžadovat ověření mobilu. Uživatelé musí před přihlášením aktivovat svůj mobil a při registraci jej musí uvést, výchozí false"
"Captcha scenarios. Bit mask: 0: off; 1: sign-in; 2: registration; 4: verification code requests (anti-SMS-bombing); combine with 3 for sign-in and registration. Mandatory scenarios are never exempted, default 0": "Scénáře captcha. Bitová maska: 0: vypnuto; 1: přihlášení; 2: registrace; 4: žádosti o ověřovací kód (anti-SMS-bombing); zkombinujte 3 pro přihlášení a registraci. Povinné scénáře nejsou nikdy vyjmuty, výchozí 0"
"Risk-adaptive captcha. Disabled when CaptchaScene is 0; when enabled it detects unsafe environments and requires a captcha, default true": "Rizikově adaptivní captcha. Vypnuta, když je CaptchaScene 0; je-li zapnuta, rozpoznává nezabezpečená prostředí a vyžaduje captcha, výchozí true"
"Captcha risk threshold. Requires a captcha when the risk score reaches this value: 0: intranet; 1: internet; 2: internet with recent failures; 3: banned. Default 2": "Rizikový práh captcha. Vyžaduje captcha, když skóre rizika dosáhne této hodnoty: 0: intranet; 1: internet; 2: internet s nedávnými selháními; 3: blokováno. Výchozí 2"
"Trusted device lifetime. Days during which previously successful devices skip adaptive captchas, default 30": "Životnost důvěryhodného zařízení. Počet dní, po které dříve úspěšná zařízení přeskakují adaptivní captcha, výchozí 30"
"Enable MFA. Allows users to enable TOTP multi-factor authentication; an enhanced feature, default false": "Povolit MFA. Umožňuje uživatelům zapnout vícefaktorové ověřování TOTP; rozšířená funkce, výchozí false"
"File storage serving. Responds to file download requests from other nodes, default true": "Poskytování úložiště souborů. Odpovídá na požadavky jiných uzlů na stažení souborů, výchozí true"
"File storage fetch. Pulls new files published by other nodes, default true": "Načítání z úložiště souborů. Stahuje nové soubory publikované jinými uzly, výchozí true"
"File fetch timeout. Maximum milliseconds to wait for other nodes when a file is missing locally, default 5000": "Časový limit načítání souborů. Maximální počet milisekund čekání na jiné uzly, když soubor chybí lokálně, výchozí 5000"
"Attachment storage. Local disk, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu or EasyIO; default Local": "Úložiště příloh. Místní disk, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu nebo EasyIO; výchozí Local"
"Object storage server. S3-compatible endpoint for OSS/COS/Qiniu, such as oss-cn-beijing.aliyuncs.com": "Server úložiště objektů. Koncový bod kompatibilní se S3 pro OSS/COS/Qiniu, například oss-cn-beijing.aliyuncs.com"
"Object storage bucket. Bucket name for OSS/COS/Qiniu": "Bucket úložiště objektů. Název bucketu pro OSS/COS/Qiniu"
"Object storage region. S3 signing scope, such as cn-beijing / ap-beijing / cn-east-1": "Oblast úložiště objektů. Rozsah podpisu S3, například cn-beijing / ap-beijing / cn-east-1"
"Object storage app ID. AccessKeyId": "ID aplikace úložiště objektů. AccessKeyId"
"Object storage app secret. AccessKeySecret": "Tajný klíč aplikace úložiště objektů. AccessKeySecret"
"Data retention. Days to keep audit and OAuth logs, default 30": "Uchovávání dat. Počet dní, po které se uchovávají protokoly auditu a OAuth, výchozí 30"
"File retention. Days to keep backup files, default 15": "Uchovávání souborů. Počet dní, po které se uchovávají soubory zálohy, výchozí 15"
"Retention size floor. Files smaller than this (KB) are never deleted even after the retention period, default 1024K": "Spodní hranice velikosti pro uchovávání. Soubory menší než tato hodnota (KB) se nikdy nesmažou, ani po uplynutí doby uchovávání, výchozí 1024K"
"Maximum export rows. Maximum rows a page may export, default 10_000_000": "Maximální počet řádků exportu. Maximální počet řádků, které může stránka exportovat, výchozí 10_000_000"
"Maximum backup rows. Maximum rows a page may back up, default 10_000_000": "Maximální počet řádků zálohy. Maximální počet řádků, které může stránka zálohovat, výchozí 10_000_000"
"API prefixes. Comma- or semicolon-separated prefixes such as /api,/api/v1; matching requests are forwarded to the real route without the prefix": "Předpony API. Předpony oddělené čárkou nebo středníkem, například /api,/api/v1; odpovídající požadavky se předávají skutečné trase bez předpony"
"Password strength. * means unrestricted; by default at least 8 characters with digits, upper/lower case letters and symbols. Simple form: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$": "Síla hesla. * znamená neomezeno; ve výchozím nastavení alespoň 8 znaků s číslicemi, velkými a malými písmeny a symboly. Jednoduchý tvar: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$"
"Cookie mode. Default SameSite mode for token cookies (-1 Unspecified, 0 None, 1 Lax, 2 Strict)": "Režim cookie. Výchozí režim SameSite pro tokeny v cookie (-1 Unspecified, 0 None, 1 Lax, 2 Strict)"
"Cookie domain. Writes cookies to a parent domain; empty uses the current domain. A top-level domain requires HTTPS and prevents plain HTTP from writing same-name keys on the local domain": "Doména cookie. Zapisuje cookie do nadřazené domény; prázdná hodnota používá aktuální doménu. Doména nejvyšší úrovně vyžaduje HTTPS a brání prostému HTTP zapisovat klíče stejného názvu na místní doméně"
"Activation URL. Front-end activation page URL used in email activation links, such as https://xxx/activate; empty builds /activate from the request host": "Aktivační URL. URL front-endové aktivační stránky používaná v aktivačních odkazech v e-mailech, například https://xxx/activate; prázdná hodnota sestaví /activate z hostitele požadavku"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default false": "Ukládat token do cookie. Přečte token z cookie, pokud jej hlavička požadavku neobsahuje, výchozí false"
"Password strength. * means unrestricted; the simple form defaults to 5 to 32 characters of any type. The full form requires at least 8 characters with digits, upper/lower case letters and symbols: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$": "Síla hesla. * znamená neomezeno; jednoduchý tvar má ve výchozím nastavení 5 až 32 znaků libovolného typu. Plný tvar vyžaduje alespoň 8 znaků s číslicemi, velkými a malými písmeny a symboly: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$"
"General": "Obecné"
