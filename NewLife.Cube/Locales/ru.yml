"Cube Web API library of the NewLife framework: entity controllers, permission and menu management, field metadata, OAuth server, JWT authentication and runtime localization. Built for front-end/back-end separation with Vue, Blazor and Ant Design front ends, validated with 10 billion rows in a single table.": "Библиотека Web API Cube платформы NewLife: контроллеры сущностей, управление разрешениями и меню, метаданные полей, сервер OAuth, проверка подлинности JWT и локализация во время выполнения. Рассчитана на разделение фронтенда и бэкенда с интерфейсами Vue, Blazor и Ant Design, проверена на 10 миллиардах строк в одной таблице."
