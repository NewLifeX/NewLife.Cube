"Show run time": "Показывать время выполнения"
"Avatar directory. Downloads remote avatars locally; defaults to the Avatars subdirectory, or Avatars next to the web root. Empty disables downloading": "Каталог аватаров. Загружает удалённые аватары локально; по умолчанию — подкаталог Avatars или Avatars рядом с корнем сайта. Пустое значение отключает загрузку"
"Text avatar characters. Generates an SVG text avatar when no image exists; 1 to 3 characters. Uses the first N Chinese characters to keep the surname, or the initials of English words. Default 2": "Символы текстового аватара. Создаёт текстовый SVG-аватар при отсутствии изображения; от 1 до 3 символов. Для китайских имён берутся первые N иероглифов, чтобы сохранить фамилию, для английских слов — инициалы. По умолчанию 2"
"Upload directory. Defaults to Uploads": "Каталог загрузок. По умолчанию Uploads"
"Web root directory. Defaults to wwwroot": "Корневой каталог сайта. По умолчанию wwwroot"
"Resource URL. CDN base such as https://sso.newlifex.com/content/; empty uses local resources": "URL ресурсов. Базовый адрес CDN, например https://sso.newlifex.com/content/; пустое значение — локальные ресурсы"
"CORS origins. Other origins allowed to access this site; * allows any origin": "Источники CORS. Другие источники, которым разрешён доступ к этому сайту; * разрешает любой источник"
"Iframe embedding. Empty allows the same domain only; SAMEORIGIN allows the same domain and port; ALLOWALL allows any domain": "Встраивание в iframe. Пустое значение — только тот же домен; SAMEORIGIN — тот же домен и порт; ALLOWALL — любой домен"
"Share expiration. Lifetime of share tokens in seconds, default 7200": "Срок действия общего доступа. Время жизни токенов общего доступа в секундах, по умолчанию 7200"
"Bot error code. Returns this error for crawlers, such as 404/500; 0 disables blocking": "Код ошибки для ботов. Возвращает эту ошибку поисковым роботам, например 404/500; 0 отключает блокировку"
"Force redirect. Target scheme and host for GET requests; * is supported in the host. Commonly used to force HTTPS, such as https://*:8081": "Принудительное перенаправление. Схема и хост для GET-запросов; в хосте поддерживается *. Обычно используется для принудительного HTTPS, например https://*:8081"
"Security mode. 0: off; 1: observe and log only; 2: block; 3: automatic (default; observes, bans repeated attackers, and temporarily blocks broad attacks with automatic rollback)": "Режим безопасности. 0 — выключен; 1 — только наблюдение и журналирование; 2 — блокировка; 3 — автоматический (по умолчанию; наблюдает, блокирует повторных атакующих и временно блокирует массовые атаки с автоматическим откатом)"
"Auto-ban durations. Comma-separated seconds that increase with each trigger; empty uses 60,300,1800,7200,86400": "Длительности автоблокировки. Секунды через запятую, возрастающие при каждом срабатывании; пустое значение — 60,300,1800,7200,86400"
"Trusted proxies. Forwarded headers are only trusted from these comma-separated IPs or CIDR ranges; empty keeps the legacy behavior of trusting all forwarded headers": "Доверенные прокси. Заголовки переадресации принимаются только от этих IP-адресов или диапазонов CIDR, перечисленных через запятую; пустое значение сохраняет прежнее поведение — доверять всем заголовкам переадресации"
"Trusted proxy learning limit. When no trusted proxies are configured, private direct sources that send forwarded headers are learned up to this count; 0 disables learning (typically 2 for one data center, 4 for two)": "Лимит изучения доверенных прокси. Если доверенные прокси не заданы, частные прямые источники, присылающие заголовки переадресации, изучаются до указанного количества; 0 отключает изучение (обычно 2 для одного ЦОД, 4 для двух)"
"Learned proxies. Maintained automatically; clear it to reset the learned list": "Изученные прокси. Обслуживается автоматически; очистите, чтобы сбросить список"
"Default role. Defaults to the Normal User role": "Роль по умолчанию. По умолчанию — роль обычного пользователя"
"Allow password sign-in. Allows signing in with a username and password": "Разрешить вход по паролю. Разрешает вход с именем пользователя и паролем"
"Allow plain-text passwords. Default true for legacy clients; false forces Challenge-Response encrypted passwords": "Разрешить пароли в открытом виде. По умолчанию true для устаревших клиентов; false требует зашифрованные пароли по схеме запрос-ответ"
"Allow registration. Allows registering with a username and password": "Разрешить регистрацию. Разрешает регистрацию с именем пользователя и паролем"
"Auto registration. Default true; after SSO sign-in an unknown local user is registered automatically. Enabled when either the global or the OAuth app setting is on": "Автоматическая регистрация. По умолчанию true; после входа через SSO неизвестный локальный пользователь регистрируется автоматически. Включается, если включена глобальная настройка или настройка приложения OAuth"
"Password complexity check. When enabled the sign-in page validates password strength; when disabled it only requires a non-empty password. Default true": "Проверка сложности пароля. При включении страница входа проверяет надёжность пароля; при отключении достаточно непустого пароля. По умолчанию true"
"Login failure limit. Bans sign-in after this many consecutive failures for the same user or IP, default 5": "Предел неудачных входов. Блокирует вход после указанного числа последовательных неудач для одного пользователя или IP, по умолчанию 5"
"Login ban duration. Seconds a risk-control ban lasts, default 300": "Длительность блокировки входа. Сколько секунд длится блокировка риск-контроля, по умолчанию 300"
"Class C subnet ban threshold. Bans a /24 subnet such as 103.125.146.* after this many failures, default 10; 0 disables": "Порог блокировки подсети класса C. Блокирует подсеть /24, например 103.125.146.*, после указанного числа неудач, по умолчанию 10; 0 отключает"
"Class B subnet ban threshold. Bans a /16 subnet such as 103.125.*.* after this many failures, default 20; 0 disables": "Порог блокировки подсети класса B. Блокирует подсеть /16, например 103.125.*.*, после указанного числа неудач, по умолчанию 20; 0 отключает"
"Force bind by user name. Binds SSO users to local users with the same name without a provider prefix; intended for user centers": "Принудительная привязка по имени пользователя. Привязывает пользователей SSO к локальным пользователям с тем же именем без префикса провайдера; предназначено для центров пользователей"
"Bind by user code. Binds SSO users to local users by user code": "Привязка по коду пользователя. Привязывает пользователей SSO к локальным пользователям по коду пользователя"
"Bind by mobile. Binds SSO users to local users by mobile number": "Привязка по мобильному телефону. Привязывает пользователей SSO к локальным пользователям по номеру мобильного телефона"
"Bind by email. Binds SSO users to local users by email": "Привязка по эл. почте. Привязывает пользователей SSO к локальным пользователям по адресу эл. почты"
"Bind by nickname. Binds SSO users to local users by nickname; suitable for internal SSO, not for social networks with many duplicate names": "Привязка по псевдониму. Привязывает пользователей SSO к локальным пользователям по псевдониму; подходит для внутреннего SSO, но не для соцсетей с множеством одинаковых имён"
"Use SSO roles. Keeps SSO roles after sign-in, default true; otherwise DefaultRole is used": "Использовать роли SSO. Сохраняет роли SSO после входа, по умолчанию true; иначе используется DefaultRole"
"Use SSO departments. Keeps SSO departments after sign-in, default true": "Использовать отделы SSO. Сохраняет отделы SSO после входа, по умолчанию true"
"SSO role rules. Automatically upgrades the primary role after SSO sign-in; separate rules with commas. Format: source role+department wildcard=target role, for example Guest+Route*=Route Specialist": "Правила ролей SSO. Автоматически повышают основную роль после входа через SSO; правила разделяются запятыми. Формат: исходная роль+шаблон отдела=целевая роль, например Guest+Route*=Route Specialist"
"Sign out everywhere. false signs out of this site only; true (default) also signs out of the SSO server": "Выход везде. false — выход только с этого сайта; true (по умолчанию) — также выход с сервера SSO"
"Allow multi-device sign-in. false kicks old devices on a new sign-in and revokes all tokens on sign-out; true (default) revokes only the current session": "Разрешить вход с нескольких устройств. false — при новом входе старые устройства отключаются, а при выходе отзываются все токены; true (по умолчанию) — отзывается только текущий сеанс"
"Session timeout. Session lifetime after SSO sign-in during which the cookie can sign in again; default 0s": "Тайм-аут сеанса. Время жизни сеанса после входа через SSO, в течение которого cookie может выполнить повторный вход; по умолчанию 0 с"
"Token sliding refresh threshold. Refreshes the JWT and rewrites the cookie when its remaining lifetime falls below this many seconds; 0 disables sliding expiration": "Порог скользящего обновления токена. Обновляет JWT и перезаписывает cookie, когда оставшееся время жизни становится меньше указанного числа секунд; 0 отключает скользящее продление"
"User refresh period. Fetches user information once per period across SSO sign-ins, default 600 seconds": "Период обновления пользователя. Запрашивает сведения о пользователе один раз за период при входах через SSO, по умолчанию 600 секунд"
"JWT secret. Algorithm and key used to sign JWTs, such as HS256:ABCD1234": "Секрет JWT. Алгоритм и ключ для подписи JWT, например HS256:ABCD1234"
"Token lifetime. Lifetime of the access token in seconds, default 7200": "Время жизни токена. Время жизни токена доступа в секундах, по умолчанию 7200"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default true": "Хранить токен в cookie. Читает токен из cookie, если в заголовке запроса его нет, по умолчанию true"
"Validate attachment access. Requires sign-in to access attachments, default true": "Проверять доступ к вложениям. Требует входа для доступа к вложениям, по умолчанию true"
"Public attachment categories. Categories accessible without sign-in, comma-separated, such as markdown,avatar. Applies when ValidateAttachment is true": "Общедоступные категории вложений. Категории, доступные без входа, через запятую, например markdown,avatar. Действует, когда ValidateAttachment включён"
"Private attachment categories. Categories only the uploader can access, comma-separated. Applies when ValidateAttachment is true": "Закрытые категории вложений. Категории, доступные только загрузившему пользователю, через запятую. Действует, когда ValidateAttachment включён"
"SSO redirect allowlist. Domains allowed to receive the JWT after sign-in, comma-separated with wildcard prefixes such as *.company.com. Empty allows the same site only; other origins are rejected and sent back to the home page": "Белый список перенаправлений SSO. Домены, которым разрешено получать JWT после входа, через запятую, с подстановочным префиксом, например *.company.com. Пустое значение — только тот же сайт; остальные источники отклоняются и перенаправляются на главную страницу"
"External authentication URL. When local authentication fails, credentials are verified by this endpoint; on success the local user is created or updated and signed in": "URL внешней аутентификации. Если локальная аутентификация не удалась, учётные данные проверяются по этой конечной точке; при успехе локальный пользователь создаётся или обновляется и входит в систему"
"Start page. First content page opened after entering the admin console": "Начальная страница. Первая страница содержимого, открываемая после входа в консоль администрирования"
"Theme. Content page theme, ACE/layui": "Тема. Тема страницы содержимого, ACE/layui"
"Skin. Outer frame layout, ACE/layui": "Скин. Макет внешнего фрейма, ACE/layui"
"Login tip. Empty hides the tip on the sign-in page": "Подсказка на странице входа. Пустое значение скрывает подсказку на странице входа"
"Login logo. Empty uses the default logo": "Логотип страницы входа. Пустое значение — логотип по умолчанию"
"Login background. Image URL; empty uses the default background": "Фон страницы входа. URL изображения; пустое значение — фон по умолчанию"
"Form group layout. 3/2/1 columns on large/medium/small screens, form-group col-xs-12 col-sm-6 col-lg-4": "Макет групп формы. 3/2/1 колонки на больших/средних/малых экранах, form-group col-xs-12 col-sm-6 col-lg-4"
"Bootstrap select. Nicer drop-downs with a rendering cost": "Bootstrap select. Более красивые выпадающие списки ценой производительности отрисовки"
"Maximum drop-down items. Maximum options in a related drop-down on forms, default 50; larger lists fall back to a text box": "Максимум элементов списка. Максимальное число вариантов в связанном выпадающем списке формы, по умолчанию 50; более длинные списки заменяются текстовым полем"
"Copyright. Empty hides the copyright; variables now/runtime/framework are supported, and now accepts formats such as {now:yyyy}": "Копирайт. Пустое значение скрывает копирайт; поддерживаются переменные now/runtime/framework, а now принимает форматы вроде {now:yyyy}"
"Filing number. Empty hides the filing information": "Номер регистрации. Пустое значение скрывает сведения о регистрации"
"Enable new UI": "Включить новый интерфейс"
"ECharts theme. Chart theme": "Тема ECharts. Тема диаграмм"
"Title suffix. Appends the system name to page titles, default true": "Суффикс заголовка. Добавляет название системы к заголовкам страниц, по умолчанию true"
"Table double-click. Enables row double-click on list pages, default true": "Двойной щелчок по таблице. Включает двойной щелчок по строке на страницах списка, по умолчанию true"
"Table style. Light: minimal thin lines; Standard: clear row lines (default); Grid: full cell borders": "Стиль таблицы. Светлый: минимум тонких линий; Стандартный: чёткие линии строк (по умолчанию); Сетка: полные границы ячеек"
"Table density. Compact: dense and information-rich (default); Normal: relaxed": "Плотность таблицы. Компактная: плотная и информативная (по умолчанию); Обычная: свободная"
"Stardust web. Stardust console URL; supports direct links to /trace?id={traceId} or /graph?id={traceId}": "Веб-интерфейс Stardust. URL консоли Stardust; поддерживает прямые ссылки /trace?id={traceId} или /graph?id={traceId}"
"AI master switch. Enables AI features such as log analysis and notification polishing, default false": "Главный переключатель ИИ. Включает функции ИИ, такие как анализ журналов и улучшение уведомлений, по умолчанию false"
"AI provider. Supports NewLife, Ollama, DeepSeek, DashScope, OpenAI and others; default NewLife": "Провайдер ИИ. Поддерживает NewLife, Ollama, DeepSeek, DashScope, OpenAI и других; по умолчанию NewLife"
"AI endpoint. Defaults to https://ai.newlifex.com for NewLife": "Конечная точка ИИ. Для NewLife по умолчанию https://ai.newlifex.com"
"AI ApiKey. Defaults to sk-CubeAI2026 for NewLife": "ApiKey ИИ. Для NewLife по умолчанию sk-CubeAI2026"
"AI default model. Defaults to newlife-flash for NewLife": "Модель ИИ по умолчанию. Для NewLife по умолчанию newlife-flash"
"AI default deep reasoning. Enables think mode for analysis and chat by default; false means fast responses": "Глубокие рассуждения ИИ по умолчанию. Включает режим размышления для анализа и чата по умолчанию; false — быстрые ответы"
"AI color scheme. Fills the primary and secondary colors from a preset": "Цветовая схема ИИ. Заполняет основной и дополнительный цвета из пресета"
"AI primary color. Main color of the launcher, panel header and user bubbles; default NewLife green #2ecc71": "Основной цвет ИИ. Главный цвет кнопки запуска, заголовка панели и пузырей пользователя; по умолчанию зелёный NewLife #2ecc71"
"AI secondary color. Gradient end color, default dark green #1e8e3e": "Дополнительный цвет ИИ. Цвет конца градиента, по умолчанию тёмно-зелёный #1e8e3e"
"OAuth server. Enables the OAuth 2.0 server that provides SSO for other applications": "Сервер OAuth. Включает сервер OAuth 2.0, обеспечивающий SSO для других приложений"
"File manager. Enables backend file management (browse, upload, download, delete); this carries security risks": "Файловый менеджер. Включает управление файлами в панели (просмотр, загрузка, скачивание, удаление); это создаёт риски безопасности"
"Multi-tenancy. Enables tenants; tenant mode cannot access system administration and platform mode cannot access tenant pages": "Мультитенантность. Включает арендаторов; в режиме арендатора недоступно системное администрирование, а в режиме платформы — страницы арендатора"
"Tenant query policy. DenyWithEmpty: return an empty set without tenant context; ThrowOnMissingTenant: throw an explicit error": "Политика запросов арендатора. DenyWithEmpty: вернуть пустой набор без контекста арендатора; ThrowOnMissingTenant: выбросить явную ошибку"
"User online. 0: do not record; 1: signed-in users only; 2: all visitors (default)": "Пользователи онлайн. 0 — не записывать; 1 — только вошедшие пользователи; 2 — все посетители (по умолчанию)"
"User statistics. Records user visits, default true": "Статистика пользователей. Записывает посещения пользователей, по умолчанию true"
"Enable SMS. SMS verification codes and system notifications, default false": "Включить SMS. Коды подтверждения и системные уведомления по SMS, по умолчанию false"
"Enable email. Email verification codes and system notifications, default false": "Включить эл. почту. Коды подтверждения и системные уведомления по эл. почте, по умолчанию false"
"Require email verification. Users must activate their email before signing in and must provide one when registering, default false": "Требовать подтверждение эл. почты. Пользователи должны активировать эл. почту до входа и указывать её при регистрации, по умолчанию false"
"Require mobile verification. Users must activate their mobile before signing in and must provide one when registering, default false": "Требовать подтверждение телефона. Пользователи должны активировать телефон до входа и указывать его при регистрации, по умолчанию false"
"Captcha scenarios. Bit mask: 0: off; 1: sign-in; 2: registration; 4: verification code requests (anti-SMS-bombing); combine with 3 for sign-in and registration. Mandatory scenarios are never exempted, default 0": "Сценарии капчи. Битовая маска: 0 — выключено; 1 — вход; 2 — регистрация; 4 — запросы кодов подтверждения (защита от SMS-бомбинга); комбинируйте с 3 для входа и регистрации. Обязательные сценарии никогда не освобождаются, по умолчанию 0"
"Risk-adaptive captcha. Disabled when CaptchaScene is 0; when enabled it detects unsafe environments and requires a captcha, default true": "Адаптивная по риску капча. Отключена, когда CaptchaScene равен 0; при включении определяет небезопасные среды и требует капчу, по умолчанию true"
"Captcha risk threshold. Requires a captcha when the risk score reaches this value: 0: intranet; 1: internet; 2: internet with recent failures; 3: banned. Default 2": "Порог риска капчи. Требует капчу, когда оценка риска достигает значения: 0 — интрасеть; 1 — интернет; 2 — интернет с недавними неудачами; 3 — заблокирован. По умолчанию 2"
"Trusted device lifetime. Days during which previously successful devices skip adaptive captchas, default 30": "Срок жизни доверенного устройства. Сколько дней ранее успешные устройства пропускают адаптивную капчу, по умолчанию 30"
"Enable MFA. Allows users to enable TOTP multi-factor authentication; an enhanced feature, default false": "Включить MFA. Позволяет пользователям включить многофакторную аутентификацию TOTP; расширенная функция, по умолчанию false"
"File storage serving. Responds to file download requests from other nodes, default true": "Отдача файлового хранилища. Отвечает на запросы скачивания файлов от других узлов, по умолчанию true"
"File storage fetch. Pulls new files published by other nodes, default true": "Получение из файлового хранилища. Загружает новые файлы, опубликованные другими узлами, по умолчанию true"
"File fetch timeout. Maximum milliseconds to wait for other nodes when a file is missing locally, default 5000": "Тайм-аут получения файла. Максимальное время ожидания других узлов, когда файл отсутствует локально, в миллисекундах, по умолчанию 5000"
"Attachment storage. Local disk, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu or EasyIO; default Local": "Хранилище вложений. Локальный диск, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu или EasyIO; по умолчанию Local"
"Object storage server. S3-compatible endpoint for OSS/COS/Qiniu, such as oss-cn-beijing.aliyuncs.com": "Сервер объектного хранилища. Совместимая с S3 конечная точка для OSS/COS/Qiniu, например oss-cn-beijing.aliyuncs.com"
"Object storage bucket. Bucket name for OSS/COS/Qiniu": "Контейнер объектного хранилища. Имя контейнера для OSS/COS/Qiniu"
"Object storage region. S3 signing scope, such as cn-beijing / ap-beijing / cn-east-1": "Регион объектного хранилища. Область подписи S3, например cn-beijing / ap-beijing / cn-east-1"
"Object storage app ID. AccessKeyId": "Идентификатор приложения объектного хранилища. AccessKeyId"
"Object storage app secret. AccessKeySecret": "Секрет приложения объектного хранилища. AccessKeySecret"
"Data retention. Days to keep audit and OAuth logs, default 30": "Хранение данных. Сколько дней хранить журналы аудита и OAuth, по умолчанию 30"
"File retention. Days to keep backup files, default 15": "Хранение файлов. Сколько дней хранить файлы резервных копий, по умолчанию 15"
"Retention size floor. Files smaller than this (KB) are never deleted even after the retention period, default 1024K": "Нижний предел размера для хранения. Файлы меньше указанного размера (КБ) не удаляются даже по истечении срока хранения, по умолчанию 1024K"
"Maximum export rows. Maximum rows a page may export, default 10_000_000": "Максимум строк экспорта. Максимальное число строк, которое страница может экспортировать, по умолчанию 10_000_000"
"Maximum backup rows. Maximum rows a page may back up, default 10_000_000": "Максимум строк резервной копии. Максимальное число строк, которое страница может скопировать, по умолчанию 10_000_000"
"API prefixes. Comma- or semicolon-separated prefixes such as /api,/api/v1; matching requests are forwarded to the real route without the prefix": "Префиксы API. Префиксы через запятую или точку с запятой, например /api,/api/v1; подходящие запросы переадресуются на реальный маршрут без префикса"
"Password strength. * means unrestricted; by default at least 8 characters with digits, upper/lower case letters and symbols. Simple form: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$": "Надёжность пароля. * означает без ограничений; по умолчанию не менее 8 символов с цифрами, буквами в верхнем/нижнем регистре и символами. Простая форма: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$"
"Cookie mode. Default SameSite mode for token cookies (-1 Unspecified, 0 None, 1 Lax, 2 Strict)": "Режим cookie. Режим SameSite по умолчанию для cookie с токеном (-1 Unspecified, 0 None, 1 Lax, 2 Strict)"
"Cookie domain. Writes cookies to a parent domain; empty uses the current domain. A top-level domain requires HTTPS and prevents plain HTTP from writing same-name keys on the local domain": "Домен cookie. Записывает cookie в родительский домен; пустое значение — текущий домен. Домен верхнего уровня требует HTTPS и не позволяет обычному HTTP записывать одноимённые ключи в локальном домене"
"Activation URL. Front-end activation page URL used in email activation links, such as https://xxx/activate; empty builds /activate from the request host": "URL активации. URL страницы активации во фронтенде, используемый в ссылках активации из писем, например https://xxx/activate; пустое значение строит /activate из хоста запроса"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default false": "Хранить токен в cookie. Читает токен из cookie, если в заголовке запроса его нет, по умолчанию false"
"Password strength. * means unrestricted; the simple form defaults to 5 to 32 characters of any type. The full form requires at least 8 characters with digits, upper/lower case letters and symbols: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$": "Надёжность пароля. * означает без ограничений; простая форма по умолчанию допускает от 5 до 32 символов любого типа. Полная форма требует не менее 8 символов с цифрами, буквами в верхнем/нижнем регистре и символами: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$"
