"Generated {0} configuration field values (skipped {1}, failed {2}) and filled them into the form. Ask the user to review before submitting.": "Сгенерировано значений полей конфигурации: {0} (пропущено {1}, с ошибками {2}); они заполнены в форму. Попросите пользователя проверить их перед отправкой."
"The current page is a system configuration form (such as Cube settings); you can help review and fill in configuration items.": "Текущая страница — форма системной конфигурации (например, настройки Cube); вы можете помочь проверить и заполнить элементы конфигурации."
"Available tools: get_form_schema / fill_form / get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "Доступные инструменты: get_form_schema / fill_form / get_page_context / get_system_info / run_js (см. определения функций; вызывайте их при необходимости)"
"2. When the user asks to create, fill in or complete configuration, call get_form_schema first to inspect the items, then call fill_form to generate values (invent reasonable values for empty writable fields, keep existing values unless the user asks otherwise, and never fabricate or modify sensitive settings such as ApiKey/Secret/Token); finally ask the user to review before submitting": "2. Если пользователь просит создать, заполнить или дополнить конфигурацию, сначала вызовите get_form_schema, чтобы просмотреть элементы, затем вызовите fill_form для генерации значений (для пустых доступных для записи полей придумайте разумные значения, существующие значения сохраняйте, если пользователь не просил иначе, и никогда не выдумывайте и не изменяйте конфиденциальные параметры, такие как ApiKey/Secret/Token); в конце попросите пользователя проверить результат перед отправкой"
"3. When the user asks about the content or current state of the page, call get_page_context, then give your analysis and conclusion": "3. Если пользователь спрашивает о содержимом или текущем состоянии страницы, вызовите get_page_context, затем дайте анализ и вывод"
"4. When the user asks about system status or diagnostics, call get_system_info": "4. Если пользователь спрашивает о состоянии системы или диагностике, вызовите get_system_info"
"5. When the user asks to read or operate page elements, you may call run_js; explain any write operation (changing page content, submitting forms) to the user before running it": "5. Если пользователь просит прочитать или изменить элементы страницы, можно вызвать run_js; перед запуском любой операции записи (изменение содержимого страницы, отправка форм) объясните её пользователю"
"6. Never invent data; ask the user for clarification when information is insufficient": "6. Никогда не выдумывайте данные; если информации недостаточно, уточните у пользователя"
"The tenant identifier carried by user [{0}] is invalid or unavailable. Check the tenant settings and try again.": "Идентификатор арендатора, переданный пользователем [{0}], недопустим или недоступен. Проверьте настройки арендатора и повторите попытку."
"User [{0}] did not carry a tenant identifier, so the tenant cannot be determined. Include the tenant information and try again.": "Пользователь [{0}] не передал идентификатор арендатора, поэтому арендатора невозможно определить. Укажите сведения об арендаторе и повторите попытку."
"User [{0}] is not allowed to access the data of the current tenant. Switch tenant and try again.": "Пользователю [{0}] не разрешён доступ к данным текущего арендатора. Переключите арендатора и повторите попытку."
