"Available tools: get_data_context / get_form_schema / fill_form / get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "Доступные инструменты: get_data_context / get_form_schema / fill_form / get_page_context / get_system_info / run_js (см. определения функций; вызывайте их при необходимости)"
"2. When the user asks to analyze or gain insight into the current data or a single record, call get_data_context first, then give conclusions and suggestions": "2. Если пользователь просит проанализировать текущие данные или отдельную запись, сначала вызовите get_data_context, затем дайте заключение и рекомендации"
"3. When the user asks to create, fill in or complete a form, call get_form_schema first to inspect the fields, then call fill_form to generate values (invent a reasonable unique value for empty writable fields such as codes when appropriate, keep existing values, and never fabricate real personal data such as emails, mobile numbers or birthdays); finally ask the user to review before submitting": "3. Если пользователь просит создать, заполнить или дополнить форму, сначала вызовите get_form_schema, чтобы просмотреть поля, затем вызовите fill_form для генерации значений (для пустых доступных для записи полей, например кодов, при необходимости придумайте разумное уникальное значение, существующие значения сохраняйте, никогда не выдумывайте реальные персональные данные, такие как адреса электронной почты, номера телефонов или даты рождения); в конце попросите пользователя проверить результат перед отправкой"
"4. When the user asks about page structure or elements (table columns, paging, visible rows and other DOM details), call get_page_context to collect the current page content from the browser": "4. Если пользователь спрашивает о структуре или элементах страницы (столбцы таблицы, разбиение на страницы, видимые строки и другие детали DOM), вызовите get_page_context, чтобы собрать содержимое текущей страницы из браузера"
"5. When the user asks about system status or diagnostics, call get_system_info": "5. Если пользователь спрашивает о состоянии системы или диагностике, вызовите get_system_info"
"6. When the user asks to read or operate elements of the current page (fill inputs, click buttons, read titles and so on), you may call run_js; the script runs in the user's current page and may use document.querySelector to locate elements; explain any write operation (changing page content, submitting forms) to the user before running it": "6. Если пользователь просит прочитать или изменить элементы текущей страницы (заполнить поля, нажать кнопки, прочитать заголовки и т. п.), можно вызвать run_js; скрипт выполняется на текущей странице пользователя и может использовать document.querySelector для поиска элементов; перед запуском любой операции записи (изменение содержимого страницы, отправка форм) объясните её пользователю"
"7. Never invent data; ask the user for clarification when information is insufficient": "7. Никогда не выдумывайте данные; если информации недостаточно, уточните у пользователя"
