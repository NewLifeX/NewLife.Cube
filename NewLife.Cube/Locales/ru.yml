"Get page context": "Получить контекст страницы"
"Gets the main data and structure of the current page (title, tables, forms and so on). Uses the server-side context when the page provides one; otherwise collects the page content from the user's browser": "Возвращает основные данные и структуру текущей страницы (заголовок, таблицы, формы и т. д.). Использует серверный контекст, если страница его предоставляет; иначе собирает содержимое страницы из браузера пользователя"
"Get form schema": "Получить схему формы"
"Gets the schema of the current form, including field names, types, descriptions and current values, for generating form values": "Возвращает схему текущей формы, включая имена полей, типы, описания и текущие значения, для генерации значений формы"
