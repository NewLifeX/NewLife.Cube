"4. When the user asks to read or operate elements of the current page (fill inputs, click buttons, read titles and so on), you may call run_js; the script runs in the user's current page and may use document.querySelector to locate elements; explain any write operation (changing page content, submitting forms) to the user before running it": "4. ব্যবহারকারী বর্তমান পৃষ্ঠার উপাদান পড়তে বা পরিচালনা করতে চাইলে (ইনপুট পূরণ, বোতাম ক্লিক, শিরোনাম পড়া ইত্যাদি) run_js কল করতে পারেন; স্ক্রিপ্টটি ব্যবহারকারীর বর্তমান পৃষ্ঠায় চলে এবং উপাদান খুঁজে পেতে document.querySelector ব্যবহার করতে পারে; চালানোর আগে যেকোনো লেখার কাজ (পৃষ্ঠার বিষয়বস্তু পরিবর্তন, ফর্ম জমা দেওয়া) ব্যবহারকারীকে ব্যাখ্যা করুন"
