"Text avatar characters. Generates an SVG text avatar when no image exists; 1 to 3 characters. Uses the first N Chinese characters to keep the surname, or the initials of English words. Default 2": "টেক্সট অবতার অক্ষর। ছবি না থাকলে SVG টেক্সট অবতার তৈরি করে; ১ থেকে ৩টি অক্ষর। উপাধি ধরে রাখতে চীনা অক্ষরের প্রথম Nটি ব্যবহার করে, ইংরেজি শব্দের ক্ষেত্রে আদ্যক্ষর। ডিফল্ট 2"
"Upload directory. Defaults to Uploads": "আপলোড ডিরেক্টরি। ডিফল্ট Uploads"
