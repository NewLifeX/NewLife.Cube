"Export to Csv with English headers, for data transfer": "ডেটা স্থানান্তরের জন্য ইংরেজি হেডারসহ Csv-তে রপ্তানি"
"Import data from an Excel/Csv/Json/Zip file": "আমদানি"
"Share the current page data with others": "চলতি পৃষ্ঠার ডেটা অন্যদের সাথে শেয়ার করুন"
"Clear data and sync from the primary server": "ডেটা মুছে প্রাথমিক সার্ভার থেকে সিঙ্ক করুন"
"Delete the selected data": "নির্বাচিত ডেটা মুছুন"
