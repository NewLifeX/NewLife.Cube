"Iframe embedding. Empty allows the same domain only; SAMEORIGIN allows the same domain and port; ALLOWALL allows any domain": "Iframe এমবেডিং। খালি রাখলে শুধু একই ডোমেইন; SAMEORIGIN একই ডোমেইন ও পোর্ট; ALLOWALL যেকোনো ডোমেইন"
"Share expiration. Lifetime of share tokens in seconds, default 7200": "শেয়ার মেয়াদ। শেয়ার টোকেনের আয়ু সেকেন্ডে, ডিফল্ট 7200"
"Bot error code. Returns this error for crawlers, such as 404/500; 0 disables blocking": "বট ত্রুটি কোড। ক্রলারদের কাছে এই ত্রুটি ফেরত দেয়, যেমন 404/500; 0 ব্লকিং বন্ধ করে"
"Force redirect. Target scheme and host for GET requests; * is supported in the host. Commonly used to force HTTPS, such as https://*:8081": "জোরপূর্বক রিডাইরেক্ট। GET অনুরোধের লক্ষ্য স্কিম ও হোস্ট; হোস্টে * সমর্থিত। সাধারণত HTTPS জোর করতে ব্যবহৃত হয়, যেমন https://*:8081"
"Security mode. 0: off; 1: observe and log only; 2: block; 3: automatic (default; observes, bans repeated attackers, and temporarily blocks broad attacks with automatic rollback)": "নিরাপত্তা মোড। 0: বন্ধ; 1: শুধু পর্যবেক্ষণ ও লগ; 2: ব্লক; 3: স্বয়ংক্রিয় (ডিফল্ট; পর্যবেক্ষণ করে, বারবার আক্রমণকারীদের নিষিদ্ধ করে এবং স্বয়ংক্রিয় রোলব্যাকসহ বৃহৎ আক্রমণ সাময়িকভাবে ব্লক করে)"
"Auto-ban durations. Comma-separated seconds that increase with each trigger; empty uses 60,300,1800,7200,86400": "স্বয়ংক্রিয় নিষেধাজ্ঞার সময়কাল। কমা-বিভক্ত সেকেন্ড যা প্রতিবার বাড়ে; খালি রাখলে 60,300,1800,7200,86400"
"Trusted proxies. Forwarded headers are only trusted from these comma-separated IPs or CIDR ranges; empty keeps the legacy behavior of trusting all forwarded headers": "বিশ্বস্ত প্রক্সি। শুধু এই কমা-বিভক্ত IP বা CIDR রেঞ্জ থেকে ফরওয়ার্ডেড হেডার বিশ্বাস করা হয়; খালি রাখলে সব ফরওয়ার্ডেড হেডার বিশ্বাস করার পুরনো আচরণ বজায় থাকে"
"Trusted proxy learning limit. When no trusted proxies are configured, private direct sources that send forwarded headers are learned up to this count; 0 disables learning (typically 2 for one data center, 4 for two)": "বিশ্বস্ত প্রক্সি শেখার সীমা। কোনো বিশ্বস্ত প্রক্সি কনফিগার না থাকলে, ফরওয়ার্ডেড হেডার পাঠানো প্রাইভেট সরাসরি উৎস এই সংখ্যা পর্যন্ত শেখা হয়; 0 শেখা বন্ধ করে (সাধারণত একটি ডেটা সেন্টারের জন্য 2, দুটির জন্য 4)"
"Learned proxies. Maintained automatically; clear it to reset the learned list": "শেখা প্রক্সি। স্বয়ংক্রিয়ভাবে রক্ষণাবেক্ষণ হয়; শেখা তালিকা রিসেট করতে এটি পরিষ্কার করুন"
"Default role. Defaults to the Normal User role": "ডিফল্ট ভূমিকা। ডিফল্টভাবে সাধারণ ব্যবহারকারী ভূমিকা"
"Allow password sign-in. Allows signing in with a username and password": "পাসওয়ার্ড সাইন-ইন অনুমোদন। ব্যবহারকারীর নাম ও পাসওয়ার্ড দিয়ে সাইন ইন অনুমোদন করে"
"Allow plain-text passwords. Default true for legacy clients; false forces Challenge-Response encrypted passwords": "সরল টেক্সট পাসওয়ার্ড অনুমোদন। পুরনো ক্লায়েন্টের জন্য ডিফল্ট true; false দিলে Challenge-Response এনক্রিপ্টেড পাসওয়ার্ড বাধ্যতামূলক"
"Allow registration. Allows registering with a username and password": "নিবন্ধন অনুমোদন। ব্যবহারকারীর নাম ও পাসওয়ার্ড দিয়ে নিবন্ধন অনুমোদন করে"
"Auto registration. Default true; after SSO sign-in an unknown local user is registered automatically. Enabled when either the global or the OAuth app setting is on": "স্বয়ংক্রিয় নিবন্ধন। ডিফল্ট true; SSO সাইন-ইনের পর অজানা স্থানীয় ব্যবহারকারী স্বয়ংক্রিয়ভাবে নিবন্ধিত হয়। গ্লোবাল বা OAuth অ্যাপ সেটিং যেকোনোটি চালু থাকলে সক্রিয় হয়"
"Password complexity check. When enabled the sign-in page validates password strength; when disabled it only requires a non-empty password. Default true": "পাসওয়ার্ড জটিলতা যাচাই। চালু থাকলে সাইন-ইন পৃষ্ঠা পাসওয়ার্ডের শক্তি যাচাই করে; বন্ধ থাকলে শুধু অশূন্য পাসওয়ার্ড প্রয়োজন। ডিফল্ট true"
"Login failure limit. Bans sign-in after this many consecutive failures for the same user or IP, default 5": "লগইন ব্যর্থতার সীমা। একই ব্যবহারকারী বা IP-এর জন্য এই সংখ্যক ধারাবাহিক ব্যর্থতার পর সাইন-ইন নিষিদ্ধ, ডিফল্ট 5"
"Login ban duration. Seconds a risk-control ban lasts, default 300": "লগইন নিষেধাজ্ঞার সময়কাল। ঝুঁকি-নিয়ন্ত্রণ নিষেধাজ্ঞা কত সেকেন্ড স্থায়ী হয়, ডিফল্ট 300"
"Class C subnet ban threshold. Bans a /24 subnet such as 103.125.146.* after this many failures, default 10; 0 disables": "ক্লাস C সাবনেট নিষেধাজ্ঞার থ্রেশহোল্ড। এই সংখ্যক ব্যর্থতার পর /24 সাবনেট যেমন 103.125.146.* নিষিদ্ধ, ডিফল্ট 10; 0 বন্ধ করে"
"Class B subnet ban threshold. Bans a /16 subnet such as 103.125.*.* after this many failures, default 20; 0 disables": "ক্লাস B সাবনেট নিষেধাজ্ঞার থ্রেশহোল্ড। এই সংখ্যক ব্যর্থতার পর /16 সাবনেট যেমন 103.125.*.* নিষিদ্ধ, ডিফল্ট 20; 0 বন্ধ করে"
"Force bind by user name. Binds SSO users to local users with the same name without a provider prefix; intended for user centers": "ব্যবহারকারীর নাম দিয়ে জোরপূর্বক সংযুক্তি। প্রোভাইডার প্রিফিক্স ছাড়া একই নামের স্থানীয় ব্যবহারকারীর সাথে SSO ব্যবহারকারীকে সংযুক্ত করে; ব্যবহারকারী কেন্দ্রের জন্য উপযুক্ত"
"Bind by user code. Binds SSO users to local users by user code": "ব্যবহারকারী কোড দিয়ে সংযুক্তি। ব্যবহারকারী কোড দিয়ে SSO ব্যবহারকারীকে স্থানীয় ব্যবহারকারীর সাথে সংযুক্ত করে"
"Bind by mobile. Binds SSO users to local users by mobile number": "মোবাইল দিয়ে সংযুক্তি। মোবাইল নম্বর দিয়ে SSO ব্যবহারকারীকে স্থানীয় ব্যবহারকারীর সাথে সংযুক্ত করে"
"Bind by email. Binds SSO users to local users by email": "ইমেল দিয়ে সংযুক্তি। ইমেল দিয়ে SSO ব্যবহারকারীকে স্থানীয় ব্যবহারকারীর সাথে সংযুক্ত করে"
"Bind by nickname. Binds SSO users to local users by nickname; suitable for internal SSO, not for social networks with many duplicate names": "ডাকনাম দিয়ে সংযুক্তি। ডাকনাম দিয়ে SSO ব্যবহারকারীকে স্থানীয় ব্যবহারকারীর সাথে সংযুক্ত করে; অভ্যন্তরীণ SSO-এর জন্য উপযুক্ত, একই নাম বহুল সোশ্যাল নেটওয়ার্কের জন্য নয়"
"Use SSO roles. Keeps SSO roles after sign-in, default true; otherwise DefaultRole is used": "SSO ভূমিকা ব্যবহার। সাইন-ইনের পর SSO ভূমিকা রাখে, ডিফল্ট true; অন্যথায় DefaultRole ব্যবহৃত হয়"
"Use SSO departments. Keeps SSO departments after sign-in, default true": "SSO বিভাগ ব্যবহার। সাইন-ইনের পর SSO বিভাগ রাখে, ডিফল্ট true"
"SSO role rules. Automatically upgrades the primary role after SSO sign-in; separate rules with commas. Format: source role+department wildcard=target role, for example Guest+Route*=Route Specialist": "SSO ভূমিকা নিয়ম। SSO সাইন-ইনের পর প্রধান ভূমিকা স্বয়ংক্রিয়ভাবে উন্নীত করে; নিয়মগুলো কমা দিয়ে আলাদা করুন। ফরম্যাট: উৎস ভূমিকা+বিভাগ ওয়াইল্ডকার্ড=লক্ষ্য ভূমিকা, যেমন Guest+Route*=Route Specialist"
"Sign out everywhere. false signs out of this site only; true (default) also signs out of the SSO server": "সর্বত্র সাইন আউট। false শুধু এই সাইট থেকে সাইন আউট; true (ডিফল্ট) SSO সার্ভার থেকেও সাইন আউট করে"
"Allow multi-device sign-in. false kicks old devices on a new sign-in and revokes all tokens on sign-out; true (default) revokes only the current session": "একাধিক ডিভাইসে সাইন-ইন অনুমোদন। false নতুন সাইন-ইনে পুরনো ডিভাইস বের করে দেয় এবং সাইন-আউটে সব টোকেন প্রত্যাহার করে; true (ডিফল্ট) শুধু চলতি সেশন প্রত্যাহার করে"
"Session timeout. Session lifetime after SSO sign-in during which the cookie can sign in again; default 0s": "সেশন টাইমআউট। SSO সাইন-ইনের পর সেশনের আয়ু, যার মধ্যে cookie আবার সাইন ইন করতে পারে; ডিফল্ট 0 সেকেন্ড"
"Token sliding refresh threshold. Refreshes the JWT and rewrites the cookie when its remaining lifetime falls below this many seconds; 0 disables sliding expiration": "টোকেন স্লাইডিং রিফ্রেশ থ্রেশহোল্ড। অবশিষ্ট আয়ু এই সংখ্যক সেকেন্ডের নিচে নামলে JWT নবায়ন করে ও cookie পুনর্লিখন করে; 0 স্লাইডিং মেয়াদ বন্ধ করে"
"User refresh period. Fetches user information once per period across SSO sign-ins, default 600 seconds": "ব্যবহারকারী নবায়নকাল। SSO সাইন-ইনজুড়ে প্রতি সময়কালে একবার ব্যবহারকারীর তথ্য আনে, ডিফল্ট 600 সেকেন্ড"
"JWT secret. Algorithm and key used to sign JWTs, such as HS256:ABCD1234": "JWT সিক্রেট। JWT সাইন করতে ব্যবহৃত অ্যালগরিদম ও কী, যেমন HS256:ABCD1234"
"Token lifetime. Lifetime of the access token in seconds, default 7200": "টোকেন আয়ু। অ্যাক্সেস টোকেনের আয়ু সেকেন্ডে, ডিফল্ট 7200"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default true": "টোকেন cookie-তে সংরক্ষণ। অনুরোধের হেডারে না থাকলে cookie থেকে টোকেন পড়ে, ডিফল্ট true"
"Validate attachment access. Requires sign-in to access attachments, default true": "সংযুক্তি অ্যাক্সেস যাচাই। সংযুক্তি অ্যাক্সেস করতে সাইন-ইন আবশ্যক, ডিফল্ট true"
"Public attachment categories. Categories accessible without sign-in, comma-separated, such as markdown,avatar. Applies when ValidateAttachment is true": "সর্বজনীন সংযুক্তি শ্রেণি। সাইন-ইন ছাড়াই অ্যাক্সেসযোগ্য শ্রেণি, কমা-বিভক্ত, যেমন markdown,avatar। ValidateAttachment সত্য হলে প্রযোজ্য"
"Private attachment categories. Categories only the uploader can access, comma-separated. Applies when ValidateAttachment is true": "ব্যক্তিগত সংযুক্তি শ্রেণি। কেবল আপলোডকারী অ্যাক্সেস করতে পারে এমন শ্রেণি, কমা-বিভক্ত। ValidateAttachment সত্য হলে প্রযোজ্য"
"SSO redirect allowlist. Domains allowed to receive the JWT after sign-in, comma-separated with wildcard prefixes such as *.company.com. Empty allows the same site only; other origins are rejected and sent back to the home page": "SSO রিডাইরেক্ট অনুমোদিত তালিকা। সাইন-ইনের পর JWT গ্রহণের অনুমতিপ্রাপ্ত ডোমেইন, কমা-বিভক্ত, ওয়াইল্ডকার্ড প্রিফিক্সসহ যেমন *.company.com। খালি রাখলে শুধু একই সাইট; অন্যান্য উৎস প্রত্যাখ্যাত হয়ে হোম পৃষ্ঠায় ফেরত পাঠানো হয়"
"External authentication URL. When local authentication fails, credentials are verified by this endpoint; on success the local user is created or updated and signed in": "বাহ্যিক প্রমাণীকরণ URL। স্থানীয় প্রমাণীকরণ ব্যর্থ হলে এই এন্ডপয়েন্ট দিয়ে শংসাপত্র যাচাই করা হয়; সফল হলে স্থানীয় ব্যবহারকারী তৈরি বা হালনাগাদ হয়ে সাইন ইন হয়"
"Start page. First content page opened after entering the admin console": "শুরুর পৃষ্ঠা। প্রশাসন কনসোলে ঢোকার পর খোলা প্রথম কনটেন্ট পৃষ্ঠা"
"Theme. Content page theme, ACE/layui": "থিম। কনটেন্ট পৃষ্ঠার থিম, ACE/layui"
"Skin. Outer frame layout, ACE/layui": "স্কিন। বাইরের ফ্রেম লেআউট, ACE/layui"
"Login tip. Empty hides the tip on the sign-in page": "লগইন টিপ। খালি রাখলে সাইন-ইন পৃষ্ঠায় টিপ লুকানো থাকে"
"Login logo. Empty uses the default logo": "লগইন লোগো। খালি রাখলে ডিফল্ট লোগো"
"Login background. Image URL; empty uses the default background": "লগইন ব্যাকগ্রাউন্ড। ছবির URL; খালি রাখলে ডিফল্ট ব্যাকগ্রাউন্ড"
"Form group layout. 3/2/1 columns on large/medium/small screens, form-group col-xs-12 col-sm-6 col-lg-4": "ফর্ম গ্রুপ লেআউট। বড়/মাঝারি/ছোট স্ক্রিনে 3/2/1 কলাম, form-group col-xs-12 col-sm-6 col-lg-4"
"Bootstrap select. Nicer drop-downs with a rendering cost": "Bootstrap select। রেন্ডারিং খরচে আরও সুন্দর ড্রপডাউন"
"Maximum drop-down items. Maximum options in a related drop-down on forms, default 50; larger lists fall back to a text box": "সর্বোচ্চ ড্রপডাউন আইটেম। ফর্মের সম্পর্কিত ড্রপডাউনে সর্বোচ্চ অপশন, ডিফল্ট 50; বড় তালিকা টেক্সট বক্সে রূপান্তরিত হয়"
"Copyright. Empty hides the copyright; variables now/runtime/framework are supported, and now accepts formats such as {now:yyyy}": "কপিরাইট। খালি রাখলে কপিরাইট লুকানো থাকে; now/runtime/framework ভেরিয়েবল সমর্থিত, এবং now {now:yyyy}-এর মতো ফরম্যাট নেয়"
"Filing number. Empty hides the filing information": "ফাইলিং নম্বর। খালি রাখলে ফাইলিং তথ্য লুকানো থাকে"
"Enable new UI": "নতুন UI সক্রিয় করুন"
"ECharts theme. Chart theme": "ECharts থিম। চার্ট থিম"
"Title suffix. Appends the system name to page titles, default true": "টাইটেল সাফিক্স। পৃষ্ঠার শিরোনামে সিস্টেমের নাম যোগ করে, ডিফল্ট true"
"Table double-click. Enables row double-click on list pages, default true": "টেবিল ডাবল-ক্লিক। তালিকা পৃষ্ঠায় সারিতে ডাবল-ক্লিক সক্রিয় করে, ডিফল্ট true"
"Table style. Light: minimal thin lines; Standard: clear row lines (default); Grid: full cell borders": "টেবিল স্টাইল। হালকা: ন্যূনতম সরু রেখা; স্ট্যান্ডার্ড: স্পষ্ট সারি রেখা (ডিফল্ট); গ্রিড: সম্পূর্ণ সেল বর্ডার"
"Table density. Compact: dense and information-rich (default); Normal: relaxed": "টেবিল ঘনত্ব। কম্প্যাক্ট: ঘন ও তথ্যবহুল (ডিফল্ট); স্বাভাবিক: শিথিল"
"Stardust web. Stardust console URL; supports direct links to /trace?id={traceId} or /graph?id={traceId}": "Stardust ওয়েব। Stardust কনসোল URL; /trace?id={traceId} বা /graph?id={traceId}-এ সরাসরি লিঙ্ক সমর্থন করে"
"AI master switch. Enables AI features such as log analysis and notification polishing, default false": "AI মাস্টার সুইচ। লগ বিশ্লেষণ ও বিজ্ঞপ্তি পরিমার্জনের মতো AI বৈশিষ্ট্য সক্রিয় করে, ডিফল্ট false"
"AI provider. Supports NewLife, Ollama, DeepSeek, DashScope, OpenAI and others; default NewLife": "AI প্রোভাইডার। NewLife, Ollama, DeepSeek, DashScope, OpenAI এবং অন্যান্য সমর্থন করে; ডিফল্ট NewLife"
"AI endpoint. Defaults to https://ai.newlifex.com for NewLife": "AI এন্ডপয়েন্ট। NewLife-এর জন্য ডিফল্ট https://ai.newlifex.com"
"AI ApiKey. Defaults to sk-CubeAI2026 for NewLife": "AI ApiKey। NewLife-এর জন্য ডিফল্ট sk-CubeAI2026"
"AI default model. Defaults to newlife-flash for NewLife": "AI ডিফল্ট মডেল। NewLife-এর জন্য ডিফল্ট newlife-flash"
"AI default deep reasoning. Enables think mode for analysis and chat by default; false means fast responses": "AI ডিফল্ট ডিপ রিজনিং। বিশ্লেষণ ও চ্যাটের জন্য ডিফল্টভাবে think মোড সক্রিয় করে; false দ্রুত উত্তর বোঝায়"
"AI color scheme. Fills the primary and secondary colors from a preset": "AI কালার স্কিম। প্রিসেট থেকে প্রাইমারি ও সেকেন্ডারি রঙ পূরণ করে"
"AI primary color. Main color of the launcher, panel header and user bubbles; default NewLife green #2ecc71": "AI প্রাইমারি রঙ। লঞ্চার, প্যানেল হেডার ও ব্যবহারকারীর বাবলের প্রধান রঙ; ডিফল্ট NewLife সবুজ #2ecc71"
"AI secondary color. Gradient end color, default dark green #1e8e3e": "AI সেকেন্ডারি রঙ। গ্রেডিয়েন্টের শেষ রঙ, ডিফল্ট গাঢ় সবুজ #1e8e3e"
"OAuth server. Enables the OAuth 2.0 server that provides SSO for other applications": "OAuth সার্ভার। অন্য অ্যাপ্লিকেশনের জন্য SSO প্রদানকারী OAuth 2.0 সার্ভার সক্রিয় করে"
"File manager. Enables backend file management (browse, upload, download, delete); this carries security risks": "ফাইল ম্যানেজার। ব্যাকএন্ড ফাইল ব্যবস্থাপনা (ব্রাউজ, আপলোড, ডাউনলোড, মুছে ফেলা) সক্রিয় করে; এটি নিরাপত্তা ঝুঁকি বহন করে"
"Multi-tenancy. Enables tenants; tenant mode cannot access system administration and platform mode cannot access tenant pages": "মাল্টি-টেন্যান্সি। টেন্যান্ট সক্রিয় করে; টেন্যান্ট মোডে সিস্টেম প্রশাসনে প্রবেশ করা যায় না এবং প্ল্যাটফর্ম মোডে টেন্যান্ট পৃষ্ঠাগুলোতে প্রবেশ করা যায় না"
"Tenant query policy. DenyWithEmpty: return an empty set without tenant context; ThrowOnMissingTenant: throw an explicit error": "টেন্যান্ট কোয়েরি নীতি। DenyWithEmpty: টেন্যান্ট প্রসঙ্গ ছাড়া খালি সেট ফেরত দেয়; ThrowOnMissingTenant: স্পষ্ট ত্রুটি নিক্ষেপ করে"
"User online. 0: do not record; 1: signed-in users only; 2: all visitors (default)": "অনলাইন ব্যবহারকারী। 0: রেকর্ড করবে না; 1: কেবল সাইন-ইন করা ব্যবহারকারী; 2: সব দর্শনার্থী (ডিফল্ট)"
"User statistics. Records user visits, default true": "ব্যবহারকারী পরিসংখ্যান। ব্যবহারকারীর পরিদর্শন রেকর্ড করে, ডিফল্ট true"
"Enable SMS. SMS verification codes and system notifications, default false": "SMS সক্রিয় করুন। SMS যাচাইকরণ কোড ও সিস্টেম বিজ্ঞপ্তি, ডিফল্ট false"
"Enable email. Email verification codes and system notifications, default false": "ইমেল সক্রিয় করুন। ইমেল যাচাইকরণ কোড ও সিস্টেম বিজ্ঞপ্তি, ডিফল্ট false"
"Require email verification. Users must activate their email before signing in and must provide one when registering, default false": "ইমেল যাচাই আবশ্যক। ব্যবহারকারীদের সাইন-ইনের আগে ইমেল সক্রিয় করতে হবে এবং নিবন্ধনে ইমেল দিতে হবে, ডিফল্ট false"
"Require mobile verification. Users must activate their mobile before signing in and must provide one when registering, default false": "মোবাইল যাচাই আবশ্যক। ব্যবহারকারীদের সাইন-ইনের আগে মোবাইল সক্রিয় করতে হবে এবং নিবন্ধনে মোবাইল দিতে হবে, ডিফল্ট false"
"Captcha scenarios. Bit mask: 0: off; 1: sign-in; 2: registration; 4: verification code requests (anti-SMS-bombing); combine with 3 for sign-in and registration. Mandatory scenarios are never exempted, default 0": "ক্যাপচা দৃশ্য। বিট মাস্ক: 0: বন্ধ; 1: সাইন-ইন; 2: নিবন্ধন; 4: যাচাইকরণ কোড অনুরোধ (SMS-বোম্বিং প্রতিরোধ); সাইন-ইন ও নিবন্ধনের জন্য 3-এর সাথে মিলিয়ে ব্যবহার করুন। বাধ্যতামূলক দৃশ্য কখনও ছাড় পায় না, ডিফল্ট 0"
"Risk-adaptive captcha. Disabled when CaptchaScene is 0; when enabled it detects unsafe environments and requires a captcha, default true": "ঝুঁকি-অভিযোজিত ক্যাপচা। CaptchaScene 0 হলে নিষ্ক্রিয়; সক্রিয় থাকলে অনিরাপদ পরিবেশ শনাক্ত করে ক্যাপচা দাবি করে, ডিফল্ট true"
"Captcha risk threshold. Requires a captcha when the risk score reaches this value: 0: intranet; 1: internet; 2: internet with recent failures; 3: banned. Default 2": "ক্যাপচা ঝুঁকি থ্রেশহোল্ড। ঝুঁকি স্কোর এই মানে পৌঁছালে ক্যাপচা দাবি করে: 0: ইন্ট্রানেট; 1: ইন্টারনেট; 2: সাম্প্রতিক ব্যর্থতাসহ ইন্টারনেট; 3: নিষিদ্ধ। ডিফল্ট 2"
"Trusted device lifetime. Days during which previously successful devices skip adaptive captchas, default 30": "বিশ্বস্ত ডিভাইস আয়ু। আগে সফল ডিভাইস কত দিন অভিযোজিত ক্যাপচা এড়িয়ে যায়, ডিফল্ট 30"
"Enable MFA. Allows users to enable TOTP multi-factor authentication; an enhanced feature, default false": "MFA সক্রিয় করুন। ব্যবহারকারীদের TOTP বহু-ফ্যাক্টর প্রমাণীকরণ সক্রিয় করার অনুমতি দেয়; একটি উন্নত বৈশিষ্ট্য, ডিফল্ট false"
"File storage serving. Responds to file download requests from other nodes, default true": "ফাইল স্টোরেজ সার্ভিং। অন্য নোডের ফাইল ডাউনলোড অনুরোধে সাড়া দেয়, ডিফল্ট true"
"File storage fetch. Pulls new files published by other nodes, default true": "ফাইল স্টোরেজ ফেচ। অন্য নোডের প্রকাশিত নতুন ফাইল টেনে আনে, ডিফল্ট true"
"File fetch timeout. Maximum milliseconds to wait for other nodes when a file is missing locally, default 5000": "ফাইল ফেচ টাইমআউট। ফাইল স্থানীয়ভাবে না থাকলে অন্য নোডের জন্য সর্বোচ্চ অপেক্ষার মিলিসেকেন্ড, ডিফল্ট 5000"
"Attachment storage. Local disk, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu or EasyIO; default Local": "সংযুক্তি স্টোরেজ। লোকাল ডিস্ক, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu বা EasyIO; ডিফল্ট Local"
"Object storage server. S3-compatible endpoint for OSS/COS/Qiniu, such as oss-cn-beijing.aliyuncs.com": "অবজেক্ট স্টোরেজ সার্ভার। OSS/COS/Qiniu-এর জন্য S3-সামঞ্জস্যপূর্ণ এন্ডপয়েন্ট, যেমন oss-cn-beijing.aliyuncs.com"
"Object storage bucket. Bucket name for OSS/COS/Qiniu": "অবজেক্ট স্টোরেজ বাকেট। OSS/COS/Qiniu-এর বাকেট নাম"
"Object storage region. S3 signing scope, such as cn-beijing / ap-beijing / cn-east-1": "অবজেক্ট স্টোরেজ অঞ্চল। S3 সাইনিং স্কোপ, যেমন cn-beijing / ap-beijing / cn-east-1"
"Object storage app ID. AccessKeyId": "অবজেক্ট স্টোরেজ অ্যাপ আইডি। AccessKeyId"
"Object storage app secret. AccessKeySecret": "অবজেক্ট স্টোরেজ অ্যাপ সিক্রেট। AccessKeySecret"
"Data retention. Days to keep audit and OAuth logs, default 30": "ডেটা ধারণকাল। অডিট ও OAuth লগ কত দিন রাখবে, ডিফল্ট 30"
"File retention. Days to keep backup files, default 15": "ফাইল ধারণকাল। ব্যাকআপ ফাইল কত দিন রাখবে, ডিফল্ট 15"
"Retention size floor. Files smaller than this (KB) are never deleted even after the retention period, default 1024K": "ধারণ আকারের নিম্নসীমা। এই আকারের (KB) চেয়ে ছোট ফাইল ধারণকাল শেষ হলেও কখনও মুছে ফেলা হয় না, ডিফল্ট 1024K"
"Maximum export rows. Maximum rows a page may export, default 10_000_000": "সর্বোচ্চ রপ্তানি সারি। একটি পৃষ্ঠা সর্বোচ্চ যত সারি রপ্তানি করতে পারে, ডিফল্ট 10_000_000"
"Maximum backup rows. Maximum rows a page may back up, default 10_000_000": "সর্বোচ্চ ব্যাকআপ সারি। একটি পৃষ্ঠা সর্বোচ্চ যত সারি ব্যাকআপ করতে পারে, ডিফল্ট 10_000_000"
"API prefixes. Comma- or semicolon-separated prefixes such as /api,/api/v1; matching requests are forwarded to the real route without the prefix": "API প্রিফিক্স। কমা বা সেমিকোলন-বিভক্ত প্রিফিক্স যেমন /api,/api/v1; মিলে যাওয়া অনুরোধ প্রিফিক্স ছাড়া আসল রুটে ফরওয়ার্ড করা হয়"
"Password strength. * means unrestricted; by default at least 8 characters with digits, upper/lower case letters and symbols. Simple form: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$": "পাসওয়ার্ড শক্তি। * মানে কোনো সীমাবদ্ধতা নেই; ডিফল্টভাবে কমপক্ষে ৮ অক্ষর যাতে সংখ্যা, ছোট/বড় হাতের অক্ষর ও চিহ্ন থাকবে। সরল রূপ: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$"
"Cookie mode. Default SameSite mode for token cookies (-1 Unspecified, 0 None, 1 Lax, 2 Strict)": "Cookie মোড। টোকেন cookie-র ডিফল্ট SameSite মোড (-1 Unspecified, 0 None, 1 Lax, 2 Strict)"
"Cookie domain. Writes cookies to a parent domain; empty uses the current domain. A top-level domain requires HTTPS and prevents plain HTTP from writing same-name keys on the local domain": "Cookie ডোমেইন। প্যারেন্ট ডোমেইনে cookie লেখে; খালি রাখলে চলতি ডোমেইন। টপ-লেভেল ডোমেইনে HTTPS প্রয়োজন এবং স্থানীয় ডোমেইনে সাধারণ HTTP-কে একই নামের কী লিখতে দেয় না"
"Activation URL. Front-end activation page URL used in email activation links, such as https://xxx/activate; empty builds /activate from the request host": "অ্যাক্টিভেশন URL। ইমেল অ্যাক্টিভেশন লিঙ্কে ব্যবহৃত ফ্রন্টএন্ড অ্যাক্টিভেশন পৃষ্ঠার URL, যেমন https://xxx/activate; খালি রাখলে অনুরোধের হোস্ট থেকে /activate তৈরি হয়"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default false": "টোকেন cookie-তে সংরক্ষণ। অনুরোধের হেডারে না থাকলে cookie থেকে টোকেন পড়ে, ডিফল্ট false"
"Password strength. * means unrestricted; the simple form defaults to 5 to 32 characters of any type. The full form requires at least 8 characters with digits, upper/lower case letters and symbols: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$": "পাসওয়ার্ড শক্তি। * মানে কোনো সীমাবদ্ধতা নেই; সরল রূপে ডিফল্টভাবে যেকোনো ধরনের ৫ থেকে ৩২ অক্ষর। পূর্ণ রূপে কমপক্ষে ৮ অক্ষর দরকার যাতে সংখ্যা, ছোট/বড় হাতের অক্ষর ও চিহ্ন থাকবে: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$"
