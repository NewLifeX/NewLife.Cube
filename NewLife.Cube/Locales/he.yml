"Online peak warning {0}": "אזהרת שיא מחוברים {0}"
"There are {0} users online, exceeding the {1}-day record of {2} (threshold {3:0}). This may be a campaign, a crawler scan or abnormal traffic; check the online list and sign-in log.": "ישנם {0} משתמשים מחוברים, יותר מהשיא של {1} ימים שעומד על {2} (סף {3:0}). ייתכן שמדובר בקמפיין, סריקת זוחל או תעבורה חריגה; יש לבדוק את רשימת המחוברים ואת יומן הכניסות."
"Record of the last {0} days: {1}": "שיא {0} הימים האחרונים: {1}"
"Cube admin console": "קונסולת הניהול של Cube"
"You are the AI assistant of {0}, helping an administrator work on the current page.": "אתה העוזר החכם של {0}, המסייע למנהל לעבוד בעמוד הנוכחי."
"The current page is not an entity data page (it may be system settings, the home page or system information), so there is no entity table context.": "העמוד הנוכחי אינו עמוד נתוני ישות (ייתכן שהוא הגדרות מערכת, העמוד הראשי או מידע מערכת), ולכן אין הקשר של טבלת ישות."
"Available tools: get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "כלים זמינים: get_page_context / get_system_info / run_js (ראו את הגדרות הפונקציות; קראו להן בעת הצורך)"
"Rules:": "כללים:"
"1. Answer in the same language as the user's question, concisely and professionally": "1. יש להשיב באותה שפה שבה נשאלה השאלה, בקצרה ובמקצועיות"
"2. When the user asks about the content, data or structure of the current page, call get_page_context to collect the page context from the user's browser, then give your analysis and conclusion": "2. כאשר המשתמש שואל על התוכן, הנתונים או המבנה של העמוד הנוכחי, יש לקרוא ל-get_page_context כדי לאסוף את הקשר העמוד מהדפדפן של המשתמש, ואז להציג ניתוח ומסקנה"
"3. When the user asks about system status or diagnostics, call get_system_info, then give conclusions and suggestions": "3. כאשר המשתמש שואל על מצב המערכת או אבחון, יש לקרוא ל-get_system_info ואז להציג מסקנות והמלצות"
