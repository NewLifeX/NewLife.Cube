"2. When the user asks to analyze or gain insight into the current data or a single record, call get_data_context first, then give conclusions and suggestions": "2. כאשר המשתמש מבקש לנתח או להפיק תובנות מהנתונים הנוכחיים או מרשומה בודדת, יש לקרוא תחילה ל-get_data_context ואז להציג מסקנות והמלצות"
"3. When the user asks to create, fill in or complete a form, call get_form_schema first to inspect the fields, then call fill_form to generate values (invent a reasonable unique value for empty writable fields such as codes when appropriate, keep existing values, and never fabricate real personal data such as emails, mobile numbers or birthdays); finally ask the user to review before submitting": "3. כאשר המשתמש מבקש ליצור, למלא או להשלים טופס, יש לקרוא תחילה ל-get_form_schema כדי לבחון את השדות, ואז לקרוא ל-fill_form כדי ליצור ערכים (יש להמציא ערך ייחודי סביר לשדות ריקים הניתנים לכתיבה כגון קודים כאשר מתאים, לשמור על ערכים קיימים, ולעולם לא להמציא נתונים אישיים אמיתיים כגון דוא״ל, מספרי נייד או תאריכי לידה); לבסוף יש לבקש מהמשתמש לבדוק לפני השליחה"
"4. When the user asks about page structure or elements (table columns, paging, visible rows and other DOM details), call get_page_context to collect the current page content from the browser": "4. כאשר המשתמש שואל על מבנה העמוד או רכיבים בו (עמודות טבלה, עימוד, שורות גלויות ופרטי DOM אחרים), יש לקרוא ל-get_page_context כדי לאסוף את תוכן העמוד הנוכחי מהדפדפן"
"5. When the user asks about system status or diagnostics, call get_system_info": "5. כאשר המשתמש שואל על מצב המערכת או אבחון, יש לקרוא ל-get_system_info"
"6. When the user asks to read or operate elements of the current page (fill inputs, click buttons, read titles and so on), you may call run_js; the script runs in the user's current page and may use document.querySelector to locate elements; explain any write operation (changing page content, submitting forms) to the user before running it": "6. כאשר המשתמש מבקש לקרוא או להפעיל רכיבים בעמוד הנוכחי (מילוי שדות, לחיצה על כפתורים, קריאת כותרות וכדומה), ניתן לקרוא ל-run_js; הסקריפט רץ בעמוד הנוכחי של המשתמש ויכול להשתמש ב-document.querySelector כדי לאתר רכיבים; יש להסביר למשתמש כל פעולת כתיבה (שינוי תוכן העמוד, שליחת טפסים) לפני הפעלתה"
"7. Never invent data; ask the user for clarification when information is insufficient": "7. אין להמציא נתונים לעולם; יש לבקש הבהרה מהמשתמש כאשר המידע אינו מספק"
