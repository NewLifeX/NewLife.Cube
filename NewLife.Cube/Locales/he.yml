# 设置页字段、分类与导航（中文源文经英文规范键翻译）
"Auto (follow system)": "אוטומטי (לפי המערכת)"
"Cancel": "ביטול"
"Queries {0}, executes {1}, elapsed {2:n0} ms": "{0} שאילתות, {1} הפעלות, זמן שחלף {2:n0} ms"
"Show run time": "הצגת זמן ריצה"
"Avatar directory. Downloads remote avatars locally; defaults to the Avatars subdirectory, or Avatars next to the web root. Empty disables downloading": "תיקיית אווטאר. מוריד אווטארים מרוחקים מקומית; ברירת מחדל היא תת-התיקייה Avatars, או Avatars לצד שורש האתר. ריק משבית את ההורדה"
"Text avatar characters. Generates an SVG text avatar when no image exists; 1 to 3 characters. Uses the first N Chinese characters to keep the surname, or the initials of English words. Default 2": "תווי אווטאר טקסטואלי. יוצר אווטאר טקסטואלי SVG כשאין תמונה; 1 עד 3 תווים. משתמש ב-N התווים הראשונים של השם הסיני כדי לשמור על שם המשפחה, או באותיות הראשיות של מילים באנגלית. ברירת מחדל 2"
"Upload directory. Defaults to Uploads": "תיקיית העלאה. ברירת מחדל Uploads"
"Web root directory. Defaults to wwwroot": "תיקיית שורש האתר. ברירת מחדל wwwroot"
"Resource URL. CDN base such as https://sso.newlifex.com/content/; empty uses local resources": "כתובת URL של משאבים. בסיס CDN כגון https://sso.newlifex.com/content/; ריק משתמש במשאבים מקומיים"
"CORS origins. Other origins allowed to access this site; * allows any origin": "מקורות CORS. מקורות אחרים המותרים לגשת לאתר זה; * מתיר כל מקור"
"Iframe embedding. Empty allows the same domain only; SAMEORIGIN allows the same domain and port; ALLOWALL allows any domain": "הטמעת Iframe. ריק מתיר רק דומיין זהה; SAMEORIGIN מתיר דומיין ופורט זהים; ALLOWALL מתיר כל דומיין"
"Share expiration. Lifetime of share tokens in seconds, default 7200": "תפוגת שיתוף. משך החיים של אסימוני שיתוף בשניות, ברירת מחדל 7200"
"Bot error code. Returns this error for crawlers, such as 404/500; 0 disables blocking": "קוד שגיאת בוטים. מחזיר שגיאה זו לזוחלים, כגון 404/500; 0 משבית את החסימה"
"Force redirect. Target scheme and host for GET requests; * is supported in the host. Commonly used to force HTTPS, such as https://*:8081": "הפניה כפויה. הסכימה והמארח ליעד עבור בקשות GET; * נתמך במארח. משמש בדרך כלל לכפיית HTTPS, כגון https://*:8081"
"Security mode. 0: off; 1: observe and log only; 2: block; 3: automatic (default; observes, bans repeated attackers, and temporarily blocks broad attacks with automatic rollback)": "מצב אבטחה. 0: כבוי; 1: צפייה ותיעוד בלבד; 2: חסימה; 3: אוטומטי (ברירת מחדל; צופה, חוסם תוקפים חוזרים וחוסם זמנית התקפות רחבות עם החזרה אוטומטית)"
"Auto-ban durations. Comma-separated seconds that increase with each trigger; empty uses 60,300,1800,7200,86400": "משכי חסימה אוטומטית. שניות מופרדות בפסיקים שעולות בכל הפעלה; ריק משתמש ב-60,300,1800,7200,86400"
"Trusted proxies. Forwarded headers are only trusted from these comma-separated IPs or CIDR ranges; empty keeps the legacy behavior of trusting all forwarded headers": "פרוקסי מהימנים. כותרות Forwarded מתקבלות רק מכתובות IP או טווחי CIDR אלה המופרדים בפסיקים; ריק שומר על ההתנהגות הישנה של אמון בכל כותרות Forwarded"
"Trusted proxy learning limit. When no trusted proxies are configured, private direct sources that send forwarded headers are learned up to this count; 0 disables learning (typically 2 for one data center, 4 for two)": "מגבלת לימוד פרוקסי מהימנים. כשלא הוגדרו פרוקסי מהימנים, מקורות ישירים פרטיים ששולחים כותרות Forwarded נלמדים עד למספר זה; 0 משבית את הלימוד (בדרך כלל 2 למרכז נתונים אחד, 4 לשניים)"
"Learned proxies. Maintained automatically; clear it to reset the learned list": "פרוקסי שנלמדו. מתוחזקים אוטומטית; נקה אותם כדי לאפס את הרשימה הנלמדת"
"Default role. Defaults to the Normal User role": "תפקיד ברירת מחדל. ברירת מחדל היא התפקיד של משתמש רגיל"
"Allow password sign-in. Allows signing in with a username and password": "אפשר התחברות בסיסמה. מאפשר התחברות עם שם משתמש וסיסמה"
"Allow plain-text passwords. Default true for legacy clients; false forces Challenge-Response encrypted passwords": "אפשר סיסמאות טקסט פשוט. ברירת מחדל true עבור לקוחות ישנים; false כופה סיסמאות מוצפנות בשיטת אתגר-תגובה"
"Allow registration. Allows registering with a username and password": "אפשר הרשמה. מאפשר הרשמה עם שם משתמש וסיסמה"
"Auto registration. Default true; after SSO sign-in an unknown local user is registered automatically. Enabled when either the global or the OAuth app setting is on": "הרשמה אוטומטית. ברירת מחדל true; לאחר התחברות SSO משתמש מקומי לא מוכר נרשם אוטומטית. מופעל כאשר ההגדרה הגלובלית או הגדרת אפליקציית OAuth דלוקה"
"Password complexity check. When enabled the sign-in page validates password strength; when disabled it only requires a non-empty password. Default true": "בדיקת מורכבות סיסמה. כשמופעל, עמוד ההתחברות מאמת את חוזק הסיסמה; כשמושבת נדרשת רק סיסמה לא ריקה. ברירת מחדל true"
"Login failure limit. Bans sign-in after this many consecutive failures for the same user or IP, default 5": "מגבלת כשלי התחברות. חוסם התחברות לאחר מספר כשלים רצופים זה עבור אותו משתמש או IP, ברירת מחדל 5"
"Login ban duration. Seconds a risk-control ban lasts, default 300": "משך חסימת התחברות. שניות שחסימת בקרת הסיכון נמשכת, ברירת מחדל 300"
"Class C subnet ban threshold. Bans a /24 subnet such as 103.125.146.* after this many failures, default 10; 0 disables": "סף חסימת תת-רשת Class C. חוסם תת-רשת /24 כגון 103.125.146.* לאחר מספר כשלים זה, ברירת מחדל 10; 0 משבית"
"Class B subnet ban threshold. Bans a /16 subnet such as 103.125.*.* after this many failures, default 20; 0 disables": "סף חסימת תת-רשת Class B. חוסם תת-רשת /16 כגון 103.125.*.* לאחר מספר כשלים זה, ברירת מחדל 20; 0 משבית"
"Force bind by user name. Binds SSO users to local users with the same name without a provider prefix; intended for user centers": "קישור כפוי לפי שם משתמש. מקשר משתמשי SSO למשתמשים מקומיים באותו שם ללא קידומת ספק; מיועד למרכזי משתמשים"
"Bind by user code. Binds SSO users to local users by user code": "קישור לפי קוד משתמש. מקשר משתמשי SSO למשתמשים מקומיים לפי קוד משתמש"
"Bind by mobile. Binds SSO users to local users by mobile number": "קישור לפי נייד. מקשר משתמשי SSO למשתמשים מקומיים לפי מספר נייד"
"Bind by email. Binds SSO users to local users by email": "קישור לפי דוא״ל. מקשר משתמשי SSO למשתמשים מקומיים לפי דוא״ל"
"Bind by nickname. Binds SSO users to local users by nickname; suitable for internal SSO, not for social networks with many duplicate names": "קישור לפי כינוי. מקשר משתמשי SSO למשתמשים מקומיים לפי כינוי; מתאים ל-SSO פנימי, לא לרשתות חברתיות עם שמות כפולים רבים"
"Use SSO roles. Keeps SSO roles after sign-in, default true; otherwise DefaultRole is used": "שימוש בתפקידי SSO. שומר על תפקידי SSO לאחר ההתחברות, ברירת מחדל true; אחרת משתמש ב-DefaultRole"
"Use SSO departments. Keeps SSO departments after sign-in, default true": "שימוש במחלקות SSO. שומר על מחלקות SSO לאחר ההתחברות, ברירת מחדל true"
"SSO role rules. Automatically upgrades the primary role after SSO sign-in; separate rules with commas. Format: source role+department wildcard=target role, for example Guest+Route*=Route Specialist": "כללי תפקיד SSO. משדרג אוטומטית את התפקיד הראשי לאחר התחברות SSO; יש להפריד כללים בפסיקים. תבנית: תפקיד מקור+מחלקה עם תו כללי=תפקיד יעד, לדוגמה Guest+Route*=Route Specialist"
"Sign out everywhere. false signs out of this site only; true (default) also signs out of the SSO server": "התנתקות מכל מקום. false מתנתק מאתר זה בלבד; true (ברירת מחדל) מתנתק גם משרת SSO"
"Allow multi-device sign-in. false kicks old devices on a new sign-in and revokes all tokens on sign-out; true (default) revokes only the current session": "אפשר התחברות ממספר מכשירים. false מנתק מכשירים ישנים בהתחברות חדשה ומבטל את כל האסימונים בהתנתקות; true (ברירת מחדל) מבטל רק את ההפעלה הנוכחית"
"Session timeout. Session lifetime after SSO sign-in during which the cookie can sign in again; default 0s": "פסק זמן הפעלה. משך החיים של ההפעלה לאחר התחברות SSO שבמהלכו קובץ ה-Cookie יכול להתחבר שוב; ברירת מחדל 0 שניות"
"Token sliding refresh threshold. Refreshes the JWT and rewrites the cookie when its remaining lifetime falls below this many seconds; 0 disables sliding expiration": "סף רענון מתגלגל של אסימון. מרענן את ה-JWT וכותב מחדש את קובץ ה-Cookie כאשר משך החיים שנותר נמוך ממספר שניות זה; 0 משבית תפוגה מתגלגלת"
"User refresh period. Fetches user information once per period across SSO sign-ins, default 600 seconds": "תקופת רענון משתמש. מביא את פרטי המשתמש פעם אחת בכל תקופה לאורך התחברויות SSO, ברירת מחדל 600 שניות"
"JWT secret. Algorithm and key used to sign JWTs, such as HS256:ABCD1234": "סוד JWT. האלגוריתם והמפתח לחתימת JWT, כגון HS256:ABCD1234"
"Token lifetime. Lifetime of the access token in seconds, default 7200": "משך חיי אסימון. משך החיים של אסימון הגישה בשניות, ברירת מחדל 7200"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default true": "שמירת אסימון ב-Cookie. קורא את האסימון מה-Cookie כאשר כותרת הבקשה אינה נושאת אותו, ברירת מחדל true"
"Validate attachment access. Requires sign-in to access attachments, default true": "אימות גישה לקבצים מצורפים. דורש התחברות לגישה לקבצים מצורפים, ברירת מחדל true"
"Public attachment categories. Categories accessible without sign-in, comma-separated, such as markdown,avatar. Applies when ValidateAttachment is true": "קטגוריות קבצים מצורפים ציבוריות. קטגוריות הנגישות ללא התחברות, מופרדות בפסיקים, כגון markdown,avatar. חל כאשר ValidateAttachment הוא true"
"Private attachment categories. Categories only the uploader can access, comma-separated. Applies when ValidateAttachment is true": "קטגוריות קבצים מצורפים פרטיות. קטגוריות שרק המעלה יכול לגשת אליהן, מופרדות בפסיקים. חל כאשר ValidateAttachment הוא true"
"SSO redirect allowlist. Domains allowed to receive the JWT after sign-in, comma-separated with wildcard prefixes such as *.company.com. Empty allows the same site only; other origins are rejected and sent back to the home page": "רשימת היתר להפניה של SSO. דומיינים המותרים לקבל JWT לאחר התחברות, מופרדים בפסיקים עם קידומות של תו כללי כגון *.company.com. ריק מתיר רק את האתר הזה; מקורות אחרים נדחים ומוחזרים לעמוד הבית"
"External authentication URL. When local authentication fails, credentials are verified by this endpoint; on success the local user is created or updated and signed in": "כתובת URL לאימות חיצוני. כאשר אימות מקומי נכשל, פרטי ההתחברות מאומתים דרך נקודת קצה זו; בהצלחה המשתמש המקומי נוצר או מתעדכן ומתחבר"
"Start page. First content page opened after entering the admin console": "עמוד התחלה. עמוד התוכן הראשון שנפתח לאחר הכניסה לקונסולת הניהול"
"Theme. Content page theme, ACE/layui": "ערכת עיצוב. ערכת העיצוב של עמוד התוכן, ACE/layui"
"Skin. Outer frame layout, ACE/layui": "סקין. פריסת המסגרת החיצונית, ACE/layui"
"Login tip. Empty hides the tip on the sign-in page": "רמז התחברות. ריק מסתיר את הרמז בעמוד ההתחברות"
"Login logo. Empty uses the default logo": "לוגו התחברות. ריק משתמש בלוגו ברירת המחדל"
"Login background. Image URL; empty uses the default background": "רקע התחברות. כתובת URL של תמונה; ריק משתמש ברקע ברירת המחדל"
"Form group layout. 3/2/1 columns on large/medium/small screens, form-group col-xs-12 col-sm-6 col-lg-4": "פריסת קבוצת טופס. 3/2/1 עמודות במסכים גדולים/בינוניים/קטנים, form-group col-xs-12 col-sm-6 col-lg-4"
"Bootstrap select. Nicer drop-downs with a rendering cost": "Bootstrap select. רשימות נפתחות יפות יותר במחיר ביצועים"
"Maximum drop-down items. Maximum options in a related drop-down on forms, default 50; larger lists fall back to a text box": "מספר פריטים מרבי ברשימה נפתחת. מספר האפשרויות המרבי ברשימה נפתחת קשורה בטפסים, ברירת מחדל 50; רשימות גדולות יותר חוזרות לתיבת טקסט"
"Copyright. Empty hides the copyright; variables now/runtime/framework are supported, and now accepts formats such as {now:yyyy}": "זכויות יוצרים. ריק מסתיר את זכויות היוצרים; המשתנים now/runtime/framework נתמכים, ו-now מקבל תבניות כגון {now:yyyy}"
"Filing number. Empty hides the filing information": "מספר רישום. ריק מסתיר את פרטי הרישום"
"Enable new UI": "הפעלת ממשק חדש"
"ECharts theme. Chart theme": "ערכת עיצוב ECharts. ערכת העיצוב של התרשים"
"Title suffix. Appends the system name to page titles, default true": "סיומת כותרת. מוסיף את שם המערכת לכותרת העמודים, ברירת מחדל true"
"Table double-click. Enables row double-click on list pages, default true": "לחיצה כפולה בטבלה. מפעילה לחיצה כפולה על שורות בעמודי רשימה, ברירת מחדל true"
"Table style. Light: minimal thin lines; Standard: clear row lines (default); Grid: full cell borders": "סגנון טבלה. בהיר: קווים דקים מינימליים; תקני: קווי שורות ברורים (ברירת מחדל); רשת: גבולות תאים מלאים"
"Table density. Compact: dense and information-rich (default); Normal: relaxed": "צפיפות טבלה. צפוף: דחוס ועשיר במידע (ברירת מחדל); רגיל: מרווח"
"Stardust web. Stardust console URL; supports direct links to /trace?id={traceId} or /graph?id={traceId}": "Stardust web. כתובת ה-URL של קונסולת Stardust; תומך בקישורים ישירים אל /trace?id={traceId} או /graph?id={traceId}"
"AI master switch. Enables AI features such as log analysis and notification polishing, default false": "מתג ראשי של AI. מפעיל תכונות AI כגון ניתוח יומנים וליטוש התראות, ברירת מחדל false"
"AI provider. Supports NewLife, Ollama, DeepSeek, DashScope, OpenAI and others; default NewLife": "ספק AI. תומך ב-NewLife, Ollama, DeepSeek, DashScope, OpenAI ואחרים; ברירת מחדל NewLife"
"AI endpoint. Defaults to https://ai.newlifex.com for NewLife": "נקודת קצה של AI. ברירת מחדל עבור NewLife היא https://ai.newlifex.com"
"AI ApiKey. Defaults to sk-CubeAI2026 for NewLife": "ApiKey של AI. ברירת מחדל עבור NewLife היא sk-CubeAI2026"
"AI default model. Defaults to newlife-flash for NewLife": "מודל AI ברירת מחדל. ברירת מחדל עבור NewLife היא newlife-flash"
"AI default deep reasoning. Enables think mode for analysis and chat by default; false means fast responses": "חשיבה עמוקה כברירת מחדל ב-AI. מפעיל מצב חשיבה לניתוח ולשיחה כברירת מחדל; false פירושו תגובות מהירות"
"AI color scheme. Fills the primary and secondary colors from a preset": "ערכת צבעי AI. ממלא את הצבע הראשי והמשני מערכה מוגדרת מראש"
"AI primary color. Main color of the launcher, panel header and user bubbles; default NewLife green #2ecc71": "צבע ראשי של AI. הצבע הראשי של המשגר, כותרת הפאנל ובועות המשתמש; ברירת מחדל ירוק NewLife #2ecc71"
"AI secondary color. Gradient end color, default dark green #1e8e3e": "צבע משני של AI. צבע סוף המעבר, ברירת מחדל ירוק כהה #1e8e3e"
"OAuth server. Enables the OAuth 2.0 server that provides SSO for other applications": "שרת OAuth. מפעיל את שרת OAuth 2.0 המספק SSO לאפליקציות אחרות"
"File manager. Enables backend file management (browse, upload, download, delete); this carries security risks": "מנהל קבצים. מפעיל ניהול קבצים בצד השרת (עיון, העלאה, הורדה, מחיקה); הדבר כרוך בסיכוני אבטחה"
"Multi-tenancy. Enables tenants; tenant mode cannot access system administration and platform mode cannot access tenant pages": "ריבוי דיירים. מפעיל דיירים; מצב דייר אינו יכול לגשת לניהול המערכת ומצב פלטפורמה אינו יכול לגשת לעמודי דייר"
"Tenant query policy. DenyWithEmpty: return an empty set without tenant context; ThrowOnMissingTenant: throw an explicit error": "מדיניות שאילתת דייר. DenyWithEmpty: החזרת קבוצה ריקה ללא הקשר דייר; ThrowOnMissingTenant: זריקת שגיאה מפורשת"
"User online. 0: do not record; 1: signed-in users only; 2: all visitors (default)": "משתמשים מחוברים. 0: לא לתעד; 1: רק משתמשים מחוברים; 2: כל המבקרים (ברירת מחדל)"
"User statistics. Records user visits, default true": "סטטיסטיקות משתמשים. מתעד ביקורי משתמשים, ברירת מחדל true"
"Enable SMS. SMS verification codes and system notifications, default false": "הפעלת SMS. אימות ב-SMS"
"Enable email. Email verification codes and system notifications, default false": "הפעלת דוא״ל. קודי אימות בדוא״ל והתראות מערכת, ברירת מחדל false"
"Require email verification. Users must activate their email before signing in and must provide one when registering, default false": "דרישת אימות דוא״ל. על המשתמשים להפעיל את הדוא״ל לפני ההתחברות ולספק דוא״ל בעת ההרשמה, ברירת מחדל false"
"Require mobile verification. Users must activate their mobile before signing in and must provide one when registering, default false": "דרישת אימות נייד. על המשתמשים להפעיל את הנייד לפני ההתחברות ולספק מספר נייד בעת ההרשמה, ברירת מחדל false"
"Captcha scenarios. Bit mask: 0: off; 1: sign-in; 2: registration; 4: verification code requests (anti-SMS-bombing); combine with 3 for sign-in and registration. Mandatory scenarios are never exempted, default 0": "תרחישי קוד אימות חזותי. מסכת סיביות: 0: כבוי; 1: התחברות; 2: הרשמה; 4: בקשות לקוד אימות (הגנה מפני הפצצת SMS); שלב עם 3 עבור התחברות והרשמה. תרחישים חובה אינם פטורים לעולם, ברירת מחדל 0"
"Risk-adaptive captcha. Disabled when CaptchaScene is 0; when enabled it detects unsafe environments and requires a captcha, default true": "קוד אימות חזותי מסתגל לסיכון. מושבת כאשר CaptchaScene הוא 0; כשמופעל הוא מזהה סביבות לא בטוחות ודורש קוד אימות חזותי, ברירת מחדל true"
"Captcha risk threshold. Requires a captcha when the risk score reaches this value: 0: intranet; 1: internet; 2: internet with recent failures; 3: banned. Default 2": "סף סיכון לקוד אימות חזותי. דורש קוד אימות חזותי כאשר ציון הסיכון מגיע לערך זה: 0: רשת פנימית; 1: אינטרנט; 2: אינטרנט עם כשלים אחרונים; 3: חסום. ברירת מחדל 2"
"Trusted device lifetime. Days during which previously successful devices skip adaptive captchas, default 30": "משך חיים של מכשיר מהימן. ימים שבהם מכשירים שהצליחו בעבר מדלגים על קודי אימות חזותיים מסתגלים, ברירת מחדל 30"
"Enable MFA. Allows users to enable TOTP multi-factor authentication; an enhanced feature, default false": "הפעלת MFA. מאפשר למשתמשים להפעיל אימות רב-גורמי TOTP; תכונה מתקדמת, ברירת מחדל false"
"File storage serving. Responds to file download requests from other nodes, default true": "שירות אחסון קבצים. מגיב לבקשות הורדת קבצים מצמתים אחרים, ברירת מחדל true"
"File storage fetch. Pulls new files published by other nodes, default true": "משיכת אחסון קבצים. מושך קבצים חדשים שפורסמו על ידי צמתים אחרים, ברירת מחדל true"
"File fetch timeout. Maximum milliseconds to wait for other nodes when a file is missing locally, default 5000": "פסק זמן למשיכת קבצים. מספר המילישניות המרבי להמתנה לצמתים אחרים כאשר קובץ חסר מקומית, ברירת מחדל 5000"
"Attachment storage. Local disk, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu or EasyIO; default Local": "אחסון קבצים מצורפים. דיסק מקומי, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu או EasyIO; ברירת מחדל Local"
"Object storage server. S3-compatible endpoint for OSS/COS/Qiniu, such as oss-cn-beijing.aliyuncs.com": "שרת אחסון אובייקטים. נקודת קצה תואמת S3 עבור OSS/COS/Qiniu, כגון oss-cn-beijing.aliyuncs.com"
"Object storage bucket. Bucket name for OSS/COS/Qiniu": "דלי אחסון אובייקטים. שם הדלי עבור OSS/COS/Qiniu"
"Object storage region. S3 signing scope, such as cn-beijing / ap-beijing / cn-east-1": "אזור אחסון אובייקטים. היקף החתימה של S3, כגון cn-beijing / ap-beijing / cn-east-1"
"Object storage app ID. AccessKeyId": "מזהה אפליקציית אחסון אובייקטים. AccessKeyId"
"Object storage app secret. AccessKeySecret": "סוד אפליקציית אחסון אובייקטים. AccessKeySecret"
"Data retention. Days to keep audit and OAuth logs, default 30": "שמירת נתונים. ימים לשמירת יומני ביקורת ו-OAuth, ברירת מחדל 30"
"File retention. Days to keep backup files, default 15": "שמירת קבצים. ימים לשמירת קובצי גיבוי, ברירת מחדל 15"
"Retention size floor. Files smaller than this (KB) are never deleted even after the retention period, default 1024K": "רצפת גודל לשמירה. קבצים קטנים מזה (ק״ב) אינם נמחקים לעולם גם לאחר תקופת השמירה, ברירת מחדל 1024K"
"Maximum export rows. Maximum rows a page may export, default 10_000_000": "מספר שורות ייצוא מרבי. מספר השורות המרבי שעמוד יכול לייצא, ברירת מחדל 10_000_000"
"Maximum backup rows. Maximum rows a page may back up, default 10_000_000": "מספר שורות גיבוי מרבי. מספר השורות המרבי שעמוד יכול לגבות, ברירת מחדל 10_000_000"
"API prefixes. Comma- or semicolon-separated prefixes such as /api,/api/v1; matching requests are forwarded to the real route without the prefix": "קידומות API. קידומות מופרדות בפסיקים או בנקודה-פסיק כגון /api,/api/v1; בקשות תואמות מועברות למסלול האמיתי ללא הקידומת"
"Password strength. * means unrestricted; by default at least 8 characters with digits, upper/lower case letters and symbols. Simple form: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$": "חוזק סיסמה. * פירושו ללא הגבלה; כברירת מחדל לפחות 8 תווים עם ספרות, אותיות גדולות/קטנות וסמלים. תבנית פשוטה: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$"
"Cookie mode. Default SameSite mode for token cookies (-1 Unspecified, 0 None, 1 Lax, 2 Strict)": "מצב Cookie. מצב SameSite ברירת מחדל עבור קובצי Cookie של אסימונים (-1 Unspecified, 0 None, 1 Lax, 2 Strict)"
"Cookie domain. Writes cookies to a parent domain; empty uses the current domain. A top-level domain requires HTTPS and prevents plain HTTP from writing same-name keys on the local domain": "דומיין Cookie. כותב קובצי Cookie לדומיין אב; ריק משתמש בדומיין הנוכחי. דומיין ברמה העליונה דורש HTTPS ומונע מ-HTTP פשוט לכתוב מפתחות באותו שם בדומיין המקומי"
"Activation URL. Front-end activation page URL used in email activation links, such as https://xxx/activate; empty builds /activate from the request host": "כתובת URL להפעלה. כתובת ה-URL של עמוד ההפעלה בצד הלקוח המשמשת בקישורי הפעלה בדוא״ל, כגון https://xxx/activate; ריק בונה /activate ממארח הבקשה"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default false": "שמירת אסימון ב-Cookie. קורא את האסימון מה-Cookie כאשר כותרת הבקשה אינה נושאת אותו, ברירת מחדל false"
"Password strength. * means unrestricted; the simple form defaults to 5 to 32 characters of any type. The full form requires at least 8 characters with digits, upper/lower case letters and symbols: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$": "חוזק סיסמה. * פירושו ללא הגבלה; התבנית הפשוטה היא כברירת מחדל 5 עד 32 תווים מכל סוג. התבנית המלאה דורשת לפחות 8 תווים עם ספרות, אותיות גדולות/קטנות וסמלים: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$"
