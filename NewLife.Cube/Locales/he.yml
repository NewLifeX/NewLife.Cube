"Cube MVC/Razor layer of the NewLife framework: ASP.NET Core MVC hosting, Razor view templates, user permission management, SSO sign-in, OAuth server, data export and runtime localization, validated with 10 billion rows in a single table.": "שכבת Cube MVC/Razor של מסגרת NewLife: אחסון ASP.NET Core MVC, תבניות תצוגה Razor, ניהול הרשאות משתמשים, התחברות SSO, שרת OAuth, ייצוא נתונים ולוקליזציה בזמן ריצה, נבדקה עם 10 מיליארד שורות בטבלה אחת."
"Cube Web API library of the NewLife framework": "ספריית Cube Web API של מסגרת NewLife"
"Cube Web API library of the NewLife framework: entity controllers, permission and menu management, field metadata, OAuth server, JWT authentication and runtime localization. Built for front-end/back-end separation with Vue, Blazor and Ant Design front ends, validated with 10 billion rows in a single table.": "ספריית Cube Web API של מסגרת NewLife: בקרי ישויות, ניהול הרשאות ותפריטים, מטא-נתוני שדות, שרת OAuth, אימות JWT ולוקליזציה בזמן ריצה. נבנתה להפרדת צד לקוח וצד שרת עם ממשקי Vue, Blazor ו-Ant Design, נבדקה עם 10 מיליארד שורות בטבלה אחת."
