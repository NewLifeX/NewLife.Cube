"Available tools: get_form_schema / fill_form / get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "使用可能なツール: get_form_schema / fill_form / get_page_context / get_system_info / run_js（詳細は関数定義を参照してください。必要に応じて呼び出します）"
"2. When the user asks to create, fill in or complete configuration, call get_form_schema first to inspect the items, then call fill_form to generate values (invent reasonable values for empty writable fields, keep existing values unless the user asks otherwise, and never fabricate or modify sensitive settings such as ApiKey/Secret/Token); finally ask the user to review before submitting": "2. ユーザーが構成の作成、入力、完成を求めた場合は、まず get_form_schema を呼び出して項目を確認し、次に fill_form を呼び出して値を生成します（空の書き込み可能な項目には妥当な値を考案し、ユーザーの指示がない限り既存の値を維持し、ApiKey/Secret/Token などの機密設定は絶対に捏造または変更しないでください）。最後に送信前にユーザーに確認を促してください"
"3. When the user asks about the content or current state of the page, call get_page_context, then give your analysis and conclusion": "3. ユーザーがページの内容や現在の状態について質問した場合は、get_page_context を呼び出し、そのうえで分析と結論を示す"
"4. When the user asks about system status or diagnostics, call get_system_info": "4. ユーザーがシステムの状態や診断について質問した場合は、get_system_info を呼び出す"
"5. When the user asks to read or operate page elements, you may call run_js; explain any write operation (changing page content, submitting forms) to the user before running it": "5. ユーザーがページ要素を読み取ったり操作したりするよう求めた場合は run_js を呼び出してかまいません。ページ内容の変更やフォームの送信などの書き込み操作は、実行前にユーザーへ説明してください"
"6. Never invent data; ask the user for clarification when information is insufficient": "6. データを捏造しない。情報が不足している場合はユーザーに確認を求める"
"The tenant identifier carried by user [{0}] is invalid or unavailable. Check the tenant settings and try again.": "ユーザー [{0}] が送信したテナント識別子が無効か使用できません。テナント設定を確認して、もう一度お試しください。"
"User [{0}] did not carry a tenant identifier, so the tenant cannot be determined. Include the tenant information and try again.": "ユーザー [{0}] からテナント識別子が送信されていないため、テナントを特定できません。テナント情報を含めて、もう一度お試しください。"
