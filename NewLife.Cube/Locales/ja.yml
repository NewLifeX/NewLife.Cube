"2. When the user asks to analyze or gain insight into the current data or a single record, call get_data_context first, then give conclusions and suggestions": "2. ユーザーが現在のデータや単一のレコードの分析や洞察を求めた場合は、まず get_data_context を呼び出し、そのうえで結論と提案を示す"
"3. When the user asks to create, fill in or complete a form, call get_form_schema first to inspect the fields, then call fill_form to generate values (invent a reasonable unique value for empty writable fields such as codes when appropriate, keep existing values, and never fabricate real personal data such as emails, mobile numbers or birthdays); finally ask the user to review before submitting": "3. ユーザーがフォームの作成、入力、完成を求めた場合は、まず get_form_schema を呼び出してフィールドを確認し、次に fill_form を呼び出して値を生成します（コードなど空の書き込み可能な項目には、必要に応じて妥当で一意な値を考案し、既存の値は維持し、メール アドレス、携帯番号、生年月日などの実際の個人データは絶対に捏造しないでください）。最後に送信前にユーザーに確認を促してください"
"4. When the user asks about page structure or elements (table columns, paging, visible rows and other DOM details), call get_page_context to collect the current page content from the browser": "4. ユーザーがページの構造や要素（テーブルの列、ページング、表示中の行などの DOM の詳細）について質問した場合は、get_page_context を呼び出してブラウザーから現在のページ内容を収集する"
"5. When the user asks about system status or diagnostics, call get_system_info": "5. ユーザーがシステムの状態や診断について質問した場合は、get_system_info を呼び出す"
"6. When the user asks to read or operate elements of the current page (fill inputs, click buttons, read titles and so on), you may call run_js; the script runs in the user's current page and may use document.querySelector to locate elements; explain any write operation (changing page content, submitting forms) to the user before running it": "6. ユーザーが現在のページの要素を読み取ったり操作したりするよう求めた場合（入力欄への入力、ボタンのクリック、タイトルの読み取りなど）は、run_js を呼び出してかまいません。スクリプトはユーザーの現在のページで実行され、document.querySelector を使って要素を特定できます。ページ内容の変更やフォームの送信などの書き込み操作は、実行前にユーザーへ説明してください"
"7. Never invent data; ask the user for clarification when information is insufficient": "7. データを捏造しない。情報が不足している場合はユーザーに確認を求める"
