"Show run time": "実行時間を表示"
"Avatar directory. Downloads remote avatars locally; defaults to the Avatars subdirectory, or Avatars next to the web root. Empty disables downloading": "アバター ディレクトリ。リモートのアバターをローカルにダウンロードします。既定は Avatars サブディレクトリ、または Web ルートの隣にある Avatars です。空にするとダウンロードしません"
"Text avatar characters. Generates an SVG text avatar when no image exists; 1 to 3 characters. Uses the first N Chinese characters to keep the surname, or the initials of English words. Default 2": "テキスト アバターの文字数。画像がない場合に SVG テキスト アバターを生成します。1〜3 文字。姓を残すため中国語の先頭 N 文字、または英単語の頭文字を使用します。既定は 2"
"Upload directory. Defaults to Uploads": "アップロード ディレクトリ。既定は Uploads です"
"Web root directory. Defaults to wwwroot": "Web ルート ディレクトリ。既定は wwwroot です"
"Resource URL. CDN base such as https://sso.newlifex.com/content/; empty uses local resources": "リソース URL。https://sso.newlifex.com/content/ のような CDN ベース。空の場合はローカル リソースを使用します"
"CORS origins. Other origins allowed to access this site; * allows any origin": "CORS オリジン。このサイトへのアクセスを許可する他のオリジン。* はすべてのオリジンを許可します"
"Iframe embedding. Empty allows the same domain only; SAMEORIGIN allows the same domain and port; ALLOWALL allows any domain": "Iframe 埋め込み。空は同一ドメインのみ許可します。SAMEORIGIN は同一ドメインとポートを許可し、ALLOWALL はすべてのドメインを許可します"
"Share expiration. Lifetime of share tokens in seconds, default 7200": "共有の有効期限。共有トークンの有効期間（秒）。既定は 7200"
"Bot error code. Returns this error for crawlers, such as 404/500; 0 disables blocking": "ボット用エラー コード。クローラーに対して 404/500 などのエラーを返します。0 はブロックを無効にします"
"Force redirect. Target scheme and host for GET requests; * is supported in the host. Commonly used to force HTTPS, such as https://*:8081": "強制リダイレクト。GET 要求の転送先スキームとホスト。ホストには * を使用できます。HTTPS を強制する用途が一般的です（例: https://*:8081）"
"Security mode. 0: off; 1: observe and log only; 2: block; 3: automatic (default; observes, bans repeated attackers, and temporarily blocks broad attacks with automatic rollback)": "セキュリティ モード。0: オフ、1: 監視とログのみ、2: ブロック、3: 自動（既定。監視し、繰り返す攻撃者を禁止し、広範な攻撃を一時的にブロックして自動でロールバックします）"
"Auto-ban durations. Comma-separated seconds that increase with each trigger; empty uses 60,300,1800,7200,86400": "自動禁止の期間。トリガーごとに増加する秒数をカンマ区切りで指定します。空の場合は 60,300,1800,7200,86400 を使用します"
"Trusted proxies. Forwarded headers are only trusted from these comma-separated IPs or CIDR ranges; empty keeps the legacy behavior of trusting all forwarded headers": "信頼されたプロキシ。ここにカンマ区切りで指定した IP または CIDR 範囲からの転送ヘッダーのみを信頼します。空の場合は、すべての転送ヘッダーを信頼する従来の動作を維持します"
"Trusted proxy learning limit. When no trusted proxies are configured, private direct sources that send forwarded headers are learned up to this count; 0 disables learning (typically 2 for one data center, 4 for two)": "信頼されたプロキシの学習上限。信頼されたプロキシが未設定の場合、転送ヘッダーを送信するプライベートな直接送信元をこの件数まで学習します。0 は学習を無効にします（目安: データセンター 1 か所なら 2、2 か所なら 4）"
"Learned proxies. Maintained automatically; clear it to reset the learned list": "学習済みプロキシ。自動的に保守されます。クリアすると学習済みリストをリセットします"
"Default role. Defaults to the Normal User role": "既定のロール。既定は一般ユーザー ロールです"
"Allow password sign-in. Allows signing in with a username and password": "パスワード サインインを許可。ユーザー名とパスワードによるサインインを許可します"
"Allow plain-text passwords. Default true for legacy clients; false forces Challenge-Response encrypted passwords": "平文パスワードを許可。旧クライアント向けの既定は true です。false にするとチャレンジ/レスポンス方式の暗号化パスワードを強制します"
"Allow registration. Allows registering with a username and password": "登録を許可。ユーザー名とパスワードによる登録を許可します"
"Auto registration. Default true; after SSO sign-in an unknown local user is registered automatically. Enabled when either the global or the OAuth app setting is on": "自動登録。既定は true です。SSO サインイン後、ローカルに存在しないユーザーを自動で登録します。グローバル設定または OAuth アプリ設定のいずれかが有効な場合に適用されます"
"Password complexity check. When enabled the sign-in page validates password strength; when disabled it only requires a non-empty password. Default true": "パスワード複雑性チェック。有効にするとサインイン ページでパスワード強度を検証します。無効にすると空でないパスワードのみを要求します。既定は true"
"Login failure limit. Bans sign-in after this many consecutive failures for the same user or IP, default 5": "ログイン失敗の上限。同じユーザーまたは IP でこの回数だけ連続して失敗するとサインインを禁止します。既定は 5"
"Login ban duration. Seconds a risk-control ban lasts, default 300": "ログイン禁止期間。リスク制御による禁止が継続する秒数。既定は 300"
"Class C subnet ban threshold. Bans a /24 subnet such as 103.125.146.* after this many failures, default 10; 0 disables": "C クラス サブネットの禁止しきい値。この回数失敗すると 103.125.146.* のような /24 サブネットを禁止します。既定は 10、0 は無効"
"Class B subnet ban threshold. Bans a /16 subnet such as 103.125.*.* after this many failures, default 20; 0 disables": "B クラス サブネットの禁止しきい値。この回数失敗すると 103.125.*.* のような /16 サブネットを禁止します。既定は 20、0 は無効"
"Force bind by user name. Binds SSO users to local users with the same name without a provider prefix; intended for user centers": "ユーザー名による強制紐付け。プロバイダー プレフィックスのない同名のローカル ユーザーに SSO ユーザーを紐付けます。ユーザー センター向けです"
"Bind by user code. Binds SSO users to local users by user code": "ユーザー コードによる紐付け。ユーザー コードで SSO ユーザーをローカル ユーザーに紐付けます"
"Bind by mobile. Binds SSO users to local users by mobile number": "携帯電話番号による紐付け。携帯電話番号で SSO ユーザーをローカル ユーザーに紐付けます"
"Bind by email. Binds SSO users to local users by email": "メール アドレスによる紐付け。メール アドレスで SSO ユーザーをローカル ユーザーに紐付けます"
"Bind by nickname. Binds SSO users to local users by nickname; suitable for internal SSO, not for social networks with many duplicate names": "ニックネームによる紐付け。ニックネームで SSO ユーザーをローカル ユーザーに紐付けます。社内 SSO 向けで、同名の多い SNS には適していません"
"Use SSO roles. Keeps SSO roles after sign-in, default true; otherwise DefaultRole is used": "SSO ロールを使用。サインイン後に SSO のロールを保持します。既定は true、それ以外の場合は DefaultRole を使用します"
"Use SSO departments. Keeps SSO departments after sign-in, default true": "SSO 部門を使用。サインイン後に SSO の部門を保持します。既定は true"
"SSO role rules. Automatically upgrades the primary role after SSO sign-in; separate rules with commas. Format: source role+department wildcard=target role, for example Guest+Route*=Route Specialist": "SSO ロール ルール。SSO サインイン後に主要ロールを自動で昇格します。ルールはカンマ区切りです。形式: 元ロール+部門ワイルドカード=対象ロール（例: Guest+Route*=Route Specialist）"
"Sign out everywhere. false signs out of this site only; true (default) also signs out of the SSO server": "すべての場所からサインアウト。false はこのサイトのみサインアウトします。true（既定）は SSO サーバーからもサインアウトします"
"Allow multi-device sign-in. false kicks old devices on a new sign-in and revokes all tokens on sign-out; true (default) revokes only the current session": "複数デバイスからのサインインを許可。false は新しいサインイン時に古いデバイスを切断し、サインアウト時にすべてのトークンを取り消します。true（既定）は現在のセッションのみ取り消します"
"Session timeout. Session lifetime after SSO sign-in during which the cookie can sign in again; default 0s": "セッション タイムアウト。SSO サインイン後のセッション有効期間で、この間は Cookie で再びサインインできます。既定は 0 秒"
"Token sliding refresh threshold. Refreshes the JWT and rewrites the cookie when its remaining lifetime falls below this many seconds; 0 disables sliding expiration": "トークン スライディング更新のしきい値。残り有効期間がこの秒数を下回ると JWT を更新して Cookie を書き換えます。0 はスライディング期限を無効にします"
"User refresh period. Fetches user information once per period across SSO sign-ins, default 600 seconds": "ユーザー情報の更新間隔。SSO サインインをまたいでこの期間に 1 回、ユーザー情報を取得します。既定は 600 秒"
"JWT secret. Algorithm and key used to sign JWTs, such as HS256:ABCD1234": "JWT シークレット。JWT の署名に使用するアルゴリズムとキー（例: HS256:ABCD1234）"
"Token lifetime. Lifetime of the access token in seconds, default 7200": "トークンの有効期間。アクセス トークンの有効期間（秒）。既定は 7200"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default true": "トークンを Cookie に保存。要求ヘッダーにトークンがない場合に Cookie から読み取ります。既定は true"
"Validate attachment access. Requires sign-in to access attachments, default true": "添付ファイル アクセスを検証。添付ファイルへのアクセスにサインインを要求します。既定は true"
"Public attachment categories. Categories accessible without sign-in, comma-separated, such as markdown,avatar. Applies when ValidateAttachment is true": "公開添付ファイルのカテゴリ。サインインなしでアクセスできるカテゴリをカンマ区切りで指定します（例: markdown,avatar）。ValidateAttachment が true の場合に適用されます"
"Private attachment categories. Categories only the uploader can access, comma-separated. Applies when ValidateAttachment is true": "非公開添付ファイルのカテゴリ。アップロードした本人のみアクセスできるカテゴリをカンマ区切りで指定します。ValidateAttachment が true の場合に適用されます"
"SSO redirect allowlist. Domains allowed to receive the JWT after sign-in, comma-separated with wildcard prefixes such as *.company.com. Empty allows the same site only; other origins are rejected and sent back to the home page": "SSO リダイレクト許可リスト。サインイン後に JWT を受け取れるドメインを、*.company.com のようなワイルドカード プレフィックス付きでカンマ区切り指定します。空の場合は同一サイトのみ許可され、その他のオリジンは拒否されてホーム ページへ戻されます"
"External authentication URL. When local authentication fails, credentials are verified by this endpoint; on success the local user is created or updated and signed in": "外部認証 URL。ローカル認証に失敗した場合、このエンドポイントで資格情報を検証します。成功するとローカル ユーザーを作成または更新してサインインします"
"Start page. First content page opened after entering the admin console": "スタート ページ。管理コンソールに入った後に最初に開くコンテンツ ページ"
"Theme. Content page theme, ACE/layui": "テーマ。コンテンツ ページのテーマ（ACE/layui）"
"Skin. Outer frame layout, ACE/layui": "スキン。外枠のレイアウト（ACE/layui）"
"Login tip. Empty hides the tip on the sign-in page": "ログインのヒント。空にするとサインイン ページのヒントを非表示にします"
"Login logo. Empty uses the default logo": "ログイン ロゴ。空の場合は既定のロゴを使用します"
"Login background. Image URL; empty uses the default background": "ログイン背景。画像の URL。空の場合は既定の背景を使用します"
"Form group layout. 3/2/1 columns on large/medium/small screens, form-group col-xs-12 col-sm-6 col-lg-4": "フォーム グループのレイアウト。大/中/小画面で 3/2/1 列（form-group col-xs-12 col-sm-6 col-lg-4）"
"Bootstrap select. Nicer drop-downs with a rendering cost": "Bootstrap select。見栄えのよいドロップダウンですが、描画コストがかかります"
"Maximum drop-down items. Maximum options in a related drop-down on forms, default 50; larger lists fall back to a text box": "ドロップダウンの最大項目数。フォームの関連ドロップダウンで表示する選択肢の最大数。既定は 50、これを超えるリストはテキスト ボックスになります"
"Copyright. Empty hides the copyright; variables now/runtime/framework are supported, and now accepts formats such as {now:yyyy}": "著作権表示。空にすると著作権表示を非表示にします。変数 now/runtime/framework を使用でき、now には {now:yyyy} などの書式を指定できます"
"Filing number. Empty hides the filing information": "届出番号。空にすると届出情報を非表示にします"
"Enable new UI": "新しい UI を有効化"
"ECharts theme. Chart theme": "ECharts テーマ。グラフのテーマ"
"Title suffix. Appends the system name to page titles, default true": "タイトルの接尾辞。ページ タイトルにシステム名を付加します。既定は true"
"Table double-click. Enables row double-click on list pages, default true": "テーブルのダブルクリック。一覧ページで行のダブルクリックを有効にします。既定は true"
"Table style. Light: minimal thin lines; Standard: clear row lines (default); Grid: full cell borders": "テーブル スタイル。ライト: 細い罫線のみ、標準: 行の罫線を明確に（既定）、グリッド: セル全体に罫線"
"Table density. Compact: dense and information-rich (default); Normal: relaxed": "テーブルの密度。コンパクト: 高密度で情報量が多い（既定）、通常: ゆったり"
"Stardust web. Stardust console URL; supports direct links to /trace?id={traceId} or /graph?id={traceId}": "Stardust Web。Stardust コンソールの URL。/trace?id={traceId} や /graph?id={traceId} への直接リンクをサポートします"
"AI master switch. Enables AI features such as log analysis and notification polishing, default false": "AI マスター スイッチ。ログ分析や通知文の推敲などの AI 機能を有効にします。既定は false"
"AI provider. Supports NewLife, Ollama, DeepSeek, DashScope, OpenAI and others; default NewLife": "AI プロバイダー。NewLife、Ollama、DeepSeek、DashScope、OpenAI などをサポートします。既定は NewLife"
"AI endpoint. Defaults to https://ai.newlifex.com for NewLife": "AI エンドポイント。NewLife の場合は既定で https://ai.newlifex.com です"
"AI ApiKey. Defaults to sk-CubeAI2026 for NewLife": "AI ApiKey。NewLife の場合は既定で sk-CubeAI2026 です"
"AI default model. Defaults to newlife-flash for NewLife": "AI 既定モデル。NewLife の場合は既定で newlife-flash です"
"AI default deep reasoning. Enables think mode for analysis and chat by default; false means fast responses": "AI の既定の深い推論。分析とチャットで既定で think モードを有効にします。false は高速応答を意味します"
"AI color scheme. Fills the primary and secondary colors from a preset": "AI カラー スキーム。プリセットからメイン カラーとサブ カラーを設定します"
"AI primary color. Main color of the launcher, panel header and user bubbles; default NewLife green #2ecc71": "AI メイン カラー。ランチャー、パネル ヘッダー、ユーザー吹き出しの主要色。既定は NewLife グリーンの #2ecc71"
"AI secondary color. Gradient end color, default dark green #1e8e3e": "AI サブ カラー。グラデーションの終端色。既定は濃い緑の #1e8e3e"
"OAuth server. Enables the OAuth 2.0 server that provides SSO for other applications": "OAuth サーバー。他のアプリケーションに SSO を提供する OAuth 2.0 サーバーを有効にします"
"File manager. Enables backend file management (browse, upload, download, delete); this carries security risks": "ファイル マネージャー。バックエンドのファイル管理（参照、アップロード、ダウンロード、削除）を有効にします。セキュリティ リスクを伴います"
"Multi-tenancy. Enables tenants; tenant mode cannot access system administration and platform mode cannot access tenant pages": "マルチテナント。テナントを有効にします。テナント モードではシステム管理にアクセスできず、プラットフォーム モードではテナント ページにアクセスできません"
"Tenant query policy. DenyWithEmpty: return an empty set without tenant context; ThrowOnMissingTenant: throw an explicit error": "テナント クエリ ポリシー。DenyWithEmpty: テナント コンテキストがない場合は空の結果を返します。ThrowOnMissingTenant: 明示的なエラーをスローします"
"User online. 0: do not record; 1: signed-in users only; 2: all visitors (default)": "オンライン ユーザー。0: 記録しない、1: サインイン済みユーザーのみ、2: すべての訪問者（既定）"
"User statistics. Records user visits, default true": "ユーザー統計。ユーザーの訪問を記録します。既定は true"
"Enable SMS. SMS verification codes and system notifications, default false": "SMS を有効化。SMS 認証"
"Enable email. Email verification codes and system notifications, default false": "メールを有効化。メール確認コードとシステム通知。既定は false"
"Require email verification. Users must activate their email before signing in and must provide one when registering, default false": "メール認証を必須にする。ユーザーはサインイン前にメールを認証し、登録時にはメール アドレスの入力が必要です。既定は false"
"Require mobile verification. Users must activate their mobile before signing in and must provide one when registering, default false": "携帯電話認証を必須にする。ユーザーはサインイン前に携帯電話を認証し、登録時には携帯電話番号の入力が必要です。既定は false"
"Captcha scenarios. Bit mask: 0: off; 1: sign-in; 2: registration; 4: verification code requests (anti-SMS-bombing); combine with 3 for sign-in and registration. Mandatory scenarios are never exempted, default 0": "画像認証のシナリオ。ビット マスク: 0: オフ、1: サインイン、2: 登録、4: 確認コード要求（SMS 爆撃対策）。3 でサインインと登録の組み合わせになります。必須シナリオは免除されません。既定は 0"
"Risk-adaptive captcha. Disabled when CaptchaScene is 0; when enabled it detects unsafe environments and requires a captcha, default true": "リスク適応型画像認証。CaptchaScene が 0 の場合は無効です。有効にすると危険な環境を検出して画像認証を要求します。既定は true"
"Captcha risk threshold. Requires a captcha when the risk score reaches this value: 0: intranet; 1: internet; 2: internet with recent failures; 3: banned. Default 2": "画像認証のリスクしきい値。リスク スコアがこの値に達すると画像認証を要求します: 0: イントラネット、1: インターネット、2: 最近失敗があるインターネット、3: 禁止中。既定は 2"
"Trusted device lifetime. Days during which previously successful devices skip adaptive captchas, default 30": "信頼済みデバイスの有効期間。過去に成功したデバイスが適応型画像認証をスキップできる日数。既定は 30"
"Enable MFA. Allows users to enable TOTP multi-factor authentication; an enhanced feature, default false": "MFA を有効化。ユーザーが TOTP 多要素認証を有効にできるようにします。拡張機能です。既定は false"
"File storage serving. Responds to file download requests from other nodes, default true": "ファイル ストレージの配信。他のノードからのファイル ダウンロード要求に応答します。既定は true"
"File storage fetch. Pulls new files published by other nodes, default true": "ファイル ストレージの取得。他のノードが公開した新しいファイルを取得します。既定は true"
"File fetch timeout. Maximum milliseconds to wait for other nodes when a file is missing locally, default 5000": "ファイル取得タイムアウト。ファイルがローカルにない場合に他のノードを待つ最大ミリ秒。既定は 5000"
"Attachment storage. Local disk, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu or EasyIO; default Local": "添付ファイルの保存先。ローカル ディスク、Oss（Alibaba Cloud）、Cos（Tencent Cloud）、Qiniu、EasyIO。既定は Local"
"Object storage server. S3-compatible endpoint for OSS/COS/Qiniu, such as oss-cn-beijing.aliyuncs.com": "オブジェクト ストレージ サーバー。OSS/COS/Qiniu 用の S3 互換エンドポイント（例: oss-cn-beijing.aliyuncs.com）"
"Object storage bucket. Bucket name for OSS/COS/Qiniu": "オブジェクト ストレージのバケット。OSS/COS/Qiniu のバケット名"
"Object storage region. S3 signing scope, such as cn-beijing / ap-beijing / cn-east-1": "オブジェクト ストレージのリージョン。S3 署名スコープ（例: cn-beijing / ap-beijing / cn-east-1）"
"Object storage app ID. AccessKeyId": "オブジェクト ストレージのアプリ ID。AccessKeyId"
"Object storage app secret. AccessKeySecret": "オブジェクト ストレージのアプリ シークレット。AccessKeySecret"
"Data retention. Days to keep audit and OAuth logs, default 30": "データ保持期間。監査ログと OAuth ログを保持する日数。既定は 30"
"File retention. Days to keep backup files, default 15": "ファイル保持期間。バックアップ ファイルを保持する日数。既定は 15"
"Retention size floor. Files smaller than this (KB) are never deleted even after the retention period, default 1024K": "保持サイズの下限。これ（KB）より小さいファイルは保持期間を過ぎても削除されません。既定は 1024K"
"Maximum export rows. Maximum rows a page may export, default 10_000_000": "エクスポートの最大行数。1 ページでエクスポートできる最大行数。既定は 10_000_000"
"Maximum backup rows. Maximum rows a page may back up, default 10_000_000": "バックアップの最大行数。1 ページでバックアップできる最大行数。既定は 10_000_000"
"API prefixes. Comma- or semicolon-separated prefixes such as /api,/api/v1; matching requests are forwarded to the real route without the prefix": "API プレフィックス。/api,/api/v1 のようにカンマまたはセミコロン区切りで指定します。一致する要求はプレフィックスを除いた実際のルートへ転送されます"
"Password strength. * means unrestricted; by default at least 8 characters with digits, upper/lower case letters and symbols. Simple form: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$": "パスワード強度。* は無制限を意味します。既定では 8 文字以上で、数字・大文字・小文字・記号を含める必要があります。簡易形式: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$"
"Cookie mode. Default SameSite mode for token cookies (-1 Unspecified, 0 None, 1 Lax, 2 Strict)": "Cookie モード。トークン Cookie の既定の SameSite モード（-1 Unspecified、0 None、1 Lax、2 Strict）"
"Cookie domain. Writes cookies to a parent domain; empty uses the current domain. A top-level domain requires HTTPS and prevents plain HTTP from writing same-name keys on the local domain": "Cookie ドメイン。親ドメインに Cookie を書き込みます。空の場合は現在のドメインを使用します。トップレベル ドメインを指定するには HTTPS が必要で、平文 HTTP ではローカル ドメインに同名のキーを書き込めません"
"Activation URL. Front-end activation page URL used in email activation links, such as https://xxx/activate; empty builds /activate from the request host": "アクティベーション URL。メールの認証リンクで使用するフロントエンドの認証ページ URL（例: https://xxx/activate）。空の場合は要求ホストから /activate を生成します"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default false": "トークンを Cookie に保存。要求ヘッダーにトークンがない場合に Cookie から読み取ります。既定は false"
"Password strength. * means unrestricted; the simple form defaults to 5 to 32 characters of any type. The full form requires at least 8 characters with digits, upper/lower case letters and symbols: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$": "パスワード強度。* は無制限を意味します。簡易形式では既定で任意の種類の 5〜32 文字です。完全形式では 8 文字以上で、数字・大文字・小文字・記号を含める必要があります: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$"
