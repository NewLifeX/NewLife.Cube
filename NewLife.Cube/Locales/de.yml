"You are a system operations expert. Based on the following runtime metrics, produce a health diagnosis report:\nCover bottlenecks, whether capacity should be expanded, and any risks worth attention.\nOutput the diagnosis report directly without extra explanation.": "Sie sind Experte für Systembetrieb. Erstellen Sie anhand der folgenden Laufzeitkennzahlen einen Gesundheitsbericht:\nGehen Sie auf Engpässe, eine eventuell nötige Kapazitätserweiterung und beachtenswerte Risiken ein.\nGeben Sie den Diagnosebericht direkt ohne zusätzliche Erläuterungen aus."
"Script must not be empty": "Das Skript darf nicht leer sein"
"Browser channel is not ready (Writer not injected)": "Browserkanal ist nicht bereit (Writer nicht injiziert)"
"Run page script": "Seitenskript ausführen"
"Runs JavaScript in the current page and returns the result; can read or modify page elements, for example document.title or document.querySelector('input[name=Name]').value": "Führt JavaScript auf der aktuellen Seite aus und gibt das Ergebnis zurück; kann Seitenelemente lesen oder ändern, zum Beispiel document.title oder document.querySelector('input[name=Name]').value"
"JavaScript code to run in the current page": "JavaScript-Code, der auf der aktuellen Seite ausgeführt wird"
"Get page context": "Seitenkontext abrufen"
"Gets the main data and structure of the current page (title, tables, forms and so on). Uses the server-side context when the page provides one; otherwise collects the page content from the user's browser": "Ruft die wichtigsten Daten und die Struktur der aktuellen Seite ab (Titel, Tabellen, Formulare usw.). Nutzt den serverseitigen Kontext, wenn die Seite einen bereitstellt; andernfalls wird der Seiteninhalt aus dem Browser des Benutzers erfasst"
"Get form schema": "Formularschema abrufen"
"Gets the schema of the current form, including field names, types, descriptions and current values, for generating form values": "Ruft das Schema des aktuellen Formulars ab, einschließlich Feldnamen, Typen, Beschreibungen und aktueller Werte, um Formularwerte zu erzeugen"
"Form mode: add or edit": "Formularmodus: Hinzufügen oder Bearbeiten"
"Fill form": "Formular ausfüllen"
"Generates form field values and fills them into the front-end form. Nothing is written to the database until the user confirms": "Erzeugt Formularfeldwerte und trägt sie in das Frontend-Formular ein. Erst nach Bestätigung durch den Benutzer wird etwas in die Datenbank geschrieben"
"Field values as a JSON string, keyed by field name": "Feldwerte als JSON-Zeichenfolge, nach Feldnamen verschlüsselt"
"No valid field value dictionary was received": "Es wurde kein gültiges Feldwertwörterbuch empfangen"
"[fill_form invalid argument] No valid field value dictionary was received. Call get_form_schema first to get the field structure, then pass the values parameter as {\"field\":value}.": "[fill_form ungültiges Argument] Es wurde kein gültiges Feldwertwörterbuch empfangen. Rufen Sie zuerst get_form_schema auf, um die Feldstruktur zu erhalten, und übergeben Sie dann den Parameter values als {\"field\":value}."
"Generated {0} form field values (skipped {1}, failed {2}) and filled them into the form. Ask the user to review before submitting.": "{0} Formularfeldwerte erzeugt (übersprungen: {1}, fehlgeschlagen: {2}) und in das Formular eingetragen. Bitten Sie den Benutzer, vor dem Absenden zu prüfen."
" descending": " absteigend"
