"Gets the data context of the current page: the current record with its field metadata, or a summary and sample of the current query result, for analysis": "Ruft den Datenkontext der aktuellen Seite ab: den aktuellen Datensatz mit seinen Feldmetadaten oder eine Zusammenfassung und Stichprobe des aktuellen Abfrageergebnisses, zur Analyse"
"Gets the form schema of the current entity, including field names, types, enum values, required flags, descriptions and existing values (edit mode), for generating form values": "Ruft das Formularschema der aktuellen Entität ab, einschließlich Feldnamen, Typen, Enumerationswerten, Pflichtfeldkennzeichen, Beschreibungen und vorhandenen Werten (Bearbeitungsmodus), um Formularwerte zu erzeugen"
"Field values as a JSON string, keyed by field name, for example {\"Name\":\"John\",\"Status\":1}": "Feldwerte als JSON-Zeichenfolge, nach Feldnamen verschlüsselt, zum Beispiel {\"Name\":\"John\",\"Status\":1}"
"Browser operation timed out; the front end returned no result": "Zeitüberschreitung bei der Browser-Operation; das Frontend hat kein Ergebnis zurückgegeben"
