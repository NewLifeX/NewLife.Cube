# 设置页字段、分类与导航（中文源文经英文规范键翻译）
"Auto (follow system)": "Automatisch (Systemeinstellung folgen)"
"Cancel": "Abbrechen"
"Queries {0}, executes {1}, elapsed {2:n0} ms": "Abfragen {0}, Ausführungen {1}, Dauer {2:n0} ms"
"Show run time": "Laufzeit anzeigen"
"Avatar directory. Downloads remote avatars locally; defaults to the Avatars subdirectory, or Avatars next to the web root. Empty disables downloading": "Avatarverzeichnis. Lädt entfernte Avatare lokal herunter; standardmäßig das Unterverzeichnis Avatars oder Avatars neben dem Webstamm. Leer deaktiviert das Herunterladen"
"Text avatar characters. Generates an SVG text avatar when no image exists; 1 to 3 characters. Uses the first N Chinese characters to keep the surname, or the initials of English words. Default 2": "Zeichen für Textavatare. Erzeugt ein SVG-Textavatar, wenn kein Bild vorhanden ist; 1 bis 3 Zeichen. Bei chinesischen Namen werden die ersten N Zeichen verwendet, um den Nachnamen zu erhalten, bei englischen die Anfangsbuchstaben der Wörter. Standard: 2"
"Upload directory. Defaults to Uploads": "Upload-Verzeichnis. Standard: Uploads"
"Web root directory. Defaults to wwwroot": "Webstammverzeichnis. Standard: wwwroot"
"Resource URL. CDN base such as https://sso.newlifex.com/content/; empty uses local resources": "Ressourcen-URL. CDN-Basis wie https://sso.newlifex.com/content/; leer verwendet lokale Ressourcen"
"CORS origins. Other origins allowed to access this site; * allows any origin": "CORS-Ursprünge. Weitere Ursprünge, die auf diese Website zugreifen dürfen; * erlaubt jeden Ursprung"
"Iframe embedding. Empty allows the same domain only; SAMEORIGIN allows the same domain and port; ALLOWALL allows any domain": "Iframe-Einbettung. Leer erlaubt nur dieselbe Domain; SAMEORIGIN erlaubt dieselbe Domain und denselben Port; ALLOWALL erlaubt jede Domain"
"Share expiration. Lifetime of share tokens in seconds, default 7200": "Gültigkeit von Freigaben. Lebensdauer von Freigabe-Tokens in Sekunden, Standard: 7200"
"Bot error code. Returns this error for crawlers, such as 404/500; 0 disables blocking": "Bot-Fehlercode. Liefert Crawlern diesen Fehler zurück, z. B. 404/500; 0 deaktiviert die Sperre"
"Force redirect. Target scheme and host for GET requests; * is supported in the host. Commonly used to force HTTPS, such as https://*:8081": "Erzwungene Weiterleitung. Ziel-Schema und Ziel-Host für GET-Anfragen; * wird im Host unterstützt. Wird häufig verwendet, um HTTPS zu erzwingen, z. B. https://*:8081"
"Security mode. 0: off; 1: observe and log only; 2: block; 3: automatic (default; observes, bans repeated attackers, and temporarily blocks broad attacks with automatic rollback)": "Sicherheitsmodus. 0: aus; 1: nur beobachten und protokollieren; 2: blockieren; 3: automatisch (Standard; beobachtet, sperrt wiederholte Angreifer und blockiert großflächige Angriffe vorübergehend mit automatischer Rücknahme)"
"Auto-ban durations. Comma-separated seconds that increase with each trigger; empty uses 60,300,1800,7200,86400": "Dauer der automatischen Sperren. Durch Kommas getrennte Sekunden, die mit jeder Auslösung ansteigen; leer verwendet 60,300,1800,7200,86400"
"Trusted proxies. Forwarded headers are only trusted from these comma-separated IPs or CIDR ranges; empty keeps the legacy behavior of trusting all forwarded headers": "Vertrauenswürdige Proxys. Weiterleitungsheader werden nur von diesen durch Kommas getrennten IPs oder CIDR-Bereichen akzeptiert; leer behält das bisherige Verhalten bei, allen Weiterleitungsheadern zu vertrauen"
"Trusted proxy learning limit. When no trusted proxies are configured, private direct sources that send forwarded headers are learned up to this count; 0 disables learning (typically 2 for one data center, 4 for two)": "Lernlimit für vertrauenswürdige Proxys. Sind keine vertrauenswürdigen Proxys konfiguriert, werden interne Direktquellen, die Weiterleitungsheader senden, bis zu dieser Anzahl gelernt; 0 deaktiviert das Lernen (üblich sind 2 für ein Rechenzentrum, 4 für zwei)"
"Learned proxies. Maintained automatically; clear it to reset the learned list": "Gelernte Proxys. Werden automatisch gepflegt; leeren setzt die gelernte Liste zurück"
"Default role. Defaults to the Normal User role": "Standardrolle. Standardmäßig die Rolle Normaler Benutzer"
"Allow password sign-in. Allows signing in with a username and password": "Anmeldung mit Passwort zulassen. Erlaubt die Anmeldung mit Benutzername und Passwort"
"Allow plain-text passwords. Default true for legacy clients; false forces Challenge-Response encrypted passwords": "Klartextpasswörter zulassen. Standard: true für ältere Clients; false erzwingt mit Challenge-Response verschlüsselte Passwörter"
"Allow registration. Allows registering with a username and password": "Registrierung zulassen. Erlaubt die Registrierung mit Benutzername und Passwort"
"Auto registration. Default true; after SSO sign-in an unknown local user is registered automatically. Enabled when either the global or the OAuth app setting is on": "Automatische Registrierung. Standard: true; nach der SSO-Anmeldung wird ein unbekannter lokaler Benutzer automatisch registriert. Aktiv, wenn die globale Einstellung oder die Einstellung der OAuth-App eingeschaltet ist"
"Password complexity check. When enabled the sign-in page validates password strength; when disabled it only requires a non-empty password. Default true": "Passwortkomplexitätsprüfung. Wenn aktiviert, prüft die Anmeldeseite die Passwortstärke; wenn deaktiviert, genügt ein nicht leeres Passwort. Standard: true"
"Login failure limit. Bans sign-in after this many consecutive failures for the same user or IP, default 5": "Anmeldefehlergrenze. Sperrt die Anmeldung nach so vielen aufeinanderfolgenden Fehlern für denselben Benutzer oder dieselbe IP, Standard: 5"
"Login ban duration. Seconds a risk-control ban lasts, default 300": "Dauer der Anmeldesperre. Sekunden, die eine Sperre durch die Risikokontrolle andauert, Standard: 300"
"Class C subnet ban threshold. Bans a /24 subnet such as 103.125.146.* after this many failures, default 10; 0 disables": "Sperrschwelle für Klasse-C-Subnetze. Sperrt ein /24-Subnetz wie 103.125.146.* nach so vielen Fehlern, Standard: 10; 0 deaktiviert"
"Class B subnet ban threshold. Bans a /16 subnet such as 103.125.*.* after this many failures, default 20; 0 disables": "Sperrschwelle für Klasse-B-Subnetze. Sperrt ein /16-Subnetz wie 103.125.*.* nach so vielen Fehlern, Standard: 20; 0 deaktiviert"
"Force bind by user name. Binds SSO users to local users with the same name without a provider prefix; intended for user centers": "Erzwungene Bindung nach Benutzername. Bindet SSO-Benutzer an lokale Benutzer gleichen Namens ohne Anbieterpräfix; gedacht für Benutzerzentralen"
"Bind by user code. Binds SSO users to local users by user code": "Bindung nach Benutzercode. Bindet SSO-Benutzer über den Benutzercode an lokale Benutzer"
"Bind by mobile. Binds SSO users to local users by mobile number": "Bindung nach Mobilnummer. Bindet SSO-Benutzer über die Mobilnummer an lokale Benutzer"
"Bind by email. Binds SSO users to local users by email": "Bindung nach E-Mail. Bindet SSO-Benutzer über die E-Mail-Adresse an lokale Benutzer"
"Bind by nickname. Binds SSO users to local users by nickname; suitable for internal SSO, not for social networks with many duplicate names": "Bindung nach Spitzname. Bindet SSO-Benutzer über den Spitznamen an lokale Benutzer; geeignet für internes SSO, nicht für soziale Netzwerke mit vielen doppelten Namen"
"Use SSO roles. Keeps SSO roles after sign-in, default true; otherwise DefaultRole is used": "SSO-Rollen verwenden. Behält die SSO-Rollen nach der Anmeldung bei, Standard: true; andernfalls wird DefaultRole verwendet"
"Use SSO departments. Keeps SSO departments after sign-in, default true": "SSO-Abteilungen verwenden. Behält die SSO-Abteilungen nach der Anmeldung bei, Standard: true"
"SSO role rules. Automatically upgrades the primary role after SSO sign-in; separate rules with commas. Format: source role+department wildcard=target role, for example Guest+Route*=Route Specialist": "SSO-Rollenregeln. Stuft die primäre Rolle nach der SSO-Anmeldung automatisch hoch; Regeln durch Kommas trennen. Format: Quellrolle+Abteilungsplatzhalter=Zielrolle, zum Beispiel Guest+Route*=Route Specialist"
"Sign out everywhere. false signs out of this site only; true (default) also signs out of the SSO server": "Überall abmelden. false meldet nur von dieser Website ab; true (Standard) meldet auch vom SSO-Server ab"
"Allow multi-device sign-in. false kicks old devices on a new sign-in and revokes all tokens on sign-out; true (default) revokes only the current session": "Anmeldung auf mehreren Geräten zulassen. false wirft alte Geräte bei einer neuen Anmeldung ab und widerruft beim Abmelden alle Tokens; true (Standard) widerruft nur die aktuelle Sitzung"
"Session timeout. Session lifetime after SSO sign-in during which the cookie can sign in again; default 0s": "Sitzungszeitlimit. Lebensdauer der Sitzung nach der SSO-Anmeldung, in der sich das Cookie erneut anmelden kann; Standard: 0 s"
"Token sliding refresh threshold. Refreshes the JWT and rewrites the cookie when its remaining lifetime falls below this many seconds; 0 disables sliding expiration": "Schwelle für gleitende Tokenaktualisierung. Erneuert das JWT und schreibt das Cookie neu, wenn seine Restlaufzeit unter diese Sekundenzahl fällt; 0 deaktiviert den gleitenden Ablauf"
"User refresh period. Fetches user information once per period across SSO sign-ins, default 600 seconds": "Aktualisierungsintervall für Benutzer. Ruft Benutzerinformationen bei SSO-Anmeldungen einmal pro Intervall ab, Standard: 600 Sekunden"
"JWT secret. Algorithm and key used to sign JWTs, such as HS256:ABCD1234": "JWT-Geheimnis. Algorithmus und Schlüssel zum Signieren von JWTs, z. B. HS256:ABCD1234"
"Token lifetime. Lifetime of the access token in seconds, default 7200": "Token-Lebensdauer. Lebensdauer des Zugriffstokens in Sekunden, Standard: 7200"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default true": "Token im Cookie speichern. Liest das Token aus dem Cookie, wenn der Anforderungsheader keines enthält, Standard: true"
"Validate attachment access. Requires sign-in to access attachments, default true": "Anhangszugriff prüfen. Erfordert eine Anmeldung für den Zugriff auf Anhänge, Standard: true"
"Public attachment categories. Categories accessible without sign-in, comma-separated, such as markdown,avatar. Applies when ValidateAttachment is true": "Öffentliche Anhangskategorien. Kategorien, die ohne Anmeldung zugänglich sind, durch Kommas getrennt, z. B. markdown,avatar. Gilt, wenn ValidateAttachment true ist"
"Private attachment categories. Categories only the uploader can access, comma-separated. Applies when ValidateAttachment is true": "Private Anhangskategorien. Kategorien, auf die nur der Hochladende zugreifen kann, durch Kommas getrennt. Gilt, wenn ValidateAttachment true ist"
"SSO redirect allowlist. Domains allowed to receive the JWT after sign-in, comma-separated with wildcard prefixes such as *.company.com. Empty allows the same site only; other origins are rejected and sent back to the home page": "SSO-Weiterleitungs-Allowlist. Domains, die nach der Anmeldung das JWT erhalten dürfen, durch Kommas getrennt mit Platzhalterpräfixen wie *.company.com. Leer erlaubt nur dieselbe Website; andere Ursprünge werden abgelehnt und zur Startseite zurückgeschickt"
"External authentication URL. When local authentication fails, credentials are verified by this endpoint; on success the local user is created or updated and signed in": "URL für externe Authentifizierung. Wenn die lokale Authentifizierung fehlschlägt, werden die Anmeldedaten über diesen Endpunkt geprüft; bei Erfolg wird der lokale Benutzer angelegt oder aktualisiert und angemeldet"
"Start page. First content page opened after entering the admin console": "Startseite. Erste Inhaltsseite, die nach dem Aufruf der Verwaltungskonsole geöffnet wird"
"Theme. Content page theme, ACE/layui": "Design. Design der Inhaltsseite, ACE/layui"
"Skin. Outer frame layout, ACE/layui": "Skin. Layout des äußeren Rahmens, ACE/layui"
"Login tip. Empty hides the tip on the sign-in page": "Anmeldehinweis. Leer blendet den Hinweis auf der Anmeldeseite aus"
"Login logo. Empty uses the default logo": "Anmeldelogo. Leer verwendet das Standardlogo"
"Login background. Image URL; empty uses the default background": "Anmeldehintergrund. Bild-URL; leer verwendet den Standardhintergrund"
"Form group layout. 3/2/1 columns on large/medium/small screens, form-group col-xs-12 col-sm-6 col-lg-4": "Layout der Formulargruppen. 3/2/1 Spalten auf großen/mittleren/kleinen Bildschirmen, form-group col-xs-12 col-sm-6 col-lg-4"
"Bootstrap select. Nicer drop-downs with a rendering cost": "Bootstrap Select. Schönere Auswahllisten, jedoch mit Renderingkosten"
"Maximum drop-down items. Maximum options in a related drop-down on forms, default 50; larger lists fall back to a text box": "Maximale Anzahl Auswahleinträge. Maximale Optionen in einer verknüpften Auswahlliste in Formularen, Standard: 50; größere Listen fallen auf ein Textfeld zurück"
"Copyright. Empty hides the copyright; variables now/runtime/framework are supported, and now accepts formats such as {now:yyyy}": "Copyright. Leer blendet das Copyright aus; die Variablen now/runtime/framework werden unterstützt, und now akzeptiert Formate wie {now:yyyy}"
"Filing number. Empty hides the filing information": "Registrierungsnummer. Leer blendet die Registrierungsangaben aus"
"Enable new UI": "Neue Oberfläche aktivieren"
"ECharts theme. Chart theme": "ECharts-Design. Design der Diagramme"
"Title suffix. Appends the system name to page titles, default true": "Titelzusatz. Hängt den Systemnamen an Seitentitel an, Standard: true"
"Table double-click. Enables row double-click on list pages, default true": "Doppelklick in Tabellen. Aktiviert den Doppelklick auf Zeilen in Listenansichten, Standard: true"
"Table style. Light: minimal thin lines; Standard: clear row lines (default); Grid: full cell borders": "Tabellenstil. Hell: minimale dünne Linien; Standard: klare Zeilenlinien (voreingestellt); Gitter: vollständige Zellrahmen"
"Table density. Compact: dense and information-rich (default); Normal: relaxed": "Tabellendichte. Kompakt: dicht und informationsreich (Standard); Normal: luftig"
"Stardust web. Stardust console URL; supports direct links to /trace?id={traceId} or /graph?id={traceId}": "Stardust-Web. URL der Stardust-Konsole; unterstützt direkte Links auf /trace?id={traceId} oder /graph?id={traceId}"
"AI master switch. Enables AI features such as log analysis and notification polishing, default false": "KI-Hauptschalter. Aktiviert KI-Funktionen wie Protokollanalyse und das Glätten von Benachrichtigungstexten, Standard: false"
"AI provider. Supports NewLife, Ollama, DeepSeek, DashScope, OpenAI and others; default NewLife": "KI-Anbieter. Unterstützt NewLife, Ollama, DeepSeek, DashScope, OpenAI und andere; Standard: NewLife"
"AI endpoint. Defaults to https://ai.newlifex.com for NewLife": "KI-Endpunkt. Für NewLife standardmäßig https://ai.newlifex.com"
"AI ApiKey. Defaults to sk-CubeAI2026 for NewLife": "KI-ApiKey. Für NewLife standardmäßig sk-CubeAI2026"
"AI default model. Defaults to newlife-flash for NewLife": "KI-Standardmodell. Für NewLife standardmäßig newlife-flash"
"AI default deep reasoning. Enables think mode for analysis and chat by default; false means fast responses": "KI-Tiefenanalyse standardmäßig. Aktiviert den Denkmodus für Analyse und Chat standardmäßig; false bedeutet schnelle Antworten"
"AI color scheme. Fills the primary and secondary colors from a preset": "KI-Farbschema. Füllt Primär- und Sekundärfarbe aus einer Voreinstellung"
"AI primary color. Main color of the launcher, panel header and user bubbles; default NewLife green #2ecc71": "KI-Primärfarbe. Hauptfarbe von Startschaltfläche, Bereichskopf und Benutzerblasen; Standard: NewLife-Grün #2ecc71"
"AI secondary color. Gradient end color, default dark green #1e8e3e": "KI-Sekundärfarbe. Endfarbe des Farbverlaufs, Standard: Dunkelgrün #1e8e3e"
"OAuth server. Enables the OAuth 2.0 server that provides SSO for other applications": "OAuth-Server. Aktiviert den OAuth-2.0-Server, der anderen Anwendungen SSO bereitstellt"
"File manager. Enables backend file management (browse, upload, download, delete); this carries security risks": "Dateimanager. Aktiviert die Dateiverwaltung im Backend (Durchsuchen, Hochladen, Herunterladen, Löschen); dies birgt Sicherheitsrisiken"
"Multi-tenancy. Enables tenants; tenant mode cannot access system administration and platform mode cannot access tenant pages": "Mehrinstanzenfähigkeit. Aktiviert Mieter; der Mieter-Modus kann nicht auf die Systemverwaltung zugreifen, der Plattform-Modus nicht auf die Mieterseiten"
"Tenant query policy. DenyWithEmpty: return an empty set without tenant context; ThrowOnMissingTenant: throw an explicit error": "Mieterabfrage-Richtlinie. DenyWithEmpty: ohne Mieterkontext wird ein leeres Ergebnis zurückgegeben; ThrowOnMissingTenant: es wird ein expliziter Fehler ausgelöst"
"User online. 0: do not record; 1: signed-in users only; 2: all visitors (default)": "Benutzer online. 0: nicht erfassen; 1: nur angemeldete Benutzer; 2: alle Besucher (Standard)"
"User statistics. Records user visits, default true": "Benutzerstatistik. Erfasst Besuche von Benutzern, Standard: true"
"Enable SMS. SMS verification codes and system notifications, default false": "SMS aktivieren. SMS-Bestätigungscodes und Systembenachrichtigungen, Standard: false"
"Enable email. Email verification codes and system notifications, default false": "E-Mail aktivieren. E-Mail-Bestätigungscodes und Systembenachrichtigungen, Standard: false"
"Require email verification. Users must activate their email before signing in and must provide one when registering, default false": "E-Mail-Bestätigung erforderlich. Benutzer müssen ihre E-Mail-Adresse vor der Anmeldung aktivieren und bei der Registrierung eine angeben, Standard: false"
"Require mobile verification. Users must activate their mobile before signing in and must provide one when registering, default false": "Mobilfunkbestätigung erforderlich. Benutzer müssen ihr Mobiltelefon vor der Anmeldung aktivieren und bei der Registrierung eine Nummer angeben, Standard: false"
"Captcha scenarios. Bit mask: 0: off; 1: sign-in; 2: registration; 4: verification code requests (anti-SMS-bombing); combine with 3 for sign-in and registration. Mandatory scenarios are never exempted, default 0": "Captcha-Szenarien. Bitmaske: 0: aus; 1: Anmeldung; 2: Registrierung; 4: Anforderung von Bestätigungscodes (Schutz vor SMS-Bombing); mit 3 kombinieren für Anmeldung und Registrierung. Pflichtszenarien werden nie ausgenommen, Standard: 0"
"Risk-adaptive captcha. Disabled when CaptchaScene is 0; when enabled it detects unsafe environments and requires a captcha, default true": "Risikoadaptives Captcha. Deaktiviert, wenn CaptchaScene 0 ist; wenn aktiviert, erkennt es unsichere Umgebungen und verlangt ein Captcha, Standard: true"
"Captcha risk threshold. Requires a captcha when the risk score reaches this value: 0: intranet; 1: internet; 2: internet with recent failures; 3: banned. Default 2": "Risikoschwelle für Captcha. Verlangt ein Captcha, wenn der Risikowert diesen Wert erreicht: 0: Intranet; 1: Internet; 2: Internet mit kürzlichen Fehlern; 3: gesperrt. Standard: 2"
"Trusted device lifetime. Days during which previously successful devices skip adaptive captchas, default 30": "Lebensdauer vertrauenswürdiger Geräte. Tage, in denen zuvor erfolgreiche Geräte adaptive Captchas überspringen, Standard: 30"
"Enable MFA. Allows users to enable TOTP multi-factor authentication; an enhanced feature, default false": "MFA aktivieren. Erlaubt Benutzern, die TOTP-Mehrfaktorauthentifizierung zu aktivieren; eine erweiterte Funktion, Standard: false"
"File storage serving. Responds to file download requests from other nodes, default true": "Dateispeicher-Bereitstellung. Beantwortet Dateidownload-Anfragen anderer Knoten, Standard: true"
"File storage fetch. Pulls new files published by other nodes, default true": "Dateispeicher-Abruf. Holt neue Dateien, die andere Knoten veröffentlicht haben, Standard: true"
"File fetch timeout. Maximum milliseconds to wait for other nodes when a file is missing locally, default 5000": "Zeitlimit für Dateiabruf. Maximale Millisekunden, die auf andere Knoten gewartet wird, wenn eine Datei lokal fehlt, Standard: 5000"
"Attachment storage. Local disk, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu or EasyIO; default Local": "Anhangsspeicher. Lokale Festplatte, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu oder EasyIO; Standard: Local"
"Object storage server. S3-compatible endpoint for OSS/COS/Qiniu, such as oss-cn-beijing.aliyuncs.com": "Objektspeicher-Server. S3-kompatibler Endpunkt für OSS/COS/Qiniu, z. B. oss-cn-beijing.aliyuncs.com"
"Object storage bucket. Bucket name for OSS/COS/Qiniu": "Objektspeicher-Bucket. Bucket-Name für OSS/COS/Qiniu"
"Object storage region. S3 signing scope, such as cn-beijing / ap-beijing / cn-east-1": "Objektspeicher-Region. Signaturbereich für S3, z. B. cn-beijing / ap-beijing / cn-east-1"
"Object storage app ID. AccessKeyId": "Objektspeicher-App-ID. AccessKeyId"
"Object storage app secret. AccessKeySecret": "Objektspeicher-App-Geheimnis. AccessKeySecret"
"Data retention. Days to keep audit and OAuth logs, default 30": "Datenaufbewahrung. Tage, die Audit- und OAuth-Protokolle aufbewahrt werden, Standard: 30"
"File retention. Days to keep backup files, default 15": "Dateiaufbewahrung. Tage, die Sicherungsdateien aufbewahrt werden, Standard: 15"
"Retention size floor. Files smaller than this (KB) are never deleted even after the retention period, default 1024K": "Mindestgröße für die Aufbewahrung. Dateien, die kleiner sind als dieser Wert (KB), werden auch nach Ablauf der Aufbewahrungsfrist nie gelöscht, Standard: 1024K"
"Maximum export rows. Maximum rows a page may export, default 10_000_000": "Maximale Exportzeilen. Maximale Zeilen, die eine Seite exportieren darf, Standard: 10_000_000"
"Maximum backup rows. Maximum rows a page may back up, default 10_000_000": "Maximale Sicherungszeilen. Maximale Zeilen, die eine Seite sichern darf, Standard: 10_000_000"
"API prefixes. Comma- or semicolon-separated prefixes such as /api,/api/v1; matching requests are forwarded to the real route without the prefix": "API-Präfixe. Durch Kommas oder Semikolons getrennte Präfixe wie /api,/api/v1; passende Anfragen werden ohne das Präfix an die eigentliche Route weitergeleitet"
"Cookie mode. Default SameSite mode for token cookies (-1 Unspecified, 0 None, 1 Lax, 2 Strict)": "Cookie-Modus. Standard-SameSite-Modus für Token-Cookies (-1 Unspecified, 0 None, 1 Lax, 2 Strict)"
"Cookie domain. Writes cookies to a parent domain; empty uses the current domain. A top-level domain requires HTTPS and prevents plain HTTP from writing same-name keys on the local domain": "Cookie-Domain. Schreibt Cookies in eine übergeordnete Domain; leer verwendet die aktuelle Domain. Eine Top-Level-Domain erfordert HTTPS und verhindert, dass reines HTTP gleichnamige Schlüssel auf der lokalen Domain schreibt"
"Activation URL. Front-end activation page URL used in email activation links, such as https://xxx/activate; empty builds /activate from the request host": "Aktivierungs-URL. URL der Aktivierungsseite im Frontend, die in E-Mail-Aktivierungslinks verwendet wird, z. B. https://xxx/activate; leer erzeugt /activate aus dem Anforderungs-Host"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default false": "Token im Cookie speichern. Liest das Token aus dem Cookie, wenn der Anforderungsheader keines enthält, Standard: false"
