"系统操作菜单以及功能目录树。支持排序，不可见菜单仅用于功能权限限制。每个菜单的权限子项由系统自动生成，请不要人为修改": "Vorgangsmenüs und der Funktionsbaum. Sortierung wird unterstützt; ausgeblendete Menüs schränken nur die Funktionsberechtigungen ein. Die Berechtigungseinträge jedes Menüs werden automatisch erzeugt, ändern Sie sie nicht."
