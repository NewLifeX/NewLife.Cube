"每天定时汇总过去 24 小时的系统日志，由 AI 生成摘要后通过通知系统推送给管理员": "Fasst täglich die Systemprotokolle der letzten 24 Stunden zusammen und sendet die von der KI erzeugte Zusammenfassung an Administratoren"
"You are an information security expert. Based on the following security data, write a weekly security report covering:\n1. Overall security posture\n2. Risks that need attention\n3. Recommended security measures\n\nOutput the report directly without extra explanation.": "Sie sind Experte für Informationssicherheit. Erstellen Sie anhand der folgenden Sicherheitsdaten einen wöchentlichen Sicherheitsbericht zu:\n1. Gesamtlage der Sicherheit\n2. Risiken, die Aufmerksamkeit erfordern\n3. Empfohlene Sicherheitsmaßnahmen\n\nGeben Sie den Bericht direkt ohne zusätzliche Erläuterungen aus."
