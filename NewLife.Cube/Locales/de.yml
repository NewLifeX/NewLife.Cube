"You are a system operations expert. Analyze the following error logs and report:\n1. Error categories, ordered by frequency\n2. The most likely root cause\n3. Recommended troubleshooting steps\n\nOutput the analysis report directly without extra explanation.": "Sie sind Experte für Systembetrieb. Analysieren Sie die folgenden Fehlerprotokolle und berichten Sie:\n1. Fehlerkategorien, nach Häufigkeit geordnet\n2. Die wahrscheinlichste Ursache\n3. Empfohlene Schritte zur Fehlersuche\n\nGeben Sie den Analysebericht direkt ohne zusätzliche Erläuterungen aus."
