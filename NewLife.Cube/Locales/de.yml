"Generated {0} configuration field values (skipped {1}, failed {2}) and filled them into the form. Ask the user to review before submitting.": "{0} Konfigurationsfeldwerte erzeugt (übersprungen: {1}, fehlgeschlagen: {2}) und in das Formular eingetragen. Bitten Sie den Benutzer, vor dem Absenden zu prüfen."
"The current page is a system configuration form (such as Cube settings); you can help review and fill in configuration items.": "Die aktuelle Seite ist ein Systemkonfigurationsformular (z. B. Cube-Einstellungen); Sie können beim Prüfen und Ausfüllen von Konfigurationselementen helfen."
"Available tools: get_form_schema / fill_form / get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "Verfügbare Werkzeuge: get_form_schema / fill_form / get_page_context / get_system_info / run_js (Details siehe Funktionsdefinitionen; bei Bedarf aufrufen)"
"2. When the user asks to create, fill in or complete configuration, call get_form_schema first to inspect the items, then call fill_form to generate values (invent reasonable values for empty writable fields, keep existing values unless the user asks otherwise, and never fabricate or modify sensitive settings such as ApiKey/Secret/Token); finally ask the user to review before submitting": "2. Wenn der Benutzer Konfigurationen anlegen, ausfüllen oder vervollständigen möchte, rufen Sie zuerst get_form_schema auf, um die Elemente zu prüfen, und dann fill_form, um Werte zu erzeugen (für leere beschreibbare Felder sinnvolle Werte erfinden, vorhandene Werte beibehalten, sofern der Benutzer nichts anderes verlangt, und niemals vertrauliche Einstellungen wie ApiKey/Secret/Token erfinden oder ändern); bitten Sie den Benutzer abschließend, vor dem Absenden zu prüfen"
"3. When the user asks about the content or current state of the page, call get_page_context, then give your analysis and conclusion": "3. Wenn der Benutzer nach dem Inhalt oder dem aktuellen Zustand der Seite fragt, rufen Sie get_page_context auf und geben Sie dann Ihre Analyse und Ihr Fazit ab"
"4. When the user asks about system status or diagnostics, call get_system_info": "4. Wenn der Benutzer nach Systemstatus oder Diagnose fragt, rufen Sie get_system_info auf"
"5. When the user asks to read or operate page elements, you may call run_js; explain any write operation (changing page content, submitting forms) to the user before running it": "5. Wenn der Benutzer Seitenelemente lesen oder bedienen möchte, dürfen Sie run_js aufrufen; erläutern Sie jede Schreiboperation (Seiteninhalt ändern, Formulare absenden) vor der Ausführung gegenüber dem Benutzer"
"6. Never invent data; ask the user for clarification when information is insufficient": "6. Erfinden Sie niemals Daten; fragen Sie den Benutzer nach, wenn die Informationen nicht ausreichen"
"The tenant identifier carried by user [{0}] is invalid or unavailable. Check the tenant settings and try again.": "Die von Benutzer [{0}] übermittelte Mieterkennung ist ungültig oder nicht verfügbar. Prüfen Sie die Mietereinstellungen und versuchen Sie es erneut."
"User [{0}] did not carry a tenant identifier, so the tenant cannot be determined. Include the tenant information and try again.": "Benutzer [{0}] hat keine Mieterkennung übermittelt, daher kann der Mieter nicht bestimmt werden. Übermitteln Sie die Mieterinformationen und versuchen Sie es erneut."
"User [{0}] is not allowed to access the data of the current tenant. Switch tenant and try again.": "Benutzer [{0}] darf nicht auf die Daten des aktuellen Mieters zugreifen. Wechseln Sie den Mieter und versuchen Sie es erneut."
