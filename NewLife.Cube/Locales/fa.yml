"[TenantBind] user [{0}] already has a valid tenant, refuse to auto-bind to tenant [{1}]": "[TenantBind] کاربر [{0}] از قبل مستأجر معتبری دارد، اتصال خودکار به مستأجر [{1}] رد شد"
"[{0}] user auto-bound to tenant [{1}]": "[{0}] کاربر به‌صورت خودکار به مستأجر [{1}] متصل شد"
