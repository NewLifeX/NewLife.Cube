"Initialize ManageProvider": "راه‌اندازی ManageProvider"
"New menus added, permission check required": "منوهای جدید افزوده شد، بررسی مجوز لازم است"
"Cleaned up {0:n0} expired ban rows": "{0:n0} سطر مسدودی منقضی‌شده پاک‌سازی شد"
"Deleted OAuthLog rows before [{0}]: {1:n0}": "سطرهای OAuthLog پیش از [{0}] حذف شد: {1:n0}"
"Deleted AppLog rows before [{0}]: {1:n0}": "سطرهای AppLog پیش از [{0}] حذف شد: {1:n0}"
"Deleted Log rows before [{0}]: {1:n0}": "سطرهای Log پیش از [{0}] حذف شد: {1:n0}"
"DataProtection persists keys in database, Key={0}": "DataProtection کلیدها را در پایگاه داده نگه می‌دارد، Key={0}"
"Deleted expired data {0}": "داده منقضی‌شده {0} حذف شد"
"[CloseAccount] cleanup {0} failed (user {1}): {2}": "[CloseAccount] پاک‌سازی {0} ناموفق بود (کاربر {1}): {2}"
