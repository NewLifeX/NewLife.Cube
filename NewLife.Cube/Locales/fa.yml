"Distributed lock shows the job is still running, skip this round": "قفل توزیع‌شده نشان می‌دهد کار هنوز در حال اجراست، این دوره نادیده گرفته می‌شود"
"Security ban {0}: {1}, unban at {2:yyyy-MM-dd HH:mm:ss}": "مسدودی امنیتی {0}: {1}، رفع مسدودی در {2:yyyy-MM-dd HH:mm:ss}"
