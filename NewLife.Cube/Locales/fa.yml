# 设置页字段、分类与导航（中文源文经英文规范键翻译）
"Auto (follow system)": "خودکار (پیروی از سیستم)"
"Cancel": "انصراف"
"Queries {0}, executes {1}, elapsed {2:n0} ms": "{0} پرس‌وجو، {1} اجرا، زمان سپری‌شده {2:n0} میلی‌ثانیه"
"Show run time": "نمایش زمان اجرا"
"Avatar directory. Downloads remote avatars locally; defaults to the Avatars subdirectory, or Avatars next to the web root. Empty disables downloading": "دایرکتوری آواتار. آواتارهای راه دور را به‌صورت محلی دانلود می‌کند؛ پیش‌فرض زیردایرکتوری Avatars یا Avatars در کنار ریشه وب است. خالی بودن، دانلود را غیرفعال می‌کند"
"Text avatar characters. Generates an SVG text avatar when no image exists; 1 to 3 characters. Uses the first N Chinese characters to keep the surname, or the initials of English words. Default 2": "نویسه‌های آواتار متنی. در صورت نبود تصویر، آواتار متنی SVG می‌سازد؛ 1 تا 3 نویسه. نخستین N نویسه چینی برای حفظ نام خانوادگی یا حروف اول واژه‌های انگلیسی استفاده می‌شود. پیش‌فرض 2"
"Upload directory. Defaults to Uploads": "دایرکتوری بارگذاری. پیش‌فرض Uploads"
"Web root directory. Defaults to wwwroot": "دایرکتوری ریشه وب. پیش‌فرض wwwroot"
"Resource URL. CDN base such as https://sso.newlifex.com/content/; empty uses local resources": "نشانی URL منابع. پایه CDN مانند https://sso.newlifex.com/content/؛ خالی از منابع محلی استفاده می‌کند"
"CORS origins. Other origins allowed to access this site; * allows any origin": "مبادی CORS. مبادی دیگری که اجازه دسترسی به این سایت را دارند؛ * هر مبدأ را مجاز می‌کند"
"Iframe embedding. Empty allows the same domain only; SAMEORIGIN allows the same domain and port; ALLOWALL allows any domain": "جاسازی Iframe. خالی فقط دامنه یکسان را مجاز می‌کند؛ SAMEORIGIN دامنه و درگاه یکسان را مجاز می‌کند؛ ALLOWALL هر دامنه‌ای را مجاز می‌کند"
"Share expiration. Lifetime of share tokens in seconds, default 7200": "انقضای اشتراک. طول عمر توکن‌های اشتراک بر حسب ثانیه، پیش‌فرض 7200"
"Bot error code. Returns this error for crawlers, such as 404/500; 0 disables blocking": "کد خطای ربات. این خطا برای خزنده‌ها برگردانده می‌شود، مانند 404/500؛ 0 مسدودسازی را غیرفعال می‌کند"
"Force redirect. Target scheme and host for GET requests; * is supported in the host. Commonly used to force HTTPS, such as https://*:8081": "هدایت اجباری. طرح و میزبان مقصد برای درخواست‌های GET؛ * در میزبان پشتیبانی می‌شود. معمولاً برای اجبار HTTPS به کار می‌رود، مانند https://*:8081"
"Security mode. 0: off; 1: observe and log only; 2: block; 3: automatic (default; observes, bans repeated attackers, and temporarily blocks broad attacks with automatic rollback)": "حالت امنیتی. 0: خاموش؛ 1: فقط پایش و ثبت؛ 2: مسدودسازی؛ 3: خودکار (پیش‌فرض؛ پایش می‌کند، مهاجمان مکرر را مسدود و حملات گسترده را موقتاً با بازگردانی خودکار مسدود می‌کند)"
"Auto-ban durations. Comma-separated seconds that increase with each trigger; empty uses 60,300,1800,7200,86400": "مدت‌های مسدودسازی خودکار. ثانیه‌های جداشده با ویرگول که با هر بار فعال‌سازی افزایش می‌یابند؛ خالی از 60,300,1800,7200,86400 استفاده می‌کند"
"Trusted proxies. Forwarded headers are only trusted from these comma-separated IPs or CIDR ranges; empty keeps the legacy behavior of trusting all forwarded headers": "پروکسی‌های مورد اعتماد. سرآیندهای Forwarded فقط از این نشانی‌های IP یا محدوده‌های CIDR جداشده با ویرگول پذیرفته می‌شوند؛ خالی رفتار قدیمی اعتماد به همه سرآیندهای Forwarded را حفظ می‌کند"
"Trusted proxy learning limit. When no trusted proxies are configured, private direct sources that send forwarded headers are learned up to this count; 0 disables learning (typically 2 for one data center, 4 for two)": "حد یادگیری پروکسی‌های مورد اعتماد. وقتی پروکسی مورد اعتمادی پیکربندی نشده است، منابع مستقیم خصوصی که سرآیندهای Forwarded می‌فرستند تا این تعداد یاد گرفته می‌شوند؛ 0 یادگیری را غیرفعال می‌کند (معمولاً 2 برای یک مرکز داده و 4 برای دو مرکز)"
"Learned proxies. Maintained automatically; clear it to reset the learned list": "پروکسی‌های یادگرفته‌شده. به‌صورت خودکار نگهداری می‌شوند؛ برای بازنشانی فهرست، آن را پاک کنید"
"Default role. Defaults to the Normal User role": "نقش پیش‌فرض. پیش‌فرض نقش کاربر عادی است"
"Allow password sign-in. Allows signing in with a username and password": "اجازه ورود با رمز عبور. امکان ورود با نام کاربری و رمز عبور را می‌دهد"
"Allow plain-text passwords. Default true for legacy clients; false forces Challenge-Response encrypted passwords": "اجازه رمز عبور متنی. برای کلاینت‌های قدیمی پیش‌فرض true است؛ false رمزهای عبور رمزگذاری‌شده با چالش-پاسخ را الزامی می‌کند"
"Allow registration. Allows registering with a username and password": "اجازه ثبت‌نام. امکان ثبت‌نام با نام کاربری و رمز عبور را می‌دهد"
"Auto registration. Default true; after SSO sign-in an unknown local user is registered automatically. Enabled when either the global or the OAuth app setting is on": "ثبت‌نام خودکار. پیش‌فرض true؛ پس از ورود با SSO، کاربر محلی ناشناس به‌صورت خودکار ثبت‌نام می‌شود. وقتی تنظیم عمومی یا تنظیم برنامه OAuth روشن باشد فعال است"
"Password complexity check. When enabled the sign-in page validates password strength; when disabled it only requires a non-empty password. Default true": "بررسی پیچیدگی رمز عبور. در حالت فعال، صفحه ورود استحکام رمز عبور را بررسی می‌کند؛ در حالت غیرفعال فقط رمز غیرخالی لازم است. پیش‌فرض true"
"Login failure limit. Bans sign-in after this many consecutive failures for the same user or IP, default 5": "حد ناکامی ورود. پس از این تعداد ناکامی پی‌درپی برای همان کاربر یا IP، ورود مسدود می‌شود، پیش‌فرض 5"
"Login ban duration. Seconds a risk-control ban lasts, default 300": "مدت مسدودی ورود. ثانیه‌هایی که مسدودی کنترل ریسک ادامه دارد، پیش‌فرض 300"
"Class C subnet ban threshold. Bans a /24 subnet such as 103.125.146.* after this many failures, default 10; 0 disables": "آستانه مسدودی زیرشبکه کلاس C. زیرشبکه /24 مانند 103.125.146.* پس از این تعداد ناکامی مسدود می‌شود، پیش‌فرض 10؛ 0 غیرفعال می‌کند"
"Class B subnet ban threshold. Bans a /16 subnet such as 103.125.*.* after this many failures, default 20; 0 disables": "آستانه مسدودی زیرشبکه کلاس B. زیرشبکه /16 مانند 103.125.*.* پس از این تعداد ناکامی مسدود می‌شود، پیش‌فرض 20؛ 0 غیرفعال می‌کند"
"Force bind by user name. Binds SSO users to local users with the same name without a provider prefix; intended for user centers": "اتصال اجباری با نام کاربری. کاربران SSO را بدون پیشوند فراهم‌کننده به کاربران محلی با همان نام متصل می‌کند؛ مناسب مراکز کاربری"
"Bind by user code. Binds SSO users to local users by user code": "اتصال با کد کاربر. کاربران SSO را بر پایه کد کاربر به کاربران محلی متصل می‌کند"
"Bind by mobile. Binds SSO users to local users by mobile number": "اتصال با موبایل. کاربران SSO را بر پایه شماره موبایل به کاربران محلی متصل می‌کند"
"Bind by email. Binds SSO users to local users by email": "اتصال با ایمیل. کاربران SSO را بر پایه ایمیل به کاربران محلی متصل می‌کند"
"Bind by nickname. Binds SSO users to local users by nickname; suitable for internal SSO, not for social networks with many duplicate names": "اتصال با نام مستعار. کاربران SSO را بر پایه نام مستعار به کاربران محلی متصل می‌کند؛ مناسب SSO داخلی، نه شبکه‌های اجتماعی با نام‌های تکراری فراوان"
"Use SSO roles. Keeps SSO roles after sign-in, default true; otherwise DefaultRole is used": "استفاده از نقش‌های SSO. نقش‌های SSO را پس از ورود حفظ می‌کند، پیش‌فرض true؛ در غیر این صورت DefaultRole استفاده می‌شود"
"Use SSO departments. Keeps SSO departments after sign-in, default true": "استفاده از دپارتمان‌های SSO. دپارتمان‌های SSO را پس از ورود حفظ می‌کند، پیش‌فرض true"
"SSO role rules. Automatically upgrades the primary role after SSO sign-in; separate rules with commas. Format: source role+department wildcard=target role, for example Guest+Route*=Route Specialist": "قواعد نقش SSO. پس از ورود با SSO نقش اصلی را به‌صورت خودکار ارتقا می‌دهد؛ قواعد را با ویرگول جدا کنید. قالب: نقش مبدأ+دپارتمان با نویسه جایگزین=نقش مقصد، مانند Guest+Route*=Route Specialist"
"Sign out everywhere. false signs out of this site only; true (default) also signs out of the SSO server": "خروج از همه‌جا. false فقط از این سایت خارج می‌شود؛ true (پیش‌فرض) از سرور SSO نیز خارج می‌شود"
"Allow multi-device sign-in. false kicks old devices on a new sign-in and revokes all tokens on sign-out; true (default) revokes only the current session": "اجازه ورود چنددستگاهی. false دستگاه‌های قدیمی را هنگام ورود جدید بیرون می‌اندازد و در خروج همه توکن‌ها را ابطال می‌کند؛ true (پیش‌فرض) فقط نشست جاری را ابطال می‌کند"
"Session timeout. Session lifetime after SSO sign-in during which the cookie can sign in again; default 0s": "مهلت نشست. طول عمر نشست پس از ورود با SSO که در آن کوکی می‌تواند دوباره وارد شود؛ پیش‌فرض 0 ثانیه"
"Token sliding refresh threshold. Refreshes the JWT and rewrites the cookie when its remaining lifetime falls below this many seconds; 0 disables sliding expiration": "آستانه به‌روزرسانی لغزشی توکن. وقتی اعتبار باقی‌مانده JWT کمتر از این تعداد ثانیه شود، JWT تازه‌سازی و کوکی بازنویسی می‌شود؛ 0 انقضای لغزشی را غیرفعال می‌کند"
"User refresh period. Fetches user information once per period across SSO sign-ins, default 600 seconds": "دوره تازه‌سازی کاربر. اطلاعات کاربر را یک بار در هر دوره در ورودهای SSO دریافت می‌کند، پیش‌فرض 600 ثانیه"
"JWT secret. Algorithm and key used to sign JWTs, such as HS256:ABCD1234": "کلید JWT. الگوریتم و کلید مورد استفاده برای امضای JWT، مانند HS256:ABCD1234"
"Token lifetime. Lifetime of the access token in seconds, default 7200": "طول عمر توکن. طول عمر توکن دسترسی بر حسب ثانیه، پیش‌فرض 7200"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default true": "ذخیره توکن در کوکی. وقتی سرآیند درخواست توکن ندارد، توکن از کوکی خوانده می‌شود، پیش‌فرض true"
"Validate attachment access. Requires sign-in to access attachments, default true": "اعتبارسنجی دسترسی به پیوست. برای دسترسی به پیوست‌ها ورود الزامی است، پیش‌فرض true"
"Public attachment categories. Categories accessible without sign-in, comma-separated, such as markdown,avatar. Applies when ValidateAttachment is true": "دسته‌های پیوست عمومی. دسته‌هایی که بدون ورود در دسترس‌اند، جداشده با ویرگول، مانند markdown,avatar. وقتی ValidateAttachment برابر true است اعمال می‌شود"
"Private attachment categories. Categories only the uploader can access, comma-separated. Applies when ValidateAttachment is true": "دسته‌های پیوست خصوصی. دسته‌هایی که فقط بارگذارنده به آن‌ها دسترسی دارد، جداشده با ویرگول. وقتی ValidateAttachment برابر true است اعمال می‌شود"
"SSO redirect allowlist. Domains allowed to receive the JWT after sign-in, comma-separated with wildcard prefixes such as *.company.com. Empty allows the same site only; other origins are rejected and sent back to the home page": "فهرست مجاز هدایت SSO. دامنه‌هایی که مجاز به دریافت JWT پس از ورود هستند، جداشده با ویرگول و با پیشوند نویسه جایگزین مانند *.company.com. خالی فقط همین سایت را مجاز می‌کند؛ مبادی دیگر رد و به صفحه اصلی بازگردانده می‌شوند"
"External authentication URL. When local authentication fails, credentials are verified by this endpoint; on success the local user is created or updated and signed in": "نشانی URL احراز هویت خارجی. وقتی احراز هویت محلی ناموفق باشد، اعتبارنامه‌ها از این نقطه پایانی بررسی می‌شوند؛ در صورت موفقیت کاربر محلی ساخته یا به‌روز و وارد می‌شود"
"Start page. First content page opened after entering the admin console": "صفحه شروع. نخستین صفحه محتوایی که پس از ورود به کنسول مدیریت باز می‌شود"
"Theme. Content page theme, ACE/layui": "پوسته. پوسته صفحه محتوا، ACE/layui"
"Skin. Outer frame layout, ACE/layui": "پوشش. چیدمان قاب بیرونی، ACE/layui"
"Login tip. Empty hides the tip on the sign-in page": "راهنمای ورود. خالی بودن، راهنما را در صفحه ورود پنهان می‌کند"
"Login logo. Empty uses the default logo": "نشان ورود. خالی بودن از نشان پیش‌فرض استفاده می‌کند"
"Login background. Image URL; empty uses the default background": "پس‌زمینه ورود. نشانی URL تصویر؛ خالی بودن از پس‌زمینه پیش‌فرض استفاده می‌کند"
"Form group layout. 3/2/1 columns on large/medium/small screens, form-group col-xs-12 col-sm-6 col-lg-4": "چیدمان گروه فرم. 3/2/1 ستون در صفحه‌های بزرگ/متوسط/کوچک، form-group col-xs-12 col-sm-6 col-lg-4"
"Bootstrap select. Nicer drop-downs with a rendering cost": "Bootstrap select. فهرست‌های کشویی زیباتر با هزینه رندر"
"Maximum drop-down items. Maximum options in a related drop-down on forms, default 50; larger lists fall back to a text box": "حداکثر آیتم‌های فهرست کشویی. حداکثر گزینه‌ها در فهرست کشویی مرتبط در فرم‌ها، پیش‌فرض 50؛ فهرست‌های بزرگ‌تر به کادر متنی برمی‌گردند"
"Copyright. Empty hides the copyright; variables now/runtime/framework are supported, and now accepts formats such as {now:yyyy}": "حق نشر. خالی بودن، حق نشر را پنهان می‌کند؛ متغیرهای now/runtime/framework پشتیبانی می‌شوند و now قالب‌هایی مانند {now:yyyy} را می‌پذیرد"
"Filing number. Empty hides the filing information": "شماره ثبت. خالی بودن، اطلاعات ثبت را پنهان می‌کند"
"Enable new UI": "فعال‌سازی رابط جدید"
"ECharts theme. Chart theme": "پوسته ECharts. پوسته نمودار"
"Title suffix. Appends the system name to page titles, default true": "پسوند عنوان. نام سیستم را به عنوان صفحه‌ها می‌افزاید، پیش‌فرض true"
"Table double-click. Enables row double-click on list pages, default true": "دوبار کلیک جدول. دوبار کلیک روی سطرها را در صفحه‌های فهرست فعال می‌کند، پیش‌فرض true"
"Table style. Light: minimal thin lines; Standard: clear row lines (default); Grid: full cell borders": "سبک جدول. روشن: خطوط نازک مینیمال؛ استاندارد: خطوط واضح سطرها (پیش‌فرض)؛ شبکه‌ای: کادر کامل سلول‌ها"
"Table density. Compact: dense and information-rich (default); Normal: relaxed": "تراکم جدول. فشرده: متراکم و پراطلاع (پیش‌فرض)؛ عادی: بازتر"
"Stardust web. Stardust console URL; supports direct links to /trace?id={traceId} or /graph?id={traceId}": "Stardust web. نشانی URL کنسول Stardust؛ از پیوندهای مستقیم به /trace?id={traceId} یا /graph?id={traceId} پشتیبانی می‌کند"
"AI master switch. Enables AI features such as log analysis and notification polishing, default false": "کلید اصلی هوش مصنوعی. ویژگی‌های هوش مصنوعی مانند تحلیل گزارش و بهبود اعلان را فعال می‌کند، پیش‌فرض false"
"AI provider. Supports NewLife, Ollama, DeepSeek, DashScope, OpenAI and others; default NewLife": "فراهم‌کننده هوش مصنوعی. از NewLife، Ollama، DeepSeek، DashScope، OpenAI و دیگران پشتیبانی می‌کند؛ پیش‌فرض NewLife"
"AI endpoint. Defaults to https://ai.newlifex.com for NewLife": "نقطه پایانی هوش مصنوعی. برای NewLife پیش‌فرض https://ai.newlifex.com است"
"AI ApiKey. Defaults to sk-CubeAI2026 for NewLife": "ApiKey هوش مصنوعی. برای NewLife پیش‌فرض sk-CubeAI2026 است"
"AI default model. Defaults to newlife-flash for NewLife": "مدل پیش‌فرض هوش مصنوعی. برای NewLife پیش‌فرض newlife-flash است"
"AI default deep reasoning. Enables think mode for analysis and chat by default; false means fast responses": "استدلال عمیق پیش‌فرض هوش مصنوعی. حالت تفکر را به‌طور پیش‌فرض برای تحلیل و گفتگو فعال می‌کند؛ false یعنی پاسخ‌های سریع"
"AI color scheme. Fills the primary and secondary colors from a preset": "طرح رنگ هوش مصنوعی. رنگ اصلی و ثانویه را از یک پیش‌تنظیم پر می‌کند"
"AI primary color. Main color of the launcher, panel header and user bubbles; default NewLife green #2ecc71": "رنگ اصلی هوش مصنوعی. رنگ اصلی راه‌انداز، سرصفحه پنل و حباب‌های کاربر؛ پیش‌فرض سبز NewLife با کد #2ecc71"
"AI secondary color. Gradient end color, default dark green #1e8e3e": "رنگ ثانویه هوش مصنوعی. رنگ پایانی گرادیان، پیش‌فرض سبز تیره #1e8e3e"
"OAuth server. Enables the OAuth 2.0 server that provides SSO for other applications": "سرور OAuth. سرور OAuth 2.0 را فعال می‌کند که SSO را برای برنامه‌های دیگر فراهم می‌آورد"
"File manager. Enables backend file management (browse, upload, download, delete); this carries security risks": "مدیر فایل. مدیریت فایل در بخش پشتیبان (مرور، بارگذاری، دانلود، حذف) را فعال می‌کند؛ این کار خطرات امنیتی دارد"
"Multi-tenancy. Enables tenants; tenant mode cannot access system administration and platform mode cannot access tenant pages": "چندمستأجری. مستأجرها را فعال می‌کند؛ حالت مستأجر به مدیریت سیستم دسترسی ندارد و حالت پلتفرم به صفحه‌های مستأجر دسترسی ندارد"
"Tenant query policy. DenyWithEmpty: return an empty set without tenant context; ThrowOnMissingTenant: throw an explicit error": "سیاست پرس‌وجوی مستأجر. DenyWithEmpty: بازگرداندن مجموعه خالی بدون زمینه مستأجر؛ ThrowOnMissingTenant: پرتاب خطای صریح"
"User online. 0: do not record; 1: signed-in users only; 2: all visitors (default)": "کاربران آنلاین. 0: ثبت نکن؛ 1: فقط کاربران واردشده؛ 2: همه بازدیدکنندگان (پیش‌فرض)"
"User statistics. Records user visits, default true": "آمار کاربران. بازدیدهای کاربران را ثبت می‌کند، پیش‌فرض true"
"Enable SMS. SMS verification codes and system notifications, default false": "فعال‌سازی SMS. تأیید با SMS"
"Enable email. Email verification codes and system notifications, default false": "فعال‌سازی ایمیل. کدهای تأیید ایمیل و اعلان‌های سیستم، پیش‌فرض false"
"Require email verification. Users must activate their email before signing in and must provide one when registering, default false": "الزام تأیید ایمیل. کاربران باید ایمیل خود را پیش از ورود فعال کنند و هنگام ثبت‌نام ایمیل ارائه دهند، پیش‌فرض false"
"Require mobile verification. Users must activate their mobile before signing in and must provide one when registering, default false": "الزام تأیید موبایل. کاربران باید موبایل خود را پیش از ورود فعال کنند و هنگام ثبت‌نام شماره موبایل ارائه دهند، پیش‌فرض false"
"Captcha scenarios. Bit mask: 0: off; 1: sign-in; 2: registration; 4: verification code requests (anti-SMS-bombing); combine with 3 for sign-in and registration. Mandatory scenarios are never exempted, default 0": "سناریوهای کپچا. ماسک بیتی: 0: خاموش؛ 1: ورود؛ 2: ثبت‌نام؛ 4: درخواست کد تأیید (ضد حمله پیامکی)؛ با 3 برای ورود و ثبت‌نام ترکیب کنید. سناریوهای اجباری هرگز معاف نمی‌شوند، پیش‌فرض 0"
"Risk-adaptive captcha. Disabled when CaptchaScene is 0; when enabled it detects unsafe environments and requires a captcha, default true": "کپچای سازگار با ریسک. وقتی CaptchaScene برابر 0 است غیرفعال می‌شود؛ در حالت فعال محیط‌های ناامن را تشخیص می‌دهد و کپچا می‌خواهد، پیش‌فرض true"
"Captcha risk threshold. Requires a captcha when the risk score reaches this value: 0: intranet; 1: internet; 2: internet with recent failures; 3: banned. Default 2": "آستانه ریسک کپچا. وقتی امتیاز ریسک به این مقدار برسد کپچا لازم است: 0: شبکه داخلی؛ 1: اینترنت؛ 2: اینترنت با ناکامی‌های اخیر؛ 3: مسدود. پیش‌فرض 2"
"Trusted device lifetime. Days during which previously successful devices skip adaptive captchas, default 30": "طول عمر دستگاه مورد اعتماد. روزهایی که دستگاه‌های موفق قبلی از کپچاهای سازگار می‌گذرند، پیش‌فرض 30"
"Enable MFA. Allows users to enable TOTP multi-factor authentication; an enhanced feature, default false": "فعال‌سازی MFA. به کاربران امکان می‌دهد احراز هویت چندعاملی TOTP را فعال کنند؛ ویژگی پیشرفته، پیش‌فرض false"
"File storage serving. Responds to file download requests from other nodes, default true": "سرویس‌دهی ذخیره‌سازی فایل. به درخواست‌های دانلود فایل از گره‌های دیگر پاسخ می‌دهد، پیش‌فرض true"
"File storage fetch. Pulls new files published by other nodes, default true": "دریافت از ذخیره‌سازی فایل. فایل‌های جدید منتشرشده توسط گره‌های دیگر را می‌کشد، پیش‌فرض true"
"File fetch timeout. Maximum milliseconds to wait for other nodes when a file is missing locally, default 5000": "مهلت دریافت فایل. حداکثر میلی‌ثانیه انتظار برای گره‌های دیگر وقتی فایل به‌صورت محلی موجود نیست، پیش‌فرض 5000"
"Attachment storage. Local disk, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu or EasyIO; default Local": "ذخیره‌سازی پیوست. دیسک محلی، Oss (Alibaba Cloud)، Cos (Tencent Cloud)، Qiniu یا EasyIO؛ پیش‌فرض Local"
"Object storage server. S3-compatible endpoint for OSS/COS/Qiniu, such as oss-cn-beijing.aliyuncs.com": "سرور ذخیره‌سازی شیء. نقطه پایانی سازگار با S3 برای OSS/COS/Qiniu، مانند oss-cn-beijing.aliyuncs.com"
"Object storage bucket. Bucket name for OSS/COS/Qiniu": "سطل ذخیره‌سازی شیء. نام سطل برای OSS/COS/Qiniu"
"Object storage region. S3 signing scope, such as cn-beijing / ap-beijing / cn-east-1": "منطقه ذخیره‌سازی شیء. دامنه امضای S3، مانند cn-beijing / ap-beijing / cn-east-1"
"Object storage app ID. AccessKeyId": "شناسه برنامه ذخیره‌سازی شیء. AccessKeyId"
"Object storage app secret. AccessKeySecret": "کلید برنامه ذخیره‌سازی شیء. AccessKeySecret"
"Data retention. Days to keep audit and OAuth logs, default 30": "نگهداری داده. روزهای نگهداری گزارش‌های حسابرسی و OAuth، پیش‌فرض 30"
"File retention. Days to keep backup files, default 15": "نگهداری فایل. روزهای نگهداری فایل‌های پشتیبان، پیش‌فرض 15"
"Retention size floor. Files smaller than this (KB) are never deleted even after the retention period, default 1024K": "کف اندازه نگهداری. فایل‌های کوچک‌تر از این مقدار (کیلوبایت) حتی پس از دوره نگهداری هرگز حذف نمی‌شوند، پیش‌فرض 1024K"
"Maximum export rows. Maximum rows a page may export, default 10_000_000": "حداکثر سطرهای خروجی. حداکثر سطرهایی که یک صفحه می‌تواند خروجی بگیرد، پیش‌فرض 10_000_000"
"Maximum backup rows. Maximum rows a page may back up, default 10_000_000": "حداکثر سطرهای پشتیبان. حداکثر سطرهایی که یک صفحه می‌تواند پشتیبان بگیرد، پیش‌فرض 10_000_000"
"API prefixes. Comma- or semicolon-separated prefixes such as /api,/api/v1; matching requests are forwarded to the real route without the prefix": "پیشوندهای API. پیشوندهای جداشده با ویرگول یا نقطه‌ویرگول مانند /api,/api/v1؛ درخواست‌های مطابق بدون پیشوند به مسیر واقعی فرستاده می‌شوند"
"Password strength. * means unrestricted; by default at least 8 characters with digits, upper/lower case letters and symbols. Simple form: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$": "استحکام رمز عبور. * یعنی بی‌محدودیت؛ به‌طور پیش‌فرض دست‌کم 8 نویسه همراه با رقم، حروف بزرگ/کوچک و نمادها. قالب ساده: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$"
"Cookie mode. Default SameSite mode for token cookies (-1 Unspecified, 0 None, 1 Lax, 2 Strict)": "حالت کوکی. حالت پیش‌فرض SameSite برای کوکی‌های توکن (-1 Unspecified، 0 None، 1 Lax، 2 Strict)"
"Cookie domain. Writes cookies to a parent domain; empty uses the current domain. A top-level domain requires HTTPS and prevents plain HTTP from writing same-name keys on the local domain": "دامنه کوکی. کوکی‌ها را در یک دامنه والد می‌نویسد؛ خالی از دامنه فعلی استفاده می‌کند. دامنه سطح بالا به HTTPS نیاز دارد و مانع نوشتن کلیدهای هم‌نام توسط HTTP ساده روی دامنه محلی می‌شود"
"Activation URL. Front-end activation page URL used in email activation links, such as https://xxx/activate; empty builds /activate from the request host": "نشانی URL فعال‌سازی. نشانی URL صفحه فعال‌سازی در فرانت‌اند که در پیوندهای فعال‌سازی ایمیل به کار می‌رود، مانند https://xxx/activate؛ خالی، مسیر /activate را از میزبان درخواست می‌سازد"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default false": "ذخیره توکن در کوکی. وقتی سرآیند درخواست توکن ندارد، توکن از کوکی خوانده می‌شود، پیش‌فرض false"
"Password strength. * means unrestricted; the simple form defaults to 5 to 32 characters of any type. The full form requires at least 8 characters with digits, upper/lower case letters and symbols: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$": "استحکام رمز عبور. * یعنی بی‌محدودیت؛ قالب ساده به‌طور پیش‌فرض 5 تا 32 نویسه از هر نوع است. قالب کامل دست‌کم 8 نویسه همراه با رقم، حروف بزرگ/کوچک و نمادها می‌خواهد: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$"
