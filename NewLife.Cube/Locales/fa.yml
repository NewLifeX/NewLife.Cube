"There are {0} users online, exceeding the {1}-day record of {2} (threshold {3:0}). This may be a campaign, a crawler scan or abnormal traffic; check the online list and sign-in log.": "{0} کاربر آنلاین است که از رکورد {1} روزه {2} (آستانه {3:0}) فراتر رفته است. ممکن است یک کمپین، خزشگر یا ترافیک غیرعادی باشد؛ فهرست آنلاین و گزارش ورود را بررسی کنید."
