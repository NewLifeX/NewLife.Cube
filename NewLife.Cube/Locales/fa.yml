"You are a system operations expert. Analyze the following error logs and report:\n1. Error categories, ordered by frequency\n2. The most likely root cause\n3. Recommended troubleshooting steps\n\nOutput the analysis report directly without extra explanation.": "شما متخصص بهره‌برداری سیستم هستید. گزارش‌های خطای زیر را تحلیل کنید و گزارش دهید:\n1. دسته‌بندی خطاها به ترتیب فراوانی\n2. محتمل‌ترین علت ریشه‌ای\n3. مراحل پیشنهادی عیب‌یابی\n\nگزارش تحلیل را مستقیماً و بدون توضیح اضافی ارائه دهید."
"Daily log report {0}": "گزارش روزانه لاگ {0}"
