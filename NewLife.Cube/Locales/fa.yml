"Tenant check failed: explicit tenant id invalid, access denied: user [{0}] resolution={1}": "بررسی مستأجر ناموفق بود: شناسه مستأجر صریح نامعتبر است، دسترسی رد شد: کاربر [{0}] resolution={1}"
"Tenant check failed: user [{0}] is not a member of tenant [{1}], access denied": "بررسی مستأجر ناموفق بود: کاربر [{0}] عضو مستأجر [{1}] نیست، دسترسی رد شد"
"User not found: {0}": "کاربر یافت نشد: {0}"
