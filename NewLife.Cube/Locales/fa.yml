"Available tools: get_data_context / get_form_schema / fill_form / get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "ابزارهای موجود: get_data_context / get_form_schema / fill_form / get_page_context / get_system_info / run_js (تعریف توابع را ببینید؛ در صورت نیاز آن‌ها را فراخوانی کنید)"
"2. When the user asks to analyze or gain insight into the current data or a single record, call get_data_context first, then give conclusions and suggestions": "2. وقتی کاربر می‌خواهد داده‌های فعلی یا یک رکورد را تحلیل کند یا بینشی به دست آورد، ابتدا get_data_context را فراخوانی کنید و سپس نتیجه‌گیری و پیشنهادها را ارائه دهید"
"3. When the user asks to create, fill in or complete a form, call get_form_schema first to inspect the fields, then call fill_form to generate values (invent a reasonable unique value for empty writable fields such as codes when appropriate, keep existing values, and never fabricate real personal data such as emails, mobile numbers or birthdays); finally ask the user to review before submitting": "3. وقتی کاربر می‌خواهد فرمی ایجاد، پر یا تکمیل کند، ابتدا get_form_schema را برای بررسی فیلدها فراخوانی کنید، سپس fill_form را برای تولید مقادیر فراخوانی کنید (برای فیلدهای خالی قابل نوشتن مانند کدها در صورت لزوم مقدار یکتای معقول بسازید، مقادیر موجود را حفظ کنید، و هرگز داده شخصی واقعی مانند ایمیل، شماره موبایل یا تاریخ تولد جعل نکنید)؛ در پایان پیش از ارسال از کاربر بخواهید بازبینی کند"
"4. When the user asks about page structure or elements (table columns, paging, visible rows and other DOM details), call get_page_context to collect the current page content from the browser": "4. وقتی کاربر درباره ساختار یا عناصر صفحه (ستون‌های جدول، صفحه‌بندی، سطرهای قابل مشاهده و دیگر جزئیات DOM) می‌پرسد، get_page_context را برای جمع‌آوری محتوای صفحه فعلی از مرورگر فراخوانی کنید"
"5. When the user asks about system status or diagnostics, call get_system_info": "5. وقتی کاربر درباره وضعیت سیستم یا عیب‌یابی می‌پرسد، get_system_info را فراخوانی کنید"
"6. When the user asks to read or operate elements of the current page (fill inputs, click buttons, read titles and so on), you may call run_js; the script runs in the user's current page and may use document.querySelector to locate elements; explain any write operation (changing page content, submitting forms) to the user before running it": "6. وقتی کاربر می‌خواهد عناصر صفحه فعلی را بخواند یا با آن‌ها کار کند (پر کردن ورودی‌ها، کلیک روی دکمه‌ها، خواندن عنوان‌ها و مانند آن)، می‌توانید run_js را فراخوانی کنید؛ اسکریپت در صفحه فعلی کاربر اجرا می‌شود و می‌تواند از document.querySelector برای یافتن عناصر استفاده کند؛ هر عملیات نوشتنی (تغییر محتوای صفحه، ارسال فرم) را پیش از اجرا برای کاربر توضیح دهید"
"7. Never invent data; ask the user for clarification when information is insufficient": "7. هرگز داده جعل نکنید؛ وقتی اطلاعات کافی نیست از کاربر توضیح بخواهید"
