"每天定时汇总过去 24 小时的系统日志，由 AI 生成摘要后通过通知系统推送给管理员": "هر روز گزارش‌های سیستم 24 ساعت گذشته را خلاصه می‌کند و خلاصه تولیدشده توسط هوش مصنوعی را برای مدیران ارسال می‌کند"
"You are an information security expert. Based on the following security data, write a weekly security report covering:\n1. Overall security posture\n2. Risks that need attention\n3. Recommended security measures\n\nOutput the report directly without extra explanation.": "شما متخصص امنیت اطلاعات هستید. بر اساس داده‌های امنیتی زیر، یک گزارش امنیتی هفتگی بنویسید که شامل این موارد باشد:\n1. وضعیت کلی امنیت\n2. ریسک‌هایی که نیاز به توجه دارند\n3. اقدامات امنیتی پیشنهادی\n\nگزارش را مستقیماً و بدون توضیح اضافی ارائه دهید."
