"Run page script": "اجرای اسکریپت صفحه"
"Runs JavaScript in the current page and returns the result; can read or modify page elements, for example document.title or document.querySelector('input[name=Name]').value": "JavaScript را در صفحه فعلی اجرا می‌کند و نتیجه را برمی‌گرداند؛ می‌تواند عناصر صفحه را بخواند یا تغییر دهد، مثلاً document.title یا document.querySelector('input[name=Name]').value"
"JavaScript code to run in the current page": "کد JavaScript برای اجرا در صفحه فعلی"
"Get page context": "دریافت زمینه صفحه"
"Gets the main data and structure of the current page (title, tables, forms and so on). Uses the server-side context when the page provides one; otherwise collects the page content from the user's browser": "داده‌ها و ساختار اصلی صفحه فعلی (عنوان، جدول‌ها، فرم‌ها و مانند آن) را می‌گیرد. وقتی صفحه زمینه سمت سرور فراهم کند از آن استفاده می‌کند؛ در غیر این صورت محتوای صفحه را از مرورگر کاربر جمع می‌کند"
"Get form schema": "دریافت طرح‌واره فرم"
"Gets the schema of the current form, including field names, types, descriptions and current values, for generating form values": "طرح‌واره فرم فعلی را شامل نام فیلدها، نوع‌ها، توضیحات و مقادیر فعلی برای تولید مقادیر فرم می‌گیرد"
"Form mode: add or edit": "حالت فرم: افزودن یا ویرایش"
"Fill form": "پر کردن فرم"
"Generates form field values and fills them into the front-end form. Nothing is written to the database until the user confirms": "مقادیر فیلدهای فرم را تولید و در فرم سمت کاربر پر می‌کند. تا زمانی که کاربر تأیید نکند چیزی در پایگاه داده نوشته نمی‌شود"
"Field values as a JSON string, keyed by field name": "مقادیر فیلدها به‌صورت رشته JSON با کلید نام فیلد"
"No valid field value dictionary was received": "هیچ دیکشنری مقادیر فیلد معتبری دریافت نشد"
"[fill_form invalid argument] No valid field value dictionary was received. Call get_form_schema first to get the field structure, then pass the values parameter as {\"field\":value}.": "[fill_form invalid argument] هیچ دیکشنری مقادیر فیلد معتبری دریافت نشد. ابتدا get_form_schema را برای دریافت ساختار فیلدها فراخوانی کنید، سپس پارامتر values را به شکل {\"field\":value} بفرستید."
"Generated {0} form field values (skipped {1}, failed {2}) and filled them into the form. Ask the user to review before submitting.": "{0} مقدار فیلد فرم تولید شد ({1} رد شد، {2} ناموفق) و در فرم پر شد. پیش از ارسال از کاربر بخواهید بازبینی کند."
" descending": " نزولی"
"No current record (add mode). Save first or switch to the detail/edit page.": "سابقه فعلی وجود ندارد (حالت افزودن). ابتدا ذخیره کنید یا به صفحه جزئیات/ویرایش بروید."
"Record does not exist": "رکورد وجود ندارد"
"Get data context": "دریافت زمینه داده"
"Gets the data context of the current page: the current record with its field metadata, or a summary and sample of the current query result, for analysis": "زمینه داده صفحه فعلی را می‌گیرد: رکورد فعلی با فراداده فیلدهایش، یا خلاصه و نمونه‌ای از نتیجه پرس‌وجوی فعلی، برای تحلیل"
"Gets the form schema of the current entity, including field names, types, enum values, required flags, descriptions and existing values (edit mode), for generating form values": "طرح‌واره فرم موجودیت فعلی را شامل نام فیلدها، نوع‌ها، مقادیر شمارشی، نشانه‌های الزام، توضیحات و مقادیر موجود (حالت ویرایش) برای تولید مقادیر فرم می‌گیرد"
"Field values as a JSON string, keyed by field name, for example {\"Name\":\"John\",\"Status\":1}": "مقادیر فیلدها به‌صورت رشته JSON با کلید نام فیلد، مثلاً {\"Name\":\"John\",\"Status\":1}"
"Browser operation timed out; the front end returned no result": "مهلت عملیات مرورگر تمام شد؛ سمت کاربر هیچ نتیجه‌ای برنگرداند"
