"Gets current server metrics such as CPU usage, memory, process working set and system information, for health diagnostics": "معیارهای فعلی سرور مانند مصرف CPU، حافظه، مجموعه کاری فرایند و اطلاعات سیستم را برای تشخیص سلامت می‌گیرد"
