"Data:": "Data:"
"You are a system operations expert. Based on the following runtime metrics, produce a health diagnosis report:\nCover bottlenecks, whether capacity should be expanded, and any risks worth attention.\nOutput the diagnosis report directly without extra explanation.": "Du er ekspert på systemdrift. Lag en helsediagnoserapport basert på følgende kjøretidsmålinger:\nTa for deg flaskehalser, om kapasiteten bør utvides, og eventuelle risikoer som er verdt å merke seg.\nSkriv diagnoserapporten direkte uten ekstra forklaring."
"Script must not be empty": "Skriptet kan ikke være tomt"
"Browser channel is not ready (Writer not injected)": "Nettleserkanalen er ikke klar (Writer er ikke injisert)"
"Run page script": "Kjør sideskript"
"Runs JavaScript in the current page and returns the result; can read or modify page elements, for example document.title or document.querySelector('input[name=Name]').value": "Kjører JavaScript på gjeldende side og returnerer resultatet; kan lese eller endre sideelementer, for eksempel document.title eller document.querySelector('input[name=Name]').value"
"JavaScript code to run in the current page": "JavaScript-kode som skal kjøres på gjeldende side"
"Get page context": "Hent sidekontekst"
"Gets the main data and structure of the current page (title, tables, forms and so on). Uses the server-side context when the page provides one; otherwise collects the page content from the user's browser": "Henter hoveddataene og strukturen på gjeldende side (tittel, tabeller, skjemaer og lignende). Bruker konteksten på serversiden når siden tilbyr en; ellers samles sideinnholdet inn fra brukerens nettleser"
"Get form schema": "Hent skjemastruktur"
"Gets the schema of the current form, including field names, types, descriptions and current values, for generating form values": "Henter strukturen til det gjeldende skjemaet, inkludert feltnavn, typer, beskrivelser og gjeldende verdier, for å generere skjemaverdier"
"Form mode: add or edit": "Skjemamodus: legg til eller rediger"
