# 设置页字段、分类与导航（中文源文经英文规范键翻译）
"Auto (follow system)": "Auto (følg systemet)"
"Cancel": "Avbryt"
"Queries {0}, executes {1}, elapsed {2:n0} ms": "Spørringer {0}, utførelser {1}, brukt {2:n0} ms"
"Show run time": "Vis kjøretid"
"Avatar directory. Downloads remote avatars locally; defaults to the Avatars subdirectory, or Avatars next to the web root. Empty disables downloading": "Avatarkatalog. Laster ned eksterne avatarer lokalt; standard er underkatalogen Avatars, eller Avatars ved siden av webroten. Tom verdi deaktiverer nedlasting"
"Text avatar characters. Generates an SVG text avatar when no image exists; 1 to 3 characters. Uses the first N Chinese characters to keep the surname, or the initials of English words. Default 2": "Tegn i tekstavatar. Genererer en tekstavatar i SVG når det ikke finnes et bilde; 1 til 3 tegn. Bruker de første N kinesiske tegnene for å beholde etternavnet, eller initialene i engelske ord. Standard 2"
"Upload directory. Defaults to Uploads": "Opplastingskatalog. Standard er Uploads"
"Web root directory. Defaults to wwwroot": "Webrotkatalog. Standard er wwwroot"
"Resource URL. CDN base such as https://sso.newlifex.com/content/; empty uses local resources": "Ressurs-URL. CDN-base som https://sso.newlifex.com/content/; tom verdi bruker lokale ressurser"
"CORS origins. Other origins allowed to access this site; * allows any origin": "CORS-opprinnelser. Andre opprinnelser som har lov til å få tilgang til dette nettstedet; * tillater alle opprinnelser"
"Iframe embedding. Empty allows the same domain only; SAMEORIGIN allows the same domain and port; ALLOWALL allows any domain": "Iframe-innbygging. Tom verdi tillater bare samme domene; SAMEORIGIN tillater samme domene og port; ALLOWALL tillater alle domener"
"Share expiration. Lifetime of share tokens in seconds, default 7200": "Utløp for deling. Levetid for delingstokener i sekunder, standard 7200"
"Bot error code. Returns this error for crawlers, such as 404/500; 0 disables blocking": "Feilkode for roboter. Returnerer denne feilen til crawlere, for eksempel 404/500; 0 deaktiverer blokkering"
"Force redirect. Target scheme and host for GET requests; * is supported in the host. Commonly used to force HTTPS, such as https://*:8081": "Tvungen omdirigering. Målskjema og vert for GET-forespørsler; * støttes i verten. Brukes vanligvis til å tvinge HTTPS, for eksempel https://*:8081"
"Security mode. 0: off; 1: observe and log only; 2: block; 3: automatic (default; observes, bans repeated attackers, and temporarily blocks broad attacks with automatic rollback)": "Sikkerhetsmodus. 0: av; 1: bare observer og logg; 2: blokker; 3: automatisk (standard; observerer, sperrer gjentatte angripere og blokkerer bredere angrep midlertidig med automatisk tilbakerulling)"
"Auto-ban durations. Comma-separated seconds that increase with each trigger; empty uses 60,300,1800,7200,86400": "Varigheter for automatisk sperring. Kommaseparerte sekunder som øker ved hver utløsning; tom verdi bruker 60,300,1800,7200,86400"
"Trusted proxies. Forwarded headers are only trusted from these comma-separated IPs or CIDR ranges; empty keeps the legacy behavior of trusting all forwarded headers": "Klarerte proxyer. Videresendte headere godtas bare fra disse kommaseparerte IP-adressene eller CIDR-områdene; tom verdi beholder den eldre atferden med å godta alle videresendte headere"
"Trusted proxy learning limit. When no trusted proxies are configured, private direct sources that send forwarded headers are learned up to this count; 0 disables learning (typically 2 for one data center, 4 for two)": "Grense for læring av klarerte proxyer. Når ingen klarerte proxyer er konfigurert, læres private direktekilder som sender videresendte headere, opptil dette antallet; 0 deaktiverer læring (vanligvis 2 for ett datasenter, 4 for to)"
"Learned proxies. Maintained automatically; clear it to reset the learned list": "Lærte proxyer. Vedlikeholdes automatisk; tøm den for å nullstille den lærte listen"
"Default role. Defaults to the Normal User role": "Standardrolle. Standard er rollen Normal bruker"
"Allow password sign-in. Allows signing in with a username and password": "Tillat passordpålogging. Tillater pålogging med brukernavn og passord"
"Allow plain-text passwords. Default true for legacy clients; false forces Challenge-Response encrypted passwords": "Tillat passord i klartekst. Standard true for eldre klienter; false tvinger Challenge-Response-krypterte passord"
"Allow registration. Allows registering with a username and password": "Tillat registrering. Tillater registrering med brukernavn og passord"
"Auto registration. Default true; after SSO sign-in an unknown local user is registered automatically. Enabled when either the global or the OAuth app setting is on": "Automatisk registrering. Standard true; etter SSO-pålogging registreres en ukjent lokal bruker automatisk. Aktivert når enten den globale innstillingen eller OAuth-appinnstillingen er på"
"Password complexity check. When enabled the sign-in page validates password strength; when disabled it only requires a non-empty password. Default true": "Passordkompleksitetskontroll. Når den er aktivert, validerer påloggingssiden passordstyrken; når den er deaktivert, kreves bare et passord som ikke er tomt. Standard true"
"Login failure limit. Bans sign-in after this many consecutive failures for the same user or IP, default 5": "Grense for mislykkede pålogginger. Sperrer pålogging etter så mange påfølgende feil for samme bruker eller IP, standard 5"
"Login ban duration. Seconds a risk-control ban lasts, default 300": "Varighet for påloggingssperre. Antall sekunder en risikokontrollsperre varer, standard 300"
"Class C subnet ban threshold. Bans a /24 subnet such as 103.125.146.* after this many failures, default 10; 0 disables": "Terskel for sperring av klasse C-subnett. Sperrer et /24-subnett som 103.125.146.* etter så mange feil, standard 10; 0 deaktiverer"
"Class B subnet ban threshold. Bans a /16 subnet such as 103.125.*.* after this many failures, default 20; 0 disables": "Terskel for sperring av klasse B-subnett. Sperrer et /16-subnett som 103.125.*.* etter så mange feil, standard 20; 0 deaktiverer"
"Force bind by user name. Binds SSO users to local users with the same name without a provider prefix; intended for user centers": "Tving tilknytning etter brukernavn. Knytter SSO-brukere til lokale brukere med samme navn uten leverandørprefiks; beregnet på brukersentre"
"Bind by user code. Binds SSO users to local users by user code": "Tilknytning etter brukerkode. Knytter SSO-brukere til lokale brukere etter brukerkode"
"Bind by mobile. Binds SSO users to local users by mobile number": "Tilknytning etter mobil. Knytter SSO-brukere til lokale brukere etter mobilnummer"
"Bind by email. Binds SSO users to local users by email": "Tilknytning etter e-post. Knytter SSO-brukere til lokale brukere etter e-post"
"Bind by nickname. Binds SSO users to local users by nickname; suitable for internal SSO, not for social networks with many duplicate names": "Tilknytning etter kallenavn. Knytter SSO-brukere til lokale brukere etter kallenavn; egnet for intern SSO, ikke for sosiale nettverk med mange like navn"
"Use SSO roles. Keeps SSO roles after sign-in, default true; otherwise DefaultRole is used": "Bruk SSO-roller. Beholder SSO-roller etter pålogging, standard true; ellers brukes DefaultRole"
"Use SSO departments. Keeps SSO departments after sign-in, default true": "Bruk SSO-avdelinger. Beholder SSO-avdelinger etter pålogging, standard true"
"SSO role rules. Automatically upgrades the primary role after SSO sign-in; separate rules with commas. Format: source role+department wildcard=target role, for example Guest+Route*=Route Specialist": "SSO-rolleregler. Oppgraderer primærrollen automatisk etter SSO-pålogging; skill regler med komma. Format: kilderolle+avdelingsjokertegn=målrolle, for eksempel Guest+Route*=Route Specialist"
"Sign out everywhere. false signs out of this site only; true (default) also signs out of the SSO server": "Logg ut overalt. false logger bare ut av dette nettstedet; true (standard) logger også ut av SSO-serveren"
"Allow multi-device sign-in. false kicks old devices on a new sign-in and revokes all tokens on sign-out; true (default) revokes only the current session": "Tillat pålogging fra flere enheter. false kaster ut gamle enheter ved ny pålogging og tilbakekaller alle tokens ved utlogging; true (standard) tilbakekaller bare gjeldende økt"
"Session timeout. Session lifetime after SSO sign-in during which the cookie can sign in again; default 0s": "Tidsavbrudd for økt. Levetid for økten etter SSO-pålogging, der cookien kan logge inn på nytt; standard 0 s"
"Token sliding refresh threshold. Refreshes the JWT and rewrites the cookie when its remaining lifetime falls below this many seconds; 0 disables sliding expiration": "Terskel for glidende tokenfornying. Fornyer JWT-en og skriver cookien på nytt når gjenværende levetid faller under så mange sekunder; 0 deaktiverer glidende utløp"
"User refresh period. Fetches user information once per period across SSO sign-ins, default 600 seconds": "Oppdateringsperiode for bruker. Henter brukerinformasjon én gang per periode på tvers av SSO-pålogginger, standard 600 sekunder"
"JWT secret. Algorithm and key used to sign JWTs, such as HS256:ABCD1234": "JWT-hemmelighet. Algoritme og nøkkel som brukes til å signere JWT-er, for eksempel HS256:ABCD1234"
"Token lifetime. Lifetime of the access token in seconds, default 7200": "Tokenlevetid. Levetid for tilgangstokenet i sekunder, standard 7200"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default true": "Lagre token i cookie. Leser tokenet fra cookien når forespørselsheaderen ikke inneholder noe, standard true"
"Validate attachment access. Requires sign-in to access attachments, default true": "Valider vedleggstilgang. Krever pålogging for å få tilgang til vedlegg, standard true"
"Public attachment categories. Categories accessible without sign-in, comma-separated, such as markdown,avatar. Applies when ValidateAttachment is true": "Offentlige vedleggskategorier. Kategorier som er tilgjengelige uten pålogging, kommaseparert, for eksempel markdown,avatar. Gjelder når ValidateAttachment er true"
"Private attachment categories. Categories only the uploader can access, comma-separated. Applies when ValidateAttachment is true": "Private vedleggskategorier. Kategorier bare opplasteren har tilgang til, kommaseparert. Gjelder når ValidateAttachment er true"
"SSO redirect allowlist. Domains allowed to receive the JWT after sign-in, comma-separated with wildcard prefixes such as *.company.com. Empty allows the same site only; other origins are rejected and sent back to the home page": "Tillatt liste for SSO-omdirigering. Domener som har lov til å motta JWT-en etter pålogging, kommaseparert med jokertegnprefikser som *.company.com. Tom verdi tillater bare samme nettsted; andre opprinnelser avvises og sendes tilbake til startsiden"
"External authentication URL. When local authentication fails, credentials are verified by this endpoint; on success the local user is created or updated and signed in": "URL for ekstern autentisering. Når lokal autentisering mislykkes, verifiseres legitimasjonen mot dette endepunktet; ved suksess opprettes eller oppdateres den lokale brukeren og logges inn"
"Start page. First content page opened after entering the admin console": "Startside. Den første innholdssiden som åpnes etter at du har gått inn i administrasjonskonsollen"
"Theme. Content page theme, ACE/layui": "Tema. Tema for innholdssiden, ACE/layui"
"Skin. Outer frame layout, ACE/layui": "Skall. Oppsett for ytre ramme, ACE/layui"
"SPA front-end skin. Matches the skin package name such as Vue/React; empty auto-selects (Vue first)": "SPA-frontend-skall. Matcher navnet på skallpakken, f.eks. Vue/React; tom velger automatisk (Vue først)"
"Login tip. Empty hides the tip on the sign-in page": "Påloggingstips. Tom verdi skjuler tipset på påloggingssiden"
"Login logo. Empty uses the default logo": "Påloggingslogo. Tom verdi bruker standardlogoen"
"Login background. Image URL; empty uses the default background": "Påloggingsbakgrunn. Bilde-URL; tom verdi bruker standardbakgrunnen"
"Form group layout. 3/2/1 columns on large/medium/small screens, form-group col-xs-12 col-sm-6 col-lg-4": "Oppsett for skjemagruppe. 3/2/1 kolonner på store/middels/små skjermer, form-group col-xs-12 col-sm-6 col-lg-4"
"Bootstrap select. Nicer drop-downs with a rendering cost": "Bootstrap select. Penere rullegardinmenyer, men med økt gjengivelseskostnad"
"Maximum drop-down items. Maximum options in a related drop-down on forms, default 50; larger lists fall back to a text box": "Maksimalt antall rullegardinelementer. Maksimalt antall alternativer i en relatert rullegardinmeny i skjemaer, standard 50; større lister faller tilbake til et tekstfelt"
"Copyright. Empty hides the copyright; variables now/runtime/framework are supported, and now accepts formats such as {now:yyyy}": "Opphavsrett. Tom verdi skjuler opphavsretten; variablene now/runtime/framework støttes, og now godtar formater som {now:yyyy}"
"Filing number. Empty hides the filing information": "Registreringsnummer. Tom verdi skjuler registreringsinformasjonen"
"Enable new UI": "Aktiver nytt brukergrensesnitt"
"ECharts theme. Chart theme": "ECharts-tema. Diagramtema"
"Title suffix. Appends the system name to page titles, default true": "Tittelsuffiks. Legger systemnavnet til sidetitlene, standard true"
"Table double-click. Enables row double-click on list pages, default true": "Dobbeltklikk i tabell. Aktiverer dobbeltklikk på rader i listesider, standard true"
"Table style. Light: minimal thin lines; Standard: clear row lines (default); Grid: full cell borders": "Tabellstil. Lys: minimale, tynne linjer; Standard: tydelige radlinjer (standard); Rutenett: fulle cellerammer"
"Table density. Compact: dense and information-rich (default); Normal: relaxed": "Tabelltetthet. Kompakt: tett og informasjonsrik (standard); Normal: luftig"
"Stardust web. Stardust console URL; supports direct links to /trace?id={traceId} or /graph?id={traceId}": "Stardust-web. URL til Stardust-konsollen; støtter direkte lenker til /trace?id={traceId} eller /graph?id={traceId}"
"AI master switch. Enables AI features such as log analysis and notification polishing, default false": "AI-hovedbryter. Aktiverer AI-funksjoner som logganalyse og finpussing av varsler, standard false"
"AI provider. Supports NewLife, Ollama, DeepSeek, DashScope, OpenAI and others; default NewLife": "AI-leverandør. Støtter NewLife, Ollama, DeepSeek, DashScope, OpenAI og andre; standard NewLife"
"AI endpoint. Defaults to https://ai.newlifex.com for NewLife": "AI-endepunkt. Standard er https://ai.newlifex.com for NewLife"
"AI ApiKey. Defaults to sk-CubeAI2026 for NewLife": "AI ApiKey. Standard er sk-CubeAI2026 for NewLife"
"AI default model. Defaults to newlife-flash for NewLife": "AI-standardmodell. Standard er newlife-flash for NewLife"
"AI default deep reasoning. Enables think mode for analysis and chat by default; false means fast responses": "AI-standard for dyp resonnering. Aktiverer tenkemodus for analyse og chat som standard; false gir raske svar"
"AI color scheme. Fills the primary and secondary colors from a preset": "AI-fargevalg. Fyller primær- og sekundærfargen fra en forhåndsinnstilling"
"AI primary color. Main color of the launcher, panel header and user bubbles; default NewLife green #2ecc71": "AI-primærfarge. Hovedfarge for startknappen, panelhodet og brukerboblene; standard NewLife-grønn #2ecc71"
"AI secondary color. Gradient end color, default dark green #1e8e3e": "AI-sekundærfarge. Sluttfarge for gradienten, standard mørkegrønn #1e8e3e"
"OAuth server. Enables the OAuth 2.0 server that provides SSO for other applications": "OAuth-server. Aktiverer OAuth 2.0-serveren som gir SSO for andre applikasjoner"
"File manager. Enables backend file management (browse, upload, download, delete); this carries security risks": "Filbehandler. Aktiverer filhåndtering i backend (bla gjennom, last opp, last ned, slett); dette innebærer sikkerhetsrisiko"
"Multi-tenancy. Enables tenants; tenant mode cannot access system administration and platform mode cannot access tenant pages": "Flere leietakere. Aktiverer leietakere; leietakermodus får ikke tilgang til systemadministrasjon, og plattformmodus får ikke tilgang til leietakersider"
"Tenant query policy. DenyWithEmpty: return an empty set without tenant context; ThrowOnMissingTenant: throw an explicit error": "Leietakerspørringsstrategi. DenyWithEmpty: returner et tomt sett uten leietakerkontekst; ThrowOnMissingTenant: kast en eksplisitt feil"
"User online. 0: do not record; 1: signed-in users only; 2: all visitors (default)": "Brukere på nett. 0: ikke registrer; 1: bare påloggede brukere; 2: alle besøkende (standard)"
"User statistics. Records user visits, default true": "Brukerstatistikk. Registrerer brukerbesøk, standard true"
"Enable SMS. SMS verification codes and system notifications, default false": "Aktiver SMS. SMS-bekreftelse"
"Enable email. Email verification codes and system notifications, default false": "Aktiver e-post. E-postbekreftelseskoder og systemvarsler, standard false"
"Require email verification. Users must activate their email before signing in and must provide one when registering, default false": "Krev e-postbekreftelse. Brukere må aktivere e-posten sin før de logger på, og må oppgi en ved registrering, standard false"
"Require mobile verification. Users must activate their mobile before signing in and must provide one when registering, default false": "Krev mobilbekreftelse. Brukere må aktivere mobilen sin før de logger på, og må oppgi en ved registrering, standard false"
"Captcha scenarios. Bit mask: 0: off; 1: sign-in; 2: registration; 4: verification code requests (anti-SMS-bombing); combine with 3 for sign-in and registration. Mandatory scenarios are never exempted, default 0": "Captcha-scenarier. Bitmaske: 0: av; 1: pålogging; 2: registrering; 4: forespørsler om bekreftelseskode (anti-SMS-bombing); kombiner med 3 for pålogging og registrering. Obligatoriske scenarier er aldri unntatt, standard 0"
"Risk-adaptive captcha. Disabled when CaptchaScene is 0; when enabled it detects unsafe environments and requires a captcha, default true": "Risikotilpasset captcha. Deaktivert når CaptchaScene er 0; når den er aktivert, oppdager den utrygge miljøer og krever captcha, standard true"
"Captcha risk threshold. Requires a captcha when the risk score reaches this value: 0: intranet; 1: internet; 2: internet with recent failures; 3: banned. Default 2": "Risikoterskel for captcha. Krever captcha når risikoscoren når denne verdien: 0: intranett; 1: internett; 2: internett med nylige feil; 3: sperret. Standard 2"
"Trusted device lifetime. Days during which previously successful devices skip adaptive captchas, default 30": "Levetid for klarerte enheter. Antall dager enheter som tidligere har lykkes, hopper over tilpassede captchaer, standard 30"
"Enable MFA. Allows users to enable TOTP multi-factor authentication; an enhanced feature, default false": "Aktiver MFA. Lar brukere aktivere TOTP-basert flerfaktorautentisering; en utvidet funksjon, standard false"
"File storage serving. Responds to file download requests from other nodes, default true": "Filservering fra lagring. Svarer på forespørsler om filnedlasting fra andre noder, standard true"
"File storage fetch. Pulls new files published by other nodes, default true": "Filhenting fra lagring. Henter nye filer som er publisert av andre noder, standard true"
"File fetch timeout. Maximum milliseconds to wait for other nodes when a file is missing locally, default 5000": "Tidsavbrudd for filhenting. Maksimalt antall millisekunder å vente på andre noder når en fil mangler lokalt, standard 5000"
"Attachment storage. Local disk, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu or EasyIO; default Local": "Vedleggslagring. Lokal disk, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu eller EasyIO; standard Local"
"Object storage server. S3-compatible endpoint for OSS/COS/Qiniu, such as oss-cn-beijing.aliyuncs.com": "Server for objektlagring. S3-kompatibelt endepunkt for OSS/COS/Qiniu, for eksempel oss-cn-beijing.aliyuncs.com"
"Object storage bucket. Bucket name for OSS/COS/Qiniu": "Bøtte for objektlagring. Bøttenavn for OSS/COS/Qiniu"
"Object storage region. S3 signing scope, such as cn-beijing / ap-beijing / cn-east-1": "Region for objektlagring. Signeringsomfang for S3, for eksempel cn-beijing / ap-beijing / cn-east-1"
"Object storage app ID. AccessKeyId": "App-ID for objektlagring. AccessKeyId"
"Object storage app secret. AccessKeySecret": "App-hemmelighet for objektlagring. AccessKeySecret"
"Data retention. Days to keep audit and OAuth logs, default 30": "Datalagringstid. Antall dager revisjons- og OAuth-logger beholdes, standard 30"
"File retention. Days to keep backup files, default 15": "Fillagringstid. Antall dager sikkerhetskopifiler beholdes, standard 15"
"Retention size floor. Files smaller than this (KB) are never deleted even after the retention period, default 1024K": "Nedre størrelsesgrense for lagringstid. Filer mindre enn dette (KB) slettes aldri, selv etter lagringstiden, standard 1024K"
"Maximum export rows. Maximum rows a page may export, default 10_000_000": "Maksimalt antall eksportrader. Maksimalt antall rader en side kan eksportere, standard 10_000_000"
"Maximum backup rows. Maximum rows a page may back up, default 10_000_000": "Maksimalt antall sikkerhetskopirader. Maksimalt antall rader en side kan sikkerhetskopiere, standard 10_000_000"
"API prefixes. Comma- or semicolon-separated prefixes such as /api,/api/v1; matching requests are forwarded to the real route without the prefix": "API-prefikser. Komma- eller semikolonseparerte prefikser som /api,/api/v1; samsvarende forespørsler videresendes til den faktiske ruten uten prefikset"
"Password strength. * means unrestricted; by default at least 8 characters with digits, upper/lower case letters and symbols. Simple form: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$": "Passordstyrke. * betyr ubegrenset; som standard minst 8 tegn med sifre, store og små bokstaver og symboler. Enkel form: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$"
"Cookie mode. Default SameSite mode for token cookies (-1 Unspecified, 0 None, 1 Lax, 2 Strict)": "Cookie-modus. Standard SameSite-modus for tokencookies (-1 Unspecified, 0 None, 1 Lax, 2 Strict)"
"Cookie domain. Writes cookies to a parent domain; empty uses the current domain. A top-level domain requires HTTPS and prevents plain HTTP from writing same-name keys on the local domain": "Cookiedomene. Skriver cookies til et overordnet domene; tom verdi bruker gjeldende domene. Et toppnivådomene krever HTTPS og hindrer ren HTTP i å skrive nøkler med samme navn på det lokale domenet"
"Activation URL. Front-end activation page URL used in email activation links, such as https://xxx/activate; empty builds /activate from the request host": "Aktiverings-URL. URL til frontend-aktiveringssiden som brukes i aktiveringslenker i e-post, for eksempel https://xxx/activate; tom verdi bygger /activate fra forespørselsverten"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default false": "Lagre token i cookie. Leser tokenet fra cookien når forespørselsheaderen ikke inneholder noe, standard false"
"Password strength. * means unrestricted; the simple form defaults to 5 to 32 characters of any type. The full form requires at least 8 characters with digits, upper/lower case letters and symbols: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$": "Passordstyrke. * betyr ubegrenset; den enkle formen har som standard 5 til 32 tegn av en hvilken som helst type. Den fulle formen krever minst 8 tegn med sifre, store og små bokstaver og symboler: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$"
