"Generated {0} configuration field values (skipped {1}, failed {2}) and filled them into the form. Ask the user to review before submitting.": "Genererte {0} verdier for konfigurasjonsfelt (hoppet over {1}, mislyktes {2}) og fylte dem inn i skjemaet. Be brukeren gå gjennom før innsending."
"The current page is a system configuration form (such as Cube settings); you can help review and fill in configuration items.": "Gjeldende side er et systemkonfigurasjonsskjema (for eksempel Cube-innstillinger); du kan hjelpe med å gjennomgå og fylle ut konfigurasjonselementer."
"Available tools: get_form_schema / fill_form / get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "Tilgjengelige verktøy: get_form_schema / fill_form / get_page_context / get_system_info / run_js (se funksjonsdefinisjonene; kall dem ved behov)"
"2. When the user asks to create, fill in or complete configuration, call get_form_schema first to inspect the items, then call fill_form to generate values (invent reasonable values for empty writable fields, keep existing values unless the user asks otherwise, and never fabricate or modify sensitive settings such as ApiKey/Secret/Token); finally ask the user to review before submitting": "2. Når brukeren ber om å opprette, fylle ut eller fullføre konfigurasjon, kall get_form_schema først for å inspisere elementene, og kall deretter fill_form for å generere verdier (finn på rimelige verdier for tomme skrivbare felt, behold eksisterende verdier med mindre brukeren ber om annet, og finn aldri opp eller endre sensitive innstillinger som ApiKey/Secret/Token); be til slutt brukeren gå gjennom før innsending"
"3. When the user asks about the content or current state of the page, call get_page_context, then give your analysis and conclusion": "3. Når brukeren spør om innholdet eller gjeldende tilstand på siden, kall get_page_context, og gi deretter analysen og konklusjonen din"
"4. When the user asks about system status or diagnostics, call get_system_info": "4. Når brukeren spør om systemstatus eller diagnostikk, kall get_system_info"
"5. When the user asks to read or operate page elements, you may call run_js; explain any write operation (changing page content, submitting forms) to the user before running it": "5. Når brukeren ber om å lese eller betjene sideelementer, kan du kalle run_js; forklar enhver skriveoperasjon (endre sideinnhold, sende inn skjemaer) for brukeren før den kjøres"
"6. Never invent data; ask the user for clarification when information is insufficient": "6. Finn aldri opp data; spør brukeren om avklaring når informasjonen er utilstrekkelig"
"The tenant identifier carried by user [{0}] is invalid or unavailable. Check the tenant settings and try again.": "Leietakeridentifikatoren som brukeren [{0}] har med, er ugyldig eller utilgjengelig. Kontroller leietakerinnstillingene og prøv igjen."
"User [{0}] did not carry a tenant identifier, so the tenant cannot be determined. Include the tenant information and try again.": "Brukeren [{0}] hadde ingen leietakeridentifikator, så leietakeren kan ikke fastslås. Ta med leietakerinformasjonen og prøv igjen."
"User [{0}] is not allowed to access the data of the current tenant. Switch tenant and try again.": "Brukeren [{0}] har ikke tillatelse til å få tilgang til dataene til gjeldende leietaker. Bytt leietaker og prøv igjen."
