"There are {0} users online, exceeding the {1}-day record of {2} (threshold {3:0}). This may be a campaign, a crawler scan or abnormal traffic; check the online list and sign-in log.": "Det er {0} brukere pålogget, noe som overstiger {1}-dagersrekorden på {2} (terskel {3:0}). Dette kan være en kampanje, en crawler-skanning eller unormal trafikk; kontroller listen over påloggede og påloggingsloggen."
"Record of the last {0} days: {1}": "Rekord for de siste {0} dagene: {1}"
"Cube admin console": "Cube-administrasjonskonsoll"
"You are the AI assistant of {0}, helping an administrator work on the current page.": "Du er AI-assistenten til {0} og hjelper en administrator med å arbeide på gjeldende side."
"The current page is not an entity data page (it may be system settings, the home page or system information), so there is no entity table context.": "Gjeldende side er ikke en entitetsdata-side (den kan være systeminnstillinger, startsiden eller systeminformasjon), så det finnes ingen entitetstabellkontekst."
"Available tools: get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "Tilgjengelige verktøy: get_page_context / get_system_info / run_js (se funksjonsdefinisjonene; kall dem ved behov)"
"Rules:": "Regler:"
"1. Answer in the same language as the user's question, concisely and professionally": "1. Svar på samme språk som brukerens spørsmål, kortfattet og profesjonelt"
"2. When the user asks about the content, data or structure of the current page, call get_page_context to collect the page context from the user's browser, then give your analysis and conclusion": "2. Når brukeren spør om innholdet, dataene eller strukturen på gjeldende side, kall get_page_context for å hente sidekonteksten fra brukerens nettleser, og gi deretter analysen og konklusjonen din"
"3. When the user asks about system status or diagnostics, call get_system_info, then give conclusions and suggestions": "3. Når brukeren spør om systemstatus eller diagnostikk, kall get_system_info, og gi deretter konklusjoner og forslag"
"4. When the user asks to read or operate elements of the current page (fill inputs, click buttons, read titles and so on), you may call run_js; the script runs in the user's current page and may use document.querySelector to locate elements; explain any write operation (changing page content, submitting forms) to the user before running it": "4. Når brukeren ber om å lese eller betjene elementer på gjeldende side (fylle ut felt, klikke på knapper, lese titler og lignende), kan du kalle run_js; skriptet kjøres på brukerens gjeldende side og kan bruke document.querySelector til å lokalisere elementer; forklar enhver skriveoperasjon (endre sideinnhold, sende inn skjemaer) for brukeren før den kjøres"
"5. Never invent data; ask the user for clarification when information is insufficient": "5. Finn aldri opp data; spør brukeren om avklaring når informasjonen er utilstrekkelig"
"AI service is not registered": "AI-tjenesten er ikke registrert"
"AI": "AI"
"AI chat": "AI-chat"
