"JavaScript code to run in the current page": "A jelenlegi oldalon futtatandó JavaScript-kód"
"Get page context": "Oldalkontextus lekérése"
"Gets the main data and structure of the current page (title, tables, forms and so on). Uses the server-side context when the page provides one; otherwise collects the page content from the user's browser": "Lekéri a jelenlegi oldal fő adatait és szerkezetét (cím, táblázatok, űrlapok stb.). Ha az oldal kiszolgálóoldali kontextust biztosít, azt használja; ellenkező esetben a felhasználó böngészőjéből gyűjti össze az oldal tartalmát"
"Get form schema": "Űrlapséma lekérése"
"Gets the schema of the current form, including field names, types, descriptions and current values, for generating form values": "Lekéri a jelenlegi űrlap sémáját, beleértve a mezőneveket, típusokat, leírásokat és aktuális értékeket, az űrlapértékek előállításához"
"Form mode: add or edit": "Űrlapmód: hozzáadás vagy szerkesztés"
"Fill form": "Űrlap kitöltése"
"Generates form field values and fills them into the front-end form. Nothing is written to the database until the user confirms": "Űrlapmező-értékeket állít elő, és kitölti velük a front-end űrlapot. A felhasználó megerősítéséig semmi sem íródik az adatbázisba"
"Field values as a JSON string, keyed by field name": "Mezőértékek JSON-karakterláncként, a mezőnévvel kulcsolva"
"No valid field value dictionary was received": "Nem érkezett érvényes mezőérték-szótár"
