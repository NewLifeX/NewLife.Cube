"Standard - clear row lines": "Normál – jól látható sorvonalak"
"Grid - full cell borders": "Rács – teljes cellakeretek"
"Compact - dense": "Kompakt – sűrű"
"Normal - relaxed": "Normál – levegős"
# 设置页字段、分类与导航（中文源文经英文规范键翻译）
"Auto (follow system)": "Automatikus (rendszert követő)"
"Cancel": "Mégse"
"Queries {0}, executes {1}, elapsed {2:n0} ms": "Lekérdezések: {0}, végrehajtások: {1}, eltelt idő: {2:n0} ms"
"Show run time": "Futási idő megjelenítése"
"Avatar directory. Downloads remote avatars locally; defaults to the Avatars subdirectory, or Avatars next to the web root. Empty disables downloading": "Profilkép-könyvtár. A távoli profilképeket helyileg tölti le; alapértelmezés szerint az Avatars alkönyvtárat vagy a webgyökér melletti Avatars könyvtárat használja. Üres érték esetén a letöltés letiltva"
"Text avatar characters. Generates an SVG text avatar when no image exists; 1 to 3 characters. Uses the first N Chinese characters to keep the surname, or the initials of English words. Default 2": "Szöveges profilkép karakterei. Ha nincs kép, SVG szöveges profilképet készít; 1–3 karakter. A vezetéknév megtartásához az első N kínai karaktert vagy az angol szavak kezdőbetűit használja. Alapértelmezés: 2"
"Upload directory. Defaults to Uploads": "Feltöltési könyvtár. Alapértelmezés szerint Uploads"
"Web root directory. Defaults to wwwroot": "Webgyökér-könyvtár. Alapértelmezés szerint wwwroot"
"Resource URL. CDN base such as https://sso.newlifex.com/content/; empty uses local resources": "Erőforrás URL. CDN-alap, például https://sso.newlifex.com/content/; üres érték esetén helyi erőforrások"
"CORS origins. Other origins allowed to access this site; * allows any origin": "CORS-források. A webhely elérésére engedélyezett egyéb források; a * bármely forrást engedélyez"
"Iframe embedding. Empty allows the same domain only; SAMEORIGIN allows the same domain and port; ALLOWALL allows any domain": "Iframe-beágyazás. Üres érték csak azonos tartományt engedélyez; a SAMEORIGIN azonos tartományt és portot engedélyez; az ALLOWALL bármely tartományt engedélyez"
"Share expiration. Lifetime of share tokens in seconds, default 7200": "Megosztás lejárata. A megosztási tokenek élettartama másodpercben, alapértelmezés: 7200"
"Bot error code. Returns this error for crawlers, such as 404/500; 0 disables blocking": "Bot hibakód. Ezt a hibát adja vissza a feltérképezőknek, például 404/500; a 0 letiltja a blokkolást"
"Force redirect. Target scheme and host for GET requests; * is supported in the host. Commonly used to force HTTPS, such as https://*:8081": "Kényszerített átirányítás. Cél séma és hoszt a GET-kérésekhez; a hosztban a * támogatott. Gyakran a HTTPS kényszerítésére használják, például https://*:8081"
"Security mode. 0: off; 1: observe and log only; 2: block; 3: automatic (default; observes, bans repeated attackers, and temporarily blocks broad attacks with automatic rollback)": "Biztonsági mód. 0: ki; 1: csak megfigyelés és naplózás; 2: blokkolás; 3: automatikus (alapértelmezett; megfigyel, tiltja az ismételt támadókat, és automatikus visszagörgetéssel ideiglenesen blokkolja a széles körű támadásokat)"
"Auto-ban durations. Comma-separated seconds that increase with each trigger; empty uses 60,300,1800,7200,86400": "Automatikus tiltás időtartamai. Vesszővel elválasztott másodpercek, amelyek minden kiváltáskor nőnek; üres érték esetén 60,300,1800,7200,86400"
"Trusted proxies. Forwarded headers are only trusted from these comma-separated IPs or CIDR ranges; empty keeps the legacy behavior of trusting all forwarded headers": "Megbízható proxyk. A továbbított fejléceket csak ezekből a vesszővel elválasztott IP-címekből vagy CIDR-tartományokból fogadja el; üres érték esetén az összes továbbított fejléc megbízhatónak tekintésének korábbi viselkedése marad"
"Trusted proxy learning limit. When no trusted proxies are configured, private direct sources that send forwarded headers are learned up to this count; 0 disables learning (typically 2 for one data center, 4 for two)": "Megbízható proxy tanulási korlát. Ha nincs megbízható proxy beállítva, a továbbított fejléceket küldő privát közvetlen források eddig a számig tanulhatók; a 0 letiltja a tanulást (jellemzően 2 egy adatközponthoz, 4 kettőhöz)"
"Learned proxies. Maintained automatically; clear it to reset the learned list": "Tanult proxyk. Automatikusan karbantartott; a tanult lista visszaállításához törölje"
"Default role. Defaults to the Normal User role": "Alapértelmezett szerepkör. Alapértelmezés szerint a Normál felhasználó szerepkör"
"Allow password sign-in. Allows signing in with a username and password": "Jelszavas bejelentkezés engedélyezése. Engedélyezi a bejelentkezést felhasználónévvel és jelszóval"
"Allow plain-text passwords. Default true for legacy clients; false forces Challenge-Response encrypted passwords": "Sima szövegű jelszavak engedélyezése. Régi klienseknél az alapérték true; a false a Challenge-Response titkosított jelszavakat kényszeríti"
"Allow registration. Allows registering with a username and password": "Regisztráció engedélyezése. Engedélyezi a regisztrációt felhasználónévvel és jelszóval"
"Auto registration. Default true; after SSO sign-in an unknown local user is registered automatically. Enabled when either the global or the OAuth app setting is on": "Automatikus regisztráció. Alapértelmezés: true; SSO-bejelentkezés után az ismeretlen helyi felhasználó automatikusan regisztrálásra kerül. Akkor engedélyezett, ha a globális vagy az OAuth-alkalmazás beállítás be van kapcsolva"
"Password complexity check. When enabled the sign-in page validates password strength; when disabled it only requires a non-empty password. Default true": "Jelszóösszetettség-ellenőrzés. Engedélyezése esetén a bejelentkezési oldal ellenőrzi a jelszó erősségét; letiltása esetén csak a nem üres jelszó szükséges. Alapértelmezés: true"
"Login failure limit. Bans sign-in after this many consecutive failures for the same user or IP, default 5": "Bejelentkezési hiba korlát. Ugyanazon felhasználó vagy IP esetében ennyi egymást követő hiba után tiltja a bejelentkezést, alapértelmezés: 5"
"Login ban duration. Seconds a risk-control ban lasts, default 300": "Bejelentkezési tiltás időtartama. A kockázatkezelési tiltás másodpercben megadott időtartama, alapértelmezés: 300"
"Class C subnet ban threshold. Bans a /24 subnet such as 103.125.146.* after this many failures, default 10; 0 disables": "C osztályú alhálózat tiltási küszöb. Ennyi hiba után tiltja a /24 alhálózatot, például 103.125.146.*, alapértelmezés: 10; a 0 letiltja"
"Class B subnet ban threshold. Bans a /16 subnet such as 103.125.*.* after this many failures, default 20; 0 disables": "B osztályú alhálózat tiltási küszöb. Ennyi hiba után tiltja a /16 alhálózatot, például 103.125.*.*, alapértelmezés: 20; a 0 letiltja"
"Force bind by user name. Binds SSO users to local users with the same name without a provider prefix; intended for user centers": "Társítás kényszerítése felhasználónév szerint. A szolgáltatói előtag nélküli, azonos nevű helyi felhasználókhoz társítja az SSO-felhasználókat; felhasználói központokhoz készült"
"Bind by user code. Binds SSO users to local users by user code": "Társítás felhasználói kód szerint. Az SSO-felhasználókat felhasználói kód szerint társítja a helyi felhasználókhoz"
"Bind by mobile. Binds SSO users to local users by mobile number": "Társítás mobiltelefon szerint. Az SSO-felhasználókat mobiltelefonszám szerint társítja a helyi felhasználókhoz"
"Bind by email. Binds SSO users to local users by email": "Társítás e-mail szerint. Az SSO-felhasználókat e-mail-cím szerint társítja a helyi felhasználókhoz"
"Bind by nickname. Binds SSO users to local users by nickname; suitable for internal SSO, not for social networks with many duplicate names": "Társítás becenév szerint. Az SSO-felhasználókat becenév szerint társítja a helyi felhasználókhoz; belső SSO-hoz alkalmas, sok azonos nevű felhasználót tartalmazó közösségi hálózatokhoz nem"
"Use SSO roles. Keeps SSO roles after sign-in, default true; otherwise DefaultRole is used": "SSO-szerepkörök használata. Bejelentkezés után megtartja az SSO-szerepköröket, alapértelmezés: true; ellenkező esetben a DefaultRole kerül használatra"
"Use SSO departments. Keeps SSO departments after sign-in, default true": "SSO-részlegek használata. Bejelentkezés után megtartja az SSO-részlegeket, alapértelmezés: true"
"SSO role rules. Automatically upgrades the primary role after SSO sign-in; separate rules with commas. Format: source role+department wildcard=target role, for example Guest+Route*=Route Specialist": "SSO-szerepkör-szabályok. Az SSO-bejelentkezés után automatikusan előlépteti az elsődleges szerepkört; a szabályokat vesszővel válassza el. Formátum: forrásszerepkör+részleg helyettesítő karaktere=célszerepkör, például Guest+Route*=Route Specialist"
"Sign out everywhere. false signs out of this site only; true (default) also signs out of the SSO server": "Kijelentkezés mindenhonnan. A false csak erről a webhelyről jelentkezik ki; a true (alapértelmezett) az SSO-kiszolgálóról is kijelentkezik"
"Allow multi-device sign-in. false kicks old devices on a new sign-in and revokes all tokens on sign-out; true (default) revokes only the current session": "Bejelentkezés engedélyezése több eszközön. A false új bejelentkezéskor kilépteti a régi eszközöket, és kijelentkezéskor visszavonja az összes tokent; a true (alapértelmezett) csak az aktuális munkamenetet vonja vissza"
"Session timeout. Session lifetime after SSO sign-in during which the cookie can sign in again; default 0s": "Munkamenet időtúllépés. Az SSO-bejelentkezés utáni munkamenet élettartama, amely alatt a cookie újra be tud jelentkezni; alapértelmezés: 0 mp"
"Token sliding refresh threshold. Refreshes the JWT and rewrites the cookie when its remaining lifetime falls below this many seconds; 0 disables sliding expiration": "Token csúszófrissítési küszöb. Ha a hátralévő élettartam ez alá a másodpercszám alá csökken, frissíti a JWT-t és újraírja a cookie-t; a 0 letiltja a csúszó lejáratot"
"User refresh period. Fetches user information once per period across SSO sign-ins, default 600 seconds": "Felhasználói frissítési időköz. Az SSO-bejelentkezések között időközönként egyszer lekéri a felhasználói adatokat, alapértelmezés: 600 másodperc"
"JWT secret. Algorithm and key used to sign JWTs, such as HS256:ABCD1234": "JWT-titkos kulcs. A JWT-k aláírásához használt algoritmus és kulcs, például HS256:ABCD1234"
"Token lifetime. Lifetime of the access token in seconds, default 7200": "Token élettartama. A hozzáférési token élettartama másodpercben, alapértelmezés: 7200"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default true": "Token tárolása cookie-ban. Ha a kérés fejléce nem tartalmaz tokent, a cookie-ból olvassa ki, alapértelmezés: true"
"Validate attachment access. Requires sign-in to access attachments, default true": "Melléklethozzáférés ellenőrzése. A mellékletek eléréséhez bejelentkezést ír elő, alapértelmezés: true"
"Public attachment categories. Categories accessible without sign-in, comma-separated, such as markdown,avatar. Applies when ValidateAttachment is true": "Nyilvános mellékletkategóriák. Bejelentkezés nélkül elérhető kategóriák, vesszővel elválasztva, például markdown,avatar. Akkor érvényes, ha a ValidateAttachment értéke true"
"Private attachment categories. Categories only the uploader can access, comma-separated. Applies when ValidateAttachment is true": "Privát mellékletkategóriák. Csak a feltöltő által elérhető kategóriák, vesszővel elválasztva. Akkor érvényes, ha a ValidateAttachment értéke true"
"SSO redirect allowlist. Domains allowed to receive the JWT after sign-in, comma-separated with wildcard prefixes such as *.company.com. Empty allows the same site only; other origins are rejected and sent back to the home page": "SSO-átirányítási engedélyezési lista. A bejelentkezés után JWT-t fogadhat tartományok, vesszővel elválasztva, *.company.com típusú helyettesítő előtagokkal. Üres érték esetén csak az azonos webhely engedélyezett; a többi forrás elutasításra kerül, és visszairányít a kezdőlapra"
"External authentication URL. When local authentication fails, credentials are verified by this endpoint; on success the local user is created or updated and signed in": "Külső hitelesítési URL. Ha a helyi hitelesítés meghiúsul, a hitelesítő adatokat ez a végpont ellenőrzi; siker esetén a helyi felhasználó létrejön vagy frissül, és bejelentkezik"
"Start page. First content page opened after entering the admin console": "Kezdőoldal. A felügyeleti konzol megnyitása után elsőként megnyitott tartalomoldal"
"Theme. Content page theme, ACE/layui": "Téma. A tartalomoldal témája, ACE/layui"
"Skin. Outer frame layout, ACE/layui": "Kinézet. A külső keret elrendezése, ACE/layui"
"Login tip. Empty hides the tip on the sign-in page": "Bejelentkezési tipp. Üres érték esetén a tipp elrejtve a bejelentkezési oldalon"
"Login logo. Empty uses the default logo": "Bejelentkezési logó. Üres érték esetén az alapértelmezett logó"
"Login background. Image URL; empty uses the default background": "Bejelentkezési háttér. Kép URL; üres érték esetén az alapértelmezett háttér"
"Form group layout. 3/2/1 columns on large/medium/small screens, form-group col-xs-12 col-sm-6 col-lg-4": "Űrlapcsoport-elrendezés. 3/2/1 oszlop nagy/közepes/kicsi képernyőn, form-group col-xs-12 col-sm-6 col-lg-4"
"Bootstrap select. Nicer drop-downs with a rendering cost": "Bootstrap select. Szebb legördülő listák megjelenítési költség árán"
"Maximum drop-down items. Maximum options in a related drop-down on forms, default 50; larger lists fall back to a text box": "Legördülő elemek felső korlátja. Az űrlapok kapcsolt legördülő listájában a beállítások felső korlátja, alapértelmezés: 50; a nagyobb listák szövegmezőre váltanak"
"Copyright. Empty hides the copyright; variables now/runtime/framework are supported, and now accepts formats such as {now:yyyy}": "Szerzői jog. Üres érték esetén a szerzői jogi információ elrejtve; a now/runtime/framework változók támogatottak, a now pedig olyan formátumokat fogad el, mint a {now:yyyy}"
"Filing number. Empty hides the filing information": "Nyilvántartási szám. Üres érték esetén a nyilvántartási információ elrejtve"
"Enable new UI": "Új felhasználói felület engedélyezése"
"ECharts theme. Chart theme": "ECharts-téma. Diagramtéma"
"Title suffix. Appends the system name to page titles, default true": "Cím utótag. A rendszer nevét fűzi az oldalcímekhez, alapértelmezés: true"
"Table double-click. Enables row double-click on list pages, default true": "Táblázat dupla kattintás. Engedélyezi a sor dupla kattintását a listaoldalakon, alapértelmezés: true"
"Table style. Light: minimal thin lines; Standard: clear row lines (default); Grid: full cell borders": "Táblázatstílus. Világos: minimális vékony vonalak; Normál: jól látható sorvonalak (alapértelmezett); Rács: teljes cellakeretek"
"Table density. Compact: dense and information-rich (default); Normal: relaxed": "Táblázatsűrűség. Kompakt: sűrű és információban gazdag (alapértelmezett); Normál: levegős"
"Stardust web. Stardust console URL; supports direct links to /trace?id={traceId} or /graph?id={traceId}": "Stardust web. A Stardust konzol URL-je; támogatja a /trace?id={traceId} vagy /graph?id={traceId} közvetlen hivatkozásokat"
"AI master switch. Enables AI features such as log analysis and notification polishing, default false": "AI főkapcsoló. Engedélyezi az AI-funkciókat, például a naplóelemzést és az értesítések csiszolását, alapértelmezés: false"
"AI provider. Supports NewLife, Ollama, DeepSeek, DashScope, OpenAI and others; default NewLife": "AI-szolgáltató. Támogatja a NewLife, Ollama, DeepSeek, DashScope, OpenAI és más szolgáltatókat; alapértelmezés: NewLife"
"AI endpoint. Defaults to https://ai.newlifex.com for NewLife": "AI-végpont. A NewLife esetében alapértelmezés: https://ai.newlifex.com"
"AI ApiKey. Defaults to sk-CubeAI2026 for NewLife": "AI ApiKey. A NewLife esetében alapértelmezés: sk-CubeAI2026"
"AI default model. Defaults to newlife-flash for NewLife": "AI alapértelmezett modell. A NewLife esetében alapértelmezés: newlife-flash"
"AI default deep reasoning. Enables think mode for analysis and chat by default; false means fast responses": "AI alapértelmezett mély következtetés. Alapértelmezés szerint engedélyezi a gondolkodási módot az elemzéshez és a csevegéshez; a false gyors válaszokat jelent"
"AI color scheme. Fills the primary and secondary colors from a preset": "AI színséma. Előbeállításból tölti ki az elsődleges és másodlagos színt"
"AI primary color. Main color of the launcher, panel header and user bubbles; default NewLife green #2ecc71": "AI elsődleges szín. Az indító, a panel fejléce és a felhasználói buborékok fő színe; alapértelmezés: NewLife zöld #2ecc71"
"AI secondary color. Gradient end color, default dark green #1e8e3e": "AI másodlagos szín. A színátmenet zárószíne, alapértelmezés: sötétzöld #1e8e3e"
"OAuth server. Enables the OAuth 2.0 server that provides SSO for other applications": "OAuth-kiszolgáló. Engedélyezi az OAuth 2.0 kiszolgálót, amely SSO-t biztosít más alkalmazásoknak"
"File manager. Enables backend file management (browse, upload, download, delete); this carries security risks": "Fájlkezelő. Engedélyezi a háttérbeli fájlkezelést (böngészés, feltöltés, letöltés, törlés); ez biztonsági kockázatokat hordoz"
"Multi-tenancy. Enables tenants; tenant mode cannot access system administration and platform mode cannot access tenant pages": "Többbérlős működés. Engedélyezi a bérlőket; a bérlői mód nem érheti el a rendszerfelügyeletet, a platformmód pedig a bérlői oldalakat"
"Tenant query policy. DenyWithEmpty: return an empty set without tenant context; ThrowOnMissingTenant: throw an explicit error": "Bérlőlekérdezési szabályzat. DenyWithEmpty: bérlői környezet nélkül üres halmazt ad vissza; ThrowOnMissingTenant: explicit hibát dob"
"User online. 0: do not record; 1: signed-in users only; 2: all visitors (default)": "Online felhasználók. 0: ne rögzítse; 1: csak bejelentkezett felhasználók; 2: minden látogató (alapértelmezett)"
"User statistics. Records user visits, default true": "Felhasználói statisztikák. Rögzíti a felhasználói látogatásokat, alapértelmezés: true"
"Enable SMS. SMS verification codes and system notifications, default false": "SMS engedélyezése. SMS-ellenőrző kódok és rendszerértesítések, alapértelmezés: false"
"Enable email. Email verification codes and system notifications, default false": "E-mail engedélyezése. E-mailes ellenőrző kódok és rendszerértesítések, alapértelmezés: false"
"Require email verification. Users must activate their email before signing in and must provide one when registering, default false": "E-mail-ellenőrzés megkövetelése. A felhasználóknak bejelentkezés előtt aktiválniuk kell az e-mail-címüket, és regisztrációkor meg kell adniuk egyet, alapértelmezés: false"
"Require mobile verification. Users must activate their mobile before signing in and must provide one when registering, default false": "Mobiltelefon-ellenőrzés megkövetelése. A felhasználóknak bejelentkezés előtt aktiválniuk kell a mobiltelefonjukat, és regisztrációkor meg kell adniuk egyet, alapértelmezés: false"
"Captcha scenarios. Bit mask: 0: off; 1: sign-in; 2: registration; 4: verification code requests (anti-SMS-bombing); combine with 3 for sign-in and registration. Mandatory scenarios are never exempted, default 0": "Captcha-forgatókönyvek. Bitmaszk: 0: ki; 1: bejelentkezés; 2: regisztráció; 4: ellenőrző kód kérése (SMS-bombázás elleni védelem); a 3-mal kombinálva bejelentkezés és regisztráció. A kötelező forgatókönyvek soha nem mentesülnek, alapértelmezés: 0"
"Risk-adaptive captcha. Disabled when CaptchaScene is 0; when enabled it detects unsafe environments and requires a captcha, default true": "Kockázatadaptív captcha. Letiltva, ha a CaptchaScene értéke 0; engedélyezése esetén felismeri a nem biztonságos környezeteket, és captcha-t kér, alapértelmezés: true"
"Captcha risk threshold. Requires a captcha when the risk score reaches this value: 0: intranet; 1: internet; 2: internet with recent failures; 3: banned. Default 2": "Captcha kockázati küszöb. Captcha-t kér, ha a kockázati pontszám eléri ezt az értéket: 0: belső hálózat; 1: internet; 2: internet friss hibákkal; 3: tiltott. Alapértelmezés: 2"
"Trusted device lifetime. Days during which previously successful devices skip adaptive captchas, default 30": "Megbízható eszköz élettartama. Azon napok száma, amelyek során a korábban sikeres eszközök kihagyják az adaptív captcha-t, alapértelmezés: 30"
"Enable MFA. Allows users to enable TOTP multi-factor authentication; an enhanced feature, default false": "MFA engedélyezése. Lehetővé teszi a felhasználóknak a TOTP többtényezős hitelesítés engedélyezését; fejlett funkció, alapértelmezés: false"
"File storage serving. Responds to file download requests from other nodes, default true": "Fájltároló kiszolgálás. Válaszol a más csomópontoktól érkező fájlletöltési kérésekre, alapértelmezés: true"
"File storage fetch. Pulls new files published by other nodes, default true": "Fájltároló lekérés. Lekéri a más csomópontok által közzétett új fájlokat, alapértelmezés: true"
"File fetch timeout. Maximum milliseconds to wait for other nodes when a file is missing locally, default 5000": "Fájllekérés időtúllépése. A más csomópontokra való várakozás maximális ezredmásodperce, ha a fájl helyben hiányzik, alapértelmezés: 5000"
"Attachment storage. Local disk, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu or EasyIO; default Local": "Melléklettároló. Helyi lemez, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu vagy EasyIO; alapértelmezés: Local"
"Object storage server. S3-compatible endpoint for OSS/COS/Qiniu, such as oss-cn-beijing.aliyuncs.com": "Objektumtároló kiszolgáló. S3-kompatibilis végpont az OSS/COS/Qiniu számára, például oss-cn-beijing.aliyuncs.com"
"Object storage bucket. Bucket name for OSS/COS/Qiniu": "Objektumtároló gyűjtő. Gyűjtőnév az OSS/COS/Qiniu számára"
"Object storage region. S3 signing scope, such as cn-beijing / ap-beijing / cn-east-1": "Objektumtároló régió. S3-aláírási hatókör, például cn-beijing / ap-beijing / cn-east-1"
"Object storage app ID. AccessKeyId": "Objektumtároló alkalmazásazonosító. AccessKeyId"
"Object storage app secret. AccessKeySecret": "Objektumtároló alkalmazás titkos kulcsa. AccessKeySecret"
"Data retention. Days to keep audit and OAuth logs, default 30": "Adatmegőrzés. Az audit- és OAuth-naplók megőrzési napjainak száma, alapértelmezés: 30"
"File retention. Days to keep backup files, default 15": "Fájlmegőrzés. A biztonsági mentési fájlok megőrzési napjainak száma, alapértelmezés: 15"
"Retention size floor. Files smaller than this (KB) are never deleted even after the retention period, default 1024K": "Megőrzési mérethatár. Az ennél (KB) kisebb fájlok még a megőrzési idő lejárta után sem törlődnek, alapértelmezés: 1024K"
"Maximum export rows. Maximum rows a page may export, default 10_000_000": "Exportálható sorok felső korlátja. Egy oldal által exportálható sorok maximális száma, alapértelmezés: 10_000_000"
"Maximum backup rows. Maximum rows a page may back up, default 10_000_000": "Biztonsági mentésbe vonható sorok felső korlátja. Egy oldal által menthető sorok maximális száma, alapértelmezés: 10_000_000"
"API prefixes. Comma- or semicolon-separated prefixes such as /api,/api/v1; matching requests are forwarded to the real route without the prefix": "API-előtagok. Vesszővel vagy pontosvesszővel elválasztott előtagok, például /api,/api/v1; az egyező kérések az előtag nélküli valódi útvonalra továbbítódnak"
"Password strength. * means unrestricted; by default at least 8 characters with digits, upper/lower case letters and symbols. Simple form: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$": "Jelszó erőssége. A * korlátlan lehetőséget jelent; alapértelmezés szerint legalább 8 karakter számokkal, kis- és nagybetűkkel, valamint szimbólumokkal. Egyszerű forma: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$"
"Cookie mode. Default SameSite mode for token cookies (-1 Unspecified, 0 None, 1 Lax, 2 Strict)": "Cookie-mód. A token-cookie-k alapértelmezett SameSite módja (-1 Unspecified, 0 None, 1 Lax, 2 Strict)"
"Cookie domain. Writes cookies to a parent domain; empty uses the current domain. A top-level domain requires HTTPS and prevents plain HTTP from writing same-name keys on the local domain": "Cookie-tartomány. A cookie-kat szülőtartományba írja; üres érték esetén az aktuális tartományt használja. A legfelső szintű tartomány HTTPS-t igényel, és megakadályozza, hogy a sima HTTP azonos nevű kulcsokat írjon a helyi tartományban"
"Activation URL. Front-end activation page URL used in email activation links, such as https://xxx/activate; empty builds /activate from the request host": "Aktiválási URL. Az e-mailes aktiválási hivatkozásokban használt front-end aktiválási oldal URL-je, például https://xxx/activate; üres érték esetén a kérés hosztjából építi fel a /activate útvonalat"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default false": "Token tárolása cookie-ban. Ha a kérés fejléce nem tartalmaz tokent, a cookie-ból olvassa ki, alapértelmezés: false"
"Password strength. * means unrestricted; the simple form defaults to 5 to 32 characters of any type. The full form requires at least 8 characters with digits, upper/lower case letters and symbols: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$": "Jelszó erőssége. A * korlátlan lehetőséget jelent; az egyszerű forma alapértelmezés szerint bármilyen típusú 5–32 karaktert tesz lehetővé. A teljes forma legalább 8 karaktert követel meg számokkal, kis- és nagybetűkkel, valamint szimbólumokkal: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$"
