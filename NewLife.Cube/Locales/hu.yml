"Generated {0} form field values (skipped {1}, failed {2}) and filled them into the form. Ask the user to review before submitting.": "{0} űrlapmező-érték előállítva ({1} kihagyva, {2} sikertelen), és kitöltve az űrlapba. Kérje meg a felhasználót, hogy beküldés előtt tekintse át."
