"Generated {0} configuration field values (skipped {1}, failed {2}) and filled them into the form. Ask the user to review before submitting.": "{0} konfigurációs mezőérték előállítva ({1} kihagyva, {2} sikertelen), és kitöltve az űrlapba. Kérje meg a felhasználót, hogy beküldés előtt tekintse át."
"The current page is a system configuration form (such as Cube settings); you can help review and fill in configuration items.": "A jelenlegi oldal egy rendszerkonfigurációs űrlap (például Cube-beállítások); segíthet a konfigurációs elemek áttekintésében és kitöltésében."
"Available tools: get_form_schema / fill_form / get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "Elérhető eszközök: get_form_schema / fill_form / get_page_context / get_system_info / run_js (lásd a függvénydefiníciókat; szükség esetén hívja meg őket)"
"2. When the user asks to create, fill in or complete configuration, call get_form_schema first to inspect the items, then call fill_form to generate values (invent reasonable values for empty writable fields, keep existing values unless the user asks otherwise, and never fabricate or modify sensitive settings such as ApiKey/Secret/Token); finally ask the user to review before submitting": "2. Amikor a felhasználó konfiguráció létrehozását, kitöltését vagy kiegészítését kéri, először hívja meg a get_form_schema eszközt az elemek áttekintéséhez, majd a fill_form eszközt az értékek előállításához (az üres, írható mezőkhöz találjon ki ésszerű értékeket, a meglévő értékeket tartsa meg, hacsak a felhasználó mást nem kér, és soha ne találjon ki vagy módosítson bizalmas beállításokat, például ApiKey/Secret/Token); végül beküldés előtt kérje meg a felhasználót az áttekintésre"
"3. When the user asks about the content or current state of the page, call get_page_context, then give your analysis and conclusion": "3. Amikor a felhasználó az oldal tartalmáról vagy aktuális állapotáról kérdez, hívja meg a get_page_context eszközt, majd adja meg elemzését és következtetését"
"4. When the user asks about system status or diagnostics, call get_system_info": "4. Amikor a felhasználó a rendszer állapotáról vagy diagnosztikáról kérdez, hívja meg a get_system_info eszközt"
"5. When the user asks to read or operate page elements, you may call run_js; explain any write operation (changing page content, submitting forms) to the user before running it": "5. Amikor a felhasználó oldalelemek beolvasását vagy működtetését kéri, meghívhatja a run_js eszközt; futtatás előtt magyarázza el a felhasználónak az írási műveleteket (oldaltartalom módosítása, űrlapok elküldése)"
"6. Never invent data; ask the user for clarification when information is insufficient": "6. Soha ne találjon ki adatokat; ha az információ nem elegendő, kérjen pontosítást a felhasználótól"
"The tenant identifier carried by user [{0}] is invalid or unavailable. Check the tenant settings and try again.": "A(z) [{0}] felhasználó által átadott bérlőazonosító érvénytelen vagy nem elérhető. Ellenőrizze a bérlő beállításait, és próbálja újra."
"User [{0}] did not carry a tenant identifier, so the tenant cannot be determined. Include the tenant information and try again.": "A(z) [{0}] felhasználó nem adott át bérlőazonosítót, ezért a bérlő nem állapítható meg. Adja meg a bérlő adatait, és próbálja újra."
"User [{0}] is not allowed to access the data of the current tenant. Switch tenant and try again.": "A(z) [{0}] felhasználó nem érheti el a jelenlegi bérlő adatait. Váltson bérlőt, és próbálja újra."
