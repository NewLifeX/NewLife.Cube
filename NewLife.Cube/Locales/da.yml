"There are {0} users online, exceeding the {1}-day record of {2} (threshold {3:0}). This may be a campaign, a crawler scan or abnormal traffic; check the online list and sign-in log.": "Der er {0} brugere online, hvilket overstiger rekorden på {2} for {1} dage (tærskel {3:0}). Det kan være en kampagne, en crawlerscanning eller unormal trafik; kontroller onlinelisten og loginloggen."
"Record of the last {0} days: {1}": "Rekord for de seneste {0} dage: {1}"
"Cube admin console": "Cube-administrationskonsol"
"You are the AI assistant of {0}, helping an administrator work on the current page.": "Du er AI-assistenten for {0} og hjælper en administrator med at arbejde på den aktuelle side."
"The current page is not an entity data page (it may be system settings, the home page or system information), so there is no entity table context.": "Den aktuelle side er ikke en side med entitetsdata (det kan være systemindstillinger, startsiden eller systemoplysninger), så der er ingen kontekst for entitetstabellen."
"Available tools: get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "Tilgængelige værktøjer: get_page_context / get_system_info / run_js (se funktionsdefinitionerne; kald dem, når det er nødvendigt)"
"Rules:": "Regler:"
"1. Answer in the same language as the user's question, concisely and professionally": "1. Svar på samme sprog som brugerens spørgsmål, kortfattet og professionelt"
"2. When the user asks about the content, data or structure of the current page, call get_page_context to collect the page context from the user's browser, then give your analysis and conclusion": "2. Når brugeren spørger om indholdet, dataene eller strukturen på den aktuelle side, kald get_page_context for at indsamle sidekonteksten fra brugerens browser, og giv derefter din analyse og konklusion"
"3. When the user asks about system status or diagnostics, call get_system_info, then give conclusions and suggestions": "3. Når brugeren spørger om systemstatus eller diagnosticering, kald get_system_info, og giv derefter konklusioner og forslag"
"4. When the user asks to read or operate elements of the current page (fill inputs, click buttons, read titles and so on), you may call run_js; the script runs in the user's current page and may use document.querySelector to locate elements; explain any write operation (changing page content, submitting forms) to the user before running it": "4. Når brugeren beder om at læse eller betjene elementer på den aktuelle side (udfylde felter, klikke på knapper, læse titler og så videre), må du kalde run_js; scriptet kører på brugerens aktuelle side og kan bruge document.querySelector til at finde elementer; forklar enhver skrivehandling (ændring af sideindhold, indsendelse af formularer) for brugeren, før den køres"
"5. Never invent data; ask the user for clarification when information is insufficient": "5. Opfind aldrig data; spørg brugeren om præcisering, når oplysningerne er utilstrækkelige"
"AI service is not registered": "AI-tjenesten er ikke registreret"
"AI": "AI"
"AI chat": "AI-chat"
"Browser operation result callback": "Tilbagekald for resultat af browserhandling"
"...[truncated]": "...[afkortet]"
