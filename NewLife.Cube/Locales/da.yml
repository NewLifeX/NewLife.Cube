# 设置页字段、分类与导航（中文源文经英文规范键翻译）
"Auto (follow system)": "Automatisk (følg systemet)"
"Cancel": "Annuller"
"Queries {0}, executes {1}, elapsed {2:n0} ms": "Forespørgsler {0}, kørsler {1}, forløbet {2:n0} ms"
"Show run time": "Vis køretid"
"Avatar directory. Downloads remote avatars locally; defaults to the Avatars subdirectory, or Avatars next to the web root. Empty disables downloading": "Avatarmappe. Henter eksterne avatarer lokalt; standard er undermappen Avatars eller Avatars ved siden af webroden. Tomt deaktiverer download"
"Text avatar characters. Generates an SVG text avatar when no image exists; 1 to 3 characters. Uses the first N Chinese characters to keep the surname, or the initials of English words. Default 2": "Tegn til tekstavatar. Genererer en SVG-tekstavatar, når der ikke findes et billede; 1 til 3 tegn. Bruger de første N kinesiske tegn for at bevare efternavnet eller initialerne i engelske ord. Standard 2"
"Upload directory. Defaults to Uploads": "Uploadmappe. Standard er Uploads"
"Web root directory. Defaults to wwwroot": "Webrodmappe. Standard er wwwroot"
"Resource URL. CDN base such as https://sso.newlifex.com/content/; empty uses local resources": "Ressource-URL. CDN-basis som https://sso.newlifex.com/content/; tom bruger lokale ressourcer"
"CORS origins. Other origins allowed to access this site; * allows any origin": "CORS-oprindelser. Andre oprindelser, der må tilgå dette websted; * tillader enhver oprindelse"
"Iframe embedding. Empty allows the same domain only; SAMEORIGIN allows the same domain and port; ALLOWALL allows any domain": "Iframe-indlejring. Tom tillader kun samme domæne; SAMEORIGIN tillader samme domæne og port; ALLOWALL tillader alle domæner"
"Share expiration. Lifetime of share tokens in seconds, default 7200": "Udløb for deling. Levetid for delingstokens i sekunder, standard 7200"
"Bot error code. Returns this error for crawlers, such as 404/500; 0 disables blocking": "Fejlkode for botter. Returnerer denne fejl for crawlere, f.eks. 404/500; 0 deaktiverer blokering"
"Force redirect. Target scheme and host for GET requests; * is supported in the host. Commonly used to force HTTPS, such as https://*:8081": "Tvungen videresendelse. Målskema og vært for GET-anmodninger; * understøttes i værten. Bruges ofte til at tvinge HTTPS, f.eks. https://*:8081"
"Security mode. 0: off; 1: observe and log only; 2: block; 3: automatic (default; observes, bans repeated attackers, and temporarily blocks broad attacks with automatic rollback)": "Sikkerhedstilstand. 0: fra; 1: observer og log kun; 2: bloker; 3: automatisk (standard; observerer, spærrer gentagne angribere og blokerer brede angreb midlertidigt med automatisk tilbagerulning)"
"Auto-ban durations. Comma-separated seconds that increase with each trigger; empty uses 60,300,1800,7200,86400": "Spærringstider for automatisk spærring. Kommaseparerede sekunder, der øges ved hver udløsning; tom bruger 60,300,1800,7200,86400"
"Trusted proxies. Forwarded headers are only trusted from these comma-separated IPs or CIDR ranges; empty keeps the legacy behavior of trusting all forwarded headers": "Betroede proxyservere. Videresendte headere betros kun fra disse kommaseparerede IP-adresser eller CIDR-intervaller; tom bevarer den gamle adfærd med at betro alle videresendte headere"
"Trusted proxy learning limit. When no trusted proxies are configured, private direct sources that send forwarded headers are learned up to this count; 0 disables learning (typically 2 for one data center, 4 for two)": "Indlæringsgrænse for betroede proxyservere. Når der ikke er konfigureret betroede proxyservere, indlæres private direkte kilder, der sender videresendte headere, op til dette antal; 0 deaktiverer indlæring (typisk 2 for et datacenter, 4 for to)"
"Learned proxies. Maintained automatically; clear it to reset the learned list": "Indlærte proxyservere. Vedligeholdes automatisk; ryd den for at nulstille den indlærte liste"
"Default role. Defaults to the Normal User role": "Standardrolle. Standard er rollen Almindelig bruger"
"Allow password sign-in. Allows signing in with a username and password": "Tillad logon med adgangskode. Tillader logon med brugernavn og adgangskode"
"Allow plain-text passwords. Default true for legacy clients; false forces Challenge-Response encrypted passwords": "Tillad klartekst-adgangskoder. Standard true for ældre klienter; false tvinger Challenge-Response-krypterede adgangskoder"
"Allow registration. Allows registering with a username and password": "Tillad registrering. Tillader registrering med brugernavn og adgangskode"
"Auto registration. Default true; after SSO sign-in an unknown local user is registered automatically. Enabled when either the global or the OAuth app setting is on": "Automatisk registrering. Standard true; efter SSO-logon registreres en ukendt lokal bruger automatisk. Aktiveret, når enten den globale indstilling eller OAuth-appens indstilling er slået til"
"Password complexity check. When enabled the sign-in page validates password strength; when disabled it only requires a non-empty password. Default true": "Kontrol af adgangskodekompleksitet. Når den er aktiveret, validerer logonsiden adgangskodens styrke; når den er deaktiveret, kræves kun en ikke-tom adgangskode. Standard true"
"Login failure limit. Bans sign-in after this many consecutive failures for the same user or IP, default 5": "Grænse for mislykkede logon. Spærrer logon efter så mange mislykkede forsøg i træk for samme bruger eller IP, standard 5"
"Login ban duration. Seconds a risk-control ban lasts, default 300": "Spærringstid for logon. Antal sekunder en risikokontrolspærring varer, standard 300"
"Class C subnet ban threshold. Bans a /24 subnet such as 103.125.146.* after this many failures, default 10; 0 disables": "Tærskel for spærring af klasse C-subnet. Spærrer et /24-subnet som 103.125.146.* efter så mange fejl, standard 10; 0 deaktiverer"
"Class B subnet ban threshold. Bans a /16 subnet such as 103.125.*.* after this many failures, default 20; 0 disables": "Tærskel for spærring af klasse B-subnet. Spærrer et /16-subnet som 103.125.*.* efter så mange fejl, standard 20; 0 deaktiverer"
"Force bind by user name. Binds SSO users to local users with the same name without a provider prefix; intended for user centers": "Tving tilknytning via brugernavn. Tilknytter SSO-brugere til lokale brugere med samme navn uden udbyderpræfiks; beregnet til brugercentre"
"Bind by user code. Binds SSO users to local users by user code": "Tilknyt via brugerkode. Tilknytter SSO-brugere til lokale brugere via brugerkode"
"Bind by mobile. Binds SSO users to local users by mobile number": "Tilknyt via mobil. Tilknytter SSO-brugere til lokale brugere via mobilnummer"
"Bind by email. Binds SSO users to local users by email": "Tilknyt via e-mail. Tilknytter SSO-brugere til lokale brugere via e-mailadresse"
"Bind by nickname. Binds SSO users to local users by nickname; suitable for internal SSO, not for social networks with many duplicate names": "Tilknyt via kaldenavn. Tilknytter SSO-brugere til lokale brugere via kaldenavn; velegnet til intern SSO, ikke til sociale netværk med mange dubletter"
"Use SSO roles. Keeps SSO roles after sign-in, default true; otherwise DefaultRole is used": "Brug SSO-roller. Beholder SSO-roller efter logon, standard true; ellers bruges DefaultRole"
"Use SSO departments. Keeps SSO departments after sign-in, default true": "Brug SSO-afdelinger. Beholder SSO-afdelinger efter logon, standard true"
"SSO role rules. Automatically upgrades the primary role after SSO sign-in; separate rules with commas. Format: source role+department wildcard=target role, for example Guest+Route*=Route Specialist": "SSO-rolleregler. Opgraderer automatisk den primære rolle efter SSO-logon; adskil regler med kommaer. Format: kilderolle+afdelingsjokertegn=målrolle, f.eks. Guest+Route*=Route Specialist"
"Sign out everywhere. false signs out of this site only; true (default) also signs out of the SSO server": "Log ud overalt. false logger kun ud fra dette websted; true (standard) logger også ud fra SSO-serveren"
"Allow multi-device sign-in. false kicks old devices on a new sign-in and revokes all tokens on sign-out; true (default) revokes only the current session": "Tillad logon på flere enheder. false smider gamle enheder ud ved et nyt logon og tilbagekalder alle tokens ved logud; true (standard) tilbagekalder kun den aktuelle session"
"Session timeout. Session lifetime after SSO sign-in during which the cookie can sign in again; default 0s": "Sessionstimeout. Sessionens levetid efter SSO-logon, hvor cookien kan logge ind igen; standard 0s"
"Token sliding refresh threshold. Refreshes the JWT and rewrites the cookie when its remaining lifetime falls below this many seconds; 0 disables sliding expiration": "Tærskel for glidende tokenfornyelse. Fornyer JWT'en og omskriver cookien, når dens resterende levetid falder under så mange sekunder; 0 deaktiverer glidende udløb"
"User refresh period. Fetches user information once per period across SSO sign-ins, default 600 seconds": "Opdateringsperiode for brugere. Henter brugeroplysninger én gang pr. periode ved SSO-logon, standard 600 sekunder"
"JWT secret. Algorithm and key used to sign JWTs, such as HS256:ABCD1234": "JWT-hemmelighed. Algoritme og nøgle til at signere JWT'er, f.eks. HS256:ABCD1234"
"Token lifetime. Lifetime of the access token in seconds, default 7200": "Tokenlevetid. Adgangstokenens levetid i sekunder, standard 7200"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default true": "Gem token i cookie. Læser token fra cookien, når anmodningsheaderen ikke indeholder en, standard true"
"Validate attachment access. Requires sign-in to access attachments, default true": "Valider adgang til vedhæftede filer. Kræver logon for at tilgå vedhæftede filer, standard true"
"Public attachment categories. Categories accessible without sign-in, comma-separated, such as markdown,avatar. Applies when ValidateAttachment is true": "Offentlige kategorier af vedhæftede filer. Kategorier, der er tilgængelige uden logon, kommasepareret, f.eks. markdown,avatar. Gælder, når ValidateAttachment er true"
"Private attachment categories. Categories only the uploader can access, comma-separated. Applies when ValidateAttachment is true": "Private kategorier af vedhæftede filer. Kategorier, som kun uploaderen kan tilgå, kommasepareret. Gælder, når ValidateAttachment er true"
"SSO redirect allowlist. Domains allowed to receive the JWT after sign-in, comma-separated with wildcard prefixes such as *.company.com. Empty allows the same site only; other origins are rejected and sent back to the home page": "Tilladelsesliste for SSO-videresendelse. Domæner, der må modtage JWT'en efter logon, kommasepareret med jokertegnpræfikser som *.company.com. Tom tillader kun samme websted; andre oprindelser afvises og sendes tilbage til startsiden"
"External authentication URL. When local authentication fails, credentials are verified by this endpoint; on success the local user is created or updated and signed in": "URL til ekstern godkendelse. Når lokal godkendelse mislykkes, verificeres oplysningerne af dette endepunkt; ved succes oprettes eller opdateres den lokale bruger og logges ind"
"Start page. First content page opened after entering the admin console": "Startside. Den første indholdsside, der åbnes, når du går ind i administrationskonsollen"
"Theme. Content page theme, ACE/layui": "Tema. Tema for indholdssiden, ACE/layui"
"Skin. Outer frame layout, ACE/layui": "Udseende. Layout for den ydre ramme, ACE/layui"
"Login tip. Empty hides the tip on the sign-in page": "Logontip. Tomt skjuler tipset på logonsiden"
"Login logo. Empty uses the default logo": "Logonlogo. Tomt bruger standardlogoet"
"Login background. Image URL; empty uses the default background": "Logonbaggrund. Billed-URL; tom bruger standardbaggrunden"
"Form group layout. 3/2/1 columns on large/medium/small screens, form-group col-xs-12 col-sm-6 col-lg-4": "Layout for formulargrupper. 3/2/1 kolonner på store/mellemstore/små skærme, form-group col-xs-12 col-sm-6 col-lg-4"
"Bootstrap select. Nicer drop-downs with a rendering cost": "Bootstrap-select. Pænere rullelister med en renderingsomkostning"
"Maximum drop-down items. Maximum options in a related drop-down on forms, default 50; larger lists fall back to a text box": "Maksimalt antal rullelisteelementer. Maksimalt antal valgmuligheder i en relateret rulleliste i formularer, standard 50; større lister falder tilbage til et tekstfelt"
"Copyright. Empty hides the copyright; variables now/runtime/framework are supported, and now accepts formats such as {now:yyyy}": "Ophavsret. Tomt skjuler ophavsretslinjen; variablerne now/runtime/framework understøttes, og now accepterer formater som {now:yyyy}"
"Filing number. Empty hides the filing information": "Registreringsnummer. Tomt skjuler registreringsoplysningerne"
"Enable new UI": "Aktivér ny brugerflade"
"ECharts theme. Chart theme": "ECharts-tema. Diagramtema"
"Title suffix. Appends the system name to page titles, default true": "Titelsuffiks. Tilføjer systemnavnet til sidetitler, standard true"
"Table double-click. Enables row double-click on list pages, default true": "Dobbeltklik i tabeller. Aktiverer dobbeltklik på rækker på listesider, standard true"
"Table style. Light: minimal thin lines; Standard: clear row lines (default); Grid: full cell borders": "Tabelstil. Lys: minimale tynde linjer; Standard: tydelige rækkelinjer (standard); Gitter: fulde cellekanter"
"Table density. Compact: dense and information-rich (default); Normal: relaxed": "Tabeltæthed. Kompakt: tæt og informationsrig (standard); Normal: luftig"
"Stardust web. Stardust console URL; supports direct links to /trace?id={traceId} or /graph?id={traceId}": "Stardust-web. URL til Stardust-konsollen; understøtter direkte links til /trace?id={traceId} eller /graph?id={traceId}"
"AI master switch. Enables AI features such as log analysis and notification polishing, default false": "Hovedafbryder for AI. Aktiverer AI-funktioner som loganalyse og forfinning af meddelelser, standard false"
"AI provider. Supports NewLife, Ollama, DeepSeek, DashScope, OpenAI and others; default NewLife": "AI-udbyder. Understøtter NewLife, Ollama, DeepSeek, DashScope, OpenAI m.fl.; standard NewLife"
"AI endpoint. Defaults to https://ai.newlifex.com for NewLife": "AI-endepunkt. Standard er https://ai.newlifex.com for NewLife"
"AI ApiKey. Defaults to sk-CubeAI2026 for NewLife": "AI ApiKey. Standard er sk-CubeAI2026 for NewLife"
"AI default model. Defaults to newlife-flash for NewLife": "Standardmodel for AI. Standard er newlife-flash for NewLife"
"AI default deep reasoning. Enables think mode for analysis and chat by default; false means fast responses": "Dyb ræsonnering som standard for AI. Aktiverer tanketilstand til analyse og chat som standard; false betyder hurtige svar"
"AI color scheme. Fills the primary and secondary colors from a preset": "Farveskema for AI. Udfylder primær- og sekundærfarven fra en forudindstilling"
"AI primary color. Main color of the launcher, panel header and user bubbles; default NewLife green #2ecc71": "Primær AI-farve. Hovedfarve for startprogrammet, panelhovedet og brugerbobler; standard NewLife-grøn #2ecc71"
"AI secondary color. Gradient end color, default dark green #1e8e3e": "Sekundær AI-farve. Slutfarve for overgangen, standard mørkegrøn #1e8e3e"
"OAuth server. Enables the OAuth 2.0 server that provides SSO for other applications": "OAuth-server. Aktiverer OAuth 2.0-serveren, der leverer SSO til andre programmer"
"File manager. Enables backend file management (browse, upload, download, delete); this carries security risks": "Filhåndtering. Aktiverer filhåndtering i backenden (gennemse, overfør, hent, slet); dette medfører sikkerhedsrisici"
"Multi-tenancy. Enables tenants; tenant mode cannot access system administration and platform mode cannot access tenant pages": "Multitenancy. Aktiverer lejere; lejertilstand kan ikke tilgå systemadministration, og platformstilstand kan ikke tilgå lejersider"
"Tenant query policy. DenyWithEmpty: return an empty set without tenant context; ThrowOnMissingTenant: throw an explicit error": "Lejerforespørgselspolitik. DenyWithEmpty: returner et tomt sæt uden lejerkontekst; ThrowOnMissingTenant: kast en eksplicit fejl"
"User online. 0: do not record; 1: signed-in users only; 2: all visitors (default)": "Brugere online. 0: registrer ikke; 1: kun loggede ind brugere; 2: alle besøgende (standard)"
"User statistics. Records user visits, default true": "Brugerstatistik. Registrerer brugerbesøg, standard true"
"Enable SMS. SMS verification codes and system notifications, default false": "Aktivér SMS. SMS-bekræftelseskoder og systemmeddelelser, standard false"
"Enable email. Email verification codes and system notifications, default false": "Aktivér e-mail. E-mailbekræftelseskoder og systemmeddelelser, standard false"
"Require email verification. Users must activate their email before signing in and must provide one when registering, default false": "Kræv e-mailbekræftelse. Brugere skal aktivere deres e-mail, før de logger ind, og skal angive en ved registrering, standard false"
"Require mobile verification. Users must activate their mobile before signing in and must provide one when registering, default false": "Kræv mobilbekræftelse. Brugere skal aktivere deres mobil, før de logger ind, og skal angive en ved registrering, standard false"
"Captcha scenarios. Bit mask: 0: off; 1: sign-in; 2: registration; 4: verification code requests (anti-SMS-bombing); combine with 3 for sign-in and registration. Mandatory scenarios are never exempted, default 0": "Captcha-scenarier. Bitmaske: 0: fra; 1: logon; 2: registrering; 4: anmodning om bekræftelseskode (anti-SMS-bombning); kombiner med 3 for logon og registrering. Obligatoriske scenarier fritages aldrig, standard 0"
"Risk-adaptive captcha. Disabled when CaptchaScene is 0; when enabled it detects unsafe environments and requires a captcha, default true": "Risikobaseret captcha. Deaktiveret, når CaptchaScene er 0; når den er aktiveret, registrerer den usikre miljøer og kræver en captcha, standard true"
"Captcha risk threshold. Requires a captcha when the risk score reaches this value: 0: intranet; 1: internet; 2: internet with recent failures; 3: banned. Default 2": "Risikotærskel for captcha. Kræver en captcha, når risikoscoren når denne værdi: 0: intranet; 1: internet; 2: internet med nylige fejl; 3: spærret. Standard 2"
"Trusted device lifetime. Days during which previously successful devices skip adaptive captchas, default 30": "Levetid for betroede enheder. Antal dage, hvor tidligere vellykkede enheder springer adaptive captchaer over, standard 30"
"Enable MFA. Allows users to enable TOTP multi-factor authentication; an enhanced feature, default false": "Aktivér MFA. Giver brugere mulighed for at aktivere TOTP-baseret multifaktorgodkendelse; en udvidet funktion, standard false"
"File storage serving. Responds to file download requests from other nodes, default true": "Betjening af fillager. Svarer på downloadanmodninger fra andre noder, standard true"
"File storage fetch. Pulls new files published by other nodes, default true": "Hentning fra fillager. Henter nye filer, som andre noder publicerer, standard true"
"File fetch timeout. Maximum milliseconds to wait for other nodes when a file is missing locally, default 5000": "Tidsgrænse for filhentning. Maksimalt antal millisekunder at vente på andre noder, når en fil mangler lokalt, standard 5000"
"Attachment storage. Local disk, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu or EasyIO; default Local": "Lagring af vedhæftede filer. Lokal disk, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu eller EasyIO; standard Local"
"Object storage server. S3-compatible endpoint for OSS/COS/Qiniu, such as oss-cn-beijing.aliyuncs.com": "Server til objektlager. S3-kompatibelt endepunkt for OSS/COS/Qiniu, f.eks. oss-cn-beijing.aliyuncs.com"
"Object storage bucket. Bucket name for OSS/COS/Qiniu": "Bucket til objektlager. Bucketnavn for OSS/COS/Qiniu"
"Object storage region. S3 signing scope, such as cn-beijing / ap-beijing / cn-east-1": "Region for objektlager. Omfang for S3-signering, f.eks. cn-beijing / ap-beijing / cn-east-1"
"Object storage app ID. AccessKeyId": "App-id til objektlager. AccessKeyId"
"Object storage app secret. AccessKeySecret": "App-hemmelighed til objektlager. AccessKeySecret"
"Data retention. Days to keep audit and OAuth logs, default 30": "Dataopbevaring. Antal dage revisions- og OAuth-logfiler opbevares, standard 30"
"File retention. Days to keep backup files, default 15": "Filopbevaring. Antal dage sikkerhedskopifiler opbevares, standard 15"
"Retention size floor. Files smaller than this (KB) are never deleted even after the retention period, default 1024K": "Mindste størrelse for opbevaring. Filer mindre end dette (KB) slettes aldrig, heller ikke efter opbevaringsperioden, standard 1024K"
"Maximum export rows. Maximum rows a page may export, default 10_000_000": "Maksimalt antal eksportrækker. Maksimalt antal rækker, en side må eksportere, standard 10_000_000"
"Maximum backup rows. Maximum rows a page may back up, default 10_000_000": "Maksimalt antal sikkerhedskopirækker. Maksimalt antal rækker, en side må sikkerhedskopiere, standard 10_000_000"
"API prefixes. Comma- or semicolon-separated prefixes such as /api,/api/v1; matching requests are forwarded to the real route without the prefix": "API-præfikser. Komma- eller semikolonseparerede præfikser som /api,/api/v1; matchende anmodninger videresendes til den rigtige rute uden præfikset"
"Password strength. * means unrestricted; by default at least 8 characters with digits, upper/lower case letters and symbols. Simple form: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$": "Adgangskodestyrke. * betyder ubegrænset; som standard mindst 8 tegn med cifre, store/små bogstaver og symboler. Enkel form: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$"
"Cookie mode. Default SameSite mode for token cookies (-1 Unspecified, 0 None, 1 Lax, 2 Strict)": "Cookietilstand. Standard SameSite-tilstand for tokencookies (-1 Unspecified, 0 None, 1 Lax, 2 Strict)"
"Cookie domain. Writes cookies to a parent domain; empty uses the current domain. A top-level domain requires HTTPS and prevents plain HTTP from writing same-name keys on the local domain": "Cookiedomæne. Skriver cookies til et overordnet domæne; tom bruger det aktuelle domæne. Et topdomæne kræver HTTPS og forhindrer almindelig HTTP i at skrive nøgler med samme navn på det lokale domæne"
"Activation URL. Front-end activation page URL used in email activation links, such as https://xxx/activate; empty builds /activate from the request host": "Aktiverings-URL. URL til frontendens aktiveringsside, der bruges i aktiveringslinks i e-mails, f.eks. https://xxx/activate; tom bygger /activate ud fra anmodningens vært"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default false": "Gem token i cookie. Læser token fra cookien, når anmodningsheaderen ikke indeholder en, standard false"
"Password strength. * means unrestricted; the simple form defaults to 5 to 32 characters of any type. The full form requires at least 8 characters with digits, upper/lower case letters and symbols: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$": "Adgangskodestyrke. * betyder ubegrænset; den enkle form tillader som standard 5 til 32 tegn af enhver type. Den fulde form kræver mindst 8 tegn med cifre, store/små bogstaver og symboler: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$"
