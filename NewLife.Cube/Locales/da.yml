"Generated {0} configuration field values (skipped {1}, failed {2}) and filled them into the form. Ask the user to review before submitting.": "{0} konfigurationsfeltværdier blev genereret ({1} sprunget over, {2} mislykkedes) og udfyldt i formularen. Bed brugeren gennemgå indholdet, før det indsendes."
"The current page is a system configuration form (such as Cube settings); you can help review and fill in configuration items.": "Den aktuelle side er en formular til systemkonfiguration (for eksempel Cube-indstillinger); du kan hjælpe med at gennemgå og udfylde konfigurationselementer."
"Available tools: get_form_schema / fill_form / get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "Tilgængelige værktøjer: get_form_schema / fill_form / get_page_context / get_system_info / run_js (se funktionsdefinitionerne; kald dem, når det er nødvendigt)"
"2. When the user asks to create, fill in or complete configuration, call get_form_schema first to inspect the items, then call fill_form to generate values (invent reasonable values for empty writable fields, keep existing values unless the user asks otherwise, and never fabricate or modify sensitive settings such as ApiKey/Secret/Token); finally ask the user to review before submitting": "2. Når brugeren beder om at oprette, udfylde eller færdiggøre konfiguration, kald først get_form_schema for at gennemgå elementerne og derefter fill_form for at generere værdier (find på rimelige værdier til tomme redigerbare felter, bevar eksisterende værdier, medmindre brugeren beder om andet, og opfind eller ændr aldrig følsomme indstillinger som ApiKey/Secret/Token); bed derefter brugeren gennemgå indholdet, før det indsendes"
"3. When the user asks about the content or current state of the page, call get_page_context, then give your analysis and conclusion": "3. Når brugeren spørger om sidens indhold eller aktuelle tilstand, kald get_page_context, og giv derefter din analyse og konklusion"
"4. When the user asks about system status or diagnostics, call get_system_info": "4. Når brugeren spørger om systemstatus eller diagnosticering, kald get_system_info"
"5. When the user asks to read or operate page elements, you may call run_js; explain any write operation (changing page content, submitting forms) to the user before running it": "5. Når brugeren beder om at læse eller betjene sideelementer, må du kalde run_js; forklar enhver skrivehandling (ændring af sideindhold, indsendelse af formularer) for brugeren, før den køres"
"6. Never invent data; ask the user for clarification when information is insufficient": "6. Opfind aldrig data; spørg brugeren om præcisering, når oplysningerne er utilstrækkelige"
"The tenant identifier carried by user [{0}] is invalid or unavailable. Check the tenant settings and try again.": "Tenant-id'et, som brugeren [{0}] medbringer, er ugyldigt eller utilgængeligt. Kontroller tenantindstillingerne, og prøv igen."
"User [{0}] did not carry a tenant identifier, so the tenant cannot be determined. Include the tenant information and try again.": "Brugeren [{0}] medbragte ikke et tenant-id, så tenanten kan ikke fastslås. Medtag tenantoplysningerne, og prøv igen."
"User [{0}] is not allowed to access the data of the current tenant. Switch tenant and try again.": "Brugeren [{0}] har ikke tilladelse til at få adgang til data for den aktuelle tenant. Skift tenant, og prøv igen."
