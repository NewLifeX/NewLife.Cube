"Data:": "Data:"
"You are a system operations expert. Based on the following runtime metrics, produce a health diagnosis report:\nCover bottlenecks, whether capacity should be expanded, and any risks worth attention.\nOutput the diagnosis report directly without extra explanation.": "Du er ekspert i systemdrift. Lav en sundhedsdiagnoserapport på baggrund af følgende kørselstal:\nBehandl flaskehalse, om kapaciteten bør udvides, og hvilke risici der er værd at være opmærksom på.\nSkriv diagnoserapporten direkte uden yderligere forklaring."
"Script must not be empty": "Scriptet må ikke være tomt"
"Browser channel is not ready (Writer not injected)": "Browserkanalen er ikke klar (Writer er ikke injiceret)"
"Run page script": "Kør sidescript"
"Runs JavaScript in the current page and returns the result; can read or modify page elements, for example document.title or document.querySelector('input[name=Name]').value": "Kører JavaScript på den aktuelle side og returnerer resultatet; kan læse eller ændre sideelementer, for eksempel document.title eller document.querySelector('input[name=Name]').value"
"JavaScript code to run in the current page": "JavaScript-kode, der skal køres på den aktuelle side"
"Get page context": "Hent sidekontekst"
"Gets the main data and structure of the current page (title, tables, forms and so on). Uses the server-side context when the page provides one; otherwise collects the page content from the user's browser": "Henter hoveddata og struktur for den aktuelle side (titel, tabeller, formularer og så videre). Bruger konteksten på serversiden, når siden tilbyder den; indsamler ellers sideindholdet fra brugerens browser"
"Get form schema": "Hent formularskema"
"Gets the schema of the current form, including field names, types, descriptions and current values, for generating form values": "Henter skemaet for den aktuelle formular, inklusive feltnavne, typer, beskrivelser og aktuelle værdier, til at generere formularværdier"
"Form mode: add or edit": "Formulartilstand: tilføj eller rediger"
"Fill form": "Udfyld formular"
"Generates form field values and fills them into the front-end form. Nothing is written to the database until the user confirms": "Genererer værdier til formularfelter og udfylder dem i formularen i frontend. Der skrives intet til databasen, før brugeren bekræfter"
"Field values as a JSON string, keyed by field name": "Feltværdier som en JSON-streng med feltnavn som nøgle"
"No valid field value dictionary was received": "Der blev ikke modtaget et gyldigt sæt feltværdier"
"[fill_form invalid argument] No valid field value dictionary was received. Call get_form_schema first to get the field structure, then pass the values parameter as {\"field\":value}.": "[fill_form ugyldigt argument] Der blev ikke modtaget et gyldigt sæt feltværdier. Kald først get_form_schema for at hente feltstrukturen, og send derefter parameteren values som {\"field\":value}."
