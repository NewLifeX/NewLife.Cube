"5. When the user asks to read or operate page elements, you may call run_js; explain any write operation (changing page content, submitting forms) to the user before running it": "5. Gdy użytkownik prosi o odczytanie lub obsługę elementów strony, możesz wywołać run_js; każdą operację zapisu (zmianę zawartości strony, wysłanie formularza) wyjaśnij użytkownikowi przed uruchomieniem"
"6. Never invent data; ask the user for clarification when information is insufficient": "6. Nigdy nie wymyślaj danych; gdy informacje są niewystarczające, poproś użytkownika o doprecyzowanie"
