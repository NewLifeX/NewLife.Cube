"Cube Web API library of the NewLife framework: entity controllers, permission and menu management, field metadata, OAuth server, JWT authentication and runtime localization. Built for front-end/back-end separation with Vue, Blazor and Ant Design front ends, validated with 10 billion rows in a single table.": "Biblioteka Web API Cube frameworka NewLife: kontrolery encji, zarządzanie uprawnieniami i menu, metadane pól, serwer OAuth, uwierzytelnianie JWT i lokalizacja w czasie działania. Stworzona dla architektury z rozdzielonym frontendem i backendem, współpracująca z Vue, Blazor i Ant Design, zweryfikowana na 10 miliardach wierszy w jednej tabeli."
