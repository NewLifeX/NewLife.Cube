"Iframe embedding. Empty allows the same domain only; SAMEORIGIN allows the same domain and port; ALLOWALL allows any domain": "Osadzanie w ramce iframe. Puste zezwala tylko na tę samą domenę; SAMEORIGIN zezwala na tę samą domenę i port; ALLOWALL zezwala na dowolną domenę"
"Share expiration. Lifetime of share tokens in seconds, default 7200": "Wygaśnięcie udostępniania. Czas życia tokenów udostępniania w sekundach, domyślnie 7200"
"Bot error code. Returns this error for crawlers, such as 404/500; 0 disables blocking": "Kod błędu dla botów. Zwraca ten błąd robotom indeksującym, np. 404/500; 0 wyłącza blokowanie"
"Force redirect. Target scheme and host for GET requests; * is supported in the host. Commonly used to force HTTPS, such as https://*:8081": "Wymuszone przekierowanie. Docelowy schemat i host dla żądań GET; w hoście obsługiwany jest *. Często używane do wymuszenia HTTPS, np. https://*:8081"
"Security mode. 0: off; 1: observe and log only; 2: block; 3: automatic (default; observes, bans repeated attackers, and temporarily blocks broad attacks with automatic rollback)": "Tryb bezpieczeństwa. 0: wyłączony; 1: tylko obserwacja i rejestrowanie; 2: blokowanie; 3: automatyczny (domyślny; obserwuje, blokuje powtarzających się atakujących i tymczasowo blokuje szerokie ataki z automatycznym wycofaniem)"
"Auto-ban durations. Comma-separated seconds that increase with each trigger; empty uses 60,300,1800,7200,86400": "Czasy automatycznej blokady. Sekundy oddzielone przecinkami, rosnące przy każdym wyzwoleniu; puste używa wartości 60,300,1800,7200,86400"
"Trusted proxies. Forwarded headers are only trusted from these comma-separated IPs or CIDR ranges; empty keeps the legacy behavior of trusting all forwarded headers": "Zaufane serwery proxy. Przekazywane nagłówki są akceptowane tylko z tych adresów IP lub zakresów CIDR oddzielonych przecinkami; puste zachowuje stare zachowanie polegające na zaufaniu wszystkim przekazywanym nagłówkom"
"Trusted proxy learning limit. When no trusted proxies are configured, private direct sources that send forwarded headers are learned up to this count; 0 disables learning (typically 2 for one data center, 4 for two)": "Limit uczenia zaufanych serwerów proxy. Gdy nie skonfigurowano zaufanych serwerów proxy, prywatne bezpośrednie źródła wysyłające przekazywane nagłówki są uczone do tej liczby; 0 wyłącza uczenie (zwykle 2 dla jednego centrum danych, 4 dla dwóch)"
"Learned proxies. Maintained automatically; clear it to reset the learned list": "Wyuczone serwery proxy. Utrzymywane automatycznie; wyczyść tę wartość, aby zresetować wyuczoną listę"
"Default role. Defaults to the Normal User role": "Rola domyślna. Domyślnie rola zwykłego użytkownika"
"Allow password sign-in. Allows signing in with a username and password": "Zezwalaj na logowanie hasłem. Umożliwia logowanie nazwą użytkownika i hasłem"
"Allow plain-text passwords. Default true for legacy clients; false forces Challenge-Response encrypted passwords": "Zezwalaj na hasła w postaci zwykłego tekstu. Domyślnie true dla starszych klientów; false wymusza hasła szyfrowane metodą Challenge-Response"
"Allow registration. Allows registering with a username and password": "Zezwalaj na rejestrację. Umożliwia rejestrację nazwą użytkownika i hasłem"
"Auto registration. Default true; after SSO sign-in an unknown local user is registered automatically. Enabled when either the global or the OAuth app setting is on": "Automatyczna rejestracja. Domyślnie true; po zalogowaniu przez SSO nieznany użytkownik lokalny jest rejestrowany automatycznie. Włączone, gdy włączone jest ustawienie globalne lub ustawienie aplikacji OAuth"
"Password complexity check. When enabled the sign-in page validates password strength; when disabled it only requires a non-empty password. Default true": "Sprawdzanie złożoności hasła. Po włączeniu strona logowania weryfikuje siłę hasła; po wyłączeniu wymagane jest tylko niepuste hasło. Domyślnie true"
"Login failure limit. Bans sign-in after this many consecutive failures for the same user or IP, default 5": "Limit nieudanych logowań. Blokuje logowanie po tej liczbie kolejnych niepowodzeń dla tego samego użytkownika lub adresu IP, domyślnie 5"
"Login ban duration. Seconds a risk-control ban lasts, default 300": "Czas blokady logowania. Liczba sekund trwania blokady kontroli ryzyka, domyślnie 300"
"Class C subnet ban threshold. Bans a /24 subnet such as 103.125.146.* after this many failures, default 10; 0 disables": "Próg blokady podsieci klasy C. Blokuje podsieć /24, np. 103.125.146.*, po tej liczbie niepowodzeń, domyślnie 10; 0 wyłącza"
"Class B subnet ban threshold. Bans a /16 subnet such as 103.125.*.* after this many failures, default 20; 0 disables": "Próg blokady podsieci klasy B. Blokuje podsieć /16, np. 103.125.*.*, po tej liczbie niepowodzeń, domyślnie 20; 0 wyłącza"
"Force bind by user name. Binds SSO users to local users with the same name without a provider prefix; intended for user centers": "Wymuś powiązanie według nazwy użytkownika. Wiąże użytkowników SSO z lokalnymi użytkownikami o tej samej nazwie bez prefiksu dostawcy; przeznaczone dla centrów użytkowników"
"Bind by user code. Binds SSO users to local users by user code": "Powiąż według kodu użytkownika. Wiąże użytkowników SSO z lokalnymi użytkownikami według kodu użytkownika"
"Bind by mobile. Binds SSO users to local users by mobile number": "Powiąż według telefonu. Wiąże użytkowników SSO z lokalnymi użytkownikami według numeru telefonu"
"Bind by email. Binds SSO users to local users by email": "Powiąż według adresu e-mail. Wiąże użytkowników SSO z lokalnymi użytkownikami według adresu e-mail"
"Bind by nickname. Binds SSO users to local users by nickname; suitable for internal SSO, not for social networks with many duplicate names": "Powiąż według pseudonimu. Wiąże użytkowników SSO z lokalnymi użytkownikami według pseudonimu; odpowiednie dla wewnętrznego SSO, nie dla sieci społecznościowych z wieloma powtarzającymi się nazwami"
"Use SSO roles. Keeps SSO roles after sign-in, default true; otherwise DefaultRole is used": "Używaj ról SSO. Zachowuje role SSO po zalogowaniu, domyślnie true; w przeciwnym razie używana jest DefaultRole"
"Use SSO departments. Keeps SSO departments after sign-in, default true": "Używaj działów SSO. Zachowuje działy SSO po zalogowaniu, domyślnie true"
"SSO role rules. Automatically upgrades the primary role after SSO sign-in; separate rules with commas. Format: source role+department wildcard=target role, for example Guest+Route*=Route Specialist": "Reguły ról SSO. Automatycznie podnosi rolę główną po zalogowaniu przez SSO; reguły oddzielaj przecinkami. Format: rola źródłowa+dział z symbolem wieloznacznym=rola docelowa, na przykład Guest+Route*=Route Specialist"
"Sign out everywhere. false signs out of this site only; true (default) also signs out of the SSO server": "Wyloguj wszędzie. false wylogowuje tylko z tej witryny; true (domyślnie) wylogowuje również z serwera SSO"
"Allow multi-device sign-in. false kicks old devices on a new sign-in and revokes all tokens on sign-out; true (default) revokes only the current session": "Zezwalaj na logowanie na wielu urządzeniach. false wyłącza stare urządzenia przy nowym logowaniu i odwołuje wszystkie tokeny przy wylogowaniu; true (domyślnie) odwołuje tylko bieżącą sesję"
"Session timeout. Session lifetime after SSO sign-in during which the cookie can sign in again; default 0s": "Limit czasu sesji. Czas życia sesji po zalogowaniu przez SSO, podczas którego plik cookie może zalogować ponownie; domyślnie 0 s"
"Token sliding refresh threshold. Refreshes the JWT and rewrites the cookie when its remaining lifetime falls below this many seconds; 0 disables sliding expiration": "Próg przesuwnego odświeżania tokenu. Odświeża JWT i przepisuje plik cookie, gdy pozostały czas życia spadnie poniżej tej liczby sekund; 0 wyłącza przesuwne wygasanie"
"User refresh period. Fetches user information once per period across SSO sign-ins, default 600 seconds": "Okres odświeżania użytkownika. Pobiera informacje o użytkowniku raz na okres między logowaniami SSO, domyślnie 600 sekund"
"JWT secret. Algorithm and key used to sign JWTs, such as HS256:ABCD1234": "Sekret JWT. Algorytm i klucz używane do podpisywania JWT, np. HS256:ABCD1234"
"Token lifetime. Lifetime of the access token in seconds, default 7200": "Czas życia tokenu. Czas życia tokenu dostępu w sekundach, domyślnie 7200"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default true": "Przechowuj token w pliku cookie. Odczytuje token z pliku cookie, gdy nagłówek żądania go nie zawiera, domyślnie true"
"Validate attachment access. Requires sign-in to access attachments, default true": "Weryfikuj dostęp do załączników. Wymaga zalogowania do dostępu do załączników, domyślnie true"
"Public attachment categories. Categories accessible without sign-in, comma-separated, such as markdown,avatar. Applies when ValidateAttachment is true": "Publiczne kategorie załączników. Kategorie dostępne bez logowania, oddzielone przecinkami, np. markdown,avatar. Ma zastosowanie, gdy ValidateAttachment ma wartość true"
"Private attachment categories. Categories only the uploader can access, comma-separated. Applies when ValidateAttachment is true": "Prywatne kategorie załączników. Kategorie dostępne tylko dla przesyłającego, oddzielone przecinkami. Ma zastosowanie, gdy ValidateAttachment ma wartość true"
"SSO redirect allowlist. Domains allowed to receive the JWT after sign-in, comma-separated with wildcard prefixes such as *.company.com. Empty allows the same site only; other origins are rejected and sent back to the home page": "Biała lista przekierowań SSO. Domeny, którym wolno otrzymać JWT po zalogowaniu, oddzielone przecinkami, z prefiksami wieloznacznymi takimi jak *.company.com. Puste zezwala tylko na tę samą witrynę; inne źródła są odrzucane i odsyłane na stronę główną"
"External authentication URL. When local authentication fails, credentials are verified by this endpoint; on success the local user is created or updated and signed in": "Zewnętrzny adres URL uwierzytelniania. Gdy uwierzytelnianie lokalne nie powiedzie się, poświadczenia są weryfikowane przez ten punkt końcowy; po powodzeniu użytkownik lokalny jest tworzony lub aktualizowany i logowany"
"Start page. First content page opened after entering the admin console": "Strona startowa. Pierwsza strona zawartości otwierana po wejściu do konsoli administracyjnej"
"Theme. Content page theme, ACE/layui": "Motyw. Motyw strony zawartości, ACE/layui"
"Skin. Outer frame layout, ACE/layui": "Skórka. Układ zewnętrznej ramki, ACE/layui"
"Login tip. Empty hides the tip on the sign-in page": "Podpowiedź logowania. Puste ukrywa podpowiedź na stronie logowania"
"Login logo. Empty uses the default logo": "Logo logowania. Puste używa domyślnego logo"
"Login background. Image URL; empty uses the default background": "Tło logowania. Adres URL obrazu; puste używa domyślnego tła"
"Form group layout. 3/2/1 columns on large/medium/small screens, form-group col-xs-12 col-sm-6 col-lg-4": "Układ grup formularza. 3/2/1 kolumny na dużych/średnich/małych ekranach, form-group col-xs-12 col-sm-6 col-lg-4"
"Bootstrap select. Nicer drop-downs with a rendering cost": "Bootstrap select. Ładniejsze listy rozwijane kosztem wydajności renderowania"
"Maximum drop-down items. Maximum options in a related drop-down on forms, default 50; larger lists fall back to a text box": "Maksymalna liczba elementów listy rozwijanej. Maksymalna liczba opcji w powiązanej liście rozwijanej formularzy, domyślnie 50; większe listy są zastępowane polem tekstowym"
"Copyright. Empty hides the copyright; variables now/runtime/framework are supported, and now accepts formats such as {now:yyyy}": "Prawa autorskie. Puste ukrywa informację o prawach autorskich; obsługiwane są zmienne now/runtime/framework, a zmienna now akceptuje formaty takie jak {now:yyyy}"
"Filing number. Empty hides the filing information": "Numer rejestracyjny. Puste ukrywa informacje o rejestracji witryny"
"Enable new UI": "Włącz nowy interfejs"
"ECharts theme. Chart theme": "Motyw ECharts. Motyw wykresów"
"Title suffix. Appends the system name to page titles, default true": "Sufiks tytułu. Dołącza nazwę systemu do tytułów stron, domyślnie true"
"Table double-click. Enables row double-click on list pages, default true": "Dwukrotne kliknięcie w tabeli. Włącza dwukrotne kliknięcie wiersza na stronach list, domyślnie true"
"Table style. Light: minimal thin lines; Standard: clear row lines (default); Grid: full cell borders": "Styl tabeli. Lekki: minimalne cienkie linie; Standardowy: wyraźne linie wierszy (domyślnie); Siatka: pełne obramowania komórek"
"Table density. Compact: dense and information-rich (default); Normal: relaxed": "Gęstość tabeli. Kompaktowa: gęsta i bogata w informacje (domyślnie); Normalna: luźna"
"Stardust web. Stardust console URL; supports direct links to /trace?id={traceId} or /graph?id={traceId}": "Stardust web. Adres URL konsoli Stardust; obsługuje bezpośrednie linki do /trace?id={traceId} lub /graph?id={traceId}"
"AI master switch. Enables AI features such as log analysis and notification polishing, default false": "Główny przełącznik AI. Włącza funkcje AI, takie jak analiza dzienników i redagowanie powiadomień, domyślnie false"
"AI provider. Supports NewLife, Ollama, DeepSeek, DashScope, OpenAI and others; default NewLife": "Dostawca AI. Obsługuje NewLife, Ollama, DeepSeek, DashScope, OpenAI i innych; domyślnie NewLife"
"AI endpoint. Defaults to https://ai.newlifex.com for NewLife": "Punkt końcowy AI. Domyślnie https://ai.newlifex.com dla NewLife"
"AI ApiKey. Defaults to sk-CubeAI2026 for NewLife": "Klucz API AI. Domyślnie sk-CubeAI2026 dla NewLife"
"AI default model. Defaults to newlife-flash for NewLife": "Domyślny model AI. Domyślnie newlife-flash dla NewLife"
"AI default deep reasoning. Enables think mode for analysis and chat by default; false means fast responses": "Domyślne głębokie wnioskowanie AI. Domyślnie włącza tryb myślenia dla analizy i czatu; false oznacza szybkie odpowiedzi"
"AI color scheme. Fills the primary and secondary colors from a preset": "Schemat kolorów AI. Wypełnia kolory główny i dodatkowy na podstawie ustawienia wstępnego"
"AI primary color. Main color of the launcher, panel header and user bubbles; default NewLife green #2ecc71": "Kolor główny AI. Główny kolor przycisku uruchamiania, nagłówka panelu i dymków użytkownika; domyślnie zieleń NewLife #2ecc71"
"AI secondary color. Gradient end color, default dark green #1e8e3e": "Kolor dodatkowy AI. Kolor końcowy gradientu, domyślnie ciemna zieleń #1e8e3e"
"OAuth server. Enables the OAuth 2.0 server that provides SSO for other applications": "Serwer OAuth. Włącza serwer OAuth 2.0, który zapewnia SSO innym aplikacjom"
"File manager. Enables backend file management (browse, upload, download, delete); this carries security risks": "Menedżer plików. Włącza zarządzanie plikami w zapleczu (przeglądanie, przesyłanie, pobieranie, usuwanie); wiąże się to z ryzykiem bezpieczeństwa"
"Multi-tenancy. Enables tenants; tenant mode cannot access system administration and platform mode cannot access tenant pages": "Wielodostęp. Włącza najemców; tryb najemcy nie ma dostępu do administracji systemu, a tryb platformy nie ma dostępu do stron najemcy"
"Tenant query policy. DenyWithEmpty: return an empty set without tenant context; ThrowOnMissingTenant: throw an explicit error": "Zasada zapytań najemcy. DenyWithEmpty: zwraca pusty zbiór bez kontekstu najemcy; ThrowOnMissingTenant: zgłasza jawny błąd"
"User online. 0: do not record; 1: signed-in users only; 2: all visitors (default)": "Użytkownicy online. 0: nie rejestruj; 1: tylko zalogowani użytkownicy; 2: wszyscy odwiedzający (domyślnie)"
"User statistics. Records user visits, default true": "Statystyki użytkowników. Rejestruje odwiedziny użytkowników, domyślnie true"
"Enable SMS. SMS verification codes and system notifications, default false": "Włącz SMS. Kody weryfikacyjne SMS i powiadomienia systemowe, domyślnie false"
"Enable email. Email verification codes and system notifications, default false": "Włącz e-mail. Kody weryfikacyjne e-mail i powiadomienia systemowe, domyślnie false"
"Require email verification. Users must activate their email before signing in and must provide one when registering, default false": "Wymagaj weryfikacji e-mail. Użytkownicy muszą aktywować adres e-mail przed zalogowaniem i muszą go podać przy rejestracji, domyślnie false"
"Require mobile verification. Users must activate their mobile before signing in and must provide one when registering, default false": "Wymagaj weryfikacji telefonu. Użytkownicy muszą aktywować telefon przed zalogowaniem i muszą go podać przy rejestracji, domyślnie false"
"Captcha scenarios. Bit mask: 0: off; 1: sign-in; 2: registration; 4: verification code requests (anti-SMS-bombing); combine with 3 for sign-in and registration. Mandatory scenarios are never exempted, default 0": "Scenariusze captcha. Maska bitowa: 0: wyłączone; 1: logowanie; 2: rejestracja; 4: żądania kodu weryfikacyjnego (ochrona przed SMS-bombingiem); połącz z 3 dla logowania i rejestracji. Scenariusze obowiązkowe nigdy nie są zwolnione, domyślnie 0"
"Risk-adaptive captcha. Disabled when CaptchaScene is 0; when enabled it detects unsafe environments and requires a captcha, default true": "Captcha adaptacyjna do ryzyka. Wyłączona, gdy CaptchaScene wynosi 0; po włączeniu wykrywa niebezpieczne środowiska i wymaga captcha, domyślnie true"
"Captcha risk threshold. Requires a captcha when the risk score reaches this value: 0: intranet; 1: internet; 2: internet with recent failures; 3: banned. Default 2": "Próg ryzyka captcha. Wymaga captcha, gdy wynik ryzyka osiągnie tę wartość: 0: intranet; 1: internet; 2: internet z niedawnymi niepowodzeniami; 3: blokada. Domyślnie 2"
"Trusted device lifetime. Days during which previously successful devices skip adaptive captchas, default 30": "Czas życia zaufanego urządzenia. Liczba dni, przez które wcześniej zweryfikowane pomyślnie urządzenia pomijają adaptacyjne captcha, domyślnie 30"
"Enable MFA. Allows users to enable TOTP multi-factor authentication; an enhanced feature, default false": "Włącz MFA. Pozwala użytkownikom włączyć uwierzytelnianie wieloskładnikowe TOTP; funkcja rozszerzona, domyślnie false"
"File storage serving. Responds to file download requests from other nodes, default true": "Udostępnianie magazynu plików. Odpowiada na żądania pobrania plików od innych węzłów, domyślnie true"
"File storage fetch. Pulls new files published by other nodes, default true": "Pobieranie z magazynu plików. Pobiera nowe pliki opublikowane przez inne węzły, domyślnie true"
"File fetch timeout. Maximum milliseconds to wait for other nodes when a file is missing locally, default 5000": "Limit czasu pobierania plików. Maksymalna liczba milisekund oczekiwania na inne węzły, gdy plik nie istnieje lokalnie, domyślnie 5000"
"Attachment storage. Local disk, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu or EasyIO; default Local": "Magazyn załączników. Dysk lokalny, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu lub EasyIO; domyślnie Local"
"Object storage server. S3-compatible endpoint for OSS/COS/Qiniu, such as oss-cn-beijing.aliyuncs.com": "Serwer magazynu obiektów. Punkt końcowy zgodny z S3 dla OSS/COS/Qiniu, np. oss-cn-beijing.aliyuncs.com"
"Object storage bucket. Bucket name for OSS/COS/Qiniu": "Zasobnik magazynu obiektów. Nazwa zasobnika dla OSS/COS/Qiniu"
"Object storage region. S3 signing scope, such as cn-beijing / ap-beijing / cn-east-1": "Region magazynu obiektów. Zakres podpisywania S3, np. cn-beijing / ap-beijing / cn-east-1"
"Object storage app ID. AccessKeyId": "Identyfikator aplikacji magazynu obiektów. AccessKeyId"
"Object storage app secret. AccessKeySecret": "Klucz tajny aplikacji magazynu obiektów. AccessKeySecret"
"Data retention. Days to keep audit and OAuth logs, default 30": "Przechowywanie danych. Liczba dni przechowywania dzienników audytu i OAuth, domyślnie 30"
"File retention. Days to keep backup files, default 15": "Przechowywanie plików. Liczba dni przechowywania plików kopii zapasowych, domyślnie 15"
"Retention size floor. Files smaller than this (KB) are never deleted even after the retention period, default 1024K": "Minimalny rozmiar objęty przechowywaniem. Pliki mniejsze niż ta wartość (KB) nigdy nie są usuwane, nawet po upływie okresu przechowywania, domyślnie 1024K"
"Maximum export rows. Maximum rows a page may export, default 10_000_000": "Maksymalna liczba wierszy eksportu. Maksymalna liczba wierszy, jaką może wyeksportować strona, domyślnie 10_000_000"
"Maximum backup rows. Maximum rows a page may back up, default 10_000_000": "Maksymalna liczba wierszy kopii zapasowej. Maksymalna liczba wierszy, których kopię zapasową może utworzyć strona, domyślnie 10_000_000"
"API prefixes. Comma- or semicolon-separated prefixes such as /api,/api/v1; matching requests are forwarded to the real route without the prefix": "Prefiksy API. Prefiksy oddzielone przecinkami lub średnikami, np. /api,/api/v1; pasujące żądania są przekazywane do rzeczywistej trasy bez prefiksu"
"Password strength. * means unrestricted; by default at least 8 characters with digits, upper/lower case letters and symbols. Simple form: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$": "Siła hasła. * oznacza brak ograniczeń; domyślnie co najmniej 8 znaków z cyframi, wielkimi i małymi literami oraz symbolami. Prosta postać: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$"
"Cookie mode. Default SameSite mode for token cookies (-1 Unspecified, 0 None, 1 Lax, 2 Strict)": "Tryb plików cookie. Domyślny tryb SameSite dla plików cookie tokenu (-1 Unspecified, 0 None, 1 Lax, 2 Strict)"
"Cookie domain. Writes cookies to a parent domain; empty uses the current domain. A top-level domain requires HTTPS and prevents plain HTTP from writing same-name keys on the local domain": "Domena plików cookie. Zapisuje pliki cookie w domenie nadrzędnej; puste używa bieżącej domeny. Domena najwyższego poziomu wymaga HTTPS i uniemożliwia zapis kluczy o tej samej nazwie w domenie lokalnej przez zwykły protokół HTTP"
"Activation URL. Front-end activation page URL used in email activation links, such as https://xxx/activate; empty builds /activate from the request host": "Adres URL aktywacji. Adres URL strony aktywacji w interfejsie użytkownika używany w linkach aktywacyjnych e-mail, np. https://xxx/activate; puste buduje /activate na podstawie hosta żądania"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default false": "Przechowuj token w pliku cookie. Odczytuje token z pliku cookie, gdy nagłówek żądania go nie zawiera, domyślnie false"
