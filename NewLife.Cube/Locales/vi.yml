"Generated {0} form field values (skipped {1}, failed {2}) and filled them into the form. Ask the user to review before submitting.": "Đã tạo {0} giá trị trường biểu mẫu (bỏ qua {1}, thất bại {2}) và điền vào biểu mẫu. Hãy đề nghị người dùng xem lại trước khi gửi."
" descending": " giảm dần"
