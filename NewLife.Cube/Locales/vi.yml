"Generated {0} configuration field values (skipped {1}, failed {2}) and filled them into the form. Ask the user to review before submitting.": "Đã tạo {0} giá trị trường cấu hình (bỏ qua {1}, thất bại {2}) và điền vào biểu mẫu. Hãy đề nghị người dùng xem lại trước khi gửi."
"The current page is a system configuration form (such as Cube settings); you can help review and fill in configuration items.": "Trang hiện tại là biểu mẫu cấu hình hệ thống (chẳng hạn cài đặt Cube); bạn có thể giúp xem lại và điền các mục cấu hình."
"Available tools: get_form_schema / fill_form / get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "Công cụ khả dụng: get_form_schema / fill_form / get_page_context / get_system_info / run_js (xem định nghĩa hàm; gọi khi cần)"
"2. When the user asks to create, fill in or complete configuration, call get_form_schema first to inspect the items, then call fill_form to generate values (invent reasonable values for empty writable fields, keep existing values unless the user asks otherwise, and never fabricate or modify sensitive settings such as ApiKey/Secret/Token); finally ask the user to review before submitting": "2. Khi người dùng yêu cầu tạo, điền hoặc hoàn thiện cấu hình, hãy gọi get_form_schema trước để xem các mục, rồi gọi fill_form để tạo giá trị (tự nghĩ giá trị hợp lý cho các trường trống có thể ghi, giữ nguyên giá trị hiện có trừ khi người dùng yêu cầu khác, và không bao giờ bịa hoặc sửa các cài đặt nhạy cảm như ApiKey/Secret/Token); cuối cùng đề nghị người dùng xem lại trước khi gửi"
"3. When the user asks about the content or current state of the page, call get_page_context, then give your analysis and conclusion": "3. Khi người dùng hỏi về nội dung hoặc trạng thái hiện tại của trang, hãy gọi get_page_context, rồi đưa ra phân tích và kết luận"
"4. When the user asks about system status or diagnostics, call get_system_info": "4. Khi người dùng hỏi về trạng thái hệ thống hoặc chẩn đoán, hãy gọi get_system_info"
"5. When the user asks to read or operate page elements, you may call run_js; explain any write operation (changing page content, submitting forms) to the user before running it": "5. Khi người dùng yêu cầu đọc hoặc thao tác phần tử trang, bạn có thể gọi run_js; hãy giải thích mọi thao tác ghi (thay đổi nội dung trang, gửi biểu mẫu) cho người dùng trước khi chạy"
"6. Never invent data; ask the user for clarification when information is insufficient": "6. Không bao giờ bịa đặt dữ liệu; hãy hỏi lại người dùng khi thông tin chưa đủ"
"The tenant identifier carried by user [{0}] is invalid or unavailable. Check the tenant settings and try again.": "Định danh đối tượng thuê do người dùng [{0}] gửi không hợp lệ hoặc không khả dụng. Hãy kiểm tra cài đặt đối tượng thuê và thử lại."
"User [{0}] did not carry a tenant identifier, so the tenant cannot be determined. Include the tenant information and try again.": "Người dùng [{0}] không gửi định danh đối tượng thuê nên không xác định được đối tượng thuê. Hãy kèm thông tin đối tượng thuê và thử lại."
"User [{0}] is not allowed to access the data of the current tenant. Switch tenant and try again.": "Người dùng [{0}] không được phép truy cập dữ liệu của đối tượng thuê hiện tại. Hãy chuyển đối tượng thuê và thử lại."
