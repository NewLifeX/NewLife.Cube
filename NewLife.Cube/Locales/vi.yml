"You are an information security expert. Based on the following security data, write a weekly security report covering:\n1. Overall security posture\n2. Risks that need attention\n3. Recommended security measures\n\nOutput the report directly without extra explanation.": "Bạn là chuyên gia an toàn thông tin. Dựa trên dữ liệu bảo mật sau, hãy viết báo cáo bảo mật hàng tuần gồm:\n1. Tình hình bảo mật tổng thể\n2. Những rủi ro cần lưu ý\n3. Các biện pháp bảo mật đề xuất\n\nXuất trực tiếp báo cáo, không giải thích thêm."
