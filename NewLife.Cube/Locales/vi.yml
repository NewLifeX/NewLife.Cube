"Gets the data context of the current page: the current record with its field metadata, or a summary and sample of the current query result, for analysis": "Lấy ngữ cảnh dữ liệu của trang hiện tại: bản ghi hiện tại kèm siêu dữ liệu trường, hoặc bản tóm tắt và mẫu của kết quả truy vấn hiện tại, để phân tích"
"Gets the form schema of the current entity, including field names, types, enum values, required flags, descriptions and existing values (edit mode), for generating form values": "Lấy lược đồ biểu mẫu của thực thể hiện tại, gồm tên trường, kiểu, giá trị enum, cờ bắt buộc, mô tả và giá trị hiện có (chế độ sửa), để tạo giá trị biểu mẫu"
"Field values as a JSON string, keyed by field name, for example {\"Name\":\"John\",\"Status\":1}": "Giá trị trường dưới dạng chuỗi JSON, khóa là tên trường, ví dụ {\"Name\":\"John\",\"Status\":1}"
