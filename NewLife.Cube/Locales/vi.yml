"JavaScript code to run in the current page": "Mã JavaScript để chạy trong trang hiện tại"
"Get page context": "Lấy ngữ cảnh trang"
"Gets the main data and structure of the current page (title, tables, forms and so on). Uses the server-side context when the page provides one; otherwise collects the page content from the user's browser": "Lấy dữ liệu và cấu trúc chính của trang hiện tại (tiêu đề, bảng, biểu mẫu, v.v.). Dùng ngữ cảnh phía máy chủ khi trang cung cấp; nếu không sẽ thu thập nội dung trang từ trình duyệt của người dùng"
"Get form schema": "Lấy lược đồ biểu mẫu"
"Gets the schema of the current form, including field names, types, descriptions and current values, for generating form values": "Lấy lược đồ của biểu mẫu hiện tại, gồm tên trường, kiểu, mô tả và giá trị hiện tại, để tạo giá trị biểu mẫu"
"Form mode: add or edit": "Chế độ biểu mẫu: thêm hoặc sửa"
"Fill form": "Điền biểu mẫu"
"Generates form field values and fills them into the front-end form. Nothing is written to the database until the user confirms": "Tạo giá trị trường biểu mẫu và điền vào biểu mẫu phía giao diện. Không có gì được ghi vào cơ sở dữ liệu cho đến khi người dùng xác nhận"
"Field values as a JSON string, keyed by field name": "Giá trị trường dưới dạng chuỗi JSON, khóa là tên trường"
