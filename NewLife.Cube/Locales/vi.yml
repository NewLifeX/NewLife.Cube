# 设置页字段、分类与导航（中文源文经英文规范键翻译）
"Auto (follow system)": "Tự động (theo hệ thống)"
"Cancel": "Hủy"
"Queries {0}, executes {1}, elapsed {2:n0} ms": "Truy vấn {0}, thực thi {1}, mất {2:n0} ms"
"Show run time": "Hiển thị thời gian chạy"
"Avatar directory. Downloads remote avatars locally; defaults to the Avatars subdirectory, or Avatars next to the web root. Empty disables downloading": "Thư mục ảnh đại diện. Tải ảnh đại diện từ xa về cục bộ; mặc định là thư mục con Avatars, hoặc Avatars bên cạnh thư mục gốc web. Để trống sẽ tắt tải xuống"
"Text avatar characters. Generates an SVG text avatar when no image exists; 1 to 3 characters. Uses the first N Chinese characters to keep the surname, or the initials of English words. Default 2": "Số ký tự ảnh đại diện dạng văn bản. Tạo ảnh đại diện văn bản SVG khi không có hình ảnh; từ 1 đến 3 ký tự. Dùng N ký tự Hán đầu tiên để giữ họ, hoặc chữ cái đầu của các từ tiếng Anh. Mặc định 2"
"Upload directory. Defaults to Uploads": "Thư mục tải lên. Mặc định là Uploads"
"Web root directory. Defaults to wwwroot": "Thư mục gốc web. Mặc định là wwwroot"
"Resource URL. CDN base such as https://sso.newlifex.com/content/; empty uses local resources": "URL tài nguyên. Địa chỉ gốc CDN, ví dụ https://sso.newlifex.com/content/; để trống sẽ dùng tài nguyên cục bộ"
"CORS origins. Other origins allowed to access this site; * allows any origin": "Nguồn CORS. Các nguồn khác được phép truy cập trang này; * cho phép mọi nguồn"
"Iframe embedding. Empty allows the same domain only; SAMEORIGIN allows the same domain and port; ALLOWALL allows any domain": "Nhúng Iframe. Để trống chỉ cho phép cùng miền; SAMEORIGIN cho phép cùng miền và cổng; ALLOWALL cho phép mọi miền"
"Share expiration. Lifetime of share tokens in seconds, default 7200": "Thời hạn chia sẻ. Thời gian sống của token chia sẻ tính bằng giây, mặc định 7200"
"Bot error code. Returns this error for crawlers, such as 404/500; 0 disables blocking": "Mã lỗi cho bot. Trả về lỗi này cho trình thu thập dữ liệu, ví dụ 404/500; 0 sẽ tắt chặn"
"Force redirect. Target scheme and host for GET requests; * is supported in the host. Commonly used to force HTTPS, such as https://*:8081": "Buộc chuyển hướng. Lược đồ và máy chủ đích cho yêu cầu GET; hỗ trợ * trong máy chủ. Thường dùng để buộc HTTPS, ví dụ https://*:8081"
"Security mode. 0: off; 1: observe and log only; 2: block; 3: automatic (default; observes, bans repeated attackers, and temporarily blocks broad attacks with automatic rollback)": "Chế độ bảo mật. 0: tắt; 1: chỉ quan sát và ghi nhật ký; 2: chặn; 3: tự động (mặc định; quan sát, cấm kẻ tấn công lặp lại và tạm thời chặn các cuộc tấn công diện rộng kèm tự động hoàn tác)"
"Auto-ban durations. Comma-separated seconds that increase with each trigger; empty uses 60,300,1800,7200,86400": "Thời hạn cấm tự động. Số giây phân tách bằng dấu phẩy, tăng dần sau mỗi lần kích hoạt; để trống sẽ dùng 60,300,1800,7200,86400"
"Trusted proxies. Forwarded headers are only trusted from these comma-separated IPs or CIDR ranges; empty keeps the legacy behavior of trusting all forwarded headers": "Proxy tin cậy. Chỉ tin cậy các tiêu đề chuyển tiếp từ các IP hoặc dải CIDR phân tách bằng dấu phẩy này; để trống sẽ giữ hành vi cũ là tin cậy mọi tiêu đề chuyển tiếp"
"Trusted proxy learning limit. When no trusted proxies are configured, private direct sources that send forwarded headers are learned up to this count; 0 disables learning (typically 2 for one data center, 4 for two)": "Giới hạn học proxy tin cậy. Khi chưa cấu hình proxy tin cậy, các nguồn trực tiếp riêng tư gửi tiêu đề chuyển tiếp sẽ được học tối đa đến số lượng này; 0 sẽ tắt việc học (thường là 2 cho một trung tâm dữ liệu, 4 cho hai trung tâm)"
"Learned proxies. Maintained automatically; clear it to reset the learned list": "Proxy đã học. Được duy trì tự động; xóa để đặt lại danh sách đã học"
"Default role. Defaults to the Normal User role": "Vai trò mặc định. Mặc định là vai trò Người dùng thường"
"Allow password sign-in. Allows signing in with a username and password": "Cho phép đăng nhập bằng mật khẩu. Cho phép đăng nhập bằng tên người dùng và mật khẩu"
"Allow plain-text passwords. Default true for legacy clients; false forces Challenge-Response encrypted passwords": "Cho phép mật khẩu dạng văn bản thuần. Mặc định true cho ứng dụng khách cũ; false buộc dùng mật khẩu mã hóa Challenge-Response"
"Allow registration. Allows registering with a username and password": "Cho phép đăng ký. Cho phép đăng ký bằng tên người dùng và mật khẩu"
"Auto registration. Default true; after SSO sign-in an unknown local user is registered automatically. Enabled when either the global or the OAuth app setting is on": "Tự động đăng ký. Mặc định true; sau khi đăng nhập SSO, người dùng cục bộ chưa biết sẽ được đăng ký tự động. Được bật khi cấu hình toàn cục hoặc cấu hình ứng dụng OAuth được bật"
"Password complexity check. When enabled the sign-in page validates password strength; when disabled it only requires a non-empty password. Default true": "Kiểm tra độ phức tạp mật khẩu. Khi bật, trang đăng nhập sẽ kiểm tra độ mạnh mật khẩu; khi tắt chỉ yêu cầu mật khẩu không rỗng. Mặc định true"
"Login failure limit. Bans sign-in after this many consecutive failures for the same user or IP, default 5": "Giới hạn đăng nhập thất bại. Cấm đăng nhập sau số lần thất bại liên tiếp này cho cùng người dùng hoặc IP, mặc định 5"
"Login ban duration. Seconds a risk-control ban lasts, default 300": "Thời hạn cấm đăng nhập. Số giây một lệnh cấm kiểm soát rủi ro có hiệu lực, mặc định 300"
"Class C subnet ban threshold. Bans a /24 subnet such as 103.125.146.* after this many failures, default 10; 0 disables": "Ngưỡng cấm dải mạng lớp C. Cấm dải /24 như 103.125.146.* sau số lần thất bại này, mặc định 10; 0 sẽ tắt"
"Class B subnet ban threshold. Bans a /16 subnet such as 103.125.*.* after this many failures, default 20; 0 disables": "Ngưỡng cấm dải mạng lớp B. Cấm dải /16 như 103.125.*.* sau số lần thất bại này, mặc định 20; 0 sẽ tắt"
"Force bind by user name. Binds SSO users to local users with the same name without a provider prefix; intended for user centers": "Buộc liên kết theo tên người dùng. Liên kết người dùng SSO với người dùng cục bộ cùng tên mà không có tiền tố nhà cung cấp; dành cho trung tâm người dùng"
"Bind by user code. Binds SSO users to local users by user code": "Liên kết theo mã người dùng. Liên kết người dùng SSO với người dùng cục bộ theo mã người dùng"
"Bind by mobile. Binds SSO users to local users by mobile number": "Liên kết theo điện thoại. Liên kết người dùng SSO với người dùng cục bộ theo số điện thoại"
"Bind by email. Binds SSO users to local users by email": "Liên kết theo email. Liên kết người dùng SSO với người dùng cục bộ theo email"
"Bind by nickname. Binds SSO users to local users by nickname; suitable for internal SSO, not for social networks with many duplicate names": "Liên kết theo biệt danh. Liên kết người dùng SSO với người dùng cục bộ theo biệt danh; phù hợp với SSO nội bộ, không phù hợp với mạng xã hội có nhiều tên trùng nhau"
"Use SSO roles. Keeps SSO roles after sign-in, default true; otherwise DefaultRole is used": "Dùng vai trò từ SSO. Giữ vai trò từ SSO sau khi đăng nhập, mặc định true; nếu không sẽ dùng DefaultRole"
"Use SSO departments. Keeps SSO departments after sign-in, default true": "Dùng phòng ban từ SSO. Giữ phòng ban từ SSO sau khi đăng nhập, mặc định true"
"SSO role rules. Automatically upgrades the primary role after SSO sign-in; separate rules with commas. Format: source role+department wildcard=target role, for example Guest+Route*=Route Specialist": "Quy tắc vai trò SSO. Tự động nâng cấp vai trò chính sau khi đăng nhập SSO; phân tách các quy tắc bằng dấu phẩy. Định dạng: vai trò nguồn+ký tự đại diện phòng ban=vai trò đích, ví dụ Guest+Route*=Route Specialist"
"Sign out everywhere. false signs out of this site only; true (default) also signs out of the SSO server": "Đăng xuất mọi nơi. false chỉ đăng xuất khỏi trang này; true (mặc định) cũng đăng xuất khỏi máy chủ SSO"
"Allow multi-device sign-in. false kicks old devices on a new sign-in and revokes all tokens on sign-out; true (default) revokes only the current session": "Cho phép đăng nhập nhiều thiết bị. false sẽ đẩy thiết bị cũ ra khi đăng nhập mới và thu hồi mọi token khi đăng xuất; true (mặc định) chỉ thu hồi phiên hiện tại"
"Session timeout. Session lifetime after SSO sign-in during which the cookie can sign in again; default 0s": "Thời gian chờ phiên. Thời gian sống của phiên sau khi đăng nhập SSO mà cookie vẫn có thể đăng nhập lại; mặc định 0s"
"Token sliding refresh threshold. Refreshes the JWT and rewrites the cookie when its remaining lifetime falls below this many seconds; 0 disables sliding expiration": "Ngưỡng làm mới trượt của token. Làm mới JWT và ghi lại cookie khi thời gian sống còn lại thấp hơn số giây này; 0 sẽ tắt hết hạn trượt"
"User refresh period. Fetches user information once per period across SSO sign-ins, default 600 seconds": "Chu kỳ làm mới người dùng. Lấy thông tin người dùng một lần mỗi chu kỳ trong các lần đăng nhập SSO, mặc định 600 giây"
"JWT secret. Algorithm and key used to sign JWTs, such as HS256:ABCD1234": "Khóa bí mật JWT. Thuật toán và khóa dùng để ký JWT, ví dụ HS256:ABCD1234"
"Token lifetime. Lifetime of the access token in seconds, default 7200": "Thời gian sống của token. Thời gian sống của token truy cập tính bằng giây, mặc định 7200"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default true": "Lưu token trong cookie. Đọc token từ cookie khi tiêu đề yêu cầu không mang token, mặc định true"
"Validate attachment access. Requires sign-in to access attachments, default true": "Kiểm tra quyền truy cập tệp đính kèm. Yêu cầu đăng nhập để truy cập tệp đính kèm, mặc định true"
"Public attachment categories. Categories accessible without sign-in, comma-separated, such as markdown,avatar. Applies when ValidateAttachment is true": "Danh mục tệp đính kèm công khai. Các danh mục truy cập được mà không cần đăng nhập, phân tách bằng dấu phẩy, ví dụ markdown,avatar. Áp dụng khi ValidateAttachment là true"
"Private attachment categories. Categories only the uploader can access, comma-separated. Applies when ValidateAttachment is true": "Danh mục tệp đính kèm riêng tư. Các danh mục chỉ người tải lên mới truy cập được, phân tách bằng dấu phẩy. Áp dụng khi ValidateAttachment là true"
"SSO redirect allowlist. Domains allowed to receive the JWT after sign-in, comma-separated with wildcard prefixes such as *.company.com. Empty allows the same site only; other origins are rejected and sent back to the home page": "Danh sách cho phép chuyển hướng SSO. Các miền được phép nhận JWT sau khi đăng nhập, phân tách bằng dấu phẩy với tiền tố ký tự đại diện như *.company.com. Để trống chỉ cho phép cùng trang; các nguồn khác bị từ chối và chuyển về trang chủ"
"External authentication URL. When local authentication fails, credentials are verified by this endpoint; on success the local user is created or updated and signed in": "URL xác thực bên ngoài. Khi xác thực cục bộ thất bại, thông tin đăng nhập được xác minh qua điểm cuối này; nếu thành công, người dùng cục bộ sẽ được tạo hoặc cập nhật và đăng nhập"
"Start page. First content page opened after entering the admin console": "Trang bắt đầu. Trang nội dung đầu tiên mở sau khi vào bảng điều khiển quản trị"
"Theme. Content page theme, ACE/layui": "Chủ đề. Chủ đề trang nội dung, ACE/layui"
"Skin. Outer frame layout, ACE/layui": "Giao diện khung. Bố cục khung ngoài, ACE/layui"
"Login tip. Empty hides the tip on the sign-in page": "Gợi ý đăng nhập. Để trống sẽ ẩn gợi ý trên trang đăng nhập"
"Login logo. Empty uses the default logo": "Logo đăng nhập. Để trống sẽ dùng logo mặc định"
"Login background. Image URL; empty uses the default background": "Nền đăng nhập. URL hình ảnh; để trống sẽ dùng nền mặc định"
"Form group layout. 3/2/1 columns on large/medium/small screens, form-group col-xs-12 col-sm-6 col-lg-4": "Bố cục nhóm biểu mẫu. 3/2/1 cột trên màn hình lớn/trung bình/nhỏ, form-group col-xs-12 col-sm-6 col-lg-4"
"Bootstrap select. Nicer drop-downs with a rendering cost": "Bootstrap select. Danh sách thả xuống đẹp hơn nhưng tốn chi phí hiển thị"
"Maximum drop-down items. Maximum options in a related drop-down on forms, default 50; larger lists fall back to a text box": "Số mục tối đa trong danh sách thả xuống. Số tùy chọn tối đa trong danh sách thả xuống liên quan trên biểu mẫu, mặc định 50; danh sách lớn hơn sẽ chuyển về ô văn bản"
"Copyright. Empty hides the copyright; variables now/runtime/framework are supported, and now accepts formats such as {now:yyyy}": "Bản quyền. Để trống sẽ ẩn bản quyền; hỗ trợ các biến now/runtime/framework và now chấp nhận định dạng như {now:yyyy}"
"Filing number. Empty hides the filing information": "Số đăng ký. Để trống sẽ ẩn thông tin đăng ký"
"Enable new UI": "Bật giao diện mới"
"ECharts theme. Chart theme": "Chủ đề ECharts. Chủ đề biểu đồ"
"Title suffix. Appends the system name to page titles, default true": "Hậu tố tiêu đề. Thêm tên hệ thống vào tiêu đề trang, mặc định true"
"Table double-click. Enables row double-click on list pages, default true": "Nhấp đúp bảng. Bật nhấp đúp vào dòng trên trang danh sách, mặc định true"
"Table style. Light: minimal thin lines; Standard: clear row lines (default); Grid: full cell borders": "Kiểu bảng. Light: đường kẻ mảnh tối giản; Standard: đường kẻ dòng rõ ràng (mặc định); Grid: viền ô đầy đủ"
"Table density. Compact: dense and information-rich (default); Normal: relaxed": "Mật độ bảng. Compact: dày đặc và nhiều thông tin (mặc định); Normal: thoáng"
"Stardust web. Stardust console URL; supports direct links to /trace?id={traceId} or /graph?id={traceId}": "Stardust web. URL bảng điều khiển Stardust; hỗ trợ liên kết trực tiếp tới /trace?id={traceId} hoặc /graph?id={traceId}"
"AI master switch. Enables AI features such as log analysis and notification polishing, default false": "Công tắc chính AI. Bật các tính năng AI như phân tích nhật ký và trau chuốt thông báo, mặc định false"
"AI provider. Supports NewLife, Ollama, DeepSeek, DashScope, OpenAI and others; default NewLife": "Nhà cung cấp AI. Hỗ trợ NewLife, Ollama, DeepSeek, DashScope, OpenAI và các nhà cung cấp khác; mặc định NewLife"
"AI endpoint. Defaults to https://ai.newlifex.com for NewLife": "Điểm cuối AI. Mặc định là https://ai.newlifex.com cho NewLife"
"AI ApiKey. Defaults to sk-CubeAI2026 for NewLife": "ApiKey AI. Mặc định là sk-CubeAI2026 cho NewLife"
"AI default model. Defaults to newlife-flash for NewLife": "Mô hình mặc định AI. Mặc định là newlife-flash cho NewLife"
"AI default deep reasoning. Enables think mode for analysis and chat by default; false means fast responses": "Suy luận sâu mặc định của AI. Bật chế độ think cho phân tích và trò chuyện theo mặc định; false nghĩa là phản hồi nhanh"
"AI color scheme. Fills the primary and secondary colors from a preset": "Bảng màu AI. Điền màu chính và màu phụ từ bộ đặt trước"
"AI primary color. Main color of the launcher, panel header and user bubbles; default NewLife green #2ecc71": "Màu chính AI. Màu chính của nút khởi chạy, tiêu đề bảng và bong bóng người dùng; mặc định là màu xanh NewLife #2ecc71"
"AI secondary color. Gradient end color, default dark green #1e8e3e": "Màu phụ AI. Màu kết thúc của dải chuyển sắc, mặc định là xanh lá đậm #1e8e3e"
"OAuth server. Enables the OAuth 2.0 server that provides SSO for other applications": "Máy chủ OAuth. Bật máy chủ OAuth 2.0 cung cấp SSO cho các ứng dụng khác"
"File manager. Enables backend file management (browse, upload, download, delete); this carries security risks": "Trình quản lý tệp. Bật quản lý tệp phía máy chủ (duyệt, tải lên, tải xuống, xóa); có rủi ro bảo mật"
"Multi-tenancy. Enables tenants; tenant mode cannot access system administration and platform mode cannot access tenant pages": "Nhiều đối tượng thuê. Bật đối tượng thuê; chế độ đối tượng thuê không thể truy cập quản trị hệ thống và chế độ nền tảng không thể truy cập trang đối tượng thuê"
"Tenant query policy. DenyWithEmpty: return an empty set without tenant context; ThrowOnMissingTenant: throw an explicit error": "Chính sách truy vấn đối tượng thuê. DenyWithEmpty: trả về tập rỗng khi không có ngữ cảnh đối tượng thuê; ThrowOnMissingTenant: ném lỗi rõ ràng"
"User online. 0: do not record; 1: signed-in users only; 2: all visitors (default)": "Người dùng trực tuyến. 0: không ghi nhận; 1: chỉ người dùng đã đăng nhập; 2: tất cả khách truy cập (mặc định)"
"User statistics. Records user visits, default true": "Thống kê người dùng. Ghi nhận lượt truy cập của người dùng, mặc định true"
"Enable SMS. SMS verification codes and system notifications, default false": "Bật SMS. Mã xác minh SMS và thông báo hệ thống, mặc định false"
"Enable email. Email verification codes and system notifications, default false": "Bật email. Mã xác minh email và thông báo hệ thống, mặc định false"
"Require email verification. Users must activate their email before signing in and must provide one when registering, default false": "Yêu cầu xác minh email. Người dùng phải kích hoạt email trước khi đăng nhập và phải cung cấp email khi đăng ký, mặc định false"
"Require mobile verification. Users must activate their mobile before signing in and must provide one when registering, default false": "Yêu cầu xác minh điện thoại. Người dùng phải kích hoạt điện thoại trước khi đăng nhập và phải cung cấp số điện thoại khi đăng ký, mặc định false"
"Captcha scenarios. Bit mask: 0: off; 1: sign-in; 2: registration; 4: verification code requests (anti-SMS-bombing); combine with 3 for sign-in and registration. Mandatory scenarios are never exempted, default 0": "Kịch bản captcha. Mặt nạ bit: 0: tắt; 1: đăng nhập; 2: đăng ký; 4: yêu cầu mã xác minh (chống SMS bomb); kết hợp với 3 cho đăng nhập và đăng ký. Các kịch bản bắt buộc không bao giờ được miễn, mặc định 0"
"Risk-adaptive captcha. Disabled when CaptchaScene is 0; when enabled it detects unsafe environments and requires a captcha, default true": "Captcha thích ứng rủi ro. Bị tắt khi CaptchaScene là 0; khi bật sẽ phát hiện môi trường không an toàn và yêu cầu captcha, mặc định true"
"Captcha risk threshold. Requires a captcha when the risk score reaches this value: 0: intranet; 1: internet; 2: internet with recent failures; 3: banned. Default 2": "Ngưỡng rủi ro captcha. Yêu cầu captcha khi điểm rủi ro đạt giá trị này: 0: mạng nội bộ; 1: internet; 2: internet có lỗi gần đây; 3: bị cấm. Mặc định 2"
"Trusted device lifetime. Days during which previously successful devices skip adaptive captchas, default 30": "Thời gian sống thiết bị tin cậy. Số ngày mà các thiết bị từng thành công được bỏ qua captcha thích ứng, mặc định 30"
"Enable MFA. Allows users to enable TOTP multi-factor authentication; an enhanced feature, default false": "Bật MFA. Cho phép người dùng bật xác thực đa yếu tố TOTP; là tính năng nâng cao, mặc định false"
"File storage serving. Responds to file download requests from other nodes, default true": "Phục vụ lưu trữ tệp. Phản hồi yêu cầu tải xuống tệp từ các nút khác, mặc định true"
"File storage fetch. Pulls new files published by other nodes, default true": "Lấy dữ liệu lưu trữ tệp. Kéo các tệp mới do các nút khác công bố, mặc định true"
"File fetch timeout. Maximum milliseconds to wait for other nodes when a file is missing locally, default 5000": "Thời gian chờ lấy tệp. Số mili giây tối đa để chờ các nút khác khi thiếu tệp cục bộ, mặc định 5000"
"Attachment storage. Local disk, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu or EasyIO; default Local": "Lưu trữ tệp đính kèm. Đĩa cục bộ, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu hoặc EasyIO; mặc định Local"
"Object storage server. S3-compatible endpoint for OSS/COS/Qiniu, such as oss-cn-beijing.aliyuncs.com": "Máy chủ lưu trữ đối tượng. Điểm cuối tương thích S3 cho OSS/COS/Qiniu, ví dụ oss-cn-beijing.aliyuncs.com"
"Object storage bucket. Bucket name for OSS/COS/Qiniu": "Nhóm lưu trữ đối tượng. Tên nhóm cho OSS/COS/Qiniu"
"Object storage region. S3 signing scope, such as cn-beijing / ap-beijing / cn-east-1": "Vùng lưu trữ đối tượng. Phạm vi ký S3, ví dụ cn-beijing / ap-beijing / cn-east-1"
"Object storage app ID. AccessKeyId": "ID ứng dụng lưu trữ đối tượng. AccessKeyId"
"Object storage app secret. AccessKeySecret": "Khóa bí mật ứng dụng lưu trữ đối tượng. AccessKeySecret"
"Data retention. Days to keep audit and OAuth logs, default 30": "Thời gian lưu dữ liệu. Số ngày giữ nhật ký kiểm toán và OAuth, mặc định 30"
"File retention. Days to keep backup files, default 15": "Thời gian lưu tệp. Số ngày giữ tệp sao lưu, mặc định 15"
"Retention size floor. Files smaller than this (KB) are never deleted even after the retention period, default 1024K": "Ngưỡng kích thước tối thiểu khi lưu. Các tệp nhỏ hơn mức này (KB) sẽ không bao giờ bị xóa kể cả khi hết thời gian lưu, mặc định 1024K"
"Maximum export rows. Maximum rows a page may export, default 10_000_000": "Số dòng xuất tối đa. Số dòng tối đa một trang có thể xuất, mặc định 10_000_000"
"Maximum backup rows. Maximum rows a page may back up, default 10_000_000": "Số dòng sao lưu tối đa. Số dòng tối đa một trang có thể sao lưu, mặc định 10_000_000"
"API prefixes. Comma- or semicolon-separated prefixes such as /api,/api/v1; matching requests are forwarded to the real route without the prefix": "Tiền tố API. Các tiền tố phân tách bằng dấu phẩy hoặc dấu chấm phẩy, ví dụ /api,/api/v1; các yêu cầu khớp sẽ được chuyển tiếp tới tuyến đường thực tế mà không có tiền tố"
"Password strength. * means unrestricted; by default at least 8 characters with digits, upper/lower case letters and symbols. Simple form: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$": "Độ mạnh mật khẩu. * nghĩa là không hạn chế; mặc định ít nhất 8 ký tự gồm chữ số, chữ hoa/chữ thường và ký hiệu. Dạng đơn giản: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$"
"Cookie mode. Default SameSite mode for token cookies (-1 Unspecified, 0 None, 1 Lax, 2 Strict)": "Chế độ cookie. Chế độ SameSite mặc định cho cookie token (-1 Unspecified, 0 None, 1 Lax, 2 Strict)"
"Cookie domain. Writes cookies to a parent domain; empty uses the current domain. A top-level domain requires HTTPS and prevents plain HTTP from writing same-name keys on the local domain": "Miền cookie. Ghi cookie vào miền cha; để trống sẽ dùng miền hiện tại. Miền cấp cao nhất yêu cầu HTTPS và ngăn HTTP thuần ghi các khóa cùng tên trên miền cục bộ"
"Activation URL. Front-end activation page URL used in email activation links, such as https://xxx/activate; empty builds /activate from the request host": "URL kích hoạt. URL trang kích hoạt phía giao diện dùng trong liên kết kích hoạt qua email, ví dụ https://xxx/activate; để trống sẽ tạo /activate từ máy chủ của yêu cầu"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default false": "Lưu token trong cookie. Đọc token từ cookie khi tiêu đề yêu cầu không mang token, mặc định false"
"Password strength. * means unrestricted; the simple form defaults to 5 to 32 characters of any type. The full form requires at least 8 characters with digits, upper/lower case letters and symbols: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$": "Độ mạnh mật khẩu. * nghĩa là không hạn chế; dạng đơn giản mặc định 5 đến 32 ký tự thuộc bất kỳ loại nào. Dạng đầy đủ yêu cầu ít nhất 8 ký tự gồm chữ số, chữ hoa/chữ thường và ký hiệu: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$"
