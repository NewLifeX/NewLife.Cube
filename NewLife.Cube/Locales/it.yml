"Generated {0} configuration field values (skipped {1}, failed {2}) and filled them into the form. Ask the user to review before submitting.": "Generati {0} valori dei campi di configurazione (ignorati {1}, non riusciti {2}) e inseriti nel modulo. Chiedere all'utente di verificarli prima dell'invio."
"The current page is a system configuration form (such as Cube settings); you can help review and fill in configuration items.": "La pagina corrente è un modulo di configurazione di sistema (ad esempio le impostazioni di Cube); puoi aiutare a verificare e compilare le voci di configurazione."
"Available tools: get_form_schema / fill_form / get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "Strumenti disponibili: get_form_schema / fill_form / get_page_context / get_system_info / run_js (vedere le definizioni delle funzioni; chiamarli quando necessario)"
"2. When the user asks to create, fill in or complete configuration, call get_form_schema first to inspect the items, then call fill_form to generate values (invent reasonable values for empty writable fields, keep existing values unless the user asks otherwise, and never fabricate or modify sensitive settings such as ApiKey/Secret/Token); finally ask the user to review before submitting": "2. Quando l'utente chiede di creare, compilare o completare la configurazione, chiama prima get_form_schema per esaminare le voci, poi fill_form per generare i valori (inventa valori ragionevoli per i campi modificabili vuoti, mantieni i valori esistenti salvo diversa indicazione dell'utente e non fabbricare né modificare mai impostazioni sensibili come ApiKey/Secret/Token); infine chiedi all'utente di verificare prima dell'invio"
"3. When the user asks about the content or current state of the page, call get_page_context, then give your analysis and conclusion": "3. Quando l'utente chiede informazioni sul contenuto o sullo stato corrente della pagina, chiama get_page_context, poi fornisci l'analisi e la conclusione"
"4. When the user asks about system status or diagnostics, call get_system_info": "4. Quando l'utente chiede informazioni sullo stato del sistema o sulla diagnostica, chiama get_system_info"
"5. When the user asks to read or operate page elements, you may call run_js; explain any write operation (changing page content, submitting forms) to the user before running it": "5. Quando l'utente chiede di leggere o modificare elementi della pagina, puoi chiamare run_js; spiega all'utente qualsiasi operazione di scrittura (modifica del contenuto della pagina, invio di moduli) prima di eseguirla"
"6. Never invent data; ask the user for clarification when information is insufficient": "6. Non inventare mai dati; chiedi chiarimenti all'utente quando le informazioni sono insufficienti"
"The tenant identifier carried by user [{0}] is invalid or unavailable. Check the tenant settings and try again.": "L'identificativo del tenant fornito dall'utente [{0}] non è valido o non è disponibile. Controllare le impostazioni del tenant e riprovare."
"User [{0}] did not carry a tenant identifier, so the tenant cannot be determined. Include the tenant information and try again.": "L'utente [{0}] non ha fornito un identificativo del tenant, quindi non è possibile determinare il tenant. Includere le informazioni sul tenant e riprovare."
"User [{0}] is not allowed to access the data of the current tenant. Switch tenant and try again.": "All'utente [{0}] non è consentito accedere ai dati del tenant corrente. Cambiare tenant e riprovare."
"Not signed in or the session has expired!": "Accesso non effettuato o sessione scaduta!"
