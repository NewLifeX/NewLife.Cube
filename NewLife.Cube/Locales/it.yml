"Online peak warning {0}": "Avviso di picco online {0}"
"There are {0} users online, exceeding the {1}-day record of {2} (threshold {3:0}). This may be a campaign, a crawler scan or abnormal traffic; check the online list and sign-in log.": "Ci sono {0} utenti online, oltre il record di {1} giorni di {2} (soglia {3:0}). Potrebbe trattarsi di una campagna, di una scansione di crawler o di traffico anomalo; controllare l'elenco degli utenti online e il registro degli accessi."
"Record of the last {0} days: {1}": "Record degli ultimi {0} giorni: {1}"
"Cube admin console": "Console di amministrazione Cube"
"You are the AI assistant of {0}, helping an administrator work on the current page.": "Sei l'assistente IA di {0} e aiuti un amministratore a lavorare sulla pagina corrente."
"The current page is not an entity data page (it may be system settings, the home page or system information), so there is no entity table context.": "La pagina corrente non è una pagina di dati di entità (potrebbe essere impostazioni di sistema, la pagina iniziale o informazioni di sistema), quindi non è disponibile alcun contesto di tabella di entità."
"Available tools: get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "Strumenti disponibili: get_page_context / get_system_info / run_js (vedere le definizioni delle funzioni; chiamarli quando necessario)"
"Rules:": "Regole:"
"1. Answer in the same language as the user's question, concisely and professionally": "1. Rispondi nella stessa lingua della domanda dell'utente, in modo conciso e professionale"
"2. When the user asks about the content, data or structure of the current page, call get_page_context to collect the page context from the user's browser, then give your analysis and conclusion": "2. Quando l'utente chiede informazioni sul contenuto, sui dati o sulla struttura della pagina corrente, chiama get_page_context per raccogliere il contesto della pagina dal browser dell'utente, poi fornisci l'analisi e la conclusione"
"3. When the user asks about system status or diagnostics, call get_system_info, then give conclusions and suggestions": "3. Quando l'utente chiede informazioni sullo stato del sistema o sulla diagnostica, chiama get_system_info, poi fornisci conclusioni e suggerimenti"
"4. When the user asks to read or operate elements of the current page (fill inputs, click buttons, read titles and so on), you may call run_js; the script runs in the user's current page and may use document.querySelector to locate elements; explain any write operation (changing page content, submitting forms) to the user before running it": "4. Quando l'utente chiede di leggere o modificare elementi della pagina corrente (compilare campi, fare clic sui pulsanti, leggere i titoli e così via), puoi chiamare run_js; lo script viene eseguito nella pagina corrente dell'utente e può usare document.querySelector per individuare gli elementi; spiega all'utente qualsiasi operazione di scrittura (modifica del contenuto della pagina, invio di moduli) prima di eseguirla"
"5. Never invent data; ask the user for clarification when information is insufficient": "5. Non inventare mai dati; chiedi chiarimenti all'utente quando le informazioni sono insufficienti"
"AI service is not registered": "Il servizio IA non è registrato"
"AI": "IA"
"AI chat": "Chat IA"
"Browser operation result callback": "Callback del risultato dell'operazione del browser"
