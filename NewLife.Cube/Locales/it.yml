"AI call failed: {0}": "Chiamata IA non riuscita: {0}"
"Data:": "Dati:"
"You are a system operations expert. Based on the following runtime metrics, produce a health diagnosis report:\nCover bottlenecks, whether capacity should be expanded, and any risks worth attention.\nOutput the diagnosis report directly without extra explanation.": "Sei un esperto di operazioni di sistema. In base alle seguenti metriche di runtime, produci un rapporto di diagnosi dello stato di salute:\nAffronta i colli di bottiglia, l'opportunità di ampliare la capacità e i rischi da tenere sotto controllo.\nMostra direttamente il rapporto di diagnosi, senza spiegazioni aggiuntive."
"Script must not be empty": "Lo script non può essere vuoto"
"Browser channel is not ready (Writer not injected)": "Il canale del browser non è pronto (Writer non iniettato)"
"Run page script": "Esegui script della pagina"
"Runs JavaScript in the current page and returns the result; can read or modify page elements, for example document.title or document.querySelector('input[name=Name]').value": "Esegue JavaScript nella pagina corrente e restituisce il risultato; può leggere o modificare elementi della pagina, ad esempio document.title o document.querySelector('input[name=Name]').value"
"JavaScript code to run in the current page": "Codice JavaScript da eseguire nella pagina corrente"
"Get page context": "Ottieni contesto della pagina"
"Gets the main data and structure of the current page (title, tables, forms and so on). Uses the server-side context when the page provides one; otherwise collects the page content from the user's browser": "Ottiene i dati e la struttura principali della pagina corrente (titolo, tabelle, moduli e così via). Usa il contesto lato server quando la pagina lo fornisce; in caso contrario raccoglie il contenuto della pagina dal browser dell'utente"
"Get form schema": "Ottieni schema del modulo"
"Gets the schema of the current form, including field names, types, descriptions and current values, for generating form values": "Ottiene lo schema del modulo corrente, inclusi nomi dei campi, tipi, descrizioni e valori correnti, per generare i valori del modulo"
"Form mode: add or edit": "Modalità del modulo: aggiunta o modifica"
"Fill form": "Compila modulo"
"Generates form field values and fills them into the front-end form. Nothing is written to the database until the user confirms": "Genera i valori dei campi e li inserisce nel modulo dell'interfaccia. Nulla viene scritto nel database finché l'utente non conferma"
"Field values as a JSON string, keyed by field name": "Valori dei campi come stringa JSON, con il nome del campo come chiave"
"No valid field value dictionary was received": "Non è stato ricevuto alcun dizionario di valori dei campi valido"
"[fill_form invalid argument] No valid field value dictionary was received. Call get_form_schema first to get the field structure, then pass the values parameter as {\"field\":value}.": "[fill_form argomento non valido] Non è stato ricevuto alcun dizionario di valori dei campi valido. Chiamare prima get_form_schema per ottenere la struttura dei campi, quindi passare il parametro values come {\"campo\":valore}."
"Generated {0} form field values (skipped {1}, failed {2}) and filled them into the form. Ask the user to review before submitting.": "Generati {0} valori dei campi (ignorati {1}, non riusciti {2}) e inseriti nel modulo. Chiedere all'utente di verificarli prima dell'invio."
