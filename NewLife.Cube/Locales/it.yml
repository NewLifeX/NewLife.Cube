# 设置页字段、分类与导航（中文源文经英文规范键翻译）
"Auto (follow system)": "Automatico (segui il sistema)"
"Cancel": "Annulla"
"Queries {0}, executes {1}, elapsed {2:n0} ms": "Query {0}, esecuzioni {1}, tempo impiegato {2:n0} ms"
"Show run time": "Mostra tempo di esecuzione"
"Avatar directory. Downloads remote avatars locally; defaults to the Avatars subdirectory, or Avatars next to the web root. Empty disables downloading": "Directory degli avatar. Scarica localmente gli avatar remoti; per impostazione predefinita la sottodirectory Avatars, oppure Avatars accanto alla radice web. Vuoto disabilita il download"
"Text avatar characters. Generates an SVG text avatar when no image exists; 1 to 3 characters. Uses the first N Chinese characters to keep the surname, or the initials of English words. Default 2": "Caratteri dell'avatar testuale. Genera un avatar testuale SVG quando non esiste un'immagine; da 1 a 3 caratteri. Usa i primi N caratteri cinesi per conservare il cognome, oppure le iniziali delle parole inglesi. Predefinito 2"
"Upload directory. Defaults to Uploads": "Directory di caricamento. Predefinito: Uploads"
"Web root directory. Defaults to wwwroot": "Directory radice web. Predefinito: wwwroot"
"Resource URL. CDN base such as https://sso.newlifex.com/content/; empty uses local resources": "URL delle risorse. Base CDN, ad esempio https://sso.newlifex.com/content/; vuoto usa le risorse locali"
"CORS origins. Other origins allowed to access this site; * allows any origin": "Origini CORS. Altre origini autorizzate ad accedere a questo sito; * consente qualsiasi origine"
"Iframe embedding. Empty allows the same domain only; SAMEORIGIN allows the same domain and port; ALLOWALL allows any domain": "Incorporamento in iframe. Vuoto consente solo lo stesso dominio; SAMEORIGIN consente lo stesso dominio e la stessa porta; ALLOWALL consente qualsiasi dominio"
"Share expiration. Lifetime of share tokens in seconds, default 7200": "Scadenza della condivisione. Durata dei token di condivisione in secondi, predefinito 7200"
"Bot error code. Returns this error for crawlers, such as 404/500; 0 disables blocking": "Codice di errore per i bot. Restituisce questo errore ai crawler, ad esempio 404/500; 0 disabilita il blocco"
"Force redirect. Target scheme and host for GET requests; * is supported in the host. Commonly used to force HTTPS, such as https://*:8081": "Reindirizzamento forzato. Schema e host di destinazione per le richieste GET; * è supportato nell'host. Usato comunemente per forzare HTTPS, ad esempio https://*:8081"
"Security mode. 0: off; 1: observe and log only; 2: block; 3: automatic (default; observes, bans repeated attackers, and temporarily blocks broad attacks with automatic rollback)": "Modalità di sicurezza. 0: disattivata; 1: solo osservazione e registrazione; 2: blocco; 3: automatica (predefinita; osserva, blocca gli attaccanti recidivi e blocca temporaneamente gli attacchi estesi con ripristino automatico)"
"Auto-ban durations. Comma-separated seconds that increase with each trigger; empty uses 60,300,1800,7200,86400": "Durate di blocco automatico. Secondi separati da virgole che aumentano a ogni attivazione; vuoto usa 60,300,1800,7200,86400"
"Trusted proxies. Forwarded headers are only trusted from these comma-separated IPs or CIDR ranges; empty keeps the legacy behavior of trusting all forwarded headers": "Proxy attendibili. Solo le intestazioni inoltrate da questi IP o intervalli CIDR separati da virgole sono considerate attendibili; vuoto mantiene il comportamento precedente di considerare attendibili tutte le intestazioni inoltrate"
"Trusted proxy learning limit. When no trusted proxies are configured, private direct sources that send forwarded headers are learned up to this count; 0 disables learning (typically 2 for one data center, 4 for two)": "Limite di apprendimento dei proxy attendibili. Quando non sono configurati proxy attendibili, vengono apprese fino a questo numero le origini private dirette che inviano intestazioni inoltrate; 0 disabilita l'apprendimento (in genere 2 per un data center, 4 per due)"
"Learned proxies. Maintained automatically; clear it to reset the learned list": "Proxy appresi. Gestiti automaticamente; svuota la lista per reimpostare l'apprendimento"
"Default role. Defaults to the Normal User role": "Ruolo predefinito. Predefinito: il ruolo Utente normale"
"Allow password sign-in. Allows signing in with a username and password": "Consenti accesso con password. Consente di accedere con nome utente e password"
"Allow plain-text passwords. Default true for legacy clients; false forces Challenge-Response encrypted passwords": "Consenti password in testo semplice. Predefinito true per i client legacy; false impone password cifrate con Challenge-Response"
"Allow registration. Allows registering with a username and password": "Consenti registrazione. Consente di registrarsi con nome utente e password"
"Auto registration. Default true; after SSO sign-in an unknown local user is registered automatically. Enabled when either the global or the OAuth app setting is on": "Registrazione automatica. Predefinito true; dopo l'accesso SSO, un utente locale sconosciuto viene registrato automaticamente. È attiva quando è abilitata l'impostazione globale o quella dell'applicazione OAuth"
"Password complexity check. When enabled the sign-in page validates password strength; when disabled it only requires a non-empty password. Default true": "Verifica della complessità della password. Se attiva, la pagina di accesso convalida la robustezza della password; se disattiva, richiede solo una password non vuota. Predefinito true"
"Login failure limit. Bans sign-in after this many consecutive failures for the same user or IP, default 5": "Limite di accessi non riusciti. Blocca l'accesso dopo questo numero di errori consecutivi per lo stesso utente o IP, predefinito 5"
"Login ban duration. Seconds a risk-control ban lasts, default 300": "Durata del blocco di accesso. Secondi di durata di un blocco del controllo dei rischi, predefinito 300"
"Class C subnet ban threshold. Bans a /24 subnet such as 103.125.146.* after this many failures, default 10; 0 disables": "Soglia di blocco della sottorete classe C. Blocca una sottorete /24 come 103.125.146.* dopo questo numero di errori, predefinito 10; 0 la disabilita"
"Class B subnet ban threshold. Bans a /16 subnet such as 103.125.*.* after this many failures, default 20; 0 disables": "Soglia di blocco della sottorete classe B. Blocca una sottorete /16 come 103.125.*.* dopo questo numero di errori, predefinito 20; 0 la disabilita"
"Force bind by user name. Binds SSO users to local users with the same name without a provider prefix; intended for user centers": "Forza associazione per nome utente. Associa gli utenti SSO agli utenti locali con lo stesso nome senza prefisso del provider; pensato per i centri utenti"
"Bind by user code. Binds SSO users to local users by user code": "Associa per codice utente. Associa gli utenti SSO agli utenti locali tramite il codice utente"
"Bind by mobile. Binds SSO users to local users by mobile number": "Associa per cellulare. Associa gli utenti SSO agli utenti locali tramite il numero di cellulare"
"Bind by email. Binds SSO users to local users by email": "Associa per email. Associa gli utenti SSO agli utenti locali tramite l'email"
"Bind by nickname. Binds SSO users to local users by nickname; suitable for internal SSO, not for social networks with many duplicate names": "Associa per nickname. Associa gli utenti SSO agli utenti locali tramite il nickname; adatto allo SSO interno, non ai social network con molti nomi duplicati"
"Use SSO roles. Keeps SSO roles after sign-in, default true; otherwise DefaultRole is used": "Usa i ruoli SSO. Mantiene i ruoli SSO dopo l'accesso, predefinito true; in caso contrario viene usato DefaultRole"
"Use SSO departments. Keeps SSO departments after sign-in, default true": "Usa i reparti SSO. Mantiene i reparti SSO dopo l'accesso, predefinito true"
"SSO role rules. Automatically upgrades the primary role after SSO sign-in; separate rules with commas. Format: source role+department wildcard=target role, for example Guest+Route*=Route Specialist": "Regole dei ruoli SSO. Aggiorna automaticamente il ruolo principale dopo l'accesso SSO; separa le regole con virgole. Formato: ruolo di origine+carattere jolly del reparto=ruolo di destinazione, ad esempio Guest+Route*=Route Specialist"
"Sign out everywhere. false signs out of this site only; true (default) also signs out of the SSO server": "Esci da tutti i sistemi. false esce solo da questo sito; true (predefinito) esce anche dal server SSO"
"Allow multi-device sign-in. false kicks old devices on a new sign-in and revokes all tokens on sign-out; true (default) revokes only the current session": "Consenti accesso da più dispositivi. false espelle i vecchi dispositivi a ogni nuovo accesso e revoca tutti i token all'uscita; true (predefinito) revoca solo la sessione corrente"
"Session timeout. Session lifetime after SSO sign-in during which the cookie can sign in again; default 0s": "Timeout della sessione. Durata della sessione dopo l'accesso SSO durante la quale il cookie può accedere di nuovo; predefinito 0 s"
"Token sliding refresh threshold. Refreshes the JWT and rewrites the cookie when its remaining lifetime falls below this many seconds; 0 disables sliding expiration": "Soglia di aggiornamento scorrevole del token. Aggiorna il JWT e riscrive il cookie quando la sua durata residua scende sotto questo numero di secondi; 0 disabilita la scadenza scorrevole"
"User refresh period. Fetches user information once per period across SSO sign-ins, default 600 seconds": "Periodo di aggiornamento dell'utente. Recupera le informazioni dell'utente una volta per periodo tra gli accessi SSO, predefinito 600 secondi"
"JWT secret. Algorithm and key used to sign JWTs, such as HS256:ABCD1234": "Segreto JWT. Algoritmo e chiave usati per firmare i JWT, ad esempio HS256:ABCD1234"
"Token lifetime. Lifetime of the access token in seconds, default 7200": "Durata del token. Durata del token di accesso in secondi, predefinito 7200"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default true": "Memorizza il token nel cookie. Legge il token dal cookie quando l'intestazione della richiesta non lo contiene, predefinito true"
"Validate attachment access. Requires sign-in to access attachments, default true": "Convalida l'accesso agli allegati. Richiede l'accesso per accedere agli allegati, predefinito true"
"Public attachment categories. Categories accessible without sign-in, comma-separated, such as markdown,avatar. Applies when ValidateAttachment is true": "Categorie di allegati pubbliche. Categorie accessibili senza accesso, separate da virgole, ad esempio markdown,avatar. Si applica quando ValidateAttachment è true"
"Private attachment categories. Categories only the uploader can access, comma-separated. Applies when ValidateAttachment is true": "Categorie di allegati private. Categorie accessibili solo a chi ha caricato il file, separate da virgole. Si applica quando ValidateAttachment è true"
"SSO redirect allowlist. Domains allowed to receive the JWT after sign-in, comma-separated with wildcard prefixes such as *.company.com. Empty allows the same site only; other origins are rejected and sent back to the home page": "Lista consentita dei reindirizzamenti SSO. Domini autorizzati a ricevere il JWT dopo l'accesso, separati da virgole con prefissi jolly come *.company.com. Vuoto consente solo lo stesso sito; le altre origini vengono rifiutate e riportate alla pagina iniziale"
"External authentication URL. When local authentication fails, credentials are verified by this endpoint; on success the local user is created or updated and signed in": "URL di autenticazione esterna. Quando l'autenticazione locale fallisce, le credenziali vengono verificate da questo endpoint; in caso di esito positivo l'utente locale viene creato o aggiornato e l'utente effettua l'accesso"
"Start page. First content page opened after entering the admin console": "Pagina iniziale. Prima pagina di contenuto aperta dopo l'ingresso nella console di amministrazione"
"Theme. Content page theme, ACE/layui": "Tema. Tema delle pagine di contenuto, ACE/layui"
"Skin. Outer frame layout, ACE/layui": "Aspetto. Layout della cornice esterna, ACE/layui"
"Login tip. Empty hides the tip on the sign-in page": "Suggerimento di accesso. Vuoto nasconde il suggerimento nella pagina di accesso"
"Login logo. Empty uses the default logo": "Logo di accesso. Vuoto usa il logo predefinito"
"Login background. Image URL; empty uses the default background": "Sfondo di accesso. URL dell'immagine; vuoto usa lo sfondo predefinito"
"Form group layout. 3/2/1 columns on large/medium/small screens, form-group col-xs-12 col-sm-6 col-lg-4": "Layout dei gruppi di modulo. 3/2/1 colonne su schermi grandi/medi/piccoli, form-group col-xs-12 col-sm-6 col-lg-4"
"Bootstrap select. Nicer drop-downs with a rendering cost": "Select di Bootstrap. Menu a discesa più curati con un costo di rendering"
"Maximum drop-down items. Maximum options in a related drop-down on forms, default 50; larger lists fall back to a text box": "Numero massimo di elementi a discesa. Numero massimo di opzioni in un menu a discesa collegato nei moduli, predefinito 50; gli elenchi più grandi passano a una casella di testo"
"Copyright. Empty hides the copyright; variables now/runtime/framework are supported, and now accepts formats such as {now:yyyy}": "Copyright. Vuoto nasconde il copyright; sono supportate le variabili now/runtime/framework e now accetta formati come {now:yyyy}"
"Filing number. Empty hides the filing information": "Numero di registrazione. Vuoto nasconde le informazioni di registrazione"
"Enable new UI": "Abilita la nuova interfaccia"
"ECharts theme. Chart theme": "Tema ECharts. Tema dei grafici"
"Title suffix. Appends the system name to page titles, default true": "Suffisso del titolo. Aggiunge il nome del sistema ai titoli delle pagine, predefinito true"
"Table double-click. Enables row double-click on list pages, default true": "Doppio clic sulla tabella. Abilita il doppio clic sulle righe delle pagine elenco, predefinito true"
"Table style. Light: minimal thin lines; Standard: clear row lines (default); Grid: full cell borders": "Stile della tabella. Leggero: linee sottili minimali; Standard: linee di separazione nitide (predefinito); Griglia: bordi completi delle celle"
"Table density. Compact: dense and information-rich (default); Normal: relaxed": "Densità della tabella. Compatto: denso e ricco di informazioni (predefinito); Normale: arioso"
"Stardust web. Stardust console URL; supports direct links to /trace?id={traceId} or /graph?id={traceId}": "Web Stardust. URL della console Stardust; supporta collegamenti diretti a /trace?id={traceId} o /graph?id={traceId}"
"AI master switch. Enables AI features such as log analysis and notification polishing, default false": "Interruttore principale dell'IA. Abilita funzioni IA come l'analisi dei log e la rifinitura delle notifiche, predefinito false"
"AI provider. Supports NewLife, Ollama, DeepSeek, DashScope, OpenAI and others; default NewLife": "Provider IA. Supporta NewLife, Ollama, DeepSeek, DashScope, OpenAI e altri; predefinito NewLife"
"AI endpoint. Defaults to https://ai.newlifex.com for NewLife": "Endpoint IA. Predefinito https://ai.newlifex.com per NewLife"
"AI ApiKey. Defaults to sk-CubeAI2026 for NewLife": "ApiKey IA. Predefinito sk-CubeAI2026 per NewLife"
"AI default model. Defaults to newlife-flash for NewLife": "Modello IA predefinito. Predefinito newlife-flash per NewLife"
"AI default deep reasoning. Enables think mode for analysis and chat by default; false means fast responses": "Ragionamento approfondito IA predefinito. Abilita il modo think per analisi e chat per impostazione predefinita; false significa risposte rapide"
"AI color scheme. Fills the primary and secondary colors from a preset": "Schema colori IA. Riempie i colori primario e secondario da un preset"
"AI primary color. Main color of the launcher, panel header and user bubbles; default NewLife green #2ecc71": "Colore primario IA. Colore principale del launcher, dell'intestazione del pannello e delle bolle utente; predefinito verde NewLife #2ecc71"
"AI secondary color. Gradient end color, default dark green #1e8e3e": "Colore secondario IA. Colore finale del gradiente, predefinito verde scuro #1e8e3e"
"OAuth server. Enables the OAuth 2.0 server that provides SSO for other applications": "Server OAuth. Abilita il server OAuth 2.0 che fornisce SSO alle altre applicazioni"
"File manager. Enables backend file management (browse, upload, download, delete); this carries security risks": "Gestione file. Abilita la gestione dei file back-end (sfoglia, carica, scarica, elimina); comporta rischi per la sicurezza"
"Multi-tenancy. Enables tenants; tenant mode cannot access system administration and platform mode cannot access tenant pages": "Multi-tenancy. Abilita i tenant; la modalità tenant non può accedere all'amministrazione di sistema e la modalità piattaforma non può accedere alle pagine dei tenant"
"Tenant query policy. DenyWithEmpty: return an empty set without tenant context; ThrowOnMissingTenant: throw an explicit error": "Criterio di query dei tenant. DenyWithEmpty: restituisce un set vuoto senza contesto tenant; ThrowOnMissingTenant: genera un errore esplicito"
"User online. 0: do not record; 1: signed-in users only; 2: all visitors (default)": "Utenti online. 0: non registrare; 1: solo utenti connessi; 2: tutti i visitatori (predefinito)"
"User statistics. Records user visits, default true": "Statistiche utenti. Registra le visite degli utenti, predefinito true"
"Enable SMS. SMS verification codes and system notifications, default false": "Abilita SMS. Codici di verifica SMS e notifiche di sistema, predefinito false"
"Enable email. Email verification codes and system notifications, default false": "Abilita email. Codici di verifica via email e notifiche di sistema, predefinito false"
"Require email verification. Users must activate their email before signing in and must provide one when registering, default false": "Richiedi verifica email. Gli utenti devono attivare l'email prima di accedere e devono fornirla in fase di registrazione, predefinito false"
"Require mobile verification. Users must activate their mobile before signing in and must provide one when registering, default false": "Richiedi verifica cellulare. Gli utenti devono attivare il cellulare prima di accedere e devono fornirlo in fase di registrazione, predefinito false"
"Captcha scenarios. Bit mask: 0: off; 1: sign-in; 2: registration; 4: verification code requests (anti-SMS-bombing); combine with 3 for sign-in and registration. Mandatory scenarios are never exempted, default 0": "Scenari captcha. Maschera di bit: 0: disattivato; 1: accesso; 2: registrazione; 4: richieste di codice di verifica (anti-bombardamento SMS); combina con 3 per accesso e registrazione. Gli scenari obbligatori non sono mai esentati, predefinito 0"
"Risk-adaptive captcha. Disabled when CaptchaScene is 0; when enabled it detects unsafe environments and requires a captcha, default true": "Captcha adattivo al rischio. Disattivato quando CaptchaScene è 0; se attivo rileva ambienti non sicuri e richiede un captcha, predefinito true"
"Captcha risk threshold. Requires a captcha when the risk score reaches this value: 0: intranet; 1: internet; 2: internet with recent failures; 3: banned. Default 2": "Soglia di rischio del captcha. Richiede un captcha quando il punteggio di rischio raggiunge questo valore: 0: intranet; 1: internet; 2: internet con errori recenti; 3: bloccato. Predefinito 2"
"Trusted device lifetime. Days during which previously successful devices skip adaptive captchas, default 30": "Durata dei dispositivi attendibili. Giorni durante i quali i dispositivi che hanno già effettuato l'accesso con successo evitano i captcha adattivi, predefinito 30"
"Enable MFA. Allows users to enable TOTP multi-factor authentication; an enhanced feature, default false": "Abilita MFA. Consente agli utenti di attivare l'autenticazione a più fattori TOTP; funzione avanzata, predefinito false"
"File storage serving. Responds to file download requests from other nodes, default true": "Servizio di archiviazione file. Risponde alle richieste di download dei file degli altri nodi, predefinito true"
"File storage fetch. Pulls new files published by other nodes, default true": "Recupero dell'archiviazione file. Scarica i nuovi file pubblicati dagli altri nodi, predefinito true"
"File fetch timeout. Maximum milliseconds to wait for other nodes when a file is missing locally, default 5000": "Timeout di recupero dei file. Millisecondi massimi di attesa degli altri nodi quando un file manca localmente, predefinito 5000"
"Attachment storage. Local disk, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu or EasyIO; default Local": "Archiviazione allegati. Disco locale, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu o EasyIO; predefinito Local"
"Object storage server. S3-compatible endpoint for OSS/COS/Qiniu, such as oss-cn-beijing.aliyuncs.com": "Server di archiviazione oggetti. Endpoint compatibile S3 per OSS/COS/Qiniu, ad esempio oss-cn-beijing.aliyuncs.com"
"Object storage bucket. Bucket name for OSS/COS/Qiniu": "Bucket di archiviazione oggetti. Nome del bucket per OSS/COS/Qiniu"
"Object storage region. S3 signing scope, such as cn-beijing / ap-beijing / cn-east-1": "Regione di archiviazione oggetti. Ambito della firma S3, ad esempio cn-beijing / ap-beijing / cn-east-1"
"Object storage app ID. AccessKeyId": "ID applicazione dell'archiviazione oggetti. AccessKeyId"
"Object storage app secret. AccessKeySecret": "Segreto applicazione dell'archiviazione oggetti. AccessKeySecret"
"Data retention. Days to keep audit and OAuth logs, default 30": "Conservazione dei dati. Giorni di conservazione dei log di audit e OAuth, predefinito 30"
"File retention. Days to keep backup files, default 15": "Conservazione dei file. Giorni di conservazione dei file di backup, predefinito 15"
"Retention size floor. Files smaller than this (KB) are never deleted even after the retention period, default 1024K": "Dimensione minima di conservazione. I file più piccoli di questa dimensione (KB) non vengono mai eliminati, anche dopo il periodo di conservazione, predefinito 1024K"
"Maximum export rows. Maximum rows a page may export, default 10_000_000": "Numero massimo di righe esportabili. Numero massimo di righe che una pagina può esportare, predefinito 10_000_000"
"Maximum backup rows. Maximum rows a page may back up, default 10_000_000": "Numero massimo di righe di backup. Numero massimo di righe di cui una pagina può eseguire il backup, predefinito 10_000_000"
"API prefixes. Comma- or semicolon-separated prefixes such as /api,/api/v1; matching requests are forwarded to the real route without the prefix": "Prefissi API. Prefissi separati da virgole o punti e virgola come /api,/api/v1; le richieste corrispondenti vengono inoltrate alla route reale senza il prefisso"
"Password strength. * means unrestricted; by default at least 8 characters with digits, upper/lower case letters and symbols. Simple form: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$": "Robustezza della password. * significa senza restrizioni; per impostazione predefinita almeno 8 caratteri con cifre, lettere maiuscole/minuscole e simboli. Forma semplice: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$"
"Cookie mode. Default SameSite mode for token cookies (-1 Unspecified, 0 None, 1 Lax, 2 Strict)": "Modalità cookie. Modalità SameSite predefinita per i cookie del token (-1 Unspecified, 0 None, 1 Lax, 2 Strict)"
"Cookie domain. Writes cookies to a parent domain; empty uses the current domain. A top-level domain requires HTTPS and prevents plain HTTP from writing same-name keys on the local domain": "Dominio del cookie. Scrive i cookie su un dominio padre; vuoto usa il dominio corrente. Un dominio di primo livello richiede HTTPS e impedisce al semplice HTTP di scrivere chiavi con lo stesso nome sul dominio locale"
"Activation URL. Front-end activation page URL used in email activation links, such as https://xxx/activate; empty builds /activate from the request host": "URL di attivazione. URL della pagina di attivazione front-end usata nei link di attivazione via email, ad esempio https://xxx/activate; vuoto costruisce /activate dall'host della richiesta"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default false": "Memorizza il token nel cookie. Legge il token dal cookie quando l'intestazione della richiesta non lo contiene, predefinito false"
"Password strength. * means unrestricted; the simple form defaults to 5 to 32 characters of any type. The full form requires at least 8 characters with digits, upper/lower case letters and symbols: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$": "Robustezza della password. * significa senza restrizioni; la forma semplice accetta per impostazione predefinita da 5 a 32 caratteri di qualsiasi tipo. La forma completa richiede almeno 8 caratteri con cifre, lettere maiuscole/minuscole e simboli: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$"
