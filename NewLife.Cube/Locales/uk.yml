"系统内重要操作均记录日志，便于审计。任何人都不能删除、修改或伪造操作日志。": "Усі важливі операції журналюються для аудиту. Ніхто не має права видаляти, змінювати або підробляти журнали операцій."
"菜单": "Меню"
