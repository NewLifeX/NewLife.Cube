# 设置页字段、分类与导航（中文源文经英文规范键翻译）
"Auto (follow system)": "Авто (як у системі)"
"Cancel": "Скасувати"
"Queries {0}, executes {1}, elapsed {2:n0} ms": "Запитів: {0}, виконань: {1}, витрачено {2:n0} мс"
"Show run time": "Показувати час виконання"
"Avatar directory. Downloads remote avatars locally; defaults to the Avatars subdirectory, or Avatars next to the web root. Empty disables downloading": "Каталог аватарів. Завантажує віддалені аватари локально; за замовчуванням — підкаталог Avatars або Avatars поруч із коренем сайту. Порожнє значення вимикає завантаження"
"Text avatar characters. Generates an SVG text avatar when no image exists; 1 to 3 characters. Uses the first N Chinese characters to keep the surname, or the initials of English words. Default 2": "Символи текстового аватара. Створює текстовий SVG-аватар, якщо зображення відсутнє; від 1 до 3 символів. Для китайських імен беруться перші N ієрогліфів, щоб зберегти прізвище, для англійських слів — ініціали. За замовчуванням 2"
"Upload directory. Defaults to Uploads": "Каталог вивантажень. За замовчуванням Uploads"
"Web root directory. Defaults to wwwroot": "Кореневий каталог сайту. За замовчуванням wwwroot"
"Resource URL. CDN base such as https://sso.newlifex.com/content/; empty uses local resources": "URL ресурсів. Базова адреса CDN, наприклад https://sso.newlifex.com/content/; порожнє значення — локальні ресурси"
"CORS origins. Other origins allowed to access this site; * allows any origin": "Джерела CORS. Інші джерела, яким дозволено доступ до цього сайту; * дозволяє будь-яке джерело"
"Iframe embedding. Empty allows the same domain only; SAMEORIGIN allows the same domain and port; ALLOWALL allows any domain": "Вбудовування в iframe. Порожнє значення — лише той самий домен; SAMEORIGIN — той самий домен і порт; ALLOWALL — будь-який домен"
"Share expiration. Lifetime of share tokens in seconds, default 7200": "Термін дії спільного доступу. Час життя токенів спільного доступу в секундах, за замовчуванням 7200"
"Bot error code. Returns this error for crawlers, such as 404/500; 0 disables blocking": "Код помилки для ботів. Повертає цю помилку пошуковим роботам, наприклад 404/500; 0 вимикає блокування"
"Force redirect. Target scheme and host for GET requests; * is supported in the host. Commonly used to force HTTPS, such as https://*:8081": "Примусове перенаправлення. Схема й хост для GET-запитів; у хості підтримується *. Зазвичай використовується для примусового HTTPS, наприклад https://*:8081"
"Security mode. 0: off; 1: observe and log only; 2: block; 3: automatic (default; observes, bans repeated attackers, and temporarily blocks broad attacks with automatic rollback)": "Режим безпеки. 0 — вимкнено; 1 — лише спостереження та журналювання; 2 — блокування; 3 — автоматичний (за замовчуванням; спостерігає, блокує повторних атакуючих і тимчасово блокує масові атаки з автоматичним відкатом)"
"Auto-ban durations. Comma-separated seconds that increase with each trigger; empty uses 60,300,1800,7200,86400": "Тривалості автоблокування. Секунди через кому, що зростають із кожним спрацюванням; порожнє значення — 60,300,1800,7200,86400"
"Trusted proxies. Forwarded headers are only trusted from these comma-separated IPs or CIDR ranges; empty keeps the legacy behavior of trusting all forwarded headers": "Довірені проксі. Заголовки переадресації приймаються лише від цих IP-адрес або діапазонів CIDR, перелічених через кому; порожнє значення зберігає попередню поведінку — довіряти всім заголовкам переадресації"
"Trusted proxy learning limit. When no trusted proxies are configured, private direct sources that send forwarded headers are learned up to this count; 0 disables learning (typically 2 for one data center, 4 for two)": "Ліміт вивчення довірених проксі. Якщо довірені проксі не задано, приватні прямі джерела, що надсилають заголовки переадресації, вивчаються до зазначеної кількості; 0 вимикає вивчення (зазвичай 2 для одного ЦОД, 4 для двох)"
"Learned proxies. Maintained automatically; clear it to reset the learned list": "Вивчені проксі. Обслуговується автоматично; очистіть, щоб скинути список"
"Default role. Defaults to the Normal User role": "Роль за замовчуванням. За замовчуванням — роль звичайного користувача"
"Allow password sign-in. Allows signing in with a username and password": "Дозволити вхід за паролем. Дозволяє вхід з іменем користувача та паролем"
"Allow plain-text passwords. Default true for legacy clients; false forces Challenge-Response encrypted passwords": "Дозволити паролі у відкритому вигляді. За замовчуванням true для застарілих клієнтів; false вимагає зашифровані паролі за схемою запит-відповідь"
"Allow registration. Allows registering with a username and password": "Дозволити реєстрацію. Дозволяє реєстрацію з іменем користувача та паролем"
"Auto registration. Default true; after SSO sign-in an unknown local user is registered automatically. Enabled when either the global or the OAuth app setting is on": "Автоматична реєстрація. За замовчуванням true; після входу через SSO невідомий локальний користувач реєструється автоматично. Вмикається, якщо ввімкнено глобальне налаштування або налаштування застосунку OAuth"
"Password complexity check. When enabled the sign-in page validates password strength; when disabled it only requires a non-empty password. Default true": "Перевірка складності пароля. Коли ввімкнено, сторінка входу перевіряє надійність пароля; коли вимкнено, достатньо непорожнього пароля. За замовчуванням true"
"Login failure limit. Bans sign-in after this many consecutive failures for the same user or IP, default 5": "Обмеження невдалих входів. Блокує вхід після зазначеної кількості послідовних невдач для одного користувача або IP, за замовчуванням 5"
"Login ban duration. Seconds a risk-control ban lasts, default 300": "Тривалість блокування входу. Скільки секунд триває блокування ризик-контролю, за замовчуванням 300"
"Class C subnet ban threshold. Bans a /24 subnet such as 103.125.146.* after this many failures, default 10; 0 disables": "Поріг блокування підмережі класу C. Блокує підмережу /24, наприклад 103.125.146.*, після зазначеної кількості невдач, за замовчуванням 10; 0 вимикає"
"Class B subnet ban threshold. Bans a /16 subnet such as 103.125.*.* after this many failures, default 20; 0 disables": "Поріг блокування підмережі класу B. Блокує підмережу /16, наприклад 103.125.*.*, після зазначеної кількості невдач, за замовчуванням 20; 0 вимикає"
"Force bind by user name. Binds SSO users to local users with the same name without a provider prefix; intended for user centers": "Примусове прив’язування за іменем користувача. Прив’язує користувачів SSO до локальних користувачів з тим самим іменем без префікса постачальника; призначено для центрів користувачів"
"Bind by user code. Binds SSO users to local users by user code": "Прив’язування за кодом користувача. Прив’язує користувачів SSO до локальних користувачів за кодом користувача"
"Bind by mobile. Binds SSO users to local users by mobile number": "Прив’язування за мобільним телефоном. Прив’язує користувачів SSO до локальних користувачів за номером мобільного телефону"
"Bind by email. Binds SSO users to local users by email": "Прив’язування за ел. поштою. Прив’язує користувачів SSO до локальних користувачів за адресою ел. пошти"
"Bind by nickname. Binds SSO users to local users by nickname; suitable for internal SSO, not for social networks with many duplicate names": "Прив’язування за псевдонімом. Прив’язує користувачів SSO до локальних користувачів за псевдонімом; підходить для внутрішнього SSO, але не для соцмереж із безліччю однакових імен"
"Use SSO roles. Keeps SSO roles after sign-in, default true; otherwise DefaultRole is used": "Використовувати ролі SSO. Зберігає ролі SSO після входу, за замовчуванням true; інакше використовується DefaultRole"
"Use SSO departments. Keeps SSO departments after sign-in, default true": "Використовувати відділи SSO. Зберігає відділи SSO після входу, за замовчуванням true"
"SSO role rules. Automatically upgrades the primary role after SSO sign-in; separate rules with commas. Format: source role+department wildcard=target role, for example Guest+Route*=Route Specialist": "Правила ролей SSO. Автоматично підвищують основну роль після входу через SSO; правила розділяються комами. Формат: вихідна роль+шаблон відділу=цільова роль, наприклад Guest+Route*=Route Specialist"
"Sign out everywhere. false signs out of this site only; true (default) also signs out of the SSO server": "Вихід усюди. false — вихід лише з цього сайту; true (за замовчуванням) — також вихід із сервера SSO"
"Allow multi-device sign-in. false kicks old devices on a new sign-in and revokes all tokens on sign-out; true (default) revokes only the current session": "Дозволити вхід із кількох пристроїв. false — під час нового входу старі пристрої відключаються, а під час виходу відкликаються всі токени; true (за замовчуванням) — відкликається лише поточна сесія"
"Session timeout. Session lifetime after SSO sign-in during which the cookie can sign in again; default 0s": "Час очікування сесії. Час життя сесії після входу через SSO, протягом якого cookie може виконати повторний вхід; за замовчуванням 0 с"
"Token sliding refresh threshold. Refreshes the JWT and rewrites the cookie when its remaining lifetime falls below this many seconds; 0 disables sliding expiration": "Поріг ковзного оновлення токена. Оновлює JWT і перезаписує cookie, коли залишковий час життя стає меншим за зазначену кількість секунд; 0 вимикає ковзне продовження"
"User refresh period. Fetches user information once per period across SSO sign-ins, default 600 seconds": "Період оновлення користувача. Запитує відомості про користувача один раз за період під час входів через SSO, за замовчуванням 600 секунд"
"JWT secret. Algorithm and key used to sign JWTs, such as HS256:ABCD1234": "Секрет JWT. Алгоритм і ключ для підпису JWT, наприклад HS256:ABCD1234"
"Token lifetime. Lifetime of the access token in seconds, default 7200": "Час життя токена. Час життя токена доступу в секундах, за замовчуванням 7200"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default true": "Зберігати токен у cookie. Читає токен із cookie, якщо в заголовку запиту його немає, за замовчуванням true"
"Validate attachment access. Requires sign-in to access attachments, default true": "Перевіряти доступ до вкладень. Вимагає входу для доступу до вкладень, за замовчуванням true"
"Public attachment categories. Categories accessible without sign-in, comma-separated, such as markdown,avatar. Applies when ValidateAttachment is true": "Загальнодоступні категорії вкладень. Категорії, доступні без входу, через кому, наприклад markdown,avatar. Діє, коли ValidateAttachment увімкнено"
"Private attachment categories. Categories only the uploader can access, comma-separated. Applies when ValidateAttachment is true": "Приватні категорії вкладень. Категорії, доступні лише тому, хто вивантажив, через кому. Діє, коли ValidateAttachment увімкнено"
"SSO redirect allowlist. Domains allowed to receive the JWT after sign-in, comma-separated with wildcard prefixes such as *.company.com. Empty allows the same site only; other origins are rejected and sent back to the home page": "Білий список перенаправлень SSO. Домени, яким дозволено отримувати JWT після входу, через кому, з шаблонним префіксом, наприклад *.company.com. Порожнє значення — лише той самий сайт; інші джерела відхиляються й перенаправляються на головну сторінку"
"External authentication URL. When local authentication fails, credentials are verified by this endpoint; on success the local user is created or updated and signed in": "URL зовнішньої автентифікації. Якщо локальна автентифікація не вдалася, облікові дані перевіряються цією кінцевою точкою; у разі успіху локальний користувач створюється або оновлюється та входить у систему"
"Start page. First content page opened after entering the admin console": "Початкова сторінка. Перша сторінка вмісту, що відкривається після входу в консоль адміністрування"
"Theme. Content page theme, ACE/layui": "Тема. Тема сторінки вмісту, ACE/layui"
"Skin. Outer frame layout, ACE/layui": "Скін. Макет зовнішнього фрейму, ACE/layui"
"Login tip. Empty hides the tip on the sign-in page": "Підказка на сторінці входу. Порожнє значення приховує підказку на сторінці входу"
"Login logo. Empty uses the default logo": "Логотип сторінки входу. Порожнє значення — логотип за замовчуванням"
"Login background. Image URL; empty uses the default background": "Тло сторінки входу. URL зображення; порожнє значення — тло за замовчуванням"
"Form group layout. 3/2/1 columns on large/medium/small screens, form-group col-xs-12 col-sm-6 col-lg-4": "Макет груп форми. 3/2/1 колонки на великих/середніх/малих екранах, form-group col-xs-12 col-sm-6 col-lg-4"
"Bootstrap select. Nicer drop-downs with a rendering cost": "Bootstrap select. Гарніші випадаючі списки ціною продуктивності відображення"
"Maximum drop-down items. Maximum options in a related drop-down on forms, default 50; larger lists fall back to a text box": "Максимум елементів списку. Максимальна кількість варіантів у пов’язаному випадаючому списку форми, за замовчуванням 50; довші списки замінюються текстовим полем"
"Copyright. Empty hides the copyright; variables now/runtime/framework are supported, and now accepts formats such as {now:yyyy}": "Авторське право. Порожнє значення приховує авторське право; підтримуються змінні now/runtime/framework, а now приймає формати на кшталт {now:yyyy}"
"Filing number. Empty hides the filing information": "Номер реєстрації. Порожнє значення приховує відомості про реєстрацію"
"Enable new UI": "Увімкнути новий інтерфейс"
"ECharts theme. Chart theme": "Тема ECharts. Тема діаграм"
"Title suffix. Appends the system name to page titles, default true": "Суфікс заголовка. Додає назву системи до заголовків сторінок, за замовчуванням true"
"Table double-click. Enables row double-click on list pages, default true": "Подвійне клацання в таблиці. Вмикає подвійне клацання по рядку на сторінках списку, за замовчуванням true"
"Table style. Light: minimal thin lines; Standard: clear row lines (default); Grid: full cell borders": "Стиль таблиці. Світлий: мінімум тонких ліній; Стандартний: чіткі лінії рядків (за замовчуванням); Сітка: повні межі комірок"
"Table density. Compact: dense and information-rich (default); Normal: relaxed": "Щільність таблиці. Компактна: щільна й інформативна (за замовчуванням); Звичайна: вільна"
"Stardust web. Stardust console URL; supports direct links to /trace?id={traceId} or /graph?id={traceId}": "Веб-інтерфейс Stardust. URL консолі Stardust; підтримує прямі посилання /trace?id={traceId} або /graph?id={traceId}"
"AI master switch. Enables AI features such as log analysis and notification polishing, default false": "Головний перемикач ШІ. Вмикає функції ШІ, як-от аналіз журналів і покращення сповіщень, за замовчуванням false"
"AI provider. Supports NewLife, Ollama, DeepSeek, DashScope, OpenAI and others; default NewLife": "Постачальник ШІ. Підтримує NewLife, Ollama, DeepSeek, DashScope, OpenAI та інших; за замовчуванням NewLife"
"AI endpoint. Defaults to https://ai.newlifex.com for NewLife": "Кінцева точка ШІ. Для NewLife за замовчуванням https://ai.newlifex.com"
"AI ApiKey. Defaults to sk-CubeAI2026 for NewLife": "ApiKey ШІ. Для NewLife за замовчуванням sk-CubeAI2026"
"AI default model. Defaults to newlife-flash for NewLife": "Модель ШІ за замовчуванням. Для NewLife за замовчуванням newlife-flash"
"AI default deep reasoning. Enables think mode for analysis and chat by default; false means fast responses": "Глибокі міркування ШІ за замовчуванням. Вмикає режим міркування для аналізу й чату за замовчуванням; false — швидкі відповіді"
"AI color scheme. Fills the primary and secondary colors from a preset": "Колірна схема ШІ. Заповнює основний і додатковий кольори з пресета"
"AI primary color. Main color of the launcher, panel header and user bubbles; default NewLife green #2ecc71": "Основний колір ШІ. Головний колір кнопки запуску, заголовка панелі та бульбашок користувача; за замовчуванням зелений NewLife #2ecc71"
"AI secondary color. Gradient end color, default dark green #1e8e3e": "Додатковий колір ШІ. Колір кінця градієнта, за замовчуванням темно-зелений #1e8e3e"
"OAuth server. Enables the OAuth 2.0 server that provides SSO for other applications": "Сервер OAuth. Вмикає сервер OAuth 2.0, що надає SSO для інших застосунків"
"File manager. Enables backend file management (browse, upload, download, delete); this carries security risks": "Файловий менеджер. Вмикає керування файлами в панелі (перегляд, вивантаження, завантаження, видалення); це створює ризики для безпеки"
"Multi-tenancy. Enables tenants; tenant mode cannot access system administration and platform mode cannot access tenant pages": "Багатоклієнтність. Вмикає клієнтів; у режимі клієнта недоступне системне адміністрування, а в режимі платформи — сторінки клієнта"
"Tenant query policy. DenyWithEmpty: return an empty set without tenant context; ThrowOnMissingTenant: throw an explicit error": "Політика запитів клієнта. DenyWithEmpty: повернути порожній набір без контексту клієнта; ThrowOnMissingTenant: викинути явну помилку"
"User online. 0: do not record; 1: signed-in users only; 2: all visitors (default)": "Користувачі онлайн. 0 — не записувати; 1 — лише користувачі, які ввійшли; 2 — усі відвідувачі (за замовчуванням)"
"User statistics. Records user visits, default true": "Статистика користувачів. Записує відвідування користувачів, за замовчуванням true"
"Enable SMS. SMS verification codes and system notifications, default false": "Увімкнути SMS. Коди підтвердження та системні сповіщення через SMS, за замовчуванням false"
"Enable email. Email verification codes and system notifications, default false": "Увімкнути ел. пошту. Коди підтвердження та системні сповіщення електронною поштою, за замовчуванням false"
"Require email verification. Users must activate their email before signing in and must provide one when registering, default false": "Вимагати підтвердження ел. пошти. Користувачі повинні активувати ел. пошту до входу й зазначати її під час реєстрації, за замовчуванням false"
"Require mobile verification. Users must activate their mobile before signing in and must provide one when registering, default false": "Вимагати підтвердження телефону. Користувачі повинні активувати телефон до входу й зазначати його під час реєстрації, за замовчуванням false"
"Captcha scenarios. Bit mask: 0: off; 1: sign-in; 2: registration; 4: verification code requests (anti-SMS-bombing); combine with 3 for sign-in and registration. Mandatory scenarios are never exempted, default 0": "Сценарії капчі. Бітова маска: 0 — вимкнено; 1 — вхід; 2 — реєстрація; 4 — запити кодів підтвердження (захист від SMS-бомбінгу); комбінуйте з 3 для входу та реєстрації. Обов’язкові сценарії ніколи не звільняються, за замовчуванням 0"
"Risk-adaptive captcha. Disabled when CaptchaScene is 0; when enabled it detects unsafe environments and requires a captcha, default true": "Капча, адаптивна до ризику. Вимкнена, коли CaptchaScene дорівнює 0; коли ввімкнена, визначає небезпечні середовища й вимагає капчу, за замовчуванням true"
"Captcha risk threshold. Requires a captcha when the risk score reaches this value: 0: intranet; 1: internet; 2: internet with recent failures; 3: banned. Default 2": "Поріг ризику капчі. Вимагає капчу, коли оцінка ризику досягає значення: 0 — інтрамережа; 1 — інтернет; 2 — інтернет із недавніми невдачами; 3 — заблоковано. За замовчуванням 2"
"Trusted device lifetime. Days during which previously successful devices skip adaptive captchas, default 30": "Термін життя довіреного пристрою. Скільки днів раніше успішні пристрої пропускають адаптивну капчу, за замовчуванням 30"
"Enable MFA. Allows users to enable TOTP multi-factor authentication; an enhanced feature, default false": "Увімкнути MFA. Дозволяє користувачам увімкнути багатофакторну автентифікацію TOTP; розширена функція, за замовчуванням false"
"File storage serving. Responds to file download requests from other nodes, default true": "Віддача файлового сховища. Відповідає на запити завантаження файлів від інших вузлів, за замовчуванням true"
"File storage fetch. Pulls new files published by other nodes, default true": "Отримання з файлового сховища. Завантажує нові файли, опубліковані іншими вузлами, за замовчуванням true"
"File fetch timeout. Maximum milliseconds to wait for other nodes when a file is missing locally, default 5000": "Час очікування отримання файлу. Максимальний час очікування інших вузлів, коли файл відсутній локально, у мілісекундах, за замовчуванням 5000"
"Attachment storage. Local disk, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu or EasyIO; default Local": "Сховище вкладень. Локальний диск, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu або EasyIO; за замовчуванням Local"
"Object storage server. S3-compatible endpoint for OSS/COS/Qiniu, such as oss-cn-beijing.aliyuncs.com": "Сервер об’єктного сховища. Сумісна з S3 кінцева точка для OSS/COS/Qiniu, наприклад oss-cn-beijing.aliyuncs.com"
"Object storage bucket. Bucket name for OSS/COS/Qiniu": "Контейнер об’єктного сховища. Назва контейнера для OSS/COS/Qiniu"
"Object storage region. S3 signing scope, such as cn-beijing / ap-beijing / cn-east-1": "Регіон об’єктного сховища. Область підпису S3, наприклад cn-beijing / ap-beijing / cn-east-1"
"Object storage app ID. AccessKeyId": "Ідентифікатор застосунку об’єктного сховища. AccessKeyId"
"Object storage app secret. AccessKeySecret": "Секрет застосунку об’єктного сховища. AccessKeySecret"
"Data retention. Days to keep audit and OAuth logs, default 30": "Зберігання даних. Скільки днів зберігати журнали аудиту та OAuth, за замовчуванням 30"
"File retention. Days to keep backup files, default 15": "Зберігання файлів. Скільки днів зберігати файли резервних копій, за замовчуванням 15"
"Retention size floor. Files smaller than this (KB) are never deleted even after the retention period, default 1024K": "Нижня межа розміру для зберігання. Файли, менші за зазначений розмір (КБ), не видаляються навіть після завершення терміну зберігання, за замовчуванням 1024K"
"Maximum export rows. Maximum rows a page may export, default 10_000_000": "Максимум рядків експорту. Максимальна кількість рядків, яку сторінка може експортувати, за замовчуванням 10_000_000"
"Maximum backup rows. Maximum rows a page may back up, default 10_000_000": "Максимум рядків резервної копії. Максимальна кількість рядків, яку сторінка може скопіювати, за замовчуванням 10_000_000"
"API prefixes. Comma- or semicolon-separated prefixes such as /api,/api/v1; matching requests are forwarded to the real route without the prefix": "Префікси API. Префікси через кому або крапку з комою, наприклад /api,/api/v1; відповідні запити переадресовуються на реальний маршрут без префікса"
"Password strength. * means unrestricted; by default at least 8 characters with digits, upper/lower case letters and symbols. Simple form: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$": "Надійність пароля. * означає без обмежень; за замовчуванням щонайменше 8 символів із цифрами, літерами у верхньому/нижньому регістрі та символами. Проста форма: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$"
"Cookie mode. Default SameSite mode for token cookies (-1 Unspecified, 0 None, 1 Lax, 2 Strict)": "Режим cookie. Режим SameSite за замовчуванням для cookie з токеном (-1 Unspecified, 0 None, 1 Lax, 2 Strict)"
"Cookie domain. Writes cookies to a parent domain; empty uses the current domain. A top-level domain requires HTTPS and prevents plain HTTP from writing same-name keys on the local domain": "Домен cookie. Записує cookie в батьківський домен; порожнє значення — поточний домен. Домен верхнього рівня вимагає HTTPS і не дозволяє звичайному HTTP записувати однойменні ключі в локальному домені"
"Activation URL. Front-end activation page URL used in email activation links, such as https://xxx/activate; empty builds /activate from the request host": "URL активації. URL сторінки активації у фронтенді, що використовується в посиланнях активації з листів, наприклад https://xxx/activate; порожнє значення будує /activate з хоста запиту"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default false": "Зберігати токен у cookie. Читає токен із cookie, якщо в заголовку запиту його немає, за замовчуванням false"
"Password strength. * means unrestricted; the simple form defaults to 5 to 32 characters of any type. The full form requires at least 8 characters with digits, upper/lower case letters and symbols: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$": "Надійність пароля. * означає без обмежень; проста форма за замовчуванням допускає від 5 до 32 символів будь-якого типу. Повна форма вимагає щонайменше 8 символів із цифрами, літерами у верхньому/нижньому регістрі та символами: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$"
