"You are a system operations expert. Analyze the following error logs and report:\n1. Error categories, ordered by frequency\n2. The most likely root cause\n3. Recommended troubleshooting steps\n\nOutput the analysis report directly without extra explanation.": "Ви — експерт із системних операцій. Проаналізуйте наведені нижче журнали помилок і вкажіть:\n1. Категорії помилок у порядку спадання частоти\n2. Найімовірнішу першопричину\n3. Рекомендовані кроки з усунення\n\nВиведіть звіт про аналіз відразу, без додаткових пояснень."
"Daily log report {0}": "Щоденний звіт за журналами {0}"
"Analyzed {0} log entries": "Проаналізовано записів журналу: {0}"
"每天定时汇总过去 24 小时的系统日志，由 AI 生成摘要后通过通知系统推送给管理员": "Щодня узагальнює системні журнали за останні 24 години та надсилає зведення, сформоване ШІ, адміністраторам"
"You are an information security expert. Based on the following security data, write a weekly security report covering:\n1. Overall security posture\n2. Risks that need attention\n3. Recommended security measures\n\nOutput the report directly without extra explanation.": "Ви — експерт з інформаційної безпеки. На основі наведених нижче даних із безпеки складіть щотижневий звіт, що охоплює:\n1. Загальний стан безпеки\n2. Ризики, що потребують уваги\n3. Рекомендовані заходи безпеки\n\nВиведіть звіт відразу, без додаткових пояснень."
"Security weekly report {0} ~ {1}": "Щотижневий звіт із безпеки {0} ~ {1}"
"Analyzed {0} OAuth log entries": "Проаналізовано записів журналу OAuth: {0}"
