"You are a system operations expert. Based on the following runtime metrics, produce a health diagnosis report:\nCover bottlenecks, whether capacity should be expanded, and any risks worth attention.\nOutput the diagnosis report directly without extra explanation.": "Ви — експерт із системних операцій. На основі наведених нижче метрик середовища виконання складіть звіт про діагностику стану:\nОпишіть вузькі місця, потребу в розширенні ємності та ризики, на які варто звернути увагу.\nВиведіть звіт про діагностику відразу, без додаткових пояснень."
