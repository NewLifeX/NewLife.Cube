"Generated {0} configuration field values (skipped {1}, failed {2}) and filled them into the form. Ask the user to review before submitting.": "Згенеровано значень полів конфігурації: {0} (пропущено {1}, з помилками {2}); їх заповнено у форму. Попросіть користувача перевірити їх перед надсиланням."
"The current page is a system configuration form (such as Cube settings); you can help review and fill in configuration items.": "Поточна сторінка — форма системної конфігурації (наприклад, налаштування Cube); ви можете допомогти перевірити та заповнити елементи конфігурації."
"Available tools: get_form_schema / fill_form / get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "Доступні інструменти: get_form_schema / fill_form / get_page_context / get_system_info / run_js (див. визначення функцій; викликайте їх за потреби)"
"2. When the user asks to create, fill in or complete configuration, call get_form_schema first to inspect the items, then call fill_form to generate values (invent reasonable values for empty writable fields, keep existing values unless the user asks otherwise, and never fabricate or modify sensitive settings such as ApiKey/Secret/Token); finally ask the user to review before submitting": "2. Якщо користувач просить створити, заповнити або доповнити конфігурацію, спершу викличте get_form_schema, щоб переглянути елементи, потім викличте fill_form для генерування значень (для порожніх доступних для запису полів придумайте розумні значення, наявні значення зберігайте, якщо користувач не просив інакше, і ніколи не вигадуйте та не змінюйте конфіденційні параметри, як-от ApiKey/Secret/Token); наприкінці попросіть користувача перевірити результат перед надсиланням"
"3. When the user asks about the content or current state of the page, call get_page_context, then give your analysis and conclusion": "3. Якщо користувач запитує про вміст або поточний стан сторінки, викличте get_page_context, потім надайте аналіз і висновок"
"4. When the user asks about system status or diagnostics, call get_system_info": "4. Якщо користувач запитує про стан системи або діагностику, викличте get_system_info"
"5. When the user asks to read or operate page elements, you may call run_js; explain any write operation (changing page content, submitting forms) to the user before running it": "5. Якщо користувач просить прочитати або змінити елементи сторінки, можна викликати run_js; перед запуском будь-якої операції запису (зміна вмісту сторінки, надсилання форм) поясніть її користувачу"
"6. Never invent data; ask the user for clarification when information is insufficient": "6. Ніколи не вигадуйте дані; якщо інформації недостатньо, уточніть у користувача"
"The tenant identifier carried by user [{0}] is invalid or unavailable. Check the tenant settings and try again.": "Ідентифікатор клієнта, переданий користувачем [{0}], недійсний або недоступний. Перевірте налаштування клієнта та повторіть спробу."
"User [{0}] did not carry a tenant identifier, so the tenant cannot be determined. Include the tenant information and try again.": "Користувач [{0}] не передав ідентифікатор клієнта, тому клієнта неможливо визначити. Вкажіть відомості про клієнта та повторіть спробу."
"User [{0}] is not allowed to access the data of the current tenant. Switch tenant and try again.": "Користувачу [{0}] не дозволено доступ до даних поточного клієнта. Перемкніть клієнта та повторіть спробу."
