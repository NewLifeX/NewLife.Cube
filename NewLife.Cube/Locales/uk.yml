"Distributed lock shows the job is still running, skip this round": "Розподілене блокування показує, що завдання ще виконується; цей запуск пропущено"
"Security ban {0}: {1}, unban at {2:yyyy-MM-dd HH:mm:ss}": "Блокування безпеки {0}: {1}, розблокування {2:yyyy-MM-dd HH:mm:ss}"
" (source: {0})": " (джерело: {0})"
"[TenantBind] user [{0}] already has a valid tenant, refuse to auto-bind to tenant [{1}]": "[TenantBind] користувач [{0}] уже має чинного клієнта; автоматичне прив’язування до клієнта [{1}] відхилено"
"[{0}] user auto-bound to tenant [{1}]": "[{0}] користувача автоматично прив’язано до клієнта [{1}]"
"Auto bind": "Автоприв’язування"
"[{0}] {1} failed! {2}": "[{0}] {1} — не вдалося! {2}"
