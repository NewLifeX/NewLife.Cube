"Cube MVC/Razor layer of the NewLife framework: ASP.NET Core MVC hosting, Razor view templates, user permission management, SSO sign-in, OAuth server, data export and runtime localization, validated with 10 billion rows in a single table.": "Шар Cube MVC/Razor фреймворку NewLife: розміщення ASP.NET Core MVC, шаблони представлень Razor, керування дозволами користувачів, вхід через SSO, сервер OAuth, експорт даних і локалізація під час виконання, перевірено на 10 мільярдах рядків в одній таблиці."
"Cube Web API library of the NewLife framework": "Бібліотека Cube Web API фреймворку NewLife"
"Cube Web API library of the NewLife framework: entity controllers, permission and menu management, field metadata, OAuth server, JWT authentication and runtime localization. Built for front-end/back-end separation with Vue, Blazor and Ant Design front ends, validated with 10 billion rows in a single table.": "Бібліотека Cube Web API фреймворку NewLife: контролери сутностей, керування дозволами та меню, метадані полів, сервер OAuth, автентифікація JWT і локалізація під час виконання. Створена для розділення фронтенду й бекенду з інтерфейсами Vue, Blazor та Ant Design, перевірено на 10 мільярдах рядків в одній таблиці."
