"Close account": "Закрити обліковий запис"
"[CloseAccount] handler {0} failed to clean up (user {1}): {2}": "[CloseAccount] обробник {0} не зміг виконати очищення (користувач {1}): {2}"
"API prefix middleware loaded prefixes: {0}": "Проміжне програмне забезпечення префіксів API завантажило префікси: {0}"
"Rule: {0}": "Правило: {0}"
