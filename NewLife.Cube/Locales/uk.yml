"Browser channel is not ready (Writer not injected)": "Канал браузера не готовий (Writer не впроваджено)"
"Run page script": "Запустити скрипт сторінки"
"Runs JavaScript in the current page and returns the result; can read or modify page elements, for example document.title or document.querySelector('input[name=Name]').value": "Виконує JavaScript на поточній сторінці та повертає результат; може читати або змінювати елементи сторінки, наприклад document.title або document.querySelector('input[name=Name]').value"
"JavaScript code to run in the current page": "Код JavaScript для виконання на поточній сторінці"
"Get page context": "Отримати контекст сторінки"
"Gets the main data and structure of the current page (title, tables, forms and so on). Uses the server-side context when the page provides one; otherwise collects the page content from the user's browser": "Повертає основні дані та структуру поточної сторінки (заголовок, таблиці, форми тощо). Використовує серверний контекст, якщо сторінка його надає; інакше збирає вміст сторінки з браузера користувача"
"Get form schema": "Отримати схему форми"
"Gets the schema of the current form, including field names, types, descriptions and current values, for generating form values": "Повертає схему поточної форми, включно з назвами полів, типами, описами та поточними значеннями, для генерування значень форми"
"Form mode: add or edit": "Режим форми: додавання або зміна"
"Fill form": "Заповнити форму"
"Generates form field values and fills them into the front-end form. Nothing is written to the database until the user confirms": "Генерує значення полів форми та заповнює їх у зовнішній формі. До бази даних нічого не записується до підтвердження користувачем"
"Field values as a JSON string, keyed by field name": "Значення полів у вигляді рядка JSON із ключами за назвами полів"
"No valid field value dictionary was received": "Не отримано припустимий словник значень полів"
"[fill_form invalid argument] No valid field value dictionary was received. Call get_form_schema first to get the field structure, then pass the values parameter as {\"field\":value}.": "[fill_form invalid argument] Отримано неприпустимий аргумент: не отримано припустимий словник значень полів. Спершу викличте get_form_schema, щоб отримати структуру полів, потім передайте параметр values у вигляді {\"field\":value}."
"Generated {0} form field values (skipped {1}, failed {2}) and filled them into the form. Ask the user to review before submitting.": "Згенеровано значень полів форми: {0} (пропущено {1}, з помилками {2}); їх заповнено у форму. Попросіть користувача перевірити їх перед надсиланням."
" descending": " за спаданням"
"No current record (add mode). Save first or switch to the detail/edit page.": "Немає поточного запису (режим додавання). Спершу збережіть запис або перейдіть на сторінку подробиць чи зміни."
"Record does not exist": "Запис не існує"
"Get data context": "Отримати контекст даних"
"Gets the data context of the current page: the current record with its field metadata, or a summary and sample of the current query result, for analysis": "Повертає контекст даних поточної сторінки: поточний запис із метаданими полів або зведення та вибірку поточного результату запиту для аналізу"
"Gets the form schema of the current entity, including field names, types, enum values, required flags, descriptions and existing values (edit mode), for generating form values": "Повертає схему форми поточної сутності, включно з назвами полів, типами, значеннями переліків, ознаками обов’язковості, описами та наявними значеннями (режим зміни), для генерування значень форми"
"Field values as a JSON string, keyed by field name, for example {\"Name\":\"John\",\"Status\":1}": "Значення полів у вигляді рядка JSON із ключами за назвами полів, наприклад {\"Name\":\"John\",\"Status\":1}"
"Browser operation timed out; the front end returned no result": "Час очікування операції в браузері минув; зовнішній інтерфейс не повернув результат"
"Get system status": "Отримати стан системи"
"Gets current server metrics such as CPU usage, memory, process working set and system information, for health diagnostics": "Повертає поточні метрики сервера, як-от завантаження ЦП, пам’ять, робочий набір процесу та відомості про систему, для діагностики стану"
"AI is not enabled; skipped": "ШІ не ввімкнено; пропущено"
