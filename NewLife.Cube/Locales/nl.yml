"Generated {0} configuration field values (skipped {1}, failed {2}) and filled them into the form. Ask the user to review before submitting.": "{0} configuratieveldwaarden gegenereerd ({1} overgeslagen, {2} mislukt) en in het formulier ingevuld. Vraag de gebruiker om te controleren voordat deze verzendt."
"The current page is a system configuration form (such as Cube settings); you can help review and fill in configuration items.": "De huidige pagina is een formulier voor systeemconfiguratie (zoals Cube-instellingen); u kunt helpen bij het controleren en invullen van configuratie-items."
"Available tools: get_form_schema / fill_form / get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "Beschikbare hulpmiddelen: get_form_schema / fill_form / get_page_context / get_system_info / run_js (zie de functiedefinities; roep ze aan wanneer dat nodig is)"
"2. When the user asks to create, fill in or complete configuration, call get_form_schema first to inspect the items, then call fill_form to generate values (invent reasonable values for empty writable fields, keep existing values unless the user asks otherwise, and never fabricate or modify sensitive settings such as ApiKey/Secret/Token); finally ask the user to review before submitting": "2. Vraagt de gebruiker om configuratie aan te maken, in te vullen of aan te vullen, roep dan eerst get_form_schema aan om de items te bekijken en daarna fill_form om waarden te genereren (verzin redelijke waarden voor lege beschrijfbare velden, behoud bestaande waarden tenzij de gebruiker anders vraagt en verzin of wijzig nooit gevoelige instellingen zoals ApiKey/Secret/Token); vraag de gebruiker ten slotte om te controleren voordat deze verzendt"
"3. When the user asks about the content or current state of the page, call get_page_context, then give your analysis and conclusion": "3. Vraagt de gebruiker naar de inhoud of de huidige status van de pagina, roep dan get_page_context aan en geef daarna uw analyse en conclusie"
"4. When the user asks about system status or diagnostics, call get_system_info": "4. Vraagt de gebruiker naar de systeemstatus of diagnostiek, roep dan get_system_info aan"
"5. When the user asks to read or operate page elements, you may call run_js; explain any write operation (changing page content, submitting forms) to the user before running it": "5. Vraagt de gebruiker om pagina-elementen te lezen of te bedienen, dan mag u run_js aanroepen; leg elke schrijfbewerking (paginainhoud wijzigen, formulieren verzenden) eerst uit aan de gebruiker voordat u die uitvoert"
"6. Never invent data; ask the user for clarification when information is insufficient": "6. Verzin nooit gegevens; vraag de gebruiker om verduidelijking wanneer informatie ontbreekt"
"The tenant identifier carried by user [{0}] is invalid or unavailable. Check the tenant settings and try again.": "De tenant-id van gebruiker [{0}] is ongeldig of niet beschikbaar. Controleer de tenantinstellingen en probeer het opnieuw."
"User [{0}] did not carry a tenant identifier, so the tenant cannot be determined. Include the tenant information and try again.": "Gebruiker [{0}] heeft geen tenant-id meegestuurd, waardoor de tenant niet kan worden bepaald. Voeg de tenantinformatie toe en probeer het opnieuw."
"User [{0}] is not allowed to access the data of the current tenant. Switch tenant and try again.": "Gebruiker [{0}] mag de gegevens van de huidige tenant niet openen. Schakel van tenant en probeer het opnieuw."
"Not signed in or the session has expired!": "Niet aangemeld of de sessie is verlopen!"
