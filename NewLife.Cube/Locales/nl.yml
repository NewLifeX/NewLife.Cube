# 设置页字段、分类与导航（中文源文经英文规范键翻译）
"Auto (follow system)": "Automatisch (systeem volgen)"
"Cancel": "Annuleren"
"Queries {0}, executes {1}, elapsed {2:n0} ms": "Query's {0}, uitvoeringen {1}, verstreken {2:n0} ms"
"Show run time": "Uitvoeringstijd tonen"
"Avatar directory. Downloads remote avatars locally; defaults to the Avatars subdirectory, or Avatars next to the web root. Empty disables downloading": "Avatarmap. Downloadt externe avatars lokaal; standaard de submap Avatars, of Avatars naast de webhoofdmap. Leeg schakelt downloaden uit"
"Text avatar characters. Generates an SVG text avatar when no image exists; 1 to 3 characters. Uses the first N Chinese characters to keep the surname, or the initials of English words. Default 2": "Tekens voor tekstavatar. Genereert een SVG-tekstavatar als er geen afbeelding bestaat; 1 tot 3 tekens. Gebruikt de eerste N Chinese tekens om de achternaam te behouden, of de initialen van Engelse woorden. Standaard 2"
"Upload directory. Defaults to Uploads": "Uploadmap. Standaard Uploads"
"Web root directory. Defaults to wwwroot": "Webhoofdmap. Standaard wwwroot"
"Resource URL. CDN base such as https://sso.newlifex.com/content/; empty uses local resources": "Resource-URL. CDN-basis zoals https://sso.newlifex.com/content/; leeg gebruikt lokale resources"
"CORS origins. Other origins allowed to access this site; * allows any origin": "CORS-oorsprongen. Andere oorsprongen die toegang hebben tot deze site; * staat elke oorsprong toe"
"Iframe embedding. Empty allows the same domain only; SAMEORIGIN allows the same domain and port; ALLOWALL allows any domain": "Iframe-insluiting. Leeg staat alleen hetzelfde domein toe; SAMEORIGIN staat hetzelfde domein en poort toe; ALLOWALL staat elk domein toe"
"Share expiration. Lifetime of share tokens in seconds, default 7200": "Vervaltijd van delen. Levensduur van deeltokens in seconden, standaard 7200"
"Bot error code. Returns this error for crawlers, such as 404/500; 0 disables blocking": "Foutcode voor bots. Retourneert deze fout voor crawlers, zoals 404/500; 0 schakelt blokkeren uit"
"Force redirect. Target scheme and host for GET requests; * is supported in the host. Commonly used to force HTTPS, such as https://*:8081": "Geforceerde omleiding. Doelschema en host voor GET-verzoeken; * wordt ondersteund in de host. Wordt vaak gebruikt om HTTPS af te dwingen, zoals https://*:8081"
"Security mode. 0: off; 1: observe and log only; 2: block; 3: automatic (default; observes, bans repeated attackers, and temporarily blocks broad attacks with automatic rollback)": "Beveiligingsmodus. 0: uit; 1: alleen observeren en loggen; 2: blokkeren; 3: automatisch (standaard; observeert, blokkeert herhaalde aanvallers en blokkeert brede aanvallen tijdelijk met automatische terugdraaiing)"
"Auto-ban durations. Comma-separated seconds that increase with each trigger; empty uses 60,300,1800,7200,86400": "Duur van automatische blokkeringen. Door komma's gescheiden seconden die bij elke trigger toenemen; leeg gebruikt 60,300,1800,7200,86400"
"Trusted proxies. Forwarded headers are only trusted from these comma-separated IPs or CIDR ranges; empty keeps the legacy behavior of trusting all forwarded headers": "Vertrouwde proxy's. Doorgestuurde headers worden alleen vertrouwd van deze door komma's gescheiden IP's of CIDR-bereiken; leeg behoudt het oude gedrag waarbij alle doorgestuurde headers worden vertrouwd"
"Trusted proxy learning limit. When no trusted proxies are configured, private direct sources that send forwarded headers are learned up to this count; 0 disables learning (typically 2 for one data center, 4 for two)": "Leerlimiet voor vertrouwde proxy's. Wanneer er geen vertrouwde proxy's zijn geconfigureerd, worden private directe bronnen die doorgestuurde headers verzenden tot dit aantal geleerd; 0 schakelt leren uit (meestal 2 voor één datacenter, 4 voor twee)"
"Learned proxies. Maintained automatically; clear it to reset the learned list": "Geleerde proxy's. Wordt automatisch bijgehouden; wis het om de geleerde lijst opnieuw in te stellen"
"Default role. Defaults to the Normal User role": "Standaardrol. Standaard de rol Normale gebruiker"
"Allow password sign-in. Allows signing in with a username and password": "Aanmelden met wachtwoord toestaan. Staat aanmelden met een gebruikersnaam en wachtwoord toe"
"Allow plain-text passwords. Default true for legacy clients; false forces Challenge-Response encrypted passwords": "Onversleutelde wachtwoorden toestaan. Standaard true voor verouderde clients; false dwingt versleutelde Challenge-Response-wachtwoorden af"
"Allow registration. Allows registering with a username and password": "Registratie toestaan. Staat registreren met een gebruikersnaam en wachtwoord toe"
"Auto registration. Default true; after SSO sign-in an unknown local user is registered automatically. Enabled when either the global or the OAuth app setting is on": "Automatische registratie. Standaard true; na SSO-aanmelding wordt een onbekende lokale gebruiker automatisch geregistreerd. Ingeschakeld wanneer de globale instelling of die van de OAuth-app aan staat"
"Password complexity check. When enabled the sign-in page validates password strength; when disabled it only requires a non-empty password. Default true": "Controle op wachtwoordcomplexiteit. Indien ingeschakeld valideert de aanmeldpagina de wachtwoordsterkte; indien uitgeschakeld is alleen een niet-leeg wachtwoord vereist. Standaard true"
"Login failure limit. Bans sign-in after this many consecutive failures for the same user or IP, default 5": "Limiet voor aanmeldingsfouten. Blokkeert aanmelden na dit aantal opeenvolgende fouten voor dezelfde gebruiker of hetzelfde IP, standaard 5"
"Login ban duration. Seconds a risk-control ban lasts, default 300": "Duur van aanmeldingsblokkering. Seconden dat een risicobeheersblokkering duurt, standaard 300"
"Class C subnet ban threshold. Bans a /24 subnet such as 103.125.146.* after this many failures, default 10; 0 disables": "Drempel voor blokkering van klasse C-subnetten. Blokkeert een /24-subnet zoals 103.125.146.* na dit aantal fouten, standaard 10; 0 schakelt dit uit"
"Class B subnet ban threshold. Bans a /16 subnet such as 103.125.*.* after this many failures, default 20; 0 disables": "Drempel voor blokkering van klasse B-subnetten. Blokkeert een /16-subnet zoals 103.125.*.* na dit aantal fouten, standaard 20; 0 schakelt dit uit"
"Force bind by user name. Binds SSO users to local users with the same name without a provider prefix; intended for user centers": "Koppelen op gebruikersnaam afdwingen. Koppelt SSO-gebruikers aan lokale gebruikers met dezelfde naam zonder provider-voorvoegsel; bedoeld voor gebruikerscentra"
"Bind by user code. Binds SSO users to local users by user code": "Koppelen op gebruikerscode. Koppelt SSO-gebruikers aan lokale gebruikers op gebruikerscode"
"Bind by mobile. Binds SSO users to local users by mobile number": "Koppelen op mobiel nummer. Koppelt SSO-gebruikers aan lokale gebruikers op mobiel nummer"
"Bind by email. Binds SSO users to local users by email": "Koppelen op e-mailadres. Koppelt SSO-gebruikers aan lokale gebruikers op e-mailadres"
"Bind by nickname. Binds SSO users to local users by nickname; suitable for internal SSO, not for social networks with many duplicate names": "Koppelen op bijnaam. Koppelt SSO-gebruikers aan lokale gebruikers op bijnaam; geschikt voor interne SSO, niet voor sociale netwerken met veel dubbele namen"
"Use SSO roles. Keeps SSO roles after sign-in, default true; otherwise DefaultRole is used": "SSO-rollen gebruiken. Behoudt SSO-rollen na aanmelding, standaard true; anders wordt DefaultRole gebruikt"
"Use SSO departments. Keeps SSO departments after sign-in, default true": "SSO-afdelingen gebruiken. Behoudt SSO-afdelingen na aanmelding, standaard true"
"SSO role rules. Automatically upgrades the primary role after SSO sign-in; separate rules with commas. Format: source role+department wildcard=target role, for example Guest+Route*=Route Specialist": "SSO-rolregels. Waardeert de primaire rol automatisch op na SSO-aanmelding; scheid regels met komma's. Notatie: bronrol+afdelingsjokerteken=doelrol, bijvoorbeeld Guest+Route*=Route Specialist"
"Sign out everywhere. false signs out of this site only; true (default) also signs out of the SSO server": "Overal afmelden. false meldt alleen bij deze site af; true (standaard) meldt ook bij de SSO-server af"
"Allow multi-device sign-in. false kicks old devices on a new sign-in and revokes all tokens on sign-out; true (default) revokes only the current session": "Aanmelden op meerdere apparaten toestaan. false meldt oude apparaten af bij een nieuwe aanmelding en trekt bij afmelden alle tokens in; true (standaard) trekt alleen de huidige sessie in"
"Session timeout. Session lifetime after SSO sign-in during which the cookie can sign in again; default 0s": "Sessietime-out. Levensduur van de sessie na SSO-aanmelding waarin de cookie opnieuw kan aanmelden; standaard 0s"
"Token sliding refresh threshold. Refreshes the JWT and rewrites the cookie when its remaining lifetime falls below this many seconds; 0 disables sliding expiration": "Drempel voor glijdende tokenvernieuwing. Vernieuwt het JWT en herschrijft de cookie wanneer de resterende levensduur onder dit aantal seconden komt; 0 schakelt glijdende vervaldatum uit"
"User refresh period. Fetches user information once per period across SSO sign-ins, default 600 seconds": "Verversingsperiode voor gebruikers. Haalt gebruikersinformatie één keer per periode op bij SSO-aanmeldingen, standaard 600 seconden"
"JWT secret. Algorithm and key used to sign JWTs, such as HS256:ABCD1234": "JWT-geheim. Algoritme en sleutel voor het ondertekenen van JWT's, zoals HS256:ABCD1234"
"Token lifetime. Lifetime of the access token in seconds, default 7200": "Levensduur van token. Levensduur van het toegangstoken in seconden, standaard 7200"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default true": "Token in cookie opslaan. Leest het token uit de cookie wanneer de verzoekheader er geen bevat, standaard true"
"Validate attachment access. Requires sign-in to access attachments, default true": "Toegang tot bijlagen valideren. Vereist aanmelding om bijlagen te openen, standaard true"
"Public attachment categories. Categories accessible without sign-in, comma-separated, such as markdown,avatar. Applies when ValidateAttachment is true": "Openbare bijlagencategorieën. Categorieën die zonder aanmelding toegankelijk zijn, door komma's gescheiden, zoals markdown,avatar. Geldt wanneer ValidateAttachment true is"
"Private attachment categories. Categories only the uploader can access, comma-separated. Applies when ValidateAttachment is true": "Privé-bijlagencategorieën. Categorieën die alleen de uploader kan openen, door komma's gescheiden. Geldt wanneer ValidateAttachment true is"
"SSO redirect allowlist. Domains allowed to receive the JWT after sign-in, comma-separated with wildcard prefixes such as *.company.com. Empty allows the same site only; other origins are rejected and sent back to the home page": "SSO-omleidingslijst. Domeinen die na aanmelding het JWT mogen ontvangen, door komma's gescheiden met jokertekens als voorvoegsel, zoals *.company.com. Leeg staat alleen dezelfde site toe; andere oorsprongen worden geweigerd en teruggestuurd naar de startpagina"
"External authentication URL. When local authentication fails, credentials are verified by this endpoint; on success the local user is created or updated and signed in": "URL voor externe verificatie. Wanneer lokale verificatie mislukt, worden inloggegevens door dit eindpunt geverifieerd; bij succes wordt de lokale gebruiker aangemaakt of bijgewerkt en aangemeld"
"Start page. First content page opened after entering the admin console": "Startpagina. Eerste inhoudspagina die wordt geopend na het betreden van de beheerconsole"
"Theme. Content page theme, ACE/layui": "Thema. Thema van de inhoudspagina, ACE/layui"
"Skin. Outer frame layout, ACE/layui": "Uiterlijk. Indeling van het buitenframe, ACE/layui"
"Login tip. Empty hides the tip on the sign-in page": "Aanmeldingstip. Leeg verbergt de tip op de aanmeldpagina"
"Login logo. Empty uses the default logo": "Aanmeldingslogo. Leeg gebruikt het standaardlogo"
"Login background. Image URL; empty uses the default background": "Aanmeldingsachtergrond. Afbeeldings-URL; leeg gebruikt de standaardachtergrond"
"Form group layout. 3/2/1 columns on large/medium/small screens, form-group col-xs-12 col-sm-6 col-lg-4": "Indeling van formuliergroepen. 3/2/1 kolommen op grote/middelgrote/kleine schermen, form-group col-xs-12 col-sm-6 col-lg-4"
"Bootstrap select. Nicer drop-downs with a rendering cost": "Bootstrap-select. Mooiere vervolgkeuzelijsten met extra weergavekosten"
"Maximum drop-down items. Maximum options in a related drop-down on forms, default 50; larger lists fall back to a text box": "Maximaal aantal items in vervolgkeuzelijsten. Maximaal aantal opties in een gerelateerde vervolgkeuzelijst op formulieren, standaard 50; grotere lijsten vallen terug op een tekstvak"
"Copyright. Empty hides the copyright; variables now/runtime/framework are supported, and now accepts formats such as {now:yyyy}": "Auteursrecht. Leeg verbergt de auteursrechtvermelding; variabelen now/runtime/framework worden ondersteund en now accepteert notaties zoals {now:yyyy}"
"Filing number. Empty hides the filing information": "Registratienummer. Leeg verbergt de registratiegegevens"
"Enable new UI": "Nieuwe UI inschakelen"
"ECharts theme. Chart theme": "ECharts-thema. Grafiekthema"
"Title suffix. Appends the system name to page titles, default true": "Titelsuffix. Voegt de systeemnaam toe aan paginatitels, standaard true"
"Table double-click. Enables row double-click on list pages, default true": "Dubbelklikken in tabellen. Schakelt dubbelklikken op rijen in lijsten in, standaard true"
"Table style. Light: minimal thin lines; Standard: clear row lines (default); Grid: full cell borders": "Tabelstijl. Licht: minimale dunne lijnen; Standaard: duidelijke rijlijnen (standaard); Raster: volledige celranden"
"Table density. Compact: dense and information-rich (default); Normal: relaxed": "Tabeldichtheid. Compact: dicht en informatierijk (standaard); Normaal: ruim"
"Stardust web. Stardust console URL; supports direct links to /trace?id={traceId} or /graph?id={traceId}": "Stardust-web. URL van de Stardust-console; ondersteunt directe links naar /trace?id={traceId} of /graph?id={traceId}"
"AI master switch. Enables AI features such as log analysis and notification polishing, default false": "AI-hoofdschakelaar. Schakelt AI-functies in zoals loganalyse en het verfijnen van meldingen, standaard false"
"AI provider. Supports NewLife, Ollama, DeepSeek, DashScope, OpenAI and others; default NewLife": "AI-provider. Ondersteunt NewLife, Ollama, DeepSeek, DashScope, OpenAI en andere; standaard NewLife"
"AI endpoint. Defaults to https://ai.newlifex.com for NewLife": "AI-eindpunt. Standaard https://ai.newlifex.com voor NewLife"
"AI ApiKey. Defaults to sk-CubeAI2026 for NewLife": "AI ApiKey. Standaard sk-CubeAI2026 voor NewLife"
"AI default model. Defaults to newlife-flash for NewLife": "Standaard AI-model. Standaard newlife-flash voor NewLife"
"AI default deep reasoning. Enables think mode for analysis and chat by default; false means fast responses": "Diep redeneren standaard voor AI. Schakelt standaard de denkmodus in voor analyse en chat; false betekent snelle antwoorden"
"AI color scheme. Fills the primary and secondary colors from a preset": "AI-kleurschema. Vult de primaire en secundaire kleur vanuit een voorinstelling"
"AI primary color. Main color of the launcher, panel header and user bubbles; default NewLife green #2ecc71": "Primaire AI-kleur. Hoofdkleur van de launcher, paneelkop en gebruikersbubbels; standaard NewLife-groen #2ecc71"
"AI secondary color. Gradient end color, default dark green #1e8e3e": "Secundaire AI-kleur. Eindkleur van het verloop, standaard donkergroen #1e8e3e"
"OAuth server. Enables the OAuth 2.0 server that provides SSO for other applications": "OAuth-server. Schakelt de OAuth 2.0-server in die SSO biedt voor andere toepassingen"
"File manager. Enables backend file management (browse, upload, download, delete); this carries security risks": "Bestandsbeheer. Schakelt bestandsbeheer in de backend in (bladeren, uploaden, downloaden, verwijderen); dit brengt beveiligingsrisico's met zich mee"
"Multi-tenancy. Enables tenants; tenant mode cannot access system administration and platform mode cannot access tenant pages": "Multi-tenancy. Schakelt tenants in; tenantmodus heeft geen toegang tot systeembeheer en platformmodus heeft geen toegang tot tenantpagina's"
"Tenant query policy. DenyWithEmpty: return an empty set without tenant context; ThrowOnMissingTenant: throw an explicit error": "Tenantquerybeleid. DenyWithEmpty: een lege set retourneren zonder tenantcontext; ThrowOnMissingTenant: een expliciete fout genereren"
"User online. 0: do not record; 1: signed-in users only; 2: all visitors (default)": "Gebruikers online. 0: niet registreren; 1: alleen aangemelde gebruikers; 2: alle bezoekers (standaard)"
"User statistics. Records user visits, default true": "Gebruikersstatistieken. Registreert bezoeken van gebruikers, standaard true"
"Enable SMS. SMS verification codes and system notifications, default false": "Sms inschakelen. Sms-verificatiecodes en systeemmeldingen, standaard false"
"Enable email. Email verification codes and system notifications, default false": "E-mail inschakelen. E-mailverificatiecodes en systeemmeldingen, standaard false"
"Require email verification. Users must activate their email before signing in and must provide one when registering, default false": "E-mailverificatie vereisen. Gebruikers moeten hun e-mail activeren voordat ze zich aanmelden en moeten er een opgeven bij registratie, standaard false"
"Require mobile verification. Users must activate their mobile before signing in and must provide one when registering, default false": "Mobiele verificatie vereisen. Gebruikers moeten hun mobiele nummer activeren voordat ze zich aanmelden en moeten er een opgeven bij registratie, standaard false"
"Captcha scenarios. Bit mask: 0: off; 1: sign-in; 2: registration; 4: verification code requests (anti-SMS-bombing); combine with 3 for sign-in and registration. Mandatory scenarios are never exempted, default 0": "Captcha-scenario's. Bitmasker: 0: uit; 1: aanmelden; 2: registratie; 4: aanvragen van verificatiecodes (anti-sms-bombardement); combineer met 3 voor aanmelden en registratie. Verplichte scenario's worden nooit vrijgesteld, standaard 0"
"Risk-adaptive captcha. Disabled when CaptchaScene is 0; when enabled it detects unsafe environments and requires a captcha, default true": "Risicogebaseerde captcha. Uitgeschakeld wanneer CaptchaScene 0 is; indien ingeschakeld detecteert het onveilige omgevingen en vereist een captcha, standaard true"
"Captcha risk threshold. Requires a captcha when the risk score reaches this value: 0: intranet; 1: internet; 2: internet with recent failures; 3: banned. Default 2": "Risicodrempel voor captcha. Vereist een captcha wanneer de risicoscore deze waarde bereikt: 0: intranet; 1: internet; 2: internet met recente fouten; 3: geblokkeerd. Standaard 2"
"Trusted device lifetime. Days during which previously successful devices skip adaptive captchas, default 30": "Levensduur van vertrouwde apparaten. Aantal dagen waarin eerder geslaagde apparaten adaptieve captcha's overslaan, standaard 30"
"Enable MFA. Allows users to enable TOTP multi-factor authentication; an enhanced feature, default false": "MFA inschakelen. Staat gebruikers toe TOTP-multifactorauthenticatie in te schakelen; een uitgebreide functie, standaard false"
"File storage serving. Responds to file download requests from other nodes, default true": "Bestandsopslag aanbieden. Reageert op downloadverzoeken van andere knooppunten, standaard true"
"File storage fetch. Pulls new files published by other nodes, default true": "Bestandsopslag ophalen. Haalt nieuwe bestanden op die andere knooppunten publiceren, standaard true"
"File fetch timeout. Maximum milliseconds to wait for other nodes when a file is missing locally, default 5000": "Time-out voor bestandsophalen. Maximaal aantal milliseconden om op andere knooppunten te wachten wanneer een bestand lokaal ontbreekt, standaard 5000"
"Attachment storage. Local disk, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu or EasyIO; default Local": "Bijlagenopslag. Lokale schijf, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu of EasyIO; standaard Local"
"Object storage server. S3-compatible endpoint for OSS/COS/Qiniu, such as oss-cn-beijing.aliyuncs.com": "Objectopslagserver. S3-compatibel eindpunt voor OSS/COS/Qiniu, zoals oss-cn-beijing.aliyuncs.com"
"Object storage bucket. Bucket name for OSS/COS/Qiniu": "Objectopslagbucket. Bucketnaam voor OSS/COS/Qiniu"
"Object storage region. S3 signing scope, such as cn-beijing / ap-beijing / cn-east-1": "Objectopslagregio. S3-ondertekeningsbereik, zoals cn-beijing / ap-beijing / cn-east-1"
"Object storage app ID. AccessKeyId": "App-id voor objectopslag. AccessKeyId"
"Object storage app secret. AccessKeySecret": "App-geheim voor objectopslag. AccessKeySecret"
"Data retention. Days to keep audit and OAuth logs, default 30": "Bewaring van gegevens. Aantal dagen dat audit- en OAuth-logboeken worden bewaard, standaard 30"
"File retention. Days to keep backup files, default 15": "Bewaring van bestanden. Aantal dagen dat back-upbestanden worden bewaard, standaard 15"
"Retention size floor. Files smaller than this (KB) are never deleted even after the retention period, default 1024K": "Ondergrens voor bewaringsgrootte. Bestanden kleiner dan deze waarde (KB) worden nooit verwijderd, zelfs niet na de bewaarperiode, standaard 1024K"
"Maximum export rows. Maximum rows a page may export, default 10_000_000": "Maximaal aantal exportrijen. Maximaal aantal rijen dat een pagina mag exporteren, standaard 10_000_000"
"Maximum backup rows. Maximum rows a page may back up, default 10_000_000": "Maximaal aantal back-uprijen. Maximaal aantal rijen dat een pagina mag back-uppen, standaard 10_000_000"
"API prefixes. Comma- or semicolon-separated prefixes such as /api,/api/v1; matching requests are forwarded to the real route without the prefix": "API-voorvoegsels. Door komma's of puntkomma's gescheiden voorvoegsels zoals /api,/api/v1; overeenkomende verzoeken worden zonder het voorvoegsel naar de echte route doorgestuurd"
"Password strength. * means unrestricted; by default at least 8 characters with digits, upper/lower case letters and symbols. Simple form: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$": "Wachtwoordsterkte. * betekent onbeperkt; standaard minimaal 8 tekens met cijfers, hoofd- en kleine letters en symbolen. Eenvoudige vorm: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$"
"Cookie mode. Default SameSite mode for token cookies (-1 Unspecified, 0 None, 1 Lax, 2 Strict)": "Cookiemodus. Standaard SameSite-modus voor tokencookies (-1 Unspecified, 0 None, 1 Lax, 2 Strict)"
"Cookie domain. Writes cookies to a parent domain; empty uses the current domain. A top-level domain requires HTTPS and prevents plain HTTP from writing same-name keys on the local domain": "Cookiedomein. Schrijft cookies naar een bovenliggend domein; leeg gebruikt het huidige domein. Een topleveldomein vereist HTTPS en voorkomt dat gewone HTTP sleutels met dezelfde naam op het lokale domein schrijft"
"Activation URL. Front-end activation page URL used in email activation links, such as https://xxx/activate; empty builds /activate from the request host": "Activerings-URL. URL van de front-endactiveringspagina die in e-mailactiveringslinks wordt gebruikt, zoals https://xxx/activate; leeg bouwt /activate op basis van de aanvraaghost"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default false": "Token in cookie opslaan. Leest het token uit de cookie wanneer de verzoekheader er geen bevat, standaard false"
"Password strength. * means unrestricted; the simple form defaults to 5 to 32 characters of any type. The full form requires at least 8 characters with digits, upper/lower case letters and symbols: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$": "Wachtwoordsterkte. * betekent onbeperkt; de eenvoudige vorm staat standaard 5 tot 32 tekens van elk type toe. De volledige vorm vereist minimaal 8 tekens met cijfers, hoofd- en kleine letters en symbolen: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$"
