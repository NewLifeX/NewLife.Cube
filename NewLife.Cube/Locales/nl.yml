"Record does not exist": "Record bestaat niet"
"Get data context": "Gegevenscontext ophalen"
"Gets the data context of the current page: the current record with its field metadata, or a summary and sample of the current query result, for analysis": "Haalt de gegevenscontext van de huidige pagina op: het huidige record met zijn veldmetadata, of een samenvatting en voorbeeld van het huidige queryresultaat, ter analyse"
"Gets the form schema of the current entity, including field names, types, enum values, required flags, descriptions and existing values (edit mode), for generating form values": "Haalt het formulierschema van de huidige entiteit op, inclusief veldnamen, typen, enumwaarden, verplichtvlaggen, beschrijvingen en bestaande waarden (bewerkmodus), om formulierwaarden te genereren"
"Field values as a JSON string, keyed by field name, for example {\"Name\":\"John\",\"Status\":1}": "Veldwaarden als JSON-tekenreeks, met de veldnaam als sleutel, bijvoorbeeld {\"Name\":\"John\",\"Status\":1}"
"Browser operation timed out; the front end returned no result": "Browserbewerking is verlopen; de front-end heeft geen resultaat geretourneerd"
