"Gets current server metrics such as CPU usage, memory, process working set and system information, for health diagnostics": "Haalt actuele servermetrieken op, zoals CPU-gebruik, geheugen, werkset van processen en systeeminformatie, voor gezondheidsdiagnostiek"
"AI is not enabled; skipped": "AI is niet ingeschakeld; overgeslagen"
