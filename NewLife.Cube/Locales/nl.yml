"Runs JavaScript in the current page and returns the result; can read or modify page elements, for example document.title or document.querySelector('input[name=Name]').value": "Voert JavaScript uit in de huidige pagina en retourneert het resultaat; kan pagina-elementen lezen of wijzigen, bijvoorbeeld document.title of document.querySelector('input[name=Name]').value"
"JavaScript code to run in the current page": "JavaScript-code die in de huidige pagina wordt uitgevoerd"
"Get page context": "Paginacontext ophalen"
"Gets the main data and structure of the current page (title, tables, forms and so on). Uses the server-side context when the page provides one; otherwise collects the page content from the user's browser": "Haalt de belangrijkste gegevens en structuur van de huidige pagina op (titel, tabellen, formulieren enzovoort). Gebruikt de context aan serverzijde als de pagina die biedt; verzamelt anders de paginainhoud uit de browser van de gebruiker"
"Get form schema": "Formulierschema ophalen"
"Gets the schema of the current form, including field names, types, descriptions and current values, for generating form values": "Haalt het schema van het huidige formulier op, inclusief veldnamen, typen, beschrijvingen en huidige waarden, om formulierwaarden te genereren"
"Form mode: add or edit": "Formuliermodus: toevoegen of bewerken"
"Fill form": "Formulier invullen"
"Generates form field values and fills them into the front-end form. Nothing is written to the database until the user confirms": "Genereert waarden voor formuliervelden en vult deze in het formulier in de front-end in. Er wordt niets naar de database geschreven totdat de gebruiker bevestigt"
"Field values as a JSON string, keyed by field name": "Veldwaarden als JSON-tekenreeks, met de veldnaam als sleutel"
"No valid field value dictionary was received": "Er is geen geldige verzameling veldwaarden ontvangen"
"[fill_form invalid argument] No valid field value dictionary was received. Call get_form_schema first to get the field structure, then pass the values parameter as {\"field\":value}.": "[fill_form ongeldig argument] Er is geen geldige verzameling veldwaarden ontvangen. Roep eerst get_form_schema aan om de veldstructuur op te halen en geef daarna de parameter values door als {\"field\":value}."
"Generated {0} form field values (skipped {1}, failed {2}) and filled them into the form. Ask the user to review before submitting.": "{0} formulierveldwaarden gegenereerd ({1} overgeslagen, {2} mislukt) en in het formulier ingevuld. Vraag de gebruiker om te controleren voordat deze verzendt."
" descending": " aflopend"
