"You are a system operations expert. Analyze the following error logs and report:\n1. Error categories, ordered by frequency\n2. The most likely root cause\n3. Recommended troubleshooting steps\n\nOutput the analysis report directly without extra explanation.": "U bent een expert in systeembeheer. Analyseer de volgende foutlogboeken en rapporteer:\n1. Foutcategorieën, geordend op frequentie\n2. De meest waarschijnlijke grondoorzaak\n3. Aanbevolen stappen voor probleemoplossing\n\nGeef het analyserapport rechtstreeks weer zonder extra uitleg."
"Daily log report {0}": "Dagelijks lograpport {0}"
"Analyzed {0} log entries": "{0} logboekitems geanalyseerd"
"每天定时汇总过去 24 小时的系统日志，由 AI 生成摘要后通过通知系统推送给管理员": "Vat dagelijks de systeemlogboeken van de afgelopen 24 uur samen en stuurt de door AI gegenereerde samenvatting naar beheerders"
"You are an information security expert. Based on the following security data, write a weekly security report covering:\n1. Overall security posture\n2. Risks that need attention\n3. Recommended security measures\n\nOutput the report directly without extra explanation.": "U bent een expert in informatiebeveiliging. Schrijf op basis van de volgende beveiligingsgegevens een wekelijks beveiligingsrapport over:\n1. De algehele beveiligingspositie\n2. Risico's die aandacht vereisen\n3. Aanbevolen beveiligingsmaatregelen\n\nGeef het rapport rechtstreeks weer zonder extra uitleg."
