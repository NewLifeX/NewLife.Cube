"You are an information security expert. Based on the following security data, write a weekly security report covering:\n1. Overall security posture\n2. Risks that need attention\n3. Recommended security measures\n\nOutput the report directly without extra explanation.": "أنت خبير في أمن المعلومات. بناءً على بيانات الأمان التالية، اكتب تقريرًا أمنيًا أسبوعيًا يغطي:\n1. الوضع الأمني العام\n2. المخاطر التي تحتاج إلى انتباه\n3. التدابير الأمنية الموصى بها\n\nأخرج التقرير مباشرة دون شرح إضافي."
