"You are a system operations expert. Based on the following runtime metrics, produce a health diagnosis report:\nCover bottlenecks, whether capacity should be expanded, and any risks worth attention.\nOutput the diagnosis report directly without extra explanation.": "أنت خبير في تشغيل الأنظمة. بناءً على مقاييس التشغيل التالية، أنتج تقرير تشخيص للحالة الصحية:\nغطِّ نقاط الاختناق، وما إذا كان ينبغي توسيع السعة، وأي مخاطر تستحق الانتباه.\nأخرج تقرير التشخيص مباشرة دون شرح إضافي."
"Script must not be empty": "يجب ألا يكون السكربت فارغًا"
"Browser channel is not ready (Writer not injected)": "قناة المتصفح غير جاهزة (لم يتم حقن Writer)"
"Run page script": "تشغيل سكربت الصفحة"
"Runs JavaScript in the current page and returns the result; can read or modify page elements, for example document.title or document.querySelector('input[name=Name]').value": "يشغّل JavaScript في الصفحة الحالية ويعيد النتيجة؛ يمكنه قراءة عناصر الصفحة أو تعديلها، مثل document.title أو document.querySelector('input[name=Name]').value"
"JavaScript code to run in the current page": "تعليمة JavaScript البرمجية لتشغيلها في الصفحة الحالية"
"Get page context": "الحصول على سياق الصفحة"
"Gets the main data and structure of the current page (title, tables, forms and so on). Uses the server-side context when the page provides one; otherwise collects the page content from the user's browser": "يجلب البيانات الرئيسية وبنية الصفحة الحالية (العنوان والجداول والنماذج وما إلى ذلك). يستخدم السياق من جانب الخادم عندما توفره الصفحة؛ وإلا يجمع محتوى الصفحة من متصفح المستخدم"
"Get form schema": "الحصول على مخطط النموذج"
"Gets the schema of the current form, including field names, types, descriptions and current values, for generating form values": "يجلب مخطط النموذج الحالي، بما في ذلك أسماء الحقول وأنواعها وأوصافها وقيمها الحالية، لتوليد قيم النموذج"
"Form mode: add or edit": "وضع النموذج: إضافة أو تعديل"
"Fill form": "تعبئة النموذج"
"Generates form field values and fills them into the front-end form. Nothing is written to the database until the user confirms": "يولّد قيم حقول النموذج ويعبّئها في نموذج الواجهة الأمامية. لا يُكتب أي شيء في قاعدة البيانات حتى يؤكد المستخدم"
"Field values as a JSON string, keyed by field name": "قيم الحقول كنص JSON، مفهرسة باسم الحقل"
"No valid field value dictionary was received": "لم يتم استلام قاموس قيم حقول صالح"
"[fill_form invalid argument] No valid field value dictionary was received. Call get_form_schema first to get the field structure, then pass the values parameter as {\"field\":value}.": "[fill_form invalid argument] لم يتم استلام قاموس قيم حقول صالح. استدعِ get_form_schema أولًا للحصول على بنية الحقول، ثم مرّر المعلمة values بالشكل {\"field\":value}."
"Generated {0} form field values (skipped {1}, failed {2}) and filled them into the form. Ask the user to review before submitting.": "تم توليد {0} من قيم حقول النموذج (تم تخطي {1}، وفشل {2}) وتعبئتها في النموذج. اطلب من المستخدم المراجعة قبل الإرسال."
" descending": " تنازلي"
"No current record (add mode). Save first or switch to the detail/edit page.": "لا يوجد سجل حالي (وضع الإضافة). احفظ أولًا أو انتقل إلى صفحة التفاصيل/التعديل."
"Record does not exist": "السجل غير موجود"
"Get data context": "الحصول على سياق البيانات"
"Gets the data context of the current page: the current record with its field metadata, or a summary and sample of the current query result, for analysis": "يجلب سياق بيانات الصفحة الحالية: السجل الحالي مع البيانات الوصفية لحقوله، أو ملخص وعينة من نتيجة الاستعلام الحالية، لأغراض التحليل"
