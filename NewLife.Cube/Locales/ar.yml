"Malformed token: {0}": "رمز مشوّه: {0}"
"Initialize ManageProvider": "تهيئة ManageProvider"
"New menus added, permission check required": "تمت إضافة قوائم جديدة، يلزم فحص الأذونات"
"Cleaned up {0:n0} expired ban rows": "تم تنظيف {0:n0} سجل حظر منتهي الصلاحية"
"Deleted OAuthLog rows before [{0}]: {1:n0}": "تم حذف سجلات OAuthLog قبل [{0}]: {1:n0}"
"Deleted AppLog rows before [{0}]: {1:n0}": "تم حذف سجلات AppLog قبل [{0}]: {1:n0}"
"Deleted Log rows before [{0}]: {1:n0}": "تم حذف سجلات Log قبل [{0}]: {1:n0}"
"DataProtection persists keys in database, Key={0}": "يحفظ DataProtection المفاتيح في قاعدة البيانات، Key={0}"
"Deleted expired data {0}": "تم حذف البيانات المنتهية الصلاحية {0}"
"[CloseAccount] cleanup {0} failed (user {1}): {2}": "[CloseAccount] فشل التنظيف {0} (المستخدم {1}): {2}"
"External sign-up": "تسجيل خارجي"
"Attachment storage: {0}": "تخزين المرفقات: {0}"
"Control": "تحكم"
"Enable": "تمكين"
"Disable": "تعطيل"
"Distributed lock shows the job is still running, skip this round": "يُظهر القفل الموزع أن المهمة لا تزال قيد التشغيل، تم تخطي هذه الجولة"
"Security ban {0}: {1}, unban at {2:yyyy-MM-dd HH:mm:ss}": "حظر أمني {0}: {1}، رفع الحظر في {2:yyyy-MM-dd HH:mm:ss}"
" (source: {0})": " (المصدر: {0})"
"[TenantBind] user [{0}] already has a valid tenant, refuse to auto-bind to tenant [{1}]": "[TenantBind] المستخدم [{0}] لديه مستأجر صالح بالفعل، تم رفض الربط التلقائي بالمستأجر [{1}]"
"[{0}] user auto-bound to tenant [{1}]": "[{0}] تم ربط المستخدم تلقائيًا بالمستأجر [{1}]"
"Auto bind": "ربط تلقائي"
"[{0}] {1} failed! {2}": "[{0}] فشل {1}! {2}"
"OAuth callback registration": "تسجيل رد اتصال OAuth"
"Close account": "إغلاق الحساب"
"[CloseAccount] handler {0} failed to clean up (user {1}): {2}": "[CloseAccount] فشل المعالج {0} في التنظيف (المستخدم {1}): {2}"
"API prefix middleware loaded prefixes: {0}": "حمّلت البرمجية الوسيطة لبادئات API البادئات: {0}"
"Rule: {0}": "القاعدة: {0}"
"Redirect: {0}": "إعادة التوجيه: {0}"
"[{0}] error [{1}] {2}": "[{0}] خطأ [{1}] {2}"
