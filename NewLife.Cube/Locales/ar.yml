"Generated {0} configuration field values (skipped {1}, failed {2}) and filled them into the form. Ask the user to review before submitting.": "تم توليد {0} من قيم حقول التهيئة (تم تخطي {1}، وفشل {2}) وتعبئتها في النموذج. اطلب من المستخدم المراجعة قبل الإرسال."
"The current page is a system configuration form (such as Cube settings); you can help review and fill in configuration items.": "الصفحة الحالية نموذج تهيئة للنظام (مثل إعدادات Cube)؛ يمكنك المساعدة في مراجعة عناصر التهيئة وتعبئتها."
"Available tools: get_form_schema / fill_form / get_page_context / get_system_info / run_js (see the function definitions; call them when needed)": "الأدوات المتاحة: get_form_schema / fill_form / get_page_context / get_system_info / run_js (راجع تعريفات الدوال؛ استدعها عند الحاجة)"
"2. When the user asks to create, fill in or complete configuration, call get_form_schema first to inspect the items, then call fill_form to generate values (invent reasonable values for empty writable fields, keep existing values unless the user asks otherwise, and never fabricate or modify sensitive settings such as ApiKey/Secret/Token); finally ask the user to review before submitting": "2. عندما يطلب المستخدم إنشاء التهيئة أو تعبئتها أو إكمالها، استدعِ get_form_schema أولًا لفحص العناصر، ثم استدعِ fill_form لتوليد القيم (ابتكر قيمًا معقولة للحقول الفارغة القابلة للكتابة، واحتفظ بالقيم الموجودة ما لم يطلب المستخدم خلاف ذلك، ولا تختلق أو تعدّل الإعدادات الحساسة مثل ApiKey/Secret/Token)؛ وأخيرًا اطلب من المستخدم المراجعة قبل الإرسال"
"3. When the user asks about the content or current state of the page, call get_page_context, then give your analysis and conclusion": "3. عندما يسأل المستخدم عن محتوى الصفحة أو حالتها الحالية، استدعِ get_page_context"
"4. When the user asks about system status or diagnostics, call get_system_info": "4. عندما يسأل المستخدم عن حالة النظام أو التشخيص، استدعِ get_system_info"
"5. When the user asks to read or operate page elements, you may call run_js; explain any write operation (changing page content, submitting forms) to the user before running it": "5. عندما يطلب المستخدم قراءة عناصر الصفحة أو التعامل معها، يمكنك استدعاء run_js؛ اشرح للمستخدم أي عملية كتابة (تغيير محتوى الصفحة، إرسال النماذج) قبل تنفيذها"
"6. Never invent data; ask the user for clarification when information is insufficient": "6. لا تختلق البيانات أبدًا؛ اطلب من المستخدم توضيحًا عندما تكون المعلومات غير كافية"
"The tenant identifier carried by user [{0}] is invalid or unavailable. Check the tenant settings and try again.": "معرّف المستأجر الذي يحمله المستخدم [{0}] غير صالح أو غير متاح. تحقق من إعدادات المستأجر وحاول مرة أخرى."
"User [{0}] did not carry a tenant identifier, so the tenant cannot be determined. Include the tenant information and try again.": "لم يحمل المستخدم [{0}] معرّف مستأجر، لذا لا يمكن تحديد المستأجر. أضف معلومات المستأجر وحاول مرة أخرى."
"User [{0}] is not allowed to access the data of the current tenant. Switch tenant and try again.": "لا يُسمح للمستخدم [{0}] بالوصول إلى بيانات المستأجر الحالي. بدّل المستأجر وحاول مرة أخرى."
