"You are a system operations expert. Analyze the following error logs and report:\n1. Error categories, ordered by frequency\n2. The most likely root cause\n3. Recommended troubleshooting steps\n\nOutput the analysis report directly without extra explanation.": "أنت خبير في تشغيل الأنظمة. حلّل سجلات الأخطاء التالية وقدّم تقريرًا عن:\n1. فئات الأخطاء مرتبة حسب التكرار\n2. السبب الجذري الأكثر ترجيحًا\n3. خطوات استكشاف الأخطاء الموصى بها\n\nأخرج تقرير التحليل مباشرة دون شرح إضافي."
