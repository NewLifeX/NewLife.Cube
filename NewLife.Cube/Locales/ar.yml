"Gets current server metrics such as CPU usage, memory, process working set and system information, for health diagnostics": "يجلب مقاييس الخادم الحالية مثل استخدام CPU والذاكرة ومجموعة عمل العملية ومعلومات النظام، لتشخيص الحالة الصحية"
