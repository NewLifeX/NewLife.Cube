"Cube MVC/Razor layer of the NewLife framework: ASP.NET Core MVC hosting, Razor view templates, user permission management, SSO sign-in, OAuth server, data export and runtime localization, validated with 10 billion rows in a single table.": "طبقة Cube MVC/Razor في إطار NewLife: استضافة ASP.NET Core MVC، وقوالب عرض Razor، وإدارة صلاحيات المستخدمين، وتسجيل الدخول عبر SSO، وخادم OAuth، وتصدير البيانات والتعريب في وقت التشغيل، مع التحقق بجدول واحد يحتوي 10 مليارات صف."
"Cube Web API library of the NewLife framework": "مكتبة Cube Web API في إطار NewLife"
"Cube Web API library of the NewLife framework: entity controllers, permission and menu management, field metadata, OAuth server, JWT authentication and runtime localization. Built for front-end/back-end separation with Vue, Blazor and Ant Design front ends, validated with 10 billion rows in a single table.": "مكتبة Cube Web API في إطار NewLife: وحدات تحكم الكيانات، وإدارة الصلاحيات والقوائم، وبيانات تعريف الحقول، وخادم OAuth، ومصادقة JWT، والتعريب في وقت التشغيل. مصممة لفصل الواجهة الأمامية عن الخلفية مع واجهات Vue وBlazor وAnt Design، ومتحققة بجدول واحد يحتوي 10 مليارات صف."
