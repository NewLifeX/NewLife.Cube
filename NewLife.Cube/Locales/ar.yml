# 设置页字段、分类与导航（中文源文经英文规范键翻译）
"Auto (follow system)": "تلقائي (حسب النظام)"
"Cancel": "إلغاء"
"Queries {0}, executes {1}, elapsed {2:n0} ms": "استعلامات {0}، تنفيذات {1}، استغرق {2:n0} ملي ثانية"
"Show run time": "إظهار وقت التنفيذ"
"Avatar directory. Downloads remote avatars locally; defaults to the Avatars subdirectory, or Avatars next to the web root. Empty disables downloading": "دليل الصور الرمزية. ينزّل الصور الرمزية البعيدة محليًا؛ الافتراضي هو الدليل الفرعي Avatars، أو Avatars بجوار جذر الويب. ترك الحقل فارغًا يعطّل التنزيل"
"Text avatar characters. Generates an SVG text avatar when no image exists; 1 to 3 characters. Uses the first N Chinese characters to keep the surname, or the initials of English words. Default 2": "أحرف الصورة الرمزية النصية. تُنشئ صورة رمزية نصية SVG عند عدم وجود صورة؛ من 1 إلى 3 أحرف. تُستخدم أول N من الأحرف الصينية للحفاظ على اسم العائلة، أو الأحرف الأولى من الكلمات الإنجليزية. الافتراضي 2"
"Upload directory. Defaults to Uploads": "دليل الرفع. الافتراضي Uploads"
"Web root directory. Defaults to wwwroot": "دليل جذر الويب. الافتراضي wwwroot"
"Resource URL. CDN base such as https://sso.newlifex.com/content/; empty uses local resources": "عنوان URL للموارد. أساس CDN مثل https://sso.newlifex.com/content/؛ فارغ يستخدم الموارد المحلية"
"CORS origins. Other origins allowed to access this site; * allows any origin": "أصول CORS. الأصول الأخرى المسموح لها بالوصول إلى هذا الموقع؛ * يسمح بأي أصل"
"Iframe embedding. Empty allows the same domain only; SAMEORIGIN allows the same domain and port; ALLOWALL allows any domain": "تضمين Iframe. فارغ يسمح بالنطاق نفسه فقط؛ SAMEORIGIN يسمح بالنطاق والمنفذ نفسيهما؛ ALLOWALL يسمح بأي نطاق"
"Share expiration. Lifetime of share tokens in seconds, default 7200": "انتهاء صلاحية المشاركة. مدة صلاحية رموز المشاركة بالثواني، الافتراضي 7200"
"Bot error code. Returns this error for crawlers, such as 404/500; 0 disables blocking": "رمز خطأ الزواحف. يُرجع هذا الخطأ لزواحف الويب، مثل 404/500؛ 0 يعطّل الحظر"
"Force redirect. Target scheme and host for GET requests; * is supported in the host. Commonly used to force HTTPS, such as https://*:8081": "إعادة توجيه إجبارية. المخطط والمضيف الهدفان لطلبات GET؛ يُدعم * في المضيف. يُستخدم عادةً لفرض HTTPS، مثل https://*:8081"
"Security mode. 0: off; 1: observe and log only; 2: block; 3: automatic (default; observes, bans repeated attackers, and temporarily blocks broad attacks with automatic rollback)": "وضع الأمان. 0: إيقاف؛ 1: المراقبة والتسجيل فقط؛ 2: الحظر؛ 3: تلقائي (الافتراضي؛ يراقب ويحظر المهاجمين المتكررين ويحظر الهجمات الواسعة مؤقتًا مع تراجع تلقائي)"
"Auto-ban durations. Comma-separated seconds that increase with each trigger; empty uses 60,300,1800,7200,86400": "مدد الحظر التلقائي. ثوانٍ مفصولة بفواصل تزداد مع كل تفعيل؛ فارغ يستخدم 60,300,1800,7200,86400"
"Trusted proxies. Forwarded headers are only trusted from these comma-separated IPs or CIDR ranges; empty keeps the legacy behavior of trusting all forwarded headers": "وكلاء موثوقون. تُقبل رؤوس Forwarded فقط من عناوين IP أو نطاقات CIDR هذه المفصولة بفواصل؛ فارغ يحتفظ بالسلوك القديم بقبول جميع رؤوس Forwarded"
"Trusted proxy learning limit. When no trusted proxies are configured, private direct sources that send forwarded headers are learned up to this count; 0 disables learning (typically 2 for one data center, 4 for two)": "حد تعلم الوكلاء الموثوقين. عند عدم تكوين وكلاء موثوقين، تُتعلَّم المصادر المباشرة الخاصة التي ترسل رؤوس Forwarded حتى هذا العدد؛ 0 يعطّل التعلم (عادةً 2 لمركز بيانات واحد و4 لمركزين)"
"Learned proxies. Maintained automatically; clear it to reset the learned list": "الوكلاء المتعلّمون. تُصان تلقائيًا؛ امسحها لإعادة تعيين القائمة المتعلّمة"
"Default role. Defaults to the Normal User role": "الدور الافتراضي. الافتراضي هو دور المستخدم العادي"
"Allow password sign-in. Allows signing in with a username and password": "السماح بتسجيل الدخول بكلمة المرور. يسمح بتسجيل الدخول باسم المستخدم وكلمة المرور"
"Allow plain-text passwords. Default true for legacy clients; false forces Challenge-Response encrypted passwords": "السماح بكلمات المرور النصية. الافتراضي true للعملاء القديمة؛ false يفرض كلمات مرور مشفرة بنظام التحدي والاستجابة"
"Allow registration. Allows registering with a username and password": "السماح بالتسجيل. يسمح بالتسجيل باسم المستخدم وكلمة المرور"
"Auto registration. Default true; after SSO sign-in an unknown local user is registered automatically. Enabled when either the global or the OAuth app setting is on": "التسجيل التلقائي. الافتراضي true؛ بعد تسجيل الدخول عبر SSO يُسجَّل المستخدم المحلي غير المعروف تلقائيًا. يكون ممكّنًا عند تشغيل الإعداد العام أو إعداد تطبيق OAuth"
"Password complexity check. When enabled the sign-in page validates password strength; when disabled it only requires a non-empty password. Default true": "فحص تعقيد كلمة المرور. عند التمكين تتحقق صفحة تسجيل الدخول من قوة كلمة المرور؛ وعند التعطيل تكتفي بكلمة مرور غير فارغة. الافتراضي true"
"Login failure limit. Bans sign-in after this many consecutive failures for the same user or IP, default 5": "حد فشل تسجيل الدخول. يحظر تسجيل الدخول بعد هذا العدد من حالات الفشل المتتالية للمستخدم أو عنوان IP نفسه، الافتراضي 5"
"Login ban duration. Seconds a risk-control ban lasts, default 300": "مدة حظر تسجيل الدخول. عدد الثواني التي يستمر فيها حظر مكافحة المخاطر، الافتراضي 300"
"Class C subnet ban threshold. Bans a /24 subnet such as 103.125.146.* after this many failures, default 10; 0 disables": "حد حظر الشبكة الفرعية من الفئة C. يحظر شبكة فرعية /24 مثل 103.125.146.* بعد هذا العدد من حالات الفشل، الافتراضي 10؛ 0 يعطّل"
"Class B subnet ban threshold. Bans a /16 subnet such as 103.125.*.* after this many failures, default 20; 0 disables": "حد حظر الشبكة الفرعية من الفئة B. يحظر شبكة فرعية /16 مثل 103.125.*.* بعد هذا العدد من حالات الفشل، الافتراضي 20؛ 0 يعطّل"
"Force bind by user name. Binds SSO users to local users with the same name without a provider prefix; intended for user centers": "الربط الإجباري باسم المستخدم. يربط مستخدمي SSO بالمستخدمين المحليين بالاسم نفسه دون بادئة المزوّد؛ مخصص لمراكز المستخدمين"
"Bind by user code. Binds SSO users to local users by user code": "الربط برمز المستخدم. يربط مستخدمي SSO بالمستخدمين المحليين برمز المستخدم"
"Bind by mobile. Binds SSO users to local users by mobile number": "الربط بالجوال. يربط مستخدمي SSO بالمستخدمين المحليين برقم الجوال"
"Bind by email. Binds SSO users to local users by email": "الربط بالبريد الإلكتروني. يربط مستخدمي SSO بالمستخدمين المحليين بالبريد الإلكتروني"
"Bind by nickname. Binds SSO users to local users by nickname; suitable for internal SSO, not for social networks with many duplicate names": "الربط بالاسم المستعار. يربط مستخدمي SSO بالمستخدمين المحليين بالاسم المستعار؛ مناسب لـ SSO الداخلي، وليس لشبكات التواصل ذات الأسماء المكررة الكثيرة"
"Use SSO roles. Keeps SSO roles after sign-in, default true; otherwise DefaultRole is used": "استخدام أدوار SSO. يحتفظ بأدوار SSO بعد تسجيل الدخول، الافتراضي true؛ وإلا يُستخدم DefaultRole"
"Use SSO departments. Keeps SSO departments after sign-in, default true": "استخدام أقسام SSO. يحتفظ بأقسام SSO بعد تسجيل الدخول، الافتراضي true"
"SSO role rules. Automatically upgrades the primary role after SSO sign-in; separate rules with commas. Format: source role+department wildcard=target role, for example Guest+Route*=Route Specialist": "قواعد أدوار SSO. ترقّي الدور الأساسي تلقائيًا بعد تسجيل الدخول عبر SSO؛ افصل القواعد بفواصل. التنسيق: الدور المصدر+قسم بعلامة بدل=الدور الهدف، مثل Guest+Route*=Route Specialist"
"Sign out everywhere. false signs out of this site only; true (default) also signs out of the SSO server": "تسجيل الخروج من كل مكان. false يسجّل الخروج من هذا الموقع فقط؛ true (الافتراضي) يسجّل الخروج من خادم SSO أيضًا"
"Allow multi-device sign-in. false kicks old devices on a new sign-in and revokes all tokens on sign-out; true (default) revokes only the current session": "السماح بتسجيل الدخول من أجهزة متعددة. false يطرد الأجهزة القديمة عند تسجيل دخول جديد ويبطل جميع الرموز عند تسجيل الخروج؛ true (الافتراضي) يبطل الجلسة الحالية فقط"
"Session timeout. Session lifetime after SSO sign-in during which the cookie can sign in again; default 0s": "مهلة الجلسة. عمر الجلسة بعد تسجيل الدخول عبر SSO والذي يمكن خلاله لملف تعريف الارتباط تسجيل الدخول مجددًا؛ الافتراضي 0 ثانية"
"Token sliding refresh threshold. Refreshes the JWT and rewrites the cookie when its remaining lifetime falls below this many seconds; 0 disables sliding expiration": "حد التحديث الانزلاقي للرمز. يجدّد JWT ويعيد كتابة ملف تعريف الارتباط عندما تقل مدة صلاحيته المتبقية عن هذا العدد من الثواني؛ 0 يعطّل الانتهاء الانزلاقي"
"User refresh period. Fetches user information once per period across SSO sign-ins, default 600 seconds": "فترة تحديث المستخدم. يجلب معلومات المستخدم مرة واحدة في كل فترة عبر عمليات تسجيل الدخول بـ SSO، الافتراضي 600 ثانية"
"JWT secret. Algorithm and key used to sign JWTs, such as HS256:ABCD1234": "سر JWT. الخوارزمية والمفتاح المستخدمان لتوقيع JWT، مثل HS256:ABCD1234"
"Token lifetime. Lifetime of the access token in seconds, default 7200": "عمر الرمز. مدة صلاحية رمز الوصول بالثواني، الافتراضي 7200"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default true": "تخزين الرمز في ملف تعريف الارتباط. يقرأ الرمز من ملف تعريف الارتباط عندما لا يحمله رأس الطلب، الافتراضي true"
"Validate attachment access. Requires sign-in to access attachments, default true": "التحقق من الوصول إلى المرفقات. يتطلب تسجيل الدخول للوصول إلى المرفقات، الافتراضي true"
"Public attachment categories. Categories accessible without sign-in, comma-separated, such as markdown,avatar. Applies when ValidateAttachment is true": "فئات المرفقات العامة. فئات يمكن الوصول إليها دون تسجيل الدخول، مفصولة بفواصل، مثل markdown,avatar. تُطبَّق عندما تكون ValidateAttachment بقيمة true"
"Private attachment categories. Categories only the uploader can access, comma-separated. Applies when ValidateAttachment is true": "فئات المرفقات الخاصة. فئات لا يمكن الوصول إليها إلا للرافع، مفصولة بفواصل. تُطبَّق عندما تكون ValidateAttachment بقيمة true"
"SSO redirect allowlist. Domains allowed to receive the JWT after sign-in, comma-separated with wildcard prefixes such as *.company.com. Empty allows the same site only; other origins are rejected and sent back to the home page": "قائمة إعادة توجيه SSO المسموح بها. النطاقات المسموح لها باستلام JWT بعد تسجيل الدخول، مفصولة بفواصل مع بادئات بدل مثل *.company.com. فارغ يسمح بالموقع نفسه فقط؛ تُرفض الأصول الأخرى وتُعاد إلى الصفحة الرئيسية"
"External authentication URL. When local authentication fails, credentials are verified by this endpoint; on success the local user is created or updated and signed in": "عنوان URL للمصادقة الخارجية. عند فشل المصادقة المحلية تُتحقق بيانات الاعتماد عبر هذه النقطة الطرفية؛ وعند النجاح يُنشأ المستخدم المحلي أو يُحدَّث ويُسجَّل دخوله"
"Start page. First content page opened after entering the admin console": "الصفحة الأولى. أول صفحة محتوى تُفتح بعد دخول وحدة تحكم الإدارة"
"Theme. Content page theme, ACE/layui": "السمة. سمة صفحة المحتوى، ACE/layui"
"Skin. Outer frame layout, ACE/layui": "المظهر. تخطيط الإطار الخارجي، ACE/layui"
"Login tip. Empty hides the tip on the sign-in page": "تلميح تسجيل الدخول. فارغ يخفي التلميح في صفحة تسجيل الدخول"
"Login logo. Empty uses the default logo": "شعار تسجيل الدخول. فارغ يستخدم الشعار الافتراضي"
"Login background. Image URL; empty uses the default background": "خلفية تسجيل الدخول. عنوان URL للصورة؛ فارغ يستخدم الخلفية الافتراضية"
"Form group layout. 3/2/1 columns on large/medium/small screens, form-group col-xs-12 col-sm-6 col-lg-4": "تخطيط مجموعة النموذج. 3/2/1 أعمدة على الشاشات الكبيرة/المتوسطة/الصغيرة، form-group col-xs-12 col-sm-6 col-lg-4"
"Bootstrap select. Nicer drop-downs with a rendering cost": "Bootstrap select. قوائم منسدلة أجمل بتكلفة في الأداء"
"Maximum drop-down items. Maximum options in a related drop-down on forms, default 50; larger lists fall back to a text box": "الحد الأقصى لعناصر القائمة المنسدلة. الحد الأقصى للخيارات في القائمة المنسدلة المرتبطة في النماذج، الافتراضي 50؛ القوائم الأكبر ترجع إلى مربع نص"
"Copyright. Empty hides the copyright; variables now/runtime/framework are supported, and now accepts formats such as {now:yyyy}": "حقوق النشر. فارغ يخفي حقوق النشر؛ المتغيرات now/runtime/framework مدعومة، وnow تقبل تنسيقات مثل {now:yyyy}"
"Filing number. Empty hides the filing information": "رقم التسجيل. فارغ يخفي معلومات التسجيل"
"Enable new UI": "تمكين الواجهة الجديدة"
"ECharts theme. Chart theme": "سمة ECharts. سمة المخطط"
"Title suffix. Appends the system name to page titles, default true": "لاحقة العنوان. تُلحق اسم النظام بعناوين الصفحات، الافتراضي true"
"Table double-click. Enables row double-click on list pages, default true": "النقر المزدوج على الجدول. يمكّن النقر المزدوج على الصفوف في صفحات القوائم، الافتراضي true"
"Table style. Light: minimal thin lines; Standard: clear row lines (default); Grid: full cell borders": "نمط الجدول. فاتح: خطوط رفيعة بسيطة؛ قياسي: خطوط صفوف واضحة (الافتراضي)؛ شبكة: حدود خلايا كاملة"
"Table density. Compact: dense and information-rich (default); Normal: relaxed": "كثافة الجدول. مضغوط: كثيف وغني بالمعلومات (الافتراضي)؛ عادي: واسع"
"Stardust web. Stardust console URL; supports direct links to /trace?id={traceId} or /graph?id={traceId}": "Stardust web. عنوان URL لوحدة تحكم Stardust؛ يدعم الروابط المباشرة إلى /trace?id={traceId} أو /graph?id={traceId}"
"AI master switch. Enables AI features such as log analysis and notification polishing, default false": "المفتاح الرئيسي للذكاء الاصطناعي. يمكّن ميزات الذكاء الاصطناعي مثل تحليل السجلات وتحسين الإشعارات، الافتراضي false"
"AI provider. Supports NewLife, Ollama, DeepSeek, DashScope, OpenAI and others; default NewLife": "مزوّد الذكاء الاصطناعي. يدعم NewLife وOllama وDeepSeek وDashScope وOpenAI وغيرها؛ الافتراضي NewLife"
"AI endpoint. Defaults to https://ai.newlifex.com for NewLife": "نقطة نهاية الذكاء الاصطناعي. الافتراضي https://ai.newlifex.com لـ NewLife"
"AI ApiKey. Defaults to sk-CubeAI2026 for NewLife": "ApiKey للذكاء الاصطناعي. الافتراضي sk-CubeAI2026 لـ NewLife"
"AI default model. Defaults to newlife-flash for NewLife": "النموذج الافتراضي للذكاء الاصطناعي. الافتراضي newlife-flash لـ NewLife"
"AI default deep reasoning. Enables think mode for analysis and chat by default; false means fast responses": "التفكير العميق الافتراضي للذكاء الاصطناعي. يمكّن وضع التفكير للتحليل والدردشة افتراضيًا؛ false يعني ردودًا سريعة"
"AI color scheme. Fills the primary and secondary colors from a preset": "مخطط ألوان الذكاء الاصطناعي. يملأ اللونين الأساسي والثانوي من إعداد مسبق"
"AI primary color. Main color of the launcher, panel header and user bubbles; default NewLife green #2ecc71": "اللون الأساسي للذكاء الاصطناعي. اللون الرئيسي للمشغّل ورأس اللوحة وفقاعات المستخدم؛ الافتراضي أخضر NewLife #2ecc71"
"AI secondary color. Gradient end color, default dark green #1e8e3e": "اللون الثانوي للذكاء الاصطناعي. لون نهاية التدرج، الافتراضي أخضر داكن #1e8e3e"
"OAuth server. Enables the OAuth 2.0 server that provides SSO for other applications": "خادم OAuth. يمكّن خادم OAuth 2.0 الذي يوفر SSO لتطبيقات أخرى"
"File manager. Enables backend file management (browse, upload, download, delete); this carries security risks": "مدير الملفات. يمكّن إدارة الملفات في الخلفية (تصفح، رفع، تنزيل، حذف)؛ يحمل ذلك مخاطر أمنية"
"Multi-tenancy. Enables tenants; tenant mode cannot access system administration and platform mode cannot access tenant pages": "تعدد المستأجرين. يمكّن المستأجرين؛ وضع المستأجر لا يمكنه الوصول إلى إدارة النظام ووضع المنصة لا يمكنه الوصول إلى صفحات المستأجرين"
"Tenant query policy. DenyWithEmpty: return an empty set without tenant context; ThrowOnMissingTenant: throw an explicit error": "سياسة استعلام المستأجر. DenyWithEmpty: إرجاع مجموعة فارغة دون سياق مستأجر؛ ThrowOnMissingTenant: طرح خطأ صريح"
"User online. 0: do not record; 1: signed-in users only; 2: all visitors (default)": "المستخدمون المتصلون. 0: لا تُسجّل؛ 1: المستخدمون المسجلون فقط؛ 2: جميع الزوار (الافتراضي)"
"User statistics. Records user visits, default true": "إحصاءات المستخدمين. تسجّل زيارات المستخدمين، الافتراضي true"
"Enable SMS. SMS verification codes and system notifications, default false": "تمكين SMS. التحقق عبر SMS"
"Enable email. Email verification codes and system notifications, default false": "تمكين البريد الإلكتروني. رموز التحقق عبر البريد الإلكتروني وإشعارات النظام، الافتراضي false"
"Require email verification. Users must activate their email before signing in and must provide one when registering, default false": "اشتراط التحقق بالبريد الإلكتروني. يجب على المستخدمين تنشيط بريدهم قبل تسجيل الدخول وتقديم بريد عند التسجيل، الافتراضي false"
"Require mobile verification. Users must activate their mobile before signing in and must provide one when registering, default false": "اشتراط التحقق بالجوال. يجب على المستخدمين تنشيط جوالهم قبل تسجيل الدخول وتقديم رقم جوال عند التسجيل، الافتراضي false"
"Captcha scenarios. Bit mask: 0: off; 1: sign-in; 2: registration; 4: verification code requests (anti-SMS-bombing); combine with 3 for sign-in and registration. Mandatory scenarios are never exempted, default 0": "سيناريوهات رمز التحقق المرئي. قناع بت: 0: إيقاف؛ 1: تسجيل الدخول؛ 2: التسجيل؛ 4: طلبات رمز التحقق (مكافحة القصف بالرسائل النصية)؛ اجمع مع 3 لتسجيل الدخول والتسجيل. السيناريوهات الإلزامية لا تُعفى أبدًا، الافتراضي 0"
"Risk-adaptive captcha. Disabled when CaptchaScene is 0; when enabled it detects unsafe environments and requires a captcha, default true": "رمز التحقق المرئي التكيفي بالمخاطر. معطّل عندما تكون CaptchaScene بقيمة 0؛ عند التمكين يكتشف البيئات غير الآمنة ويطلب رمز تحقق مرئي، الافتراضي true"
"Captcha risk threshold. Requires a captcha when the risk score reaches this value: 0: intranet; 1: internet; 2: internet with recent failures; 3: banned. Default 2": "حد مخاطر رمز التحقق المرئي. يتطلب رمز تحقق مرئي عندما تبلغ درجة المخاطر هذه القيمة: 0: الشبكة الداخلية؛ 1: الإنترنت؛ 2: الإنترنت مع إخفاقات حديثة؛ 3: محظور. الافتراضي 2"
"Trusted device lifetime. Days during which previously successful devices skip adaptive captchas, default 30": "عمر الجهاز الموثوق. عدد الأيام التي تتخطى فيها الأجهزة التي نجحت سابقًا رموز التحقق المرئي التكيفية، الافتراضي 30"
"Enable MFA. Allows users to enable TOTP multi-factor authentication; an enhanced feature, default false": "تمكين MFA. يسمح للمستخدمين بتمكين المصادقة متعددة العوامل TOTP؛ ميزة متقدمة، الافتراضي false"
"File storage serving. Responds to file download requests from other nodes, default true": "خدمة تخزين الملفات. تستجيب لطلبات تنزيل الملفات من العقد الأخرى، الافتراضي true"
"File storage fetch. Pulls new files published by other nodes, default true": "جلب تخزين الملفات. يسحب الملفات الجديدة المنشورة من العقد الأخرى، الافتراضي true"
"File fetch timeout. Maximum milliseconds to wait for other nodes when a file is missing locally, default 5000": "مهلة جلب الملفات. الحد الأقصى للملي ثانية لانتظار العقد الأخرى عند فقدان ملف محليًا، الافتراضي 5000"
"Attachment storage. Local disk, Oss (Alibaba Cloud), Cos (Tencent Cloud), Qiniu or EasyIO; default Local": "تخزين المرفقات. قرص محلي، Oss (Alibaba Cloud)، Cos (Tencent Cloud)، Qiniu أو EasyIO؛ الافتراضي Local"
"Object storage server. S3-compatible endpoint for OSS/COS/Qiniu, such as oss-cn-beijing.aliyuncs.com": "خادم تخزين الكائنات. نقطة نهاية متوافقة مع S3 لـ OSS/COS/Qiniu، مثل oss-cn-beijing.aliyuncs.com"
"Object storage bucket. Bucket name for OSS/COS/Qiniu": "حاوية تخزين الكائنات. اسم الحاوية لـ OSS/COS/Qiniu"
"Object storage region. S3 signing scope, such as cn-beijing / ap-beijing / cn-east-1": "منطقة تخزين الكائنات. نطاق توقيع S3، مثل cn-beijing / ap-beijing / cn-east-1"
"Object storage app ID. AccessKeyId": "معرّف تطبيق تخزين الكائنات. AccessKeyId"
"Object storage app secret. AccessKeySecret": "سر تطبيق تخزين الكائنات. AccessKeySecret"
"Data retention. Days to keep audit and OAuth logs, default 30": "الاحتفاظ بالبيانات. عدد الأيام للاحتفاظ بسجلات التدقيق وOAuth، الافتراضي 30"
"File retention. Days to keep backup files, default 15": "الاحتفاظ بالملفات. عدد الأيام للاحتفاظ بملفات النسخ الاحتياطي، الافتراضي 15"
"Retention size floor. Files smaller than this (KB) are never deleted even after the retention period, default 1024K": "الحد الأدنى لحجم الاحتفاظ. الملفات الأصغر من ذلك (كيلوبايت) لا تُحذف أبدًا حتى بعد فترة الاحتفاظ، الافتراضي 1024K"
"Maximum export rows. Maximum rows a page may export, default 10_000_000": "الحد الأقصى لصفوف التصدير. الحد الأقصى للصفوف التي يمكن للصفحة تصديرها، الافتراضي 10_000_000"
"Maximum backup rows. Maximum rows a page may back up, default 10_000_000": "الحد الأقصى لصفوف النسخ الاحتياطي. الحد الأقصى للصفوف التي يمكن للصفحة نسخها احتياطيًا، الافتراضي 10_000_000"
"API prefixes. Comma- or semicolon-separated prefixes such as /api,/api/v1; matching requests are forwarded to the real route without the prefix": "بادئات API. بادئات مفصولة بفواصل أو فواصل منقوطة مثل /api,/api/v1؛ تُمرَّر الطلبات المطابقة إلى المسار الحقيقي دون البادئة"
"Password strength. * means unrestricted; by default at least 8 characters with digits, upper/lower case letters and symbols. Simple form: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$": "قوة كلمة المرور. * تعني بلا قيود؛ افتراضيًا 8 أحرف على الأقل مع أرقام وحروف كبيرة/صغيرة ورموز. الصيغة المبسطة: ^(?=.*\\d.*)(?=.*[a-zA-Z].*).{6,32}$"
"Cookie mode. Default SameSite mode for token cookies (-1 Unspecified, 0 None, 1 Lax, 2 Strict)": "وضع ملف تعريف الارتباط. وضع SameSite الافتراضي لملفات تعريف ارتباط الرموز (-1 Unspecified، 0 None، 1 Lax، 2 Strict)"
"Cookie domain. Writes cookies to a parent domain; empty uses the current domain. A top-level domain requires HTTPS and prevents plain HTTP from writing same-name keys on the local domain": "نطاق ملف تعريف الارتباط. يكتب ملفات تعريف الارتباط في نطاق أب؛ فارغ يستخدم النطاق الحالي. النطاق الأعلى يتطلب HTTPS ويمنع HTTP العادي من كتابة مفاتيح بالاسم نفسه على النطاق المحلي"
"Activation URL. Front-end activation page URL used in email activation links, such as https://xxx/activate; empty builds /activate from the request host": "عنوان URL للتنشيط. عنوان URL لصفحة التنشيط في الواجهة الأمامية المستخدم في روابط تنشيط البريد الإلكتروني، مثل https://xxx/activate؛ فارغ يبني /activate من مضيف الطلب"
"Store token in cookie. Reads the token from the cookie when the request header does not carry one, default false": "تخزين الرمز في ملف تعريف الارتباط. يقرأ الرمز من ملف تعريف الارتباط عندما لا يحمله رأس الطلب، الافتراضي false"
"Password strength. * means unrestricted; the simple form defaults to 5 to 32 characters of any type. The full form requires at least 8 characters with digits, upper/lower case letters and symbols: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$": "قوة كلمة المرور. * تعني بلا قيود؛ الصيغة المبسطة افتراضيًا من 5 إلى 32 حرفًا من أي نوع. تتطلب الصيغة الكاملة 8 أحرف على الأقل مع أرقام وحروف كبيرة/صغيرة ورموز: ^(?=.*\\d.*)(?=.*[a-z].*)(?=.*[A-Z].*)(?=.*[^(0-9a-zA-Z)].*).{8,32}$"
