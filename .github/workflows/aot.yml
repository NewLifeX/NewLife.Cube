name: aot

on:
  push:
    branches: [ '*' ]
    paths:
      - 'AotSmoke/**'
      - 'NewLife.Cube/**'
      - 'NewLife.CubeNC/**'
      - '.github/workflows/aot.yml'
  pull_request:
    branches: [ '*' ]
    paths:
      - 'AotSmoke/**'
      - 'NewLife.Cube/**'
      - 'NewLife.CubeNC/**'
      - '.github/workflows/aot.yml'
  workflow_dispatch:

jobs:
  # 冒烟工程自身保持 AOT/裁剪分析器零告警（库本身的动态边界见 Doc/AOT兼容性分析.md）
  analyzer:
    name: aot analyzer (smoke)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
        cache: true
        cache-dependency-path: '**/*.csproj'
    - name: Analyzer check
      run: dotnet build AotSmoke/AotSmoke.csproj -c Release -warnaserror:IL2026,IL2067,IL2070,IL2072,IL2075,IL2087,IL2090,IL2091,IL3000,IL3050

  # NativeAOT 官方不支持跨 OS 编译，每个 RID 使用原生 runner 发布并运行。
  # 覆盖分层：win-x64 / linux-x64 为阻断门禁；linux-arm64、win-arm64、macOS 双架构、musl（x64/arm64）
  # 与 win-x86 为观察期（continue-on-error），稳定全绿后逐项转阻断。
  # LA64 / riscv64 官方无 NativeAOT 后端，只在 test.yml 做 JIT 指令集冒烟（见 Doc/AOT兼容性分析.md §6）。
  smoke:
    name: aot (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            bin: AotSmoke.exe
          - rid: linux-x64
            os: ubuntu-latest
            bin: AotSmoke
          - rid: win-arm64
            os: windows-11-arm
            bin: AotSmoke.exe
            experimental: true
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            bin: AotSmoke
            experimental: true
          - rid: osx-arm64
            os: macos-latest
            bin: AotSmoke
            experimental: true
          - rid: osx-x64
            os: macos-15-intel
            bin: AotSmoke
            experimental: true

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
        cache: true
        cache-dependency-path: '**/*.csproj'
    - name: Install NativeAOT prerequisites (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
    - name: JIT baseline
      run: dotnet run -c Release --project AotSmoke/AotSmoke.csproj
    - name: Publish NativeAOT
      run: dotnet publish AotSmoke/AotSmoke.csproj -c Release -r ${{ matrix.rid }} -o AotSmoke/bin/aot-out
    - name: Run NativeAOT
      shell: bash
      run: ./AotSmoke/bin/aot-out/${{ matrix.bin }}

  # NativeAOT（musl）：alpine 容器内原生发布运行，验证 glibc 之外的 C 运行时（Alpine/Docker 基础镜像常见）。
  # 容器内 actions/setup-dotnet 不可用，改用 dotnet-install.sh；官方要求 alpine 3.15+ 且安装 clang/build-base/zlib-dev。
  smoke-musl:
    name: aot (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-musl-x64
            os: ubuntu-latest
          - rid: linux-musl-arm64
            os: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v4
    - name: JIT baseline + Publish + Run NativeAOT (alpine)
      run: |
        docker run --rm -v "$PWD:/src" -w /src alpine:3.20 sh -c '
          set -e
          apk add --no-cache bash curl clang build-base zlib-dev icu-libs >/dev/null
          curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel 10.0 --install-dir /usr/share/dotnet >/dev/null
          ln -s /usr/share/dotnet/dotnet /usr/bin/dotnet
          export DOTNET_CLI_TELEMETRY_OPTOUT=1
          dotnet run -c Release --project AotSmoke/AotSmoke.csproj
          dotnet publish AotSmoke/AotSmoke.csproj -c Release -r ${{ matrix.rid }} -o AotSmoke/bin/aot-out
          ./AotSmoke/bin/aot-out/AotSmoke
        '

  # Windows x86（32 位）：官方 NativeAOT 目标，windows-latest 交叉发布后经 WoW64 直接运行（观察期容错）。
  # 32 位宿主没有托管 runner，单元测试仍在 x64/arm64 覆盖，这里只验证冒烟件在 x86 指令集下可发布可运行。
  win-x86:
    name: aot (win-x86)
    runs-on: windows-latest
    timeout-minutes: 40
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
        cache: true
        cache-dependency-path: '**/*.csproj'
    - name: Publish NativeAOT (win-x86)
      run: dotnet publish AotSmoke/AotSmoke.csproj -c Release -r win-x86 -o AotSmoke/bin/aot-out
    - name: Run NativeAOT (win-x86)
      run: AotSmoke/bin/aot-out/AotSmoke.exe
