name: publish-npm

on:
  push:
    tags: [ 'v*' ]            # 稳定版：打 v* 标签触发（与 .NET publish.yml 共享标签）
    branches: [ master ]      # 预发布：master 上公共包变更触发
    paths:
      - 'packages/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

jobs:
  build-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # npm Trusted Publishing（OIDC）签发短时发布令牌
      packages: write

    steps:
    - uses: actions/checkout@v4

    - uses: pnpm/action-setup@v4
      with:
        version: 9.15.0

    # 不配 registry-url：否则 setup-node 会写 //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}，
    # 未设该变量时 npm 会报 Failed to replace env in config；OIDC 发布不需要任何 token
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install
      run: pnpm install --frozen-lockfile

    # 单测直接 require ../dist/index.cjs，dist 不入库，必须显式构建，不依赖 pretest 隐式行为
    - name: Build
      run: pnpm -r --filter @newlifex/cube build

    - name: Test
      run: pnpm -r --filter @newlifex/cube test

    - name: Compute dist-tag
      id: npm-tag
      run: |
        if [ "${{ github.ref }}" = "refs/heads/master" ]; then
          echo "dist-tag=beta" >> "$GITHUB_OUTPUT"
        else
          echo "dist-tag=latest" >> "$GITHUB_OUTPUT"
        fi

    - name: Set beta version
      if: steps.npm-tag.outputs.dist-tag == 'beta'
      run: node scripts/set-beta-version.mjs

    # 发 npmjs.org：Trusted Publishing（OIDC），npm 校验仓库 + workflow 后签发短时令牌，无需 NPM_TOKEN
    # 前置：npm 包 Settings → Trusted Publisher 指向 NewLifeX/NewLife.Cube 的 publish-npm.yml，并授予 npm publish
    # 首次需在配置过期前发一次以完成 Pending validation
    - name: Publish to npmjs.org
      working-directory: packages/cube
      run: npm publish --provenance --tag ${{ steps.npm-tag.outputs.dist-tag }}

    # 发 GitHub Packages：scope @newlifex 匹配组织 NewLifeX，用 GITHUB_TOKEN
    # 认证用 npm config set 写用户级 .npmrc；token 取 github.token（secrets.GITHUB_TOKEN 在该步骤可能为空，
    # 空 token 会直接报 ENEEDAUTH need auth ... npm.pkg.github.com）
    - name: Publish to GitHub Packages
      run: |
        npm config set //npm.pkg.github.com/:_authToken "${NODE_AUTH_TOKEN}" --location user
        npm whoami --registry https://npm.pkg.github.com
        pnpm -r --filter './packages/*' publish --no-git-checks --tag ${{ steps.npm-tag.outputs.dist-tag }} --registry https://npm.pkg.github.com
      env:
        NODE_AUTH_TOKEN: ${{ github.token }}
